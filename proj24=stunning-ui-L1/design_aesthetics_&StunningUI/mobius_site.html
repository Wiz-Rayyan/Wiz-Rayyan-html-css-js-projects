
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  #mobius-root {
    font-family: var(--font-sans);
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    height: 520px;
    overflow: hidden;
    position: relative;
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    cursor: ns-resize;
    user-select: none;
  }
  .m-nav {
    position: absolute;
    left: 0; right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2rem;
    height: 52px;
    border-bottom: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-primary);
    font-size: 13px;
    color: var(--color-text-secondary);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .m-nav.top { top: 0; border-bottom: 0.5px solid var(--color-border-tertiary); border-top: none; }
  .m-nav.bottom {
    bottom: 0; top: auto;
    border-top: 0.5px solid var(--color-border-tertiary);
    border-bottom: none;
    transform: rotateX(180deg);
  }
  .m-nav-links { display: flex; gap: 2rem; }
  .m-nav-link { color: var(--color-text-secondary); text-decoration: none; font-size: 12px; letter-spacing: 0.06em; cursor: pointer; transition: color 0.2s; }
  .m-nav-link:hover { color: var(--color-text-primary); }
  .m-logo { font-weight: 500; font-size: 14px; color: var(--color-text-primary); letter-spacing: 0.1em; }
  .m-scroll-track {
    position: absolute;
    left: 0; right: 0;
    top: 52px;
    bottom: 52px;
    overflow: hidden;
  }
  .m-scroll-inner {
    position: absolute;
    left: 0; right: 0;
    top: 0;
    will-change: transform;
  }
  .m-section {
    height: 416px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 4rem;
    border-bottom: 0.5px solid var(--color-border-tertiary);
    position: relative;
  }
  .m-section-label {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-text-tertiary);
    margin-bottom: 1.5rem;
  }
  .m-section-title {
    font-size: 32px;
    font-weight: 500;
    text-align: center;
    line-height: 1.25;
    margin-bottom: 1rem;
    color: var(--color-text-primary);
  }
  .m-section-body {
    font-size: 15px;
    color: var(--color-text-secondary);
    text-align: center;
    max-width: 420px;
    line-height: 1.7;
  }
  .m-badge {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 12px;
    border: 0.5px solid var(--color-border-secondary);
    border-radius: 100px;
    color: var(--color-text-secondary);
    margin-bottom: 1.5rem;
  }
  .m-scroll-hint {
    position: absolute;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--color-text-tertiary);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
    animation: fadeHint 3s ease-in-out infinite;
  }
  @keyframes fadeHint { 0%,100%{opacity:.4} 50%{opacity:1} }
  .m-twist-indicator {
    position: absolute;
    right: 1.5rem;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .m-twist-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--color-border-secondary);
    transition: background 0.3s;
  }
  .m-twist-dot.active { background: var(--color-text-secondary); }
  .m-surface-label {
    position: absolute;
    right: 1.5rem;
    bottom: 1.5rem;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--color-text-tertiary);
  }
  .m-loop-badge {
    position: absolute;
    top: 50%;
    left: 1.5rem;
    transform: translateY(-50%);
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--color-text-tertiary);
  }
</style>

<div id="mobius-root" aria-label="Möbius website concept — infinite scroll loops back to the same content">
  <nav class="m-nav top">
    <span class="m-logo">Möbius</span>
    <div class="m-nav-links">
      <span class="m-nav-link">Surface</span>
      <span class="m-nav-link">Loop</span>
      <span class="m-nav-link">Topology</span>
    </div>
    <span style="font-size:11px;letter-spacing:0.08em;color:var(--color-text-tertiary);text-transform:uppercase;">One side only</span>
  </nav>

  <div class="m-scroll-track" id="track">
    <div class="m-scroll-inner" id="inner">
    </div>
  </div>

  <nav class="m-nav bottom">
    <span class="m-logo">Möbius</span>
    <div class="m-nav-links">
      <span class="m-nav-link">Surface</span>
      <span class="m-nav-link">Loop</span>
      <span class="m-nav-link">Topology</span>
    </div>
    <span style="font-size:11px;letter-spacing:0.08em;color:var(--color-text-tertiary);text-transform:uppercase;">One side only</span>
  </nav>

  <div class="m-twist-indicator" id="dots"></div>
</div>

<script>
const sections = [
  {
    label: "01 — Beginning",
    title: "There is no front.",
    body: "A Möbius strip has only one side. Walk its surface and you return to where you started — having crossed what felt like two sides, but was always one.",
    badge: "Surface A"
  },
  {
    label: "02 — Middle",
    title: "There is no back.",
    body: "The page you are reading now is the same page as the one you have not yet reached. Scroll down and you will find yourself here again.",
    badge: "Surface A"
  },
  {
    label: "03 — End",
    title: "There is no end.",
    body: "Topology is the study of properties that survive deformation. A loop. A twist. A surface with a single side and a single edge.",
    badge: "Surface A"
  }
];

const track = document.getElementById('track');
const inner = document.getElementById('inner');
const dotsEl = document.getElementById('dots');
const SECTION_H = 416;
const N = sections.length;
const TOTAL = SECTION_H * N;

function buildSections(arr) {
  return arr.map((s, i) => {
    const d = document.createElement('div');
    d.className = 'm-section';
    d.innerHTML = `
      <span class="m-badge">${s.badge}</span>
      <p class="m-section-label">${s.label}</p>
      <h2 class="m-section-title">${s.title}</h2>
      <p class="m-section-body">${s.body}</p>
      ${i === arr.length - 1 ? `<p class="m-scroll-hint"><i class="ti ti-arrow-down" aria-hidden="true"></i> returns to start</p>` : `<p class="m-scroll-hint"><i class="ti ti-arrow-down" aria-hidden="true"></i> scroll</p>`}
      <span class="m-loop-badge">One surface</span>
      <span class="m-surface-label">§${i+1} / ${N}</span>
    `;
    return d;
  });
}

const before = buildSections(sections);
const main   = buildSections(sections);
const after  = buildSections(sections);

[...before, ...main, ...after].forEach(el => inner.appendChild(el));

for (let i = 0; i < N; i++) {
  const d = document.createElement('div');
  d.className = 'm-twist-dot';
  dotsEl.appendChild(d);
}

let offset = TOTAL;
let velocity = 0;
let dragging = false;
let lastY = 0;
let rafId;
let lastTimestamp = 0;
let currentSection = 0;

function wrap(v) {
  const min = TOTAL, max = 2 * TOTAL;
  while (v < min) v += TOTAL;
  while (v >= max) v -= TOTAL;
  return v;
}

function render() {
  inner.style.transform = `translateY(-${offset}px)`;
  const sec = Math.round((offset - TOTAL) / SECTION_H) % N;
  const s = ((sec % N) + N) % N;
  if (s !== currentSection) {
    currentSection = s;
    dotsEl.querySelectorAll('.m-twist-dot').forEach((d, i) => d.classList.toggle('active', i === s));
  }
}

function loop(ts) {
  if (!dragging) {
    const dt = Math.min((ts - lastTimestamp) / 16, 3);
    lastTimestamp = ts;
    velocity *= Math.pow(0.88, dt);
    if (Math.abs(velocity) > 0.05) {
      offset = wrap(offset + velocity * dt);
      render();
    }
  }
  rafId = requestAnimationFrame(loop);
}

render();
dotsEl.querySelectorAll('.m-twist-dot')[0].classList.add('active');
requestAnimationFrame(ts => { lastTimestamp = ts; loop(ts); });

const root = document.getElementById('mobius-root');

root.addEventListener('mousedown', e => {
  dragging = true;
  lastY = e.clientY;
  velocity = 0;
  e.preventDefault();
});

window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dy = e.clientY - lastY;
  velocity = -dy * 0.6;
  offset = wrap(offset - dy);
  lastY = e.clientY;
  render();
});

window.addEventListener('mouseup', () => { dragging = false; });

root.addEventListener('touchstart', e => {
  dragging = true;
  lastY = e.touches[0].clientY;
  velocity = 0;
}, { passive: true });

root.addEventListener('touchmove', e => {
  if (!dragging) return;
  const dy = e.touches[0].clientY - lastY;
  velocity = -dy * 0.5;
  offset = wrap(offset - dy);
  lastY = e.touches[0].clientY;
  render();
}, { passive: true });

root.addEventListener('touchend', () => { dragging = false; });

root.addEventListener('wheel', e => {
  e.preventDefault();
  velocity += e.deltaY * 0.25;
  velocity = Math.max(-28, Math.min(28, velocity));
}, { passive: false });
</script>
