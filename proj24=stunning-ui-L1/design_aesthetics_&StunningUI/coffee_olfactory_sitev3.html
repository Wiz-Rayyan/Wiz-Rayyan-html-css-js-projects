
<style>
  @keyframes rise1 { 0%{transform:translateY(0) scaleX(1);opacity:0.7} 100%{transform:translateY(-80px) scaleX(1.6);opacity:0} }
  @keyframes rise2 { 0%{transform:translateY(0) scaleX(1);opacity:0.5} 100%{transform:translateY(-70px) scaleX(1.8);opacity:0} }
  @keyframes rise3 { 0%{transform:translateY(0) scaleX(1);opacity:0.6} 100%{transform:translateY(-90px) scaleX(1.4);opacity:0} }
  @keyframes sway1 { 0%,100%{transform:translateX(0)} 50%{transform:translateX(6px)} }
  @keyframes sway2 { 0%,100%{transform:translateX(0)} 50%{transform:translateX(-8px)} }
  @keyframes sway3 { 0%,100%{transform:translateX(0)} 50%{transform:translateX(5px)} }
  @keyframes pulse { 0%,100%{opacity:0.15} 50%{opacity:0.28} }
  @keyframes floatBean { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-8px) rotate(6deg)} }

  .steam-group { position:absolute; bottom:0; display:flex; flex-direction:column; align-items:center; }
  .wisp { border-radius:50%; background:rgba(255,255,255,0.55); filter:blur(4px); }
  .w1 { width:10px;height:28px; animation:rise1 2.2s ease-out infinite, sway1 2.2s ease-in-out infinite; }
  .w2 { width:8px;height:22px; animation:rise2 2.8s ease-out 0.5s infinite, sway2 2.8s ease-in-out 0.5s infinite; }
  .w3 { width:9px;height:25px; animation:rise3 2.5s ease-out 1.1s infinite, sway3 2.5s ease-in-out 1.1s infinite; }
  .bean { animation:floatBean 4s ease-in-out infinite; }
  .bean:nth-child(2) { animation-delay:1.3s; }
  .bean:nth-child(3) { animation-delay:2.6s; }
  .glow { animation:pulse 3s ease-in-out infinite; }
</style>
