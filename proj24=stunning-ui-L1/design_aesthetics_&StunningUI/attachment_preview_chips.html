<style>
*{box-sizing:border-box;margin:0;padding:0}
.phone{width:340px;margin:1.5rem auto;background:var(--color-background-primary);border-radius:32px;border:0.5px solid var(--color-border-secondary);overflow:hidden;font-family:var(--font-sans)}
.chat-header{padding:14px 16px;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--color-background-info);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--color-text-info);flex-shrink:0}
.header-name{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.header-sub{font-size:12px;color:var(--color-text-secondary)}
.chat-body{padding:16px;display:flex;flex-direction:column;gap:10px;min-height:180px;background:var(--color-background-tertiary)}
.bubble{max-width:80%;padding:9px 12px;border-radius:18px;font-size:13px;line-height:1.5}
.bubble.them{background:var(--color-background-primary);color:var(--color-text-primary);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.me{background:#0B57D0;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.input-area{background:var(--color-background-primary);border-top:0.5px solid var(--color-border-tertiary);padding:10px 12px}
.chips-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;min-height:0;transition:all .2s}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:16px;padding:4px 8px;font-size:12px;color:var(--color-text-primary);cursor:pointer;max-width:140px}
.chip-thumb{width:32px;height:32px;border-radius:10px;object-fit:cover;flex-shrink:0}
.chip-icon{width:32px;height:32px;border-radius:10px;background:var(--color-background-info);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;color:var(--color-text-info)}
.chip-name{font-size:11px;color:var(--color-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60px}
.chip-x{font-size:14px;color:var(--color-text-tertiary);flex-shrink:0;padding:0 2px;line-height:1}
.chip-x:hover{color:var(--color-text-primary)}
.input-row{display:flex;align-items:center;gap:8px}
.attach-btn{width:32px;height:32px;border-radius:50%;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:18px;color:var(--color-text-secondary)}
.attach-btn:hover{background:var(--color-background-secondary)}
.msg-input{flex:1;border:0.5px solid var(--color-border-secondary);border-radius:20px;padding:8px 14px;font-size:13px;font-family:var(--font-sans);resize:none;background:var(--color-background-secondary);color:var(--color-text-primary);outline:none}
.send-btn{width:32px;height:32px;border-radius:50%;background:#0B57D0;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:16px;color:#fff}
.send-btn:hover{background:#0842A0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:100;display:none;align-items:center;justify-content:center}
.overlay.open{display:flex}
.overlay img{max-width:90vw;max-height:80vh;border-radius:12px}
.overlay-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.15);border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:20px}
</style>

<h2 class="sr-only">Attachment preview chip UI demo — a chat input with image and document chips, remove buttons, and a lightbox.</h2>

<div class="phone">
  <div class="chat-header">
    <div class="avatar">SR</div>
    <div>
      <div class="header-name">Sara R.</div>
      <div class="header-sub">online</div>
    </div>
  </div>
  <div class="chat-body" id="chatBody">
    <div class="bubble them">Hey! Can you send me those files?</div>
    <div class="bubble me">Sure, attaching them now 👇</div>
  </div>
  <div class="input-area">
    <div class="chips-row" id="chipsRow"></div>
    <div class="input-row">
      <button class="attach-btn" id="attachBtn" aria-label="Attach file" onclick="document.getElementById('fileInput').click()">
        <i class="ti ti-paperclip" aria-hidden="true"></i>
      </button>
      <input type="file" id="fileInput" multiple accept="image/*,.pdf,.doc,.docx,.txt,.xlsx,.csv" style="display:none" />
      <textarea class="msg-input" rows="1" placeholder="Message…" id="msgInput"></textarea>
      <button class="send-btn" onclick="sendMsg()" aria-label="Send">
        <i class="ti ti-send" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</div>

<div class="overlay" id="lightbox" onclick="closeLightbox(event)">
  <button class="overlay-close" onclick="document.getElementById('lightbox').classList.remove('open')" aria-label="Close preview">
    <i class="ti ti-x" aria-hidden="true"></i>
  </button>
  <img id="lightboxImg" src="" alt="Full preview" />
</div>

<script>
const attachments = [];
const fileInput = document.getElementById('fileInput');
const chipsRow = document.getElementById('chipsRow');

fileInput.addEventListener('change', () => {
  Array.from(fileInput.files).forEach(file => {
    const id = Date.now() + Math.random();
    const isImage = file.type.startsWith('image/');
    const obj = {id, file, isImage, url: isImage ? URL.createObjectURL(file) : null};
    attachments.push(obj);
    renderChip(obj);
  });
  fileInput.value = '';
});

function renderChip(obj) {
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.dataset.id = obj.id;

  const media = document.createElement('div');
  if (obj.isImage) {
    const img = document.createElement('img');
    img.src = obj.url;
    img.className = 'chip-thumb';
    img.alt = obj.file.name;
    img.onclick = (e) => { e.stopPropagation(); openLightbox(obj.url); };
    media.appendChild(img);
    media.style.display='contents';
  } else {
    media.className = 'chip-icon';
    const icon = document.createElement('i');
    icon.className = getFileIcon(obj.file.name);
    icon.setAttribute('aria-hidden','true');
    media.appendChild(icon);
  }

  const name = document.createElement('span');
  name.className = 'chip-name';
  name.title = obj.file.name;
  name.textContent = obj.file.name;

  const x = document.createElement('span');
  x.className = 'chip-x';
  x.setAttribute('role','button');
  x.setAttribute('aria-label','Remove ' + obj.file.name);
  x.textContent = '×';
  x.onclick = (e) => { e.stopPropagation(); removeChip(obj.id); };

  chip.appendChild(media);
  chip.appendChild(name);
  chip.appendChild(x);
  chipsRow.appendChild(chip);
}

function getFileIcon(name) {
  const ext = name.split('.').pop().toLowerCase();
  if (['pdf'].includes(ext)) return 'ti ti-file-type-pdf';
  if (['doc','docx'].includes(ext)) return 'ti ti-file-type-doc';
  if (['xls','xlsx','csv'].includes(ext)) return 'ti ti-table';
  if (['txt','md'].includes(ext)) return 'ti ti-file-text';
  return 'ti ti-file';
}

function removeChip(id) {
  const idx = attachments.findIndex(a => a.id === id);
  if (idx > -1) { if(attachments[idx].url) URL.revokeObjectURL(attachments[idx].url); attachments.splice(idx,1); }
  const el = chipsRow.querySelector(`[data-id="${id}"]`);
  if (el) el.remove();
}

function openLightbox(url) {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox(e) {
  if (e.target === document.getElementById('lightbox')) document.getElementById('lightbox').classList.remove('open');
}

function sendMsg() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text && attachments.length === 0) return;
  const body = document.getElementById('chatBody');
  if (text) {
    const b = document.createElement('div');
    b.className = 'bubble me';
    b.textContent = text;
    body.appendChild(b);
    input.value = '';
  }
  attachments.forEach(a => {
    const b = document.createElement('div');
    b.className = 'bubble me';
    b.style.padding = '6px';
    if (a.isImage) {
      const img = document.createElement('img');
      img.src = a.url;
      img.style.cssText = 'width:120px;height:80px;object-fit:cover;border-radius:12px;display:block';
      b.appendChild(img);
    } else {
      b.style.display = 'flex'; b.style.alignItems = 'center'; b.style.gap = '8px'; b.style.padding = '8px 12px';
      const ic = document.createElement('i');
      ic.className = getFileIcon(a.file.name);
      ic.style.fontSize = '18px';
      const sp = document.createElement('span');
      sp.style.fontSize = '12px';
      sp.textContent = a.file.name;
      b.appendChild(ic); b.appendChild(sp);
    }
    body.appendChild(b);
  });
  attachments.length = 0;
  chipsRow.innerHTML = '';
  body.scrollTop = body.scrollHeight;
}
</script>
