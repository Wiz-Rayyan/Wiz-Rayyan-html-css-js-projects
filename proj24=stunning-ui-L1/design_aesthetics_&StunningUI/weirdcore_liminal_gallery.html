
<style>
  @import url('https://fonts.googleapis.com/css2?family=Arial+Rounded+MT+Bold&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  .wc-root {
    background: #c8c0d4;
    min-height: 100vh;
    padding: 2rem 1.5rem;
    font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
    position: relative;
    overflow: hidden;
  }

  .grain-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    opacity: 0.38;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    background-size: 180px 180px;
    mix-blend-mode: overlay;
  }

  .scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.06) 3px,
      rgba(0,0,0,0.06) 4px
    );
  }

  .vhs-flicker {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: rgba(180,200,255,0.5);
    z-index: 101;
    animation: vhsTrack 7s linear infinite;
    pointer-events: none;
  }

  @keyframes vhsTrack {
    0%   { top: -4px; opacity: 0; }
    5%   { opacity: 1; }
    40%  { top: 105vh; opacity: 0.7; }
    41%  { opacity: 0; top: -4px; }
    100% { top: -4px; opacity: 0; }
  }

  .wc-header {
    text-align: center;
    margin-bottom: 2.5rem;
    position: relative;
    z-index: 10;
  }

  .wc-title {
    font-size: 13px;
    letter-spacing: 0.25em;
    color: #7a6e8a;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .wc-subtitle {
    font-size: 28px;
    color: #3a2d4a;
    line-height: 1.2;
    filter: contrast(1.1);
  }

  .wc-subtitle span {
    color: #8878aa;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1.5rem;
    position: relative;
    z-index: 10;
  }

  .card {
    position: relative;
    overflow: hidden;
    border-radius: 4px;
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  .card:nth-child(1) { transform: rotate(-2.1deg) translateY(4px); }
  .card:nth-child(2) { transform: rotate(1.4deg) translateY(-6px); }
  .card:nth-child(3) { transform: rotate(-0.8deg) translateY(2px); }
  .card:nth-child(4) { transform: rotate(2.2deg) translateY(8px); }
  .card:nth-child(5) { transform: rotate(-1.6deg) translateY(-3px); }
  .card:nth-child(6) { transform: rotate(0.9deg) translateY(5px); }

  .card:hover { transform: rotate(0deg) scale(1.02) translateY(-4px) !important; z-index: 20; }

  .card-img {
    width: 100%;
    aspect-ratio: 3/4;
    display: block;
    filter: contrast(1.2) brightness(0.88) saturate(0.55);
    position: relative;
  }

  .card-img svg {
    width: 100%;
    height: 100%;
  }

  .card-overlay {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(140,120,180,0.07) 2px,
      rgba(140,120,180,0.07) 4px
    );
    mix-blend-mode: overlay;
    pointer-events: none;
  }

  .card-label {
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    padding: 0.75rem 0.6rem 0.5rem;
    background: linear-gradient(transparent, rgba(30,20,50,0.72));
    color: rgba(210,200,230,0.9);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .card-num {
    position: absolute;
    top: 8px; right: 10px;
    font-size: 10px;
    color: rgba(200,190,220,0.6);
    letter-spacing: 0.2em;
  }

  .floating-obj {
    position: absolute;
    pointer-events: none;
    z-index: 5;
    opacity: 0.28;
  }

  .obj1 { top: 12%; left: 7%; font-size: 22px; transform: rotate(-15deg); animation: floatA 9s ease-in-out infinite; }
  .obj2 { top: 45%; right: 5%; font-size: 16px; transform: rotate(20deg); animation: floatB 11s ease-in-out infinite; }
  .obj3 { bottom: 20%; left: 3%; font-size: 18px; transform: rotate(-8deg); animation: floatA 13s ease-in-out infinite reverse; }

  @keyframes floatA {
    0%,100% { transform: rotate(-15deg) translateY(0); }
    50% { transform: rotate(-10deg) translateY(-12px); }
  }
  @keyframes floatB {
    0%,100% { transform: rotate(20deg) translateY(0); }
    50% { transform: rotate(25deg) translateY(10px); }
  }

  .wc-footer {
    text-align: center;
    margin-top: 2.5rem;
    color: rgba(90,75,110,0.6);
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    z-index: 10;
    position: relative;
  }

  .timestamp {
    font-size: 10px;
    color: rgba(90,75,110,0.5);
    letter-spacing: 0.15em;
    margin-top: 4px;
  }
</style>
