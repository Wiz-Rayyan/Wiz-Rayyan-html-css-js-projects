
<style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@900&family=Syne:wght@400;700&display=swap');

  .hero-wrap {
    position: relative;
    width: 100%;
    height: 420px;
    overflow: hidden;
    background: #0a0a0a;
    font-family: 'Unbounded', sans-serif;
  }

  .split-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .headline {
    font-size: clamp(52px, 10vw, 88px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.04em;
    text-align: center;
    position: relative;
    user-select: none;
  }

  .half {
    position: absolute;
    inset: -60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .half span {
    font-size: clamp(52px, 10vw, 88px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.04em;
    white-space: nowrap;
  }

  .half-dark {
    clip-path: polygon(0 0, 100% 0, 55% 100%, 0 100%);
    background: #0a0a0a;
    z-index: 2;
  }
  .half-dark span {
    color: #f0ede6;
  }

  .half-light {
    clip-path: polygon(55% 0, 100% 0, 100% 100%, 0 100%);
    background: #f0ede6;
    z-index: 1;
  }
  .half-light span {
    color: #0a0a0a;
  }

  .blade {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
  }

  .sub {
    position: absolute;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    display: flex;
    gap: 48px;
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .sub-l { color: #f0ede6; }
  .sub-r { color: #0a0a0a; }

  .tag {
    position: absolute;
    top: 32px;
    left: 32px;
    z-index: 5;
    font-family: 'Syne', sans-serif;
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #888;
    font-weight: 400;
  }

  .year {
    position: absolute;
    top: 32px;
    right: 32px;
    z-index: 5;
    font-family: 'Syne', sans-serif;
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #888;
    font-weight: 400;
  }

  .controls {
    padding: 20px 0 4px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .ctrl-label {
    font-size: 12px;
    color: var(--color-text-secondary);
    font-family: var(--font-sans);
    white-space: nowrap;
  }

  .ctrl-btn {
    font-family: var(--font-sans);
    font-size: 12px;
    padding: 5px 12px;
    border-radius: var(--border-radius-md);
    border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-secondary);
    color: var(--color-text-primary);
    cursor: pointer;
    transition: background 0.15s;
  }
  .ctrl-btn:hover { background: var(--color-background-tertiary); }
  .ctrl-btn.active { border-color: var(--color-border-primary); font-weight: 500; }

  .angle-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }
  .angle-wrap input[type=range] { width: 90px; }
  .angle-val {
    font-size: 12px;
    color: var(--color-text-secondary);
    min-width: 30px;
    font-family: var(--font-sans);
  }
</style>

<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Interactive split-text diagonal hero: a bold headline cut diagonally with each half in contrasting colours.</h2>

<div class="hero-wrap" id="heroWrap">
  <div class="half half-light" id="halfLight">
    <span id="textLight">FRACTURE</span>
  </div>
  <div class="half half-dark" id="halfDark">
    <span id="textDark">FRACTURE</span>
  </div>

  <svg class="blade" id="blade" viewBox="0 0 680 420" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <line id="divLine" x1="374" y1="0" x2="306" y2="420" stroke="#c8b89a" stroke-width="1.5"/>
  </svg>

  <div class="tag">Editorial / 2025</div>
  <div class="year">Vol. 01</div>

  <div class="sub" id="subLine">
    <span class="sub-l" id="subL">Design</span>
    <span class="sub-r" id="subR">Studio</span>
  </div>
</div>

<div class="controls">
  <span class="ctrl-label">Word:</span>
  <button class="ctrl-btn active" onclick="setWord('FRACTURE')">FRACTURE</button>
  <button class="ctrl-btn" onclick="setWord('TENSION')">TENSION</button>
  <button class="ctrl-btn" onclick="setWord('OBLIQUE')">OBLIQUE</button>
  <button class="ctrl-btn" onclick="setWord('VOLTAGE')">VOLTAGE</button>

  <div class="angle-wrap">
    <span class="ctrl-label">Angle:</span>
    <input type="range" min="5" max="40" value="18" step="1" id="angleSlider" oninput="updateAngle(this.value)">
    <span class="angle-val" id="angleVal">18°</span>
  </div>
</div>

<script>
const schemes = {
  dark: { bg1: '#0a0a0a', fg1: '#f0ede6', bg2: '#f0ede6', fg2: '#0a0a0a', line: '#c8b89a' },
  ink:  { bg1: '#1a1a2e', fg1: '#e8d5b7', bg2: '#e8d5b7', fg2: '#1a1a2e', line: '#d4a853' },
  red:  { bg1: '#1c0a0a', fg1: '#f5e6e6', bg2: '#d63031', fg2: '#1c0a0a', line: '#ff7675' },
  sage: { bg1: '#1a2a1a', fg1: '#e8f0e8', bg2: '#e8f0e8', fg2: '#1a2a1a', line: '#6bcb77' },
};

let currentAngle = 18;
let currentWord = 'FRACTURE';

function getClipPaths(angle) {
  const w = 100, h = 100;
  const offset = Math.tan(angle * Math.PI / 180) * h;
  const pct = 55;
  const lx = pct;
  const rx = pct + offset;
  const dark = `polygon(0 0, ${lx}% 0, ${rx}% 100%, 0 100%)`;
  const light = `polygon(${lx}% 0, 100% 0, 100% 100%, ${rx}% 100%)`;
  return { dark, light, lx, rx };
}

function updateAngle(val) {
  currentAngle = parseInt(val);
  document.getElementById('angleVal').textContent = val + '°';
  applyAngle();
}

function applyAngle() {
  const { dark, light, lx, rx } = getClipPaths(currentAngle);
  document.getElementById('halfDark').style.clipPath = dark;
  document.getElementById('halfLight').style.clipPath = light;

  const blade = document.getElementById('blade');
  const w = 680, h = 420;
  const x1 = w * (lx / 100);
  const x2 = w * (rx / 100);
  document.getElementById('divLine').setAttribute('x1', x1);
  document.getElementById('divLine').setAttribute('x2', x2);
  document.getElementById('divLine').setAttribute('y1', 0);
  document.getElementById('divLine').setAttribute('y2', h);
}

function setWord(w) {
  currentWord = w;
  document.getElementById('textDark').textContent = w;
  document.getElementById('textLight').textContent = w;
  document.querySelectorAll('.ctrl-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === w);
  });
}

applyAngle();
</script>
