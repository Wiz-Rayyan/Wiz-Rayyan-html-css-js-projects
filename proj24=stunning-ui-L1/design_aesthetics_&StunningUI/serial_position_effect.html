
<style>
  .sp-wrap { padding: 2rem 0; }
  .sp-label { font-size: 13px; color: var(--color-text-secondary); text-align: center; margin-bottom: 1.5rem; letter-spacing: 0.04em; }
  .sp-row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: nowrap; }
  .sp-card {
    border-radius: var(--border-radius-lg);
    border: 0.5px solid var(--color-border-tertiary);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; cursor: default; transition: all 0.4s cubic-bezier(.34,1.56,.64,1);
    padding: 14px 10px; min-width: 80px; max-width: 110px;
  }
  .sp-card .num { font-size: 11px; color: var(--color-text-tertiary); margin-bottom: 4px; }
  .sp-card .word { font-size: 13px; line-height: 1.3; }
  .sp-card.edge-first {
    transform: scale(1.22);
    background: #FAC775;
    border-color: #EF9F27;
    box-shadow: none;
  }
  .sp-card.edge-first .num { color: #633806; }
  .sp-card.edge-first .word { font-weight: 900; font-size: 15px; color: #412402; }
  .sp-card.edge-last {
    transform: scale(1.22);
    background: #FAC775;
    border-color: #EF9F27;
  }
  .sp-card.edge-last .num { color: #633806; }
  .sp-card.edge-last .word { font-weight: 900; font-size: 15px; color: #412402; }
  .sp-card.middle {
    transform: scale(0.78);
    opacity: 0.28;
    filter: grayscale(1);
    background: var(--color-background-secondary);
  }
  .sp-card.middle .word { font-size: 12px; color: var(--color-text-secondary); }

  .sp-toggle { display: flex; justify-content: center; gap: 10px; margin: 2rem 0 0.5rem; }
  .sp-anno { display: flex; justify-content: center; gap: 2rem; margin-top: 1.5rem; font-size: 12px; color: var(--color-text-secondary); }
  .sp-anno span { display: flex; align-items: center; gap: 6px; }
  .sp-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .sp-dot.gold { background: #EF9F27; }
  .sp-dot.gray { background: #B4B2A9; }

  .sp-stat { display: flex; justify-content: center; gap: 24px; margin: 2rem 0; }
  .sp-stat-box { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px 20px; text-align: center; }
  .sp-stat-box .val { font-size: 22px; font-weight: 500; color: var(--color-text-primary); }
  .sp-stat-box .lbl { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }

  .sp-mode-btn { font-size: 13px; }
  .sp-mode-btn.active { background: var(--color-background-secondary); }

  .sp-divider { height: 0.5px; background: var(--color-border-tertiary); margin: 1.5rem 0; }
</style>

<div class="sp-wrap">
  <h2 class="sr-only">Serial position effect: first and last items in a list are remembered most vividly; middle items fade away.</h2>

  <p class="sp-label">serial position effect — a list of 7 words</p>

  <div class="sp-row" id="card-row"></div>

  <div class="sp-anno">
    <span><span class="sp-dot gold"></span>remembered (primacy &amp; recency)</span>
    <span><span class="sp-dot gray"></span>forgotten (middle)</span>
  </div>

  <div class="sp-divider"></div>

  <div class="sp-stat">
    <div class="sp-stat-box">
      <div class="val" id="stat-recall">~70%</div>
      <div class="lbl">recall: edges</div>
    </div>
    <div class="sp-stat-box">
      <div class="val" id="stat-mid">~20%</div>
      <div class="lbl">recall: middle</div>
    </div>
    <div class="sp-stat-box">
      <div class="val">5</div>
      <div class="lbl">items forgotten</div>
    </div>
  </div>

  <div class="sp-toggle">
    <button class="sp-mode-btn active" onclick="setList('fruit')">fruit list</button>
    <button class="sp-mode-btn" onclick="setList('tasks')">task list</button>
    <button class="sp-mode-btn" onclick="setList('numbers')">numbers</button>
  </div>
</div>

<script>
  const lists = {
    fruit: ['Apple','Banana','Grape','Mango','Lemon','Peach','Kiwi'],
    tasks: ['Email','Meeting','Report','Review','Update','Debug','Deploy'],
    numbers: ['7','42','13','88','5','31','99'],
  };
  let current = 'fruit';

  function setList(key) {
    current = key;
    document.querySelectorAll('.sp-mode-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    render();
  }

  function render() {
    const words = lists[current];
    const row = document.getElementById('card-row');
    row.innerHTML = '';
    words.forEach((w, i) => {
      const isFirst = i === 0;
      const isLast = i === words.length - 1;
      const cls = isFirst ? 'edge-first' : isLast ? 'edge-last' : 'middle';
      row.innerHTML += `
        <div class="sp-card ${cls}">
          <div class="num">${i + 1}</div>
          <div class="word">${w}</div>
        </div>`;
    });
  }

  render();
</script>
