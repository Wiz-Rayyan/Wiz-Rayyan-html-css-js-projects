
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .tz-app {
    font-family: 'Inter', sans-serif;
    background: #EFF1F3;
    min-height: 600px;
    border-radius: 32px;
    padding: 48px 40px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    color: #2C3E50;
    position: relative;
    overflow: hidden;
  }
  .tz-header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 48px;
  }
  .tz-logo {
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.12em;
    color: #7B8FA1;
    text-transform: uppercase;
  }
  .tz-session-badge {
    background: #DDE2E8;
    color: #5C7080;
    font-size: 12px;
    font-weight: 400;
    padding: 6px 14px;
    border-radius: 24px;
    letter-spacing: 0.04em;
  }
  .tz-heading {
    font-size: 64px;
    font-weight: 300;
    color: #2C3E50;
    letter-spacing: -0.02em;
    line-height: 1.1;
    text-align: center;
    margin-bottom: 6px;
    transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .tz-subtext {
    font-size: 15px;
    font-weight: 400;
    color: #7B8FA1;
    letter-spacing: 0.06em;
    text-align: center;
    margin-bottom: 52px;
    transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .tz-breath-container {
    position: relative;
    width: 200px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 52px;
  }
  .tz-ring-outer {
    position: absolute;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: 1.5px solid #C8D0D8;
    transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .tz-ring-mid {
    position: absolute;
    width: 164px;
    height: 164px;
    border-radius: 50%;
    border: 1px solid #D8DDE3;
    transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .tz-circle {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    background: #D6DCE3;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 2px;
    transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    z-index: 2;
  }
  .tz-circle-count {
    font-size: 32px;
    font-weight: 300;
    color: #2C3E50;
    line-height: 1;
    transition: all 0.4s ease;
  }
  .tz-circle-unit {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #7B8FA1;
    font-weight: 400;
  }
  @keyframes breathe-in {
    0% { transform: scale(1); background: #D6DCE3; }
    100% { transform: scale(1.22); background: #C2CAD4; }
  }
  @keyframes breathe-out {
    0% { transform: scale(1.22); background: #C2CAD4; }
    100% { transform: scale(1); background: #D6DCE3; }
  }
  @keyframes ring-breathe-in {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.18); opacity: 1; }
  }
  @keyframes ring-breathe-out {
    0% { transform: scale(1.18); opacity: 1; }
    100% { transform: scale(1); opacity: 0.6; }
  }
  .phase-inhale .tz-circle { animation: breathe-in 4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
  .phase-inhale .tz-ring-outer { animation: ring-breathe-in 4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
  .phase-hold .tz-circle { transform: scale(1.22); background: #C2CAD4; }
  .phase-exhale .tz-circle { animation: breathe-out 6s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
  .phase-exhale .tz-ring-outer { animation: ring-breathe-out 6s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
  .tz-progress-row {
    display: flex;
    gap: 6px;
    margin-bottom: 44px;
  }
  .tz-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #C8D0D8;
    transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .tz-dot.active {
    background: #7B8FA1;
    width: 20px;
    border-radius: 3px;
  }
  .tz-dot.done { background: #9BAAB8; }
  .tz-controls {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .tz-btn-primary {
    width: 100%;
    padding: 18px;
    border-radius: 24px;
    border: none;
    background: #2C3E50;
    color: #EFF1F3;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .tz-btn-primary:hover { background: #3D5068; transform: none; }
  .tz-btn-primary:active { transform: scale(0.99); }
  .tz-btn-secondary {
    width: 100%;
    padding: 16px;
    border-radius: 24px;
    border: 1.5px solid #C8D0D8;
    background: transparent;
    color: #7B8FA1;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .tz-btn-secondary:hover { border-color: #9BAAB8; color: #5C7080; }
  .tz-duration-row {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
  }
  .tz-duration-pill {
    flex: 1;
    padding: 10px 0;
    border-radius: 16px;
    border: 1.5px solid #C8D0D8;
    background: transparent;
    color: #7B8FA1;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 400;
    cursor: pointer;
    text-align: center;
    transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .tz-duration-pill.selected {
    background: #DDE2E8;
    border-color: #DDE2E8;
    color: #2C3E50;
  }
  .tz-session-info {
    font-size: 12px;
    color: #9BAAB8;
    text-align: center;
    letter-spacing: 0.05em;
  }
  .tz-stats-row {
    display: flex;
    width: 100%;
    gap: 10px;
    margin-top: 8px;
  }
  .tz-stat {
    flex: 1;
    background: #E5E9ED;
    border-radius: 16px;
    padding: 14px 12px;
    text-align: center;
  }
  .tz-stat-val {
    font-size: 22px;
    font-weight: 300;
    color: #2C3E50;
  }
  .tz-stat-label {
    font-size: 11px;
    color: #9BAAB8;
    letter-spacing: 0.07em;
    margin-top: 3px;
  }
</style>

<div class="tz-app" id="app">
  <div class="tz-header">
    <span class="tz-logo">Zenith</span>
    <span class="tz-session-badge" id="session-info">Day 7</span>
  </div>

  <div id="main-view">
    <div class="tz-heading" id="heading">Breathe.</div>
    <div class="tz-subtext" id="subtext">Find your stillness</div>

    <div class="tz-breath-container" id="breathContainer">
      <div class="tz-ring-outer" id="ringOuter"></div>
      <div class="tz-ring-mid"></div>
      <div class="tz-circle" id="breathCircle">
        <span class="tz-circle-count" id="countDisplay">—</span>
        <span class="tz-circle-unit" id="unitDisplay"></span>
      </div>
    </div>

    <div class="tz-progress-row" id="progressDots">
      <div class="tz-dot active" data-i="0"></div>
      <div class="tz-dot" data-i="1"></div>
      <div class="tz-dot" data-i="2"></div>
      <div class="tz-dot" data-i="3"></div>
      <div class="tz-dot" data-i="4"></div>
    </div>

    <div class="tz-stats-row" id="statsRow">
      <div class="tz-stat"><div class="tz-stat-val">12</div><div class="tz-stat-label">streak</div></div>
      <div class="tz-stat"><div class="tz-stat-val">4</div><div class="tz-stat-label">this week</div></div>
      <div class="tz-stat"><div class="tz-stat-val">38m</div><div class="tz-stat-label">total time</div></div>
    </div>

    <div class="tz-controls" id="controls" style="margin-top: 24px;">
      <div class="tz-duration-row">
        <div class="tz-duration-pill selected" onclick="selectDuration(this, 3)">3 min</div>
        <div class="tz-duration-pill" onclick="selectDuration(this, 5)">5 min</div>
        <div class="tz-duration-pill" onclick="selectDuration(this, 10)">10 min</div>
      </div>
      <button class="tz-btn-primary" onclick="startSession()">Begin session</button>
      <button class="tz-btn-secondary" onclick="sendPrompt('What type of breathing pattern should I do for stress relief?')">explore techniques ↗</button>
    </div>
  </div>

  <div id="active-view" style="display:none; width:100%; flex-direction:column; align-items:center; gap:0;">
    <div class="tz-heading" id="active-heading" style="font-size:64px; font-weight:300; margin-bottom:6px;">Inhale</div>
    <div class="tz-subtext" id="active-sub">breathe in slowly</div>

    <div class="tz-breath-container" id="activeBreathContainer">
      <div class="tz-ring-outer" id="activeRingOuter"></div>
      <div class="tz-ring-mid"></div>
      <div class="tz-circle" id="activeCircle">
        <span class="tz-circle-count" id="activeCount">4</span>
        <span class="tz-circle-unit"></span>
      </div>
    </div>

    <div class="tz-progress-row" id="activeDots">
      <div class="tz-dot active" data-i="0"></div>
      <div class="tz-dot" data-i="1"></div>
      <div class="tz-dot" data-i="2"></div>
      <div class="tz-dot" data-i="3"></div>
      <div class="tz-dot" data-i="4"></div>
    </div>

    <div class="tz-session-info" id="session-time" style="margin-bottom:28px;">0:00 remaining</div>

    <div class="tz-controls" style="margin-top:8px;">
      <button class="tz-btn-secondary" onclick="endSession()">end session</button>
    </div>
  </div>
</div>

<script>
let sessionDuration = 3;
let sessionTimer = null;
let breathTimer = null;
let elapsed = 0;
let breathCycle = 0;
let breathPhase = 'idle';
let breathCount = 0;
let breathInterval = null;
let countInterval = null;
let totalCycles = 0;
let currentPhaseTime = 0;

const phases = [
  { name: 'inhale', label: 'Inhale', sub: 'breathe in slowly', duration: 4, class: 'phase-inhale' },
  { name: 'hold', label: 'Hold', sub: 'rest here gently', duration: 4, class: 'phase-hold' },
  { name: 'exhale', label: 'Exhale', sub: 'let it all go', duration: 6, class: 'phase-exhale' },
  { name: 'rest', label: 'Rest', sub: 'pause before next breath', duration: 2, class: '' }
];

function selectDuration(el, mins) {
  document.querySelectorAll('.tz-duration-pill').forEach(p => p.classList.remove('selected'));
  el.classList.add('selected');
  sessionDuration = mins;
}

function startSession() {
  document.getElementById('main-view').style.display = 'none';
  const av = document.getElementById('active-view');
  av.style.display = 'flex';
  elapsed = 0;
  breathCycle = 0;
  totalCycles = Math.floor((sessionDuration * 60) / (4+4+6+2));
  runBreathPhase(0);
  sessionTimer = setInterval(() => {
    elapsed++;
    const remaining = (sessionDuration * 60) - elapsed;
    if (remaining <= 0) { endSession(); return; }
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    document.getElementById('session-time').textContent = `${m}:${s.toString().padStart(2,'0')} remaining`;
    const cyclesDone = Math.floor(elapsed / (4+4+6+2));
    updateActiveDots(cyclesDone);
  }, 1000);
}

function runBreathPhase(phaseIdx) {
  const phase = phases[phaseIdx % phases.length];
  const heading = document.getElementById('active-heading');
  const sub = document.getElementById('active-sub');
  const circle = document.getElementById('activeCircle');
  const ringOuter = document.getElementById('activeRingOuter');
  const countEl = document.getElementById('activeCount');

  heading.style.transition = 'all 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
  heading.style.opacity = '0';
  setTimeout(() => {
    heading.textContent = phase.label;
    sub.textContent = phase.sub;
    heading.style.opacity = '1';
  }, 400);

  circle.className = 'tz-circle ' + phase.class;
  ringOuter.className = 'tz-ring-outer ' + phase.class;

  let secs = phase.duration;
  countEl.textContent = secs;
  if (countInterval) clearInterval(countInterval);
  countInterval = setInterval(() => {
    secs--;
    if (secs <= 0) { clearInterval(countInterval); return; }
    countEl.textContent = secs;
  }, 1000);

  if (breathInterval) clearTimeout(breathInterval);
  breathInterval = setTimeout(() => {
    runBreathPhase(phaseIdx + 1);
  }, phase.duration * 1000);
}

function updateActiveDots(cyclesDone) {
  const dots = document.querySelectorAll('#activeDots .tz-dot');
  dots.forEach((d, i) => {
    d.className = 'tz-dot';
    if (i < cyclesDone % 5) d.classList.add('done');
    else if (i === cyclesDone % 5) d.classList.add('active');
  });
}

function endSession() {
  clearInterval(sessionTimer);
  clearTimeout(breathInterval);
  clearInterval(countInterval);
  document.getElementById('active-view').style.display = 'none';
  document.getElementById('main-view').style.display = 'block';
  const circle = document.getElementById('activeCircle');
  circle.className = 'tz-circle';
}
</script>
