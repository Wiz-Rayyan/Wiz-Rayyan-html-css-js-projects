
<style>
  :root {
    --idle-dur: 4s;
    --hover-dur: 2s;
    --listen-dur: 1s;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; }

  .scene {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 420px;
    padding: 2rem 0;
    user-select: none;
  }

  .orb-wrap {
    position: relative;
    width: 240px;
    height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* ring layers — purely decorative radial rings that appear in active mode */
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid rgba(56, 189, 248, 0);
    transform: scale(0);
    pointer-events: none;
    transition: border-color 0.4s, transform 0.4s;
  }
  .ring-1 { width: 200px; height: 200px; }
  .ring-2 { width: 260px; height: 260px; }
  .ring-3 { width: 320px; height: 320px; }

  /* glow behind the orb */
  .glow {
    position: absolute;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(14,165,233,0.35) 0%, rgba(6,182,212,0.12) 55%, transparent 75%);
    animation: glowBreath var(--idle-dur) ease-in-out infinite;
    pointer-events: none;
  }

  /* core orb */
  .orb {
    position: relative;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #67e8f9, #0ea5e9 50%, #0369a1 100%);
    animation: breathe var(--idle-dur) ease-in-out infinite;
    transition: background 0.8s ease, box-shadow 0.5s ease;
    box-shadow:
      0 0 30px rgba(14,165,233,0.4),
      0 0 60px rgba(6,182,212,0.15),
      inset 0 1px 1px rgba(255,255,255,0.25);
  }

  /* inner highlight */
  .orb::before {
    content: '';
    position: absolute;
    top: 15%;
    left: 20%;
    width: 30%;
    height: 25%;
    border-radius: 50%;
    background: rgba(255,255,255,0.28);
    pointer-events: none;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(0.95); opacity: 0.75; }
    50%       { transform: scale(1.05); opacity: 1; }
  }

  @keyframes glowBreath {
    0%, 100% { transform: scale(0.92); opacity: 0.55; }
    50%       { transform: scale(1.08); opacity: 1; }
  }

  /* ── HOVER ── */
  .orb-wrap:hover .orb {
    animation-duration: var(--hover-dur);
    background: radial-gradient(circle at 38% 35%, #a5f3fc, #22d3ee 45%, #0891b2 100%);
    box-shadow:
      0 0 45px rgba(6,182,212,0.6),
      0 0 80px rgba(14,165,233,0.25),
      inset 0 1px 1px rgba(255,255,255,0.3);
  }
  .orb-wrap:hover .glow {
    animation-duration: var(--hover-dur);
  }

  /* ── LISTENING ── */
  .orb-wrap.listening .orb {
    animation-duration: var(--listen-dur);
    background: radial-gradient(circle at 38% 35%, #bfdbfe, #60a5fa 45%, #1d4ed8 100%);
    box-shadow:
      0 0 55px rgba(96,165,250,0.65),
      0 0 100px rgba(59,130,246,0.25),
      inset 0 1px 1px rgba(255,255,255,0.3);
  }
  .orb-wrap.listening .glow {
    animation-duration: var(--listen-dur);
    background: radial-gradient(circle, rgba(96,165,250,0.4) 0%, rgba(59,130,246,0.12) 55%, transparent 75%);
  }

  /* ── ACTIVE ── */
  .orb-wrap.active .orb {
    animation: none;
    transform: scale(1.02);
    opacity: 1;
    background: radial-gradient(circle at 38% 35%, #e0f2fe, #38bdf8 40%, #0284c7 100%);
    box-shadow:
      0 0 60px rgba(56,189,248,0.75),
      0 0 120px rgba(14,165,233,0.35),
      inset 0 1px 1px rgba(255,255,255,0.35);
    transition: transform 0.4s ease, box-shadow 0.4s ease, opacity 0.4s ease;
  }
  .orb-wrap.active .glow {
    animation: none;
    transform: scale(1.06);
    opacity: 1;
    background: radial-gradient(circle, rgba(56,189,248,0.45) 0%, rgba(14,165,233,0.18) 55%, transparent 75%);
  }
  .orb-wrap.active .ring {
    border-color: rgba(56,189,248,0.35);
  }
  .orb-wrap.active .ring-1 { transform: scale(1);   transition: transform 0.5s cubic-bezier(0.22,1,0.36,1), border-color 0.4s; }
  .orb-wrap.active .ring-2 { transform: scale(1);   transition: transform 0.6s 0.08s cubic-bezier(0.22,1,0.36,1), border-color 0.4s; }
  .orb-wrap.active .ring-3 { transform: scale(1);   transition: transform 0.7s 0.16s cubic-bezier(0.22,1,0.36,1), border-color 0.4s; }

  /* label */
  .state-label {
    margin-top: 2.5rem;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--color-text-tertiary);
    transition: color 0.5s, opacity 0.5s;
    min-height: 20px;
  }

  /* controls */
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 2rem;
  }
  .btn {
    font-size: 12px;
    padding: 6px 16px;
    border-radius: 999px;
    border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-secondary);
    color: var(--color-text-secondary);
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .btn:hover { background: var(--color-background-tertiary); color: var(--color-text-primary); }
  .btn.active-btn {
    border-color: rgba(56,189,248,0.5);
    color: #0ea5e9;
    background: rgba(56,189,248,0.07);
  }
</style>

<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Ambient breathing light — interactive idle state demonstrating idle, hover, listening, and active modes</h2>

<div class="scene">
  <div class="orb-wrap" id="orb" title="Click to toggle listening mode">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
    <div class="glow"></div>
    <div class="orb"></div>
  </div>
  <div class="state-label" id="label">idle</div>
  <div class="controls">
    <button class="btn active-btn" id="btn-idle"   onclick="setState('idle')">Idle</button>
    <button class="btn"            id="btn-listen" onclick="setState('listening')">Listening</button>
    <button class="btn"            id="btn-active" onclick="setState('active')">Active</button>
  </div>
</div>

<script>
  const orb   = document.getElementById('orb');
  const label = document.getElementById('label');
  const btns  = { idle: 'btn-idle', listening: 'btn-listen', active: 'btn-active' };
  let current = 'idle';

  function setState(s) {
    orb.classList.remove('listening', 'active');
    if (s !== 'idle') orb.classList.add(s);
    current = s;
    label.textContent = s;
    Object.entries(btns).forEach(([k, id]) => {
      document.getElementById(id).classList.toggle('active-btn', k === s);
    });
  }

  orb.addEventListener('click', () => {
    const next = current === 'idle' ? 'listening' : current === 'listening' ? 'active' : 'idle';
    setState(next);
  });
</script>
