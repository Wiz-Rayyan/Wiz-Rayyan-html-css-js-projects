<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Password strength indicator that fills and glows red, yellow, or green as you type</h2>
<div style="max-width:420px;">
  <label for="pw" style="display:block;font-size:13px;color:var(--text-secondary);margin-bottom:6px;">Password</label>
  <div style="position:relative;">
    <input id="pw" type="password" placeholder="Type a password" autocomplete="new-password"
      style="width:100%;padding-right:40px;" />
    <button id="toggle" aria-label="Show password" type="button"
      style="position:absolute;right:4px;top:50%;transform:translateY(-50%);width:28px;height:28px;padding:0;border:none;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);">
      <i class="ti ti-eye" style="font-size:18px;" aria-hidden="true"></i>
    </button>
  </div>

  <div id="track" style="position:relative;margin-top:14px;height:8px;border-radius:6px;background:var(--surface-1);overflow:visible;">
    <div id="bar" style="height:100%;width:0%;border-radius:6px;background:var(--border-strong);transition:width 0.35s ease, background-color 0.35s ease, box-shadow 0.35s ease;"></div>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
    <span id="label" style="font-size:13px;font-weight:500;color:var(--text-secondary);">Enter a password</span>
    <span id="score" style="font-size:12px;color:var(--text-muted);">0%</span>
  </div>

  <div id="sparkle-layer" style="position:relative;height:0;overflow:visible;"></div>
</div>
<script>
(function(){
  var pw = document.getElementById('pw');
  var bar = document.getElementById('bar');
  var track = document.getElementById('track');
  var label = document.getElementById('label');
  var score = document.getElementById('score');
  var toggle = document.getElementById('toggle');
  var sparkleLayer = document.getElementById('sparkle-layer');

  toggle.addEventListener('click', function(){
    var isPw = pw.type === 'password';
    pw.type = isPw ? 'text' : 'password';
    toggle.innerHTML = isPw
      ? '<i class="ti ti-eye-off" style="font-size:18px;" aria-hidden="true"></i>'
      : '<i class="ti ti-eye" style="font-size:18px;" aria-hidden="true"></i>';
  });

  function scorePassword(v){
    if(!v) return 0;
    var s = 0;
    s += Math.min(v.length * 6, 40);
    if(/[a-z]/.test(v)) s += 10;
    if(/[A-Z]/.test(v)) s += 15;
    if(/[0-9]/.test(v)) s += 15;
    if(/[^A-Za-z0-9]/.test(v)) s += 20;
    if(v.length < 6) s = Math.min(s, 30);
    return Math.max(0, Math.min(100, Math.round(s)));
  }

  function colorFor(s){
    if(s < 40) return {c:'#E24B4A', dark:'#791F1F', name:'Weak'};
    if(s < 75) return {c:'#EF9F27', dark:'#633806', name:'Medium'};
    return {c:'#639922', dark:'#173404', name:'Strong'};
  }

  function shake(){
    track.animate([
      { transform: 'translateX(0)' },
      { transform: 'translateX(-4px)' },
      { transform: 'translateX(4px)' },
      { transform: 'translateX(-3px)' },
      { transform: 'translateX(3px)' },
      { transform: 'translateX(0)' }
    ], { duration: 350, easing: 'ease-in-out' });
  }

  function sparkle(){
    for(var i=0;i<6;i++){
      (function(i){
        var el = document.createElement('div');
        el.style.position = 'absolute';
        el.style.left = (10 + Math.random()*80) + '%';
        el.style.top = '-4px';
        el.style.width = '4px';
        el.style.height = '4px';
        el.style.borderRadius = '50%';
        el.style.background = '#639922';
        el.style.pointerEvents = 'none';
        sparkleLayer.appendChild(el);
        var dx = (Math.random()-0.5) * 40;
        var anim = el.animate([
          { transform: 'translate(0,0) scale(1)', opacity: 1 },
          { transform: 'translate(' + dx + 'px,-24px) scale(0.4)', opacity: 0 }
        ], { duration: 600 + Math.random()*300, easing: 'ease-out', delay: i*40 });
        anim.onfinish = function(){ el.remove(); };
      })(i);
    }
  }

  var wasStrong = false;
  var lastLen = 0;

  pw.addEventListener('input', function(){
    var v = pw.value;
    var s = scorePassword(v);
    var info = colorFor(s);

    bar.style.width = s + '%';
    score.textContent = s + '%';

    if(v.length === 0){
      bar.style.background = 'var(--border-strong)';
      bar.style.boxShadow = 'none';
      label.textContent = 'Enter a password';
      label.style.color = 'var(--text-secondary)';
      wasStrong = false;
      lastLen = 0;
      return;
    }

    bar.style.background = info.c;
    var glowStrength = 4 + (s/100) * 14;
    bar.style.boxShadow = '0 0 ' + glowStrength + 'px ' + info.c;
    label.textContent = info.name;
    label.style.color = info.dark;

    if(s < 40 && v.length > lastLen){
      shake();
    }
    if(s >= 75 && !wasStrong){
      sparkle();
    }
    wasStrong = s >= 75;
    lastLen = v.length;
  });
})();
</script>
