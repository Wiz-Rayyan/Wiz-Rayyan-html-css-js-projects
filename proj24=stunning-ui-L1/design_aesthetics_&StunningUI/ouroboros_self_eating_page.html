
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  #stage {
    min-height: 320vh;
    padding: 0;
    position: relative;
    overflow: hidden;
    background: transparent;
  }
  .section {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #scroll-container {
    width: 100%;
    height: 500px;
    overflow-y: scroll;
    position: relative;
    border-radius: var(--border-radius-lg);
    scrollbar-width: none;
  }
  #scroll-container::-webkit-scrollbar { display: none; }

  .el {
    transition: opacity 0.05s linear, filter 0.05s linear, transform 0.05s linear;
    will-change: opacity, filter, transform;
  }

  #snake-svg {
    display: block;
    margin: 0 auto 1.5rem;
  }

  #title-text {
    font-size: 22px;
    font-weight: 500;
    color: var(--color-text-primary);
    text-align: center;
    margin-bottom: 0.5rem;
    letter-spacing: 0.08em;
  }
  #subtitle-text {
    font-size: 14px;
    color: var(--color-text-secondary);
    text-align: center;
    margin-bottom: 2rem;
    max-width: 340px;
    line-height: 1.6;
  }

  .dissolve-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 480px;
    margin: 0 auto 1.5rem;
  }
  .grid-cell {
    height: 48px;
    border-radius: var(--border-radius-md);
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-tertiary);
  }

  .text-line {
    height: 12px;
    border-radius: 6px;
    background: var(--color-background-secondary);
    margin-bottom: 10px;
    width: 100%;
  }
  .text-block {
    width: 100%;
    max-width: 480px;
    margin: 0 auto 1.5rem;
    padding: 0 1rem;
  }

  #progress-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 2px;
    background: var(--color-text-secondary);
    width: 0%;
    transition: width 0.05s;
    opacity: 0.3;
  }

  #void-msg {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
    flex-direction: column;
    gap: 8px;
  }
  #void-msg p {
    font-size: 13px;
    color: var(--color-text-tertiary);
    letter-spacing: 0.15em;
    text-transform: lowercase;
  }

  #reset-btn {
    margin-top: 1rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease 0.5s;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--color-text-tertiary);
    cursor: pointer;
    background: none;
    border: 0.5px solid var(--color-border-secondary);
    padding: 6px 16px;
    border-radius: var(--border-radius-md);
  }

  #entropy-label {
    font-size: 11px;
    color: var(--color-text-tertiary);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 2rem;
  }

  #snake-tail { transform-origin: 50% 50%; }
</style>

<h2 class="sr-only">Ouroboros: an interactive page that dissolves as you scroll, consuming itself until nothing remains.</h2>

<div id="scroll-container">
  <div id="stage">
    <div class="section">
      <div id="entropy-label" class="el" data-delay="0">entropy 0%</div>

      <svg id="snake-svg" width="80" height="80" viewBox="0 0 80 80" class="el" data-delay="0.05" aria-hidden="true">
        <circle cx="40" cy="40" r="28" fill="none" stroke="var(--color-text-secondary)" stroke-width="8" stroke-dasharray="132 44" stroke-linecap="round"/>
        <circle cx="40" cy="12" r="6" fill="var(--color-text-secondary)"/>
        <circle cx="38" cy="10" r="1.5" fill="var(--color-background-primary)"/>
        <circle cx="42" cy="10" r="1.5" fill="var(--color-background-primary)"/>
        <line id="snake-tail" x1="40" y1="68" x2="40" y2="78" stroke="var(--color-text-secondary)" stroke-width="4" stroke-linecap="round"/>
      </svg>

      <div id="title-text" class="el" data-delay="0.1">ouroboros</div>
      <div id="subtitle-text" class="el" data-delay="0.12">Scroll down. The page consumes itself. By the end, nothing will remain — not even this sentence.</div>

      <div class="dissolve-grid">
        <div class="grid-cell el" data-delay="0.15" style="background:rgba(83,74,183,0.15); border-color:rgba(83,74,183,0.2)"></div>
        <div class="grid-cell el" data-delay="0.18"></div>
        <div class="grid-cell el" data-delay="0.2" style="background:rgba(15,110,86,0.15); border-color:rgba(15,110,86,0.2)"></div>
        <div class="grid-cell el" data-delay="0.22"></div>
        <div class="grid-cell el" data-delay="0.25" style="background:rgba(153,60,29,0.15); border-color:rgba(153,60,29,0.2)"></div>
        <div class="grid-cell el" data-delay="0.28"></div>
      </div>

      <div class="text-block">
        <div class="text-line el" data-delay="0.3" style="width:90%"></div>
        <div class="text-line el" data-delay="0.33" style="width:75%"></div>
        <div class="text-line el" data-delay="0.36" style="width:85%"></div>
        <div class="text-line el" data-delay="0.4" style="width:60%"></div>
      </div>

      <div class="dissolve-grid" style="grid-template-columns: repeat(5,1fr); max-width:300px;">
        <div class="grid-cell el" data-delay="0.42" style="height:32px"></div>
        <div class="grid-cell el" data-delay="0.44" style="height:32px"></div>
        <div class="grid-cell el" data-delay="0.46" style="height:32px"></div>
        <div class="grid-cell el" data-delay="0.48" style="height:32px"></div>
        <div class="grid-cell el" data-delay="0.5" style="height:32px"></div>
      </div>

      <div class="text-block" style="margin-bottom:0.5rem;">
        <div class="text-line el" data-delay="0.55" style="width:50%"></div>
        <div class="text-line el" data-delay="0.58" style="width:68%"></div>
      </div>
    </div>
    <div id="progress-bar"></div>
  </div>

  <div id="void-msg">
    <p>∅ nothing remains ∅</p>
    <button id="reset-btn" onclick="resetPage()">begin again</button>
  </div>
</div>

<script>
  const container = document.getElementById('scroll-container');
  const stage = document.getElementById('stage');
  const els = Array.from(document.querySelectorAll('.el'));
  const progressBar = document.getElementById('progress-bar');
  const voidMsg = document.getElementById('void-msg');
  const resetBtn = document.getElementById('reset-btn');
  const entropyLabel = document.getElementById('entropy-label');
  const snakeSvg = document.getElementById('snake-svg');
  const snakeTail = document.getElementById('snake-tail');

  let consumed = false;

  function easeIn(t) { return t * t * t; }

  function update() {
    const scrollTop = container.scrollTop;
    const maxScroll = container.scrollHeight - container.clientHeight;
    const raw = maxScroll > 0 ? scrollTop / maxScroll : 0;
    const pct = Math.min(1, raw);

    progressBar.style.width = (pct * 100) + '%';
    entropyLabel.textContent = 'entropy ' + Math.round(pct * 100) + '%';

    const angle = pct * 360;
    snakeTail.setAttribute('transform', `rotate(${angle}, 40, 73)`);

    els.forEach(el => {
      const delay = parseFloat(el.dataset.delay) || 0;
      const local = Math.max(0, (pct - delay) / (1 - delay));
      const eased = easeIn(Math.min(1, local * 1.4));

      const opacity = 1 - eased;
      const scale = 1 - eased * 0.12;
      const blur = eased * 6;

      el.style.opacity = opacity;
      el.style.transform = `scale(${scale})`;
      el.style.filter = `blur(${blur.toFixed(1)}px)`;
    });

    if (pct >= 0.98 && !consumed) {
      consumed = true;
      setTimeout(() => {
        stage.style.visibility = 'hidden';
        voidMsg.style.opacity = '1';
        voidMsg.style.pointerEvents = 'auto';
        resetBtn.style.opacity = '1';
        resetBtn.style.pointerEvents = 'auto';
      }, 300);
    }

    if (pct < 0.95 && consumed) {
      consumed = false;
      stage.style.visibility = 'visible';
      voidMsg.style.opacity = '0';
      voidMsg.style.pointerEvents = 'none';
      resetBtn.style.opacity = '0';
      resetBtn.style.pointerEvents = 'none';
    }
  }

  function resetPage() {
    container.scrollTo({ top: 0, behavior: 'smooth' });
  }

  container.addEventListener('scroll', update, { passive: true });
  update();
</script>
