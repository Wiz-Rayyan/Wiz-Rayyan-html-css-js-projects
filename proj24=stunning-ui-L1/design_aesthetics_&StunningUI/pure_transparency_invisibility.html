
<style>
  @keyframes fadeToNothing {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  @keyframes dissolve {
    0% { opacity: 0.8; letter-spacing: 0em; }
    100% { opacity: 0; letter-spacing: 0.4em; }
  }
  @keyframes ghostIn {
    0% { opacity: 0; }
    50% { opacity: 0.12; }
    100% { opacity: 0; }
  }
  .ghost-text {
    animation: ghostIn 4s ease-in-out infinite;
  }
  .dissolving {
    animation: dissolve 3s ease-in forwards;
  }
  .cursor {
    display: inline-block;
    animation: blink 1s step-end infinite;
  }
</style>

<h2 class="sr-only">Pure Transparency / Invisibility — a conceptual art piece where all content fades to nothing</h2>

<div style="min-height: 480px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; padding: 2rem;">

  <div id="stage" style="text-align: center; position: relative; width: 100%;">

    <p style="font-size: 11px; letter-spacing: 0.25em; color: var(--color-text-tertiary); text-transform: uppercase; margin: 0 0 3rem; opacity: 0.4;">
      a meditation on absence
    </p>

    <div id="title-block" style="margin-bottom: 3rem;">
      <h1 id="main-title" style="font-size: 42px; font-weight: 500; letter-spacing: -0.02em; color: var(--color-text-primary); margin: 0; transition: opacity 2s ease, letter-spacing 2s ease;">
        Everything
      </h1>
      <p id="sub-title" style="font-size: 16px; color: var(--color-text-secondary); margin: 0.5rem 0 0; transition: opacity 2s ease;">
        is here<span class="cursor">_</span>
      </p>
    </div>

    <div id="ghost-container" style="height: 120px; position: relative; display: flex; align-items: center; justify-content: center;">
      <p class="ghost-text" style="font-size: 13px; color: var(--color-text-secondary); letter-spacing: 0.15em; position: absolute; text-align: center; animation-delay: 0s;">
        background: transparent
      </p>
      <p class="ghost-text" style="font-size: 13px; color: var(--color-text-secondary); letter-spacing: 0.15em; position: absolute; text-align: center; animation-delay: 1.3s; animation-duration: 5s;">
        color: transparent
      </p>
      <p class="ghost-text" style="font-size: 13px; color: var(--color-text-secondary); letter-spacing: 0.15em; position: absolute; text-align: center; animation-delay: 2.6s; animation-duration: 6s;">
        border: none
      </p>
      <p class="ghost-text" style="font-size: 13px; color: var(--color-text-secondary); letter-spacing: 0.15em; position: absolute; text-align: center; animation-delay: 3.9s; animation-duration: 4.5s;">
        opacity: 0
      </p>
      <p class="ghost-text" style="font-size: 13px; color: var(--color-text-secondary); letter-spacing: 0.15em; position: absolute; text-align: center; animation-delay: 5.2s; animation-duration: 5.5s;">
        visibility: hidden
      </p>
    </div>

    <div style="margin-top: 2rem; display: flex; align-items: center; justify-content: center; gap: 1.5rem;">
      <button id="btn-vanish" onclick="startVanish()" style="font-size: 13px; letter-spacing: 0.05em; padding: 8px 20px;">
        vanish
      </button>
      <button id="btn-restore" onclick="restore()" style="font-size: 13px; letter-spacing: 0.05em; padding: 8px 20px; opacity: 0; pointer-events: none; transition: opacity 0.8s;">
        reappear
      </button>
    </div>

    <p id="after-note" style="margin-top: 3rem; font-size: 12px; color: var(--color-text-tertiary); opacity: 0; transition: opacity 2s ease; letter-spacing: 0.08em;">
      the page exists. there is nothing to see.
    </p>
  </div>

</div>

<script>
  let vanished = false;
  let vanishTimer = null;

  function startVanish() {
    if (vanished) return;
    vanished = true;

    const title = document.getElementById('main-title');
    const sub = document.getElementById('sub-title');
    const ghostC = document.getElementById('ghost-container');
    const btnV = document.getElementById('btn-vanish');
    const btnR = document.getElementById('btn-restore');
    const note = document.getElementById('after-note');
    const ghosts = document.querySelectorAll('.ghost-text');

    title.style.opacity = '0';
    title.style.letterSpacing = '0.3em';
    sub.style.opacity = '0';

    setTimeout(() => {
      ghosts.forEach(g => {
        g.style.transition = 'opacity 1.5s ease';
        g.style.opacity = '0';
      });
    }, 400);

    setTimeout(() => {
      btnV.style.opacity = '0';
      btnV.style.pointerEvents = 'none';
      btnV.style.transition = 'opacity 0.8s';
    }, 1200);

    setTimeout(() => {
      ghostC.style.transition = 'opacity 1s ease';
      ghostC.style.opacity = '0';
    }, 1800);

    setTimeout(() => {
      note.style.opacity = '1';
      btnR.style.opacity = '0.5';
      btnR.style.pointerEvents = 'auto';
    }, 3200);
  }

  function restore() {
    vanished = false;

    const title = document.getElementById('main-title');
    const sub = document.getElementById('sub-title');
    const ghostC = document.getElementById('ghost-container');
    const btnV = document.getElementById('btn-vanish');
    const btnR = document.getElementById('btn-restore');
    const note = document.getElementById('after-note');
    const ghosts = document.querySelectorAll('.ghost-text');

    note.style.opacity = '0';
    btnR.style.opacity = '0';
    btnR.style.pointerEvents = 'none';

    setTimeout(() => {
      ghostC.style.opacity = '1';
      ghosts.forEach(g => {
        g.style.transition = '';
        g.style.opacity = '';
      });
    }, 500);

    setTimeout(() => {
      title.style.opacity = '1';
      title.style.letterSpacing = '-0.02em';
      sub.style.opacity = '1';
    }, 1000);

    setTimeout(() => {
      btnV.style.opacity = '1';
      btnV.style.pointerEvents = 'auto';
    }, 1800);
  }
</script>
