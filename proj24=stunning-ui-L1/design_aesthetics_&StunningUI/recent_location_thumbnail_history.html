
<style>
*{box-sizing:border-box;margin:0;padding:0}
.app{padding:1.5rem;max-width:680px;font-family:var(--font-sans)}
.search-wrap{position:relative;margin-bottom:1rem}
.search-bar{width:100%;height:44px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:0 44px 0 44px;font-size:15px;background:var(--color-background-primary);color:var(--color-text-primary);outline:none;transition:border-color .15s,box-shadow .15s}
.search-bar:focus{border-color:var(--color-border-primary);box-shadow:0 0 0 3px rgba(100,100,255,.08)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--color-text-tertiary);font-size:18px;pointer-events:none}
.recent-panel{overflow:hidden;transition:max-height .3s ease,opacity .3s ease;max-height:0;opacity:0}
.recent-panel.open{max-height:600px;opacity:1}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 10px}
.panel-label{font-size:12px;font-weight:500;color:var(--color-text-tertiary);letter-spacing:.04em;text-transform:uppercase}
.clear-btn{font-size:12px;color:var(--color-text-secondary);background:none;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:4px 10px;cursor:pointer;transition:background .15s,color .15s}
.clear-btn:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}
.cards-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s;user-select:none;position:relative}
.card:hover{transform:translateY(-4px);border-color:var(--color-border-secondary);box-shadow:0 8px 24px rgba(0,0,0,.10)}
.card.deleting{animation:fadeOut .35s ease forwards}
@keyframes fadeOut{to{opacity:0;transform:scale(.92) translateY(-4px)}}
.card.flying{animation:pulse .4s ease}
@keyframes pulse{0%,100%{border-color:var(--color-border-tertiary)}50%{border-color:#7F77DD;box-shadow:0 0 0 3px rgba(127,119,221,.18)}}
.map-preview{width:100%;height:72px;display:block;position:relative;overflow:hidden}
.map-canvas{width:100%;height:100%;display:block}
.card-info{padding:8px 10px 9px}
.card-name{font-size:13px;font-weight:500;color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.card-time{font-size:11px;color:var(--color-text-tertiary);margin-top:2px}
.long-hint{position:absolute;bottom:6px;right:7px;font-size:10px;color:var(--color-text-tertiary);opacity:0;transition:opacity .2s}
.card:hover .long-hint{opacity:1}
.empty-state{padding:1.5rem;text-align:center;color:var(--color-text-tertiary);font-size:13px}
.fly-toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(60px);background:var(--color-text-primary);color:var(--color-background-primary);font-size:13px;padding:8px 18px;border-radius:var(--border-radius-lg);opacity:0;transition:opacity .2s,transform .25s;pointer-events:none;white-space:nowrap;z-index:999}
.fly-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<h2 class="sr-only">Recent location thumbnail history widget — search bar shows last 8 locations as mini map cards</h2>
<div class="app">
  <div class="search-wrap">
    <i class="ti ti-search search-icon" aria-hidden="true"></i>
    <input class="search-bar" id="searchBar" type="text" placeholder="Search for a place…" autocomplete="off" aria-label="Search locations">
  </div>
  <div class="recent-panel" id="recentPanel" role="region" aria-label="Recent locations">
    <div class="panel-header">
      <span class="panel-label">Recent</span>
      <button class="clear-btn" id="clearBtn" aria-label="Clear all recent locations">Clear all</button>
    </div>
    <div class="cards-grid" id="cardsGrid"></div>
  </div>
</div>
<div class="fly-toast" id="flyToast" aria-live="polite"></div>
<script>
const DEFAULTS=[
  {name:"Mumbai, Maharashtra",time:Date.now()-7200000,color:"#1D9E75",accent:"#0F6E56",dots:[[20,35],[60,25],[100,40],[140,30],[80,55],[40,60]]},
  {name:"Bandra West",time:Date.now()-18000000,color:"#378ADD",accent:"#185FA5",dots:[[30,50],[70,30],[110,45],[50,65],[130,55],[90,25]]},
  {name:"Gateway of India",time:Date.now()-86400000,color:"#BA7517",accent:"#854F0B",dots:[[55,40],[90,60],[120,30],[35,55],[70,70],[110,20]]},
  {name:"Chhatrapati Shivaji Airport",time:Date.now()-172800000,color:"#7F77DD",accent:"#534AB7",dots:[[40,45],[85,25],[115,50],[60,65],[100,35],[30,30]]},
  {name:"Juhu Beach",time:Date.now()-259200000,color:"#D85A30",accent:"#993C1D",dots:[[25,60],[65,35],[95,55],[125,40],[50,70],[80,20]]},
  {name:"Dharavi",time:Date.now()-345600000,color:"#1D9E75",accent:"#0F6E56",dots:[[45,55],[80,30],[115,45],[35,65],[70,50],[105,25]]},
  {name:"Powai Lake",time:Date.now()-432000000,color:"#378ADD",accent:"#185FA5",dots:[[30,40],[75,60],[110,35],[55,55],[90,70],[120,25]]},
  {name:"Colaba Causeway",time:Date.now()-518400000,color:"#D4537E",accent:"#993556",dots:[[50,35],[85,55],[120,40],[40,60],[75,25],[110,65]]}
];
const STORAGE_KEY="recent_locations_v1";
function load(){try{const d=localStorage.getItem(STORAGE_KEY);return d?JSON.parse(d):DEFAULTS.slice()}catch{return DEFAULTS.slice()}}
function save(d){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}catch{}}
let locations=load();
function timeAgo(ts){const d=Date.now()-ts,m=Math.floor(d/60000),h=Math.floor(d/3600000),dy=Math.floor(d/86400000);if(m<1)return"Just now";if(m<60)return m+"m ago";if(h<24)return h+" hr ago";return dy+" day"+(dy>1?"s":"")+" ago"}
function drawMap(canvas,cfg){const ctx=canvas.getContext("2d");const w=canvas.width=canvas.offsetWidth||140,h=canvas.height=72;const bg=window.matchMedia("(prefers-color-scheme:dark)").matches?"#1e1e1e":"#f0ede6";ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);ctx.strokeStyle=cfg.color+"55";ctx.lineWidth=1.5;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(0,15+i*22);for(let x=0;x<=w;x+=12)ctx.lineTo(x,15+i*22+Math.sin(x*.18+i)*4);ctx.stroke()}ctx.strokeStyle=cfg.color+"88";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,h*.55);for(let x=0;x<=w;x+=8)ctx.lineTo(x,h*.55+Math.cos(x*.12)*9-Math.sin(x*.07)*5);ctx.stroke();ctx.fillStyle=cfg.accent+"33";ctx.fillRect(w*.3,10,w*.25,h*.4);ctx.strokeStyle=cfg.accent+"55";ctx.lineWidth=0.5;ctx.strokeRect(w*.3,10,w*.25,h*.4);ctx.fillStyle=cfg.color+"22";ctx.fillRect(w*.6,h*.2,w*.3,h*.5);ctx.strokeStyle=cfg.color+"44";ctx.lineWidth=0.5;ctx.strokeRect(w*.6,h*.2,w*.3,h*.5);const mx=w*.5,my=h*.38;ctx.fillStyle=cfg.accent;ctx.beginPath();ctx.arc(mx,my,5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(mx,my,2,0,Math.PI*2);ctx.fill();ctx.strokeStyle=cfg.accent;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(mx,my+5);ctx.lineTo(mx,my+10);ctx.stroke()}
function renderCards(){const grid=document.getElementById("cardsGrid");grid.innerHTML="";if(!locations.length){grid.innerHTML='<div class="empty-state" style="grid-column:1/-1">No recent locations</div>';return}
locations.forEach((loc,idx)=>{const card=document.createElement("div");card.className="card";card.setAttribute("role","button");card.setAttribute("tabindex","0");card.setAttribute("aria-label","Go to "+loc.name);card.innerHTML=`<div class="map-preview"><canvas class="map-canvas" aria-hidden="true"></canvas></div><div class="card-info"><div class="card-name"><i class="ti ti-map-pin" style="font-size:12px;color:${loc.color};flex-shrink:0" aria-hidden="true"></i><span>${loc.name}</span></div><div class="card-time">${timeAgo(loc.time)}</div></div><span class="long-hint" aria-hidden="true">Hold to remove</span>`;
const canvas=card.querySelector(".map-canvas");setTimeout(()=>drawMap(canvas,loc),0);
card.addEventListener("click",()=>{card.classList.add("flying");showToast("Flying to "+loc.name);setTimeout(()=>card.classList.remove("flying"),420)});
let pressTimer=null;card.addEventListener("pointerdown",()=>{pressTimer=setTimeout(()=>deleteCard(idx,card),700)});
card.addEventListener("pointerup",()=>{if(pressTimer)clearTimeout(pressTimer);pressTimer=null});
card.addEventListener("pointerleave",()=>{if(pressTimer)clearTimeout(pressTimer);pressTimer=null});
grid.appendChild(card)})}
function deleteCard(idx,card){card.classList.add("deleting");setTimeout(()=>{locations.splice(idx,1);save(locations);renderCards()},350)}
function showToast(msg){const t=document.getElementById("flyToast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000)}
const searchBar=document.getElementById("searchBar");const panel=document.getElementById("recentPanel");
searchBar.addEventListener("focus",()=>panel.classList.add("open"));
searchBar.addEventListener("blur",()=>setTimeout(()=>panel.classList.remove("open"),200));
document.getElementById("clearBtn").addEventListener("click",()=>{locations=[];save(locations);renderCards()});
renderCards();
window.matchMedia("(prefers-color-scheme:dark)").addEventListener("change",renderCards);
</script>
