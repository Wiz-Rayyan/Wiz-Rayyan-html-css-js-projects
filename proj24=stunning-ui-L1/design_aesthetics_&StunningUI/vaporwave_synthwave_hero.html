<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0010;
    overflow: hidden;
    font-family: 'Orbitron', monospace;
  }

  .scene {
    position: relative;
    width: 680px;
    height: 480px;
    overflow: hidden;
  }

  /* Sky gradient */
  .sky {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      #0a0020 0%,
      #1a0040 20%,
      #3d0070 38%,
      #8b006a 52%,
      #cc1177 62%,
      #ff4488 72%,
      #ffaa44 82%,
      #ffdd88 88%,
      #fff4cc 93%
    );
  }

  /* Sun */
  .sun-wrap {
    position: absolute;
    left: 50%;
    top: 58%;
    transform: translateX(-50%);
    width: 160px;
    height: 80px;
    overflow: hidden;
  }
  .sun {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: linear-gradient(180deg, #fff8cc 0%, #ffee44 30%, #ffaa00 60%, #ff6600 100%);
    box-shadow: 0 0 60px 30px rgba(255,200,0,0.5), 0 0 120px 60px rgba(255,100,0,0.3);
    position: relative;
  }
  /* Horizontal lines across sun */
  .sun-lines {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 50%;
    background: repeating-linear-gradient(
      180deg,
      transparent 0px,
      transparent 8px,
      rgba(180,40,0,0.45) 8px,
      rgba(180,40,0,0.45) 10px
    );
  }

  /* Horizon glow */
  .horizon {
    position: absolute;
    top: 62%;
    left: 0; right: 0;
    height: 40px;
    background: linear-gradient(180deg, rgba(255,180,60,0.6) 0%, rgba(255,100,200,0.2) 60%, transparent 100%);
  }

  /* Grid floor */
  .floor {
    position: absolute;
    top: 68%;
    left: 0; right: 0;
    bottom: 0;
    background: #0a0020;
    overflow: hidden;
  }
  .grid-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  /* Scanlines overlay */
  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      180deg,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.12) 3px,
      rgba(0,0,0,0.12) 4px
    );
    pointer-events: none;
    z-index: 20;
  }

  /* Statue */
  .statue {
    position: absolute;
    bottom: 30%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    opacity: 0.85;
  }

  /* Title */
  .title-wrap {
    position: absolute;
    top: 6%;
    left: 0; right: 0;
    text-align: center;
    z-index: 15;
  }
  .title-main {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 8px;
    color: #ff44cc;
    text-shadow:
      0 0 8px #ff44cc,
      0 0 20px #ff44cc,
      0 0 40px #ff00aa,
      0 0 80px #aa0077;
    text-transform: uppercase;
    display: block;
    animation: glitch 4s infinite;
  }
  .title-sub {
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 12px;
    color: #44ffee;
    text-shadow:
      0 0 6px #44ffee,
      0 0 16px #00ccbb,
      0 0 30px #009988;
    text-transform: uppercase;
    margin-top: 4px;
    display: block;
  }

  /* Side text */
  .side-text {
    position: absolute;
    z-index: 15;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .side-left {
    left: 20px;
    top: 50%;
    transform: translateY(-50%) rotate(-90deg);
    transform-origin: center center;
    color: #aa44ff;
    text-shadow: 0 0 8px #aa44ff;
  }
  .side-right {
    right: 20px;
    top: 50%;
    transform: translateY(-50%) rotate(90deg);
    transform-origin: center center;
    color: #ff6622;
    text-shadow: 0 0 8px #ff6622;
  }

  /* Bottom bar */
  .bottom-bar {
    position: absolute;
    bottom: 12px;
    left: 0; right: 0;
    text-align: center;
    z-index: 15;
    font-size: 9px;
    letter-spacing: 5px;
    color: #ff44cc;
    text-shadow: 0 0 6px #ff44cc;
    text-transform: uppercase;
  }

  /* Glitch animation */
  @keyframes glitch {
    0%, 92%, 100% { text-shadow: 0 0 8px #ff44cc, 0 0 20px #ff44cc, 0 0 40px #ff00aa, 0 0 80px #aa0077; transform: none; }
    93% { text-shadow: -3px 0 #00ffee, 3px 0 #ff0066, 0 0 20px #ff44cc; transform: skewX(-2deg) translateX(2px); }
    94% { text-shadow: 3px 0 #00ffee, -3px 0 #ff0066, 0 0 20px #ff44cc; transform: skewX(1deg) translateX(-2px); }
    95% { text-shadow: 0 0 8px #ff44cc, 0 0 20px #ff44cc, 0 0 40px #ff00aa; transform: none; }
    96% { text-shadow: -2px 0 #00ffee, 2px 0 #ff0066; transform: skewX(-1deg); }
    97% { text-shadow: 0 0 8px #ff44cc, 0 0 20px #ff44cc, 0 0 40px #ff00aa; transform: none; }
  }

  /* Grid pulse */
  @keyframes gridPulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }
  .grid-svg { animation: gridPulse 3s ease-in-out infinite; }
</style>
</head>
<body>
<div class="scene">

  <div class="sky"></div>

  <!-- Sun -->
  <div class="sun-wrap">
    <div class="sun"><div class="sun-lines"></div></div>
  </div>

  <div class="horizon"></div>

  <!-- Grid floor -->
  <div class="floor">
    <svg class="grid-svg" viewBox="0 0 680 160" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff00cc" stop-opacity="0.9"/>
          <stop offset="60%" stop-color="#aa00ff" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#440088" stop-opacity="0.2"/>
        </linearGradient>
      </defs>
      <!-- Horizontal lines — perspective spacing (closer = wider gaps) -->
      <line x1="0" y1="4"   x2="680" y2="4"   stroke="url(#gridFade)" stroke-width="0.5"/>
      <line x1="0" y1="10"  x2="680" y2="10"  stroke="url(#gridFade)" stroke-width="0.5"/>
      <line x1="0" y1="18"  x2="680" y2="18"  stroke="url(#gridFade)" stroke-width="0.6"/>
      <line x1="0" y1="28"  x2="680" y2="28"  stroke="url(#gridFade)" stroke-width="0.7"/>
      <line x1="0" y1="42"  x2="680" y2="42"  stroke="url(#gridFade)" stroke-width="0.8"/>
      <line x1="0" y1="60"  x2="680" y2="60"  stroke="url(#gridFade)" stroke-width="1"/>
      <line x1="0" y1="84"  x2="680" y2="84"  stroke="url(#gridFade)" stroke-width="1.2"/>
      <line x1="0" y1="114" x2="680" y2="114" stroke="url(#gridFade)" stroke-width="1.4"/>
      <line x1="0" y1="150" x2="680" y2="150" stroke="url(#gridFade)" stroke-width="1.6"/>
      <!-- Vertical lines converging to vanishing point at center top -->
      <line x1="340" y1="0" x2="0"   y2="160" stroke="url(#gridFade)" stroke-width="0.5"/>
      <line x1="340" y1="0" x2="44"  y2="160" stroke="url(#gridFade)" stroke-width="0.5"/>
      <line x1="340" y1="0" x2="90"  y2="160" stroke="url(#gridFade)" stroke-width="0.5"/>
      <line x1="340" y1="0" x2="140" y2="160" stroke="url(#gridFade)" stroke-width="0.5"/>
      <line x1="340" y1="0" x2="196" y2="160" stroke="url(#gridFade)" stroke-width="0.5"/>
      <line x1="340" y1="0" x2="260" y2="160" stroke="url(#gridFade)" stroke-width="0.5"/>
      <line x1="340" y1="0" x2="340" y2="160" stroke="url(#gridFade)" stroke-width="0.5"/>
      <line x1="340" y1="0" x2="420" y2="160" stroke="url(#gridFade)" stroke-width="0.5"/>
      <line x1="340" y1="0" x2="484" y2="160" stroke="url(#gridFade)" stroke-width="0.5"/>
      <line x1="340" y1="0" x2="540" y2="160" stroke="url(#gridFade)" stroke-width="0.5"/>
      <line x1="340" y1="0" x2="590" y2="160" stroke="url(#gridFade)" stroke-width="0.5"/>
      <line x1="340" y1="0" x2="636" y2="160" stroke="url(#gridFade)" stroke-width="0.5"/>
      <line x1="340" y1="0" x2="680" y2="160" stroke="url(#gridFade)" stroke-width="0.5"/>
    </svg>
  </div>

  <!-- Statue SVG silhouette (classical bust) -->
  <div class="statue">
    <svg width="110" height="190" viewBox="0 0 110 190" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="statueGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#220044"/>
          <stop offset="40%" stop-color="#3d006a"/>
          <stop offset="100%" stop-color="#110022"/>
        </linearGradient>
      </defs>
      <!-- Pedestal -->
      <rect x="15" y="162" width="80" height="28" rx="2" fill="url(#statueGrad)" opacity="0.95"/>
      <rect x="20" y="155" width="70" height="12" rx="2" fill="url(#statueGrad)" opacity="0.9"/>
      <!-- Torso / shoulders -->
      <path d="M28 152 Q20 140 18 120 Q16 100 22 90 Q26 82 30 78 L80 78 Q84 82 88 90 Q94 100 92 120 Q90 140 82 152 Z"
            fill="url(#statueGrad)" opacity="0.95"/>
      <!-- Neck -->
      <rect x="44" y="62" width="22" height="20" rx="4" fill="url(#statueGrad)" opacity="0.95"/>
      <!-- Head -->
      <ellipse cx="55" cy="46" rx="24" ry="28" fill="url(#statueGrad)" opacity="0.95"/>
      <!-- Hair / laurel suggestion -->
      <ellipse cx="55" cy="22" rx="26" ry="10" fill="#1a0030" opacity="0.9"/>
      <ellipse cx="32" cy="30" rx="9" ry="6" fill="#1a0030" opacity="0.85"/>
      <ellipse cx="78" cy="30" rx="9" ry="6" fill="#1a0030" opacity="0.85"/>
      <!-- Face shadow details -->
      <ellipse cx="47" cy="44" rx="4" ry="5" fill="#110022" opacity="0.5"/>
      <ellipse cx="63" cy="44" rx="4" ry="5" fill="#110022" opacity="0.5"/>
      <path d="M48 56 Q55 60 62 56" stroke="#110022" stroke-width="1.5" fill="none" opacity="0.5"/>
      <!-- Subtle neon rim light -->
      <ellipse cx="55" cy="46" rx="24" ry="28" fill="none" stroke="#cc00ff" stroke-width="1" opacity="0.4"/>
      <path d="M28 152 Q20 140 18 120 Q16 100 22 90 Q26 82 30 78 L80 78 Q84 82 88 90 Q94 100 92 120 Q90 140 82 152 Z"
            fill="none" stroke="#cc00ff" stroke-width="0.8" opacity="0.3"/>
    </svg>
  </div>

  <!-- Neon palm trees (left) -->
  <svg style="position:absolute;bottom:28%;left:30px;z-index:9;" width="60" height="120" viewBox="0 0 60 120" xmlns="http://www.w3.org/2000/svg">
    <line x1="30" y1="120" x2="30" y2="40" stroke="#ff0088" stroke-width="2" opacity="0.6"/>
    <path d="M30 40 Q10 20 0 10" stroke="#ff0088" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M30 40 Q50 20 60 8" stroke="#ff0088" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M30 50 Q5 38 -5 28" stroke="#ff0088" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M30 50 Q55 38 65 28" stroke="#ff0088" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M30 60 Q12 52 4 44" stroke="#ff0088" stroke-width="1" fill="none" opacity="0.35"/>
    <path d="M30 60 Q48 52 56 44" stroke="#ff0088" stroke-width="1" fill="none" opacity="0.35"/>
  </svg>

  <!-- Neon palm trees (right) -->
  <svg style="position:absolute;bottom:28%;right:30px;z-index:9;" width="60" height="120" viewBox="0 0 60 120" xmlns="http://www.w3.org/2000/svg">
    <line x1="30" y1="120" x2="30" y2="40" stroke="#00ccff" stroke-width="2" opacity="0.6"/>
    <path d="M30 40 Q10 20 0 10" stroke="#00ccff" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M30 40 Q50 20 60 8" stroke="#00ccff" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M30 50 Q5 38 -5 28" stroke="#00ccff" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M30 50 Q55 38 65 28" stroke="#00ccff" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M30 60 Q12 52 4 44" stroke="#00ccff" stroke-width="1" fill="none" opacity="0.35"/>
    <path d="M30 60 Q48 52 56 44" stroke="#00ccff" stroke-width="1" fill="none" opacity="0.35"/>
  </svg>

  <!-- Title -->
  <div class="title-wrap">
    <span class="title-main">VAPORWAVE</span>
    <span class="title-sub">∞ &nbsp; Eternal &nbsp; Summer &nbsp; ∞</span>
  </div>

  <!-- Side text -->
  <div class="side-text side-left">A E S T H E T I C &nbsp; · &nbsp; 1 9 8 4</div>
  <div class="side-text side-right">S Y N T H W A V E &nbsp; · &nbsp; V O L . 1</div>

  <!-- Bottom text -->
  <div class="bottom-bar">▲ &nbsp; D R E A M S &nbsp; O F &nbsp; T H E &nbsp; P A S T &nbsp; F U T U R E &nbsp; ▲</div>

  <!-- Scanlines -->
  <div class="scanlines"></div>

</div>
</body>
</html>
