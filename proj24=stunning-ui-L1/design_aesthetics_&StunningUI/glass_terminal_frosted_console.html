
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

  .gt-root {
    width: 100%;
    min-height: 540px;
    background: linear-gradient(135deg, #0d0221 0%, #1a0533 20%, #0a1628 40%, #0d2b1a 60%, #1f0a2e 80%, #0a0a1a 100%);
    border-radius: 20px;
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  .gt-root::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -20%;
    width: 60%;
    height: 120%;
    background: radial-gradient(ellipse, rgba(120,60,255,0.18) 0%, transparent 65%);
    pointer-events: none;
  }

  .gt-root::after {
    content: '';
    position: absolute;
    bottom: -30%;
    right: -10%;
    width: 55%;
    height: 80%;
    background: radial-gradient(ellipse, rgba(0,200,120,0.14) 0%, transparent 65%);
    pointer-events: none;
  }

  .gt-window {
    flex: 1;
    background: rgba(0,0,0,0.58);
    border: 1px solid rgba(255,255,255,0.13);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .gt-titlebar {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    background: rgba(255,255,255,0.03);
    gap: 8px;
    flex-shrink: 0;
  }

  .gt-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }
  .gt-dot.red   { background: #ff5f56; }
  .gt-dot.yellow{ background: #ffbd2e; }
  .gt-dot.green { background: #27c93f; }

  .gt-title {
    flex: 1;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.08em;
    margin-left: -52px;
  }

  .gt-output {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.7;
    color: rgba(200,210,220,0.9);
    min-height: 300px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.1) transparent;
  }

  .gt-line {
    display: block;
    white-space: pre-wrap;
    word-break: break-all;
    opacity: 1;
    transition: opacity 0.5s ease;
  }

  .gt-line.dissolve {
    opacity: 0;
  }

  .gt-line.success {
    animation: flash-green 0.6s ease;
  }

  .gt-line.error {
    animation: shake-red 0.5s ease;
    color: #ff6b6b;
  }

  .gt-line.system-msg {
    color: rgba(100, 200, 255, 0.7);
    font-size: 11px;
  }

  .gt-line.success-msg {
    color: #4dffaa;
  }

  .gt-line.error-msg {
    color: #ff6b6b;
  }

  .gt-line.dim {
    color: rgba(150,170,180,0.45);
  }

  @keyframes flash-green {
    0%   { background: transparent; color: rgba(200,210,220,0.9); }
    25%  { background: rgba(0,255,120,0.12); color: #5dffb0; }
    100% { background: transparent; color: rgba(200,210,220,0.9); }
  }

  @keyframes shake-red {
    0%   { transform: translateX(0);   background: transparent; }
    15%  { transform: translateX(-5px); background: rgba(255,60,60,0.10); }
    35%  { transform: translateX(5px);  background: rgba(255,60,60,0.14); }
    55%  { transform: translateX(-3px); background: rgba(255,60,60,0.10); }
    75%  { transform: translateX(3px); }
    100% { transform: translateX(0);   background: transparent; }
  }

  .gt-input-row {
    display: flex;
    align-items: center;
    padding: 10px 20px 14px;
    gap: 8px;
    border-top: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
  }

  .gt-prompt-symbol {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    color: #00ffaa;
    text-shadow: 0 0 8px rgba(0,255,170,0.9), 0 0 20px rgba(0,255,170,0.4);
    flex-shrink: 0;
    animation: pulse-prompt 2.5s ease-in-out infinite;
    user-select: none;
  }

  @keyframes pulse-prompt {
    0%,100% { text-shadow: 0 0 6px rgba(0,255,170,0.8), 0 0 18px rgba(0,255,170,0.3); }
    50%      { text-shadow: 0 0 12px rgba(0,255,170,1),   0 0 28px rgba(0,255,170,0.6); }
  }

  .gt-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: rgba(210,225,235,0.95);
    caret-color: #00ffaa;
  }

  .gt-input::placeholder {
    color: rgba(255,255,255,0.2);
  }

  .char-cascade {
    display: inline;
    opacity: 0;
    animation: char-in 0.12s ease forwards;
  }

  @keyframes char-in {
    from { opacity: 0; transform: translateY(3px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .gt-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: rgba(255,255,255,0.18);
    padding: 0 20px 10px;
    flex-shrink: 0;
  }

  .gt-hint span {
    color: rgba(0,200,255,0.5);
  }
</style>

<div class="gt-root" id="gtRoot">
  <div class="gt-window">
    <div class="gt-titlebar">
      <div class="gt-dot red"></div>
      <div class="gt-dot yellow"></div>
      <div class="gt-dot green"></div>
      <div class="gt-title">glass-terminal — ~/projects</div>
    </div>
    <div class="gt-output" id="gtOutput"></div>
    <div class="gt-input-row">
      <span class="gt-prompt-symbol">❯</span>
      <input class="gt-input" id="gtInput" type="text" placeholder="type a command..." autocomplete="off" spellcheck="false" />
    </div>
    <div class="gt-hint">try: <span>help</span> · <span>ls</span> · <span>whoami</span> · <span>neofetch</span> · <span>clear</span></div>
  </div>
</div>

<script>
(function(){
  const output = document.getElementById('gtOutput');
  const input  = document.getElementById('gtInput');

  const BOOT = [
    { text: '  ██████╗ ██╗      █████╗ ███████╗███████╗', cls: 'dim' },
    { text: '██╔════╝ ██║     ██╔══██╗██╔════╝██╔════╝', cls: 'dim' },
    { text: '██║  ███╗██║     ███████║███████╗███████╗', cls: 'dim' },
    { text: '██║   ██║██║     ██╔══██║╚════██║╚════██║', cls: 'dim' },
    { text: '╚██████╔╝███████╗██║  ██║███████║███████║', cls: 'dim' },
    { text: ' ╚═════╝ ╚══════╝╚═╝  ╚═╝╚══════╝╚══════╝', cls: 'dim' },
    { text: '' },
    { text: '✦ Glass Terminal v2.4.1  — frosted edition ✦', cls: 'system-msg' },
    { text: 'session started  •  kernel 6.8.0-glass  •  uptime 0s', cls: 'dim' },
    { text: '' },
    { text: 'Type help for available commands.', cls: 'system-msg' },
    { text: '' },
  ];

  const CMDS = {
    help: {
      fn: () => [
        { text: 'available commands:', cls: 'system-msg' },
        { text: '' },
        { text: '  ls          list directory contents', cls: 'success-msg' },
        { text: '  pwd         print working directory', cls: 'success-msg' },
        { text: '  whoami      current user info', cls: 'success-msg' },
        { text: '  neofetch    system information', cls: 'success-msg' },
        { text: '  date        current date & time', cls: 'success-msg' },
        { text: '  echo <txt>  print text to terminal', cls: 'success-msg' },
        { text: '  matrix      go deeper', cls: 'success-msg' },
        { text: '  clear       dissolve & clear screen', cls: 'success-msg' },
        { text: '' },
      ],
      success: true,
    },
    ls: {
      fn: () => [
        { text: '' },
        { text: '  \u{1F4C1} projects/    \u{1F4C1} notes/    \u{1F4C1} .config/' },
        { text: '  \u{1F4C4} readme.md   \u{1F4C4} .zshrc    \u{1F512} .ssh/' },
        { text: '' },
      ],
      success: true,
    },
    pwd: {
      fn: () => [{ text: '/home/glass/projects' }, { text: '' }],
      success: true,
    },
    whoami: {
      fn: () => [
        { text: '' },
        { text: '  user    : glass', cls: 'success-msg' },
        { text: '  uid     : 1000', cls: 'success-msg' },
        { text: '  groups  : glass sudo docker', cls: 'success-msg' },
        { text: '  shell   : /bin/zsh', cls: 'success-msg' },
        { text: '' },
      ],
      success: true,
    },
    neofetch: {
      fn: () => [
        { text: '' },
        { text: '        \',.          glass@frosted-machine', cls: 'dim' },
        { text: '      ;\'  \'.        ─────────────────────', cls: 'dim' },
        { text: '    ;\'      \'.      OS:     Glass Linux 6.8', cls: 'success-msg' },
        { text: '   ;  \\   ✦  \\     Kernel: 6.8.0-glass', cls: 'success-msg' },
        { text: '  ;    \\      \\    Shell:  zsh 5.9', cls: 'success-msg' },
        { text: '  \\     \\    /    Term:   glass-term 2.4', cls: 'success-msg' },
        { text: '   \\     \\  /     CPU:    Apple M3 Pro', cls: 'success-msg' },
        { text: '    \'.    \\/      GPU:    Metal 3 (frost)', cls: 'success-msg' },
        { text: '      \'.  /       RAM:    32 GiB', cls: 'success-msg' },
        { text: '        \'\'        Blur:   12px backdrop', cls: 'system-msg' },
        { text: '' },
      ],
      success: true,
    },
    date: {
      fn: () => [
        { text: new Date().toLocaleString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' }) },
        { text: '' },
      ],
      success: true,
    },
    matrix: {
      fn: () => [
        { text: '' },
        { text: '  Wake up, Neo...', cls: 'success-msg' },
        { text: '  The Matrix has you.', cls: 'success-msg' },
        { text: '  Follow the white rabbit. \u{1F430}', cls: 'dim' },
        { text: '' },
      ],
      success: true,
    },
    clear: {
      fn: () => null,
      success: true,
      clear: true,
    },
  };

  function addLine(text, cls, cascade) {
    const el = document.createElement('div');
    el.className = 'gt-line' + (cls ? ' ' + cls : '');
    if (cascade && text) {
      const chars = text.split('');
      chars.forEach((ch, i) => {
        const s = document.createElement('span');
        s.className = 'char-cascade';
        s.style.animationDelay = (i * 0.022) + 's';
        s.textContent = ch;
        el.appendChild(s);
      });
    } else {
      el.textContent = text || '\u00A0';
    }
    output.appendChild(el);
    output.scrollTop = output.scrollHeight;
    return el;
  }

  function clearScreen() {
    const lines = output.querySelectorAll('.gt-line');
    lines.forEach((l, i) => {
      setTimeout(() => l.classList.add('dissolve'), i * 28);
    });
    setTimeout(() => {
      output.innerHTML = '';
      addLine('screen cleared.', 'system-msg');
      addLine('');
    }, lines.length * 28 + 520);
  }

  function runCmd(raw) {
    const trimmed = raw.trim();
    if (!trimmed) return;

    const promptLine = addLine('❯  ' + trimmed, '', true);

    setTimeout(() => {
      const parts = trimmed.split(/\s+/);
      const cmd = parts[0].toLowerCase();
      const args = parts.slice(1).join(' ');

      if (cmd === 'clear') {
        clearScreen();
        return;
      }

      if (cmd === 'echo') {
        promptLine.classList.add('success');
        addLine(args || '', 'success-msg');
        addLine('');
        return;
      }

      if (CMDS[cmd]) {
        const def = CMDS[cmd];
        const lines = def.fn();
        if (def.success) promptLine.classList.add('success');
        if (lines) lines.forEach(l => addLine(l.text, l.cls || ''));
      } else {
        promptLine.classList.add('error');
        setTimeout(() => {
          addLine('bash: ' + cmd + ': command not found', 'error-msg');
          addLine('');
        }, 80);
      }
    }, trimmed.length * 22 + 60);
  }

  BOOT.forEach((l, i) => {
    setTimeout(() => addLine(l.text, l.cls || ''), i * 55);
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const val = input.value;
      input.value = '';
      runCmd(val);
    }
  });

  setTimeout(() => input.focus(), 800);
  document.getElementById('gtRoot').addEventListener('click', () => input.focus());
})();
</script>
