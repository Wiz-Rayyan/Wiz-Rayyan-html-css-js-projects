
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { background: transparent; }

  .scene {
    min-height: 620px;
    background: #1a1410;
    background-image: radial-gradient(ellipse at 20% 30%, #2a1f14 0%, transparent 50%),
                      radial-gradient(ellipse at 80% 70%, #1a0f0a 0%, transparent 50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px;
    gap: 40px;
    border-radius: 16px;
    position: relative;
    overflow: hidden;
  }

  .scene::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='4' height='4' viewBox='0 0 4 4' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='1' height='1' fill='%23ffffff' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
  }

  .row {
    display: flex;
    gap: 36px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }

  /* ── WAX SEAL BASE ── */
  .seal {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .seal:hover { transform: scale(1.06) rotate(-2deg); }

  .seal-body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 4px;
  }

  /* Drip accent behind seal */
  .drip {
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
  }

  /* ── CRIMSON SEAL ── */
  .seal-crimson .seal-body {
    width: 148px;
    height: 148px;
    border-radius: 58% 42% 52% 48% / 55% 45% 55% 45%;
    background: radial-gradient(circle at 32% 36%, #d4294a, #9b0a22 55%, #6b0016);
    box-shadow:
      inset 0 0 0 2.5px rgba(255,200,200,0.25),
      inset 0 6px 18px rgba(255,255,255,0.08),
      inset 0 -6px 18px rgba(0,0,0,0.4),
      0 8px 32px rgba(120,0,20,0.6),
      0 2px 8px rgba(0,0,0,0.5);
  }

  /* ── EMERALD SEAL ── */
  .seal-emerald .seal-body {
    width: 148px;
    height: 148px;
    border-radius: 45% 55% 60% 40% / 50% 60% 40% 50%;
    background: radial-gradient(circle at 35% 30%, #2d9a6a, #0e6644 55%, #073d28);
    box-shadow:
      inset 0 0 0 2.5px rgba(150,255,200,0.2),
      inset 0 6px 18px rgba(255,255,255,0.07),
      inset 0 -6px 18px rgba(0,0,0,0.4),
      0 8px 32px rgba(0,80,40,0.65),
      0 2px 8px rgba(0,0,0,0.5);
  }

  /* ── NAVY SEAL ── */
  .seal-navy .seal-body {
    width: 148px;
    height: 148px;
    border-radius: 52% 48% 44% 56% / 48% 52% 48% 52%;
    background: radial-gradient(circle at 38% 32%, #2e5a9c, #122960 55%, #07153a);
    box-shadow:
      inset 0 0 0 2.5px rgba(160,200,255,0.2),
      inset 0 6px 18px rgba(255,255,255,0.07),
      inset 0 -6px 18px rgba(0,0,0,0.4),
      0 8px 32px rgba(10,30,100,0.65),
      0 2px 8px rgba(0,0,0,0.5);
  }

  /* ── METALLIC RING ── */
  .seal-ring {
    position: absolute;
    inset: 8px;
    border-radius: inherit;
    border: 1.5px solid rgba(255,220,140,0.35);
    pointer-events: none;
  }

  .seal-ring::after {
    content: '';
    position: absolute;
    inset: 5px;
    border-radius: inherit;
    border: 0.5px solid rgba(255,220,140,0.15);
  }

  /* ── MONOGRAM ── */
  .seal-letter {
    font-family: 'Cinzel', serif;
    font-size: 42px;
    font-weight: 700;
    color: rgba(255, 230, 160, 0.9);
    text-shadow:
      0 1px 3px rgba(0,0,0,0.6),
      0 0 20px rgba(255,200,100,0.2);
    line-height: 1;
    letter-spacing: 0.05em;
    position: relative;
    z-index: 2;
  }

  .seal-subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(255,220,140,0.6);
    position: relative;
    z-index: 2;
  }

  /* Ribbon SVG */
  .ribbon-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 180px;
    pointer-events: none;
    z-index: 1;
    opacity: 0.18;
  }

  /* ── LABEL CARD ── */
  .seal-label {
    margin-top: 12px;
    text-align: center;
  }

  .seal-name {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: rgba(255,220,140,0.5);
    text-transform: uppercase;
  }

  /* ── HERO HORIZONTAL SEAL (large) ── */
  .seal-hero .seal-body {
    width: 200px;
    height: 200px;
    border-radius: 54% 46% 50% 50% / 52% 48% 52% 48%;
    background: radial-gradient(circle at 30% 34%, #c8832a, #92480c 52%, #5c2b05);
    box-shadow:
      inset 0 0 0 3px rgba(255,220,140,0.28),
      inset 0 8px 24px rgba(255,255,255,0.09),
      inset 0 -8px 24px rgba(0,0,0,0.45),
      0 12px 48px rgba(100,50,0,0.7),
      0 4px 12px rgba(0,0,0,0.5);
  }

  .seal-hero .seal-letter {
    font-size: 58px;
  }

  .seal-hero .seal-ring {
    inset: 10px;
    border-width: 2px;
  }

  /* ── DIVIDER ── */
  .ornament {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 480px;
  }
  .ornament-line {
    flex: 1;
    height: 0.5px;
    background: linear-gradient(90deg, transparent, rgba(255,220,140,0.3), transparent);
  }
  .ornament-diamond {
    width: 6px;
    height: 6px;
    background: rgba(255,220,140,0.4);
    transform: rotate(45deg);
  }

  /* ── BOTTOM CARD ── */
  .heritage-card {
    background: rgba(255,240,200,0.04);
    border: 0.5px solid rgba(255,220,140,0.15);
    border-radius: 12px;
    padding: 20px 32px;
    text-align: center;
    max-width: 420px;
    width: 100%;
  }

  .heritage-title {
    font-family: 'Cinzel', serif;
    font-size: 15px;
    letter-spacing: 0.25em;
    color: rgba(255,220,140,0.75);
    margin-bottom: 6px;
  }

  .heritage-body {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: rgba(255,220,140,0.4);
    letter-spacing: 0.06em;
    line-height: 1.6;
  }

  /* Emboss texture lines on seals */
  .emboss-lines {
    position: absolute;
    inset: 14px;
    border-radius: inherit;
    background: repeating-linear-gradient(
      135deg,
      transparent,
      transparent 8px,
      rgba(255,255,255,0.025) 8px,
      rgba(255,255,255,0.025) 9px
    );
    pointer-events: none;
    z-index: 0;
  }
</style>

<div class="scene">

  <!-- Three standard seals -->
  <div class="row">

    <div class="seal seal-crimson">
      <div class="seal-body">
        <div class="emboss-lines"></div>
        <div class="seal-ring"></div>
        <span class="seal-letter">R</span>
        <span class="seal-subtitle">Est. 1842</span>
      </div>
      <svg class="ribbon-wrap" viewBox="0 0 180 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 12 Q20 4 40 12 Q60 20 80 12 Q100 4 120 12 Q140 20 160 12 Q170 8 180 12" stroke="rgba(255,220,140,1)" stroke-width="8" stroke-linecap="round"/>
        <path d="M0 12 Q20 4 40 12 Q60 20 80 12 Q100 4 120 12 Q140 20 160 12 Q170 8 180 12" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="seal seal-hero seal-amber" style="--s:0">
      <div class="seal-body">
        <div class="emboss-lines"></div>
        <div class="seal-ring"></div>
        <span class="seal-letter">M</span>
        <span class="seal-subtitle">Maison Dorée</span>
      </div>
      <svg class="ribbon-wrap" style="width:220px" viewBox="0 0 220 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 12 Q25 3 50 12 Q75 21 100 12 Q125 3 150 12 Q175 21 200 12 Q210 8 220 12" stroke="rgba(255,220,140,1)" stroke-width="10" stroke-linecap="round"/>
        <path d="M0 12 Q25 3 50 12 Q75 21 100 12 Q125 3 150 12 Q175 21 200 12 Q210 8 220 12" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="seal seal-emerald">
      <div class="seal-body">
        <div class="emboss-lines"></div>
        <div class="seal-ring"></div>
        <span class="seal-letter">V</span>
        <span class="seal-subtitle">Verified</span>
      </div>
      <svg class="ribbon-wrap" viewBox="0 0 180 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 12 Q20 4 40 12 Q60 20 80 12 Q100 4 120 12 Q140 20 160 12 Q170 8 180 12" stroke="rgba(255,220,140,1)" stroke-width="8" stroke-linecap="round"/>
        <path d="M0 12 Q20 4 40 12 Q60 20 80 12 Q100 4 120 12 Q140 20 160 12 Q170 8 180 12" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>

  </div>

  <!-- Labels -->
  <div class="row" style="gap: 36px; margin-top: -24px;">
    <div class="seal-label" style="width:148px"><div class="seal-name">Crimson</div></div>
    <div class="seal-label" style="width:200px"><div class="seal-name">Amber Gold</div></div>
    <div class="seal-label" style="width:148px"><div class="seal-name">Emerald</div></div>
  </div>

  <!-- Divider ornament -->
  <div class="ornament">
    <div class="ornament-line"></div>
    <div class="ornament-diamond"></div>
    <div class="ornament-line"></div>
  </div>

  <!-- Navy seal row -->
  <div class="row">
    <div class="seal seal-navy">
      <div class="seal-body">
        <div class="emboss-lines"></div>
        <div class="seal-ring"></div>
        <span class="seal-letter">A</span>
        <span class="seal-subtitle">Atelier</span>
      </div>
      <svg class="ribbon-wrap" viewBox="0 0 180 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 12 Q20 4 40 12 Q60 20 80 12 Q100 4 120 12 Q140 20 160 12 Q170 8 180 12" stroke="rgba(255,220,140,1)" stroke-width="8" stroke-linecap="round"/>
        <path d="M0 12 Q20 4 40 12 Q60 20 80 12 Q100 4 120 12 Q140 20 160 12 Q170 8 180 12" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="heritage-card">
      <div class="heritage-title">Wax Seal · Luxe Stamp</div>
      <div class="heritage-body">Irregular form. Embossed relief.<br>Gold leaf sheen. Heritage provenance.</div>
    </div>
  </div>

</div>
