
<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Interactive tag cloud showing words sized by frequency/importance in a folksonomy style</h2>

<style>
  #cloud { padding: 1.5rem 1rem; line-height: 2.2; }
  .tag {
    display: inline-block;
    margin: 5px 7px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.2s, transform 0.15s;
    font-family: var(--font-sans);
    font-weight: 400;
    text-decoration: none;
  }
  .tag:hover { opacity: 0.65; transform: scale(1.08); }
  #topic-bar {
    display: flex; gap: 8px; flex-wrap: wrap;
    padding: 0 1rem 1rem;
  }
  #topic-bar button {
    font-size: 12px; padding: 4px 12px;
    border-radius: 20px;
  }
  #topic-bar button.active {
    background: var(--color-background-secondary);
    border-color: var(--color-border-primary);
  }
</style>

<div id="topic-bar"></div>
<div id="cloud"></div>

<script>
const pastel = [
  "#7F77DD","#1D9E75","#D85A30","#D4537E",
  "#378ADD","#639922","#BA7517","#985FA5",
  "#0F6E56","#993C1D","#185FA5","#3B6D11",
  "#534AB7","#993556","#E24B4A","#854F0B"
];

const topics = {
  "internet & web": [
    ["hyperlink",58],["browser",50],["protocol",44],["server",52],["domain",46],
    ["network",55],["bandwidth",38],["router",32],["firewall",30],["proxy",28],
    ["cache",42],["cookie",48],["session",36],["latency",34],["packet",30],
    ["DNS",44],["HTTP",52],["TCP/IP",38],["socket",32],["port",28],
    ["API",56],["REST",46],["webhook",34],["endpoint",40],["payload",36],
    ["CDN",38],["SSL",44],["HTTPS",50],["certificate",32],["encryption",46],
    ["hosting",42],["uptime",30],["deploy",40],["cloud",58],["VPN",44],
    ["URL",52],["URI",34],["redirect",36],["iframe",28],["header",40],
    ["ping",30],["traceroute",22],["subnet",24],["gateway",32],["NAT",26],
  ],
  "music": [
    ["melody",58],["harmony",52],["rhythm",56],["tempo",46],["beat",60],
    ["chord",50],["scale",44],["key",38],["pitch",42],["tone",48],
    ["bass",54],["treble",36],["clef",28],["notation",32],["measure",34],
    ["verse",56],["chorus",58],["bridge",44],["hook",52],["riff",46],
    ["solo",48],["album",56],["track",50],["playlist",58],["remix",42],
    ["producer",44],["mixing",38],["mastering",32],["studio",46],["session",34],
    ["vinyl",42],["streaming",54],["genre",50],["indie",44],["acoustic",40],
    ["synthesizer",36],["sample",40],["loop",34],["overdub",26],["reverb",30],
    ["concert",52],["setlist",36],["encore",40],["venue",44],["festival",56],
  ],
  "design": [
    ["typography",56],["layout",52],["whitespace",48],["grid",44],["hierarchy",46],
    ["contrast",54],["color",60],["palette",50],["hue",38],["saturation",34],
    ["alignment",42],["balance",46],["proximity",36],["repetition",32],["flow",44],
    ["gestalt",30],["kerning",34],["leading",30],["tracking",28],["baseline",32],
    ["serif",44],["sans-serif",52],["monospace",34],["weight",40],["italic",36],
    ["icon",50],["symbol",42],["logo",58],["brand",56],["identity",44],
    ["mockup",46],["wireframe",40],["prototype",42],["figma",52],["sketch",44],
    ["vector",48],["raster",36],["SVG",44],["pixel",38],["resolution",32],
    ["UX",58],["UI",60],["usability",46],["affordance",30],["signifier",26],
  ]
};

let currentTopic = "internet & web";

function pickColor(word) {
  let h = 0;
  for (let i = 0; i < word.length; i++) h = (h * 31 + word.charCodeAt(i)) & 0xffff;
  return pastel[h % pastel.length];
}

function render(topic) {
  const words = topics[topic];
  const min = Math.min(...words.map(w=>w[1]));
  const max = Math.max(...words.map(w=>w[1]));
  const cloud = document.getElementById('cloud');
  cloud.innerHTML = '';
  const shuffled = [...words].sort(() => Math.random() - 0.5);
  shuffled.forEach(([word, weight]) => {
    const size = 13 + Math.round(((weight - min) / (max - min)) * 46);
    const a = document.createElement('span');
    a.className = 'tag';
    a.textContent = word;
    a.style.fontSize = size + 'px';
    a.style.color = pickColor(word);
    a.title = word;
    a.onclick = () => sendPrompt('Tell me more about "' + word + '" in the context of ' + topic);
    cloud.appendChild(a);
  });
}

function buildTopicBar() {
  const bar = document.getElementById('topic-bar');
  Object.keys(topics).forEach(t => {
    const b = document.createElement('button');
    b.textContent = t;
    if (t === currentTopic) b.classList.add('active');
    b.onclick = () => {
      currentTopic = t;
      document.querySelectorAll('#topic-bar button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      render(t);
    };
    bar.appendChild(b);
  });
}

buildTopicBar();
render(currentTopic);
</script>
