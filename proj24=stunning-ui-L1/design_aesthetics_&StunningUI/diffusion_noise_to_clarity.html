
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  #app { padding: 1.5rem 0; font-family: var(--font-sans); }
  #prompt-row { display: flex; gap: 10px; margin-bottom: 1.25rem; }
  #prompt-input { flex: 1; }
  #gen-btn { min-width: 110px; }
  #canvas-wrap {
    position: relative; width: 100%; aspect-ratio: 16/9; max-height: 380px;
    border-radius: var(--border-radius-lg); overflow: hidden;
    border: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-secondary);
    cursor: default;
  }
  #main-canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #progress-bar-wrap {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 3px; background: rgba(0,0,0,0.15);
    opacity: 0; transition: opacity 0.3s;
  }
  #progress-bar { height: 100%; width: 0%; background: #7F77DD; transition: width 0.3s; }
  #tooltip {
    position: absolute; top: 12px; right: 12px;
    background: rgba(0,0,0,0.65); color: #fff;
    font-size: 12px; padding: 4px 10px; border-radius: 20px;
    opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  #status-badge {
    position: absolute; top: 12px; left: 12px;
    background: rgba(0,0,0,0.55); color: #fff;
    font-size: 12px; padding: 4px 10px; border-radius: 20px;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  #toast {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
    background: rgba(0,0,0,0.75); color: #fff;
    font-size: 15px; font-weight: 500; padding: 10px 22px; border-radius: 24px;
    opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none;
  }
  #sparkle-canvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  #hint { font-size: 13px; color: var(--color-text-secondary); margin-top: 10px; min-height: 18px; }
</style>

<div id="app">
  <h2 class="sr-only">Diffusion image generation simulator — watch noise resolve into a generated image</h2>
  <div id="prompt-row">
    <input type="text" id="prompt-input" placeholder="a snowy mountain at golden hour…" value="a snowy mountain at golden hour" />
    <button id="gen-btn" onclick="startGeneration()">Generate ↗</button>
  </div>
  <div id="canvas-wrap" onmouseenter="showTooltip()" onmouseleave="hideTooltip()" onclick="cancelGeneration()">
    <canvas id="main-canvas"></canvas>
    <canvas id="sparkle-canvas"></canvas>
    <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
    <div id="tooltip">0%</div>
    <div id="status-badge"></div>
    <div id="toast"></div>
  </div>
  <div id="hint">Enter a prompt and click Generate</div>
</div>

<script>
const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d');
const sparkCanvas = document.getElementById('sparkle-canvas');
const sctx = sparkCanvas.getContext('2d');
const wrap = document.getElementById('canvas-wrap');

let W = 320, H = 180;
canvas.width = W; canvas.height = H;
sparkCanvas.width = W; sparkCanvas.height = H;

let isGenerating = false, isCancelled = false;
let currentStep = 0, totalSteps = 9;
let progressPct = 0;
let targetImageData = null;
let currentImageData = null;
let tooltipVisible = false;
let rafId = null;
let animFrameId = null;
let sparkles = [];

const PROMPTS_PALETTES = {
  default: [[20,15,35],[45,30,80],[80,55,120],[130,100,180],[180,150,220],[220,200,240],[240,225,255]],
  mountain: [[10,25,60],[30,60,100],[60,100,130],[100,150,160],[180,210,230],[230,240,250],[255,255,255]],
  forest: [[5,30,10],[20,60,25],[40,100,45],[80,140,70],[140,190,120],[200,230,180],[230,250,210]],
  sunset: [[20,10,30],[80,20,40],[160,60,30],[210,110,50],[240,170,80],[250,220,140],[255,245,200]],
  ocean: [[5,20,50],[10,50,100],[20,90,150],[40,140,190],[80,180,220],[150,220,240],[210,245,255]],
};

function getPalette(prompt) {
  const p = prompt.toLowerCase();
  if (p.includes('mountain') || p.includes('snow') || p.includes('sky')) return PROMPTS_PALETTES.mountain;
  if (p.includes('forest') || p.includes('tree') || p.includes('jungle')) return PROMPTS_PALETTES.forest;
  if (p.includes('sunset') || p.includes('golden') || p.includes('fire')) return PROMPTS_PALETTES.sunset;
  if (p.includes('ocean') || p.includes('sea') || p.includes('water') || p.includes('beach')) return PROMPTS_PALETTES.ocean;
  return PROMPTS_PALETTES.default;
}

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function generateTargetImage(prompt) {
  const palette = getPalette(prompt);
  const img = ctx.createImageData(W, H);
  const d = img.data;
  for (let y = 0; y < H; y++) {
    const yt = y / H;
    const zoneIdx = Math.floor(yt * (palette.length - 1));
    const zoneT = (yt * (palette.length - 1)) - zoneIdx;
    const c0 = palette[Math.min(zoneIdx, palette.length - 1)];
    const c1 = palette[Math.min(zoneIdx + 1, palette.length - 1)];
    for (let x = 0; x < W; x++) {
      const xt = x / W;
      const wave = Math.sin(x * 0.04 + y * 0.02) * 0.06 + Math.sin(x * 0.09 - y * 0.05) * 0.04;
      const t2 = clamp(zoneT + wave, 0, 1);
      const i = (y * W + x) * 4;
      d[i]   = Math.round(lerp(c0[0], c1[0], t2) + (Math.random() - 0.5) * 6);
      d[i+1] = Math.round(lerp(c0[1], c1[1], t2) + (Math.random() - 0.5) * 6);
      d[i+2] = Math.round(lerp(c0[2], c1[2], t2) + (Math.random() - 0.5) * 6);
      d[i+3] = 255;
    }
  }
  return img;
}

function createNoise() {
  const img = ctx.createImageData(W, H);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = Math.round(Math.random() * 255);
    d[i] = v; d[i+1] = v; d[i+2] = v; d[i+3] = 255;
  }
  return img;
}

function blendImages(noise, target, t) {
  const img = ctx.createImageData(W, H);
  const d = img.data, nd = noise.data, td = target.data;
  for (let i = 0; i < d.length; i += 4) {
    d[i]   = Math.round(lerp(nd[i],   td[i],   t));
    d[i+1] = Math.round(lerp(nd[i+1], td[i+1], t));
    d[i+2] = Math.round(lerp(nd[i+2], td[i+2], t));
    d[i+3] = 255;
  }
  return img;
}

function applyBlur(blurPx) {
  canvas.style.filter = blurPx > 0 ? `blur(${blurPx.toFixed(1)}px)` : 'none';
}

function setProgress(pct) {
  progressPct = pct;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('tooltip').textContent = Math.round(pct) + '%';
}

function showTooltip() {
  tooltipVisible = true;
  if (isGenerating) document.getElementById('tooltip').style.opacity = '1';
}
function hideTooltip() {
  tooltipVisible = false;
  document.getElementById('tooltip').style.opacity = '0';
}

function showStatus(msg, show) {
  const el = document.getElementById('status-badge');
  el.textContent = msg;
  el.style.opacity = show ? '1' : '0';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  t.style.transform = 'translate(-50%, -50%) scale(1)';
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translate(-50%, -50%) scale(0.8)';
  }, 2200);
}

function spawnSparkles() {
  sparkles = [];
  const cw = sparkCanvas.offsetWidth || W;
  const ch = sparkCanvas.offsetHeight || H;
  for (let i = 0; i < 48; i++) {
    sparkles.push({
      x: Math.random() * cw, y: Math.random() * ch,
      vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3 - 1.5,
      life: 1, size: 2 + Math.random() * 4,
      hue: Math.round(Math.random() * 360)
    });
  }
  animateSparkles();
}

function animateSparkles() {
  const cw = sparkCanvas.offsetWidth || W;
  const ch = sparkCanvas.offsetHeight || H;
  sctx.clearRect(0, 0, cw, ch);
  let alive = false;
  for (const s of sparkles) {
    s.x += s.vx; s.y += s.vy; s.vy += 0.07; s.life -= 0.025;
    if (s.life <= 0) continue;
    alive = true;
    sctx.save();
    sctx.globalAlpha = s.life;
    sctx.fillStyle = `hsl(${s.hue},90%,65%)`;
    sctx.beginPath();
    const sz = s.size * s.life;
    sctx.moveTo(s.x, s.y - sz);
    sctx.lineTo(s.x + sz * 0.3, s.y - sz * 0.3);
    sctx.lineTo(s.x + sz, s.y);
    sctx.lineTo(s.x + sz * 0.3, s.y + sz * 0.3);
    sctx.lineTo(s.x, s.y + sz);
    sctx.lineTo(s.x - sz * 0.3, s.y + sz * 0.3);
    sctx.lineTo(s.x - sz, s.y);
    sctx.lineTo(s.x - sz * 0.3, s.y - sz * 0.3);
    sctx.closePath();
    sctx.fill();
    sctx.restore();
  }
  if (alive) animFrameId = requestAnimationFrame(animateSparkles);
  else sctx.clearRect(0, 0, cw, ch);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function startGeneration() {
  if (isGenerating) return;
  const prompt = document.getElementById('prompt-input').value.trim() || 'abstract art';
  isGenerating = true; isCancelled = false;
  document.getElementById('gen-btn').disabled = true;
  document.getElementById('hint').textContent = 'Hover to see progress · Click to cancel';
  document.getElementById('progress-bar-wrap').style.opacity = '1';
  wrap.style.cursor = 'pointer';
  showStatus('Generating…', true);

  const noiseImg = createNoise();
  targetImageData = generateTargetImage(prompt);
  ctx.putImageData(noiseImg, 0, 0);
  applyBlur(20);
  setProgress(0);
  if (tooltipVisible) document.getElementById('tooltip').style.opacity = '1';

  await sleep(120);

  for (let step = 0; step <= totalSteps; step++) {
    if (isCancelled) break;
    const t = step / totalSteps;
    const eased = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
    const blended = blendImages(noiseImg, targetImageData, eased);
    ctx.putImageData(blended, 0, 0);
    const blur = lerp(20, 0, eased);
    applyBlur(blur);
    setProgress(Math.round((step / totalSteps) * 100));
    showStatus(`Step ${step}/${totalSteps}`, true);
    await sleep(380 + Math.random() * 120);
    if (isCancelled) break;
  }

  if (!isCancelled) {
    ctx.putImageData(targetImageData, 0, 0);
    applyBlur(0);
    setProgress(100);
    document.getElementById('progress-bar-wrap').style.opacity = '0';
    showStatus('', false);
    document.getElementById('tooltip').style.opacity = '0';
    spawnSparkles();
    showToast('Generated!');
    document.getElementById('hint').textContent = 'Generation complete · Try a new prompt';
  }

  isGenerating = false;
  document.getElementById('gen-btn').disabled = false;
  wrap.style.cursor = 'default';
}

function cancelGeneration() {
  if (!isGenerating) return;
  isCancelled = true;
  dissolveNoise();
}

async function dissolveNoise() {
  const snap = ctx.getImageData(0, 0, W, H);
  const noise2 = createNoise();
  document.getElementById('progress-bar-wrap').style.opacity = '0';
  showStatus('Cancelled', true);
  for (let i = 0; i <= 12; i++) {
    const t = i / 12;
    const blended = blendImages(snap, noise2, t);
    ctx.putImageData(blended, 0, 0);
    applyBlur(t * 18);
    await sleep(50);
  }
  setTimeout(() => showStatus('', false), 900);
  document.getElementById('hint').textContent = 'Cancelled · Enter a new prompt to try again';
  document.getElementById('tooltip').style.opacity = '0';
  wrap.style.cursor = 'default';
  document.getElementById('gen-btn').disabled = false;
}

(function initIdle() {
  const img = createNoise();
  ctx.putImageData(img, 0, 0);
  applyBlur(8);
})();
</script>
