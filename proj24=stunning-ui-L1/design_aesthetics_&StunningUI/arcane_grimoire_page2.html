
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
.G{background:#0C0716;color:#E8D49C;font-family:'IM Fell English',Georgia,serif;min-height:600px;position:relative;}
#sf{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;padding:1.5rem 1.4rem 2.5rem;}
.cinzel{font-family:'Cinzel','Times New Roman',serif;}
.gold{color:#F0C060;}
.muted{color:#7A5828;}
.dim{color:#4A3018;}

/* Page header */
.pg-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;padding-bottom:1rem;border-bottom:1px solid #2A1C08;}
.pg-title{font-family:'Cinzel',serif;font-size:18px;color:#D4A040;letter-spacing:0.12em;}
.pg-sub{font-family:'Cinzel',serif;font-size:8px;color:#5A3A14;letter-spacing:0.3em;text-transform:uppercase;margin-top:2px;}
.phase-badge{display:flex;align-items:center;gap:6px;font-family:'Cinzel',serif;font-size:9px;color:#7A5020;letter-spacing:0.15em;}

/* Tabs */
.tabs{display:flex;gap:0;margin-bottom:1.4rem;border:1px solid #2A1C08;border-radius:1px;overflow:hidden;}
.tab{flex:1;background:transparent;border:none;border-right:1px solid #2A1C08;color:#6A4818;font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.1em;padding:9px 3px;cursor:pointer;text-transform:uppercase;transition:all 0.2s;}
.tab:last-child{border-right:none;}
.tab.on{background:rgba(180,120,30,0.14);color:#F0C060;}
.tab:hover:not(.on){background:rgba(180,120,30,0.06);color:#C09040;}

/* Section panels */
.panel{display:none;}
.panel.on{display:block;}

/* Spell builder */
.sb-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.sb-field{display:flex;flex-direction:column;gap:5px;}
.sb-label{font-family:'Cinzel',serif;font-size:8px;color:#6A4010;letter-spacing:0.2em;text-transform:uppercase;}
.sb-select,.sb-input{background:#090511;border:1px solid #2E1E0A;color:#C8A060;font-family:'IM Fell English',Georgia,serif;font-size:12px;font-style:italic;padding:7px 10px;outline:none;border-radius:1px;width:100%;appearance:none;}
.sb-select:focus,.sb-input:focus{border-color:#6A4018;}
.sb-textarea{background:#090511;border:1px solid #2E1E0A;color:#C8A060;font-family:'IM Fell English',Georgia,serif;font-size:12px;font-style:italic;padding:8px 10px;outline:none;border-radius:1px;width:100%;resize:none;line-height:1.5;}
.sb-textarea:focus{border-color:#6A4018;}
.power-row{display:flex;align-items:center;gap:10px;margin:10px 0;}
.power-label{font-family:'Cinzel',serif;font-size:8px;color:#6A4010;letter-spacing:0.15em;text-transform:uppercase;white-space:nowrap;}
.power-track{flex:1;height:3px;background:#1A1008;border-radius:1px;position:relative;cursor:pointer;}
.power-fill{height:3px;background:linear-gradient(90deg,#5A3010,#C08030,#F0C060);border-radius:1px;transition:width 0.2s;}
.power-val{font-family:'Cinzel',serif;font-size:11px;color:#C08030;min-width:20px;text-align:right;}
.cast-btn{width:100%;background:linear-gradient(135deg,#2A1608,#180E04,#2A1608);border:1px solid #6A4018;color:#D4A040;font-family:'Cinzel',serif;font-size:9.5px;letter-spacing:0.25em;text-transform:uppercase;padding:10px;cursor:pointer;margin-top:10px;border-radius:1px;transition:all 0.3s;}
.cast-btn:hover{border-color:#C08030;color:#F0C060;}
.spell-result{margin-top:12px;background:#080410;border:1px solid #2A1806;border-radius:1px;padding:12px 14px;display:none;}
.spell-result.show{display:block;}
.sr-name{font-family:'Cinzel',serif;font-size:13px;color:#F0C060;margin-bottom:4px;}
.sr-school{font-family:'Cinzel',serif;font-size:8px;color:#7A4A18;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:8px;}
.sr-desc{font-size:12px;color:#A07840;line-height:1.7;font-style:italic;}
.sr-stats{display:flex;gap:14px;margin-top:10px;padding-top:8px;border-top:1px solid #1E1208;}
.sr-stat{display:flex;flex-direction:column;}
.sr-stat-l{font-family:'Cinzel',serif;font-size:7px;color:#4A2A0A;letter-spacing:0.2em;text-transform:uppercase;}
.sr-stat-v{font-family:'Cinzel',serif;font-size:11px;color:#B07828;}

/* Ritual calendar */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-nav{background:transparent;border:1px solid #2A1806;color:#8A5820;font-family:'Cinzel',serif;font-size:11px;padding:4px 10px;cursor:pointer;border-radius:1px;}
.cal-nav:hover{border-color:#6A4010;color:#C08030;}
.cal-month{font-family:'Cinzel',serif;font-size:13px;color:#D4A040;letter-spacing:0.1em;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:10px;}
.cal-day-name{font-family:'Cinzel',serif;font-size:7px;color:#4A2A0A;letter-spacing:0.1em;text-align:center;padding:3px 0;text-transform:uppercase;}
.cal-day{height:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid transparent;border-radius:1px;cursor:pointer;transition:all 0.15s;position:relative;}
.cal-day:hover{border-color:#3A2208;background:rgba(180,120,30,0.07);}
.cal-day.today{border-color:#6A4018;background:rgba(180,120,30,0.1);}
.cal-day.ritual{background:rgba(120,60,180,0.12);border-color:#3A2060;}
.cal-day.festival{background:rgba(180,120,30,0.15);border-color:#5A3810;}
.cal-day-num{font-family:'Cinzel',serif;font-size:10px;color:#8A6030;}
.cal-dot{width:4px;height:4px;background:#7A4A18;border-radius:50%;margin-top:1px;}
.cal-day.ritual .cal-dot{background:#6040A0;}
.cal-day.festival .cal-dot{background:#C08030;}
.cal-day.today .cal-day-num{color:#F0C060;}
.ritual-list{display:flex;flex-direction:column;gap:6px;}
.ritual-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#090511;border:1px solid #1E1208;border-radius:1px;cursor:pointer;transition:border-color 0.2s;}
.ritual-item:hover{border-color:#3A2010;}
.ritual-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ritual-name{font-family:'Cinzel',serif;font-size:10px;color:#C08030;letter-spacing:0.05em;}
.ritual-date{font-family:'Cinzel',serif;font-size:8px;color:#5A3810;margin-left:auto;letter-spacing:0.08em;}

/* Bestiary */
.beast-search{position:relative;margin-bottom:10px;}
.beast-inp{width:100%;background:#090511;border:1px solid #2A1806;color:#C8A060;font-family:'IM Fell English',serif;font-size:12px;font-style:italic;padding:7px 10px 7px 30px;outline:none;border-radius:1px;}
.beast-inp:focus{border-color:#5A3810;}
.beast-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;color:#4A2A0A;}
.filter-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.filt-btn{background:transparent;border:1px solid #2A1806;color:#6A4018;font-family:'Cinzel',serif;font-size:8px;letter-spacing:0.1em;text-transform:uppercase;padding:4px 8px;cursor:pointer;border-radius:1px;transition:all 0.15s;}
.filt-btn:hover,.filt-btn.on{background:rgba(180,120,30,0.12);border-color:#5A3810;color:#C08030;}
.beast-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.beast-card{background:#090511;border:1px solid #1E1208;border-radius:1px;padding:12px;cursor:pointer;transition:border-color 0.2s;position:relative;}
.beast-card:hover{border-color:#3A2010;}
.beast-card.selected{border-color:#6A4018;}
.beast-name{font-family:'Cinzel',serif;font-size:11px;color:#D4A040;margin-bottom:2px;}
.beast-type{font-family:'Cinzel',serif;font-size:7px;color:#5A3010;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:6px;}
.beast-stats-row{display:flex;gap:8px;}
.bs{display:flex;flex-direction:column;}
.bs-l{font-size:7px;color:#4A2A08;font-family:'Cinzel',serif;letter-spacing:0.1em;text-transform:uppercase;}
.bs-v{font-size:10px;color:#A07030;font-family:'Cinzel',serif;}
.beast-detail{margin-top:12px;background:#070310;border:1px solid #1E1008;border-radius:1px;padding:12px 14px;display:none;}
.beast-detail.show{display:block;}
.bd-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
.bd-name{font-family:'Cinzel',serif;font-size:15px;color:#F0C060;}
.bd-cr{font-family:'Cinzel',serif;font-size:11px;color:#8A5020;}
.bd-lore{font-size:12px;color:#9A7040;line-height:1.7;font-style:italic;margin-bottom:10px;}
.bd-abilities{display:flex;flex-direction:column;gap:5px;}
.bd-ab{font-size:11px;color:#8A6030;line-height:1.5;}
.bd-ab-name{font-family:'Cinzel',serif;font-size:10px;color:#C08030;display:inline;}
.threat-bar{display:flex;align-items:center;gap:8px;margin-top:8px;}
.threat-label{font-family:'Cinzel',serif;font-size:8px;color:#4A2A08;text-transform:uppercase;letter-spacing:0.12em;white-space:nowrap;}
.threat-track{flex:1;height:2px;background:#1A1008;}
.threat-seg{display:flex;gap:2px;flex:1;}
.threat-pip{flex:1;height:4px;background:#1A1008;border-radius:1px;}
.threat-pip.lit{background:#C04010;}

/* Alchemy */
.alchemy-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.ingr-panel{display:flex;flex-direction:column;gap:8px;}
.ingr-title{font-family:'Cinzel',serif;font-size:10px;color:#7A5020;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:4px;}
.ingr-item{display:flex;align-items:center;gap:8px;padding:7px 9px;background:#090511;border:1px solid #1E1208;border-radius:1px;cursor:pointer;transition:all 0.15s;}
.ingr-item:hover{border-color:#3A2010;}
.ingr-item.added{border-color:#5A3818;background:rgba(120,80,20,0.1);}
.ingr-sym{font-size:14px;width:18px;text-align:center;}
.ingr-name{font-family:'Cinzel',serif;font-size:9px;color:#B08030;letter-spacing:0.05em;}
.ingr-prop{font-size:9px;color:#5A3810;font-style:italic;}
.cauldron{display:flex;flex-direction:column;align-items:center;gap:10px;}
.cauldron-svg-wrap{display:flex;justify-content:center;}
.brew-list{width:100%;display:flex;flex-direction:column;gap:5px;min-height:60px;}
.brew-chip{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;background:#0A0612;border:1px solid #2A1808;border-radius:1px;font-family:'Cinzel',serif;font-size:9px;color:#A07030;}
.brew-rm{background:transparent;border:none;color:#4A2808;font-size:11px;cursor:pointer;padding:0 2px;}
.brew-rm:hover{color:#A04010;}
.brew-btn{width:100%;background:linear-gradient(135deg,#250E04,#140804,#250E04);border:1px solid #5A2808;color:#C06020;font-family:'Cinzel',serif;font-size:8.5px;letter-spacing:0.2em;text-transform:uppercase;padding:8px;cursor:pointer;border-radius:1px;transition:all 0.25s;}
.brew-btn:hover{border-color:#A04010;color:#F07030;}
.brew-result{width:100%;margin-top:6px;background:#070310;border:1px solid #2A1208;border-radius:1px;padding:10px 12px;display:none;}
.brew-result.show{display:block;}
.br-name{font-family:'Cinzel',serif;font-size:12px;color:#F08040;margin-bottom:3px;}
.br-effect{font-size:11px;color:#8A5030;font-style:italic;line-height:1.65;}

/* Divider */
.div{display:flex;align-items:center;gap:10px;margin:1rem 0;}
.div-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,#3A2408,transparent);}
.div-gem{width:5px;height:5px;background:#7A4818;transform:rotate(45deg);}

/* Scrollbar */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:#0A0612;}
::-webkit-scrollbar-thumb{background:#3A2008;border-radius:2px;}
</style>

<div class="G">
<canvas id="sf"></canvas>
<div class="wrap">

<div class="pg-header">
  <div>

    Full Moon · Night III

</div>

<div class="tabs">

  <button class="tab" onclick="switchTab('calendar')">Ritual Calendar</button>
  <button class="tab" onclick="switchTab('alchemy')">Alchemy</button>
</div>

<!-- SPELL FORGE -->
<div class="panel on" id="panel-spell">

      <label class="sb-label">School of Magic</label>

<script>
const canvas = document.getElementById('sf');
const ctx = canvas.getContext('2d');
function resizeSf(){canvas.width=canvas.parentElement.offsetWidth||680;canvas.height=canvas.parentElement.offsetHeight||700;}
resizeSf();
const STARS=[];
for(let i=0;i<140;i++)STARS.push({x:Math.random(),y:Math.random(),r:Math.random()*1.1+0.2,speed:Math.random()*0.0004+0.0001,phase:Math.random()*Math.PI*2,gold:Math.random()<0.1});
function drawSf(t){ctx.clearRect(0,0,canvas.width,canvas.height);STARS.forEach(s=>{const fl=0.45+0.55*Math.sin(t*s.speed*700+s.phase);ctx.beginPath();ctx.arc(s.x*canvas.width,s.y*canvas.height,s.r,0,Math.PI*2);ctx.fillStyle=s.gold?`rgba(220,170,60,${fl*0.6})`:`rgba(190,170,240,${fl*0.35})`;ctx.fill();});requestAnimationFrame(drawSf);}
requestAnimationFrame(drawSf);

function switchTab(id){
  document.querySelectorAll('.tab').forEach((t,i)=>{t.classList.toggle('on',['spell','bestiary','calendar','alchemy'][i]===id);});
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.getElementById('panel-'+id).classList.add('on');
  if(id==='calendar')renderCalendar();
  if(id==='bestiary')renderBeasts();
  if(id==='alchemy')renderIngredients();
}

let powerVal=6;
function setPower(e){
  const r=e.currentTarget.getBoundingClientRect();
  const pct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  powerVal=Math.round(pct*9)+1;
  document.getElementById('pf').style.width=(pct*100)+'%';
  document.getElementById('pv').textContent=powerVal;
}

function forgeSpell(){
  const school=document.getElementById('sb-school').value;
  const circle=document.getElementById('sb-circle').value.split(' — ')[1];
  const element=document.getElementById('sb-element').value;
  const range=document.getElementById('sb-range').value;
  const names=SPELLS[school]?.[element]||["The Unknown Rite","Formula Obscura","The Unnamed Working"];
  const name=names[Math.floor(Math.random()*names.length)];
  const desc=DESCS[Math.floor(Math.random()*DESCS.length)].replace(/{element}/g,element).replace(/{school}/g,school).replace(/{circle}/g,circle);
  const castTime=powerVal>6?'1 minute':powerVal>3?'1 action':'Bonus action';
  const dur=powerVal>7?'Until dispelled':powerVal>5?'8 hours':powerVal>3?'1 hour':'Concentration';
  const comp=powerVal>5?'V · S · M · R':'V · S · M';
  document.getElementById('sr-name').textContent=name;
  document.getElementById('sr-school').textContent='★ '+school+' · '+document.getElementById('sb-circle').value+' ★';
  document.getElementById('sr-desc').textContent=desc;
  document.getElementById('sr-stats').innerHTML=
    `<div class="sr-stat"><span class="sr-stat-l">Casting</span><span class="sr-stat-v">${castTime}</span></div>`+
    `<div class="sr-stat"><span class="sr-stat-l">Range</span><span class="sr-stat-v">${range}</span></div>`+
    `<div class="sr-stat"><span class="sr-stat-l">Duration</span><span class="sr-stat-v">${dur}</span></div>`+
    `<div class="sr-stat"><span class="sr-stat-l">Components</span><span class="sr-stat-v">${comp}</span></div>`;
  document.getElementById('spell-result').classList.add('show');
}

let calYear=2025,calMonth=4;
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MOON_MONTHS=['The Dark Tide','The Pale Returning','The Worm Moon','The Blood Blossom','The Flower Moon','The Mead Moon','The Storm Moon','The Harvest Moon','The Hunter Moon','The Frost Moon','The Mourning Moon','The Cold Moon'];
const RITUALS=[
  {name:'Rite of the Vanishing Hour',date:'3',type:'ritual',color:'#6040A0'},
  {name:'Festival of Embers',date:'8',type:'festival',color:'#C08030'},
  {name:'Compact of the Three Shadows',date:'15',type:'ritual',color:'#6040A0'},
  {name:'Night of the Hollow Bell',date:'20',type:'ritual',color:'#6040A0'},
  {name:'Grand Solstice Observance',date:'24',type:'festival',color:'#C08030'},
  {name:'The Unmaking Moon Vigil',date:'30',type:'ritual',color:'#6040A0'},
];

function changeMonth(d){
  calMonth+=d;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  renderCalendar();
}

function renderCalendar(){
  const moonName=MOON_MONTHS[calMonth];
  document.getElementById('cal-month').textContent=MONTHS[calMonth]+' · '+calYear+' · '+moonName;
  const grid=document.getElementById('cal-grid');
  const dayNames=grid.querySelectorAll('.cal-day-name');
  while(grid.children.length>7)grid.removeChild(grid.lastChild);
  const first=new Date(calYear,calMonth,1).getDay();
  const days=new Date(calYear,calMonth+1,0).getDate();
  const today=new Date();
  const ritualDays=RITUALS.map(r=>r.date);
  const festivalDays=RITUALS.filter(r=>r.type==='festival').map(r=>r.date);
  for(let i=0;i<first;i++){const e=document.createElement('div');e.className='cal-day';grid.appendChild(e);}
  for(let d=1;d<=days;d++){
    const e=document.createElement('div');
    const ds=String(d);
    let cls='cal-day';
    if(calYear===today.getFullYear()&&calMonth===today.getMonth()&&d===today.getDate())cls+=' today';
    else if(festivalDays.includes(ds))cls+=' festival';
    else if(ritualDays.includes(ds))cls+=' ritual';
    e.className=cls;
    e.innerHTML=`<span class="cal-day-num">${d}</span>${(ritualDays.includes(ds)||cls.includes('today'))?'<div class="cal-dot"></div>':''}`;
    grid.appendChild(e);
  }
  const list=document.getElementById('ritual-list');
  list.innerHTML='';
  RITUALS.forEach(r=>{
    const item=document.createElement('div');item.className='ritual-item';
    item.innerHTML=`<div class="ritual-dot" style="background:${r.color};"></div><span class="ritual-name">${r.name}</span><span class="ritual-date">${MONTHS[calMonth].slice(0,3)} ${r.date}</span>`;
    list.appendChild(item);
  });
}

function renderIngredients(){
  const list=document.getElementById('ingr-list');
  list.innerHTML='';
  INGREDIENTS.forEach(ing=>{
    const d=document.createElement('div');
    const added=cauldron.some(c=>c.name===ing.name);
    d.className='ingr-item'+(added?' added':'');
    d.innerHTML=`<span class="ingr-sym" style="font-size:14px;">${ing.sym}</span><div><div class="ingr-name">${ing.name}</div><div class="ingr-prop">${ing.prop}</div></div>`;

function renderCauldron(){
  const bl=document.getElementById('brew-list');
  bl.innerHTML='';
  cauldron.forEach(c=>{
    const chip=document.createElement('div');chip.className='brew-chip';
    chip.innerHTML=`<span>${c.sym} ${c.name}</span><button class="brew-rm" onclick="removeIngredient('${c.name}')">×</button>`;
    bl.appendChild(chip);
  });
}

function removeIngredient(name){
  cauldron=cauldron.filter(c=>c.name!==name);
  document.getElementById('brew-result').classList.remove('show');
  renderIngredients();renderCauldron();
}

  'lunar+celestial':'Elixir of the Twin Lights — Grants the ability to see in absolute darkness and perceive invisible creatures for 1 hour.',
  'lunar+void':'Draught of the Null Dream — The drinker falls into a trance for 10 minutes, experiencing visions of possible futures.',

  'void+sight':'Tincture of the Blind Oracle — Removes all normal sight for 8 hours, replacing it with 360° magical tremorsense.',
  'celestial+change':'Philtre of the Altered Star — Changes the drinker\'s alignment for 24 hours. Effects are unpredictable.',
  'depth+fire':'Potion of the Volcanic Vent — Grants immunity to fire and cold damage for 1 hour, but the drinker radiates intense heat.',
  'lunar+poison':'Sleeping Draught of the Moon Garden — A painless sleep lasting exactly 3 days. Dreams are vivid and prophetic.',
  'change+sight':'Serum of the True Form — Strips all illusions from the drinker\'s perception for 2 hours. Can be unsettling.',

function brewPotion(){
  if(cauldron.length<2){document.getElementById('br-name').textContent='Insufficient Reagents';document.getElementById('br-effect').textContent='Add at least two ingredients before attempting the brew.';document.getElementById('brew-result').classList.add('show');return;}
  const effects=cauldron.map(c=>c.effect).sort();
  let result=null;
  for(const key of Object.keys(POTION_TABLE)){
    const kp=key.split('+');
    if(kp.every(k=>effects.includes(k))){result=POTION_TABLE[key];break;}
  }
  if(!result){
    const names=['Murky Quintessence','Opaque Amalgam','The Indeterminate Brew','Curious Admixture'];
    result=names[Math.floor(Math.random()*names.length)]+' — The reagents combine into something unknown. Roll on the Wild Magic table.';
  }
  const parts=result.split(' — ');
  document.getElementById('br-name').textContent=parts[0];
  document.getElementById('br-effect').textContent=parts[1]||'';
  document.getElementById('brew-result').classList.add('show');
}
