
<style>
*{box-sizing:border-box;margin:0;padding:0}
.ep-wrap{font-family:var(--font-sans);padding:1rem 0}
.ep-chat{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden}
.ep-messages{padding:12px 14px;min-height:120px;display:flex;flex-direction:column;gap:6px}
.ep-msg{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.ep-msg-user{color:#7F77DD;font-weight:500;min-width:fit-content}
.ep-msg-text{color:var(--color-text-primary);line-height:1.5;word-break:break-word}
.ep-msg-text img{width:24px;height:24px;vertical-align:middle;margin:0 1px}
.ep-input-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary)}
.ep-text-input{flex:1;height:36px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:0 10px;font-size:14px;color:var(--color-text-primary);outline:none}
.ep-text-input:focus{border-color:var(--color-border-primary)}
.ep-emoji-btn{width:36px;height:36px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--color-text-secondary);font-size:18px;position:relative;flex-shrink:0}
.ep-emoji-btn:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}
.ep-send-btn{width:36px;height:36px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--color-text-secondary);font-size:16px}
.ep-send-btn:hover{background:var(--color-background-secondary)}

.ep-picker{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);margin-top:8px;overflow:hidden}
.ep-picker-header{padding:10px 12px;border-bottom:0.5px solid var(--color-border-tertiary)}
.ep-search{width:100%;height:32px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:0 10px 0 32px;font-size:13px;color:var(--color-text-primary);outline:none}
.ep-search:focus{border-color:var(--color-border-secondary)}
.ep-search-wrap{position:relative}
.ep-search-ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--color-text-tertiary);font-size:14px;pointer-events:none}
.ep-tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.ep-tab{padding:6px 12px;font-size:12px;font-weight:500;border-radius:var(--border-radius-md) var(--border-radius-md) 0 0;cursor:pointer;color:var(--color-text-secondary);border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.ep-tab:hover{color:var(--color-text-primary)}
.ep-tab.active{color:#7F77DD;border-bottom-color:#7F77DD;background:var(--color-background-secondary)}
.ep-section-label{font-size:11px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.04em;padding:10px 12px 4px}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:2px;padding:0 8px 8px}
.ep-emote{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;transition:background .1s;position:relative}
.ep-emote:hover{background:var(--color-background-secondary)}
.ep-emote img{width:28px;height:28px;image-rendering:pixelated}
.ep-emote-tooltip{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#2C2C2A;color:#D3D1C7;font-size:11px;padding:3px 7px;border-radius:5px;white-space:nowrap;pointer-events:none;display:none;z-index:10}
.ep-emote:hover .ep-emote-tooltip{display:block}
.ep-empty{padding:24px;text-align:center;color:var(--color-text-tertiary);font-size:13px}
.ep-body{max-height:240px;overflow-y:auto}
.ep-badge{display:inline-block;font-size:10px;font-weight:500;padding:2px 6px;border-radius:4px;margin-left:4px;vertical-align:middle}
.ep-badge.twitch{background:#EEEDFE;color:#534AB7}
.ep-badge.bttv{background:#E1F5EE;color:#0F6E56}
.ep-badge.tv7{background:#FAECE7;color:#993C1D}
.ep-inserted{animation:pop .2s ease}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
</style>

<h2 class="sr-only">Emote picker widget — click emotes to insert into chat</h2>

<div class="ep-wrap">
  <div class="ep-chat">
    <div class="ep-messages" id="messages">
      <div class="ep-msg"><span class="ep-msg-user">StreamerGirl</span><span class="ep-msg-text">this update is so good <img src="https://cdn.frankerfacez.com/emoticon/26608/1" alt="PogChamp"> <img src="https://cdn.frankerfacez.com/emoticon/25927/1" alt="KEKW"></span></div>
      <div class="ep-msg"><span class="ep-msg-user">xXChatter</span><span class="ep-msg-text">yeah no cap <img src="https://cdn.frankerfacez.com/emoticon/145947/1" alt="Pog"> true</span></div>
      <div class="ep-msg"><span class="ep-msg-user">You</span><span class="ep-msg-text" id="preview-msg">Type a message below...</span></div>
    </div>
    <div class="ep-input-row">
      <button class="ep-emoji-btn" id="picker-btn" aria-label="Open emote picker" title="Open emote picker">
        <i class="ti ti-mood-smile" aria-hidden="true"></i>
      </button>
      <input class="ep-text-input" id="chat-input" placeholder="Send a message" autocomplete="off"/>
      <button class="ep-send-btn" id="send-btn" aria-label="Send message">
        <i class="ti ti-send" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <div class="ep-picker" id="picker" style="display:none">
    <div class="ep-picker-header">
      <div class="ep-search-wrap">
        <i class="ti ti-search ep-search-ico" aria-hidden="true"></i>
        <input class="ep-search" id="search-input" placeholder="Search emotes..." autocomplete="off" aria-label="Search emotes"/>
      </div>
    </div>
    <div class="ep-tabs" role="tablist">
      <button class="ep-tab active" data-tab="all" role="tab">All</button>
      <button class="ep-tab" data-tab="twitch" role="tab">Twitch</button>
      <button class="ep-tab" data-tab="bttv" role="tab">BTTV</button>
      <button class="ep-tab" data-tab="7tv" role="tab">7TV</button>
      <button class="ep-tab" data-tab="favorites" role="tab">★ Faves</button>
    </div>
    <div class="ep-body" id="picker-body"></div>
  </div>
</div>

<script>
const EMOTES = [
  {name:"PogChamp",src:"https://cdn.frankerfacez.com/emoticon/26608/1",source:"twitch"},
  {name:"KEKW",src:"https://cdn.frankerfacez.com/emoticon/25927/1",source:"twitch"},
  {name:"Pog",src:"https://cdn.frankerfacez.com/emoticon/145947/1",source:"twitch"},
  {name:"LUL",src:"https://cdn.frankerfacez.com/emoticon/62818/1",source:"twitch"},
  {name:"OMEGALUL",src:"https://cdn.frankerfacez.com/emoticon/128054/1",source:"twitch"},
  {name:"monkaS",src:"https://cdn.frankerfacez.com/emoticon/130762/1",source:"bttv"},
  {name:"monkaW",src:"https://cdn.frankerfacez.com/emoticon/214656/1",source:"bttv"},
  {name:"PauseChamp",src:"https://cdn.frankerfacez.com/emoticon/256055/1",source:"bttv"},
  {name:"catJAM",src:"https://cdn.frankerfacez.com/emoticon/440758/1",source:"bttv"},
  {name:"GIGACHAD",src:"https://cdn.frankerfacez.com/emoticon/702742/1",source:"bttv"},
  {name:"5Head",src:"https://cdn.frankerfacez.com/emoticon/239504/1",source:"7tv"},
  {name:"BASED",src:"https://cdn.frankerfacez.com/emoticon/356643/1",source:"7tv"},
  {name:"Sadge",src:"https://cdn.frankerfacez.com/emoticon/243789/1",source:"7tv"},
  {name:"widepeepoHappy",src:"https://cdn.frankerfacez.com/emoticon/270930/1",source:"7tv"},
  {name:"pepeJAM",src:"https://cdn.frankerfacez.com/emoticon/243537/1",source:"7tv"},
  {name:"Clap",src:"https://cdn.frankerfacez.com/emoticon/128054/1",source:"twitch"},
  {name:"WeirdChamp",src:"https://cdn.frankerfacez.com/emoticon/214319/1",source:"bttv"},
  {name:"xqcL",src:"https://cdn.frankerfacez.com/emoticon/333510/1",source:"7tv"},
];

let activeTab = "all";
let searchQ = "";
let favorites = [];
let recents = [];

try { favorites = JSON.parse(localStorage.getItem("ep_favs") || "[]"); } catch(e){}
try { recents = JSON.parse(localStorage.getItem("ep_recents") || "[]"); } catch(e){}

const pickerEl = document.getElementById("picker");
const pickerBody = document.getElementById("picker-body");
const searchInput = document.getElementById("search-input");
const chatInput = document.getElementById("chat-input");
const previewMsg = document.getElementById("preview-msg");

function saveStorage() {
  try { localStorage.setItem("ep_favs", JSON.stringify(favorites)); } catch(e){}
  try { localStorage.setItem("ep_recents", JSON.stringify(recents)); } catch(e){}
}

function addRecent(name) {
  recents = [name, ...recents.filter(n => n !== name)].slice(0, 12);
  saveStorage();
}

function toggleFav(name) {
  if(favorites.includes(name)) favorites = favorites.filter(n => n !== name);
  else favorites = [name, ...favorites];
  saveStorage();
  renderPicker();
}

function getEmotes() {
  let list = EMOTES;
  if(activeTab === "twitch") list = list.filter(e => e.source === "twitch");
  else if(activeTab === "bttv") list = list.filter(e => e.source === "bttv");
  else if(activeTab === "7tv") list = list.filter(e => e.source === "7tv");
  else if(activeTab === "favorites") list = list.filter(e => favorites.includes(e.name));
  if(searchQ) list = list.filter(e => e.name.toLowerCase().includes(searchQ.toLowerCase()));
  return list;
}

function emoteGrid(emoteList) {
  if(!emoteList.length) return '<div class="ep-empty">No emotes found</div>';
  return '<div class="ep-grid">' + emoteList.map(e => {
    const isFav = favorites.includes(e.name);
    return `<div class="ep-emote" data-name="${e.name}" data-src="${e.src}" role="button" tabindex="0" aria-label="${e.name}">
      <img src="${e.src}" alt="${e.name}" loading="lazy"/>
      <span class="ep-emote-tooltip">${e.name}</span>
    </div>`;
  }).join('') + '</div>';
}

function sourceLabel(src) {
  const map = {twitch:'Twitch',bttv:'BetterTTV','7tv':'7TV'};
  const cls = {twitch:'twitch',bttv:'bttv','7tv':'tv7'};
  return `<span class="ep-badge ${cls[src]||''}">${map[src]||src}</span>`;
}

function renderPicker() {
  const emotes = getEmotes();
  let html = "";

  if(activeTab === "all" && !searchQ && recents.length) {
    const recentEmotes = recents.map(n => EMOTES.find(e => e.name === n)).filter(Boolean);
    html += '<div class="ep-section-label">Recent</div>' + emoteGrid(recentEmotes);
  }

  if(activeTab === "all" && !searchQ) {
    const grouped = {twitch: EMOTES.filter(e=>e.source==="twitch"), bttv: EMOTES.filter(e=>e.source==="bttv"), "7tv": EMOTES.filter(e=>e.source==="7tv")};
    for(const [src, list] of Object.entries(grouped)) {
      html += `<div class="ep-section-label">${src === "twitch" ? "Twitch" : src === "bttv" ? "BetterTTV" : "7TV"}</div>` + emoteGrid(list);
    }
  } else {
    if(!emotes.length) html = '<div class="ep-empty">No emotes found :(</div>';
    else html = emoteGrid(emotes);
  }

  pickerBody.innerHTML = html;

  pickerBody.querySelectorAll(".ep-emote").forEach(el => {
    el.addEventListener("click", () => {
      const name = el.dataset.name;
      insertEmote(name);
    });
    el.addEventListener("contextmenu", e => {
      e.preventDefault();
      toggleFav(el.dataset.name);
    });
    el.addEventListener("keydown", e => {
      if(e.key === "Enter" || e.key === " ") { e.preventDefault(); insertEmote(el.dataset.name); }
    });
  });
}

function insertEmote(name) {
  const cur = chatInput.value;
  const newVal = cur + (cur && !cur.endsWith(" ") ? " " : "") + ":" + name + ": ";
  chatInput.value = newVal;
  updatePreview();
  addRecent(name);
  chatInput.focus();
  const el = pickerBody.querySelector(`[data-name="${name}"]`);
  if(el) { el.classList.add("ep-inserted"); setTimeout(() => el.classList.remove("ep-inserted"), 200); }
}

function updatePreview() {
  const val = chatInput.value;
  if(!val.trim()) { previewMsg.textContent = "Type a message below..."; return; }
  const parts = val.split(/(:[A-Za-z0-9_]+:)/g);
  previewMsg.innerHTML = parts.map(p => {
    if(p.startsWith(":") && p.endsWith(":")) {
      const eName = p.slice(1,-1);
      const em = EMOTES.find(e => e.name === eName);
      if(em) return `<img src="${em.src}" alt="${eName}" style="width:24px;height:24px;vertical-align:middle;margin:0 1px">`;
      return p;
    }
    return p.replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }).join("");
}

function sendMessage() {
  const val = chatInput.value.trim();
  if(!val) return;
  const msgs = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "ep-msg";
  const parts = val.split(/(:[A-Za-z0-9_]+:)/g);
  const html = parts.map(p => {
    if(p.startsWith(":") && p.endsWith(":")) {
      const eName = p.slice(1,-1);
      const em = EMOTES.find(e => e.name === eName);
      if(em) return `<img src="${em.src}" alt="${eName}" style="width:24px;height:24px;vertical-align:middle;margin:0 1px">`;
      return p;
    }
    return p.replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }).join("");
  div.innerHTML = `<span class="ep-msg-user">You</span><span class="ep-msg-text">${html}</span>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  chatInput.value = "";
  previewMsg.textContent = "Type a message below...";
}

document.getElementById("picker-btn").addEventListener("click", () => {
  const open = pickerEl.style.display !== "none";
  pickerEl.style.display = open ? "none" : "block";
  if(!open) { renderPicker(); searchInput.focus(); }
});

document.querySelectorAll(".ep-tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".ep-tab").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    activeTab = btn.dataset.tab;
    searchQ = "";
    searchInput.value = "";
    renderPicker();
  });
});

searchInput.addEventListener("input", e => {
  searchQ = e.target.value;
  renderPicker();
});

chatInput.addEventListener("input", updatePreview);
chatInput.addEventListener("keydown", e => {
  if(e.key === "Enter") { sendMessage(); pickerEl.style.display = "none"; }
});

document.getElementById("send-btn").addEventListener("click", () => {
  sendMessage();
  pickerEl.style.display = "none";
});

document.addEventListener("click", e => {
  if(!e.target.closest(".ep-picker") && !e.target.closest("#picker-btn")) {
    pickerEl.style.display = "none";
  }
});

updatePreview();
</script>
