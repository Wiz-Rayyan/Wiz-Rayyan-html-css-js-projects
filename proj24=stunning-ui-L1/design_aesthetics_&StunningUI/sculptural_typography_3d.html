
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Bebas+Neue&display=swap');

  .scene {
    min-height: 520px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0a0f;
    border-radius: 16px;
    padding: 3rem 2rem;
    position: relative;
    overflow: hidden;
  }

  .scene::before {
    content: '';
    position: absolute;
    top: -120px; left: -80px;
    width: 340px; height: 340px;
    background: radial-gradient(circle, rgba(255,220,130,0.09) 0%, transparent 70%);
    pointer-events: none;
  }

  .word-row {
    display: flex;
    gap: 0px;
    align-items: center;
    margin: 0;
  }

  .letter {
    font-family: 'Bebas Neue', 'Black Han Sans', Impact, sans-serif;
    font-size: 120px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: 0.02em;
    position: relative;
    cursor: default;
    user-select: none;
    transition: transform 0.2s ease;
  }

  .letter:hover {
    transform: translateY(-4px);
  }

  .word-solid {
    background: linear-gradient(
      145deg,
      #fff8e8 0%,
      #f0d080 18%,
      #c8960a 35%,
      #a07000 48%,
      #c89820 60%,
      #e8b830 72%,
      #705000 82%,
      #3a2800 92%,
      #1a1000 100%
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter:
      drop-shadow(0px 1px 0px rgba(255,220,80,0.9))
      drop-shadow(0px 2px 0px rgba(200,150,10,0.85))
      drop-shadow(0px 3px 0px rgba(160,110,0,0.8))
      drop-shadow(0px 4px 0px rgba(130,90,0,0.75))
      drop-shadow(0px 5px 0px rgba(100,70,0,0.7))
      drop-shadow(0px 6px 0px rgba(80,55,0,0.65))
      drop-shadow(0px 7px 0px rgba(60,40,0,0.6))
      drop-shadow(0px 8px 0px rgba(40,28,0,0.55))
      drop-shadow(0px 9px 0px rgba(25,18,0,0.5))
      drop-shadow(0px 10px 0px rgba(15,10,0,0.45))
      drop-shadow(2px 14px 18px rgba(0,0,0,0.9))
      drop-shadow(-1px -1px 3px rgba(255,240,160,0.4));
  }

  .word-chrome {
    background: linear-gradient(
      150deg,
      #ffffff 0%,
      #e8e8e8 10%,
      #b0b8c8 22%,
      #606878 34%,
      #8898a8 44%,
      #d0d8e0 54%,
      #f0f4f8 62%,
      #9098a0 72%,
      #404850 82%,
      #202830 91%,
      #080c10 100%
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter:
      drop-shadow(0px 1px 0px rgba(220,230,240,0.95))
      drop-shadow(0px 2px 0px rgba(160,175,190,0.9))
      drop-shadow(0px 3px 0px rgba(110,125,140,0.85))
      drop-shadow(0px 4px 0px rgba(75,90,105,0.8))
      drop-shadow(0px 5px 0px rgba(55,68,80,0.75))
      drop-shadow(0px 6px 0px rgba(40,52,62,0.7))
      drop-shadow(0px 7px 0px rgba(28,38,46,0.65))
      drop-shadow(0px 8px 0px rgba(18,26,32,0.6))
      drop-shadow(0px 9px 0px rgba(10,16,20,0.55))
      drop-shadow(0px 10px 0px rgba(4,8,12,0.5))
      drop-shadow(2px 14px 18px rgba(0,0,0,0.95))
      drop-shadow(-1px -1px 4px rgba(255,255,255,0.5));
  }

  .word-copper {
    background: linear-gradient(
      140deg,
      #fff0e0 0%,
      #ffb870 14%,
      #c86020 28%,
      #8c3800 40%,
      #c06820 52%,
      #e89050 64%,
      #804000 74%,
      #401800 84%,
      #200c00 100%
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter:
      drop-shadow(0px 1px 0px rgba(255,160,80,0.95))
      drop-shadow(0px 2px 0px rgba(200,110,40,0.9))
      drop-shadow(0px 3px 0px rgba(150,78,15,0.85))
      drop-shadow(0px 4px 0px rgba(110,55,8,0.8))
      drop-shadow(0px 5px 0px rgba(80,38,4,0.75))
      drop-shadow(0px 6px 0px rgba(58,26,2,0.7))
      drop-shadow(0px 7px 0px rgba(40,18,1,0.65))
      drop-shadow(0px 8px 0px rgba(25,12,0,0.6))
      drop-shadow(0px 9px 0px rgba(15,7,0,0.55))
      drop-shadow(0px 10px 0px rgba(8,4,0,0.5))
      drop-shadow(2px 16px 20px rgba(0,0,0,0.92))
      drop-shadow(-1px -1px 4px rgba(255,220,180,0.45));
  }

  .subtitle {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 13px;
    letter-spacing: 0.32em;
    color: rgba(255,255,255,0.22);
    margin-top: 2.5rem;
    text-transform: uppercase;
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-top: 2rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .ctrl-btn {
    background: rgba(255,255,255,0.06);
    border: 0.5px solid rgba(255,255,255,0.18);
    color: rgba(255,255,255,0.7);
    padding: 7px 18px;
    border-radius: 8px;
    font-size: 12px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.18s;
    font-family: inherit;
  }

  .ctrl-btn:hover, .ctrl-btn.active {
    background: rgba(255,255,255,0.14);
    border-color: rgba(255,255,255,0.38);
    color: #fff;
  }

  .ctrl-btn.active {
    border-color: rgba(255,200,60,0.5);
    color: rgba(255,220,100,1);
  }
</style>

<h2 class="sr-only">Sculptural 3D typography demo — extruded metallic lettering with layered drop-shadow depth simulation</h2>

<div class="scene" id="scene">
  <div class="word-row" id="wordrow">
    <span class="letter word-solid" id="w1">FORGE</span>
  </div>
  <div class="subtitle">sculptural typography · 3d extrusion</div>
  <div class="controls">
    <button class="ctrl-btn active" onclick="setStyle('gold','FORGE')">Gold</button>
    <button class="ctrl-btn" onclick="setStyle('chrome','STEEL')">Chrome</button>
    <button class="ctrl-btn" onclick="setStyle('copper','COPPER')">Copper</button>
    <button class="ctrl-btn" onclick="setStyle('ghost','GHOST')">Ghost</button>
  </div>
</div>

<script>
function setStyle(style, word) {
  const el = document.getElementById('w1');
  const btns = document.querySelectorAll('.ctrl-btn');
  btns.forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');

  el.textContent = word;
  el.className = 'letter';

  if (style === 'gold') {
    el.classList.add('word-solid');
  } else if (style === 'chrome') {
    el.classList.add('word-chrome');
  } else if (style === 'copper') {
    el.classList.add('word-copper');
  } else if (style === 'ghost') {
    el.style.cssText = '';
    el.className = 'letter';
    el.style.fontFamily = "'Bebas Neue', Impact, sans-serif";
    el.style.fontSize = '120px';
    el.style.fontWeight = '900';
    el.style.lineHeight = '1';
    el.style.webkitTextFillColor = 'transparent';
    el.style.webkitTextStroke = '2px rgba(255,255,255,0.55)';
    el.style.filter = `
      drop-shadow(0px 1px 0px rgba(255,255,255,0.7))
      drop-shadow(0px 2px 0px rgba(200,200,220,0.6))
      drop-shadow(0px 3px 0px rgba(150,155,175,0.55))
      drop-shadow(0px 4px 0px rgba(110,115,135,0.5))
      drop-shadow(0px 5px 0px rgba(80,85,100,0.45))
      drop-shadow(0px 6px 0px rgba(55,60,75,0.42))
      drop-shadow(0px 7px 0px rgba(38,42,55,0.4))
      drop-shadow(0px 8px 0px rgba(25,28,38,0.38))
      drop-shadow(0px 9px 0px rgba(15,17,24,0.35))
      drop-shadow(0px 10px 0px rgba(8,9,14,0.32))
      drop-shadow(2px 16px 22px rgba(0,0,0,0.88))
    `;
    return;
  }

  el.removeAttribute('style');
}
</script>
