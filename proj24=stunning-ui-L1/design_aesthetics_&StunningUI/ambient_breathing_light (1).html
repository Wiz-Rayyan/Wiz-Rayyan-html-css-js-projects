
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; }

  .scene {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 1rem;
    min-height: 420px;
    position: relative;
    background: radial-gradient(ellipse at 50% 60%, #06101e 0%, #020810 100%);
    border-radius: 16px;
    overflow: hidden;
  }

  .label {
    position: absolute;
    top: 1.25rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-sans, system-ui);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(120, 160, 220, 0.5);
    white-space: nowrap;
    transition: color 0.4s;
    user-select: none;
  }

  .status-text {
    position: absolute;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-sans, system-ui);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(100, 160, 220, 0.4);
    white-space: nowrap;
    transition: color 0.4s, opacity 0.4s;
    user-select: none;
  }

  .orb-wrap {
    position: relative;
    width: 200px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(80, 160, 255, 0);
    animation: ring-out 3s ease-out infinite;
    pointer-events: none;
  }
  .ring1 { width: 140px; height: 140px; animation-delay: 0s; }
  .ring2 { width: 170px; height: 170px; animation-delay: 0.6s; }
  .ring3 { width: 200px; height: 200px; animation-delay: 1.2s; }

  @keyframes ring-out {
    0%   { transform: scale(0.7); border-color: rgba(80,160,255,0.0); }
    20%  { border-color: rgba(80,160,255,0.18); }
    100% { transform: scale(1.6); border-color: rgba(80,160,255,0); }
  }

  .glow-outer {
    position: absolute;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(40,120,255,0.18) 0%, rgba(0,200,255,0.06) 60%, transparent 75%);
    animation: breathe-outer 4s ease-in-out infinite;
    pointer-events: none;
  }

  .orb {
    position: relative;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #2080ff, #00d4ff, #2080ff);
    animation: breathe 4s ease-in-out infinite, hue-shift 8s linear infinite;
    box-shadow:
      0 0 24px 8px rgba(32,128,255,0.4),
      0 0 60px 20px rgba(0,212,255,0.15),
      inset 0 2px 8px rgba(255,255,255,0.25);
    transition: box-shadow 0.5s, width 0.3s, height 0.3s;
    z-index: 2;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(0.95); opacity: 0.65; }
    50%       { transform: scale(1.05); opacity: 1; }
  }
  @keyframes breathe-outer {
    0%, 100% { transform: scale(0.9); opacity: 0.5; }
    50%       { transform: scale(1.1); opacity: 1; }
  }
  @keyframes hue-shift {
    0%   { filter: hue-rotate(0deg); }
    50%  { filter: hue-rotate(30deg); }
    100% { filter: hue-rotate(0deg); }
  }

  .orb-wrap:hover .orb {
    animation: breathe-hover 2s ease-in-out infinite, hue-shift 4s linear infinite;
    box-shadow:
      0 0 32px 12px rgba(32,128,255,0.55),
      0 0 80px 28px rgba(0,212,255,0.22),
      inset 0 2px 10px rgba(255,255,255,0.35);
  }
  .orb-wrap:hover .glow-outer {
    animation: breathe-outer 2s ease-in-out infinite;
  }
  .orb-wrap:hover .ring {
    animation-duration: 2s;
  }
  @keyframes breathe-hover {
    0%, 100% { transform: scale(0.97); opacity: 0.75; }
    50%       { transform: scale(1.07); opacity: 1; }
  }

  .scene[data-state="listening"] .orb {
    animation: breathe-listen 1s ease-in-out infinite;
    background: conic-gradient(from 0deg, #00d4ff, #40e0ff, #00d4ff);
    box-shadow:
      0 0 36px 14px rgba(0,212,255,0.6),
      0 0 90px 32px rgba(0,212,255,0.25),
      inset 0 2px 10px rgba(255,255,255,0.4);
  }
  .scene[data-state="listening"] .glow-outer {
    animation: breathe-outer 1s ease-in-out infinite;
    background: radial-gradient(circle, rgba(0,212,255,0.25) 0%, rgba(0,200,255,0.08) 60%, transparent 75%);
  }
  .scene[data-state="listening"] .ring {
    animation-duration: 1.5s;
    border-color: rgba(0,212,255,0.25);
  }
  @keyframes breathe-listen {
    0%, 100% { transform: scale(0.95); opacity: 0.7; }
    50%       { transform: scale(1.1); opacity: 1; }
  }

  .scene[data-state="active"] .orb {
    animation: none;
    transform: scale(1.05);
    opacity: 1;
    background: conic-gradient(from 0deg, #60a8ff, #00e8ff, #60a8ff);
    box-shadow:
      0 0 40px 16px rgba(96,168,255,0.65),
      0 0 100px 40px rgba(0,232,255,0.28),
      inset 0 2px 12px rgba(255,255,255,0.5);
  }
  .scene[data-state="active"] .glow-outer {
    animation: pulse-active 2s ease-in-out infinite;
    background: radial-gradient(circle, rgba(96,168,255,0.28) 0%, rgba(0,232,255,0.1) 60%, transparent 75%);
  }
  .scene[data-state="active"] .ring {
    animation-duration: 1.2s;
    border-color: rgba(96,168,255,0.3);
  }
  @keyframes pulse-active {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50%       { opacity: 1; transform: scale(1.08); }
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-top: 2rem;
    justify-content: center;
  }
  .btn {
    font-family: var(--font-sans, system-ui);
    font-size: 12px;
    letter-spacing: 0.06em;
    padding: 7px 18px;
    border-radius: 20px;
    border: 1px solid rgba(80,160,255,0.3);
    background: rgba(20,50,100,0.4);
    color: rgba(160,200,255,0.8);
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.1s;
    user-select: none;
  }
  .btn:hover { background: rgba(30,80,160,0.5); border-color: rgba(80,160,255,0.5); color: rgba(200,230,255,1); }
  .btn:active { transform: scale(0.97); }
  .btn.active { background: rgba(40,100,200,0.55); border-color: rgba(100,180,255,0.7); color: #a0d4ff; }
</style>

<div class="scene" id="scene" data-state="idle">
  <div class="label" id="label">Ambient · Ready</div>

  <div class="orb-wrap" id="orb-wrap">
    <div class="ring ring1"></div>
    <div class="ring ring2"></div>
    <div class="ring ring3"></div>
    <div class="glow-outer"></div>
    <div class="orb" id="orb"></div>
  </div>

  <div class="status-text" id="status-text">idle — breathing gently</div>

  <div class="controls">
    <button class="btn" id="btn-idle">Idle</button>
    <button class="btn" id="btn-listen">Listening</button>
    <button class="btn" id="btn-active">Active</button>
  </div>
</div>

<script>
  const scene = document.getElementById('scene');
  const label = document.getElementById('label');
  const statusText = document.getElementById('status-text');
  const orbWrap = document.getElementById('orb-wrap');
  const btnIdle = document.getElementById('btn-idle');
  const btnListen = document.getElementById('btn-listen');
  const btnActive = document.getElementById('btn-active');

  const states = {
    idle:      { label: 'Ambient · Ready',   status: 'idle — breathing gently',  btns: ['btn-idle'] },
    listening: { label: 'Listening…',         status: 'listening — pulse doubled', btns: ['btn-listen'] },
    active:    { label: 'Processing',         status: 'active — solid glow',      btns: ['btn-active'] },
  };

  function setState(s) {
    scene.dataset.state = s;
    label.textContent = states[s].label;
    statusText.textContent = states[s].status;
    [btnIdle, btnListen, btnActive].forEach(b => b.classList.remove('active'));
    states[s].btns.forEach(id => document.getElementById(id).classList.add('active'));
  }

  orbWrap.addEventListener('click', () => {
    const cur = scene.dataset.state;
    if (cur === 'idle') setState('listening');
    else if (cur === 'listening') setState('active');
    else setState('idle');
  });

  btnIdle.addEventListener('click', () => setState('idle'));
  btnListen.addEventListener('click', () => setState('listening'));
  btnActive.addEventListener('click', () => setState('active'));

  setState('idle');
</script>
