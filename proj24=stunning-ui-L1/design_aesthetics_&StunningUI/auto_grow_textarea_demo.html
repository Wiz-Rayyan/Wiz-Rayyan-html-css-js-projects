
<style>
h2.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.demo-wrap{background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:2rem;margin:0}
.chat-window{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;display:flex;flex-direction:column;max-height:480px}
.messages{flex:1;overflow-y:auto;padding:1.25rem;display:flex;flex-direction:column;gap:10px;min-height:160px}
.msg{max-width:72%;padding:9px 13px;font-size:14px;line-height:1.5;border-radius:14px;word-break:break-word}
.msg.them{background:var(--color-background-secondary);color:var(--color-text-primary);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:#378ADD;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.input-bar{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;border-top:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary)}
textarea{flex:1;resize:none;border:0.5px solid var(--color-border-secondary);border-radius:20px;padding:9px 14px;font-size:14px;font-family:var(--font-sans);line-height:1.5;background:var(--color-background-secondary);color:var(--color-text-primary);outline:none;overflow:hidden;min-height:38px;max-height:150px;transition:height 0.1s ease;box-sizing:border-box}
textarea:focus{border-color:var(--color-border-primary);box-shadow:0 0 0 2px rgba(55,138,221,0.15)}
textarea::placeholder{color:var(--color-text-tertiary)}
.send-btn{width:36px;height:36px;border-radius:50%;background:#378ADD;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.15s,transform 0.1s;color:#fff;font-size:16px}
.send-btn:hover{background:#185FA5}
.send-btn:active{transform:scale(0.94)}
.send-btn:disabled{background:var(--color-background-secondary);color:var(--color-text-tertiary);cursor:default;border:0.5px solid var(--color-border-tertiary)}
.hint{font-size:12px;color:var(--color-text-tertiary);text-align:center;padding:6px 12px 10px;font-family:var(--font-sans)}
</style>

<h2 class="sr-only">Auto-expanding textarea chat demo. Type a message and press Enter to send, or Shift+Enter for a newline.</h2>

<div class="demo-wrap">
  <div class="chat-window">
    <div class="messages" id="messages">
      <div class="msg them">Hey! Try typing something below 👋</div>
      <div class="msg them">Press <strong>Enter</strong> to send, <strong>Shift+Enter</strong> for a new line.</div>
    </div>
    <div class="hint" id="hint">1 line · 0 / 5 max</div>
    <div class="input-bar">
      <textarea id="ta" rows="1" placeholder="Message..." aria-label="Message input"></textarea>
      <button class="send-btn" id="send-btn" disabled aria-label="Send message">
        <i class="ti ti-arrow-up" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</div>

<script>
const ta = document.getElementById('ta');
const btn = document.getElementById('send-btn');
const msgs = document.getElementById('messages');
const hint = document.getElementById('hint');
const LINE_HEIGHT = 21;
const PADDING = 18;
const MAX_LINES = 5;
const MAX_H = LINE_HEIGHT * MAX_LINES + PADDING;

function resize() {
  ta.style.height = 'auto';
  const h = Math.min(ta.scrollHeight, MAX_H);
  ta.style.height = h + 'px';
  ta.style.overflowY = ta.scrollHeight > MAX_H ? 'auto' : 'hidden';
  const lines = Math.min(Math.round((h - PADDING) / LINE_HEIGHT) + 1, MAX_LINES);
  hint.textContent = lines + ' line' + (lines > 1 ? 's' : '') + ' · ' + lines + ' / 5 max';
  btn.disabled = ta.value.trim() === '';
}

function send() {
  const text = ta.value.trim();
  if (!text) return;
  const div = document.createElement('div');
  div.className = 'msg me';
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  ta.value = '';
  resize();
  hint.textContent = '1 line · 0 / 5 max';
  setTimeout(() => {
    const reply = document.createElement('div');
    reply.className = 'msg them';
    reply.textContent = '✓ Got it!';
    msgs.appendChild(reply);
    msgs.scrollTop = msgs.scrollHeight;
  }, 500);
}

ta.addEventListener('input', resize);
ta.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
btn.addEventListener('click', send);
resize();
</script>
