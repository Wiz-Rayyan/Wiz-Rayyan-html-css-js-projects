
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  #sisyphus-wrap {
    font-family: var(--font-sans);
    min-height: 600px;
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  #top-bar {
    background: var(--color-background-primary);
    border-bottom: 0.5px solid var(--color-border-tertiary);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot-r { background: #ff5f57; }
  .dot-y { background: #febc2e; }
  .dot-g { background: #28c840; }
  #url-bar {
    flex: 1;
    height: 28px;
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-secondary);
    border-radius: 6px;
    padding: 0 10px;
    font-size: 12px;
    color: var(--color-text-secondary);
    display: flex;
    align-items: center;
    user-select: none;
  }

  #content-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .toast {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: #333;
    color: #fff;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 20px;
    opacity: 0;
    transition: all 0.3s ease;
    white-space: nowrap;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0px);
    opacity: 1;
  }

  h2 { font-size: 18px; font-weight: 500; color: var(--color-text-primary); margin: 0 0 6px; }
  p.muted { font-size: 14px; color: var(--color-text-secondary); margin: 0 0 16px; line-height: 1.6; }

  .card {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    padding: 20px;
  }

  .field-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .field-label { font-size: 12px; color: var(--color-text-secondary); font-weight: 500; }
  input[type="text"], textarea {
    width: 100%;
    padding: 8px 12px;
    font-size: 14px;
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md);
    background: var(--color-background-secondary);
    color: var(--color-text-primary);
    font-family: var(--font-sans);
    resize: none;
  }
  textarea { height: 80px; }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    padding: 8px 18px;
    font-size: 14px;
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md);
    background: transparent;
    color: var(--color-text-primary);
    cursor: pointer;
    font-family: var(--font-sans);
    transition: background 0.15s;
  }
  button:hover { background: var(--color-background-secondary); }
  button.primary { background: var(--color-text-primary); color: var(--color-background-primary); border-color: var(--color-text-primary); }
  button.primary:hover { opacity: 0.85; }

  .progress-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .progress-label { font-size: 13px; color: var(--color-text-secondary); min-width: 80px; }
  .progress-track { flex: 1; height: 8px; background: var(--color-background-secondary); border-radius: 4px; overflow: hidden; border: 0.5px solid var(--color-border-tertiary); }
  .progress-fill { height: 100%; border-radius: 4px; background: var(--color-text-secondary); transition: width 0.3s; }
  .progress-val { font-size: 13px; color: var(--color-text-secondary); min-width: 36px; text-align: right; }

  .todo-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .todo-item:last-child { border-bottom: none; }
  input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
  .todo-text { font-size: 14px; color: var(--color-text-primary); }

  .counter-row { display: flex; align-items: center; gap: 14px; }
  #counter-val { font-size: 32px; font-weight: 500; color: var(--color-text-primary); min-width: 48px; text-align: center; }

  #status-bar {
    padding: 8px 16px;
    background: var(--color-background-primary);
    border-top: 0.5px solid var(--color-border-tertiary);
    font-size: 12px;
    color: var(--color-text-tertiary);
    display: flex;
    justify-content: space-between;
  }
  #action-log { font-style: italic; }
</style>

<div id="sisyphus-wrap" style="position:relative;">
  <div id="top-bar">
    <div class="dot dot-r"></div>
    <div class="dot dot-y"></div>
    <div class="dot dot-g"></div>
    <div id="url-bar"><i class="ti ti-lock" style="font-size:11px;margin-right:5px;opacity:0.5;" aria-hidden="true"></i>sisyphus.work/progress</div>
  </div>

  <div id="content-area">
    <div>
      <h2>Make progress</h2>
      <p class="muted">Every action you take is preserved and built upon. Your work is never lost.</p>
    </div>

    <div class="card">
      <div style="font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:14px;text-transform:uppercase;letter-spacing:0.04em;">Today's tasks</div>
      <div id="todo-list">
        <div class="todo-item"><input type="checkbox" id="t1"><label for="t1" class="todo-text">Finish the quarterly report</label></div>
        <div class="todo-item"><input type="checkbox" id="t2"><label for="t2" class="todo-text">Reply to all pending emails</label></div>
        <div class="todo-item"><input type="checkbox" id="t3"><label for="t3" class="todo-text">Update the project timeline</label></div>
        <div class="todo-item"><input type="checkbox" id="t4"><label for="t4" class="todo-text">Review pull requests</label></div>
      </div>
    </div>

    <div class="card">
      <div style="font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:14px;text-transform:uppercase;letter-spacing:0.04em;">Progress tracker</div>
      <div class="progress-row"><span class="progress-label">Overall</span><div class="progress-track"><div class="progress-fill" id="prog1" style="width:0%"></div></div><span class="progress-val" id="prog1-val">0%</span></div>
      <div class="progress-row"><span class="progress-label">This week</span><div class="progress-track"><div class="progress-fill" id="prog2" style="width:0%"></div></div><span class="progress-val" id="prog2-val">0%</span></div>
      <div class="progress-row"><span class="progress-label">This month</span><div class="progress-track"><div class="progress-fill" id="prog3" style="width:0%"></div></div><span class="progress-val" id="prog3-val">0%</span></div>
    </div>

    <div class="card">
      <div style="font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:14px;text-transform:uppercase;letter-spacing:0.04em;">Save your work</div>
      <div class="field-group">
        <span class="field-label">Title</span>
        <input type="text" id="title-input" placeholder="Enter a title for your work…">
      </div>
      <div class="field-group">
        <span class="field-label">Notes</span>
        <textarea id="notes-input" placeholder="Write your notes here…"></textarea>
      </div>
      <div class="btn-row">
        <button class="primary" id="save-btn"><i class="ti ti-device-floppy" aria-hidden="true" style="margin-right:5px;"></i>Save progress</button>
        <button id="submit-btn"><i class="ti ti-send" aria-hidden="true" style="margin-right:5px;"></i>Submit</button>
        <button id="export-btn"><i class="ti ti-download" aria-hidden="true" style="margin-right:5px;"></i>Export</button>
      </div>
    </div>

    <div class="card">
      <div style="font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:14px;text-transform:uppercase;letter-spacing:0.04em;">Counter</div>
      <div class="counter-row">
        <button id="dec-btn" style="font-size:20px;width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;">−</button>
        <span id="counter-val">0</span>
        <button id="inc-btn" style="font-size:20px;width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;">+</button>
      </div>
    </div>
  </div>

  <div id="status-bar">
    <span id="action-log">Awaiting your first action…</span>
    <span id="undo-count">Undone: 0</span>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function() {
  let undoneCount = 0;
  let typingTimers = {};

  const messages = [
    "The boulder rolls back down.",
    "Progress undone.",
    "It was never meant to be.",
    "Back to the start.",
    "The mountain wins again.",
    "Sisyphus nods knowingly.",
    "All is reset.",
    "Nothing is saved.",
    "The work vanishes.",
    "Begin again.",
    "The gods are watching.",
    "Your effort was noted. Then erased.",
  ];

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  function logAction(msg) {
    document.getElementById('action-log').textContent = msg;
  }

  function bumpUndone() {
    undoneCount++;
    document.getElementById('undo-count').textContent = 'Undone: ' + undoneCount;
  }

  function randomMsg() {
    return messages[Math.floor(Math.random() * messages.length)];
  }

  const scrollArea = document.getElementById('content-area');
  scrollArea.addEventListener('scroll', function() {
    if (scrollArea.scrollTop > 0) {
      setTimeout(() => {
        scrollArea.scrollTo({ top: 0, behavior: 'smooth' });
        logAction('Scroll undone — you return to the beginning.');
        showToast(randomMsg());
        bumpUndone();
      }, 400);
    }
  });

  function watchInput(el, label) {
    el.addEventListener('input', function() {
      clearTimeout(typingTimers[el.id]);
      typingTimers[el.id] = setTimeout(() => {
        if (el.value.length > 0) {
          el.value = '';
          logAction(label + ' — text dissolves as it's written.');
          showToast(randomMsg());
          bumpUndone();
        }
      }, 900);
    });
  }

  watchInput(document.getElementById('title-input'), 'Title erased');
  watchInput(document.getElementById('notes-input'), 'Notes erased');

  document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', function() {
      const checked = cb.checked;
      setTimeout(() => {
        cb.checked = !checked;
        logAction('Checkbox toggled — then untoggled. No task is ever done.');
        showToast(randomMsg());
        bumpUndone();
      }, 600);
    });
  });

  let counterVal = 0;
  document.getElementById('inc-btn').addEventListener('click', function() {
    counterVal++;
    document.getElementById('counter-val').textContent = counterVal;
    setTimeout(() => {
      counterVal = 0;
      document.getElementById('counter-val').textContent = '0';
      logAction('Counter incremented — then returned to zero.');
      showToast(randomMsg());
      bumpUndone();
    }, 700);
  });
  document.getElementById('dec-btn').addEventListener('click', function() {
    counterVal--;
    document.getElementById('counter-val').textContent = counterVal;
    setTimeout(() => {
      counterVal = 0;
      document.getElementById('counter-val').textContent = '0';
      logAction('Counter decremented — then returned to zero.');
      showToast(randomMsg());
      bumpUndone();
    }, 700);
  });

  function flashProgress() {
    const targets = [
      { fill: document.getElementById('prog1'), val: document.getElementById('prog1-val') },
      { fill: document.getElementById('prog2'), val: document.getElementById('prog2-val') },
      { fill: document.getElementById('prog3'), val: document.getElementById('prog3-val') },
    ];
    let p = 0;
    const rise = setInterval(() => {
      p += 4;
      if (p > 100) p = 100;
      targets.forEach(t => {
        t.fill.style.width = p + '%';
        t.val.textContent = p + '%';
      });
      if (p >= 100) {
        clearInterval(rise);
        setTimeout(() => {
          targets.forEach(t => {
            t.fill.style.width = '0%';
            t.val.textContent = '0%';
          });
          logAction('Progress bars reached 100% — then reset to 0%.');
          showToast(randomMsg());
          bumpUndone();
        }, 800);
      }
    }, 30);
  }

  ['save-btn', 'submit-btn', 'export-btn'].forEach(id => {
    document.getElementById(id).addEventListener('click', function() {
      const label = { 'save-btn': 'Save', 'submit-btn': 'Submit', 'export-btn': 'Export' }[id];
      logAction(label + ' clicked — the action reverses itself.');
      flashProgress();
      showToast(randomMsg());
      bumpUndone();
    });
  });

  setInterval(() => {
    if (undoneCount > 0 && Math.random() > 0.7) {
      logAction('The boulder rolls back. Sisyphus begins again.');
    }
  }, 5000);
})();
</script>
