<h2 class="sr-only">Rich typography design panel with six linked slider and number input controls — font size, line height, letter spacing, rotation, opacity, and blur — with a live text preview that updates in real time.</h2>

<style>
*{box-sizing:border-box;margin:0;padding:0}
.root{padding:1.25rem 0;display:flex;flex-direction:column;gap:1rem;font-family:var(--font-sans)}

.preview-stage{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);min-height:160px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;padding:2rem}
.preview-stage .chip{position:absolute;top:10px;right:12px;font-size:11px;color:var(--color-text-tertiary);background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:20px;padding:3px 10px}
#preview-text{font-weight:500;color:var(--color-text-primary);white-space:nowrap;line-height:1.4;will-change:transform,opacity,filter}

.panel{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem;border-bottom:0.5px solid var(--color-border-tertiary)}
.panel-title{font-size:12px;font-weight:500;color:var(--color-text-secondary);letter-spacing:.05em;text-transform:uppercase}
.reset-btn{font-size:12px;color:var(--color-text-tertiary);background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:4px;padding:3px 6px;border-radius:var(--border-radius-md)}
.reset-btn:hover{background:var(--color-background-secondary);color:var(--color-text-secondary)}

.ctrl-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.ctrl-item{padding:.85rem 1rem;border-bottom:0.5px solid var(--color-border-tertiary);border-right:0.5px solid var(--color-border-tertiary)}
.ctrl-item:nth-child(even){border-right:none}
.ctrl-item:nth-last-child(-n+2){border-bottom:none}

.ctrl-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.ctrl-name{font-size:12px;color:var(--color-text-secondary);font-weight:500}
.ctrl-right{display:flex;align-items:center;gap:6px}
.ctrl-unit{font-size:11px;color:var(--color-text-tertiary);min-width:22px;text-align:right}
input[type=number].ctrl-num{width:52px;font-size:13px;font-weight:500;text-align:center;padding:2px 4px;height:28px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary)}
input[type=number].ctrl-num:focus{outline:none;box-shadow:0 0 0 2px var(--color-border-info)}

.track-wrap{position:relative;height:20px;display:flex;align-items:center}
input[type=range].ctrl-range{width:100%;height:4px;-webkit-appearance:none;appearance:none;background:var(--color-border-tertiary);border-radius:2px;outline:none;cursor:pointer;position:relative}
input[type=range].ctrl-range::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--color-text-primary);border:2px solid var(--color-background-primary);box-shadow:0 0 0 1px var(--color-border-primary);cursor:grab}
input[type=range].ctrl-range:active::-webkit-slider-thumb{cursor:grabbing}
input[type=range].ctrl-range::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--color-text-primary);border:2px solid var(--color-background-primary);cursor:grab}
.track-fill{position:absolute;left:0;top:50%;transform:translateY(-50%);height:4px;background:var(--color-text-primary);border-radius:2px;pointer-events:none}

.value-bar{display:flex;gap:8px;padding:.75rem 1rem;border-top:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary)}
.val-chip{flex:1;text-align:center;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:6px 4px}
.val-chip .vc-label{font-size:11px;color:var(--color-text-tertiary)}
.val-chip .vc-val{font-size:14px;font-weight:500;color:var(--color-text-primary)}

.presets-row{display:flex;gap:8px;flex-wrap:wrap}
.preset-btn{font-size:12px;padding:5px 12px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;white-space:nowrap}
.preset-btn:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}
.preset-btn.active{background:var(--color-background-primary);border-color:var(--color-border-primary);color:var(--color-text-primary);font-weight:500}
</style>

<div class="root">

  <div class="preview-stage">
    <span class="chip" id="css-chip">font-size: 28px</span>
    <span id="preview-text">Typography</span>
  </div>

  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <span style="font-size:12px;color:var(--color-text-tertiary)">Presets:</span>
    <div class="presets-row" id="presets-row">
      <button class="preset-btn" data-preset="editorial">Editorial</button>
      <button class="preset-btn" data-preset="display">Display</button>
      <button class="preset-btn" data-preset="caption">Caption</button>
      <button class="preset-btn" data-preset="ghost">Ghost</button>
      <button class="preset-btn" data-preset="wide">Wide</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Controls</span>
      <button class="reset-btn" id="reset-btn"><i class="ti ti-refresh" aria-hidden="true" style="font-size:13px"></i> Reset</button>
    </div>

    <div class="ctrl-grid" id="ctrl-grid"></div>

    <div class="value-bar" id="value-bar"></div>
  </div>

</div>

<script>
const controls = [
  {id:'fs',  label:'Font size',      unit:'px',  min:10,   max:96,   step:1,   def:28,  decimals:0},
  {id:'lh',  label:'Line height',    unit:'',    min:0.8,  max:3,    step:0.05,def:1.4, decimals:2},
  {id:'ls',  label:'Letter spacing', unit:'em',  min:-0.1, max:0.5,  step:0.01,def:0,   decimals:2},
  {id:'rot', label:'Rotation',       unit:'deg', min:-180, max:180,  step:1,   def:0,   decimals:0},
  {id:'op',  label:'Opacity',        unit:'%',   min:0,    max:100,  step:1,   def:100, decimals:0},
  {id:'blur',label:'Blur',           unit:'px',  min:0,    max:20,   step:0.5, def:0,   decimals:1},
];

const presets = {
  editorial: {fs:18, lh:1.7, ls:0.01,  rot:0,  op:100, blur:0},
  display:   {fs:64, lh:1.0, ls:-0.03, rot:0,  op:100, blur:0},
  caption:   {fs:12, lh:1.5, ls:0.04,  rot:0,  op:70,  blur:0},
  ghost:     {fs:36, lh:1.4, ls:0.05,  rot:0,  op:20,  blur:0},
  wide:      {fs:22, lh:1.4, ls:0.15,  rot:0,  op:100, blur:0},
};

const state = {};
controls.forEach(c => state[c.id] = c.def);

const grid = document.getElementById('ctrl-grid');
const valueBar = document.getElementById('value-bar');
const previewText = document.getElementById('preview-text');
const cssChip = document.getElementById('css-chip');

function pct(c, val) {
  return ((val - c.min) / (c.max - c.min)) * 100;
}

function buildControls() {
  grid.innerHTML = '';
  controls.forEach(c => {
    const item = document.createElement('div');
    item.className = 'ctrl-item';
    item.innerHTML = `
      <div class="ctrl-top">
        <span class="ctrl-name">${c.label}</span>
        <div class="ctrl-right">
          <input type="number" class="ctrl-num" id="num-${c.id}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.def}">
          <span class="ctrl-unit">${c.unit}</span>
        </div>
      </div>
      <div class="track-wrap">
        <div class="track-fill" id="fill-${c.id}" style="width:${pct(c,c.def)}%"></div>
        <input type="range" class="ctrl-range" id="range-${c.id}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.def}">
      </div>`;
    grid.appendChild(item);

    const range = item.querySelector(`#range-${c.id}`);
    const num   = item.querySelector(`#num-${c.id}`);
    const fill  = item.querySelector(`#fill-${c.id}`);

    function update(val) {
      const clamped = Math.min(c.max, Math.max(c.min, parseFloat(val) || c.min));
      const rounded = parseFloat(clamped.toFixed(c.decimals));
      state[c.id] = rounded;
      range.value = rounded;
      num.value   = rounded;
      fill.style.width = pct(c, rounded) + '%';
      applyPreview();
      updateValueBar();
      clearPresetActive();
    }

    range.addEventListener('input', () => update(range.value));
    num.addEventListener('input',   () => update(num.value));
    num.addEventListener('change',  () => update(num.value));
  });
}

function buildValueBar() {
  valueBar.innerHTML = controls.map(c =>
    `<div class="val-chip">
      <div class="vc-label">${c.id}</div>
      <div class="vc-val" id="vc-${c.id}">${c.def}${c.unit}</div>
    </div>`
  ).join('');
}

function updateValueBar() {
  controls.forEach(c => {
    const el = document.getElementById('vc-'+c.id);
    if(el) el.textContent = state[c.id] + c.unit;
  });
}

function applyPreview() {
  const el = previewText;
  el.style.fontSize      = state.fs + 'px';
  el.style.lineHeight    = state.lh;
  el.style.letterSpacing = state.ls + 'em';
  el.style.transform     = `rotate(${state.rot}deg)`;
  el.style.opacity       = state.op / 100;
  el.style.filter        = state.blur > 0 ? `blur(${state.blur}px)` : 'none';
  cssChip.textContent = `font-size: ${state.fs}px · opacity: ${state.op}%`;
}

function setValues(vals) {
  controls.forEach(c => {
    const val = vals[c.id] !== undefined ? vals[c.id] : c.def;
    state[c.id] = val;
    const range = document.getElementById('range-'+c.id);
    const num   = document.getElementById('num-'+c.id);
    const fill  = document.getElementById('fill-'+c.id);
    if(range) range.value = val;
    if(num)   num.value   = val;
    if(fill)  fill.style.width = pct(c, val) + '%';
  });
  applyPreview();
  updateValueBar();
}

function clearPresetActive() {
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
}

document.getElementById('presets-row').addEventListener('click', e => {
  const btn = e.target.closest('.preset-btn');
  if(!btn) return;
  const key = btn.dataset.preset;
  if(presets[key]) {
    clearPresetActive();
    btn.classList.add('active');
    setValues(presets[key]);
  }
});

document.getElementById('reset-btn').addEventListener('click', () => {
  const defaults = {};
  controls.forEach(c => defaults[c.id] = c.def);
  clearPresetActive();
  setValues(defaults);
});

buildControls();
buildValueBar();
applyPreview();
updateValueBar();
</script>
