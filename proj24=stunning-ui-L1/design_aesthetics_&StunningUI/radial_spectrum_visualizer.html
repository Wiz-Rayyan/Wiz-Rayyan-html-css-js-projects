
<style>
  .viz-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 1rem 0; }
  canvas { cursor: grab; border-radius: 50%; display: block; }
  canvas:active { cursor: grabbing; }
  .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn { font-size: 13px; padding: 6px 16px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--color-background-secondary); }
  .tooltip { font-size: 12px; color: var(--color-text-secondary); min-height: 18px; text-align: center; }
  .loop-info { font-size: 12px; color: var(--color-text-secondary); }
  .file-label { font-size: 13px; padding: 6px 16px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; }
  .file-label:hover { background: var(--color-background-secondary); }
  input[type=file] { display: none; }
</style>
<div class="viz-wrap">
  <h2 class="sr-only">Radial spectrum audio visualizer. Circular bars radiate from center, mapping frequency amplitude. Hover for frequency labels, click to set loop point, drag to rotate.</h2>
  <canvas id="viz" width="500" height="500"></canvas>
  <div class="tooltip" id="tip">hover a bar to see frequency range</div>
  <div class="controls">
    <button class="btn" id="playBtn"><i class="ti ti-player-play" aria-hidden="true"></i> <span id="playLabel">play demo</span></button>
    <label class="file-label"><i class="ti ti-upload" aria-hidden="true" style="vertical-align:-2px;margin-right:4px"></i>load audio<input type="file" id="fileIn" accept="audio/*"></label>
    <span class="loop-info" id="loopInfo">loop: none</span>
  </div>
</div>
<script>
const canvas = document.getElementById('viz');
const ctx = canvas.getContext('2d');
const tip = document.getElementById('tip');
const playBtn = document.getElementById('playBtn');
const playLabel = document.getElementById('playLabel');
const loopInfo = document.getElementById('loopInfo');
const fileIn = document.getElementById('fileIn');

const W = 500, H = 500, CX = 250, CY = 250;
const NUM_BARS = 128;
const MIN_H = 10, MAX_H = 100;
const INNER_R = 80;

let audioCtx, analyser, source, audioBuffer;
let dataArr = new Uint8Array(NUM_BARS).fill(0);
let isPlaying = false;
let rotation = 0;
let dragging = false, lastX = 0, lastY = 0;
let hoveredBar = -1;
let loopStart = -1;
let animId;

function freqLabel(i) {
  const nyq = (audioCtx && analyser) ? audioCtx.sampleRate / 2 : 22050;
  const hz = Math.round((i / NUM_BARS) * nyq);
  const hz2 = Math.round(((i + 1) / NUM_BARS) * nyq);
  if (hz2 <= 300) return `bass (${hz}–${hz2} Hz)`;
  if (hz2 <= 4000) return `mids (${hz}–${hz2} Hz)`;
  return `treble (${hz}–${hz2} Hz)`;
}

function makeDemoData(t) {
  const arr = new Uint8Array(NUM_BARS);
  for (let i = 0; i < NUM_BARS; i++) {
    const bass = i < 10 ? 180 + 60 * Math.sin(t * 2.1 + i * 0.4) : 0;
    const mid  = (i >= 10 && i < 60) ? 90 + 70 * Math.sin(t * 1.3 + i * 0.15) : 0;
    const hi   = i >= 60 ? 40 + 40 * Math.sin(t * 3.7 + i * 0.1) : 0;
    arr[i] = Math.max(0, Math.min(255, bass + mid + hi));
  }
  return arr;
}

let demoT = 0;
let demoMode = false;

function draw(ts) {
  animId = requestAnimationFrame(draw);
  if (demoMode) {
    demoT += 0.025;
    dataArr = makeDemoData(demoT);
  } else if (analyser) {
    analyser.getByteFrequencyData(dataArr);
  }

  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(rotation);

  const angleStep = (2 * Math.PI) / NUM_BARS;
  for (let i = 0; i < NUM_BARS; i++) {
    const amp = dataArr[i] / 255;
    const barH = MIN_H + amp * (MAX_H - MIN_H);
    const angle = i * angleStep - Math.PI / 2;

    ctx.save();
    ctx.rotate(angle);

    const x1 = INNER_R;
    const x2 = INNER_R + barH;
    const barW = Math.max(2, (2 * Math.PI * INNER_R / NUM_BARS) * 0.72);

    const grad = ctx.createLinearGradient(x1, 0, x2, 0);
    const isHovered = i === hoveredBar;
    if (isHovered) {
      grad.addColorStop(0, '#00fff0');
      grad.addColorStop(1, '#ff88ff');
    } else {
      grad.addColorStop(0, '#00d4c8');
      grad.addColorStop(1, '#8844cc');
    }

    ctx.fillStyle = grad;
    ctx.globalAlpha = isHovered ? 1 : 0.85;
    ctx.beginPath();
    ctx.roundRect(x1, -barW / 2, barH, barW, 2);
    ctx.fill();

    if (i === loopStart) {
      ctx.strokeStyle = '#ffcc00';
      ctx.lineWidth = 2;
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.moveTo(x1 - 4, -barW);
      ctx.lineTo(x1 - 4, barW);
      ctx.stroke();
    }

    ctx.restore();
  }

  const cGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, INNER_R - 4);
  cGrad.addColorStop(0, 'rgba(0,212,200,0.18)');
  cGrad.addColorStop(1, 'rgba(136,68,204,0.08)');
  ctx.globalAlpha = 1;
  ctx.fillStyle = cGrad;
  ctx.beginPath();
  ctx.arc(0, 0, INNER_R - 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

canvas.addEventListener('mousemove', e => {
  if (dragging) {
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    rotation += (dx + dy) * 0.012;
    lastX = e.clientX; lastY = e.clientY;
    return;
  }
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left - CX;
  const my = e.clientY - rect.top - CY;
  const dist = Math.sqrt(mx * mx + my * my);
  if (dist < INNER_R || dist > INNER_R + MAX_H + 8) {
    hoveredBar = -1; tip.textContent = 'hover a bar to see frequency range'; return;
  }
  let angle = Math.atan2(my, mx) + Math.PI / 2 - rotation;
  angle = ((angle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  const barIdx = Math.floor(angle / (2 * Math.PI) * NUM_BARS);
  hoveredBar = barIdx;
  tip.textContent = freqLabel(barIdx);
});

canvas.addEventListener('mouseleave', () => { hoveredBar = -1; tip.textContent = 'hover a bar to see frequency range'; });
canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('mouseup', () => { dragging = false; });

canvas.addEventListener('click', e => {
  if (Math.abs(e.movementX) + Math.abs(e.movementY) > 3) return;
  if (hoveredBar >= 0) {
    loopStart = hoveredBar;
    loopInfo.textContent = `loop start: bar ${hoveredBar} (${freqLabel(hoveredBar)})`;
  }
});

function stopAll() {
  if (source) { try { source.stop(); } catch(e){} source = null; }
  demoMode = false;
  isPlaying = false;
}

playBtn.addEventListener('click', () => {
  if (isPlaying || demoMode) {
    stopAll();
    playLabel.textContent = 'play demo';
    playBtn.querySelector('i').className = 'ti ti-player-play';
  } else {
    demoMode = true;
    isPlaying = false;
    playLabel.textContent = 'stop';
    playBtn.querySelector('i').className = 'ti ti-player-pause';
  }
});

fileIn.addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  if (!audioCtx) audioCtx = new AudioContext();
  const buf = await file.arrayBuffer();
  audioBuffer = await audioCtx.decodeAudioData(buf);
  stopAll();
  if (!analyser) {
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = NUM_BARS * 2;
    analyser.smoothingTimeConstant = 0.8;
    analyser.connect(audioCtx.destination);
  }
  source = audioCtx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(analyser);
  source.loop = loopStart >= 0;
  source.start(0, loopStart >= 0 ? (loopStart / NUM_BARS) * audioBuffer.duration : 0);
  isPlaying = true; demoMode = false;
  playLabel.textContent = 'stop';
  playBtn.querySelector('i').className = 'ti ti-player-pause';
  source.onended = () => { isPlaying = false; demoMode = false; playLabel.textContent = 'play demo'; playBtn.querySelector('i').className = 'ti ti-player-play'; };
});

draw();
</script>
