function buildSanadDivider(n) {
  let out = '<div class="sanad-node-sm"></div>';
  for(let i=0;i<n;i++) out += '<div class="sanad-line-sm" style="min-width:8px"></div><div class="sanad-node-sm"></div>';
  return out;
}

function buildSanadSVG(sanad) {
  const n = sanad.length;
  if (!n) return '';
  const W = 560, H = 72;
  const nodeR = 20;
  const spacing = Math.min(120, (W - nodeR*2) / Math.max(n-1,1));
  const totalW = (n-1)*spacing + nodeR*2;
  const startX = (W - totalW)/2 + nodeR;
  const cy = 36;

  let nodes = '';
  let lines = '';
  for(let i=0;i<n;i++) {
    const cx = startX + i*spacing;
    if (i>0) {
      lines += `<line x1="${startX+(i-1)*spacing + nodeR}" y1="${cy}" x2="${cx - nodeR}" y2="${cy}" stroke="#8B1A1A" stroke-width="1.5" marker-end="url(#sarrow)"/>`;
    }
    nodes += `<g>
      <circle cx="${cx}" cy="${cy}" r="${nodeR}" fill="#F5E6C8" stroke="#C9913A" stroke-width="1.5"/>
      <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="8" font-family="Crimson Pro,serif" fill="#1A1208" font-weight="600">${sanad[i].split(' ').slice(-1)[0].replace('ibn','')}</text>
      <text x="${cx}" y="${cy+nodeR+11}" text-anchor="middle" font-size="8" font-family="Crimson Pro,serif" fill="#8B7340">${sanad[i].length > 12 ? sanad[i].substring(0,12)+'…' : sanad[i]}</text>
    </g>`;
  }

  return `<svg viewBox="0 0 ${W} ${H+20}" width="100%" height="${H+20}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="sarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#8B1A1A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    ${lines}${nodes}
  </svg>`;
}

      <!-- City dots -->
      ${cities.map(c=>{
        const isHome = false; // simplified
        return `<g>
          <circle cx="${parseFloat(c.x)*4}" cy="${parseFloat(c.y)*1.6}" r="4" fill="rgba(201,145,58,0.7)" stroke="#8B1A1A" stroke-width="0.8"/>

const ALL_PHYS = Object.values(PHYSICIANS).flat();

function nextAnecdote(id) {
  const p = ALL_PHYS.find(x=>x.id===id);

  anecdoteIndex = (anecdoteIndex + 1) % p.anecdotes.length;
  document.getElementById('anecdoteText').textContent = p.anecdotes[anecdoteIndex];
  document.getElementById('anecdoteBox').style.opacity = '0';
  setTimeout(()=>{ document.getElementById('anecdoteBox').style.transition='opacity 0.4s'; document.getElementById('anecdoteBox').style.opacity = '1'; }, 50);
}

function searchBib(q) {
  if (!q.trim()) { 
    const p = ALL_PHYS.find(x=>x.id===currentPhysician);
    if (p) document.getElementById('bibResult').innerHTML = p.works.map(w=>`<div style="padding:3px 0;border-bottom:1px dotted rgba(201,145,58,0.2);font-size:12px">📜 ${w.t}</div>`).join('');
    return;
  }
  const results = [];
  ALL_PHYS.forEach(p=>{
    p.works.forEach(w=>{
      if (w.t.toLowerCase().includes(q.toLowerCase()) || p.latin.toLowerCase().includes(q.toLowerCase()) || p.arabic.includes(q)) {
        results.push({physician: p.latin, work: w});
      }
    });
  });
  document.getElementById('bibResult').innerHTML = results.length ? 
    results.map(r=>`<div style="padding:3px 0;border-bottom:1px dotted rgba(201,145,58,0.2);font-size:11px"><span style="color:#8B7340">${r.physician}</span><br>${r.work.i} ${r.work.t}</div>`).join('') :
    '<div style="font-style:italic;font-size:11px;color:#8B7340">No works found</div>';
}

function exploreNetwork(q) {
  if (!q.trim()) return;
  const p = ALL_PHYS.find(x=>x.latin.toLowerCase().includes(q.toLowerCase()) || x.arabic.includes(q));
  const res = document.getElementById('netResult');
  if (!p) { res.innerHTML = '<div style="font-style:italic;font-size:11px;color:#8B7340">Physician not found in registry</div>'; return; }
  res.innerHTML = `
    <div style="font-size:11px;color:#8B7340;margin-bottom:4px">Teachers of ${p.arabic.split(' ')[0]}</div>
    ${p.teachers.map(t=>`<div style="font-size:12px;padding:2px 0">⬆ ${t}</div>`).join('') || '<div style="font-size:12px;font-style:italic;color:#8B7340">None recorded</div>'}

    ${p.students.map(s=>`<div style="font-size:12px;padding:2px 0">⬇ ${s}</div>`).join('')}
  `;
}
