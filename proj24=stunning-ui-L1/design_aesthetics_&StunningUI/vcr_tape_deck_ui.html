
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  .vcr-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 2rem 1rem;
    background: #0a0a14;
    border-radius: 12px;
    min-height: 420px;
  }

  .vcr-unit {
    background: linear-gradient(160deg, #1a1a2e 0%, #12121f 60%, #0d0d1a 100%);
    border: 3px outset #555;
    border-radius: 8px 8px 6px 6px;
    width: 580px;
    padding: 18px 22px 20px;
    box-shadow: inset 0 2px 8px #000a, 4px 4px 18px #000c;
    position: relative;
    font-family: 'Share Tech Mono', 'Courier New', monospace;
  }

  .brand-strip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .brand-name {
    font-size: 11px;
    letter-spacing: 4px;
    color: #555;
    text-transform: uppercase;
  }

  .model-num {
    font-size: 10px;
    color: #444;
    letter-spacing: 2px;
  }

  .crt-screen {
    background: #000033;
    border: 3px inset #666;
    border-radius: 14px / 10px;
    padding: 14px 16px 12px;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
    min-height: 110px;
    box-shadow: inset 0 0 40px #0004, inset 0 0 6px #00ffff08;
  }

  .crt-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.25) 2px,
      rgba(0,0,0,0.25) 4px
    );
    pointer-events: none;
    z-index: 2;
    border-radius: inherit;
  }

  .tracking-line {
    position: absolute;
    left: 0; right: 0;
    height: 3px;
    background: rgba(255,255,255,0.09);
    z-index: 3;
    animation: trackScan 4.5s linear infinite;
  }

  @keyframes trackScan {
    0%   { top: -4px; opacity: 0; }
    5%   { opacity: 1; }
    90%  { opacity: 0.6; }
    100% { top: 110%; opacity: 0; }
  }

  .static-glitch {
    position: absolute;
    left: 0; right: 0; height: 8px;
    background: repeating-linear-gradient(90deg,
      transparent 0px, rgba(0,255,255,0.04) 1px, transparent 2px,
      rgba(255,255,255,0.06) 3px, transparent 4px
    );
    z-index: 3;
    animation: glitchMove 7s ease-in-out infinite;
    opacity: 0;
  }

  @keyframes glitchMove {
    0%,100% { top: 20%; opacity: 0; }
    47% { opacity: 0; top: 30%; }
    50% { opacity: 1; top: 28%; }
    53% { opacity: 0; top: 60%; }
    80% { opacity: 0; top: 80%; }
    82% { opacity: 0.8; top: 78%; }
    84% { opacity: 0; }
  }

  .screen-content {
    position: relative;
    z-index: 1;
    color: #00ffff;
  }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }

  .indicator-group {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .indicator {
    font-size: 11px;
    letter-spacing: 1.5px;
    padding: 2px 6px;
    border: 1px solid currentColor;
    opacity: 0.18;
    transition: opacity 0.1s;
    border-radius: 2px;
  }

  .indicator.active {
    opacity: 1;
  }

  .ind-play { color: #00ff88; }
  .ind-rec { color: #ff3333; }
  .ind-pause { color: #ffcc00; }
  .ind-rew { color: #00ccff; }
  .ind-ff { color: #ff8800; }

  .ind-rec.active {
    animation: recBlink 1s step-end infinite;
  }

  @keyframes recBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  .counter-block {
    text-align: right;
  }

  .counter-label {
    font-size: 9px;
    color: #336;
    letter-spacing: 2px;
    margin-bottom: 2px;
  }

  .counter {
    font-size: 26px;
    color: #00ffff;
    letter-spacing: 4px;
    text-shadow: 0 0 8px rgba(0,255,255,0.4);
    font-weight: bold;
  }

  .tape-bar-wrap {
    margin: 8px 0 6px;
  }

  .tape-label-row {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: #335;
    letter-spacing: 1px;
    margin-bottom: 3px;
  }

  .tape-bar {
    height: 6px;
    background: #000055;
    border: 1px solid #224;
    border-radius: 2px;
    overflow: hidden;
  }

  .tape-fill {
    height: 100%;
    background: #00ffff;
    border-radius: 2px;
    transition: width 0.5s ease;
    box-shadow: 0 0 4px rgba(0,255,255,0.5);
  }

  .bottom-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
  }

  .mode-label {
    font-size: 13px;
    letter-spacing: 2px;
    color: #00ffff;
  }

  .sp-label {
    font-size: 9px;
    color: #224;
    letter-spacing: 2px;
  }

  .channel-disp {
    font-size: 11px;
    color: #0088cc;
    letter-spacing: 1px;
  }

  .controls-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
  }

  .btn {
    background: linear-gradient(180deg, #2a2a3e 0%, #1a1a2a 100%);
    border: 2px outset #666;
    border-radius: 4px;
    color: #aaa;
    cursor: pointer;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 7px 10px;
    min-width: 44px;
    text-align: center;
    transition: all 0.08s;
    position: relative;
    user-select: none;
  }

  .btn:active, .btn.pressed {
    border-style: inset;
    background: linear-gradient(180deg, #111122 0%, #1a1a2a 100%);
    transform: translateY(1px);
  }

  .btn.large {
    padding: 9px 14px;
    font-size: 14px;
    min-width: 56px;
    color: #fff;
    background: linear-gradient(180deg, #2c2c42 0%, #1a1a2a 100%);
  }

  .btn-play { color: #00ff88; border-color: #446644; }
  .btn-rec { color: #ff4444; border-color: #664444; }
  .btn-rew { color: #66aaff; border-color: #224466; }
  .btn-ff { color: #ffaa44; border-color: #664422; }
  .btn-stop { color: #cccccc; }
  .btn-pause { color: #ffcc00; border-color: #665500; }
  .btn-eject { color: #cc88ff; border-color: #553366; }

  .tape-slot-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 10px;
  }

  .tape-slot {
    flex: 1;
    height: 18px;
    background: #050510;
    border: 2px inset #444;
    border-radius: 2px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }

  .tape-slot-inner {
    position: absolute;
    inset: 3px;
    background: #111118;
    border: 1px solid #222;
    border-radius: 1px;
    transition: background 0.3s;
  }

  .tape-slot.loaded .tape-slot-inner {
    background: #1a0a00;
    border-color: #4a2200;
  }

  .slot-label {
    font-size: 9px;
    color: #444;
    letter-spacing: 2px;
    white-space: nowrap;
  }

  .led-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .led {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #220000;
    border: 1px solid #440000;
  }

  .led.green { background: #003300; border-color: #006600; }
  .led.green.on { background: #00ff44; box-shadow: 0 0 4px #00ff44; animation: ledPulse 2s ease-in-out infinite; }
  .led.red { background: #220000; border-color: #440000; }
  .led.red.on { background: #ff2222; box-shadow: 0 0 4px #ff2200; }
  .led.orange { background: #221000; border-color: #442200; }
  .led.orange.on { background: #ff8800; box-shadow: 0 0 4px #ff6600; }

  @keyframes ledPulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, #333, transparent);
    margin: 10px 0;
  }

  .bottom-panel {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .brand-logo {
    font-size: 16px;
    letter-spacing: 5px;
    color: #333;
    text-transform: uppercase;
  }

  .model-info {
    font-size: 9px;
    color: #2a2a3a;
    letter-spacing: 2px;
  }

  .vent-slots {
    display: flex;
    gap: 3px;
  }

  .vent {
    width: 2px;
    height: 20px;
    background: #111;
    border-radius: 1px;
  }
</style>

<div class="vcr-wrap" role="region" aria-label="VCR tape deck interface">
  <h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Interactive VCR / tape deck aesthetic UI with play, record, and transport controls</h2>
  <div class="vcr-unit">

    <div class="brand-strip">
      <span class="brand-name">VidéoCorp</span>
      <div class="led-row">
        <div class="led green on" id="led-power"></div>
        <div class="led red" id="led-rec"></div>
        <div class="led orange" id="led-tape"></div>
      </div>
      <span class="model-num">HQ-7800</span>
    </div>

    <div class="crt-screen">
      <div class="tracking-line"></div>
      <div class="static-glitch"></div>
      <div class="screen-content">
        <div class="top-row">
          <div class="indicator-group">
            <span class="indicator ind-play active" id="ind-play">▶ PLAY</span>
            <span class="indicator ind-rec" id="ind-rec">● REC</span>
            <span class="indicator ind-pause" id="ind-pause">⏸ PAUSE</span>
            <span class="indicator ind-rew" id="ind-rew">◀◀ REW</span>
            <span class="indicator ind-ff" id="ind-ff">FF ▶▶</span>
          </div>
          <div class="counter-block">
            <div class="counter-label">COUNTER</div>
            <div class="counter" id="counter">00:34:12</div>
          </div>
        </div>

        <div class="tape-bar-wrap">
          <div class="tape-label-row">
            <span>00:00:00</span>
            <span>TAPE PROGRESS</span>
            <span>02:00:00</span>
          </div>
          <div class="tape-bar">
            <div class="tape-fill" id="tape-fill" style="width:28%"></div>
          </div>
        </div>

        <div class="bottom-row">
          <span class="mode-label" id="mode-label">PLAY</span>
          <span class="sp-label">SP · HI-FI</span>
          <span class="channel-disp">CH 03</span>
        </div>
      </div>
    </div>

    <div class="tape-slot-row">
      <span class="slot-label">CASSETTE</span>
      <div class="tape-slot loaded" id="tape-slot" title="Click to eject" onclick="handleEject()">
        <div class="tape-slot-inner"></div>
      </div>
    </div>

    <div class="controls-row">
      <button class="btn btn-rew large" onclick="setMode('rew')" title="Rewind">◀◀</button>
      <button class="btn btn-play large" onclick="setMode('play')" title="Play">▶</button>
      <button class="btn btn-pause large" onclick="setMode('pause')" title="Pause">⏸</button>
      <button class="btn btn-ff large" onclick="setMode('ff')" title="Fast Forward">▶▶</button>
      <button class="btn btn-stop large" onclick="setMode('stop')" title="Stop">■</button>
      <div style="flex:1"></div>
      <button class="btn btn-rec" onclick="setMode('rec')" title="Record">● REC</button>
      <button class="btn btn-eject" onclick="handleEject()" title="Eject">⏏ EJECT</button>
    </div>

    <div class="divider"></div>

    <div class="bottom-panel">
      <span class="brand-logo">Vidéo</span>
      <div class="vent-slots">
        <div class="vent"></div><div class="vent"></div><div class="vent"></div>
        <div class="vent"></div><div class="vent"></div><div class="vent"></div>
        <div class="vent"></div><div class="vent"></div>
      </div>
      <span class="model-info">MADE IN JAPAN · HQ-7800</span>
    </div>

  </div>
</div>

<script>
let state = {
  mode: 'play',
  tapeLoaded: true,
  counter: { h: 0, m: 34, s: 12 },
  tapeProgress: 28,
  running: true
};

const modes = {
  play:  { label: 'PLAY',  indicators: ['ind-play'],  ledRec: false, ledTape: false, speed: 1 },
  rec:   { label: 'REC',   indicators: ['ind-play','ind-rec'], ledRec: true, ledTape: false, speed: 1 },
  pause: { label: 'PAUSE', indicators: ['ind-pause'], ledRec: false, ledTape: false, speed: 0 },
  stop:  { label: 'STOP',  indicators: [],            ledRec: false, ledTape: false, speed: 0 },
  rew:   { label: 'REW',   indicators: ['ind-rew'],   ledRec: false, ledTape: false, speed: -5 },
  ff:    { label: 'FF',    indicators: ['ind-ff'],    ledRec: false, ledTape: true,  speed: 5 },
};

function setMode(m) {
  if (!state.tapeLoaded && m !== 'stop') return;
  state.mode = m;
  const cfg = modes[m];

  document.getElementById('mode-label').textContent = cfg.label;

  ['ind-play','ind-rec','ind-pause','ind-rew','ind-ff'].forEach(id => {
    document.getElementById(id).classList.toggle('active', cfg.indicators.includes(id));
  });

  document.getElementById('led-rec').classList.toggle('on', cfg.ledRec);
  document.getElementById('led-tape').classList.toggle('on', cfg.ledTape);
}

function handleEject() {
  state.tapeLoaded = !state.tapeLoaded;
  document.getElementById('tape-slot').classList.toggle('loaded', state.tapeLoaded);
  if (!state.tapeLoaded) {
    setMode('stop');
    document.getElementById('led-tape').classList.remove('on');
    document.getElementById('led-power').classList.remove('on');
    setTimeout(() => document.getElementById('led-power').classList.add('on'), 600);
  }
}

function pad(n) { return String(Math.abs(n)).padStart(2,'0'); }

function updateCounter() {
  const cfg = modes[state.mode];
  if (cfg.speed === 0) return;
  state.counter.s += cfg.speed;
  while (state.counter.s >= 60) { state.counter.s -= 60; state.counter.m++; }
  while (state.counter.s < 0) { state.counter.s += 60; state.counter.m--; }
  while (state.counter.m >= 60) { state.counter.m -= 60; state.counter.h++; }
  while (state.counter.m < 0) { state.counter.m += 60; state.counter.h--; }
  state.counter.h = Math.max(0, Math.min(2, state.counter.h));

  const total = state.counter.h * 3600 + state.counter.m * 60 + state.counter.s;
  const maxSec = 2 * 3600;
  if (total <= 0) { state.counter = {h:0,m:0,s:0}; setMode('stop'); }
  if (total >= maxSec) { state.counter = {h:2,m:0,s:0}; setMode('stop'); }

  document.getElementById('counter').textContent = 
    `${pad(state.counter.h)}:${pad(state.counter.m)}:${pad(state.counter.s)}`;

  const pct = (total / maxSec) * 100;
  document.getElementById('tape-fill').style.width = pct.toFixed(1) + '%';
}

setInterval(updateCounter, 1000);
setMode('play');
</script>
