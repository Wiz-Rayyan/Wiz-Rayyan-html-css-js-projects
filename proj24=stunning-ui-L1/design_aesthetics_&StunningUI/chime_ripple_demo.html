
<style>
  .demo-wrap { padding: 1.5rem 0; font-family: var(--font-sans); }
  .demo-area {
    position: relative;
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    background: var(--color-background-secondary);
    overflow: hidden;
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 1.5rem;
    user-select: none;
  }
  .action-btn {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 18px 22px;
    border-radius: var(--border-radius-lg);
    border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-primary);
    cursor: pointer;
    z-index: 2;
    transition: transform 0.1s, box-shadow 0.1s;
    min-width: 100px;
  }
  .action-btn:active { transform: scale(0.96); }
  .action-btn .icon { font-size: 26px; }
  .action-btn .label { font-size: 12px; color: var(--color-text-secondary); font-weight: 500; }
  .action-btn.btn-success .icon { color: #1D9E75; }
  .action-btn.btn-info .icon { color: #378ADD; }
  .action-btn.btn-complete .icon { color: #7F77DD; }
  .ripple-canvas { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: var(--border-radius-lg); }
  .ripple {
    position: absolute;
    border-radius: 50%;
    transform: scale(0);
    pointer-events: none;
    border: 2.5px solid currentColor;
    box-sizing: border-box;
  }
  .log-area {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 80px;
  }
  .log-entry {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: var(--border-radius-md);
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-tertiary);
    font-size: 13px;
    color: var(--color-text-primary);
    animation: slideIn 0.25s ease;
    opacity: 0;
    animation-fill-mode: forwards;
  }
  .log-entry .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .log-entry .ts { font-size: 11px; color: var(--color-text-tertiary); margin-left: auto; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .hint { font-size: 12px; color: var(--color-text-tertiary); text-align: center; margin-top: 4px; }
</style>

<h2 class="sr-only">Chime ripple interaction demo — click buttons to trigger sound and visual ripple effects</h2>

<div class="demo-wrap">
  <div class="demo-area" id="demoArea">
    <div class="ripple-canvas" id="rippleCanvas"></div>
    <button class="action-btn btn-success" id="btnSuccess" aria-label="Payment success">
      <span class="icon" aria-hidden="true"><i class="ti ti-circle-check"></i></span>
      <span class="label">Payment</span>
    </button>
    <button class="action-btn btn-info" id="btnInfo" aria-label="Form submitted">
      <span class="icon" aria-hidden="true"><i class="ti ti-send"></i></span>
      <span class="label">Submit</span>
    </button>
    <button class="action-btn btn-complete" id="btnComplete" aria-label="Task complete">
      <span class="icon" aria-hidden="true"><i class="ti ti-flag-check"></i></span>
      <span class="label">Complete</span>
    </button>
  </div>
  <p class="hint">Tap any action to trigger a chime + ripple</p>
  <div class="log-area" id="logArea"></div>
</div>

<script>
const CONFIGS = {
  success:  { color: '#1D9E75', bg: 'rgba(29,158,117,0.15)', label: 'Payment success', freq: [880, 1108, 1320], dot: '#1D9E75' },
  info:     { color: '#378ADD', bg: 'rgba(55,138,221,0.15)', label: 'Form submitted',   freq: [660, 880, 1108],  dot: '#378ADD' },
  complete: { color: '#7F77DD', bg: 'rgba(127,119,221,0.15)', label: 'Task complete', freq: [523, 659, 784],   dot: '#7F77DD' },
};

let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playChime(freqs) {
  const ctx = getCtx();
  freqs.forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = freq;
    const t = ctx.currentTime + i * 0.12;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.22, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
    osc.start(t);
    osc.stop(t + 0.6);
  });
}

function haptic() {
  if (navigator.vibrate) navigator.vibrate([30]);
}

function spawnRipple(cx, cy, config, delay) {
  const canvas = document.getElementById('rippleCanvas');
  const size = 420;
  const el = document.createElement('div');
  el.className = 'ripple';
  el.style.cssText = `
    width: ${size}px; height: ${size}px;
    left: ${cx - size/2}px; top: ${cy - size/2}px;
    color: ${config.color};
    background: ${config.bg};
  `;
  canvas.appendChild(el);

  const start = performance.now() + delay;
  const duration = 520;

  function frame(now) {
    const elapsed = now - start;
    if (elapsed < 0) { requestAnimationFrame(frame); return; }
    const t = Math.min(elapsed / duration, 1);
    const ease = 1 - Math.pow(1 - t, 3);
    const scale = ease * 5;
    const opacity = (1 - t) * 0.75;
    el.style.transform = `scale(${scale})`;
    el.style.opacity = opacity;
    if (t < 1) requestAnimationFrame(frame);
    else el.remove();
  }
  requestAnimationFrame(frame);
}

function addLog(type, config) {
  const area = document.getElementById('logArea');
  const now = new Date();
  const ts = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const el = document.createElement('div');
  el.className = 'log-entry';
  el.innerHTML = `<span class="dot" style="background:${config.dot}"></span><span>${config.label}</span><span class="ts">${ts}</span>`;
  area.prepend(el);
  while (area.children.length > 4) area.removeChild(area.lastChild);
}

function trigger(type, btnEl) {
  const config = CONFIGS[type];
  const canvas = document.getElementById('rippleCanvas');
  const canvasRect = canvas.getBoundingClientRect();
  const btnRect = btnEl.getBoundingClientRect();
  const cx = btnRect.left + btnRect.width / 2 - canvasRect.left;
  const cy = btnRect.top + btnRect.height / 2 - canvasRect.top;

  playChime(config.freq);
  haptic();
  spawnRipple(cx, cy, config, 0);
  spawnRipple(cx, cy, config, 80);
  addLog(type, config);
}

document.getElementById('btnSuccess').addEventListener('click', e => trigger('success', e.currentTarget));
document.getElementById('btnInfo').addEventListener('click', e => trigger('info', e.currentTarget));
document.getElementById('btnComplete').addEventListener('click', e => trigger('complete', e.currentTarget));
</script>
