<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap');
  .dawn-wrap { font-family: 'Inter', var(--font-sans); font-weight: 300; color: #2C3E50; }
  .dawn-bg { background: linear-gradient(155deg, #A0C4E2 0%, #C8DFF0 40%, #E9F1F7 75%, #F5F0E8 100%); border-radius: 24px; padding: 2rem 1.5rem 1.5rem; min-height: 520px; position: relative; overflow: hidden; }
  .dawn-orb { position: absolute; top: -60px; right: -60px; width: 200px; height: 200px; background: radial-gradient(circle, rgba(255,237,200,0.55) 0%, transparent 70%); border-radius: 50%; pointer-events: none; }
  .dawn-orb2 { position: absolute; bottom: -40px; left: -40px; width: 160px; height: 160px; background: radial-gradient(circle, rgba(160,196,226,0.35) 0%, transparent 70%); border-radius: 50%; pointer-events: none; }
  .dawn-time { font-size: 13px; letter-spacing: 0.12em; color: #5A7A96; margin-bottom: 4px; }
  .dawn-greeting { font-size: 26px; font-weight: 300; color: #2C3E50; margin: 0 0 2px; letter-spacing: -0.01em; }
  .dawn-sub { font-size: 14px; color: #7A9BB5; font-weight: 300; margin-bottom: 1.75rem; }
  .dawn-card { background: rgba(255,255,255,0.52); border: 0.5px solid rgba(160,196,226,0.45); border-radius: 18px; padding: 1.1rem 1.25rem; margin-bottom: 12px; backdrop-filter: blur(4px); }
  .dawn-card-label { font-size: 11px; letter-spacing: 0.1em; color: #7A9BB5; text-transform: uppercase; margin-bottom: 6px; }
  .dawn-card-title { font-size: 17px; color: #2C3E50; font-weight: 300; }
  .dawn-card-meta { font-size: 13px; color: #7A9BB5; margin-top: 2px; }
  .dawn-progress-track { background: rgba(160,196,226,0.25); border-radius: 99px; height: 4px; margin-top: 10px; }
  .dawn-progress-fill { background: linear-gradient(90deg, #7AAEC8, #A8D0E6); border-radius: 99px; height: 4px; }
  .dawn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .dawn-stat { background: rgba(255,255,255,0.45); border: 0.5px solid rgba(160,196,226,0.4); border-radius: 14px; padding: 0.9rem 1rem; text-align: center; }
  .dawn-stat-num { font-size: 22px; color: #3A6080; font-weight: 300; }
  .dawn-stat-label { font-size: 11px; color: #8AABBC; letter-spacing: 0.06em; }
  .dawn-btn { width: 100%; padding: 13px; border-radius: 99px; border: 0.5px solid rgba(122,174,200,0.5); background: rgba(255,255,255,0.6); color: #2C3E50; font-family: 'Inter', var(--font-sans); font-weight: 300; font-size: 15px; letter-spacing: 0.02em; cursor: pointer; transition: background 0.2s; box-shadow: 0 2px 12px rgba(160,196,226,0.2); }
  .dawn-btn:hover { background: rgba(255,255,255,0.8); }
  .dawn-nav { display: flex; justify-content: center; gap: 18px; margin-top: 1.25rem; }
  .dawn-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(122,174,200,0.35); }
  .dawn-dot.active { background: rgba(58,96,128,0.55); }
  .dawn-horizon { position: absolute; bottom: 0; left: 0; right: 0; height: 90px; background: linear-gradient(0deg, rgba(250,230,190,0.18) 0%, transparent 100%); pointer-events: none; border-radius: 0 0 24px 24px; }
</style>
<div class="dawn-wrap">
  <div class="dawn-bg">
    <div class="dawn-orb"></div>
    <div class="dawn-orb2"></div>
    <div class="dawn-horizon"></div>
    <p class="dawn-time">Saturday · 5:34 AM</p>
    <h1 class="dawn-greeting">Good morning, Maya</h1>
    <p class="dawn-sub">Sunrise in 23 minutes · 18°C</p>
    <div class="dawn-card">
      <div class="dawn-card-label">Morning ritual</div>
      <div class="dawn-card-title">10-min breathwork</div>
      <div class="dawn-card-meta">Box breathing · 4 rounds</div>
      <div class="dawn-progress-track"><div class="dawn-progress-fill" style="width: 0%"></div></div>
    </div>
    <div class="dawn-grid">
      <div class="dawn-stat">
        <div class="dawn-stat-num">7.2</div>
        <div class="dawn-stat-label">hrs sleep</div>
      </div>
      <div class="dawn-stat">
        <div class="dawn-stat-num">6</div>
        <div class="dawn-stat-label">day streak</div>
      </div>
    </div>
    <button class="dawn-btn">Begin session →</button>
    <div class="dawn-nav">
      <div class="dawn-dot active"></div>
      <div class="dawn-dot"></div>
      <div class="dawn-dot"></div>
    </div>
  </div>
</div>
