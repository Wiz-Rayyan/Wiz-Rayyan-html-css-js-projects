
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.app{display:flex;flex-direction:column;min-height:600px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);position:sticky;top:0;z-index:10}
.topbar-left{display:flex;align-items:center;gap:8px}
.store-name{font-size:15px;font-weight:500;color:var(--color-text-primary)}
.topbar-right{display:flex;align-items:center;gap:12px}
.wishlist-pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);cursor:pointer;font-size:13px;color:var(--color-text-secondary);transition:all 0.2s}
.wishlist-pill:hover{border-color:var(--color-border-primary)}
.wishlist-pill .heart-icon{font-size:14px;transition:color 0.3s}
.wishlist-pill .wl-count{font-weight:500;min-width:8px;display:inline-block;transition:transform 0.2s,color 0.3s}
.wishlist-pill.has-items .heart-icon{color:#e94560}
.wishlist-pill.has-items .wl-count{color:#e94560}
.tab-row{display:flex;gap:0;padding:0 20px;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary)}
.tab{padding:10px 16px;font-size:13px;cursor:pointer;color:var(--color-text-secondary);border-bottom:2px solid transparent;transition:all 0.15s}
.tab:hover{color:var(--color-text-primary)}
.tab.active{color:#e94560;border-bottom-color:#e94560;font-weight:500}
.view{padding:20px}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.product-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:visible;position:relative;transition:border-color 0.2s}
.product-card:hover{border-color:var(--color-border-secondary)}
.product-img{height:130px;display:flex;align-items:center;justify-content:center;font-size:44px;background:var(--color-background-secondary);border-radius:var(--border-radius-lg) var(--border-radius-lg) 0 0}
.product-body{padding:12px}
.product-name{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:3px;line-height:1.3}
.product-cat{font-size:11px;color:var(--color-text-tertiary);margin-bottom:8px}
.product-footer{display:flex;align-items:center;justify-content:space-between}
.product-price{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.heart-btn{width:34px;height:34px;border-radius:50%;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;transition:border-color 0.2s;outline:none}
.heart-btn:hover{border-color:var(--color-border-primary)}
.heart-btn svg{display:block;transition:transform 0.1s}
.wishlist-panel{padding:20px}
.wl-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.wl-title{font-size:16px;font-weight:500;color:var(--color-text-primary)}
.wl-subtitle{font-size:13px;color:var(--color-text-secondary)}
.clear-btn{font-size:12px;color:var(--color-text-secondary);cursor:pointer;padding:4px 10px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:none;transition:all 0.15s}
.clear-btn:hover{border-color:var(--color-border-secondary);color:var(--color-text-primary)}
.wl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.wl-item{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px;display:flex;align-items:center;gap:10px;position:relative;animation:slideIn 0.3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.wl-item-emoji{font-size:24px;flex-shrink:0}
.wl-item-info{flex:1;min-width:0}
.wl-item-name{font-size:12px;font-weight:500;color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl-item-price{font-size:12px;color:var(--color-text-secondary)}
.wl-remove{width:22px;height:22px;border-radius:50%;border:0.5px solid var(--color-border-tertiary);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--color-text-tertiary);transition:all 0.15s;flex-shrink:0}
.wl-remove:hover{border-color:#e94560;color:#e94560;background:var(--color-background-danger)}
.empty-state{display:flex;flex-direction:column;align-items:center;gap:10px;padding:48px 20px;color:var(--color-text-tertiary)}
.empty-icon{font-size:36px;opacity:0.4}
.empty-text{font-size:14px}
.wl-total-row{margin-top:16px;padding-top:14px;border-top:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:space-between}
.wl-total-label{font-size:13px;color:var(--color-text-secondary)}
.wl-total-val{font-size:16px;font-weight:500;color:var(--color-text-primary)}
.checkout-btn{width:100%;padding:10px;margin-top:12px;border-radius:var(--border-radius-md);border:none;background:#e94560;color:#fff;font-size:14px;font-weight:500;cursor:pointer;transition:opacity 0.15s}
.checkout-btn:hover{opacity:0.88}
.toast{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:8px 16px;font-size:13px;color:var(--color-text-primary);white-space:nowrap;opacity:0;pointer-events:none;z-index:20;transition:opacity 0.2s}
.toast.show{opacity:1}
.particle-host{position:absolute;top:50%;left:50%;pointer-events:none;z-index:100}
</style>

<h2 class="sr-only">Wishlist shop — browse products, click the heart to add or remove from your wishlist, then view your saved items in the Wishlist tab.</h2>

<div class="app" id="app">
  <div class="topbar">
    <div class="topbar-left">
      <i class="ti ti-shopping-bag" style="font-size:18px;color:#e94560" aria-hidden="true"></i>
      <span class="store-name">Curated finds</span>
    </div>
    <div class="topbar-right">
      <div class="wishlist-pill" id="wishlistPill" onclick="switchTab('wishlist')">
        <span class="heart-icon">♥</span>
        <span class="wl-count" id="pillCount">0</span>
        <span style="font-size:13px">saved</span>
      </div>
    </div>
  </div>

  <div class="tab-row">
    <div class="tab active" id="tab-shop" onclick="switchTab('shop')">Shop</div>
    <div class="tab" id="tab-wishlist" onclick="switchTab('wishlist')">Wishlist <span id="tabBadge" style="display:none;background:#e94560;color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;margin-left:4px" id="tabBadge"></span></div>
  </div>

  <div id="view-shop" class="view">
    <div class="products-grid" id="productsGrid"></div>
  </div>

  <div id="view-wishlist" class="view" style="display:none">
    <div class="wl-header">
      <div>
        <p class="wl-title">Your wishlist</p>
        <p class="wl-subtitle" id="wlSubtitle">No items saved yet</p>
      </div>
      <button class="clear-btn" onclick="clearAll()">Clear all</button>
    </div>
    <div id="wlGrid"></div>
    <div id="wlTotal" style="display:none">
      <div class="wl-total-row">
        <span class="wl-total-label">Total</span>
        <span class="wl-total-val" id="totalVal">₹0</span>
      </div>
      <button class="checkout-btn" onclick="handleCheckout()">Go to checkout ↗</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const PRODUCTS = [
  {id:1,name:'Wool blend scarf',cat:'Accessories',price:1499,emoji:'🧣'},
  {id:2,name:'Jasmine soy candle',cat:'Home',price:849,emoji:'🕯️'},
  {id:3,name:'Linen notebook set',cat:'Stationery',price:649,emoji:'📓'},
  {id:4,name:'Rattan tray',cat:'Home',price:1199,emoji:'🛒'},
  {id:5,name:'Ceramic mug',cat:'Kitchen',price:599,emoji:'☕'},
  {id:6,name:'Pressed flower print',cat:'Art',price:1899,emoji:'🌸'},
  {id:7,name:'Bamboo toothbrush set',cat:'Wellness',price:349,emoji:'🪥'},
  {id:8,name:'Lavender pillow mist',cat:'Wellness',price:799,emoji:'💜'},
  {id:9,name:'Cork board A3',cat:'Stationery',price:499,emoji:'📌'},
  {id:10,name:'Hand-thrown vase',cat:'Home',price:2299,emoji:'🏺'},
  {id:11,name:'Beeswax wrap set',cat:'Kitchen',price:449,emoji:'🍱'},
  {id:12,name:'Terracotta pot',cat:'Garden',price:699,emoji:'🪴'},
];

const wishlist = new Set();
let currentTab = 'shop';

function fmt(n){return '₹'+n.toLocaleString('en-IN');}

function heartSVG(filled,size=18){
  const fill=filled?'#e94560':'none';
  const stroke=filled?'#e94560':'var(--color-text-secondary)';
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fill}" stroke="${stroke}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
}

function buildGrid(){
  const grid=document.getElementById('productsGrid');
  grid.innerHTML=PRODUCTS.map(p=>`
    <div class="product-card" id="pc-${p.id}">
      <div class="product-img">${p.emoji}</div>
      <div class="product-body">
        <p class="product-name">${p.name}</p>
        <p class="product-cat">${p.cat}</p>
        <div class="product-footer">
          <span class="product-price">${fmt(p.price)}</span>
          <button class="heart-btn" id="hb-${p.id}" onclick="toggleHeart(${p.id},event)" aria-label="Add to wishlist">
            ${heartSVG(false)}
          </button>
        </div>
      </div>
    </div>
  `).join('');
}

function spawnParticles(btn, adding){
  const rect=btn.getBoundingClientRect();
  for(let i=0;i<12;i++){
    const angle=(i/12)*360+Math.random()*15;
    const dist=55+Math.random()*35;
    const delay=Math.random()*55;
    const sz=5+Math.random()*5;
    const p=document.createElement('div');
    p.style.cssText=`position:fixed;pointer-events:none;width:${sz}px;height:${sz}px;top:${rect.top+rect.height/2}px;left:${rect.left+rect.width/2}px;z-index:9999;opacity:0;`;
    const rad=angle*Math.PI/180;
    const tx=Math.cos(rad)*dist, ty=Math.sin(rad)*dist;
    p.innerHTML=`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="#e94560" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
    document.body.appendChild(p);
    const kf=adding
      ?[{transform:'translate(-50%,-50%) scale(0.2)',opacity:0},{transform:`translate(calc(-50% + ${tx*.3}px),calc(-50% + ${ty*.3}px)) scale(1.1)`,opacity:1,offset:.3},{transform:`translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px)) scale(0.5)`,opacity:0}]
      :[{transform:`translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px)) scale(0.6)`,opacity:.9},{transform:'translate(-50%,-50%) scale(0)',opacity:0}];
    const a=p.animate(kf,{duration:adding?580:420,delay,easing:adding?'cubic-bezier(0.25,0.46,0.45,0.94)':'cubic-bezier(0.55,0,1,0.45)',fill:'forwards'});
    a.onfinish=()=>p.remove();
  }
}

function bounceHeart(svg){
  svg.animate([{transform:'scale(1)'},{transform:'scale(1.6)'},{transform:'scale(0.85)'},{transform:'scale(1.1)'},{transform:'scale(1)'}],{duration:380,easing:'ease-out'});
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid=setTimeout(()=>t.classList.remove('show'),2000);
}

function updateUI(){
  const n=wishlist.size;
  const pill=document.getElementById('wishlistPill');
  const pc=document.getElementById('pillCount');
  pc.textContent=n;
  pc.classList.remove('pop');
  void pc.offsetWidth;
  pc.classList.add('pop-anim');
  setTimeout(()=>pc.classList.remove('pop-anim'),350);
  pill.className='wishlist-pill'+(n>0?' has-items':'');

  const badge=document.getElementById('tabBadge');
  if(n>0){badge.style.display='inline';badge.textContent=n;}
  else{badge.style.display='none';}

  const sub=document.getElementById('wlSubtitle');
  sub.textContent=n===0?'No items saved yet':n===1?'1 item saved':`${n} items saved`;

  const wlGrid=document.getElementById('wlGrid');
  const total=document.getElementById('wlTotal');
  if(n===0){
    wlGrid.innerHTML=`<div class="empty-state"><div class="empty-icon">♡</div><p class="empty-text">Heart items in the shop to save them here</p></div>`;
    total.style.display='none';
  } else {
    const items=[...wishlist].map(id=>PRODUCTS.find(p=>p.id===id));
    wlGrid.innerHTML=`<div class="wl-grid">${items.map(p=>`
      <div class="wl-item" id="wli-${p.id}">
        <div class="wl-item-emoji">${p.emoji}</div>
        <div class="wl-item-info">
          <p class="wl-item-name">${p.name}</p>
          <p class="wl-item-price">${fmt(p.price)}</p>
        </div>
        <button class="wl-remove" onclick="removeFromWishlist(${p.id})" aria-label="Remove">×</button>
      </div>
    `).join('')}</div>`;
    total.style.display='block';
    const sum=items.reduce((a,p)=>a+p.price,0);
    document.getElementById('totalVal').textContent=fmt(sum);
  }
}

function toggleHeart(id,e){
  const btn=document.getElementById('hb-'+id);
  const svg=btn.querySelector('svg');
  const adding=!wishlist.has(id);
  adding?wishlist.add(id):wishlist.delete(id);

  btn.innerHTML=heartSVG(adding);
  bounceHeart(btn.querySelector('svg'));
  spawnParticles(btn, adding);
  if(navigator&&navigator.vibrate)navigator.vibrate(adding?[10,5,20]:[18]);
  showToast(adding?'Added to wishlist ♥':'Removed from wishlist');
  updateUI();
}

function removeFromWishlist(id){
  wishlist.delete(id);
  const hb=document.getElementById('hb-'+id);
  if(hb){hb.innerHTML=heartSVG(false);}
  updateUI();
}

function clearAll(){
  if(wishlist.size===0)return;
  [...wishlist].forEach(id=>{
    wishlist.delete(id);
    const hb=document.getElementById('hb-'+id);
    if(hb)hb.innerHTML=heartSVG(false);
  });
  updateUI();
  showToast('Wishlist cleared');
}

function switchTab(tab){
  currentTab=tab;
  document.getElementById('view-shop').style.display=tab==='shop'?'block':'none';
  document.getElementById('view-wishlist').style.display=tab==='wishlist'?'block':'none';
  document.getElementById('tab-shop').className='tab'+(tab==='shop'?' active':'');
  document.getElementById('tab-wishlist').className='tab'+(tab==='wishlist'?' active':'');
  if(tab==='wishlist')updateUI();
}

function handleCheckout(){
  const n=wishlist.size;
  sendPrompt(`I have ${n} item${n!==1?'s':''} in my wishlist worth ${fmt([...wishlist].reduce((a,id)=>a+PRODUCTS.find(p=>p.id===id).price,0))}. Help me decide what to actually buy.`);
}

const style=document.createElement('style');
style.textContent=`@keyframes pop-anim{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}.pop-anim{animation:pop-anim 0.35s ease}`;
document.head.appendChild(style);

buildGrid();
updateUI();
</script>
