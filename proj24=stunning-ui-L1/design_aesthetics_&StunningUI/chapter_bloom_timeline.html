
<style>
  .bloom-wrap { padding: 2rem 1.5rem; font-family: var(--font-sans); }
  .player-bar { display: flex; align-items: center; gap: 14px; margin-bottom: 2.5rem; }
  .play-btn { width: 40px; height: 40px; border-radius: 50%; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--color-text-primary); font-size: 16px; transition: background 0.15s; flex-shrink: 0; }
  .play-btn:hover { background: var(--color-background-secondary); }
  .time-label { font-size: 13px; color: var(--color-text-secondary); min-width: 36px; font-variant-numeric: tabular-nums; }
  .timeline-outer { flex: 1; position: relative; height: 60px; display: flex; align-items: center; cursor: pointer; }
  .track { position: absolute; left: 0; right: 0; height: 3px; background: var(--color-border-tertiary); border-radius: 2px; }
  .progress { position: absolute; left: 0; height: 3px; background: #7F77DD; border-radius: 2px; width: 0%; transition: width 0.1s linear; }
  .chapter-title-bar { min-height: 28px; margin-bottom: 1.5rem; text-align: center; }
  .chapter-title-text { font-size: 15px; font-weight: 500; color: var(--color-text-primary); opacity: 0; transform: translateY(10px); transition: opacity 0.4s, transform 0.4s; display: inline-block; }
  .chapter-title-text.visible { opacity: 1; transform: translateY(0); }
  .chapters-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 1.5rem; }
  .ch-pill { font-size: 12px; color: var(--color-text-secondary); background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: 20px; padding: 4px 12px; cursor: pointer; transition: background 0.15s, color 0.15s; }
  .ch-pill:hover, .ch-pill.active { background: #EEEDFE; color: #3C3489; border-color: #AFA9EC; }
  .tooltip { position: fixed; background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 6px 10px; font-size: 12px; color: var(--color-text-primary); pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 100; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
</style>
<div class="bloom-wrap">
  <h2 class="sr-only">Chapter Bloom — interactive podcast/audiobook chapter timeline with flower animations</h2>

  <div class="player-bar">
    <button class="play-btn" id="playBtn" aria-label="Play"><i class="ti ti-player-play" aria-hidden="true"></i></button>
    <span class="time-label" id="timeEl">0:00</span>
    <div class="timeline-outer" id="timelineOuter">
      <div class="track"></div>
      <div class="progress" id="progress"></div>
      <!-- markers injected by JS -->
    </div>
    <span class="time-label" id="durEl">0:00</span>
  </div>

  <div class="chapter-title-bar"><span class="chapter-title-text" id="chapterTitle">—</span></div>
  <div class="chapters-list" id="chaptersList"></div>
</div>
<div class="tooltip" id="tooltip"></div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="flower" viewBox="-12 -12 24 24">
      <g class="petals">
        <ellipse cx="0" cy="-6" rx="2.5" ry="5" fill="currentColor" opacity="0.85"/>
        <ellipse cx="0" cy="-6" rx="2.5" ry="5" fill="currentColor" opacity="0.85" transform="rotate(60)"/>
        <ellipse cx="0" cy="-6" rx="2.5" ry="5" fill="currentColor" opacity="0.85" transform="rotate(120)"/>
        <ellipse cx="0" cy="-6" rx="2.5" ry="5" fill="currentColor" opacity="0.85" transform="rotate(180)"/>
        <ellipse cx="0" cy="-6" rx="2.5" ry="5" fill="currentColor" opacity="0.85" transform="rotate(240)"/>
        <ellipse cx="0" cy="-6" rx="2.5" ry="5" fill="currentColor" opacity="0.85" transform="rotate(300)"/>
      </g>
      <circle cx="0" cy="0" r="4" fill="currentColor"/>
    </symbol>
  </defs>
</svg>

<script>
const chapters = [
  { title: "Introduction",        time: 0,    color: "#7F77DD", text: "#3C3489", bg: "#EEEDFE" },
  { title: "The early years",     time: 18,   color: "#1D9E75", text: "#085041", bg: "#E1F5EE" },
  { title: "Rising tension",      time: 40,   color: "#D85A30", text: "#4A1B0C", bg: "#FAECE7" },
  { title: "The turning point",   time: 62,   color: "#D4537E", text: "#4B1528", bg: "#FBEAF0" },
  { title: "Aftermath",           time: 80,   color: "#BA7517", text: "#412402", bg: "#FAEEDA" },
  { title: "Epilogue",            time: 95,   color: "#378ADD", text: "#042C53", bg: "#E6F1FB" },
];
const DURATION = 110;
let current = -1, playing = false, raf = null, startReal = null, startSim = 0, simTime = 0;
let hoveredMarker = null;

const playBtn   = document.getElementById('playBtn');
const timeEl    = document.getElementById('timeEl');
const durEl     = document.getElementById('durEl');
const prog      = document.getElementById('progress');
const outer     = document.getElementById('timelineOuter');
const titleEl   = document.getElementById('chapterTitle');
const tooltip   = document.getElementById('tooltip');
const list      = document.getElementById('chaptersList');

durEl.textContent = fmt(DURATION);

function fmt(s) {
  return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
}

// Build pills
chapters.forEach((ch, i) => {
  const p = document.createElement('button');
  p.className = 'ch-pill';
  p.textContent = ch.title;
  p.onclick = () => jumpTo(i);
  list.appendChild(p);
});

// Build SVG markers on timeline
const markerEls = [];
chapters.forEach((ch, i) => {
  const pct = ch.time / DURATION * 100;
  const wrap = document.createElement('div');
  wrap.style.cssText = `position:absolute;left:${pct}%;top:50%;transform:translate(-50%,-50%);z-index:10;cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center;`;
  wrap.dataset.idx = i;

  const svgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svgEl.setAttribute('width','28'); svgEl.setAttribute('height','28');
  svgEl.setAttribute('viewBox','-14 -14 28 28');
  svgEl.style.overflow = 'visible';
  svgEl.style.transition = 'transform 0.3s cubic-bezier(.34,1.56,.64,1)';

  // dot (default state)
  const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
  dot.setAttribute('r','5'); dot.setAttribute('fill', ch.color); dot.setAttribute('cx','0'); dot.setAttribute('cy','0');
  dot.style.transition = 'opacity 0.3s, r 0.3s';
  svgEl.appendChild(dot);

  // flower (bloomed state)
  const use = document.createElementNS('http://www.w3.org/2000/svg','use');
  use.setAttribute('href','#flower');
  use.setAttribute('color', ch.color);
  use.style.opacity = '0';
  use.style.transition = 'opacity 0.4s';
  svgEl.appendChild(use);

  wrap.appendChild(svgEl);

  wrap.addEventListener('mouseenter', e => showTooltip(e, i));
  wrap.addEventListener('mousemove', e => moveTooltip(e));
  wrap.addEventListener('mouseleave', hideTooltip);
  wrap.addEventListener('click', e => { e.stopPropagation(); jumpTo(i); });
  outer.appendChild(wrap);
  markerEls.push({ wrap, svgEl, dot, use, bloomed: false });
});

function showTooltip(e, i) {
  hoveredMarker = i;
  const ch = chapters[i];
  const next = chapters[i+1];
  const dur = next ? (next.time - ch.time) : (DURATION - ch.time);
  tooltip.innerHTML = `<strong style="color:var(--color-text-primary)">${ch.title}</strong><br><span style="color:var(--color-text-secondary)">${fmt(ch.time)} · ${fmt(dur)} long</span>`;
  tooltip.style.opacity = '1';
  moveTooltip(e);
}
function moveTooltip(e) {
  tooltip.style.left = (e.clientX + 12) + 'px';
  tooltip.style.top  = (e.clientY - 40) + 'px';
}
function hideTooltip() { hoveredMarker = null; tooltip.style.opacity = '0'; }

function bloomMarker(i) {
  const m = markerEls[i];
  if (m.bloomed) return;
  m.bloomed = true;
  m.dot.style.opacity = '0';
  m.use.style.opacity = '1';
  m.svgEl.style.transform = 'scale(1.5)';
  setTimeout(() => { m.svgEl.style.transform = 'scale(1)'; }, 400);
}

function unbloomMarker(i) {
  const m = markerEls[i];
  m.bloomed = false;
  m.dot.style.opacity = '1';
  m.use.style.opacity = '0';
  m.svgEl.style.transform = 'scale(1)';
}

function pulseMarker(i) {
  const m = markerEls[i];
  m.svgEl.style.transition = 'transform 0.15s';
  m.svgEl.style.transform = 'scale(1.8)';
  setTimeout(() => { m.svgEl.style.transform = 'scale(1.2)'; setTimeout(() => { m.svgEl.style.transform = 'scale(1)'; m.svgEl.style.transition = 'transform 0.3s cubic-bezier(.34,1.56,.64,1)'; }, 150); }, 150);
}

function updateChapterTitle(i) {
  if (i === current) return;
  current = i;
  titleEl.classList.remove('visible');
  setTimeout(() => {
    titleEl.textContent = i >= 0 ? chapters[i].title : '—';
    titleEl.style.color = i >= 0 ? chapters[i].text : 'var(--color-text-primary)';
    titleEl.classList.add('visible');
  }, 100);
  document.querySelectorAll('.ch-pill').forEach((p,j) => p.classList.toggle('active', j===i));
}

function applyTime(t) {
  simTime = Math.min(t, DURATION);
  prog.style.width = (simTime/DURATION*100)+'%';
  timeEl.textContent = fmt(simTime);
  // which chapter?
  let ci = -1;
  for (let i = chapters.length-1; i >= 0; i--) { if (simTime >= chapters[i].time) { ci = i; break; } }
  // bloom all reached, unbloom future
  chapters.forEach((_,i) => {
    if (i <= ci) { if (!markerEls[i].bloomed) bloomMarker(i); }
    else { if (markerEls[i].bloomed) unbloomMarker(i); }
  });
  updateChapterTitle(ci);
  if (simTime >= DURATION) { stopPlay(); }
}

function tick(now) {
  const elapsed = (now - startReal) / 1000 * 6; // 6x speed for demo
  applyTime(startSim + elapsed);
  if (playing) raf = requestAnimationFrame(tick);
}

function startPlay() {
  playing = true;
  startReal = performance.now();
  startSim = simTime;
  playBtn.innerHTML = '<i class="ti ti-player-pause" aria-hidden="true"></i>';
  raf = requestAnimationFrame(tick);
}
function stopPlay() {
  playing = false;
  cancelAnimationFrame(raf);
  playBtn.innerHTML = '<i class="ti ti-player-play" aria-hidden="true"></i>';
}

playBtn.addEventListener('click', () => {
  if (simTime >= DURATION) { applyTime(0); }
  playing ? stopPlay() : startPlay();
});

outer.addEventListener('click', e => {
  const rect = outer.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  stopPlay();
  applyTime(pct * DURATION);
});

function jumpTo(i) {
  stopPlay();
  applyTime(chapters[i].time);
  pulseMarker(i);
}

applyTime(0);
</script>
