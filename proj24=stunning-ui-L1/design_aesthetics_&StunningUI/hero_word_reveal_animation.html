
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4rem 2rem;
    background: #0a0a0b;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(83,74,183,0.15) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-eyebrow {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    margin-bottom: 2rem;
    opacity: 0;
    animation: fadeUp 0.6s cubic-bezier(0.4,0,0.2,1) 0.1s forwards;
  }

  .hero-headline {
    font-family: var(--font-sans, system-ui, sans-serif);
    font-size: clamp(2.4rem, 6vw, 5rem);
    font-weight: 500;
    line-height: 1.08;
    letter-spacing: -0.03em;
    color: #fff;
    text-align: center;
    max-width: 860px;
    margin-bottom: 1.5rem;
  }

  .hero-headline .word {
    display: inline-block;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.5s cubic-bezier(0.4,0,0.2,1),
                transform 0.5s cubic-bezier(0.4,0,0.2,1);
    margin-right: 0.28em;
  }

  .hero-headline .word:last-child { margin-right: 0; }

  .hero-headline .accent {
    color: transparent;
    -webkit-text-stroke: 1px rgba(255,255,255,0.55);
  }

  .hero-sub {
    font-size: clamp(0.95rem, 2vw, 1.1rem);
    color: rgba(255,255,255,0.42);
    text-align: center;
    max-width: 480px;
    line-height: 1.65;
    opacity: 0;
    animation: fadeUp 0.6s cubic-bezier(0.4,0,0.2,1) forwards;
  }

  .hero-cta {
    margin-top: 2.5rem;
    display: flex;
    gap: 12px;
    opacity: 0;
    animation: fadeUp 0.6s cubic-bezier(0.4,0,0.2,1) forwards;
  }

  .btn {
    padding: 0.7rem 1.6rem;
    border-radius: 999px;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: transform 0.18s cubic-bezier(0.4,0,0.2,1), opacity 0.18s;
    letter-spacing: 0.01em;
  }

  .btn:hover { transform: translateY(-2px); opacity: 0.9; }
  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: #fff;
    color: #0a0a0b;
  }

  .btn-ghost {
    background: transparent;
    color: rgba(255,255,255,0.6);
    border: 0.5px solid rgba(255,255,255,0.18);
  }

  .scroll-hint {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    opacity: 0;
    animation: fadeUp 0.6s cubic-bezier(0.4,0,0.2,1) forwards;
  }

  .scroll-hint span {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
  }

  .scroll-line {
    width: 1px;
    height: 32px;
    background: rgba(255,255,255,0.15);
    position: relative;
    overflow: hidden;
  }

  .scroll-line::after {
    content: '';
    position: absolute;
    top: -100%;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255,255,255,0.5);
    animation: scrollDrop 1.6s cubic-bezier(0.4,0,0.2,1) infinite;
  }

  .noise-grid {
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 39px,
      rgba(255,255,255,0.02) 39px,
      rgba(255,255,255,0.02) 40px
    ),
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 39px,
      rgba(255,255,255,0.02) 39px,
      rgba(255,255,255,0.02) 40px
    );
    pointer-events: none;
  }

  .controls {
    position: absolute;
    top: 1.2rem;
    right: 1.4rem;
    display: flex;
    gap: 8px;
  }

  .ctrl-btn {
    background: rgba(255,255,255,0.07);
    border: 0.5px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.5);
    font-size: 11px;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    font-family: inherit;
  }

  .ctrl-btn:hover {
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.85);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes scrollDrop {
    0%   { top: -100%; }
    100% { top: 100%; }
  }
</style>

<div class="hero" id="hero">
  <div class="noise-grid"></div>

  <div class="controls">
    <button class="ctrl-btn" id="replayBtn">↺ Replay</button>
  </div>

  <p class="hero-eyebrow" id="eyebrow">Design × Technology</p>

  <h1 class="hero-headline" id="headline">
    We craft digital experiences that make the world feel <span class="accent">different</span>
  </h1>

  <p class="hero-sub" id="subtext">
    Award-winning creative studio building products, brands, and interactive moments for the next generation of companies.
  </p>

  <div class="hero-cta" id="cta">
    <button class="btn btn-primary">Start a project</button>
    <button class="btn btn-ghost">View work ↗</button>
  </div>

  <div class="scroll-hint" id="scrollHint">
    <span>Scroll</span>
    <div class="scroll-line"></div>
  </div>
</div>

<script>
  const STAGGER = 0.08;
  const BASE_DELAY = 0.35;

  function splitAndAnimate() {
    const headline = document.getElementById('headline');
    const accentEl = headline.querySelector('.accent');
    const accentText = accentEl ? accentEl.textContent : '';

    const rawText = headline.textContent.trim();
    const words = rawText.split(/\s+/).filter(w => w.length > 0);

    headline.innerHTML = '';

    words.forEach((word, i) => {
      const span = document.createElement('span');
      span.className = 'word';
      if (word === accentText.trim()) span.classList.add('accent');
      span.textContent = word;
      span.style.transitionDelay = `${(BASE_DELAY + i * STAGGER).toFixed(2)}s`;
      headline.appendChild(span);
    });

    const totalHeadlineTime = BASE_DELAY + words.length * STAGGER + 0.5;

    document.getElementById('subtext').style.animationDelay = `${totalHeadlineTime}s`;
    document.getElementById('cta').style.animationDelay = `${totalHeadlineTime + 0.15}s`;
    document.getElementById('scrollHint').style.animationDelay = `${totalHeadlineTime + 0.3}s`;

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        document.querySelectorAll('.word').forEach(w => {
          w.style.opacity = '1';
          w.style.transform = 'translateY(0)';
        });
      });
    });
  }

  function resetAndReplay() {
    const headline = document.getElementById('headline');
    const subtext = document.getElementById('subtext');
    const cta = document.getElementById('cta');
    const scrollHint = document.getElementById('scrollHint');
    const eyebrow = document.getElementById('eyebrow');

    document.querySelectorAll('.word').forEach(w => {
      w.style.transition = 'none';
      w.style.opacity = '0';
      w.style.transform = 'translateY(24px)';
    });

    [subtext, cta, scrollHint, eyebrow].forEach(el => {
      el.style.animation = 'none';
      el.style.opacity = '0';
      el.style.transform = 'translateY(14px)';
    });

    setTimeout(() => {
      [eyebrow].forEach(el => {
        el.style.animation = '';
        el.style.animationDelay = '0.1s';
      });
      document.querySelectorAll('.word').forEach(w => {
        w.style.transition = '';
      });
      const words = document.querySelectorAll('.word');
      const totalHeadlineTime = BASE_DELAY + words.length * STAGGER + 0.5;
      words.forEach((w, i) => {
        w.style.transitionDelay = `${(BASE_DELAY + i * STAGGER).toFixed(2)}s`;
      });
      subtext.style.animation = `fadeUp 0.6s cubic-bezier(0.4,0,0.2,1) ${totalHeadlineTime}s forwards`;
      cta.style.animation = `fadeUp 0.6s cubic-bezier(0.4,0,0.2,1) ${totalHeadlineTime + 0.15}s forwards`;
      scrollHint.style.animation = `fadeUp 0.6s cubic-bezier(0.4,0,0.2,1) ${totalHeadlineTime + 0.3}s forwards`;

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          document.querySelectorAll('.word').forEach(w => {
            w.style.opacity = '1';
            w.style.transform = 'translateY(0)';
          });
        });
      });
    }, 80);
  }

  splitAndAnimate();

  document.getElementById('replayBtn').addEventListener('click', resetAndReplay);
</script>
