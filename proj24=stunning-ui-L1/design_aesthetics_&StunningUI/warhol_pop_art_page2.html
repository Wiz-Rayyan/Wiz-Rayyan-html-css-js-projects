
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  .pw{font-family:'Anton',Impact,'Arial Black',sans-serif;background:#ff0090;filter:contrast(1.12);}
  .pw-hdr{background:#fff200;color:#000;text-align:center;padding:16px 12px 12px;font-size:32px;letter-spacing:5px;border-bottom:6px solid #000;border-top:6px solid #000;text-transform:uppercase;}
  .pw-hdr span{color:#ff0090;}
  .can-row{display:grid;grid-template-columns:repeat(3,1fr);border-left:5px solid #000;border-right:5px solid #000;}
  .can{border:4px solid #000;aspect-ratio:.75;position:relative;overflow:hidden;cursor:pointer;transition:transform .1s;}
  .can:hover{transform:scale(1.03);z-index:2;}
  .can svg{width:100%;height:100%;display:block;}
  .stripe-band{display:grid;grid-template-columns:repeat(8,1fr);border-top:5px solid #000;border-left:5px solid #000;border-right:5px solid #000;}
  .stripe{height:28px;border-right:3px solid #000;}
  .stripe:last-child{border-right:none;}
  .mid-section{display:flex;border-left:5px solid #000;border-right:5px solid #000;border-top:5px solid #000;}
  .comic-panel{flex:1.2;border-right:5px solid #000;background:#fff;padding:0;overflow:hidden;position:relative;}
  .comic-panel svg{width:100%;display:block;}
  .info-col{flex:1;background:#00b7ff;display:flex;flex-direction:column;gap:0;}
  .info-box{padding:16px 14px;border-bottom:4px solid #000;font-family:'Anton',Impact,sans-serif;}
  .info-box:last-child{border-bottom:none;flex:1;}
  .info-box .num{font-size:42px;color:#fff200;display:block;line-height:1;}
  .info-box .lbl{font-size:11px;letter-spacing:3px;color:#000;text-transform:uppercase;}
  .repeat-strip{display:grid;grid-template-columns:repeat(6,1fr);border:5px solid #000;border-top:none;}
  .rep{border-right:3px solid #000;aspect-ratio:1;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .rep:last-child{border-right:none;}
  .rep svg{width:100%;height:100%;display:block;}
  .quote-bar{background:#fff200;border:5px solid #000;border-top:none;padding:14px 20px;display:flex;align-items:center;gap:16px;}
  .quote-bar .q-mark{font-size:72px;color:#ff0090;line-height:.8;font-family:'Anton',Impact,sans-serif;}
  .quote-bar .q-text{font-size:16px;letter-spacing:1.5px;color:#000;font-family:'Anton',Impact,sans-serif;text-transform:uppercase;line-height:1.4;}
  .tag-row{display:flex;border-left:5px solid #000;border-right:5px solid #000;border-top:5px solid #000;}
  .tag{flex:1;font-family:'Anton',Impact,sans-serif;font-size:12px;letter-spacing:2px;text-align:center;padding:10px 4px;border-right:4px solid #000;text-transform:uppercase;}
  .tag:last-child{border-right:none;}
  .footer{background:#000;color:#fff;text-align:center;padding:16px;font-family:'Anton',Impact,sans-serif;font-size:26px;letter-spacing:8px;border:5px solid #000;border-top:5px solid #ff0090;text-transform:uppercase;}
  .footer span{color:#00b7ff;}
</style>
