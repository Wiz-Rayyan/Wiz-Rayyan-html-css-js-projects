
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');
  .pa-root {
    background: #FFE700;
    font-family: Impact, 'Anton', sans-serif;
    padding: 0;
    margin: 0;
    position: relative;
    overflow: hidden;
  }
  .pa-dots-bg {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle, #00B7D4 2.5px, transparent 2.5px),
      radial-gradient(circle, #E8007D 2.5px, transparent 2.5px),
      radial-gradient(circle, #FFE700 2px, transparent 2px);
    background-size: 18px 18px, 18px 18px, 18px 18px;
    background-position: 0 0, 9px 9px, 4px 14px;
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }
  .pa-header {
    position: relative;
    z-index: 1;
    background: #E8007D;
    border-bottom: 4px solid #000;
    padding: 18px 24px 12px;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .pa-header h1 {
    font-family: Impact, sans-serif;
    font-size: 38px;
    color: #FFE700;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin: 0;
    -webkit-text-stroke: 1.5px #000;
    text-stroke: 1.5px #000;
    line-height: 1;
    filter: contrast(1.1);
  }
  .pa-header .sub {
    font-family: Impact, sans-serif;
    font-size: 14px;
    color: #00B7D4;
    letter-spacing: 4px;
    text-transform: uppercase;
    -webkit-text-stroke: 0.5px #000;
    margin: 0;
  }
  .pa-grid {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
  }
  .pa-cell {
    border: 3px solid #000;
    margin: -1.5px;
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.12s;
  }
  .pa-cell:hover { transform: scale(1.04); z-index: 10; }
  .pa-cell svg { width: 72%; height: 72%; display: block; }
  .pa-cell .label {
    font-family: Impact, sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #000;
    margin-top: 6px;
    z-index: 1;
  }
  .pa-cell .dots-overlay {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(0,0,0,0.18) 1.5px, transparent 1.5px);
    background-size: 7px 7px;
    pointer-events: none;
  }
  .c1 { background: #00B7D4; }
  .c2 { background: #E8007D; }
  .c3 { background: #FFE700; }
  .c4 { background: #FF5C00; }
  .c5 { background: #7B2FBE; }
  .c6 { background: #00C853; }
  .c7 { background: #E8007D; }
  .c8 { background: #00B7D4; }
  .pa-speech {
    position: relative;
    z-index: 1;
    background: #fff;
    border: 3.5px solid #000;
    border-radius: 18px 18px 18px 4px;
    padding: 14px 20px;
    margin: 16px 20px;
    font-family: Impact, sans-serif;
    font-size: 20px;
    color: #000;
    letter-spacing: 1px;
    text-transform: uppercase;
    display: inline-block;
    position: relative;
    box-shadow: 4px 4px 0 #000;
    max-width: 360px;
  }
  .pa-speech::after {
    content: '';
    position: absolute;
    bottom: -18px;
    left: 28px;
    width: 0; height: 0;
    border-left: 14px solid transparent;
    border-right: 0px solid transparent;
    border-top: 18px solid #000;
  }
  .pa-speech::before {
    content: '';
    position: absolute;
    bottom: -12px;
    left: 31px;
    width: 0; height: 0;
    border-left: 11px solid transparent;
    border-right: 0px solid transparent;
    border-top: 14px solid #fff;
    z-index: 1;
  }
  .pa-footer {
    position: relative;
    z-index: 1;
    background: #000;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 3px solid #FFE700;
    margin-top: 20px;
  }
  .pa-footer .copy {
    font-family: Impact, sans-serif;
    font-size: 12px;
    color: #FFE700;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .pa-footer .dots-row {
    display: flex; gap: 8px; align-items: center;
  }
  .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; }
  .pa-tag {
    font-family: Impact, sans-serif;
    font-size: 10px;
    background: #FFE700;
    color: #000;
    border: 2px solid #000;
    padding: 2px 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .pa-middle {
    position: relative;
    z-index: 1;
    padding: 10px 20px 4px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .pa-repeat-strip {
    position: relative;
    z-index: 1;
    display: flex;
    border-top: 3px solid #000;
    border-bottom: 3px solid #000;
    background: #7B2FBE;
    overflow: hidden;
  }
  .pa-repeat-item {
    flex: 1;
    border-right: 3px solid #000;
    padding: 10px 0 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .pa-repeat-item:last-child { border-right: none; }
  .pa-repeat-item svg { width: 40px; height: 40px; }
  .pa-repeat-item span {
    font-family: Impact, sans-serif;
    font-size: 9px;
    color: #FFE700;
    letter-spacing: 2px;
    text-transform: uppercase;
    -webkit-text-stroke: 0.3px #000;
  }
</style>
