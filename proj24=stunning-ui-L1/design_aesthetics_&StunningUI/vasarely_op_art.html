
<style>
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.82} }
  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.018)} }
  @keyframes ripple { 0%,100%{transform:scale(1) rotate(0deg)} 50%{transform:scale(1.012) rotate(0.4deg)} }
  @keyframes jitter { 0%,100%{transform:translateX(0)} 25%{transform:translateX(0.5px)} 75%{transform:translateX(-0.5px)} }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; }
  .gallery { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: auto auto; gap: 2px; width: 100%; background: #000; }
  .panel { position: relative; overflow: hidden; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
  .panel canvas, .panel svg { width: 100%; height: 100%; display: block; }
  .label { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); font-family: 'Courier New', monospace; font-size: 9px; letter-spacing: 0.15em; color: rgba(255,255,255,0.4); text-transform: uppercase; white-space: nowrap; mix-blend-mode: difference; }

  /* Panel 1 – concentric squares, breathing */
  .p1 { background: #fff; animation: breathe 3.2s ease-in-out infinite; }

  /* Panel 2 – rotating ring lines */
  .p2 { background: #000; }
  .p2-inner { animation: spin 24s linear infinite; width: 100%; height: 100%; }

  /* Panel 3 – checkerboard shimmer */
  .p3 { background: #000; }

  /* Panel 4 – radiating lines, jitter */
  .p4 { background: #000; animation: jitter 0.12s ease-in-out infinite; }

  /* Panel 5 – moiré circles, ripple */
  .p5 { background: #fff; animation: ripple 2.1s ease-in-out infinite; }

  /* Panel 6 – diamond spiral pulse */
  .p6 { background: #000; animation: pulse 2.8s ease-in-out infinite; }
</style>

<script>
(function(){
  const c = document.getElementById('checker');
  if (!c) return;
  const ctx = c.getContext('2d');
  let t = 0;
  const N = 10;
  const size = 300;
  const cell = size / N;

  function draw(offset) {
    ctx.clearRect(0, 0, size, size);
    for (let row = -1; row < N + 1; row++) {
      for (let col = -1; col < N + 1; col++) {
        const x = col * cell + (offset % (cell * 2));
        const y = row * cell;
        const fill = (row + col) % 2 === 0 ? '#000' : '#fff';
        ctx.fillStyle = fill;
        ctx.fillRect(x, y, cell, cell);
      }
    }
  }

  function loop() {
    t += 0.25;
    draw(t);
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
