
<style>

.mailrow:hover{background:#000080;color:#FFF}

.cpicon{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:6px;width:70px}

<script>
const ROWS=9,COLS=9,MINES=10;
let board=[],revealed=[],flagged=[],gameOver=false,gameWon=false,firstClick=true,timerInt=null,seconds=0,selMail=null;

function initGame(){
  clearInterval(timerInt);seconds=0;gameOver=false;gameWon=false;firstClick=true;
  board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  revealed=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  flagged=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  document.getElementById('timer-disp').textContent='000';
  document.getElementById('mine-count').textContent='010';
  document.getElementById('mine-status').textContent='Right-click to flag';
  setFace('smile');
  renderBoard();
}

function placeMines(sr,sc){
  let placed=0;
  while(placed<MINES){
    const r=Math.floor(Math.random()*ROWS),c=Math.floor(Math.random()*COLS);
    if(board[r][c]!=-1&&!(Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1)){board[r][c]=-1;placed++;}
  }
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(board[r][c]===-1)continue;
    let n=0;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&board[nr][nc]===-1)n++;}
    board[r][c]=n;
  }
}

function setFace(s){
  const faces={smile:'<circle cx="8" cy="8" r="7" fill="#FFFF00" stroke="#808080" stroke-width="1"/><circle cx="5" cy="6" r="1.5" fill="#000"/><circle cx="11" cy="6" r="1.5" fill="#000"/><path d="M5,10 Q8,13 11,10" stroke="#000" stroke-width="1" fill="none"/>',dead:'<circle cx="8" cy="8" r="7" fill="#FFFF00" stroke="#808080" stroke-width="1"/><line x1="4" y1="5" x2="7" y2="8" stroke="#000" stroke-width="1.5"/><line x1="7" y1="5" x2="4" y2="8" stroke="#000" stroke-width="1.5"/><line x1="9" y1="5" x2="12" y2="8" stroke="#000" stroke-width="1.5"/><line x1="12" y1="5" x2="9" y2="8" stroke="#000" stroke-width="1.5"/><path d="M5,12 Q8,10 11,12" stroke="#000" stroke-width="1" fill="none"/>',cool:'<circle cx="8" cy="8" r="7" fill="#FFFF00" stroke="#808080" stroke-width="1"/><rect x="3" y="5" width="10" height="4" fill="#000" rx="1"/><rect x="4" y="5" width="3" height="3" fill="#808080" rx="1"/><rect x="9" y="5" width="3" height="3" fill="#808080" rx="1"/><path d="M5,12 Q8,15 11,12" stroke="#000" stroke-width="1" fill="none"/>',shock:'<circle cx="8" cy="8" r="7" fill="#FFFF00" stroke="#808080" stroke-width="1"/><circle cx="5" cy="6" r="2" fill="#000"/><circle cx="11" cy="6" r="2" fill="#000"/><circle cx="8" cy="11" r="2" fill="#000"/>'};
  document.getElementById('face-svg').innerHTML=faces[s]||faces.smile;
}

function renderBoard(){
  const mf=document.getElementById('minefield');mf.innerHTML='';
  for(let r=0;r<ROWS;r++){
    const row=document.createElement('div');row.className='mrow';
    for(let c=0;c<COLS;c++){
      const cell=document.createElement('div');
      cell.className='cell';
      if(revealed[r][c]){
        cell.classList.add('open');
        if(board[r][c]===-1){cell.textContent='*';cell.style.color='#000';if(gameOver)cell.classList.add('mine-hit');}
        else if(board[r][c]>0){cell.textContent=board[r][c];cell.classList.add('c'+board[r][c]);}
      } else if(flagged[r][c]){cell.textContent='F';cell.classList.add('flag');}
      if(!revealed[r][c]&&!gameOver&&!gameWon){
        cell.onclick=()=>clickCell(r,c);
        cell.oncontextmenu=(e)=>{e.preventDefault();toggleFlag(r,c);};
        cell.onmousedown=(e)=>{if(e.button===0)setFace('shock');};
        cell.onmouseup=(e)=>{if(e.button===0&&!gameOver&&!gameWon)setFace('smile');};
      }
      row.appendChild(cell);
    }
    mf.appendChild(row);
  }
}

function clickCell(r,c){
  if(gameOver||gameWon||flagged[r][c])return;
  if(firstClick){firstClick=false;placeMines(r,c);startTimer();}
  if(board[r][c]===-1){reveal(r,c);endGame(false);return;}
  floodReveal(r,c);checkWin();
}

function floodReveal(r,c){
  if(r<0||r>=ROWS||c<0||c>=COLS||revealed[r][c]||flagged[r][c])return;
  revealed[r][c]=true;
  if(board[r][c]===0)for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)floodReveal(r+dr,c+dc);
}

function reveal(r,c){revealed[r][c]=true;}

function toggleFlag(r,c){
  if(revealed[r][c])return;
  flagged[r][c]=!flagged[r][c];
  const cnt=flagged.flat().filter(Boolean).length;
  document.getElementById('mine-count').textContent=String(MINES-cnt).padStart(3,'0');
  renderBoard();
}

function endGame(won){
  gameOver=!won;gameWon=won;clearInterval(timerInt);
  if(!won){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(board[r][c]===-1)revealed[r][c]=true;setFace('dead');document.getElementById('mine-status').textContent='BOOM! Click smiley to restart';}
  else{setFace('cool');document.getElementById('mine-status').textContent='You win! Click smiley to restart';}
  renderBoard();
}

function checkWin(){
  let unrevealed=0;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(!revealed[r][c])unrevealed++;
  if(unrevealed===MINES)endGame(true);
  renderBoard();
}

function startTimer(){timerInt=setInterval(()=>{seconds=Math.min(seconds+1,999);document.getElementById('timer-disp').textContent=String(seconds).padStart(3,'0');},1000);}

const mails=[
  {from:'Bill Gates',subj:'Windows 95 Launch!',date:'8/24/95',body:'Team,\n\nToday is the big day. Windows 95 ships to the world.\nThank you all for your incredible work.\n\n- Bill',unread:true},
  {from:'AOL Service',subj:'You\'ve got mail!',date:'9/1/95',body:'Welcome to America Online!\n\nYou have (1) new message in your mailbox.\nSign on at 1-800-827-6364.\n\nAOL Member Services',unread:true},
  {from:'CompuServe',subj:'Monthly bill',date:'9/3/95',body:'Your CompuServe account has been billed:\n\nBasic service: $9.95\nExtended time: $3.50\nTotal: $13.45\n\nThank you for using CompuServe.',unread:false},
  {from:'Netscape Comm.',subj:'Navigator 2.0 Beta',date:'9/5/95',body:'Download the future of the web!\n\nNetscape Navigator 2.0 Beta is now available.\nNew: JavaScript, frames, and plug-ins!\n\nhttp://home.netscape.com',unread:true},
  {from:'Mom',subj:'Re: Christmas visit',date:'9/10/95',body:'Honey,\n\nYour father and I would love to see you at\nChristmas. Please let us know your plans.\n\nLove, Mom\nP.S. How do you attach a file to this thing?',unread:false},
];

function renderMails(){
  const ml=document.getElementById('maillist');ml.innerHTML='';
  mails.forEach((m,i)=>{
    const row=document.createElement('div');
    row.className='mailrow'+(m.unread?' unread':'')+(selMail===i?' sel':'');
    row.innerHTML=`<span style="width:16px;font-size:10px">${m.unread?'●':''}</span><span style="flex:1;overflow:hidden;white-space:nowrap">${m.from}</span><span style="flex:2;overflow:hidden;white-space:nowrap">${m.subj}</span><span style="width:70px;font-size:11px">${m.date}</span>`;
    row.onclick=()=>{selMail=i;mails[i].unread=false;renderMails();document.getElementById('mailbody').textContent=m.body;document.getElementById('mail-sel').textContent=m.subj;};
    ml.appendChild(row);
  });
  const unread=mails.filter(m=>m.unread).length;
  document.getElementById('mail-count').textContent=mails.length+' messages, '+unread+' unread';
}

function composeNew(){
  document.getElementById('mailbody').innerHTML='<b>New Message</b><br><br>To: _________________<br>Subject: _________________<br><br>Type your message here...';
  selMail=null;renderMails();
}
function replyMail(){
  if(selMail===null)return;
  const m=mails[selMail];
  document.getElementById('mailbody').innerHTML=`<b>Re: ${m.subj}</b><br>To: ${m.from}<br><br>---Original message---<br>${m.body.split('\n')[0]}...`;
}
function deleteMail(){if(selMail!==null){mails.splice(selMail,1);selMail=null;renderMails();document.getElementById('mailbody').innerHTML='<span style="color:#808080;font-style:italic">Message deleted.</span>';}}
function checkMail(){document.getElementById('mine-status').textContent='Checking mail...';setTimeout(()=>document.getElementById('mine-status').textContent='Right-click to flag',1500);}

const cpItems=[
  {name:'Display',ico:'<rect x="2" y="4" width="20" height="14" fill="#DFDFDF" stroke="#808080" stroke-width="1"/><rect x="4" y="6" width="16" height="10" fill="#000080"/>',detail:'displayPanel'},
  {name:'Sounds',ico:'<polygon points="4,8 4,16 8,16 14,20 14,4 8,8" fill="#C0C0C0" stroke="#808080" stroke-width="1"/><path d="M16,8 Q20,12 16,16" stroke="#808080" stroke-width="1.5" fill="none"/>',detail:'soundPanel'},
  {name:'Mouse',ico:'<rect x="6" y="2" width="12" height="18" rx="6" fill="#C0C0C0" stroke="#808080" stroke-width="1"/><line x1="12" y1="2" x2="12" y2="12" stroke="#808080" stroke-width="1"/>',detail:'mousePanel'},
  {name:'Date/Time',ico:'<rect x="2" y="4" width="20" height="18" fill="#FFF" stroke="#808080" stroke-width="1"/><rect x="2" y="4" width="20" height="5" fill="#000080"/><text x="12" y="17" text-anchor="middle" font-size="8" font-family="Courier New">31</text>',detail:'datePanel'},

  displayPanel:`<b>Display Properties</b><br><div style="margin-top:6px;font-size:12px">Desktop color:<br><input type="color" value="#008080" style="margin:4px 0"><br>Resolution:<br><input class="inp95" type="text" value="800x600" style="width:100px;margin:4px 0"><br>Color depth:<br><input class="inp95" type="text" value="16-bit (65536 colors)" style="width:160px;margin:4px 0"></div>`,
  soundPanel:`<b>Sound Properties</b><br><div style="margin-top:6px;font-size:12px">Master volume:<br><input type="range" class="slider95" min="0" max="100" value="75" style="margin:6px 0"><br>Events:<br><select class="inp95" style="margin:4px 0;width:140px"><option>Windows Start</option><option>Windows Exit</option><option>New Mail</option><option>Error</option></select></div>`,
  mousePanel:`<b>Mouse Properties</b><br><div style="margin-top:6px;font-size:12px">Double-click speed:<br><input type="range" class="slider95" min="1" max="10" value="5" style="margin:6px 0"><br>Pointer speed:<br><input type="range" class="slider95" min="1" max="10" value="7" style="margin:6px 0"><br><label style="display:flex;align-items:center;gap:4px;margin-top:4px"><input type="checkbox"> Swap mouse buttons</label></div>`,
  datePanel:`<b>Date / Time Properties</b><br><div style="margin-top:6px;font-size:12px">Date: <input class="inp95" type="text" value="September 10, 1995" style="width:140px;margin:4px 0"><br>Time: <input class="inp95" type="text" id="cptime" style="width:90px;margin:4px 0"><br>Timezone: <input class="inp95" type="text" value="(GMT-08:00) Pacific" style="width:160px;margin:4px 0"></div>`,
  netPanel:`<b>Network Properties</b><br><div style="margin-top:6px;font-size:12px">Computer name: <input class="inp95" type="text" value="DESKTOP-WIN95" style="width:130px;margin:4px 0"><br>Workgroup: <input class="inp95" type="text" value="WORKGROUP" style="width:130px;margin:4px 0"><br>IP Address: <input class="inp95" type="text" value="192.168.1.101" style="width:130px;margin:4px 0"></div>`,
  printPanel:`<b>Printers</b><br><div style="margin-top:6px;font-size:12px">Default printer: <input class="inp95" type="text" value="HP LaserJet 4" style="width:140px;margin:4px 0"><br>Port: <input class="inp95" type="text" value="LPT1" style="width:60px;margin:4px 0"><br><label style="display:flex;align-items:center;gap:4px;margin-top:4px"><input type="checkbox" checked> Spool print jobs</label></div>`,
};

function buildCp(){
  const cp=document.getElementById('cpanel');cp.innerHTML='';
  cpItems.forEach(item=>{
    const d=document.createElement('div');d.className='cpicon';
    d.innerHTML=`<svg width="24" height="24" viewBox="0 0 24 24" style="width:24px;height:24px">${item.ico}</svg><span class="cpilabel">${item.name}</span>`;
    d.onclick=()=>openCp(item.detail);
    cp.appendChild(d);
  });
}

function openCp(detail){
  document.getElementById('cpdetail').style.display='block';
  document.getElementById('cpdetail-content').innerHTML=cpDetails[detail]||'<b>Settings</b>';
  if(detail==='datePanel'){const t=document.getElementById('cptime');if(t)t.value=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
}
function closeCp(){document.getElementById('cpdetail').style.display='none';}

function updateClock(){
  const t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  document.getElementById('clk3').textContent=t;
}

initGame();renderMails();buildCp();updateClock();setInterval(updateClock,1000);
</script>
