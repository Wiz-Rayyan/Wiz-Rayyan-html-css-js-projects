function mercator(lat, lon) {
  const w = W(), h = H();
  const scale = 200 * cam.zoom;
  const cx = w / 2;
  const cy = h / 2;
  const dLon = ((lon - cam.lon + 540) % 360) - 180;
  let x = cx + dLon * (scale / 45);
  const latRad = lat * Math.PI / 180;
  const camLatRad = cam.lat * Math.PI / 180;
  let y = cy - (Math.log(Math.tan(Math.PI/4 + latRad/2)) - Math.log(Math.tan(Math.PI/4 + camLatRad/2))) * scale / (Math.PI / 180 * 45);
  if (cam.tilt !== 0) {
    const dy = y - cy;
    const perspective = 0.0007 * cam.tilt;
    const scale2 = 1 / (1 + perspective * dy);
    x = cx + (x - cx) * scale2;
    y = cy + dy * scale2;
  }
  return [x, y];
}

  [[100,10],[98,12],[96,14],[94,16],[92,16],[90,14],[88,12],[86,10],[84,8],[82,6],[80,4],[78,2],[76,0],[74,-2],[72,-4],[70,-6],[72,-8],[74,-8],[76,-6],[78,-4],[80,-2],[82,0],[84,2],[86,4],[88,6],[90,8],[92,8],[94,6],[96,4],[98,2],[100,0],[102,-2],[104,-4],[106,-4],[108,-2],[110,0],[112,2],[114,4],[116,6],[118,8],[120,10],[122,12],[120,14],[118,14],[116,12],[114,10],[112,8],[110,6],[108,4],[106,4],[104,6],[102,8],[100,10]],
];

function drawMap() {
  const w = W(), h = H();
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#0a0f1e';
  ctx.fillRect(0, 0, w, h);

  for (let lon = -180; lon <= 180; lon += 30) {
    ctx.beginPath();
    const [x0] = mercator(-85, lon);
    const [x1, y1] = mercator(85, lon);
    ctx.moveTo(x0, y1 + (H() - y1));
    for (let lat = -80; lat <= 85; lat += 5) {
      const [gx, gy] = mercator(lat, lon);
      if (lat === -80) ctx.moveTo(gx, gy); else ctx.lineTo(gx, gy);
    }
    ctx.strokeStyle = 'rgba(99,120,255,0.06)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }
  for (let lat = -60; lat <= 80; lat += 30) {
    ctx.beginPath();
    for (let lon2 = -180; lon2 <= 180; lon2 += 2) {
      const [gx, gy] = mercator(lat, lon2);
      if (lon2 === -180) ctx.moveTo(gx, gy); else ctx.lineTo(gx, gy);
    }
    ctx.strokeStyle = lat === 0 ? 'rgba(99,120,255,0.15)' : 'rgba(99,120,255,0.06)';
    ctx.lineWidth = lat === 0 ? 0.8 : 0.5;
    ctx.stroke();
  }

  LAND_POLYS.forEach(poly => {
    ctx.beginPath();
    poly.forEach(([lat, lon], i) => {
      const [x, y] = mercator(lat, lon);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.fillStyle = 'rgba(99,120,255,0.13)';
    ctx.strokeStyle = 'rgba(99,120,255,0.35)';
    ctx.lineWidth = 0.7;
    ctx.fill();
    ctx.stroke();
  });

  CITIES.forEach(city => {
    const [x, y] = mercator(city.lat, city.lon);
    if (x < -10 || x > w + 10 || y < -10 || y > h + 10) return;
    ctx.beginPath();
    ctx.arc(x, y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = city === hoverCity ? 'rgba(200,220,255,0.95)' : 'rgba(120,150,255,0.55)';
    ctx.fill();
    if (cam.zoom > 1.5 || city === hoverCity) {
      ctx.font = '500 11px var(--font-sans, sans-serif)';
      ctx.fillStyle = city === hoverCity ? 'rgba(200,220,255,0.95)' : 'rgba(120,150,255,0.7)';
      ctx.fillText(city.name, x + 5, y - 3);
    }
  });

  if (currentPin) {
    const [px, py] = mercator(currentPin.lat, currentPin.lon);
    const bounce = Math.sin(pinBounce) * 5;
    ctx.save();
    ctx.shadowColor = 'rgba(99,200,255,0.5)';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(px, py + bounce);
    ctx.lineTo(px - 8, py - 16 + bounce);
    ctx.arc(px, py - 22 + bounce, 8, Math.PI * 0.85, Math.PI * 2.15);
    ctx.closePath();
    ctx.fillStyle = 'rgba(99,200,255,0.95)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(px, py - 22 + bounce, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.restore();

    if (pinBounce > 0.1) {
      ctx.font = '500 12px var(--font-sans, sans-serif)';
      ctx.fillStyle = 'rgba(200,240,255,0.9)';
      ctx.textAlign = 'center';
      ctx.fillText(currentPin.name, px, py - 36 + bounce);
      ctx.textAlign = 'left';
    }
  }

  if (flight && !cancelled) {
    const t = flight.progress;
    const [fx, fy] = mercator(flight.curLat, flight.curLon);
    ctx.beginPath();
    const ftPoints = 20;
    for (let i = 0; i <= ftPoints; i++) {
      const ft = (i / ftPoints) * t;
      const flp = bezierPoint(ft, flight.p0lat, flight.p0lon, flight.p1lat, flight.p1lon, flight.p2lat, flight.p2lon, flight.p3lat, flight.p3lon);
      const [trailX, trailY] = mercator(flp.lat, flp.lon);
      if (i === 0) ctx.moveTo(trailX, trailY); else ctx.lineTo(trailX, trailY);
    }
    ctx.strokeStyle = 'rgba(99,200,255,0.3)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.beginPath();
    ctx.arc(fx, fy, 5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(99,200,255,0.9)';
    ctx.shadowColor = 'rgba(99,200,255,0.8)';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  coordsEl.textContent = `${cam.lat.toFixed(1)}°N  ${cam.lon.toFixed(1)}°E  ×${cam.zoom.toFixed(2)}`;
}

function bezierPoint(t, p0lat, p0lon, p1lat, p1lon, p2lat, p2lon, p3lat, p3lon) {
  const mt = 1 - t;
  const lat = mt*mt*mt*p0lat + 3*mt*mt*t*p1lat + 3*mt*t*t*p2lat + t*t*t*p3lat;
  const lon = mt*mt*mt*p0lon + 3*mt*mt*t*p1lon + 3*mt*t*t*p2lon + t*t*t*p3lon;
  return { lat, lon };
}

function cubicBezierEase(t) {
  const p1x = 0.2, p1y = 0.0, p2x = 0.4, p2y = 1.05;
  let low = 0, high = 1, mid;
  for (let i = 0; i < 20; i++) {
    mid = (low + high) / 2;
    const mt = 1 - mid;
    const cx = 3*mt*mt*mid*p1x + 3*mt*mid*mid*p2x + mid*mid*mid;
    if (Math.abs(cx - t) < 0.001) break;
    cx < t ? (low = mid) : (high = mid);
  }
  mid = (low + high) / 2;
  const mt2 = 1 - mid;
  return 3*mt2*mt2*mid*p1y + 3*mt2*mid*mid*p2y + mid*mid*mid;
}

function flyTo(destLat, destLon, destName) {
  if (flight) { cancelled = true; }
  cancelled = false;
  currentPin = null;
  targetPin = { lat: destLat, lon: destLon, name: destName };
  statusBar.style.opacity = '1';
  cancelBtn.style.display = 'block';

  const fromLat = cam.lat, fromLon = cam.lon;
  const fromZoom = cam.zoom;
  const toZoom = 2.5;
  const midZoom = 0.55;

  const dLon = ((destLon - fromLon + 540) % 360) - 180;
  const midLat = (fromLat + destLat) / 2;
  const midLon = fromLon + dLon / 2;
  const highLat = midLat + (Math.abs(destLat - fromLat) * 0.3 + 15);

  const p0lat = fromLat, p0lon = fromLon;
  const p1lat = highLat + 5, p1lon = midLon - dLon * 0.1;
  const p2lat = highLat - 5, p2lon = midLon + dLon * 0.1;
  const p3lat = destLat, p3lon = destLon;

  const duration = 2200;
  const startTime = performance.now();

  flight = { p0lat, p0lon, p1lat, p1lon, p2lat, p2lon, p3lat, p3lon, progress: 0, curLat: fromLat, curLon: fromLon };

  let lastStatus = '';
  function animate(now) {
    if (cancelled) {
      flight = null;
      cancelBtn.style.display = 'none';
      statusBar.textContent = '✈️ Flight cancelled';
      draw();
      return;
    }
    const elapsed = now - startTime;
    const rawT = Math.min(elapsed / duration, 1);
    const t = cubicBezierEase(rawT);

    const pos = bezierPoint(t, p0lat, p0lon, p1lat, p1lon, p2lat, p2lon, p3lat, p3lon);
    cam.lat = pos.lat;
    cam.lon = pos.lon;
    flight.progress = rawT;
    flight.curLat = pos.lat;
    flight.curLon = pos.lon;

    if (rawT < 0.5) {
      const localT = rawT * 2;
      cam.zoom = fromZoom + (midZoom - fromZoom) * cubicBezierEase(localT);
      cam.tilt = localT * 15;
      const newStatus = '🛫 Pulling up…';
      if (newStatus !== lastStatus) { statusBar.textContent = newStatus; lastStatus = newStatus; }
    } else {
      const localT = (rawT - 0.5) * 2;
      cam.zoom = midZoom + (toZoom - midZoom) * cubicBezierEase(localT);
      cam.tilt = 15 - localT * 15;
      const newStatus = '🛬 Descending to ' + destName + '…';
      if (newStatus !== lastStatus) { statusBar.textContent = newStatus; lastStatus = newStatus; }
    }

    draw();

    if (rawT < 1) {
      animFrame = requestAnimationFrame(animate);
    } else {
      flight = null;
      cancelBtn.style.display = 'none';
      cam.lat = destLat;
      cam.lon = destLon;
      cam.zoom = toZoom;
      cam.tilt = 0;
      currentPin = targetPin;
      pinBounce = Math.PI / 2;
      pinBounceDir = 1;
      statusBar.textContent = '📍 Arrived at ' + destName;
      draw();
      startPinBounce();
    }
  }
  if (animFrame) cancelAnimationFrame(animFrame);
  animFrame = requestAnimationFrame(animate);
}

function startPinBounce() {
  let frames = 0;
  function b() {
    pinBounce += pinBounceDir * 0.15;
    if (pinBounce > Math.PI) { pinBounce = Math.PI; pinBounceDir = -1; }
    if (pinBounce < 0.0) { pinBounce = 0; return; }
    draw();
    frames++;
    if (frames < 80) requestAnimationFrame(b);
  }
  requestAnimationFrame(b);
}

function draw() { drawMap(); }

function findCity(query) {
  const q = query.trim().toLowerCase();
  if (!q) return null;
  return CITIES.find(c => c.name.toLowerCase().includes(q)) || null;
}

async function geocode(query) {
  const city = findCity(query);
  if (city) return city;
  const guesses = [
    { name: query, lat: 48.8566, lon: 2.3522 },
  ];
  return null;
}

document.getElementById('search-btn').addEventListener('click', async () => {
  const q = searchInput.value.trim();
  if (!q) return;
  const city = findCity(q);
  if (city) {
    flyTo(city.lat, city.lon, city.name);
  } else {
    statusBar.textContent = '❓ City not found. Try: London, Tokyo, Mumbai, New York…';
    statusBar.style.opacity = '1';
  }
});

searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('search-btn').click();
});

cancelBtn.addEventListener('click', () => { cancelled = true; });

canvas.addEventListener('click', () => {
  if (flight) { cancelled = true; }
});

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  let found = null;
  CITIES.forEach(city => {
    const [cx, cy] = mercator(city.lat, city.lon);
    if (Math.hypot(cx - mx, cy - my) < 12) found = city;
  });
  if (found !== hoverCity) { hoverCity = found; draw(); }
  canvas.style.cursor = found ? 'pointer' : 'crosshair';
});

canvas.addEventListener('click', e => {
  if (flight) { cancelled = true; return; }
  if (hoverCity) {
    searchInput.value = hoverCity.name;
    flyTo(hoverCity.lat, hoverCity.lon, hoverCity.name);
  }
});

const SUGGESTIONS = ['London', 'Tokyo', 'Sydney', 'New York', 'Dubai', 'Paris', 'Mumbai', 'São Paulo', 'Singapore', 'Cairo'];
let sugIdx = 0;
setInterval(() => {
  if (!flight && document.activeElement !== searchInput) {
    searchInput.placeholder = 'Try: ' + SUGGESTIONS[sugIdx % SUGGESTIONS.length] + '…';
    sugIdx++;
  }
}, 2200);

draw();
</script>
