
<style>

<script>
(function() {

  function setupRipple(canvas) {
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.offsetWidth;
    const H = canvas.offsetHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const cols = 90, rows = 56;
    const cellW = W / cols, cellH = H / rows;
    let t = 0;

    function draw() {
      ctx.fillStyle = '#0d1a18';
      ctx.fillRect(0, 0, W, H);

      for (let i = 0; i < cols; i++) {
        for (let j = 0; j < rows; j++) {
          const cx = i * cellW + cellW / 2;
          const cy = j * cellH + cellH / 2;
          const dist = Math.sqrt((cx - W*0.5)*(cx - W*0.5)*0.5 + (cy - H*0.5)*(cy - H*0.5)*0.5);
          const wave = Math.sin(dist * 0.045 - t * 0.8) * 0.5
                     + Math.sin(dist * 0.02 - t * 0.5) * 0.5;
          const norm = (wave + 1) / 2;
          const r = Math.round(18 + norm * 42);
          const g = Math.round(38 + norm * 65);
          const b = Math.round(35 + norm * 55);
          ctx.fillStyle = `rgb(${r},${g},${b})`;
          const size = cellW * (0.72 + norm * 0.28);
          ctx.fillRect(cx - size/2, cy - size/2, size, size);
        }
      }
      t += 0.018;
      requestAnimationFrame(draw);
    }
    draw();
  }

  function setupSand(canvas) {
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.offsetWidth;
    const H = canvas.offsetHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const particles = [];
    for (let i = 0; i < 800; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: Math.random() * 1.8 + 0.4,
        speed: Math.random() * 0.15 + 0.05,
        phase: Math.random() * Math.PI * 2,
        brightness: Math.random()
      });
    }
    let t = 0;

    function draw() {
      ctx.fillStyle = '#2a1f0e';
      ctx.fillRect(0, 0, W, H);
      for (const p of particles) {
        const drift = Math.sin(t * p.speed + p.phase) * 1.2;
        p.x += drift * 0.3;
        if (p.x > W) p.x -= W;
        if (p.x < 0) p.x += W;
        const bright = 0.45 + p.brightness * 0.45 + Math.sin(t * 0.3 + p.phase) * 0.1;
        const r = Math.round(170 * bright + 30);
        const g = Math.round(130 * bright + 20);
        const b = Math.round(60 * bright + 10);
        ctx.fillStyle = `rgba(${r},${g},${b},0.85)`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      t += 0.016;
      requestAnimationFrame(draw);
    }
    draw();
  }

  function setupSilk(canvas) {
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.offsetWidth;
    const H = canvas.offsetHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    let t = 0;
    function draw() {
      const imgData = ctx.createImageData(W, H);
      const d = imgData.data;
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const nx = x / W, ny = y / H;
          const wave = Math.sin(nx * 8 + t) * Math.cos(ny * 5 - t * 0.7)
                     + Math.sin(nx * 4 - t * 0.5) * Math.sin(ny * 9 + t * 0.4);
          const v = (wave + 2) / 4;
          const idx = (y * W + x) * 4;
          d[idx]   = Math.round(180 + v * 60);
          d[idx+1] = Math.round(165 + v * 55);
          d[idx+2] = Math.round(200 + v * 50);
          d[idx+3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);
      t += 0.012;
      requestAnimationFrame(draw);
    }
    draw();
  }

  function setupMoss(canvas) {
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.offsetWidth;
    const H = canvas.offsetHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    let t = 0;
    const blobs = Array.from({length: 60}, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 22 + 8,
      phase: Math.random() * Math.PI * 2,
      g: Math.round(55 + Math.random() * 60)
    }));

    function draw() {
      ctx.fillStyle = '#0e1a0e';
      ctx.fillRect(0, 0, W, H);
      for (const b of blobs) {
        const pulse = 1 + Math.sin(t * 0.4 + b.phase) * 0.08;
        const alpha = 0.25 + Math.sin(t * 0.3 + b.phase) * 0.1;
        ctx.fillStyle = `rgba(40,${b.g},28,${alpha})`;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * pulse, 0, Math.PI * 2);
        ctx.fill();
      }
      for (const b of blobs) {
        const pulse = 1 + Math.cos(t * 0.5 + b.phase) * 0.06;
        ctx.fillStyle = `rgba(68,${Math.min(b.g+30,140)},45,0.35)`;
        ctx.beginPath();
        ctx.arc(b.x + 4, b.y - 3, b.r * 0.55 * pulse, 0, Math.PI * 2);
        ctx.fill();
      }
      t += 0.014;
      requestAnimationFrame(draw);
    }
    draw();
  }

  function init() {
    const r = document.getElementById('ripple');
    const s = document.getElementById('sand-c');
    const k = document.getElementById('silk-c');
    const m = document.getElementById('moss-c');
    if (r) setupRipple(r);
    if (s) setupSand(s);
    if (k) setupSilk(k);
    if (m) setupMoss(m);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    setTimeout(init, 0);
  }
})();
</script>
