
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cinzel+Decorative:wght@400&family=IM+Fell+English:ital@0;1&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
.hr{background:#2D5A27;min-height:100vh;width:100%;position:relative;overflow:hidden;font-family:'Cinzel',serif;color:#D9C5A7}
.mist-t{position:absolute;top:0;left:0;right:0;height:200px;background:linear-gradient(to bottom,rgba(255,255,255,0.26) 0%,rgba(255,255,255,0.08) 50%,transparent 100%);pointer-events:none;z-index:2}
.mist-b{position:absolute;bottom:0;left:0;right:0;height:140px;background:linear-gradient(to top,rgba(255,255,255,0.16) 0%,transparent 100%);pointer-events:none;z-index:2}
@keyframes drift{from{transform:translateX(-20px)}to{transform:translateX(20px)}}
.mist-m{position:absolute;top:260px;left:0;right:0;height:80px;background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.06),transparent);pointer-events:none;z-index:2;animation:drift 20s ease-in-out infinite alternate}
.hills{position:absolute;bottom:0;left:0;width:100%;z-index:1}
.content{position:relative;z-index:3;padding-bottom:60px}

.knot-bar{width:100%;display:flex;justify-content:center;padding:14px 0 8px}

.hdr{text-align:center;padding:32px 24px 8px}
.htitle{font-family:'Cinzel Decorative','Cinzel',serif;font-size:40px;font-weight:400;color:#E8D5B5;letter-spacing:.12em;text-shadow:0 2px 20px rgba(0,0,0,0.5);line-height:1.2}
.hsub{font-family:'IM Fell English',serif;font-style:italic;font-size:14px;color:#C4A97D;letter-spacing:.06em;margin-top:6px}
.hdiv{width:160px;height:1px;background:linear-gradient(to right,transparent,#C4A97D,transparent);margin:14px auto}

.nav{display:flex;justify-content:center;gap:6px;padding:10px 24px 0;flex-wrap:wrap}
.nb{background:rgba(15,38,12,0.5);border:0.5px solid rgba(196,169,125,0.3);color:#9E8060;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.15em;text-transform:uppercase;padding:7px 16px;border-radius:4px;cursor:pointer;transition:all .25s}
.nb:hover,.nb.active{background:rgba(196,169,125,0.15);border-color:rgba(196,169,125,0.7);color:#D9C5A7}

.section{display:none;padding:0 20px}
.section.visible{display:block}

.stone-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 0}
@keyframes pulse{0%,100%{opacity:.18}50%{opacity:.35}}
.sglow{animation:pulse 6s ease-in-out infinite}
.sglow2{animation:pulse 6s ease-in-out infinite;animation-delay:3s}

.qdiv{text-align:center;max-width:480px;margin:24px auto 0;padding:0 28px}
.qmark{font-family:'Cinzel Decorative',serif;font-size:48px;color:rgba(196,169,125,0.22);line-height:1;display:block;margin-bottom:-14px}
.qt{font-family:'IM Fell English',serif;font-style:italic;font-size:16px;line-height:1.85;color:#D9C5A7}
.qs{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.15em;color:#9E8060;margin-top:12px;text-transform:uppercase}

.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:600px;margin:24px auto 0}
.pc{background:rgba(15,38,12,0.55);border:0.5px solid rgba(196,169,125,0.3);border-radius:8px;padding:18px 16px 16px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.pc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(to right,transparent,rgba(196,169,125,0.5),transparent)}
.pc:hover{background:rgba(15,38,12,0.8);border-color:rgba(196,169,125,0.65);transform:translateY(-2px)}
.pc.expanded{background:rgba(15,38,12,0.85);border-color:rgba(196,169,125,0.75)}
.ptitle{font-family:'Cinzel',serif;font-size:11px;font-weight:600;letter-spacing:.14em;color:#C4A97D;text-transform:uppercase;margin-bottom:10px}
.pbody{font-family:'IM Fell English',serif;font-style:italic;font-size:13px;line-height:1.9;color:#D9C5A7}
.pauthor{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.1em;color:#7a5c30;margin-top:10px;text-align:right}
.pexpanded{display:none;margin-top:14px;border-top:0.5px solid rgba(196,169,125,0.2);padding-top:12px}
.pc.expanded .pexpanded{display:block}
.pread{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.12em;color:#9E8060;margin-top:8px;text-align:right;text-transform:uppercase}

.muslist{max-width:520px;margin:20px auto 0;padding:0 8px}
.mitem{display:flex;align-items:center;gap:14px;padding:12px 16px;background:rgba(15,38,12,0.45);border:0.5px solid rgba(196,169,125,0.2);border-radius:6px;margin-bottom:8px;cursor:pointer;transition:all .25s}
.mitem:hover,.mitem.playing{background:rgba(15,38,12,0.75);border-color:rgba(196,169,125,0.55)}
.micon{width:34px;height:34px;border-radius:50%;background:rgba(196,169,125,0.12);border:0.5px solid rgba(196,169,125,0.35);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#C4A97D;font-size:14px}
.minfo{flex:1}
.mtitle{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.1em;color:#D9C5A7;margin-bottom:3px}
.msub{font-family:'IM Fell English',serif;font-style:italic;font-size:12px;color:#9E8060}
.mbadge{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.1em;color:#7a5c30;text-transform:uppercase}
.mbar{height:3px;border-radius:2px;background:rgba(196,169,125,0.15);margin-top:14px;max-width:520px;margin-left:auto;margin-right:auto;display:none}
.mbar.active{display:block}
.mfill{height:100%;background:rgba(196,169,125,0.5);border-radius:2px;width:0%;transition:width .3s linear}

.writesec{max-width:520px;margin:20px auto 0;padding:0 8px}
.wlabel{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.15em;color:#9E8060;text-transform:uppercase;margin-bottom:8px;display:block}
.wtarea{width:100%;background:rgba(15,38,12,0.6);border:0.5px solid rgba(196,169,125,0.3);border-radius:6px;color:#D9C5A7;font-family:'IM Fell English',serif;font-style:italic;font-size:14px;line-height:1.9;padding:14px 16px;resize:vertical;min-height:110px;outline:none;transition:border-color .3s}
.wtarea:focus{border-color:rgba(196,169,125,0.7)}
.wtarea::placeholder{color:#5a4530;font-style:italic}
.wrow{display:flex;gap:10px;margin-top:10px;align-items:center}
.wbtn{background:rgba(196,169,125,0.12);border:0.5px solid rgba(196,169,125,0.4);color:#C4A97D;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:8px 16px;border-radius:4px;cursor:pointer;transition:all .25s}
.wbtn:hover{background:rgba(196,169,125,0.25);border-color:rgba(196,169,125,0.8)}
.wbtn.primary{background:rgba(196,169,125,0.2);border-color:rgba(196,169,125,0.6)}
.wsave{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.12em;color:#5a4530;text-transform:uppercase;margin-left:auto}
.saved-poems{margin-top:18px}
.saved-poem{background:rgba(15,38,12,0.45);border:0.5px solid rgba(196,169,125,0.2);border-radius:6px;padding:14px 16px;margin-bottom:8px}
.saved-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.saved-name{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.12em;color:#C4A97D;text-transform:uppercase}
.saved-del{font-family:'Cinzel',serif;font-size:9px;color:#5a4530;cursor:pointer;letter-spacing:.1em;text-transform:uppercase;transition:color .2s}
.saved-del:hover{color:#9E8060}
.saved-text{font-family:'IM Fell English',serif;font-style:italic;font-size:13px;line-height:1.85;color:#D9C5A7}
.title-input{background:rgba(15,38,12,0.6);border:0.5px solid rgba(196,169,125,0.3);border-radius:4px;color:#C4A97D;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.12em;padding:7px 12px;outline:none;width:180px;transition:border-color .3s}
.title-input:focus{border-color:rgba(196,169,125,0.7)}
.title-input::placeholder{color:#5a4530}

.origins{max-width:520px;margin:20px auto 0;padding:0 8px}
.ocard{background:rgba(15,38,12,0.5);border:0.5px solid rgba(196,169,125,0.22);border-radius:8px;padding:18px 20px;margin-bottom:12px}
.otitle{font-family:'Cinzel',serif;font-size:12px;font-weight:600;letter-spacing:.12em;color:#C4A97D;text-transform:uppercase;margin-bottom:10px}
.obody{font-family:'IM Fell English',serif;font-style:italic;font-size:13px;line-height:1.85;color:#B8A485}
.otag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.otag{background:rgba(196,169,125,0.1);border:0.5px solid rgba(196,169,125,0.3);border-radius:3px;padding:3px 10px;font-family:'Cinzel',serif;font-size:9px;letter-spacing:.1em;color:#9E8060;text-transform:uppercase}

.ftr{text-align:center;padding:20px 0 0;font-family:'Cinzel',serif;font-size:9px;letter-spacing:.2em;color:#5a4530;text-transform:uppercase}
</style>

<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden">Hiraeth — an interactive Welsh-Celtic poetry and longing site</h2>

            <path d="M24,11 C11,4 7,-13 7,-13 C7,-13 -5,-2 -22,6 C-37,13 -28,-8 -28,-8 C-28,-8 -13,-4 4,-17 C19,-28 24,11 24,11Z" fill="none" stroke="#C4A97D" stroke-width="1.1" opacity="0.65"/>

<script>
const quotes=[
  {t:"There is a longing in the marrow — a pull toward a green and misted country that no map has ever held.",s:"— Y Mabinogi, adapted"},
  {t:"Hiraeth is the homesickness for a home to which you cannot return, a home which maybe never was.",s:"— Welsh proverb"},
  {t:"And the old stones remember what the living have forgotten.",s:"— Taliesin, reconstructed"},
  {t:"Every exile carries a country inside them — not the one they left, but the one they dreamed.",s:"— after R.S. Thomas"},
  {t:"The mist does not mourn the valley it fills. And yet.",s:"— anon., Eryri"},
  {t:"To long for the unreachable is not weakness. It is the oldest form of love.",s:"— Celtic tradition"},
  {t:"I have heard the rivers singing names I do not know, but recognise.",s:"— Gillian Clarke, paraphr."},
];
let qi=0;
function newQuote(){qi=(qi+1)%quotes.length;document.getElementById('daily-quote').textContent=quotes[qi].t;document.getElementById('daily-src').textContent=quotes[qi].s;}

const poems=[
  {title:"Glas",body:"The colour between blue and green\nthe Welsh have named it —\nsky and sea and living grass\nall one aching word.",extra:"Glas is one of the oldest Welsh colour-words, spanning blue, green, and grey — the hues of a country that refuses to be separated from its sky.",author:"after Dylan Thomas"},
  {title:"The Threshold",body:"I stood once at a door\nin a country I had dreamed —\nthe smoke still rising from\na hearth that was not mine.",extra:"The threshold is sacred in Celtic tradition — neither inside nor outside, neither here nor there. Like hiraeth itself, it belongs to the between.",author:"anon., Pembrokeshire"},
  {title:"Cartref",body:"Home, they say, is where\nthe light falls in a certain way\nthrough window-glass you cannot\nfind again.",extra:"Cartref (Welsh: home) carries weight beyond shelter. It implies belonging, kin, and a particular quality of light that cannot be replicated elsewhere.",author:"R. S. Thomas, paraphr."},
  {title:"Stone Memory",body:"The standing stone has stood\nthree thousand years of rain —\nand still remembers the hands\nthat set it, warm.",extra:"The standing stones of Wales, Brittany, and Ireland were raised before writing. They are the oldest letters in a language we have almost forgotten.",author:"trad., Ynys Môn"},
  {title:"Nos Da",body:"Goodnight, says the mountain.\nGoodnight, says the sea.\nI carry your language\nlike a stone in me.",extra:"Nos da (Welsh: good night). To carry a language is to carry its entire world — every word a room you can still enter.",author:"contemporary, Wales"},
  {title:"The Unreturning",body:"You cannot step twice\ninto the same river —\nbut oh, how we stand\nat the bank.",extra:"A meditation on Heraclitus and Celtic river-worship. The rivers of Wales — Wye, Teifi, Dee — were gods before they were geography.",author:"after Heraclitus"},
];
function renderPoems(){
  const g=document.getElementById('poem-grid');
  g.innerHTML=poems.map((p,i)=>`
    <div class="pc" id="pc${i}" onclick="togglePoem(${i})">
      <div class="ptitle">${p.title}</div>
      <div class="pbody">${p.body.replace(/\n/g,'<br>')}</div>
      <div class="pexpanded"><div class="pbody" style="font-size:12px;color:#9E8060">${p.extra}</div></div>
      <div class="pauthor">— ${p.author}</div>
      <div class="pread" id="pr${i}">Read more ↓</div>
    </div>`).join('');
}
function togglePoem(i){
  const el=document.getElementById('pc'+i);
  const pr=document.getElementById('pr'+i);
  el.classList.toggle('expanded');
  pr.textContent=el.classList.contains('expanded')?'Close ↑':'Read more ↓';
}

const tracks=[
  {title:"Ar Hyd y Nos",sub:"All Through the Night",tag:"Welsh Traditional"},
  {title:"The Water is Wide",sub:"Caledonian folk ballad",tag:"Scottish"},
  {title:"Bugeilio'r Gwenith Gwyn",sub:"Watching the White Wheat",tag:"Welsh Traditional"},
  {title:"Dòchas",sub:"Hope",tag:"Scottish Gaelic"},
  {title:"Ar Lan y Môr",sub:"By the Seashore",tag:"Welsh Traditional"},
  {title:"She Moved Through the Fair",sub:"County Down air",tag:"Irish Traditional"},
];
let playing=-1,progress=0,timer=null;
function renderMusic(){
  document.getElementById('mus-list').innerHTML=tracks.map((t,i)=>`
    <div class="mitem" id="mt${i}" onclick="playTrack(${i})">
      <div class="micon" id="mi${i}"><i class="ti ti-player-play" aria-hidden="true"></i></div>
      <div class="minfo">
        <div class="mtitle">${t.title}</div>
        <div class="msub">${t.sub}</div>
      </div>
      <div class="mbadge">${t.tag}</div>
    </div>`).join('');
}
function playTrack(i){
  if(playing===i){
    clearInterval(timer);playing=-1;progress=0;
    document.getElementById('mi'+i).innerHTML='<i class="ti ti-player-play" aria-hidden="true"></i>';
    document.getElementById('mt'+i).classList.remove('playing');
    document.getElementById('mbar').classList.remove('active');
    document.getElementById('mfill').style.width='0%';
    return;
  }
  if(playing>=0){
    document.getElementById('mi'+playing).innerHTML='<i class="ti ti-player-play" aria-hidden="true"></i>';
    document.getElementById('mt'+playing).classList.remove('playing');
  }
  clearInterval(timer);
  playing=i;progress=0;
  document.getElementById('mi'+i).innerHTML='<i class="ti ti-player-pause" aria-hidden="true"></i>';
  document.getElementById('mt'+i).classList.add('playing');
  document.getElementById('mbar').classList.add('active');
  const fill=document.getElementById('mfill');
  fill.style.width='0%';
  timer=setInterval(()=>{
    progress+=0.5;fill.style.width=progress+'%';
    if(progress>=100){
      clearInterval(timer);
      document.getElementById('mi'+i).innerHTML='<i class="ti ti-player-play" aria-hidden="true"></i>';
      document.getElementById('mt'+i).classList.remove('playing');
      playing=-1;
    }
  },150);
}

let savedPoems=[];
function savePoem(){
  const title=document.getElementById('poem-title').value.trim()||'Untitled';
  const text=document.getElementById('poem-text').value.trim();
  if(!text){document.getElementById('wsave-msg').textContent='Write something first';setTimeout(()=>document.getElementById('wsave-msg').textContent='',2000);return;}
  savedPoems.push({title,text,id:Date.now()});
  renderSaved();
  document.getElementById('wsave-msg').textContent='Preserved ✦';
  setTimeout(()=>document.getElementById('wsave-msg').textContent='',2000);
}
function clearWrite(){document.getElementById('poem-text').value='';document.getElementById('poem-title').value='';}
function deletePoem(id){savedPoems=savedPoems.filter(p=>p.id!==id);renderSaved();}
function renderSaved(){
  const c=document.getElementById('saved-poems');
  c.innerHTML=savedPoems.length?savedPoems.map(p=>`
    <div class="saved-poem">
      <div class="saved-title-row">
        <span class="saved-name">${p.title}</span>
        <span class="saved-del" onclick="deletePoem(${p.id})">Remove</span>
      </div>
      <div class="saved-text">${p.text.replace(/\n/g,'<br>')}</div>
    </div>`).join(''):'';
}

    </div>`).join('');

function showSection(name){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('visible'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  document.getElementById('sec-'+name).classList.add('visible');
  const btns=[...document.querySelectorAll('.nb')];
  const labels={home:'Home',poems:'Poems',music:'Music',write:'Write',origins:'Origins'};
  btns.forEach(b=>{if(b.textContent===labels[name])b.classList.add('active');});
}
