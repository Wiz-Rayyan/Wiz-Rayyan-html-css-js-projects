  .card {

const starSVG = `<svg class="star-svg" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>`;

function buildCard(t, i) {
  const av = avatars[i % avatars.length];
  return `<div class="card">
    <div class="card-top">
      <div class="stars">${starSVG.repeat(5)}</div>
      <div class="verified"><div class="verified-dot"></div><span class="verified-text">Verified</span></div>

    <span class="quote-mark">"</span>

    <hr class="divider">
    <div class="person">
      <div class="avatar" style="background:${av.bg};color:${av.color}">${t.initials}</div>
      <div>
        <div class="person-name">${t.name}</div>
        <div class="person-role">${t.role}</div>
      </div>
      <div class="company-badge">${t.company}</div>
    </div>
  </div>`;
}

function buildRow(data, direction, id) {
  const cards = data.map((t, i) => buildCard(t, i)).join('');
  const track = document.createElement('div');
  track.className = `marquee-track ${direction}`;
  track.innerHTML = cards + cards;
  document.getElementById(id).appendChild(track);
}

buildRow(row1, 'go-left', 'row1');
buildRow(row2, 'go-right', 'row2');
