
<style>
  @keyframes breathe { 0%,100%{opacity:1} 50%{opacity:0.4} }
  @keyframes erode { 0%{clip-path:inset(0 0 0 0)} 100%{clip-path:inset(0 0 0 100%)} }
  @keyframes drift { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  @keyframes pulse-void { 0%,100%{r:52} 50%{r:56} }
  .letter-gap { display:inline-block; width:0.6em; }
  body { margin:0; }
</style>

<div style="padding:2.5rem 2rem; display:flex; flex-direction:column; gap:3rem;">

  <section style="text-align:center;">
    <p style="font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--color-text-tertiary); margin:0 0 1.5rem;">I. the hole that makes the circle</p>
    <svg width="100%" viewBox="0 0 680 200" role="img"><title>A circle defined by its hole</title><desc>Three concentric rings where the center is void, demonstrating that the circle is perceived through its absence at the core.</desc>
      <defs>
        <mask id="ring1"><rect width="680" height="200" fill="white"/><circle cx="340" cy="100" r="30" fill="black"/></mask>
        <mask id="ring2"><rect width="680" height="200" fill="white"/><circle cx="340" cy="100" r="52" fill="black"/></mask>
        <mask id="ring3"><rect width="680" height="200" fill="white"/><circle cx="340" cy="100" r="74" fill="black"/></mask>
      </defs>
      <circle cx="340" cy="100" r="78" fill="none" stroke="var(--color-text-tertiary)" stroke-width="0.5"/>
      <circle cx="340" cy="100" r="56" fill="none" stroke="var(--color-text-tertiary)" stroke-width="0.5"/>
      <circle cx="340" cy="100" r="34" fill="none" stroke="var(--color-text-tertiary)" stroke-width="0.5"/>
      <circle cx="340" cy="100" r="78" fill="var(--color-text-secondary)" opacity="0.07" mask="url(#ring3)"/>
      <circle cx="340" cy="100" r="56" fill="var(--color-text-secondary)" opacity="0.12" mask="url(#ring2)"/>
      <circle cx="340" cy="100" r="34" fill="var(--color-text-primary)" opacity="0.18" mask="url(#ring1)"/>
      <circle cx="340" cy="100" r="30" fill="none" stroke="var(--color-text-primary)" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.3"/>
      <text x="340" y="104" text-anchor="middle" class="ts" opacity="0.35">void</text>
      <text x="230" y="104" text-anchor="middle" class="ts" opacity="0.5">presence</text>
      <text x="450" y="104" text-anchor="middle" class="ts" opacity="0.5">presence</text>
    </svg>
  </section>

  <section style="text-align:center;">
    <p style="font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--color-text-tertiary); margin:0 0 1.5rem;">II. words with missing letters</p>
    <div style="font-size:2.2rem; font-weight:500; letter-spacing:0.18em; color:var(--color-text-primary); line-height:1.6; font-family:var(--font-mono);">
      <div>P<span class="letter-gap" style="border-bottom:1.5px solid var(--color-text-tertiary); opacity:0.3;">&nbsp;</span>E<span class="letter-gap" style="border-bottom:1.5px solid var(--color-text-tertiary); opacity:0.3;">&nbsp;</span>E<span class="letter-gap" style="border-bottom:1.5px solid var(--color-text-tertiary); opacity:0.3;">&nbsp;</span>N<span class="letter-gap" style="border-bottom:1.5px solid var(--color-text-tertiary); opacity:0.3;">&nbsp;</span>E</div>
      <div style="font-size:0.9rem; color:var(--color-text-tertiary); font-weight:400; letter-spacing:0.06em; margin-top:0.4rem; font-family:var(--font-sans);">the missing letters are felt</div>
    </div>
    <div style="margin-top:1.5rem; display:flex; justify-content:center; gap:2.5rem; flex-wrap:wrap;">
      <div style="font-size:1.5rem; font-family:var(--font-mono); font-weight:500; color:var(--color-text-primary);">
        S<span style="display:inline-block;width:0.6em;border-bottom:1px solid var(--color-text-tertiary);opacity:0.35;">&nbsp;</span>LE<span style="display:inline-block;width:0.6em;border-bottom:1px solid var(--color-text-tertiary);opacity:0.35;">&nbsp;</span>CE
      </div>
      <div style="font-size:1.5rem; font-family:var(--font-mono); font-weight:500; color:var(--color-text-primary);">
        <span style="display:inline-block;width:0.6em;border-bottom:1px solid var(--color-text-tertiary);opacity:0.35;">&nbsp;</span>MO<span style="display:inline-block;width:0.6em;border-bottom:1px solid var(--color-text-tertiary);opacity:0.35;">&nbsp;</span>Y
      </div>
      <div style="font-size:1.5rem; font-family:var(--font-mono); font-weight:500; color:var(--color-text-primary);">
        L<span style="display:inline-block;width:0.6em;border-bottom:1px solid var(--color-text-tertiary);opacity:0.35;">&nbsp;</span>SS
      </div>
    </div>
  </section>

  <section>
    <p style="font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--color-text-tertiary); margin:0 0 1.5rem; text-align:center;">III. the grid that isn't there</p>
    <svg width="100%" viewBox="0 0 680 180" role="img"><title>A grid defined by absence</title><desc>A regular grid of dots with several missing, where the eye fills in what should be there.</desc>
      <defs>
        <mask id="absent">
          <rect width="680" height="180" fill="white"/>
          <circle cx="204" cy="60" r="16" fill="black"/>
          <circle cx="272" cy="120" r="16" fill="black"/>
          <circle cx="408" cy="60" r="16" fill="black"/>
          <circle cx="340" cy="90" r="20" fill="black"/>
          <circle cx="476" cy="120" r="16" fill="black"/>
        </mask>
      </defs>
      <g mask="url(#absent)">
        <g opacity="0.22">
          <circle cx="136" cy="60" r="3" fill="var(--color-text-primary)"/>
          <circle cx="204" cy="60" r="3" fill="var(--color-text-primary)"/>
          <circle cx="272" cy="60" r="3" fill="var(--color-text-primary)"/>
          <circle cx="340" cy="60" r="3" fill="var(--color-text-primary)"/>
          <circle cx="408" cy="60" r="3" fill="var(--color-text-primary)"/>
          <circle cx="476" cy="60" r="3" fill="var(--color-text-primary)"/>
          <circle cx="544" cy="60" r="3" fill="var(--color-text-primary)"/>
          <circle cx="136" cy="90" r="3" fill="var(--color-text-primary)"/>
          <circle cx="204" cy="90" r="3" fill="var(--color-text-primary)"/>
          <circle cx="272" cy="90" r="3" fill="var(--color-text-primary)"/>
          <circle cx="340" cy="90" r="3" fill="var(--color-text-primary)"/>
          <circle cx="408" cy="90" r="3" fill="var(--color-text-primary)"/>
          <circle cx="476" cy="90" r="3" fill="var(--color-text-primary)"/>
          <circle cx="544" cy="90" r="3" fill="var(--color-text-primary)"/>
          <circle cx="136" cy="120" r="3" fill="var(--color-text-primary)"/>
          <circle cx="204" cy="120" r="3" fill="var(--color-text-primary)"/>
          <circle cx="272" cy="120" r="3" fill="var(--color-text-primary)"/>
          <circle cx="340" cy="120" r="3" fill="var(--color-text-primary)"/>
          <circle cx="408" cy="120" r="3" fill="var(--color-text-primary)"/>
          <circle cx="476" cy="120" r="3" fill="var(--color-text-primary)"/>
          <circle cx="544" cy="120" r="3" fill="var(--color-text-primary)"/>
        </g>
      </g>
      <circle cx="204" cy="60" r="3" fill="none" stroke="var(--color-text-tertiary)" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.4"/>
      <circle cx="272" cy="120" r="3" fill="none" stroke="var(--color-text-tertiary)" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.4"/>
      <circle cx="408" cy="60" r="3" fill="none" stroke="var(--color-text-tertiary)" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.4"/>
      <circle cx="340" cy="90" r="3" fill="none" stroke="var(--color-text-tertiary)" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.4"/>
      <circle cx="476" cy="120" r="3" fill="none" stroke="var(--color-text-tertiary)" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.4"/>
      <text x="340" y="170" text-anchor="middle" class="ts" opacity="0.35">your eye fills the gaps</text>
    </svg>
  </section>

  <section>
    <p style="font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--color-text-tertiary); margin:0 0 1.5rem; text-align:center;">IV. figure carved from ground</p>
    <svg width="100%" viewBox="0 0 680 200" role="img"><title>A face in silhouette formed by surrounding void</title><desc>Two facing profiles create a vase shape in the negative space between them — a classic Rubin's vase illusion.</desc>
      <rect width="680" height="200" fill="var(--color-text-primary)" opacity="0.08" rx="4"/>
      <path d="
        M220 20
        C220 20 240 40 252 70
        C260 90 262 110 258 130
        C254 150 245 165 235 178
        L220 180
        L220 20Z
      " fill="var(--color-text-primary)" opacity="0.7"/>
      <path d="
        M460 20
        C460 20 440 40 428 70
        C420 90 418 110 422 130
        C426 150 435 165 445 178
        L460 180
        L460 20Z
      " fill="var(--color-text-primary)" opacity="0.7"/>
      <path d="M220 20 L460 20 L460 180 L220 180 Z" fill="none"/>
      <text x="340" y="107" text-anchor="middle" style="font-size:11px; fill:var(--color-text-primary); opacity:0.35; letter-spacing:0.1em;">face · vase · face</text>
    </svg>
  </section>

  <section style="text-align:center; padding-bottom:0.5rem;">
    <p style="font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--color-text-tertiary); margin:0 0 1rem;">V. the statement</p>
    <div style="font-size:1.1rem; color:var(--color-text-secondary); line-height:2; letter-spacing:0.04em;">
      what is <span style="color:var(--color-text-primary); font-weight:500;">here</span> &nbsp;is shaped by what is 
      <span style="display:inline-block; width:3.5em; border-bottom:1px solid var(--color-text-primary); vertical-align:baseline; opacity:0.4;">&nbsp;</span>
    </div>
    <div style="margin-top:1rem; font-size:0.8rem; color:var(--color-text-tertiary); letter-spacing:0.08em; font-family:var(--font-mono);">
      the blank is the word
    </div>
  </section>

</div>
