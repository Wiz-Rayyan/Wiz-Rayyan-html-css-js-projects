<!DOCTYPE html>
<style>
  @keyframes aurora {
    0%   { background-position: 0% 50%; }
    25%  { background-position: 100% 0%; }
    50%  { background-position: 100% 100%; }
    75%  { background-position: 0% 100%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes drift1 {
    0%, 100% { transform: translate(0px, 0px) scale(1); }
    33%       { transform: translate(30px, -20px) scale(1.05); }
    66%       { transform: translate(-20px, 15px) scale(0.97); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translate(0px, 0px) scale(1); }
    33%       { transform: translate(-25px, 20px) scale(1.03); }
    66%       { transform: translate(20px, -10px) scale(1.06); }
  }
  @keyframes drift3 {
    0%, 100% { transform: translate(0px, 0px) scale(1); }
    50%       { transform: translate(15px, 25px) scale(1.04); }
  }
  @keyframes glow-pulse {
    0%, 100% { opacity: 0.6; }
    50%       { opacity: 1; }
  }
  @keyframes float-card {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-6px); }
  }
  @keyframes float-card2 {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-8px); }
  }
  @keyframes float-card3 {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-5px); }
  }

  .aurora-wrap {
    position: relative;
    width: 100%;
    min-height: 580px;
    border-radius: 20px;
    overflow: hidden;
    background: #050815;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    box-sizing: border-box;
  }

  .bg-gradient {
    position: absolute;
    inset: -60px;
    background: 
      radial-gradient(ellipse 80% 60% at 20% 30%, #00e5ff88 0%, transparent 60%),
      radial-gradient(ellipse 70% 70% at 80% 70%, #e040fb88 0%, transparent 60%),
      radial-gradient(ellipse 90% 50% at 50% 90%, #ffea0060 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 70% 10%, #00e5ff44 0%, transparent 55%),
      radial-gradient(ellipse 50% 60% at 10% 80%, #e040fb44 0%, transparent 55%),
      #050815;
    background-size: 300% 300%;
    animation: aurora 12s ease-in-out infinite;
    filter: blur(2px);
  }

  .orb1 {
    position: absolute;
    width: 380px; height: 380px;
    border-radius: 50%;
    background: radial-gradient(circle, #00e5ff55 0%, transparent 70%);
    top: -80px; left: -60px;
    animation: drift1 18s ease-in-out infinite;
  }
  .orb2 {
    position: absolute;
    width: 320px; height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, #e040fb55 0%, transparent 70%);
    bottom: -60px; right: -40px;
    animation: drift2 22s ease-in-out infinite;
  }
  .orb3 {
    position: absolute;
    width: 260px; height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffea0044 0%, transparent 70%);
    bottom: 30px; left: 20%;
    animation: drift3 15s ease-in-out infinite;
  }

  .hero-text {
    position: relative;
    z-index: 2;
    text-align: center;
    margin-bottom: 36px;
  }
  .hero-label {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #00e5ff;
    background: rgba(0, 229, 255, 0.1);
    border: 1px solid rgba(0, 229, 255, 0.25);
    border-radius: 100px;
    padding: 4px 14px;
    margin-bottom: 16px;
    text-shadow: 0 0 12px #00e5ffaa;
    animation: glow-pulse 3s ease-in-out infinite;
  }
  .hero-title {
    font-size: 36px;
    font-weight: 600;
    color: #ffffff;
    margin: 0 0 10px;
    line-height: 1.15;
    text-shadow: 0 0 40px rgba(0,229,255,0.4), 0 0 80px rgba(224,64,251,0.2);
    letter-spacing: -0.5px;
  }
  .hero-sub {
    font-size: 15px;
    color: rgba(255,255,255,0.6);
    margin: 0;
    text-shadow: 0 0 20px rgba(255,255,255,0.15);
  }

  .cards-row {
    position: relative;
    z-index: 2;
    display: flex;
    gap: 16px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 640px;
  }

  .glass-card {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 22px 20px;
    color: #ffffff;
    flex: 1;
    min-width: 160px;
    max-width: 196px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
    transition: box-shadow 0.3s, border-color 0.3s;
  }
  .glass-card:hover {
    border-color: rgba(255,255,255,0.38);
    box-shadow: 0 12px 48px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.22);
  }
  .glass-card.c1 { animation: float-card 6s ease-in-out infinite; }
  .glass-card.c2 { animation: float-card2 7s ease-in-out infinite 0.8s; }
  .glass-card.c3 { animation: float-card3 5.5s ease-in-out infinite 1.6s; }

  .card-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    margin-bottom: 14px;
  }
  .icon-cyan  { background: rgba(0,229,255,0.18); box-shadow: 0 0 16px rgba(0,229,255,0.3); }
  .icon-pink  { background: rgba(224,64,251,0.18); box-shadow: 0 0 16px rgba(224,64,251,0.3); }
  .icon-gold  { background: rgba(255,234,0,0.15);  box-shadow: 0 0 16px rgba(255,234,0,0.25); }

  .card-title {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    margin: 0 0 5px;
    text-shadow: 0 0 20px rgba(255,255,255,0.3);
  }
  .card-desc {
    font-size: 12px;
    color: rgba(255,255,255,0.55);
    margin: 0 0 16px;
    line-height: 1.5;
  }
  .card-stat {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 24px currentColor;
    margin: 0 0 2px;
  }
  .stat-cyan { color: #00e5ff; text-shadow: 0 0 20px #00e5ff; }
  .stat-pink { color: #e040fb; text-shadow: 0 0 20px #e040fb; }
  .stat-gold { color: #ffe57f; text-shadow: 0 0 20px #ffe57f; }
  .card-label {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .bottom-card {
    position: relative;
    z-index: 2;
    margin-top: 16px;
    width: 100%;
    max-width: 640px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 20px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.12);
    box-sizing: border-box;
  }
  .progress-track {
    flex: 1;
    height: 5px;
    background: rgba(255,255,255,0.12);
    border-radius: 100px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 68%;
    background: linear-gradient(90deg, #00e5ff, #e040fb);
    border-radius: 100px;
    box-shadow: 0 0 10px #00e5ffaa;
  }
  .progress-label { font-size: 12px; color: rgba(255,255,255,0.45); white-space: nowrap; }
  .progress-value { font-size: 14px; font-weight: 600; color: #fff; white-space: nowrap; text-shadow: 0 0 16px rgba(255,255,255,0.4); }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #00e5ff;
    box-shadow: 0 0 8px #00e5ff;
    flex-shrink: 0;
    animation: glow-pulse 2s ease-in-out infinite;
  }
</style>

<div class="aurora-wrap">
  <div class="bg-gradient"></div>
  <div class="orb1"></div>
  <div class="orb2"></div>
  <div class="orb3"></div>

  <div class="hero-text">
    <div class="hero-label">Aurora Glass UI</div>
    <h1 class="hero-title">Light from the north</h1>
    <p class="hero-sub">Glassmorphism over a living, breathing gradient</p>
  </div>

  <div class="cards-row">
    <div class="glass-card c1">
      <div class="card-icon icon-cyan">🌐</div>
      <p class="card-title">Network</p>
      <p class="card-desc">Real-time signal across all nodes</p>
      <p class="card-stat stat-cyan">98.4%</p>
      <p class="card-label">Uptime</p>
    </div>

    <div class="glass-card c2">
      <div class="card-icon icon-pink">⚡</div>
      <p class="card-title">Energy</p>
      <p class="card-desc">Aurora power throughput live</p>
      <p class="card-stat stat-pink">4.2 TW</p>
      <p class="card-label">Capacity</p>
    </div>

    <div class="glass-card c3">
      <div class="card-icon icon-gold">✦</div>
      <p class="card-title">Signals</p>
      <p class="card-desc">Particles detected this cycle</p>
      <p class="card-stat stat-gold">128k</p>
      <p class="card-label">Events</p>
    </div>
  </div>

  <div class="bottom-card">
    <div class="dot"></div>
    <span class="progress-label">System sync</span>
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
    <span class="progress-value">68%</span>
  </div>
</div>
