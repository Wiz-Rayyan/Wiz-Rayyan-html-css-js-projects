<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Selectable matrix grid where you can click cells to mark preferences across rows and columns, with row and column highlighting on hover</h2>
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
  <p style="font-size:14px; color:var(--text-secondary); margin:0;" id="count-label">0 of 25 selected</p>
  <div style="display:flex; gap:8px;">
    <button id="select-all-btn">Select all</button>
    <button id="deselect-btn">Deselect all</button>
  </div>
</div>

<div id="grid-wrap" style="overflow-x:auto;">
<div id="matrix" style="display:grid; grid-template-columns: 140px repeat(5, 1fr); min-width:560px;">
</div>
</div>

<style>
.mx-cell {
  aspect-ratio: 1;
  min-height: 40px;
  border: 0.5px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  background: var(--surface-2);
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
}
.mx-cell.selected {
  background: var(--bg-accent);
  border-color: var(--border-accent);
}
.mx-cell.selected i {
  color: var(--text-accent);
}
.mx-cell.hl-row, .mx-cell.hl-col {
  background: var(--surface-1);
}
.mx-cell.selected.hl-row, .mx-cell.selected.hl-col {
  background: var(--bg-accent);
}
.mx-rowhead, .mx-colhead {
  font-size: 13px;
  color: var(--text-secondary);
  display:flex; align-items:center;
  padding: 6px 10px;
}
.mx-colhead {
  justify-content:center;
  text-align:center;
  font-weight:500;
  color: var(--text-primary);
  border-bottom: 0.5px solid var(--border);
}
.mx-rowhead {
  border-right: 0.5px solid var(--border);
}
.mx-rowhead.hl-row, .mx-colhead.hl-col {
  background: var(--surface-1);
  color: var(--text-primary);
}
.mx-corner { border-bottom: 0.5px solid var(--border); border-right: 0.5px solid var(--border); }
@keyframes pulse-btn {
  0% { transform: scale(1); }
  40% { transform: scale(1.05); background: var(--bg-accent); border-color: var(--border-accent); color: var(--text-accent); }
  100% { transform: scale(1); }
}
.pulse { animation: pulse-btn 0.4s ease; }
.fade-out { animation: fadeOut 0.3s ease forwards; }
@keyframes fadeOut {
  from { opacity: 1; }
  to { opacity: 0.001; }
}
</style>

<script>
(function(){
  const rows = ["Real-time sync", "Offline mode", "API access", "Custom roles", "Audit log"];
  const cols = ["Free", "Starter", "Team", "Business", "Enterprise"];
  const grid = document.getElementById('matrix');
  const countLabel = document.getElementById('count-label');
  const total = rows.length * cols.length;
  const selected = new Set();

  const corner = document.createElement('div');
  corner.className = 'mx-corner';
  grid.appendChild(corner);

  cols.forEach((c, ci) => {
    const h = document.createElement('div');
    h.className = 'mx-colhead';
    h.textContent = c;
    h.dataset.col = ci;
    grid.appendChild(h);
  });

  rows.forEach((r, ri) => {
    const h = document.createElement('div');
    h.className = 'mx-rowhead';
    h.textContent = r;
    h.dataset.row = ri;
    grid.appendChild(h);

    cols.forEach((c, ci) => {
      const cell = document.createElement('div');
      cell.className = 'mx-cell';
      cell.dataset.row = ri;
      cell.dataset.col = ci;
      cell.setAttribute('role', 'button');
      cell.setAttribute('aria-label', r + ' - ' + c);
      cell.innerHTML = '<i class="ti ti-check" aria-hidden="true" style="font-size:16px; opacity:0; transition:opacity 0.15s;"></i>';
      cell.addEventListener('click', () => toggleCell(cell));
      cell.addEventListener('mouseenter', () => setHighlight(ri, ci, true));
      cell.addEventListener('mouseleave', () => setHighlight(ri, ci, false));
      grid.appendChild(cell);
    });
  });

  function key(r,c){ return r + '-' + c; }

  function toggleCell(cell){
    const r = cell.dataset.row, c = cell.dataset.col;
    const k = key(r,c);
    if (selected.has(k)) {
      selected.delete(k);
      cell.classList.remove('selected');
      cell.querySelector('i').style.opacity = 0;
    } else {
      selected.add(k);
      cell.classList.add('selected');
      cell.querySelector('i').style.opacity = 1;
    }
    updateCount();
  }

  function setHighlight(r, c, on){
    document.querySelectorAll('.mx-cell[data-row="'+r+'"]').forEach(el => el.classList.toggle('hl-row', on));
    document.querySelectorAll('.mx-cell[data-col="'+c+'"]').forEach(el => el.classList.toggle('hl-col', on));
    const rh = document.querySelector('.mx-rowhead[data-row="'+r+'"]');
    const ch = document.querySelector('.mx-colhead[data-col="'+c+'"]');
    if (rh) rh.classList.toggle('hl-row', on);
    if (ch) ch.classList.toggle('hl-col', on);
  }

  function updateCount(){
    countLabel.textContent = selected.size + ' of ' + total + ' selected';
  }

  document.getElementById('select-all-btn').addEventListener('click', (e) => {
    document.querySelectorAll('.mx-cell').forEach(cell => {
      const k = key(cell.dataset.row, cell.dataset.col);
      selected.add(k);
      cell.classList.add('selected');
      cell.querySelector('i').style.opacity = 1;
    });
    e.currentTarget.classList.remove('pulse');
    void e.currentTarget.offsetWidth;
    e.currentTarget.classList.add('pulse');
    updateCount();
  });

  document.getElementById('deselect-btn').addEventListener('click', () => {
    document.querySelectorAll('.mx-cell.selected').forEach(cell => {
      cell.classList.add('fade-out');
      setTimeout(() => {
        cell.classList.remove('selected', 'fade-out');
        cell.querySelector('i').style.opacity = 0;
      }, 280);
    });
    selected.clear();
    setTimeout(updateCount, 280);
  });
})();
</script>
