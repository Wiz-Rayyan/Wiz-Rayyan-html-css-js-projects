<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;}
body{overflow:hidden;background:transparent;}
#app{width:100%;height:560px;position:relative;overflow:hidden;background:var(--color-background-secondary);border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-tertiary);}
#viewport{width:100%;height:100%;overflow:hidden;position:relative;cursor:grab;}
#viewport.panning{cursor:grabbing;}
#canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;}
.grid-bg{position:absolute;top:0;left:0;width:4000px;height:4000px;background-image:radial-gradient(circle,var(--color-border-tertiary) 1px,transparent 1px);background-size:24px 24px;opacity:.7;}
.obj{position:absolute;border-radius:var(--border-radius-md);border:1.5px solid var(--color-border-tertiary);background:var(--color-background-primary);cursor:pointer;transition:border-color .12s,box-shadow .12s;padding:12px 14px;}
.obj:hover{border-color:var(--color-border-primary);}
.obj.selected{border-color:#378ADD;box-shadow:0 0 0 2px rgba(55,138,221,.25);}
.obj.dragging{opacity:.92;z-index:100;}
.obj-title{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px;}
.obj-sub{font-size:11px;color:var(--color-text-secondary);}
.card{width:160px;}
.sticky{width:140px;background:#FAEEDA;}
.sticky .obj-title,.sticky .obj-sub{color:#633806;}
.shape{width:96px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#E6F1FB;border-color:#B5D4F4;}
.shape span{font-size:12px;color:#0C447C;font-weight:500;}
.img-card{width:160px;height:100px;background:linear-gradient(135deg,#EEEDFE 0%,#E1F5EE 100%);display:flex;align-items:center;justify-content:center;}
.img-card span{font-size:11px;color:#534AB7;}
#box-select{position:absolute;border:1.5px dashed #378ADD;background:rgba(55,138,221,.07);pointer-events:none;display:none;z-index:200;}
#minimap{position:absolute;bottom:12px;right:12px;width:120px;height:80px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);overflow:hidden;}
#mm-bg{width:100%;height:100%;position:relative;}
.mm-obj{position:absolute;background:#B5D4F4;border-radius:2px;}
#mm-viewport{position:absolute;border:1.5px solid #378ADD;border-radius:2px;background:rgba(55,138,221,.08);}
#toolbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:6px 10px;align-items:center;}
.tbtn{font-size:11px;color:var(--color-text-secondary);padding:4px 10px;border-radius:6px;cursor:pointer;border:0.5px solid transparent;background:transparent;transition:background .1s,color .1s;}
.tbtn:hover{background:var(--color-background-secondary);color:var(--color-text-primary);}
.tbtn.active{background:var(--color-background-secondary);color:var(--color-text-primary);border-color:var(--color-border-secondary);}
#zoom-display{font-size:11px;color:var(--color-text-tertiary);padding:4px 8px;min-width:42px;text-align:center;}
#hint{position:absolute;bottom:104px;right:12px;font-size:11px;color:var(--color-text-tertiary);text-align:right;line-height:1.6;}
</style>

<div id="app" role="application" aria-label="Infinite canvas demo with zoom, pan, and draggable objects">
  <div id="viewport">
    <div id="canvas">
      <div class="grid-bg"></div>
    </div>
    <div id="box-select"></div>
  </div>
  <div id="toolbar">
    <span style="font-size:11px;color:var(--color-text-tertiary);">zoom</span>
    <button class="tbtn" id="btn-out" aria-label="Zoom out">−</button>
    <span id="zoom-display">100%</span>
    <button class="tbtn" id="btn-in" aria-label="Zoom in">+</button>
    <div style="width:0.5px;height:16px;background:var(--color-border-tertiary);margin:0 2px;"></div>
    <button class="tbtn" id="btn-fit">fit</button>
    <button class="tbtn" id="btn-reset">reset</button>
    <div style="width:0.5px;height:16px;background:var(--color-border-tertiary);margin:0 2px;"></div>
    <button class="tbtn active" id="btn-add">+ add card</button>
  </div>
  <div id="minimap" aria-hidden="true">
    <div id="mm-bg"><div id="mm-viewport"></div></div>
  </div>
  <div id="hint" aria-hidden="true">scroll to zoom<br>drag bg to pan<br>drag to move objects<br>drag empty → box select</div>
</div>

<script>
const CANVAS_W=4000,CANVAS_H=4000;
let scale=1,tx=-800,ty=-400,isPanning=false,isDragging=false,isBoxSelect=false;
let panStart={x:0,y:0},panOrigin={x:0,y:0};
let dragObj=null,dragOffset={x:0,y:0};
let boxStart={x:0,y:0};
let selected=new Set();
let objCounter=0;

const viewport=document.getElementById('viewport');
const canvas=document.getElementById('canvas');
const boxEl=document.getElementById('box-select');
const zoomDisplay=document.getElementById('zoom-display');

const OBJECTS=[
  {id:'c1',type:'card',x:900,y:500,title:'Design System',sub:'Components & tokens'},
  {id:'c2',type:'card',x:1120,y:640,title:'User Research',sub:'Interviews · Surveys'},
  {id:'c3',type:'card',x:900,y:780,title:'Prototype v2',sub:'Figma · last edited 2h ago'},
  {id:'s1',type:'sticky',x:1300,y:500,title:'💡 Key insight',sub:'Users want fewer clicks'},
  {id:'s2',type:'sticky',x:1300,y:660,title:'⚠ Blocker',sub:'API not ready yet'},
  {id:'sh1',type:'shape',x:1120,y:800,title:''},
  {id:'img1',type:'img',x:1500,y:500,title:''},
  {id:'c4',type:'card',x:1500,y:660,title:'Sprint Board',sub:'14 tasks · 3 in progress'},
];

function setTransform(){
  canvas.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;
  zoomDisplay.textContent=Math.round(scale*100)+'%';
  updateMinimap();
}

function clampTx(v){return Math.min(200,Math.max(-(CANVAS_W*scale-200),v));}
function clampTy(v){return Math.min(200,Math.max(-(CANVAS_H*scale-200),v));}

function screenToCanvas(sx,sy){
  const r=viewport.getBoundingClientRect();
  return {x:(sx-r.left-tx)/scale, y:(sy-r.top-ty)/scale};
}

function buildObjects(){
  OBJECTS.forEach(o=>createObjEl(o));
}

function createObjEl(o){
  const el=document.createElement('div');
  el.id=o.id;
  el.dataset.type=o.type;
  el.className='obj';
  el.style.left=o.x+'px';
  el.style.top=o.y+'px';
  if(o.type==='card') el.classList.add('card');
  if(o.type==='sticky') el.classList.add('sticky');
  if(o.type==='shape'){
    el.classList.add('shape');
    el.innerHTML='<span>Ellipse</span>';
  } else if(o.type==='img'){
    el.classList.add('img-card');
    el.innerHTML='<span><i class="ti ti-photo" style="font-size:18px;display:block;text-align:center;margin-bottom:4px"></i>Image asset</span>';
  } else {
    el.innerHTML=`<div class="obj-title">${o.title}</div><div class="obj-sub">${o.sub||''}</div>`;
  }
  canvas.appendChild(el);
}

function getObjPos(el){
  return {x:parseInt(el.style.left),y:parseInt(el.style.top)};
}

function selectObj(el,multi){
  if(!multi) clearSelection();
  el.classList.add('selected');
  selected.add(el.id);
}

function clearSelection(){
  selected.forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.classList.remove('selected');
  });
  selected.clear();
}

viewport.addEventListener('wheel',e=>{
  e.preventDefault();
  const factor=e.deltaY<0?1.08:1/1.08;
  const r=viewport.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const newScale=Math.min(4,Math.max(0.15,scale*factor));
  tx=clampTx(mx-(mx-tx)*(newScale/scale));
  ty=clampTy(my-(my-ty)*(newScale/scale));
  scale=newScale;
  setTransform();
},{passive:false});

viewport.addEventListener('mousedown',e=>{
  const objEl=e.target.closest('.obj');
  if(objEl){
    const c=screenToCanvas(e.clientX,e.clientY);
    const p=getObjPos(objEl);
    dragOffset={x:c.x-p.x,y:c.y-p.y};
    dragObj=objEl;
    isDragging=true;
    if(!selected.has(objEl.id)) selectObj(objEl,e.shiftKey);
    objEl.classList.add('dragging');
    e.stopPropagation();
    return;
  }
  if(e.button===0&&!e.shiftKey){
    const c=screenToCanvas(e.clientX,e.clientY);
    isBoxSelect=true;
    boxStart=c;
    const r=viewport.getBoundingClientRect();
    boxEl.style.left=(e.clientX-r.left)+'px';
    boxEl.style.top=(e.clientY-r.top)+'px';
    boxEl.style.width='0px'; boxEl.style.height='0px';
    boxEl.style.display='block';
    clearSelection();
  }
  isPanning=true;
  viewport.classList.add('panning');
  panStart={x:e.clientX,y:e.clientY};
  panOrigin={x:tx,y:ty};
});

window.addEventListener('mousemove',e=>{
  if(isDragging&&dragObj){
    const c=screenToCanvas(e.clientX,e.clientY);
    dragObj.style.left=(c.x-dragOffset.x)+'px';
    dragObj.style.top=(c.y-dragOffset.y)+'px';
    updateMinimap();
    return;
  }
  if(isBoxSelect){
    const c=screenToCanvas(e.clientX,e.clientY);
    const r=viewport.getBoundingClientRect();
    const sx=e.clientX-r.left, sy=e.clientY-r.top;
    const bsx=(boxStart.x*scale+tx), bsy=(boxStart.y*scale+ty);
    boxEl.style.left=Math.min(sx,bsx)+'px';
    boxEl.style.top=Math.min(sy,bsy)+'px';
    boxEl.style.width=Math.abs(sx-bsx)+'px';
    boxEl.style.height=Math.abs(sy-bsy)+'px';
    const x0=Math.min(c.x,boxStart.x), x1=Math.max(c.x,boxStart.x);
    const y0=Math.min(c.y,boxStart.y), y1=Math.max(c.y,boxStart.y);
    clearSelection();
    document.querySelectorAll('.obj').forEach(el=>{
      const p=getObjPos(el);
      const w=el.offsetWidth, h=el.offsetHeight;
      if(p.x<x1&&p.x+w>x0&&p.y<y1&&p.y+h>y0){
        el.classList.add('selected');
        selected.add(el.id);
      }
    });
    return;
  }
  if(isPanning){
    tx=clampTx(panOrigin.x+(e.clientX-panStart.x));
    ty=clampTy(panOrigin.y+(e.clientY-panStart.y));
    setTransform();
  }
});

window.addEventListener('mouseup',e=>{
  if(isDragging&&dragObj){
    dragObj.classList.remove('dragging');
    dragObj=null;
    isDragging=false;
  }
  if(isBoxSelect){
    boxEl.style.display='none';
    isBoxSelect=false;
  }
  isPanning=false;
  viewport.classList.remove('panning');
});

document.getElementById('btn-in').onclick=()=>{
  const cx=viewport.clientWidth/2, cy=viewport.clientHeight/2;
  const ns=Math.min(4,scale*1.2);
  tx=clampTx(cx-(cx-tx)*(ns/scale));
  ty=clampTy(cy-(cy-ty)*(ns/scale));
  scale=ns; setTransform();
};
document.getElementById('btn-out').onclick=()=>{
  const cx=viewport.clientWidth/2, cy=viewport.clientHeight/2;
  const ns=Math.max(.15,scale/1.2);
  tx=clampTx(cx-(cx-tx)*(ns/scale));
  ty=clampTy(cy-(cy-ty)*(ns/scale));
  scale=ns; setTransform();
};
document.getElementById('btn-fit').onclick=()=>{
  scale=0.7; tx=-400; ty=-150; setTransform();
};
document.getElementById('btn-reset').onclick=()=>{
  scale=1; tx=-800; ty=-400; setTransform();
};

let cardColors=['card','sticky'];
document.getElementById('btn-add').onclick=()=>{
  const c=screenToCanvas(viewport.clientWidth/2,viewport.clientHeight/2);
  objCounter++;
  const id='new'+objCounter;
  const o={id,type:'card',x:c.x-80,y:c.y-30,title:'New card '+objCounter,sub:'Click to edit'};
  OBJECTS.push(o);
  createObjEl(o);
  clearSelection();
  const el=document.getElementById(id);
  el.classList.add('selected');
  selected.add(id);
};

function updateMinimap(){
  const mm=document.getElementById('mm-bg');
  mm.querySelectorAll('.mm-obj').forEach(e=>e.remove());
  const sx=120/CANVAS_W, sy=80/CANVAS_H;
  document.querySelectorAll('.obj').forEach(el=>{
    const p=getObjPos(el);
    const d=document.createElement('div');
    d.className='mm-obj';
    d.style.left=(p.x*sx)+'px'; d.style.top=(p.y*sy)+'px';
    d.style.width=Math.max(6,el.offsetWidth*sx)+'px';
    d.style.height=Math.max(4,el.offsetHeight*sy)+'px';
    if(selected.has(el.id)) d.style.background='#378ADD';
    mm.appendChild(d);
  });
  const mmVp=document.getElementById('mm-viewport');
  const vw=viewport.clientWidth/scale, vh=viewport.clientHeight/scale;
  const cx=-tx/scale, cy=-ty/scale;
  mmVp.style.left=(cx*sx)+'px'; mmVp.style.top=(cy*sy)+'px';
  mmVp.style.width=(vw*sx)+'px'; mmVp.style.height=(vh*sy)+'px';
}

buildObjects();
setTransform();
</script>
