<style>
.map-wrap{position:relative;width:100%;height:480px;background:linear-gradient(160deg,#e8f0e8 0%,#dce8dc 100%);border-radius:var(--border-radius-lg);overflow:hidden;border:0.5px solid var(--color-border-tertiary);font-family:var(--font-sans)}
.road-h{position:absolute;background:#fff;opacity:0.55}
.road-v{position:absolute;background:#fff;opacity:0.55}
.block{position:absolute;background:#c8d8c4;border-radius:3px;opacity:0.6}
.marker-wrap{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:10}
.marker{width:22px;height:22px;border-radius:50%;background:#E24B4A;position:relative;z-index:2;transition:transform 0.2s,background 0.2s;box-shadow:0 2px 8px rgba(0,0,0,0.18)}
.marker.selected{background:#185FA5}
.pulse-ring{position:absolute;top:50%;left:50%;width:22px;height:22px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid #E24B4A;opacity:0;z-index:1}
.marker-wrap.active .pulse-ring{animation:pulse 1.5s ease-out infinite}
.marker-wrap.active .pulse-ring:nth-child(3){animation-delay:0.5s}
.marker-wrap.active .pulse-ring:nth-child(4){animation-delay:1s}
.pulse-ring.blue{border-color:#185FA5}
@keyframes pulse{0%{transform:translate(-50%,-50%) scale(1);opacity:0.6}100%{transform:translate(-50%,-50%) scale(3.5);opacity:0}}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.3)}70%{transform:scale(0.95)}100%{transform:scale(1)}}
@keyframes collapse{0%{transform:translate(-50%,-50%) scale(var(--s,2));opacity:var(--o,0.4)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.marker-wrap.bounce-anim .marker{animation:bounce 0.35s ease forwards}
.marker-wrap.collapse-anim .pulse-ring{animation:collapse 0.4s ease forwards!important}
.info-card{position:absolute;bottom:0;left:0;right:0;background:var(--color-background-primary);border-top:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg) var(--border-radius-lg) 0 0;padding:16px 20px 20px;transform:translateY(100%);transition:transform 0.32s cubic-bezier(0.34,1.2,0.64,1);z-index:20}
.info-card.visible{transform:translateY(0)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between}
.card-dot{width:10px;height:10px;border-radius:50%;background:#185FA5;margin-top:4px;flex-shrink:0}
.card-title{font-size:15px;font-weight:500;color:var(--color-text-primary);margin:0 0 2px}
.card-sub{font-size:13px;color:var(--color-text-secondary);margin:0}
.card-close{background:none;border:none;cursor:pointer;color:var(--color-text-secondary);font-size:18px;padding:0;line-height:1}
.card-pills{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pill{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--color-background-secondary);color:var(--color-text-secondary);border:0.5px solid var(--color-border-tertiary)}
.legend{position:absolute;top:12px;right:12px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:8px 12px;font-size:12px;color:var(--color-text-secondary);z-index:15;display:flex;flex-direction:column;gap:5px}
.legend-row{display:flex;align-items:center;gap:7px}
.dot-r{width:9px;height:9px;border-radius:50%;background:#E24B4A;flex-shrink:0}
.dot-b{width:9px;height:9px;border-radius:50%;background:#185FA5;flex-shrink:0}
</style>

<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Interactive map with pulsing location markers. Click a marker to select it and view its info card.</h2>

<div class="map-wrap" id="map">
  <div class="road-h" style="top:30%;left:0;right:0;height:14px"></div>
  <div class="road-h" style="top:58%;left:0;right:0;height:10px"></div>
  <div class="road-h" style="top:75%;left:0;right:0;height:7px"></div>
  <div class="road-v" style="left:22%;top:0;bottom:0;width:10px"></div>
  <div class="road-v" style="left:50%;top:0;bottom:0;width:14px"></div>
  <div class="road-v" style="left:74%;top:0;bottom:0;width:8px"></div>
  <div class="block" style="top:5%;left:5%;width:13%;height:18%"></div>
  <div class="block" style="top:5%;left:26%;width:18%;height:18%"></div>
  <div class="block" style="top:5%;left:55%;width:14%;height:18%"></div>
  <div class="block" style="top:5%;left:77%;width:18%;height:18%"></div>
  <div class="block" style="top:38%;left:5%;width:13%;height:14%"></div>
  <div class="block" style="top:38%;left:26%;width:18%;height:14%"></div>
  <div class="block" style="top:38%;left:55%;width:14%;height:14%"></div>
  <div class="block" style="top:38%;left:77%;width:14%;height:14%"></div>
  <div class="block" style="top:65%;left:5%;width:13%;height:18%"></div>
  <div class="block" style="top:65%;left:26%;width:18%;height:18%"></div>
  <div class="block" style="top:65%;left:55%;width:14%;height:18%"></div>
  <div class="block" style="top:65%;left:77%;width:14%;height:18%"></div>

  <div class="marker-wrap active" data-id="0" style="left:36%;top:22%">
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <div class="marker"></div>
  </div>
  <div class="marker-wrap active" data-id="1" style="left:62%;top:45%">
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <div class="marker"></div>
  </div>
  <div class="marker-wrap active" data-id="2" style="left:18%;top:66%">
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <div class="marker"></div>
  </div>
  <div class="marker-wrap active" data-id="3" style="left:80%;top:20%">
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <div class="marker"></div>
  </div>

  <div class="legend" aria-label="Map legend">
    <div class="legend-row"><div class="dot-r"></div><span>Available</span></div>
    <div class="legend-row"><div class="dot-b"></div><span>Selected</span></div>
  </div>

  <div class="info-card" id="info-card" role="region" aria-label="Location details" aria-live="polite">
    <div class="card-top">
      <div>
        <p class="card-title" id="card-title">Location</p>
        <p class="card-sub" id="card-sub">Details</p>
      </div>
      <button class="card-close" id="card-close" aria-label="Close info card"><i class="ti ti-x"></i></button>
    </div>
    <div class="card-pills" id="card-pills"></div>
  </div>
</div>

<script>
const data=[
  {name:"Riverside Café",sub:"0.3 km away · Open now",tags:["Coffee","WiFi","4.7 ★"]},
  {name:"Central Station",sub:"Transit hub · Pickup zone B",tags:["Train","Bus","Accessible"]},
  {name:"Westside Market",sub:"1.1 km away · Closes at 9 PM",tags:["Grocery","Organic","Parking"]},
  {name:"The North Gallery",sub:"0.6 km away · Free entry today",tags:["Art","Café","Events"]}
];
let selected=null;
const card=document.getElementById("info-card");
const cardTitle=document.getElementById("card-title");
const cardSub=document.getElementById("card-sub");
const cardPills=document.getElementById("card-pills");
document.getElementById("card-close").addEventListener("click",()=>{
  card.classList.remove("visible");
  if(selected!==null){
    const prev=document.querySelector('.marker-wrap[data-id="'+selected+'"]');
    if(prev){
      prev.querySelector(".marker").classList.remove("selected");
      prev.classList.add("active");
      const rings=prev.querySelectorAll(".pulse-ring");
      rings.forEach(r=>{r.classList.remove("blue");});
      restartPulse(prev);
    }
  }
  selected=null;
});
function restartPulse(wrap){
  const rings=wrap.querySelectorAll(".pulse-ring");
  rings.forEach((r,i)=>{
    r.style.animation="none";
    r.offsetWidth;
    r.style.animation="";
    r.style.animationDelay=(i*0.5)+"s";
  });
}
document.querySelectorAll(".marker-wrap").forEach(wrap=>{
  wrap.addEventListener("click",()=>{
    const id=parseInt(wrap.dataset.id);
    if(id===selected)return;
    if(selected!==null){
      const prev=document.querySelector('.marker-wrap[data-id="'+selected+'"]');
      if(prev){
        prev.querySelector(".marker").classList.remove("selected");
        prev.classList.add("active");
        const rings=prev.querySelectorAll(".pulse-ring");
        rings.forEach(r=>{r.classList.remove("blue");});
        restartPulse(prev);
      }
    }
    selected=id;
    wrap.classList.remove("active");
    wrap.classList.add("bounce-anim","collapse-anim");
    wrap.querySelector(".marker").classList.add("selected");
    const rings=wrap.querySelectorAll(".pulse-ring");
    rings.forEach(r=>r.classList.add("blue"));
    setTimeout(()=>{
      wrap.classList.remove("bounce-anim","collapse-anim");
    },450);
    const d=data[id];
    cardTitle.textContent=d.name;
    cardSub.textContent=d.sub;
    cardPills.innerHTML=d.tags.map(t=>'<span class="pill">'+t+'</span>').join("");
    card.classList.add("visible");
  });
});
</script>
