<style>
*{box-sizing:border-box;margin:0;padding:0}
.ts-section{background:#0A0A0F;padding:72px 0;overflow:hidden;font-family:var(--font-sans)}
.ts-eyebrow{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px}
.ts-pill{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#a78bfa;background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.25);padding:5px 14px;border-radius:100px}
.ts-heading{text-align:center;font-size:36px;font-weight:500;color:#fff;line-height:1.2;margin-bottom:8px}
.ts-sub{text-align:center;font-size:15px;color:rgba(255,255,255,.4);margin-bottom:52px}
.ts-fade-l,.ts-fade-r{position:absolute;top:0;bottom:0;width:120px;z-index:10;pointer-events:none}
.ts-fade-l{left:0;background:linear-gradient(to right,#0A0A0F,transparent)}
.ts-fade-r{right:0;background:linear-gradient(to left,#0A0A0F,transparent)}
.row-outer{overflow:hidden;margin-bottom:16px;position:relative}
.row-track{display:flex;gap:16px;width:max-content}
.row1 .row-track{animation:go-left 50s linear infinite}
.row2 .row-track{animation:go-right 75s linear infinite}
@keyframes go-left{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes go-right{0%{transform:translateX(-50%)}100%{transform:translateX(0)}}
.row-outer:hover .row-track{animation-play-state:paused}
.card{width:290px;flex-shrink:0;background:#13131A;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:22px;position:relative;transition:border-color .3s}
.card:hover{border-color:rgba(167,139,250,.4)}
.card-glow{position:absolute;top:0;left:0;right:0;height:1px;border-radius:16px 16px 0 0;background:linear-gradient(to right,transparent,rgba(167,139,250,.5),transparent);opacity:0;transition:opacity .3s}
.card:hover .card-glow{opacity:1}
.stars{display:flex;gap:2px;margin-bottom:14px}
.star{width:14px;height:14px;color:#F5A623;font-size:14px;line-height:1}
.quote-mark{font-size:48px;line-height:.6;color:rgba(167,139,250,.3);font-family:Georgia,serif;margin-bottom:4px;display:block}
.quote-text{font-size:13.5px;line-height:1.7;color:rgba(255,255,255,.75);margin-bottom:20px}
.divider{height:1px;background:rgba(255,255,255,.07);margin-bottom:18px}
.person{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0;border:1px solid rgba(255,255,255,.1)}
.person-name{font-size:14px;font-weight:500;color:#fff;margin-bottom:2px}
.person-role{font-size:12px;color:rgba(255,255,255,.4)}
.company-dot{display:inline-block;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.25);margin:0 5px;vertical-align:middle}
.ts-stat-bar{display:flex;justify-content:center;gap:40px;margin-top:52px;padding-top:40px;border-top:1px solid rgba(255,255,255,.06)}
.stat{text-align:center}
.stat-num{font-size:28px;font-weight:500;color:#fff}
.stat-num span{color:#a78bfa}
.stat-label{font-size:12px;color:rgba(255,255,255,.35);margin-top:4px;letter-spacing:.04em}
</style>

<div class="ts-section" role="region" aria-label="Customer testimonials">
  <h2 class="sr-only">Testimonials from customers worldwide</h2>

  <div class="ts-eyebrow"><span class="ts-pill">Wall of love</span></div>
  <p class="ts-heading">Trusted by the world's best teams</p>
  <p class="ts-sub">Real words from real people who actually use the product every day.</p>

  <div class="row-outer row1">
    <div class="ts-fade-l"></div>
    <div class="ts-fade-r"></div>
    <div class="row-track" id="row1"></div>
  </div>
  <div class="row-outer row2">
    <div class="ts-fade-l"></div>
    <div class="ts-fade-r"></div>
    <div class="row-track" id="row2"></div>
  </div>

  <div class="ts-stat-bar">
    <div class="stat"><div class="stat-num">12<span>k+</span></div><div class="stat-label">Happy customers</div></div>
    <div class="stat"><div class="stat-num">4.9<span>/5</span></div><div class="stat-label">Average rating</div></div>
    <div class="stat"><div class="stat-num">98<span>%</span></div><div class="stat-label">Would recommend</div></div>
    <div class="stat"><div class="stat-num">140<span>+</span></div><div class="stat-label">Countries</div></div>
  </div>
</div>

<script>
const avatarPalettes=[
  {bg:'rgba(99,102,241,.2)',border:'rgba(99,102,241,.4)',color:'#a5b4fc'},
  {bg:'rgba(20,184,166,.2)',border:'rgba(20,184,166,.4)',color:'#5eead4'},
  {bg:'rgba(245,158,11,.2)',border:'rgba(245,158,11,.4)',color:'#fcd34d'},
  {bg:'rgba(236,72,153,.2)',border:'rgba(236,72,153,.4)',color:'#f9a8d4'},
  {bg:'rgba(34,197,94,.2)',border:'rgba(34,197,94,.4)',color:'#86efac'},
  {bg:'rgba(239,68,68,.2)',border:'rgba(239,68,68,.4)',color:'#fca5a5'},
  {bg:'rgba(168,85,247,.2)',border:'rgba(168,85,247,.4)',color:'#d8b4fe'},
  {bg:'rgba(59,130,246,.2)',border:'rgba(59,130,246,.4)',color:'#93c5fd'},
];

const row1Data=[
  {quote:"Onboarding used to take two weeks. Now it's three days. The impact on our team has been extraordinary.",name:"Sarah Chen",role:"Head of Operations",company:"Lattice",initials:"SC"},
  {quote:"We replaced four separate tools with just this one. Workflow is cleaner, team is happier, clients notice.",name:"Marcus Webb",role:"Creative Director",company:"Studio Fold",initials:"MW"},
  {quote:"The analytics dashboard alone saved us countless hours of manual reporting every single month.",name:"Priya Anand",role:"Growth Lead",company:"Notion",initials:"PA"},
  {quote:"Finally a product that does exactly what it promises. No bloat, no hidden complexity — pure results.",name:"Tom Eriksen",role:"CTO",company:"Pave",initials:"TE"},
  {quote:"Our conversion rate jumped 34% in the first month. I wasn't expecting results this fast — genuinely shocked.",name:"Layla Hassan",role:"VP Marketing",company:"Webflow",initials:"LH"},
  {quote:"The support team is the best I've ever experienced. Fast, human, and remarkably knowledgeable.",name:"James Park",role:"Product Manager",company:"Linear",initials:"JP"},
  {quote:"We evaluated six competitors. This was the only one our entire team actually wanted to use daily.",name:"Nina Kovač",role:"Engineering Manager",company:"Vercel",initials:"NK"},
  {quote:"Integration took under an hour. The documentation is clear and the API is genuinely a pleasure to work with.",name:"Diego Reyes",role:"Senior Engineer",company:"Stripe",initials:"DR"},
];

const row2Data=[
  {quote:"This is the product I've been waiting five years for. It fits perfectly into how modern teams actually work.",name:"Anna Fischer",role:"COO",company:"Pitch",initials:"AF"},
  {quote:"Our churn dropped 22% after rolling this out. It's now irreplaceable to our retention strategy.",name:"Ben Okafor",role:"Customer Success",company:"Intercom",initials:"BO"},
  {quote:"Setup was genuinely painless. We were live in production the same afternoon we signed the contract.",name:"Mei Lin",role:"Tech Lead",company:"Figma",initials:"ML"},
  {quote:"ROI was visible within two weeks. Leadership was impressed and the team finally stopped complaining.",name:"Carlos Vega",role:"Director of Sales",company:"HubSpot",initials:"CV"},
  {quote:"I recommended this to three other founders last week alone. It's that good — no caveat.",name:"Rachel Kim",role:"Founder",company:"Campfire",initials:"RK"},
  {quote:"The design is thoughtful at every level. You can tell the team actually uses what they ship.",name:"Oliver Grant",role:"Design Lead",company:"Loom",initials:"OG"},
  {quote:"Scaled from 10 to 300 users without a single hiccup. The reliability has been outstanding throughout.",name:"Aisha Patel",role:"Platform Engineer",company:"Contentful",initials:"AP"},
  {quote:"Our data team cut reporting time in half. What used to take Monday mornings is now instant and automated.",name:"Finn Larsen",role:"Head of Data",company:"Amplitude",initials:"FL"},
];

function buildCard(d,i){
  const p=avatarPalettes[i%avatarPalettes.length];
  return`<div class="card">
    <div class="card-glow"></div>
    <div class="stars">${'<span class="star">★</span>'.repeat(5)}</div>
    <span class="quote-mark">"</span>
    <p class="quote-text">${d.quote}</p>
    <div class="divider"></div>
    <div class="person">
      <div class="avatar" style="background:${p.bg};border-color:${p.border};color:${p.color}">${d.initials}</div>
      <div>
        <p class="person-name">${d.name}</p>
        <p class="person-role">${d.role}<span class="company-dot"></span>${d.company}</p>
      </div>
    </div>
  </div>`;
}

function populate(id,data){
  const el=document.getElementById(id);
  const cards=data.map((d,i)=>buildCard(d,i)).join('');
  el.innerHTML=cards+cards;
}

populate('row1',row1Data);
populate('row2',row2Data);
</script>
