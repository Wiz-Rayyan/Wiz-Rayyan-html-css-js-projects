<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Instrument Panel — KPI Glow Cards</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }

  :root{
    --bg: #0A0D16;
    --bg-2: #0D111F;
    --surface: #12172A;
    --surface-2: #161C33;
    --hairline: rgba(232, 184, 75, 0.10);
    --text: #EEF0F8;
    --text-dim: #8B92AC;
    --text-faint: #565D78;
    --gold: #E8B84B;
    --amber: #FF8C5A;
    --emerald: #4FD8A0;
    --rose: #F2707A;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100%;
  }

  body{
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(232,184,75,0.06), transparent 60%),
      radial-gradient(900px 500px at 100% 10%, rgba(255,140,90,0.05), transparent 55%),
      var(--bg);
    padding: 56px 28px 80px;
  }

  .panel-head{
    max-width: 1080px;
    margin: 0 auto 40px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 22px;
  }

  .panel-head .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 10px;
  }

  .panel-head h1{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-optical-sizing: auto;
    font-size: clamp(26px, 3.4vw, 38px);
    margin: 0;
    letter-spacing: -0.01em;
  }

  .panel-head p{
    margin: 8px 0 0;
    color: var(--text-dim);
    font-size: 14px;
    max-width: 46ch;
  }

  .refresh-btn{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--bg);
    background: linear-gradient(135deg, var(--gold), var(--amber));
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 8px 24px -8px rgba(232,184,75,0.5);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .refresh-btn:hover{ transform: translateY(-1px); box-shadow: 0 10px 28px -6px rgba(232,184,75,0.65); }
  .refresh-btn:active{ transform: translateY(0px) scale(0.98); }
  .refresh-btn svg{ width:14px; height:14px; transition: transform 0.5s ease; }
  .refresh-btn.spinning svg{ transform: rotate(360deg); }

  .grid{
    max-width: 1080px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 22px;
  }

  /* ---------- KPI CARD ---------- */

  .kpi-card{
    position: relative;
    border-radius: 16px;
    padding: 2px;
    isolation: isolate;
    cursor: pointer;
    transform: translateZ(0);
  }

  .kpi-card::before{
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.5px;
    background: conic-gradient(from var(--angle),
      transparent 0%,
      var(--gold) 8%,
      var(--amber) 16%,
      transparent 30%,
      transparent 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: rotate-border 3.4s linear infinite;
    opacity: 0.65;
    transition: opacity 0.35s ease;
  }

  .kpi-card::after{
    content: '';
    position: absolute;
    inset: -18px;
    border-radius: 24px;
    background: conic-gradient(from var(--angle), transparent 0%, rgba(232,184,75,0.35) 8%, rgba(255,140,90,0.28) 16%, transparent 30%);
    filter: blur(18px);
    opacity: 0;
    transition: opacity 0.35s ease;
    z-index: -1;
    animation: rotate-border 3.4s linear infinite;
  }

  .kpi-card:hover::before{
    opacity: 1;
    animation-duration: 1.5s;
  }
  .kpi-card:hover::after{
    opacity: 0.9;
    animation-duration: 1.5s;
  }
  .kpi-card:hover .kpi-inner{
    transform: translateY(-2px);
    border-color: rgba(232,184,75,0.22);
  }

  @keyframes rotate-border{ to{ --angle: 360deg; } }

  .kpi-inner{
    position: relative;
    background: linear-gradient(180deg, var(--surface), var(--surface-2));
    border-radius: 15px;
    border: 1px solid var(--hairline);
    padding: 22px 22px 20px;
    height: 100%;
    transition: transform 0.3s ease, border-color 0.3s ease;
  }

  /* corner ticks — instrument panel motif */
  .kpi-inner::before, .kpi-inner::after{
    content:'';
    position:absolute;
    width: 9px; height: 9px;
    border: 1px solid rgba(232,184,75,0.35);
  }
  .kpi-inner::before{ top: 8px; left: 8px; border-right:none; border-bottom:none; border-radius: 3px 0 0 0;}
  .kpi-inner::after{ bottom: 8px; right: 8px; border-left:none; border-top:none; border-radius: 0 0 3px 0;}

  .kpi-top{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .kpi-eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .kpi-icon{
    width: 26px; height: 26px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(232,184,75,0.08);
    color: var(--gold);
  }
  .kpi-icon svg{ width: 14px; height: 14px; }

  .kpi-value-row{
    display:flex;
    align-items: baseline;
    gap: 2px;
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: 32px;
    line-height: 1;
    letter-spacing: -0.01em;
    min-height: 38px;
    perspective: 240px;
  }

  .flip-char{
    display: inline-block;
    transform-style: preserve-3d;
    will-change: transform;
  }
  .flip-char.flipping{
    animation: flip-char 0.5s cubic-bezier(.4,.1,.3,1);
  }
  @keyframes flip-char{
    0%{ transform: rotateX(0deg); }
    48%{ transform: rotateX(-95deg); }
    52%{ transform: rotateX(95deg); }
    100%{ transform: rotateX(0deg); }
  }

  .kpi-bottom{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-top: 16px;
  }

  .kpi-delta{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 20px;
  }
  .kpi-delta.up{ color: var(--emerald); background: rgba(79,216,160,0.10); }
  .kpi-delta.down{ color: var(--rose); background: rgba(242,112,122,0.10); }
  .kpi-delta svg{ width: 10px; height: 10px; }

  .sparkline{ width: 74px; height: 26px; opacity: 0.85; }

  /* ---------- MODAL ---------- */

  .modal-overlay{
    position: fixed; inset: 0;
    background: rgba(6,7,13,0.72);
    backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    padding: 20px;
  }
  .modal-overlay.open{ opacity: 1; pointer-events: all; }

  .modal-card{
    position: relative;
    width: 100%;
    max-width: 480px;
    border-radius: 20px;
    padding: 2px;
    transform: scale(0.94) translateY(8px);
    transition: transform 0.3s cubic-bezier(.2,.8,.3,1);
  }
  .modal-overlay.open .modal-card{ transform: scale(1) translateY(0); }

  .modal-card::before{
    content:'';
    position:absolute; inset:0;
    border-radius: inherit;
    padding: 1.5px;
    background: conic-gradient(from var(--angle), transparent 0%, var(--gold) 10%, var(--amber) 22%, transparent 40%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: rotate-border 2.6s linear infinite;
  }

  .modal-inner{
    background: linear-gradient(180deg, var(--surface), var(--bg-2));
    border-radius: 19px;
    border: 1px solid var(--hairline);
    padding: 30px 30px 26px;
  }

  .modal-close{
    position: absolute;
    top: 18px; right: 18px;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--hairline);
    background: rgba(255,255,255,0.03);
    color: var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .modal-close:hover{ color: var(--text); border-color: rgba(232,184,75,0.3); }

  .modal-eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }

  .modal-value-row{
    display:flex;
    align-items: baseline;
    gap: 2px;
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: 54px;
    line-height: 1;
    margin-bottom: 6px;
    perspective: 320px;
  }

  .modal-desc{
    color: var(--text-dim);
    font-size: 13.5px;
    line-height: 1.6;
    margin: 14px 0 22px;
    max-width: 44ch;
  }

  .modal-chart{ width: 100%; height: 100px; margin-bottom: 22px; }

  .modal-actions{
    display: flex;
    gap: 10px;
  }

  .btn-ghost{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--text);
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--hairline);
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-ghost:hover{ border-color: rgba(232,184,75,0.35); background: rgba(232,184,75,0.06); }

  @media (max-width: 480px){
    .kpi-value-row{ font-size: 26px; }
    .modal-value-row{ font-size: 40px; }
  }

  @media (prefers-reduced-motion: reduce){
    .kpi-card::before, .kpi-card::after, .modal-card::before{ animation: none; opacity: 0.5; }
    .flip-char.flipping{ animation: none; }
  }
</style>
</head>
<body>

<div class="panel-head">
  <div>
    <p class="eyebrow">Live · Board Overview</p>
    <h1>Executive Instrument Panel</h1>
    <p>Four gauges, one glance. Click any card for detail, or refresh to watch the figures turn.</p>
  </div>
  <button class="refresh-btn" id="refreshAll">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>
    Refresh figures
  </button>
</div>

<div class="grid" id="grid"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <div class="modal-inner">
      <button class="modal-close" id="modalClose">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <p class="modal-eyebrow" id="modalEyebrow">Revenue</p>
      <div class="modal-value-row" id="modalValue"></div>
      <span class="kpi-delta" id="modalDelta"></span>
      <p class="modal-desc" id="modalDesc"></p>
      <svg class="modal-chart" id="modalChart" viewBox="0 0 300 100" preserveAspectRatio="none"></svg>
      <div class="modal-actions">
        <button class="btn-ghost" id="modalSimulate">Simulate update</button>
      </div>
    </div>
  </div>
</div>

<script>
const iconPaths = {
  revenue: '<path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  conv: '<path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.1-3-3L7 13.6"/>',
  churn: '<path d="M3 3v18h18"/><path d="M18.7 17L13.6 11.9l-3 3L7 10.4"/>'
};

const cards = [
  {
    id: 'revenue',
    eyebrow: 'Monthly Revenue',
    icon: iconPaths.revenue,
    prefix: '$',
    value: 284920,
    format: n => n.toLocaleString('en-US'),
    delta: 12.4,
    good: 'up',
    desc: 'Recurring and one-time revenue recognized this billing cycle, across all regions and plans.',
    points: [20,35,28,42,38,55,50,68,60,78,72,88]
  },
  {
    id: 'users',
    eyebrow: 'Active Users',
    icon: iconPaths.users,
    prefix: '',
    value: 48204,
    format: n => n.toLocaleString('en-US'),
    delta: 3.1,
    good: 'up',
    desc: 'Unique accounts with at least one session in the trailing 30-day window.',
    points: [40,44,42,48,50,47,53,58,55,60,63,66]
  },
  {
    id: 'conv',
    eyebrow: 'Conversion Rate',
    icon: iconPaths.conv,
    prefix: '',
    suffix: '%',
    value: 4.82,
    decimals: 2,
    delta: -0.6,
    good: 'down',
    desc: 'Visitors who completed checkout as a share of total qualified sessions.',
    points: [60,58,62,55,57,50,52,46,48,44,45,40]
  },
  {
    id: 'churn',
    eyebrow: 'Churn Rate',
    icon: iconPaths.churn,
    prefix: '',
    suffix: '%',
    value: 1.24,
    decimals: 2,
    delta: -0.2,
    good: 'up',
    desc: 'Subscribers lost this month as a share of the active base at period start.',
    points: [70,66,68,60,58,54,50,48,44,42,40,36]
  }
];

function formatValue(card){
  const num = card.decimals ? card.value.toFixed(card.decimals) : card.format(Math.round(card.value));
  return (card.prefix||'') + num + (card.suffix||'');
}

function buildSparkPath(points, w, h){
  const max = Math.max(...points), min = Math.min(...points);
  const stepX = w / (points.length - 1);
  return points.map((p,i) => {
    const x = i * stepX;
    const y = h - ((p - min) / (max - min || 1)) * (h - 6) - 3;
    return (i===0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
}

function sparkSVG(points, isGood){
  const path = buildSparkPath(points, 74, 26);
  const color = isGood === 'up' ? 'var(--emerald)' : 'var(--rose)';
  return `<svg class="sparkline" viewBox="0 0 74 26"><path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function bigChartSVG(points, isGood){
  const path = buildSparkPath(points, 300, 90);
  const color = isGood === 'up' ? 'var(--emerald)' : 'var(--rose)';
  const areaPath = path + ` L300,100 L0,100 Z`;
  return `
    <defs>
      <linearGradient id="grad-${Math.random().toString(36).slice(2,8)}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${areaPath}" fill="${color}" opacity="0.12"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  `;
}

function deltaBadge(delta, good){
  const arrowUp = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  const arrowDown = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>';
  const arrow = delta >= 0 ? arrowUp : arrowDown;
  const cls = good;
  return `<span class="kpi-delta ${cls}">${arrow} ${Math.abs(delta).toFixed(1)}%</span>`;
}

// render initial cards
const grid = document.getElementById('grid');
cards.forEach(card => {
  const el = document.createElement('div');
  el.className = 'kpi-card';
  el.dataset.id = card.id;
  el.innerHTML = `
    <div class="kpi-inner">
      <div class="kpi-top">
        <span class="kpi-eyebrow">${card.eyebrow}</span>
        <span class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${card.icon}</svg></span>
      </div>
      <div class="kpi-value-row" id="val-${card.id}"></div>
      <div class="kpi-bottom">
        ${deltaBadge(card.delta, card.good)}
        <span class="spark-holder">${sparkSVG(card.points, card.good)}</span>
      </div>
    </div>
  `;
  grid.appendChild(el);
  renderChars(document.getElementById(`val-${card.id}`), formatValue(card), false);
});

function renderChars(container, text, animate, stagger=35){
  const oldText = container.dataset.current || '';
  container.dataset.current = text;
  container.innerHTML = '';
  text.split('').forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 'flip-char';
    span.textContent = animate && oldText[i] !== undefined ? oldText[i] : ch;
    container.appendChild(span);
    if(animate){
      setTimeout(() => {
        span.classList.add('flipping');
        setTimeout(() => { span.textContent = ch; }, 240);
        span.addEventListener('animationend', () => span.classList.remove('flipping'), { once: true });
      }, i * stagger);
    }
  });
}

function nudgeCard(card){
  const dir = Math.random() > 0.5 ? 1 : -1;
  const magnitude = card.value * (0.01 + Math.random() * 0.05);
  card.value = Math.max(0.01, card.value + dir * magnitude);
  card.delta = dir * (0.2 + Math.random() * 4);
  card.good = (card.id === 'churn') ? (dir < 0 ? 'up' : 'down') : (dir > 0 ? 'up' : 'down');
  card.points = card.points.slice(1).concat([card.points[card.points.length-1] + dir * (5 + Math.random()*10)]);
}

function updateCardDOM(card){
  const valEl = document.getElementById(`val-${card.id}`);
  renderChars(valEl, formatValue(card), true);
  const cardEl = document.querySelector(`.kpi-card[data-id="${card.id}"]`);
  const bottom = cardEl.querySelector('.kpi-bottom');
  bottom.innerHTML = `${deltaBadge(card.delta, card.good)}<span class="spark-holder">${sparkSVG(card.points, card.good)}</span>`;
}

document.getElementById('refreshAll').addEventListener('click', (e) => {
  const btn = e.currentTarget;
  btn.classList.add('spinning');
  setTimeout(() => btn.classList.remove('spinning'), 500);
  cards.forEach((card, idx) => {
    setTimeout(() => {
      nudgeCard(card);
      updateCardDOM(card);
      if(modalOverlay.classList.contains('open') && modalOverlay.dataset.id === card.id){
        populateModal(card);
      }
    }, idx * 90);
  });
});

// ---------- modal ----------
const modalOverlay = document.getElementById('modalOverlay');
const modalEyebrow = document.getElementById('modalEyebrow');
const modalValue = document.getElementById('modalValue');
const modalDelta = document.getElementById('modalDelta');
const modalDesc = document.getElementById('modalDesc');
const modalChart = document.getElementById('modalChart');
const modalSimulate = document.getElementById('modalSimulate');

function populateModal(card, animate=false){
  modalEyebrow.textContent = card.eyebrow;
  renderChars(modalValue, formatValue(card), animate, 45);
  modalDelta.outerHTML = deltaBadge(card.delta, card.good).replace('kpi-delta', 'kpi-delta').replace('<span', '<span id="modalDelta"');
  modalDesc.textContent = card.desc;
  modalChart.innerHTML = bigChartSVG(card.points, card.good);
}

grid.addEventListener('click', (e) => {
  const cardEl = e.target.closest('.kpi-card');
  if(!cardEl) return;
  const card = cards.find(c => c.id === cardEl.dataset.id);
  modalOverlay.dataset.id = card.id;
  populateModal(card);
  modalOverlay.classList.add('open');
});

function closeModal(){ modalOverlay.classList.remove('open'); }
document.getElementById('modalClose').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) closeModal(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeModal(); });

modalSimulate.addEventListener('click', () => {
  const card = cards.find(c => c.id === modalOverlay.dataset.id);
  nudgeCard(card);
  populateModal(card, true);
  updateCardDOM(card);
});
</script>

</body>
</html>
