
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .cabinet { font-family: 'Press Start 2P', monospace; background: #0a0a0a; min-height: 600px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 0; border-radius: 8px; }
  .marquee { width: 100%; max-width: 520px; background: linear-gradient(180deg, #FFD700 0%, #FF8C00 40%, #CC6600 100%); border: 6px outset #FFE066; border-radius: 8px 8px 0 0; padding: 14px 20px 10px; text-align: center; position: relative; box-shadow: inset 0 2px 0 rgba(255,255,255,0.5), inset 0 -3px 0 rgba(0,0,0,0.4); }
  .marquee-title { font-size: 22px; color: #000; text-shadow: 3px 3px 0 #FF4400, -1px -1px 0 #AA2200; letter-spacing: 2px; line-height: 1.3; }
  .marquee-sub { font-size: 7px; color: #330000; margin-top: 6px; letter-spacing: 3px; }
  .screen-bezel { width: 100%; max-width: 520px; background: #1a1a1a; border: 8px outset #666; border-top: none; border-bottom: none; padding: 12px; }
  .crt { width: 100%; border-radius: 20px; border: 6px inset #333; background: #000; overflow: hidden; position: relative; min-height: 320px; }
  .scanlines { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.25) 3px, rgba(0,0,0,0.25) 4px); pointer-events: none; z-index: 10; border-radius: 16px; }
  .crt-inner { padding: 18px 16px; position: relative; z-index: 1; }
  .score-header { display: flex; justify-content: space-between; font-size: 7px; color: #FF00FF; margin-bottom: 14px; }
  .score-val { color: #FFFF00; }
  .leaderboard-title { text-align: center; font-size: 9px; color: #00FFFF; margin-bottom: 12px; text-shadow: 0 0 6px #00FFFF88; animation: flicker 2.4s infinite; }
  @keyframes flicker { 0%,95%,100%{opacity:1} 96%{opacity:0.6} 97%{opacity:1} 98%{opacity:0.5} 99%{opacity:1} }
  .lb-row { display: grid; grid-template-columns: 28px 1fr auto; gap: 6px; align-items: center; font-size: 8px; padding: 5px 4px; border-bottom: 1px solid #1a1a1a; }
  .lb-row:nth-child(1) .lb-name { color: #FFD700; }
  .lb-row:nth-child(2) .lb-name { color: #C0C0C0; }
  .lb-row:nth-child(3) .lb-name { color: #CD7F32; }
  .lb-rank { color: #FF00FF; }
  .lb-name { color: #00FF88; }
  .lb-score { color: #FFFF00; }
  .attract { text-align: center; margin-top: 14px; font-size: 9px; color: #FF00FF; }
  .blink { animation: blink 1s step-end infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .pixel-sprite { display: inline-block; font-size: 18px; margin: 0 4px; }
  .cabinet-body { width: 100%; max-width: 520px; background: #151515; border: 8px outset #555; border-top: none; border-bottom: none; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
  .joystick-area { display: flex; gap: 12px; align-items: center; }
  .joystick { width: 28px; height: 28px; background: #222; border: 3px outset #777; border-radius: 50%; position: relative; cursor: pointer; }
  .joystick::after { content:''; position:absolute; top:50%;left:50%;transform:translate(-50%,-50%); width:10px;height:10px;background:#444;border-radius:50%; }
  .btn-cluster { display: grid; grid-template-columns: repeat(3,1fr); gap: 5px; }
  .abtn { width: 22px; height: 22px; border-radius: 50%; border: 2px outset #999; cursor: pointer; transition: filter .1s; }
  .abtn:hover { filter: brightness(1.4); }
  .abtn:active { border-style: inset; }
  .abtn.red { background: #FF2222; }
  .abtn.yellow { background: #FFDD00; }
  .abtn.blue { background: #2255FF; }
  .abtn.green { background: #00CC44; }
  .abtn.white { background: #DDDDDD; }
  .abtn.pink { background: #FF66CC; }
  .coin-slot-area { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .coin-slot { width: 44px; height: 8px; background: #0a0a0a; border: 2px inset #888; border-radius: 3px; }
  .coin-label { font-size: 5px; color: #888; letter-spacing: 1px; }
  .coin-counter { font-size: 7px; color: #FFFF00; margin-top: 2px; }
  .cabinet-base { width: 100%; max-width: 520px; background: #111; border: 8px outset #444; border-top: none; border-radius: 0 0 12px 12px; padding: 8px 16px; display: flex; justify-content: center; }
  .insert-coin { font-size: 8px; color: #FF00FF; }
  .score-flash { animation: scoreflash .4s ease; }
  @keyframes scoreflash { 0%{color:#FFFF00} 50%{color:#FF00FF} 100%{color:#FFFF00} }
  .alien1 { display:inline-block; width:12px; height:10px; background:#00FF88; clip-path:polygon(20% 0,80% 0,100% 40%,75% 60%,100% 80%,80% 100%,60% 80%,40% 80%,20% 100%,0 80%,25% 60%,0 40%); margin-bottom:2px; }
</style>

<div class="cabinet">
  <div class="marquee">
    <div class="marquee-title">PIXEL BLASTER</div>
    <div class="marquee-sub">▸ INSERT COIN TO PLAY ◂</div>
  </div>

  <div class="screen-bezel">
    <div class="crt">
      <div class="scanlines"></div>
      <div class="crt-inner">
        <div class="score-header">
          <span>1UP<br><span class="score-val" id="p1score">000800</span></span>
          <span style="color:#00FFFF;font-size:8px;text-align:center">HI-SCORE<br><span class="score-val" id="hiscore">048200</span></span>
          <span>2UP<br><span class="score-val">000000</span></span>
        </div>

        <div class="leaderboard-title">— HIGH SCORES —</div>

        <div id="lb">
          <div class="lb-row"><span class="lb-rank">1ST</span><span class="lb-name">ACE</span><span class="lb-score">048200</span></div>
          <div class="lb-row"><span class="lb-rank">2ND</span><span class="lb-name">ZAX</span><span class="lb-score">039500</span></div>
          <div class="lb-row"><span class="lb-rank">3RD</span><span class="lb-name">KAI</span><span class="lb-score">031750</span></div>
          <div class="lb-row"><span class="lb-rank">4TH</span><span class="lb-name">REX</span><span class="lb-score">027600</span></div>
          <div class="lb-row"><span class="lb-rank">5TH</span><span class="lb-name">VEX</span><span class="lb-score">019200</span></div>
        </div>

        <div class="attract">
          <div style="margin:10px 0 6px;">
            <span class="alien1"></span><span class="alien1"></span><span class="alien1"></span><span class="alien1"></span><span class="alien1"></span>
          </div>
          <div class="blink">▸ PRESS START ◂</div>
          <div style="font-size:6px;color:#888;margin-top:8px;">© 1984 PIXEL INDUSTRIES</div>
        </div>
      </div>
    </div>
  </div>

  <div class="cabinet-body">
    <div class="joystick-area">
      <div class="joystick" title="P1 Joystick"></div>
      <div style="font-size:5px;color:#555">P1</div>
    </div>

    <div class="coin-slot-area">
      <div class="coin-slot"></div>
      <div class="coin-label">COIN SLOT</div>
      <div class="coin-counter" id="coincount">CREDITS: 0</div>
      <button onclick="insertCoin()" style="font-family:'Press Start 2P',monospace;font-size:6px;background:#222;color:#FFDD00;border:2px outset #777;padding:5px 8px;cursor:pointer;margin-top:4px;">INSERT COIN</button>
    </div>

    <div>
      <div style="font-size:5px;color:#555;text-align:center;margin-bottom:4px">P1 FIRE</div>
      <div class="btn-cluster">
        <div class="abtn red" onclick="fireBtn(this,'#FF2222')"></div>
        <div class="abtn yellow" onclick="fireBtn(this,'#FFDD00')"></div>
        <div class="abtn blue" onclick="fireBtn(this,'#2255FF')"></div>
        <div class="abtn green" onclick="fireBtn(this,'#00CC44')"></div>
        <div class="abtn white" onclick="fireBtn(this,'#DDDDDD')"></div>
        <div class="abtn pink" onclick="fireBtn(this,'#FF66CC')"></div>
      </div>
    </div>
  </div>

  <div class="cabinet-base">
    <div class="insert-coin blink">★ INSERT COIN ★</div>
  </div>
</div>

<script>
let credits = 0;
let p1 = 800;
let hi = 48200;

function insertCoin() {
  credits++;
  document.getElementById('coincount').textContent = 'CREDITS: ' + credits;
  const slot = document.querySelector('.coin-slot');
  slot.style.background = '#FFDD00';
  setTimeout(() => slot.style.background = '#0a0a0a', 200);
  if (credits > 0) addPoints(100);
}

function addPoints(pts) {
  p1 += pts;
  const el = document.getElementById('p1score');
  el.textContent = String(p1).padStart(6,'0');
  el.classList.remove('score-flash');
  void el.offsetWidth;
  el.classList.add('score-flash');
  if (p1 > hi) {
    hi = p1;
    document.getElementById('hiscore').textContent = String(hi).padStart(6,'0');
    refreshLb();
  }
}

function refreshLb() {
  const rows = document.querySelectorAll('#lb .lb-score');
  if (rows[0]) rows[0].textContent = String(hi).padStart(6,'0');
}

function fireBtn(el, color) {
  el.style.boxShadow = '0 0 8px ' + color;
  setTimeout(() => el.style.boxShadow = '', 300);
  addPoints(Math.floor(Math.random()*500)+100);
}

let alienDir = 1;
setInterval(() => {
  const aliens = document.querySelectorAll('.alien1');
  aliens.forEach((a,i) => {
    const cur = parseInt(a.style.marginLeft||'0');
    a.style.marginLeft = (cur + alienDir*2) + 'px';
  });
  if (alienDir === 1 && parseInt(document.querySelector('.alien1').style.marginLeft||'0') > 20) alienDir = -1;
  if (alienDir === -1 && parseInt(document.querySelector('.alien1').style.marginLeft||'0') < -20) alienDir = 1;
}, 80);
</script>
