<h1>This is a webpage</h1>

<p>It has no design. The browser is doing everything you see right now. This is Times New Roman. This background is white because browsers decided white is the default background color in the 1990s and nobody changed it.</p>

<h2>What you are looking at</h2>

<p>This is unstyled HTML. There is no CSS anywhere on this page. No inline styles, no style tags, no external stylesheets, no JavaScript, no images, no framework, no build step. The font is whatever your browser defaults to. The margins are whatever your browser defaults to. The line height is whatever your browser defaults to.</p>

<p>This is the aesthetic of the early web. This is also the aesthetic of a page where the CSS failed to load. It is impossible to tell the difference and that is the point.</p>

<h2>Links</h2>

<p>Here is <a href="#">a link you have not visited</a>. It is blue. Here is <a href="" visited>a link you have visited</a>. It is purple. These colors have not changed since Mosaic in 1993. They exist because studies showed users could distinguish them. No designer chose them. They emerged from necessity and became permanent.</p>

<h2>Typography</h2>

<p>This is a paragraph. It is set in the browser default serif font, which is usually Times New Roman, which was designed in 1931 for The Times of London to fit more text per column inch. You are reading a newspaper font. There is no line-height set. There is no max-width set. On a wide monitor this line stretches across the entire viewport and becomes very difficult to read. That is not a bug. There is no designer to call it a bug.</p>

<p>These sizes were never agreed upon by a designer. They are browser conventions that became standards that became assumptions that became invisible.</p>
