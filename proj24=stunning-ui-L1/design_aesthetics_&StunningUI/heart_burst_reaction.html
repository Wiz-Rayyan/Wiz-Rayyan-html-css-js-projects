<style>
*{box-sizing:border-box;margin:0;padding:0}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;user-select:none;-webkit-user-select:none}
.media{width:100%;height:340px;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.photo-label{color:rgba(255,255,255,0.4);font-size:13px;font-family:var(--font-sans)}
.hint{color:rgba(255,255,255,0.25);font-size:12px;font-family:var(--font-sans)}
.ripple-hint{width:48px;height:48px;border:1.5px solid rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.3);font-size:20px}
.actions{display:flex;align-items:center;gap:16px;padding:12px 16px;border-bottom:0.5px solid var(--color-border-tertiary)}
.like-btn{background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--border-radius-md);transition:background 0.15s}
.like-btn:hover{background:var(--color-background-secondary)}
.like-icon{font-size:22px;transition:transform 0.15s;display:inline-block}
.like-icon.liked{filter:none}
.count{font-size:14px;font-weight:500;color:var(--color-text-primary);min-width:28px;display:inline-block}
.count.bounce{animation:countBounce 0.35s ease}
.meta{padding:12px 16px}
.meta p{font-size:13px;color:var(--color-text-secondary);line-height:1.5}
.meta strong{color:var(--color-text-primary);font-weight:500}

@keyframes countBounce{0%{transform:scale(1)}40%{transform:scale(1.4)}70%{transform:scale(0.9)}100%{transform:scale(1)}}

.heart-spawn{position:fixed;pointer-events:none;font-size:48px;z-index:9999;transform-origin:center;will-change:transform,opacity}
@keyframes heartFloat{0%{transform:scale(0) rotate(0deg);opacity:0}15%{transform:scale(1.6) rotate(-8deg);opacity:1}35%{transform:scale(1.2) rotate(5deg);opacity:1}100%{transform:scale(0.4) rotate(15deg) translateY(-110px);opacity:0}}

.particle{position:fixed;pointer-events:none;font-size:16px;z-index:9998;will-change:transform,opacity}
@keyframes particleBurst{0%{transform:translate(0,0) scale(0) rotate(0deg);opacity:1}20%{transform:translate(var(--tx),var(--ty)) scale(1.2) rotate(var(--rot));opacity:1}100%{transform:translate(calc(var(--tx)*2.2),calc(var(--ty)*2.2)) scale(0) rotate(calc(var(--rot)*2));opacity:0}}

.ripple{position:fixed;pointer-events:none;border-radius:50%;z-index:9997;border:2px solid rgba(255,100,130,0.6)}
@keyframes rippleOut{0%{width:0;height:0;opacity:0.8;margin-left:0;margin-top:0}100%{width:120px;height:120px;opacity:0;margin-left:-60px;margin-top:-60px}}
</style>

<h2 class="sr-only">Heart burst reaction demo — double-tap the image to like it</h2>

<div class="card" style="max-width:440px;margin:1.5rem auto">
  <div class="media" id="mediaArea">
    <div class="photo-overlay">
      <div class="ripple-hint">✦</div>
      <span class="photo-label">Double-tap to like</span>
      <span class="hint">or tap the ❤️ button below</span>
    </div>
  </div>
  <div class="actions">
    <button class="like-btn" id="likeBtn" aria-label="Like">
      <span class="like-icon" id="likeIcon">🤍</span>
      <span class="count" id="likeCount">1,284</span>
    </button>
    <button class="like-btn" aria-label="Comment" style="color:var(--color-text-secondary)">
      <i class="ti ti-message-circle" style="font-size:22px" aria-hidden="true"></i>
      <span style="font-size:14px;color:var(--color-text-secondary)">47</span>
    </button>
    <button class="like-btn" aria-label="Share" style="margin-left:auto;color:var(--color-text-secondary)">
      <i class="ti ti-send" style="font-size:20px" aria-hidden="true"></i>
    </button>
  </div>
  <div class="meta">
    <p><strong>aurora.visuals</strong> golden hour somewhere over the Arabian Sea 🌊</p>
  </div>
</div>

<script>
const media = document.getElementById('mediaArea');
const likeBtn = document.getElementById('likeBtn');
const likeIcon = document.getElementById('likeIcon');
const likeCountEl = document.getElementById('likeCount');

let liked = false;
let count = 1284;
let lastTap = 0;
let tapTimer = null;

function formatCount(n){return n>=1000?(n/1000).toFixed(n%1000<100?1:0)+'k':n.toString()}

function spawnHeart(x,y){
  const h = document.createElement('div');
  h.className='heart-spawn';
  h.textContent='❤️';
  h.style.left=(x-24)+'px';
  h.style.top=(y-24)+'px';
  h.style.animation='heartFloat 0.9s cubic-bezier(0.23,1,0.32,1) forwards';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),950);

  const angles=[0,45,90,135,180,225,270,315];
  angles.forEach((angle,i)=>{
    const rad=angle*Math.PI/180;
    const dist=55+Math.random()*25;
    const tx=Math.round(Math.cos(rad)*dist);
    const ty=Math.round(Math.sin(rad)*dist);
    const rot=Math.round(-30+Math.random()*60);
    const p=document.createElement('div');
    p.className='particle';
    p.textContent='❤️';
    p.style.left=(x-8)+'px';
    p.style.top=(y-8)+'px';
    p.style.setProperty('--tx',tx+'px');
    p.style.setProperty('--ty',ty+'px');
    p.style.setProperty('--rot',rot+'deg');
    p.style.animationDelay=(i*18)+'ms';
    p.style.animation=`particleBurst 0.75s ease-out ${i*18}ms forwards`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),800);
  });

  const rip=document.createElement('div');
  rip.className='ripple';
  rip.style.left=x+'px';
  rip.style.top=y+'px';
  rip.style.animation='rippleOut 0.6s ease-out forwards';
  document.body.appendChild(rip);
  setTimeout(()=>rip.remove(),650);

  if(navigator.vibrate)navigator.vibrate(30);
}

function triggerLike(x,y){
  if(!liked){
    liked=true;
    count++;
    likeIcon.textContent='❤️';
    likeCountEl.textContent=formatCount(count);
    likeCountEl.classList.remove('bounce');
    void likeCountEl.offsetWidth;
    likeCountEl.classList.add('bounce');
    setTimeout(()=>likeCountEl.classList.remove('bounce'),400);
  }
  spawnHeart(x,y);
}

media.addEventListener('touchend',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];
  const now=Date.now();
  if(now-lastTap<300){
    clearTimeout(tapTimer);
    triggerLike(t.clientX,t.clientY);
  } else {
    tapTimer=setTimeout(()=>{},320);
  }
  lastTap=now;
},{passive:false});

media.addEventListener('click',e=>{
  const now=Date.now();
  if(now-lastTap<300&&lastTap>0){
    triggerLike(e.clientX,e.clientY);
    lastTap=0;
    return;
  }
  lastTap=now;
});

likeBtn.addEventListener('click',e=>{
  e.stopPropagation();
  const r=likeIcon.getBoundingClientRect();
  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;
  if(!liked){
    triggerLike(cx,cy);
  } else {
    liked=false;
    count--;
    likeIcon.textContent='🤍';
    likeCountEl.textContent=formatCount(count);
    likeCountEl.classList.remove('bounce');
    void likeCountEl.offsetWidth;
    likeCountEl.classList.add('bounce');
    setTimeout(()=>likeCountEl.classList.remove('bounce'),400);
  }
});
</script>
