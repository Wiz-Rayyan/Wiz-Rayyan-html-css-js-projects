
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  .rw-root {
    background: #000;
    font-family: 'Share Tech Mono', monospace;
    color: #00FFCC;
    padding: 0;
    min-height: 520px;
    position: relative;
    overflow: hidden;
  }

  .rw-grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 27px, #00FFCC18 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, #00FFCC18 28px);
    pointer-events: none;
    z-index: 0;
  }

  .rw-scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(0,0,0,0.18) 3px,
      rgba(0,0,0,0.18) 4px
    );
    pointer-events: none;
    z-index: 2;
  }

  .rw-content {
    position: relative;
    z-index: 1;
    padding: 18px 20px 16px;
  }

  .rw-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #00FFCC44;
    padding-bottom: 10px;
    margin-bottom: 16px;
  }

  .rw-logo {
    font-size: 13px;
    letter-spacing: 6px;
    color: #00FFCC;
    text-shadow: 0 0 8px #00FFCC, 0 0 20px #00FFCC66;
    text-transform: uppercase;
  }

  .rw-time {
    font-size: 28px;
    letter-spacing: 4px;
    color: #00FFCC;
    text-shadow: 0 0 10px #00FFCC, 0 0 30px #00FFCC55;
  }

  .rw-date-row {
    font-size: 11px;
    letter-spacing: 3px;
    color: #00FFCC88;
    text-align: right;
    margin-top: -4px;
  }

  .rw-metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 14px;
  }

  .rw-card {
    border: 1px solid #00FFCC44;
    padding: 10px 12px;
    position: relative;
    background: #00FFCC07;
  }

  .rw-card::before {
    content: '';
    position: absolute;
    top: -1px; left: -1px; right: -1px; bottom: -1px;
    border: 1px solid transparent;
    pointer-events: none;
  }

  .rw-card.active {
    border-color: #FF6B00;
    background: #FF6B0008;
    box-shadow: 0 0 12px #FF6B0044, inset 0 0 8px #FF6B0011;
  }

  .rw-card-label {
    font-size: 9px;
    letter-spacing: 3px;
    color: #00FFCC66;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .rw-card.active .rw-card-label {
    color: #FF6B0099;
  }

  .rw-card-val {
    font-size: 22px;
    letter-spacing: 2px;
    color: #00FFCC;
    text-shadow: 0 0 8px #00FFCC88;
    line-height: 1;
  }

  .rw-card.active .rw-card-val {
    color: #FF8C33;
    text-shadow: 0 0 10px #FF6B00AA;
  }

  .rw-card-sub {
    font-size: 9px;
    color: #00FFCC44;
    margin-top: 4px;
    letter-spacing: 2px;
  }

  .rw-card.active .rw-card-sub {
    color: #FF6B0066;
  }

  .rw-mid {
    display: grid;
    grid-template-columns: 1fr 180px;
    gap: 10px;
    margin-bottom: 14px;
  }

  .rw-waveform-wrap {
    border: 1px solid #00FFCC44;
    background: #00FFCC05;
    padding: 10px 12px;
  }

  .rw-section-label {
    font-size: 9px;
    letter-spacing: 3px;
    color: #00FFCC55;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .rw-bars {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 72px;
  }

  .rw-bar {
    flex: 1;
    background: #00FFCC;
    box-shadow: 0 0 4px #00FFCCAA;
    transition: height 0.4s ease;
    min-width: 6px;
  }

  .rw-cassette {
    border: 1px solid #00FFCC44;
    background: #00FFCC05;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .rw-cassette svg {
    width: 100%;
    max-width: 148px;
  }

  .rw-track-name {
    font-size: 9px;
    letter-spacing: 2px;
    color: #00FFCC77;
    text-align: center;
    text-transform: uppercase;
  }

  .rw-bottom {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .rw-eq {
    border: 1px solid #00FFCC44;
    background: #00FFCC05;
    padding: 10px 12px;
  }

  .rw-eq-bars {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 44px;
    margin-top: 8px;
  }

  .rw-eq-bar {
    flex: 1;
    background: #00FFCC;
    box-shadow: 0 0 3px #00FFCCAA;
    min-width: 4px;
  }

  .rw-eq-bar.hot {
    background: #FF6B00;
    box-shadow: 0 0 6px #FF6B00AA;
  }

  .rw-status {
    border: 1px solid #00FFCC44;
    background: #00FFCC05;
    padding: 10px 12px;
  }

  .rw-status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    letter-spacing: 2px;
    padding: 3px 0;
    border-bottom: 1px solid #00FFCC11;
    color: #00FFCC88;
  }

  .rw-status-row:last-child { border-bottom: none; }

  .rw-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #00FFCC;
    box-shadow: 0 0 5px #00FFCCCC;
    display: inline-block;
  }

  .rw-dot.off { background: #00FFCC22; box-shadow: none; }
  .rw-dot.warn { background: #FF6B00; box-shadow: 0 0 5px #FF6B00CC; }

  .rw-prog {
    border: 1px solid #00FFCC44;
    background: #00FFCC05;
    padding: 10px 12px;
  }

  .rw-prog-bar-wrap {
    height: 6px;
    background: #00FFCC15;
    border: 1px solid #00FFCC33;
    margin: 4px 0 8px;
  }

  .rw-prog-bar-fill {
    height: 100%;
    background: #00FFCC;
    box-shadow: 0 0 4px #00FFCCAA;
  }

  .rw-prog-bar-fill.hot {
    background: #FF6B00;
    box-shadow: 0 0 6px #FF6B00AA;
  }

  .rw-prog-label {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    letter-spacing: 2px;
    color: #00FFCC66;
    margin-bottom: 2px;
  }

  .rw-blink { animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .rw-corner {
    position: absolute;
    width: 8px; height: 8px;
  }
  .rw-corner.tl { top: 0; left: 0; border-top: 1px solid #00FFCCAA; border-left: 1px solid #00FFCCAA; }
  .rw-corner.tr { top: 0; right: 0; border-top: 1px solid #00FFCCAA; border-right: 1px solid #00FFCCAA; }
  .rw-corner.bl { bottom: 0; left: 0; border-bottom: 1px solid #00FFCCAA; border-left: 1px solid #00FFCCAA; }
  .rw-corner.br { bottom: 0; right: 0; border-bottom: 1px solid #00FFCCAA; border-right: 1px solid #00FFCCAA; }
</style>

<div class="rw-root">
  <div class="rw-grid-bg"></div>
  <div class="rw-scanlines"></div>
  <div class="rw-content">

    <div class="rw-header">
      <div>
        <div class="rw-logo">◈ SYNTHCORE SYS ◈</div>
        <div style="font-size:9px;letter-spacing:3px;color:#00FFCC44;margin-top:2px;">V2.4 // READY</div>
      </div>
      <div>
        <div class="rw-time" id="rw-clock">00:00:00</div>
        <div class="rw-date-row" id="rw-date">--/--/----</div>
      </div>
    </div>

    <div class="rw-metrics">
      <div class="rw-card active" style="position:relative;">
        <div class="rw-corner tl"></div><div class="rw-corner tr"></div><div class="rw-corner bl"></div><div class="rw-corner br"></div>
        <div class="rw-card-label">FREQ</div>
        <div class="rw-card-val" id="freq-val">440.0</div>
        <div class="rw-card-sub">HZ ▲ 2.3</div>
      </div>
      <div class="rw-card" style="position:relative;">
        <div class="rw-corner tl"></div><div class="rw-corner tr"></div><div class="rw-corner bl"></div><div class="rw-corner br"></div>
        <div class="rw-card-label">TEMPO</div>
        <div class="rw-card-val" id="bpm-val">128</div>
        <div class="rw-card-sub">BPM ▪ SYNC</div>
      </div>
      <div class="rw-card" style="position:relative;">
        <div class="rw-corner tl"></div><div class="rw-corner tr"></div><div class="rw-corner bl"></div><div class="rw-corner br"></div>
        <div class="rw-card-label">GAIN</div>
        <div class="rw-card-val" id="gain-val">-6.0</div>
        <div class="rw-card-sub">DB ▼ 0.5</div>
      </div>
      <div class="rw-card active" style="position:relative;">
        <div class="rw-corner tl"></div><div class="rw-corner tr"></div><div class="rw-corner bl"></div><div class="rw-corner br"></div>
        <div class="rw-card-label">TRACK</div>
        <div class="rw-card-val">B-04</div>
        <div class="rw-card-sub" id="track-blink">● REC<span class="rw-blink">_</span></div>
      </div>
    </div>

    <div class="rw-mid">
      <div class="rw-waveform-wrap" style="position:relative;">
        <div class="rw-corner tl"></div><div class="rw-corner tr"></div><div class="rw-corner bl"></div><div class="rw-corner br"></div>
        <div class="rw-section-label">WAVEFORM // CH-A</div>
        <div class="rw-bars" id="wave-bars"></div>
      </div>

      <div class="rw-cassette" style="position:relative;">
        <div class="rw-corner tl"></div><div class="rw-corner tr"></div><div class="rw-corner bl"></div><div class="rw-corner br"></div>
        <svg viewBox="0 0 148 88" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="4" width="140" height="80" rx="4" stroke="#00FFCC" stroke-width="1" fill="none"/>
          <rect x="4" y="4" width="140" height="80" rx="4" fill="#00FFCC06"/>
          <rect x="14" y="14" width="120" height="36" rx="2" stroke="#00FFCC44" stroke-width="0.5" fill="#00FFCC04"/>
          <text x="74" y="36" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="9" fill="#00FFCC77" letter-spacing="3">SYNTHWAVE VOL.1</text>
          <circle cx="42" cy="66" r="12" stroke="#00FFCC" stroke-width="1" fill="none"/>
          <circle cx="42" cy="66" r="6" stroke="#00FFCC44" stroke-width="0.5" fill="none"/>
          <circle cx="42" cy="66" r="2" fill="#00FFCC44"/>
          <circle cx="106" cy="66" r="12" stroke="#00FFCC" stroke-width="1" fill="none"/>
          <circle cx="106" cy="66" r="6" stroke="#00FFCC44" stroke-width="0.5" fill="none"/>
          <circle cx="106" cy="66" r="2" fill="#00FFCC44"/>
          <path d="M54 66 Q74 58 94 66" stroke="#00FFCC55" stroke-width="1" fill="none"/>
          <rect x="68" y="60" width="12" height="8" rx="1" stroke="#00FFCC44" stroke-width="0.5" fill="none"/>
          <circle cx="42" cy="66" r="10" stroke="#00FFCC22" stroke-width="0.5" fill="none" id="reel-l"/>
          <circle cx="106" cy="66" r="10" stroke="#00FFCC22" stroke-width="0.5" fill="none" id="reel-r"/>
        </svg>
        <div class="rw-track-name">◄◄ PLAY ►► SIDE-A</div>
      </div>
    </div>

    <div class="rw-bottom">
      <div class="rw-eq" style="position:relative;">
        <div class="rw-corner tl"></div><div class="rw-corner tr"></div><div class="rw-corner bl"></div><div class="rw-corner br"></div>
        <div class="rw-section-label">EQ SPECTRUM</div>
        <div class="rw-eq-bars" id="eq-bars"></div>
      </div>

      <div class="rw-status" style="position:relative;">
        <div class="rw-corner tl"></div><div class="rw-corner tr"></div><div class="rw-corner bl"></div><div class="rw-corner br"></div>
        <div class="rw-section-label">SYSTEM STATUS</div>
        <div class="rw-status-row"><span>SYNC</span><span><span class="rw-dot"></span></span></div>
        <div class="rw-status-row"><span>MIDI</span><span><span class="rw-dot"></span></span></div>
        <div class="rw-status-row"><span>TAPE</span><span><span class="rw-dot warn"></span></span></div>
        <div class="rw-status-row"><span>VCO-2</span><span><span class="rw-dot off"></span></span></div>
      </div>

      <div class="rw-prog" style="position:relative;">
        <div class="rw-corner tl"></div><div class="rw-corner tr"></div><div class="rw-corner bl"></div><div class="rw-corner br"></div>
        <div class="rw-section-label">LEVELS</div>
        <div class="rw-prog-label"><span>MASTER</span><span id="master-pct">82%</span></div>
        <div class="rw-prog-bar-wrap"><div class="rw-prog-bar-fill" id="master-bar" style="width:82%"></div></div>
        <div class="rw-prog-label"><span>REVERB</span><span id="rev-pct">45%</span></div>
        <div class="rw-prog-bar-wrap"><div class="rw-prog-bar-fill" id="rev-bar" style="width:45%"></div></div>
        <div class="rw-prog-label"><span>DELAY</span><span id="dly-pct">91%</span></div>
        <div class="rw-prog-bar-wrap"><div class="rw-prog-bar-fill hot" id="dly-bar" style="width:91%"></div></div>
      </div>
    </div>

  </div>
</div>

<script>
(function() {
  function pad(n) { return String(n).padStart(2,'0'); }

  function updateClock() {
    const now = new Date();
    document.getElementById('rw-clock').textContent =
      pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    document.getElementById('rw-date').textContent =
      pad(now.getDate()) + '/' + pad(now.getMonth()+1) + '/' + now.getFullYear();
  }
  updateClock();
  setInterval(updateClock, 1000);

  const waveHeights = [55,70,40,85,60,90,35,75,50,65,80,45,70,55,88,42,68,78,52,62];
  const waveWrap = document.getElementById('wave-bars');
  waveHeights.forEach((h,i) => {
    const bar = document.createElement('div');
    bar.className = 'rw-bar';
    bar.style.height = h + '%';
    bar.id = 'wb-'+i;
    waveWrap.appendChild(bar);
  });

  const eqHeights = [30,55,85,70,90,65,45,35,60,75,50,40];
  const eqWrap = document.getElementById('eq-bars');
  eqHeights.forEach((h,i) => {
    const bar = document.createElement('div');
    bar.className = 'rw-eq-bar' + (h > 80 ? ' hot' : '');
    bar.style.height = h + '%';
    bar.id = 'eb-'+i;
    eqWrap.appendChild(bar);
  });

  let tick = 0;
  setInterval(() => {
    tick++;

    const wbars = document.querySelectorAll('[id^="wb-"]');
    wbars.forEach((b,i) => {
      const v = Math.max(10, Math.min(95, waveHeights[i] + Math.sin(tick*0.3 + i*0.7)*18 + (Math.random()-0.5)*8));
      b.style.height = v.toFixed(0) + '%';
    });

    const ebars = document.querySelectorAll('[id^="eb-"]');
    ebars.forEach((b,i) => {
      const v = Math.max(8, Math.min(98, eqHeights[i] + Math.sin(tick*0.25 + i*1.1)*20 + (Math.random()-0.5)*10));
      b.style.height = v.toFixed(0) + '%';
      b.classList.toggle('hot', v > 80);
    });

    const freqDrift = (440 + Math.sin(tick*0.07)*3.5).toFixed(1);
    document.getElementById('freq-val').textContent = freqDrift;

    const bpm = 128 + (tick % 4 === 0 ? Math.floor(Math.random()*3)-1 : 0);
    document.getElementById('bpm-val').textContent = bpm;

    const master = 82 + Math.floor(Math.sin(tick*0.05)*4);
    document.getElementById('master-bar').style.width = master+'%';
    document.getElementById('master-pct').textContent = master+'%';

    const dly = 91 + Math.floor(Math.sin(tick*0.09)*5);
    const dlyBar = document.getElementById('dly-bar');
    dlyBar.style.width = Math.min(100,dly)+'%';
    document.getElementById('dly-pct').textContent = Math.min(100,dly)+'%';
    dlyBar.classList.toggle('hot', dly > 88);

  }, 120);
})();
</script>
