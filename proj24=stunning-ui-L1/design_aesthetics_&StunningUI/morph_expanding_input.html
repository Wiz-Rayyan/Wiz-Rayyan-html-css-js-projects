<div style="display: flex; flex-direction: column; gap: 2rem; padding: 2rem 0; align-items: center;">

<div style="display: flex; gap: 2rem; align-items: center;">
  <div id="wrap1" style="position: relative; width: 48px; height: 48px; transition: width 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1); overflow: hidden; border-radius: 24px; background: var(--surface-1); border: 0.5px solid var(--border);">
    <i class="ti ti-search" id="icon1" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 24px; color: var(--text-secondary); transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1); cursor: pointer;" aria-hidden="true"></i>
  <input id="input1" type="text" placeholder="Search" style="width: 100%; height: 48px; border: none; background: transparent; padding-left: 48px; padding-right: 12px; font-size: 15px; box-sizing: border-box; outline: none; opacity: 0; transition: opacity 0.25s ease 0.1s;" />
  </div>
  <span style="font-size: 13px; color: var(--text-muted);">search bar</span>
</div>

<div style="display: flex; gap: 2rem; align-items: center;">
  <div id="wrap2" style="position: relative; width: 48px; height: 48px; transition: width 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1); overflow: hidden; border-radius: var(--radius); background: var(--surface-1); border: 0.5px solid var(--border);">
    <i class="ti ti-mail" id="icon2" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 24px; color: var(--text-secondary); transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1); cursor: pointer;" aria-hidden="true"></i>
    <label id="label2" style="position: absolute; left: 48px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--text-muted); opacity: 0; transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1); pointer-events: none;">Email</label>
    <input id="input2" type="text" style="width: 100%; height: 48px; border: none; background: transparent; padding-left: 48px; padding-right: 12px; font-size: 15px; box-sizing: border-box; outline: none; opacity: 0; transition: opacity 0.25s ease 0.1s;" />
  </div>
  <span style="font-size: 13px; color: var(--text-muted);">floating label field</span>
</div>

</div>

<script>
function setupMorph(wrapId, iconId, inputId, labelId, expandedWidth) {
  const wrap = document.getElementById(wrapId);
  const icon = document.getElementById(iconId);
  const input = document.getElementById(inputId);
  const label = labelId ? document.getElementById(labelId) : null;

  function expand() {
    wrap.style.width = expandedWidth;
    wrap.style.boxShadow = '0 0 0 3px var(--bg-accent)';
    wrap.style.borderColor = 'var(--border-accent)';
    icon.style.left = '14px';
    icon.style.fontSize = '16px';
    icon.style.color = 'var(--text-accent)';
    input.style.opacity = '1';
    if (label) {
      label.style.top = '15px';
      label.style.fontSize = '11px';
      label.style.opacity = '1';
      label.style.color = 'var(--text-accent)';
    }
    setTimeout(() => input.focus(), 200);
  }

  function collapse() {
    if (input.value.trim() !== '') return;
    wrap.style.width = '48px';
    wrap.style.boxShadow = 'none';
    wrap.style.borderColor = 'var(--border)';
    icon.style.left = '12px';
    icon.style.fontSize = '24px';
    icon.style.color = 'var(--text-secondary)';
    input.style.opacity = '0';
    if (label) {
      label.style.top = '50%';
      label.style.fontSize = '15px';
      label.style.opacity = '0';
      label.style.color = 'var(--text-muted)';
    }
  }

  icon.addEventListener('click', expand);
  wrap.addEventListener('click', (e) => {
    if (wrap.style.width === '48px' || wrap.style.width === '') expand();
  });
  input.addEventListener('blur', collapse);
  wrap.addEventListener('mouseenter', () => {
    if (wrap.style.width === '48px' || wrap.style.width === '') {
      wrap.style.boxShadow = '0 0 0 2px var(--border)';
    }
  });
  wrap.addEventListener('mouseleave', () => {
    if (wrap.style.width === '48px' || wrap.style.width === '') {
      wrap.style.boxShadow = 'none';
    }
  });
}

setupMorph('wrap1', 'icon1', 'input1', null, '260px');
setupMorph('wrap2', 'icon2', 'input2', 'label2', '260px');
</script>
