
<style>
  :root { --r: 110; --cx: 160; --cy: 160; }
  .pt-wrap { display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem 1.5rem; gap: 1.5rem; }
  .mode-bar { display: flex; gap: 8px; }
  .mode-btn { padding: 6px 18px; font-size: 13px; border-radius: 20px; border: 0.5px solid var(--color-border-secondary); background: transparent; color: var(--color-text-secondary); cursor: pointer; transition: all .15s; }
  .mode-btn.active { background: var(--color-text-primary); color: var(--color-background-primary); border-color: transparent; }
  .ring-wrap { position: relative; width: 320px; height: 320px; }
  .ring-wrap svg { width: 100%; height: 100%; }
  .time-label { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
  .time-label .digits { font-size: 52px; font-weight: 500; color: var(--color-text-primary); letter-spacing: -2px; line-height: 1; }
  .time-label .sublabel { font-size: 13px; color: var(--color-text-secondary); margin-top: 6px; }
  .controls { display: flex; gap: 12px; align-items: center; }
  .ctrl-btn { width: 48px; height: 48px; border-radius: 50%; border: 0.5px solid var(--color-border-secondary); background: transparent; color: var(--color-text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; transition: all .15s; }
  .ctrl-btn:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
  .ctrl-btn.primary { width: 60px; height: 60px; font-size: 24px; border: 0.5px solid var(--color-border-primary); color: var(--color-text-primary); }
  .ctrl-btn.primary:hover { background: var(--color-background-secondary); }
  .sessions-row { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .session-dots { display: flex; gap: 8px; }
  .sdot { width: 10px; height: 10px; border-radius: 50%; background: var(--color-border-secondary); transition: background .3s; }
  .sdot.done { background: var(--color-text-primary); }
  .sessions-label { font-size: 12px; color: var(--color-text-secondary); }
  .notif-bar { font-size: 13px; color: var(--color-text-secondary); height: 18px; }
</style>

<div class="pt-wrap">
  <h2 class="sr-only">Pomodoro focus timer with circular countdown, session tracking, and work/break modes</h2>

  <div class="mode-bar">
    <button class="mode-btn active" id="btn-work" onclick="switchMode('work')">Work</button>
    <button class="mode-btn" id="btn-short" onclick="switchMode('short')">Short break</button>
    <button class="mode-btn" id="btn-long" onclick="switchMode('long')">Long break</button>
  </div>

  <div class="ring-wrap">
    <svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
      <circle cx="160" cy="160" r="110" fill="none" stroke="var(--color-border-tertiary)" stroke-width="10"/>
      <circle id="progress-ring" cx="160" cy="160" r="110" fill="none"
        stroke="var(--color-text-primary)" stroke-width="10"
        stroke-linecap="round"
        stroke-dasharray="691.15"
        stroke-dashoffset="0"
        transform="rotate(-90 160 160)"
        style="transition: stroke-dashoffset 1s linear;"/>
    </svg>
    <div class="time-label">
      <div class="digits" id="display">25:00</div>
      <div class="sublabel" id="mode-label">Focus time</div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" onclick="resetTimer()" aria-label="Reset"><i class="ti ti-refresh" aria-hidden="true"></i></button>
    <button class="ctrl-btn primary" id="play-btn" onclick="toggleTimer()" aria-label="Start"><i class="ti ti-player-play" id="play-icon" aria-hidden="true"></i></button>
    <button class="ctrl-btn" onclick="skipTimer()" aria-label="Skip"><i class="ti ti-player-skip-forward" aria-hidden="true"></i></button>
  </div>

  <div class="sessions-row">
    <div class="session-dots" id="dots"></div>
    <div class="sessions-label" id="sess-label">0 pomodoros completed</div>
  </div>

  <div class="notif-bar" id="notif-bar"></div>
</div>

<script>
const MODES = {
  work:  { label: 'Focus time',   secs: 25*60, color: 'var(--color-text-primary)' },
  short: { label: 'Short break',  secs: 5*60,  color: 'var(--color-text-secondary)' },
  long:  { label: 'Long break',   secs: 15*60, color: 'var(--color-text-secondary)' },
};

let mode = 'work';
let totalSecs = MODES.work.secs;
let remaining = totalSecs;
let running = false;
let interval = null;
let sessions = 0;
const CIRC = 2 * Math.PI * 110;

const ring = document.getElementById('progress-ring');
const display = document.getElementById('display');
const modeLabel = document.getElementById('mode-label');
const playIcon = document.getElementById('play-icon');
const notifBar = document.getElementById('notif-bar');

function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function setRing(rem, total) {
  const pct = rem / total;
  ring.style.strokeDashoffset = CIRC * (1 - pct);
  ring.setAttribute('stroke', MODES[mode].color);
}

function updateDots() {
  const d = document.getElementById('dots');
  d.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const s = document.createElement('div');
    s.className = 'sdot' + (i < sessions % 4 ? ' done' : '');
    d.appendChild(s);
  }
  document.getElementById('sess-label').textContent =
    sessions + ' pomodoro' + (sessions !== 1 ? 's' : '') + ' completed';
}

function notify(msg) {
  notifBar.textContent = msg;
  setTimeout(() => { notifBar.textContent = ''; }, 5000);
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
    osc.start();
    osc.stop(ctx.currentTime + 0.6);
  } catch(e) {}
}

function tick() {
  if (remaining <= 0) {
    clearInterval(interval);
    running = false;
    playIcon.className = 'ti ti-player-play';
    beep();
    if (mode === 'work') {
      sessions++;
      updateDots();
      notify('Pomodoro complete! Take a break.');
      switchMode(sessions % 4 === 0 ? 'long' : 'short');
    } else {
      notify('Break over! Back to work.');
      switchMode('work');
    }
    return;
  }
  remaining--;
  display.textContent = fmt(remaining);
  setRing(remaining, totalSecs);
}

function toggleTimer() {
  if (running) {
    clearInterval(interval);
    running = false;
    playIcon.className = 'ti ti-player-play';
  } else {
    interval = setInterval(tick, 1000);
    running = true;
    playIcon.className = 'ti ti-player-pause';
  }
}

function resetTimer() {
  clearInterval(interval);
  running = false;
  playIcon.className = 'ti ti-player-play';
  remaining = totalSecs;
  display.textContent = fmt(remaining);
  setRing(remaining, totalSecs);
}

function skipTimer() {
  clearInterval(interval);
  running = false;
  remaining = 0;
  tick();
}

function switchMode(m) {
  clearInterval(interval);
  running = false;
  playIcon.className = 'ti ti-player-play';
  mode = m;
  totalSecs = MODES[m].secs;
  remaining = totalSecs;
  display.textContent = fmt(remaining);
  modeLabel.textContent = MODES[m].label;
  setRing(remaining, totalSecs);
  ['work','short','long'].forEach(k => {
    document.getElementById('btn-'+k).classList.toggle('active', k === m);
  });
}

updateDots();
setRing(remaining, totalSecs);
</script>
