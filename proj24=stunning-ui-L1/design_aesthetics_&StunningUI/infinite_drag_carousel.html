<h2 class="sr-only">Infinite drag carousel — drag left or right to scroll through cards endlessly</h2>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: transparent; }
.carousel-root {
  padding: 2rem 0 2.5rem;
  overflow: hidden;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
}
.carousel-root.dragging { cursor: grabbing; }
.track {
  display: flex;
  gap: 16px;
  will-change: transform;
  transition: none;
}
.card {
  flex-shrink: 0;
  width: 220px;
  height: 280px;
  border-radius: var(--border-radius-lg);
  border: 0.5px solid var(--color-border-tertiary);
  background: var(--color-background-primary);
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  pointer-events: none;
}
.card-accent {
  width: 36px;
  height: 4px;
  border-radius: 2px;
  margin-bottom: 1rem;
}
.card-num {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-text-tertiary);
  margin-bottom: 6px;
}
.card-title {
  font-size: 15px;
  font-weight: 500;
  color: var(--color-text-primary);
  line-height: 1.4;
  margin-bottom: 6px;
}
.card-sub {
  font-size: 13px;
  color: var(--color-text-secondary);
  line-height: 1.5;
  flex: 1;
}
.card-tag {
  display: inline-block;
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 20px;
  margin-top: 1rem;
  align-self: flex-start;
}
.hint {
  text-align: center;
  font-size: 12px;
  color: var(--color-text-tertiary);
  margin-top: 1rem;
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.hint i { font-size: 14px; }
</style>

<div class="carousel-root" id="carousel" aria-label="Infinite drag carousel">
  <div class="track" id="track"></div>
</div>
<p class="hint"><i class="ti ti-arrows-horizontal" aria-hidden="true"></i> drag anywhere to scroll — it never ends</p>

<script>
const cards = [
  { num: "01", title: "Visual Identity", sub: "Brand systems that flex across every surface — print, digital, motion.", tag: "Branding", color: "#534AB7", bg: "#EEEDFE", tagColor: "#3C3489" },
  { num: "02", title: "Motion Design", sub: "Microinteractions and transitions that make interfaces feel alive.", tag: "Animation", color: "#0F6E56", bg: "#E1F5EE", tagColor: "#085041" },
  { num: "03", title: "Typography", sub: "Expressive type hierarchies built for readability at every scale.", tag: "Type", color: "#993C1D", bg: "#FAECE7", tagColor: "#712B13" },
  { num: "04", title: "Spatial UI", sub: "Three-dimensional interfaces that respond to depth and gesture.", tag: "Interaction", color: "#185FA5", bg: "#E6F1FB", tagColor: "#0C447C" },
  { num: "05", title: "Editorial", sub: "Long-form layouts where every detail of spacing earns its place.", tag: "Layout", color: "#993556", bg: "#FBEAF0", tagColor: "#72243E" },
  { num: "06", title: "Systems Thinking", sub: "Design tokens, component libraries, and the logic underneath.", tag: "Systems", color: "#3B6D11", bg: "#EAF3DE", tagColor: "#27500A" },
  { num: "07", title: "Data Viz", sub: "Complex datasets rendered into moments of instant clarity.", tag: "Visualization", color: "#854F0B", bg: "#FAEEDA", tagColor: "#633806" },
  { num: "08", title: "Generative", sub: "Algorithmic aesthetics where the rules are part of the art.", tag: "Code Art", color: "#5F5E5A", bg: "#F1EFE8", tagColor: "#444441" },
];

const track = document.getElementById('track');
const carousel = document.getElementById('carousel');

function makeCard(d, idx) {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div>
      <div class="card-accent" style="background:${d.color}"></div>
      <div class="card-num">${d.num}</div>
      <div class="card-title">${d.title}</div>
      <div class="card-sub">${d.sub}</div>
    </div>
    <span class="card-tag" style="background:${d.bg};color:${d.tagColor}">${d.tag}</span>
  `;
  return el;
}

const COPIES = 3;
let allCards = [];
for (let c = 0; c < COPIES; c++) {
  cards.forEach((d, i) => {
    const el = makeCard(d, c * cards.length + i);
    track.appendChild(el);
    allCards.push(el);
  });
}

const GAP = 16;
const CARD_W = 220;
const UNIT = CARD_W + GAP;
const STRIP = cards.length * UNIT;

let x = -STRIP;
let vel = 0;
let dragging = false;
let startX = 0;
let lastX = 0;
let lastT = 0;
let raf = null;

function setX(val) {
  if (val > -STRIP + STRIP * 0.1) val -= STRIP;
  if (val < -STRIP * 2 + STRIP * 0.1) val += STRIP;
  x = val;
  track.style.transform = `translateX(${x}px)`;
}

function loop() {
  if (!dragging) {
    vel *= 0.93;
    setX(x + vel);
    if (Math.abs(vel) < 0.2) vel = 0;
  }
  raf = requestAnimationFrame(loop);
}

function getClientX(e) {
  return e.touches ? e.touches[0].clientX : e.clientX;
}

carousel.addEventListener('mousedown', start);
carousel.addEventListener('touchstart', start, { passive: true });

function start(e) {
  dragging = true;
  carousel.classList.add('dragging');
  startX = getClientX(e);
  lastX = startX;
  lastT = Date.now();
  vel = 0;
}

window.addEventListener('mousemove', move);
window.addEventListener('touchmove', move, { passive: true });

function move(e) {
  if (!dragging) return;
  const cx = getClientX(e);
  const now = Date.now();
  const dt = Math.max(now - lastT, 1);
  vel = (cx - lastX) / dt * 12;
  setX(x + (cx - lastX));
  lastX = cx;
  lastT = now;
}

window.addEventListener('mouseup', end);
window.addEventListener('touchend', end);

function end() {
  if (!dragging) return;
  dragging = false;
  carousel.classList.remove('dragging');
}

setX(-STRIP);
raf = requestAnimationFrame(loop);
</script>
