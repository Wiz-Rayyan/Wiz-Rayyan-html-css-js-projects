
<style>
  @keyframes pulse-outer {
    0%, 100% { transform: scale(1); opacity: 0.18; }
    50% { transform: scale(1.13); opacity: 0.32; }
  }
  @keyframes pulse-mid {
    0%, 100% { transform: scale(1); opacity: 0.28; }
    50% { transform: scale(1.09); opacity: 0.45; }
  }
  @keyframes pulse-inner {
    0%, 100% { transform: scale(1); opacity: 0.55; }
    50% { transform: scale(1.06); opacity: 0.75; }
  }
  @keyframes pulse-core {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.04); opacity: 1; }
  }
  @keyframes drift {
    0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.07; }
    33% { transform: translateY(-8px) translateX(4px); opacity: 0.13; }
    66% { transform: translateY(5px) translateX(-6px); opacity: 0.09; }
  }
  @keyframes whisper-fade {
    0%, 100% { opacity: 0; letter-spacing: 0.35em; }
    20%, 80% { opacity: 0.55; letter-spacing: 0.5em; }
  }
  @keyframes shimmer {
    0% { opacity: 0.04; }
    50% { opacity: 0.12; }
    100% { opacity: 0.04; }
  }
  @keyframes grain-drift {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body, html { background: transparent; }
</style>

<div style="position: relative; width: 100%; height: 520px; overflow: hidden; border-radius: 20px; background: linear-gradient(160deg, #f9e8f4 0%, #e8eeff 40%, #e0f7f3 75%, #fce8f0 100%);">

  <!-- Ambient shimmer layers -->
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 30% 40%, rgba(200,170,230,0.25) 0%, transparent 70%);animation:shimmer 6s ease-in-out infinite;"></div>
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse 60% 70% at 70% 65%, rgba(150,200,240,0.2) 0%, transparent 70%);animation:shimmer 7.5s ease-in-out infinite 1.5s;"></div>
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse 50% 50% at 55% 30%, rgba(190,230,210,0.18) 0%, transparent 70%);animation:shimmer 9s ease-in-out infinite 3s;"></div>

  <!-- Drifting soft blobs -->
  <div style="position:absolute;top:12%;left:8%;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle, rgba(220,180,255,0.35) 0%, transparent 70%);animation:drift 9s ease-in-out infinite;filter:blur(18px);"></div>
  <div style="position:absolute;top:55%;left:68%;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle, rgba(160,210,250,0.3) 0%, transparent 70%);animation:drift 11s ease-in-out infinite 2s;filter:blur(16px);"></div>
  <div style="position:absolute;top:70%;left:15%;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle, rgba(200,245,225,0.3) 0%, transparent 70%);animation:drift 13s ease-in-out infinite 4s;filter:blur(14px);"></div>
  <div style="position:absolute;top:20%;left:72%;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle, rgba(255,210,230,0.28) 0%, transparent 70%);animation:drift 10s ease-in-out infinite 6s;filter:blur(14px);"></div>

  <!-- Concentric pulsing rings — centered -->
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">

    <!-- Ring 5 — outermost -->
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:420px;height:420px;border-radius:50%;border:1.5px solid rgba(180,160,220,0.22);animation:pulse-outer 5s ease-in-out infinite;"></div>

    <!-- Ring 4 -->
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:330px;height:330px;border-radius:50%;border:1.5px solid rgba(160,190,240,0.3);animation:pulse-outer 5s ease-in-out infinite 0.6s;"></div>

    <!-- Ring 3 -->
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:248px;height:248px;border-radius:50%;background:radial-gradient(circle, rgba(210,185,240,0.18) 0%, transparent 70%);border:1.5px solid rgba(200,170,235,0.38);animation:pulse-mid 4.5s ease-in-out infinite 0.3s;"></div>

    <!-- Ring 2 -->
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:172px;height:172px;border-radius:50%;background:radial-gradient(circle, rgba(190,215,255,0.28) 0%, rgba(220,185,245,0.2) 60%, transparent 90%);border:1.5px solid rgba(180,200,245,0.5);animation:pulse-inner 4s ease-in-out infinite 0.8s;"></div>

    <!-- Core -->
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100px;height:100px;border-radius:50%;background:radial-gradient(circle, rgba(230,210,255,0.75) 0%, rgba(200,225,255,0.55) 50%, rgba(215,245,235,0.4) 100%);border:1px solid rgba(210,190,250,0.65);animation:pulse-core 4s ease-in-out infinite;filter:blur(0.5px);"></div>

    <!-- Innermost glow -->
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;background:radial-gradient(circle, rgba(245,235,255,1) 0%, rgba(220,210,255,0.8) 60%, transparent 100%);animation:pulse-core 4s ease-in-out infinite 0.4s;filter:blur(1px);"></div>

  </div>

  <!-- Whispered text — top -->
  <div style="position:absolute;top:10%;left:0;right:0;text-align:center;animation:whisper-fade 8s ease-in-out infinite;">
    <span style="font-family:Georgia,serif;font-size:11px;letter-spacing:0.5em;color:rgba(140,120,170,0.9);text-transform:uppercase;font-style:italic;">sensation</span>
  </div>

  <!-- Whispered text — bottom -->
  <div style="position:absolute;bottom:10%;left:0;right:0;text-align:center;animation:whisper-fade 8s ease-in-out infinite 4s;">
    <span style="font-family:Georgia,serif;font-size:11px;letter-spacing:0.5em;color:rgba(120,150,175,0.9);text-transform:uppercase;font-style:italic;">stillness</span>
  </div>

  <!-- Tiny floating particles -->
  <div style="position:absolute;top:28%;left:22%;width:4px;height:4px;border-radius:50%;background:rgba(200,170,240,0.6);animation:drift 14s ease-in-out infinite 1s;"></div>
  <div style="position:absolute;top:62%;left:38%;width:3px;height:3px;border-radius:50%;background:rgba(160,205,250,0.55);animation:drift 12s ease-in-out infinite 3s;"></div>
  <div style="position:absolute;top:38%;left:78%;width:4px;height:4px;border-radius:50%;background:rgba(195,240,215,0.6);animation:drift 16s ease-in-out infinite 5s;"></div>
  <div style="position:absolute;top:75%;left:60%;width:3px;height:3px;border-radius:50%;background:rgba(240,195,225,0.55);animation:drift 11s ease-in-out infinite 7s;"></div>
  <div style="position:absolute;top:18%;left:55%;width:3px;height:3px;border-radius:50%;background:rgba(210,185,250,0.5);animation:drift 15s ease-in-out infinite 2s;"></div>

</div>
