
<style>
  .palette-scene {
    min-height: 520px;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 80px;
    border-radius: var(--border-radius-lg);
    position: relative;
  }
  .palette-modal {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-lg);
    width: 520px;
    overflow: hidden;
    box-shadow: none;
  }
  .search-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 0.5px solid var(--color-border-tertiary);
  }
  .search-row i { font-size: 18px; color: var(--color-text-tertiary); }
  .search-row input {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 15px;
    color: var(--color-text-primary);
    outline: none;
    font-family: var(--font-sans);
  }
  .search-row input::placeholder { color: var(--color-text-tertiary); }
  .kbd-hint { font-size: 11px; color: var(--color-text-tertiary); background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: 4px; padding: 2px 6px; white-space: nowrap; }
  .section-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--color-text-tertiary);
    padding: 10px 16px 4px;
  }
  .cmd-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 16px;
    cursor: pointer;
    border-radius: 0;
    transition: background 0.08s;
    border-left: 2px solid transparent;
  }
  .cmd-item.active {
    background: var(--color-background-secondary);
    border-left: 2px solid var(--color-border-info);
  }
  .cmd-item:hover:not(.active) { background: var(--color-background-secondary); }
  .cmd-icon {
    width: 30px; height: 30px;
    border-radius: var(--border-radius-md);
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-tertiary);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .cmd-icon i { font-size: 15px; color: var(--color-text-secondary); }
  .cmd-icon.active-icon { background: var(--color-background-info); border-color: var(--color-border-info); }
  .cmd-icon.active-icon i { color: var(--color-text-info); }
  .cmd-text { flex: 1; }
  .cmd-name { font-size: 14px; color: var(--color-text-primary); line-height: 1.3; }
  .cmd-desc { font-size: 12px; color: var(--color-text-tertiary); }
  .cmd-shortcut { display: flex; gap: 4px; align-items: center; }
  .cmd-shortcut span { font-size: 11px; color: var(--color-text-tertiary); background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: 4px; padding: 2px 6px; font-family: var(--font-mono); }
  .palette-footer {
    border-top: 0.5px solid var(--color-border-tertiary);
    padding: 8px 16px;
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .footer-hint { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--color-text-tertiary); }
  .footer-hint span { font-size: 11px; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: 4px; padding: 2px 6px; font-family: var(--font-mono); }
  .empty-state { padding: 32px 16px; text-align: center; color: var(--color-text-tertiary); font-size: 14px; display: none; }
  .open-btn {
    display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
    padding: 8px 14px; cursor: pointer; font-size: 13px;
    color: var(--color-text-secondary);
  }
  .trigger-bar {
    display: flex; align-items: center; justify-content: center; padding: 20px 0 0;
  }
  .trigger-pill {
    display: flex; align-items: center; gap: 8px;
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-secondary);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 13px;
    color: var(--color-text-secondary);
    cursor: pointer;
    transition: background 0.1s;
    user-select: none;
  }
  .trigger-pill:hover { background: var(--color-background-secondary); }
  .trigger-pill i { font-size: 16px; }
  .toast {
    position: absolute;
    bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md);
    padding: 8px 16px;
    font-size: 13px;
    color: var(--color-text-primary);
    display: flex; align-items: center; gap: 8px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
  .toast i { color: var(--color-text-success); font-size: 16px; }
  mark { background: var(--color-background-warning); color: var(--color-text-warning); border-radius: 2px; }
</style>

<h2 class="sr-only">Command Palette — interactive demo. Press Cmd+K or the trigger button to open, then type to filter, use arrow keys to navigate, Enter to execute, Escape to close.</h2>

<div class="palette-scene" id="scene">
  <div style="width:520px;">
    <div class="trigger-bar">
      <div class="trigger-pill" id="triggerBtn" role="button" aria-label="Open command palette">
        <i class="ti ti-terminal-2" aria-hidden="true"></i>
        Open command palette
        <span class="kbd-hint" style="margin-left:4px;">⌘K</span>
      </div>
    </div>

    <div class="palette-modal" id="paletteModal" style="margin-top:24px; display:none;" role="dialog" aria-label="Command palette" aria-modal="true">
      <div class="search-row">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input type="text" id="searchInput" placeholder="Search commands…" aria-label="Search commands" autocomplete="off" />
        <div class="kbd-hint">esc to close</div>
      </div>
      <div id="cmdList" role="listbox" aria-label="Commands"></div>
      <div class="empty-state" id="emptyState"><i class="ti ti-mood-empty" style="font-size:24px; display:block; margin-bottom:8px;" aria-hidden="true"></i>No commands found</div>
      <div class="palette-footer" aria-hidden="true">
        <div class="footer-hint"><span>↑↓</span> navigate</div>
        <div class="footer-hint"><span>↵</span> select</div>
        <div class="footer-hint"><span>esc</span> close</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <i class="ti ti-check" aria-hidden="true"></i>
    <span id="toastMsg"></span>
  </div>
</div>

<script>
const commands = [
  { id:'new-file',    group:'Files',    icon:'ti-file-plus',     name:'New file',            desc:'Create a new document',       shortcut:['⌘','N'],  action:'Created new file' },
  { id:'save',        group:'Files',    icon:'ti-device-floppy', name:'Save',                desc:'Save current document',       shortcut:['⌘','S'],  action:'File saved' },
  { id:'open',        group:'Files',    icon:'ti-folder-open',   name:'Open file',           desc:'Browse and open a file',      shortcut:['⌘','O'],  action:'Open dialog launched' },
  { id:'settings',    group:'App',      icon:'ti-settings',      name:'Settings',            desc:'Open preferences',            shortcut:['⌘',','],  action:'Settings opened' },
  { id:'theme',       group:'App',      icon:'ti-palette',       name:'Toggle theme',        desc:'Switch light / dark mode',    shortcut:null,        action:'Theme toggled' },
  { id:'help',        group:'App',      icon:'ti-help-circle',   name:'Help & docs',         desc:'Browse documentation',        shortcut:['?'],       action:'Help opened' },
  { id:'search',      group:'Navigate', icon:'ti-search',        name:'Search everywhere',   desc:'Search across all content',   shortcut:['⌘','F'],  action:'Search opened' },
  { id:'goto',        group:'Navigate', icon:'ti-arrow-right',   name:'Go to line…',         desc:'Jump to a specific line',     shortcut:['⌘','G'],  action:'Go to line opened' },
  { id:'share',       group:'Share',    icon:'ti-share',         name:'Share',               desc:'Copy shareable link',         shortcut:null,        action:'Link copied to clipboard' },
  { id:'export',      group:'Share',    icon:'ti-download',      name:'Export as PDF',       desc:'Download as PDF',             shortcut:null,        action:'Exporting as PDF…' },
];

let activeIdx = 0;
let filtered = [...commands];
let toastTimer = null;

const modal = document.getElementById('paletteModal');
const input = document.getElementById('searchInput');
const listEl = document.getElementById('cmdList');
const emptyEl = document.getElementById('emptyState');
const triggerBtn = document.getElementById('triggerBtn');
const toast = document.getElementById('toast');
const toastMsg = document.getElementById('toastMsg');

function highlight(text, query) {
  if (!query) return text;
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx < 0) return text;
  return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + query.length) + '</mark>' + text.slice(idx + query.length);
}

function render() {
  const q = input.value.trim();
  filtered = commands.filter(c =>
    c.name.toLowerCase().includes(q.toLowerCase()) ||
    c.desc.toLowerCase().includes(q.toLowerCase()) ||
    c.group.toLowerCase().includes(q.toLowerCase())
  );
  activeIdx = Math.min(activeIdx, Math.max(0, filtered.length - 1));

  if (!filtered.length) {
    listEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  const groups = [...new Set(filtered.map(c => c.group))];
  let html = '';
  groups.forEach(g => {
    html += `<div class="section-label">${g}</div>`;
    filtered.filter(c => c.group === g).forEach(c => {
      const i = filtered.indexOf(c);
      const isActive = i === activeIdx;
      html += `<div class="cmd-item${isActive ? ' active' : ''}" role="option" aria-selected="${isActive}" data-idx="${i}">
        <div class="cmd-icon${isActive ? ' active-icon' : ''}"><i class="ti ${c.icon}" aria-hidden="true"></i></div>
        <div class="cmd-text">
          <div class="cmd-name">${highlight(c.name, q)}</div>
          <div class="cmd-desc">${highlight(c.desc, q)}</div>
        </div>
        ${c.shortcut ? `<div class="cmd-shortcut">${c.shortcut.map(k => `<span>${k}</span>`).join('')}</div>` : ''}
      </div>`;
    });
  });
  listEl.innerHTML = html;

  listEl.querySelectorAll('.cmd-item').forEach(el => {
    el.addEventListener('mouseenter', () => {
      activeIdx = parseInt(el.dataset.idx);
      render();
    });
    el.addEventListener('click', () => {
      activeIdx = parseInt(el.dataset.idx);
      execute();
    });
  });

  const activeEl = listEl.querySelector('.cmd-item.active');
  if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
}

function open() {
  modal.style.display = 'block';
  input.value = '';
  activeIdx = 0;
  filtered = [...commands];
  render();
  requestAnimationFrame(() => input.focus());
}

function close() {
  modal.style.display = 'none';
}

function execute() {
  const cmd = filtered[activeIdx];
  if (!cmd) return;
  showToast(cmd.action);
  close();
}

function showToast(msg) {
  toastMsg.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

triggerBtn.addEventListener('click', () => {
  modal.style.display === 'none' ? open() : close();
});

input.addEventListener('input', () => { activeIdx = 0; render(); });

input.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx + 1, filtered.length - 1); render(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); render(); }
  else if (e.key === 'Enter') { e.preventDefault(); execute(); }
  else if (e.key === 'Escape') { close(); }
});

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    modal.style.display === 'none' ? open() : close();
  }
});
</script>
