
<div style="width:100%;height:580px;position:relative;border-radius:var(--border-radius-lg);overflow:hidden;background:#000408;">
  <canvas id="globeCanvas" style="width:100%;height:100%;display:block;cursor:grab;"></canvas>
  <div id="tooltip" style="position:absolute;pointer-events:none;background:rgba(0,4,12,0.88);border:0.5px solid rgba(100,180,255,0.35);border-radius:8px;padding:8px 14px;font-family:var(--font-sans);font-size:13px;color:#e0f0ff;display:none;white-space:nowrap;backdrop-filter:blur(4px);transition:opacity 0.15s;z-index:10;"></div>
  <div id="hud" style="position:absolute;top:14px;right:16px;font-family:var(--font-sans);font-size:11px;color:rgba(140,200,255,0.55);text-align:right;line-height:1.8;pointer-events:none;">
    <div>drag · rotate</div>
    <div>scroll · zoom</div>
    <div>dbl-click · reset</div>
  </div>
  <div id="flyLabel" style="position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-family:var(--font-sans);font-size:12px;color:rgba(140,200,255,0.55);pointer-events:none;display:none;">flying to…</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const canvas = document.getElementById('globeCanvas');
const tooltip = document.getElementById('tooltip');
const flyLabel = document.getElementById('flyLabel');

const W = () => canvas.clientWidth;
const H = () => canvas.clientHeight;

const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(W(), H());
renderer.setClearColor(0x000408, 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, W()/H(), 0.1, 100);
camera.position.set(0, 0, 2.8);

const R = 1.0;

// Stars
const starGeo = new THREE.BufferGeometry();
const starVerts = [];
for(let i=0;i<2200;i++){
  const phi=Math.random()*2*Math.PI, cos=2*Math.random()-1, sin=Math.sqrt(1-cos*cos);
  const r=18+Math.random()*8;
  starVerts.push(r*sin*Math.cos(phi),r*cos,r*sin*Math.sin(phi));
}
starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starVerts,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:0.04,sizeAttenuation:true,transparent:true,opacity:0.7})));

// Country data [name, lat, lon, population string, color]
const countries=[
  ['United States',38,-97,'334M',0x3a8bcd],
  ['Canada',60,-95,'38M',0x4aaddd],
  ['Brazil',-10,-55,'215M',0x2da87e],
  ['Mexico',23,-102,'130M',0x38c09a],
  ['United Kingdom',54,-2,'67M',0x6a7de8],
  ['France',46,2,'68M',0x7c6bd4],
  ['Germany',51,10,'84M',0x9b5fc9],
  ['Russia',60,90,'144M',0xc45a5a],
  ['China',35,103,'1.4B',0xe8834a],
  ['India',20,77,'1.4B',0xe8b84a],
  ['Japan',36,138,'124M',0xe87a9c],
  ['Australia',-27,133,'26M',0x4ab8b8],
  ['South Africa',-29,25,'60M',0xa8c04a],
  ['Argentina',-34,-65,'46M',0x5abd7a],
  ['Egypt',26,30,'105M',0xd4a94a],
  ['Nigeria',9,8,'220M',0xc47a38],
  ['Saudi Arabia',24,45,'36M',0xd4c04a],
  ['Indonesia',-2,118,'277M',0x48a8d4],
  ['Spain',40,-4,'47M',0xd46a6a],
  ['Italy',42,12,'59M',0xd4904a],
  ['South Korea',37,127,'52M',0x7a9cd4],
  ['Pakistan',30,70,'231M',0x8ab84a],
  ['Bangladesh',23,90,'170M',0x4ab87a],
  ['Vietnam',16,108,'98M',0x7ad44a],
  ['Thailand',15,101,'72M',0xd4c46a],
  ['Turkey',39,35,'85M',0xc45a7a],
  ['Iran',32,53,'87M',0x9a7aac],
  ['Colombia',4,-74,'52M',0x4aacd4],
  ['Poland',52,20,'38M',0x8a7ad4],
  ['Ukraine',49,32,'44M',0xc4b84a],
];

const globeGroup = new THREE.Group();
scene.add(globeGroup);

// Earth sphere with procedural texture
const earthCanvas = document.createElement('canvas');
earthCanvas.width=2048; earthCanvas.height=1024;
const ctx = earthCanvas.getContext('2d');

// Ocean
const ocGrad = ctx.createLinearGradient(0,0,0,1024);
ocGrad.addColorStop(0,'#0a2540');
ocGrad.addColorStop(0.5,'#0d3055');
ocGrad.addColorStop(1,'#0a2540');
ctx.fillStyle=ocGrad; ctx.fillRect(0,0,2048,1024);

// Land masses
function landBlob(ctx,cx,cy,rx,ry,rot,color){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(rot);
  ctx.beginPath();
  ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);
  ctx.fillStyle=color;
  ctx.fill();
  ctx.restore();
}
const land='#1a5c32';
// N America
for(let i=0;i<30;i++){
  const lx=300+Math.random()*200, ly=160+Math.random()*200;
  landBlob(ctx,lx,ly,30+Math.random()*70,20+Math.random()*60,Math.random()*Math.PI,land);
}
// S America
for(let i=0;i<18;i++){
  const lx=400+Math.random()*130, ly=420+Math.random()*250;
  landBlob(ctx,lx,ly,25+Math.random()*55,20+Math.random()*50,Math.random()*Math.PI,land);
}
// Europe
for(let i=0;i<20;i++){
  const lx=960+Math.random()*130, ly=140+Math.random()*130;
  landBlob(ctx,lx,ly,20+Math.random()*50,15+Math.random()*40,Math.random()*Math.PI,land);
}
// Africa
for(let i=0;i<25;i++){
  const lx=1000+Math.random()*160, ly=280+Math.random()*330;
  landBlob(ctx,lx,ly,28+Math.random()*65,22+Math.random()*55,Math.random()*Math.PI,land);
}
// Asia
for(let i=0;i<50;i++){
  const lx=1080+Math.random()*600, ly=130+Math.random()*280;
  landBlob(ctx,lx,ly,30+Math.random()*90,20+Math.random()*70,Math.random()*Math.PI,land);
}
// Australia
for(let i=0;i<14;i++){
  const lx=1620+Math.random()*160, ly=530+Math.random()*150;
  landBlob(ctx,lx,ly,22+Math.random()*55,18+Math.random()*45,Math.random()*Math.PI,land);
}
// Greenland
for(let i=0;i<8;i++){
  const lx=480+Math.random()*80, ly=100+Math.random()*80;
  landBlob(ctx,lx,ly,15+Math.random()*40,12+Math.random()*35,Math.random()*Math.PI,'#1e6a38');
}

// Polar ice
const icN=ctx.createLinearGradient(0,0,0,80);
icN.addColorStop(0,'rgba(220,235,255,0.9)');
icN.addColorStop(1,'rgba(200,220,255,0)');
ctx.fillStyle=icN; ctx.fillRect(0,0,2048,80);
const icS=ctx.createLinearGradient(0,960,0,1024);
icS.addColorStop(0,'rgba(220,235,255,0)');
icS.addColorStop(1,'rgba(220,235,255,0.85)');
ctx.fillStyle=icS; ctx.fillRect(0,960,2048,64);

// Grid lines
ctx.strokeStyle='rgba(100,160,220,0.07)'; ctx.lineWidth=1;
for(let lat=-80;lat<=80;lat+=20){
  const y=(lat+90)/180*1024;
  ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(2048,y); ctx.stroke();
}
for(let lon=0;lon<360;lon+=20){
  const x=lon/360*2048;
  ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,1024); ctx.stroke();
}

const earthTex = new THREE.CanvasTexture(earthCanvas);
const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(R,64,64),
  new THREE.MeshPhongMaterial({map:earthTex,shininess:12,specular:new THREE.Color(0.15,0.25,0.4)})
);
globeGroup.add(sphere);

// Atmosphere glow
const atmMat = new THREE.ShaderMaterial({
  uniforms:{glowColor:{value:new THREE.Color(0x4ab8ff)},intensity:{value:0.55}},
  vertexShader:`varying vec3 vNormal; void main(){vNormal=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`varying vec3 vNormal; uniform vec3 glowColor; uniform float intensity;
  void main(){float d=dot(vNormal,vec3(0,0,1));float glow=1.0-abs(d);glow=pow(glow,2.5)*intensity;gl_FragColor=vec4(glowColor,glow);}`,
  transparent:true,side:THREE.FrontSide,depthWrite:false
});
globeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(R*1.06,48,48),atmMat));

// Markers
const markers=[];
countries.forEach(([name,lat,lon,pop,col])=>{
  const phi=(90-lat)*Math.PI/180, theta=(lon+180)*Math.PI/180;
  const x=R*Math.sin(phi)*Math.cos(theta);
  const y=R*Math.cos(phi);
  const z=R*Math.sin(phi)*Math.sin(theta);

  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.018,0.032,20),
    new THREE.MeshBasicMaterial({color:col,side:THREE.DoubleSide,transparent:true,opacity:0.9})
  );
  ring.position.set(x,y,z);
  ring.lookAt(0,0,0);
  ring.position.multiplyScalar(1.003);

  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.012,12,12),
    new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.95})
  );
  dot.position.set(x,y,z);
  dot.position.multiplyScalar(1.004);

  const group = new THREE.Group();
  group.add(ring); group.add(dot);
  group.userData={name,lat,lon,pop,col,x,y,z};
  globeGroup.add(group);
  markers.push(group);
});

// Lighting
scene.add(new THREE.AmbientLight(0x203060,0.9));
const sun = new THREE.DirectionalLight(0xfff8f0,1.4);
sun.position.set(5,3,5);
scene.add(sun);
const rim = new THREE.DirectionalLight(0x4080ff,0.3);
rim.position.set(-5,0,-3);
scene.add(rim);

// State
let isDragging=false;
let prevMouse={x:0,y:0};
let velX=0,velY=0;
let targetRotX=0,targetRotY=0;
let currentRotX=0,currentRotY=0;
let zoom=2.8,targetZoom=2.8;
let flyTarget=null,flyStart=null,flyTime=0,flyDuration=1000,flyStartTime=0;
let hoveredMarker=null;
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
raycaster.params.Points={threshold:0.02};

function latLonToCam(lat,lon,dist){
  const phi=(90-lat)*Math.PI/180, theta=(lon+180)*Math.PI/180;
  return new THREE.Vector3(
    dist*Math.sin(phi)*Math.cos(theta),
    dist*Math.cos(phi),
    dist*Math.sin(phi)*Math.sin(theta)
  );
}

function lerp(a,b,t){return a+(b-a)*t;}
function easeInOut(t){return t<0.5?2*t*t:(1-2*(1-t)*(1-t));}

// Events
canvas.addEventListener('mousedown',e=>{
  isDragging=true; prevMouse={x:e.clientX,y:e.clientY};
  canvas.style.cursor='grabbing'; velX=0; velY=0;
});
window.addEventListener('mouseup',()=>{isDragging=false;canvas.style.cursor='grab';});
window.addEventListener('mousemove',e=>{
  if(isDragging){
    const dx=e.clientX-prevMouse.x, dy=e.clientY-prevMouse.y;
    velX=dx*0.008; velY=dy*0.008;
    targetRotY+=dx*0.008; targetRotX+=dy*0.008;
    targetRotX=Math.max(-Math.PI/2,Math.min(Math.PI/2,targetRotX));
    prevMouse={x:e.clientX,y:e.clientY};
    return;
  }
  const rect=canvas.getBoundingClientRect();
  mouse.x=(e.clientX-rect.left)/rect.width*2-1;
  mouse.y=-((e.clientY-rect.top)/rect.height*2-1);
  updateHover(e.clientX,e.clientY);
});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  targetZoom+=e.deltaY*0.003;
  targetZoom=Math.max(1.5,Math.min(5,targetZoom));
},{passive:false});
canvas.addEventListener('dblclick',()=>{
  targetRotX=0; targetRotY=0; targetZoom=2.8;
  velX=0.003; velY=0;
});
canvas.addEventListener('click',e=>{
  if(hoveredMarker){
    const {lat,lon,name}=hoveredMarker.userData;
    flyLabel.style.display='block';
    flyLabel.textContent='flying to '+name+'…';
    flyTarget=latLonToCam(lat,lon,1.7);
    flyStart=camera.position.clone();
    flyStartTime=performance.now();
    flyTime=0;
    setTimeout(()=>{flyLabel.style.display='none';},1400);
  }
});

let lastHit=null;
function updateHover(cx,cy){
  raycaster.setFromCamera(mouse,camera);
  const hitObjs=[sphere,...markers.map(m=>m.children[0])];
  const hits=raycaster.intersectObjects(hitObjs,false);
  if(hits.length){
    const hit=hits[0].object;
    const markerGroup=markers.find(m=>m.children.includes(hit));
    if(markerGroup){
      if(lastHit!==markerGroup){
        lastHit=markerGroup;
        hoveredMarker=markerGroup;
        const rect=canvas.getBoundingClientRect();
        tooltip.style.left=(cx-rect.left+14)+'px';
        tooltip.style.top=(cy-rect.top-36)+'px';
        tooltip.innerHTML=`<span style="font-weight:500;color:#90d0ff;">${markerGroup.userData.name}</span><span style="color:rgba(150,200,255,0.6);margin-left:8px;">pop ${markerGroup.userData.pop}</span>`;
        tooltip.style.display='block';
        markerGroup.children.forEach(c=>{if(c.material)c.material.opacity=1;});
      }
    } else {
      clearHover();
    }
  } else {
    clearHover();
  }
}
function clearHover(){
  if(lastHit){
    lastHit.children.forEach(c=>{if(c.material){c.material.opacity=c.geometry.type==='RingGeometry'?0.9:0.95;}});
  }
  lastHit=null; hoveredMarker=null;
  tooltip.style.display='none';
}

// Touch support
let lastTouchDist=0;
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(e.touches.length===1){isDragging=true;prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};}
  if(e.touches.length===2){lastTouchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
},{passive:false});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  if(e.touches.length===0){isDragging=false;}
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&isDragging){
    const dx=e.touches[0].clientX-prevMouse.x,dy=e.touches[0].clientY-prevMouse.y;
    velX=dx*0.008;velY=dy*0.008;
    targetRotY+=dx*0.008;targetRotX+=dy*0.008;
    targetRotX=Math.max(-Math.PI/2,Math.min(Math.PI/2,targetRotX));
    prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};
  }
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    targetZoom-=(d-lastTouchDist)*0.01;
    targetZoom=Math.max(1.5,Math.min(5,targetZoom));
    lastTouchDist=d;
  }
},{passive:false});

// Resize
window.addEventListener('resize',()=>{
  renderer.setSize(W(),H());
  camera.aspect=W()/H();
  camera.updateProjectionMatrix();
});

// Animate
let autoSpin=true;
canvas.addEventListener('mousedown',()=>{autoSpin=false;});

function animate(t){
  requestAnimationFrame(animate);

  if(!isDragging){
    if(autoSpin) targetRotY+=0.0025;
    velX*=0.92; velY*=0.92;
    targetRotY+=velX; targetRotX+=velY;
  }

  currentRotX=lerp(currentRotX,targetRotX,0.12);
  currentRotY=lerp(currentRotY,targetRotY,0.12);
  globeGroup.rotation.x=currentRotX;
  globeGroup.rotation.y=currentRotY;

  zoom=lerp(zoom,targetZoom,0.1);

  if(flyTarget){
    const elapsed=performance.now()-flyStartTime;
    const prog=Math.min(elapsed/flyDuration,1);
    const e=easeInOut(prog);
    const arc=new THREE.Vector3().lerpVectors(flyStart,flyTarget,e);
    arc.normalize().multiplyScalar(zoom);
    camera.position.copy(arc);
    camera.lookAt(0,0,0);
    if(prog>=1){flyTarget=null;zoom=1.7;targetZoom=1.7;}
  } else {
    camera.position.set(0,0,zoom);
    camera.lookAt(0,0,0);
  }

  // Pulse markers
  markers.forEach(m=>{
    const pulse=0.8+0.2*Math.sin(t*0.003+m.userData.lon*0.05);
    m.children[0].material.opacity=(m===lastHit?1:0.75)*pulse;
  });

  renderer.render(scene,camera);
}
animate(0);
})();
</script>
