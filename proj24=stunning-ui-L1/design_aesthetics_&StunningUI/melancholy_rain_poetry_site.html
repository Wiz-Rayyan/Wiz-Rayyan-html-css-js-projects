
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap');

  .rain-scene {
    background: #1E293B;
    min-height: 580px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    filter: brightness(0.88);
    font-family: 'Cormorant Garamond', Georgia, serif;
  }

  .rain-canvas {
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 6px,
      rgba(174, 210, 240, 0.06) 6px,
      rgba(174, 210, 240, 0.06) 7px
    ),
    repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 14px,
      rgba(174, 210, 240, 0.04) 14px,
      rgba(174, 210, 240, 0.04) 15px
    );
    background-size: 3px 20px, 8px 40px;
    animation: rainfall 0.65s linear infinite;
    pointer-events: none;
  }

  @keyframes rainfall {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 0 20px, 0 40px; }
  }

  .fog-layer {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 140px;
    background: linear-gradient(to top, rgba(15, 25, 45, 0.6), transparent);
    pointer-events: none;
  }

  .street-lamp {
    position: absolute;
    bottom: 60px;
    right: 130px;
    opacity: 0.55;
  }

  .lamp-glow {
    position: absolute;
    top: 28px; left: 50%;
    transform: translateX(-50%);
    width: 60px; height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 230, 150, 0.18) 0%, transparent 70%);
    pointer-events: none;
  }

  .lone-figure {
    position: absolute;
    bottom: 68px;
    left: 90px;
    opacity: 0.28;
  }

  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 0 60px;
    max-width: 520px;
    opacity: 0.92;
  }

  .site-label {
    font-size: 11px;
    letter-spacing: 0.25em;
    color: #7B94B0;
    text-transform: uppercase;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    margin-bottom: 40px;
  }

  .poem-title {
    font-size: 13px;
    color: #8BA5BF;
    letter-spacing: 0.18em;
    font-weight: 300;
    text-transform: uppercase;
    margin-bottom: 20px;
    font-family: 'Cormorant Garamond', serif;
  }

  .poem-text {
    font-size: 22px;
    line-height: 1.9;
    color: #C4D4E3;
    font-weight: 300;
    font-style: italic;
    margin: 0 0 48px;
    font-family: 'Cormorant Garamond', serif;
  }

  .poem-text em {
    color: #A0BDD4;
    font-style: normal;
  }

  .divider {
    width: 1px;
    height: 32px;
    background: linear-gradient(to bottom, transparent, #4A657A, transparent);
    margin: 0 auto 40px;
  }

  .nav {
    display: flex;
    gap: 32px;
    justify-content: center;
  }

  .nav a {
    font-size: 11px;
    color: #4A6578;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 300;
    font-family: 'Cormorant Garamond', serif;
    text-decoration: none;
    cursor: pointer;
    transition: color 0.4s;
  }

  .nav a:hover { color: #8BA5BF; }

  .puddle {
    position: absolute;
    bottom: 52px;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    height: 14px;
    background: radial-gradient(ellipse, rgba(100, 150, 190, 0.12) 0%, transparent 80%);
    border-radius: 50%;
    pointer-events: none;
  }
</style>

<div class="rain-scene" role="img" aria-label="Melancholy poetry site mockup with rain animation, dark blue-gray palette, a lone street lamp, and quiet sad poem">

  <div class="rain-canvas"></div>
  <div class="fog-layer"></div>

  <svg class="street-lamp" width="48" height="180" viewBox="0 0 48 180" fill="none" xmlns="http://www.w3.org/2000/svg">
    <div class="lamp-glow"></div>
    <rect x="22" y="40" width="4" height="140" fill="#4A5F72" rx="2"/>
    <path d="M24 40 Q24 20 38 16" stroke="#4A5F72" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="38" cy="14" rx="8" ry="5" fill="#8BA5BF" opacity="0.5"/>
    <ellipse cx="38" cy="14" rx="4" ry="2.5" fill="#C8DCF0" opacity="0.6"/>
    <ellipse cx="38" cy="20" rx="18" ry="10" fill="rgba(210,230,255,0.07)" rx="50%"/>
    <rect x="20" y="178" width="8" height="2" rx="1" fill="#3A4F62"/>
  </svg>

  <svg class="lone-figure" width="18" height="52" viewBox="0 0 18 52" fill="none">
    <ellipse cx="9" cy="6" rx="4.5" ry="5" fill="#3A5068" opacity="0.9"/>
    <rect x="6" y="11" width="6" height="22" rx="3" fill="#2E4255"/>
    <line x1="6" y1="18" x2="1" y2="28" stroke="#2E4255" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="18" x2="15" y2="26" stroke="#2E4255" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="7" y1="33" x2="5" y2="50" stroke="#2E4255" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="11" y1="33" x2="13" y2="50" stroke="#2E4255" stroke-width="2.5" stroke-linecap="round"/>
  </svg>

  <div class="puddle"></div>

  <div class="content">
    <p class="site-label">Quiet Hours</p>

    <p class="poem-title">Still Waters</p>

    <p class="poem-text">
      the rain does not ask<br>
      where the river ends —<br>
      <em>it simply falls</em><br>
      and falls<br>
      and falls
    </p>

    <div class="divider"></div>

    <nav class="nav" aria-label="Site navigation">
      <a>Poems</a>
      <a>Letters</a>
      <a>Archive</a>
      <a>About</a>
    </nav>
  </div>

</div>
