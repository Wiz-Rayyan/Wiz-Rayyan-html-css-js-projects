
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  #spec-root { background: #000; border-radius: 12px; padding: 0; overflow: hidden; font-family: 'Share Tech Mono', monospace; user-select: none; }
  #spec-root * { box-sizing: border-box; }
  .spec-top { padding: 28px 32px 0; }
  .track-title { color: #0ff; font-size: 18px; letter-spacing: 0.2em; text-transform: uppercase; margin: 0 0 2px; }
  .track-sub { color: #666; font-size: 11px; letter-spacing: 0.15em; margin: 0 0 20px; }
  .bars-wrap { display: flex; align-items: flex-end; justify-content: center; gap: 2px; height: 120px; padding: 0 32px; }
  .bar { width: 5px; border-radius: 2px 2px 0 0; transform-origin: bottom; animation: none; }
  .waveform-wrap { padding: 0 32px; margin: 4px 0; }
  #wavesvg { width: 100%; height: 56px; display: block; }
  .controls-row { display: flex; align-items: center; gap: 20px; padding: 10px 32px 20px; }
  #play-btn { width: 52px; height: 52px; border-radius: 50%; border: 2px solid #0ff; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.2s, box-shadow 0.2s; }
  #play-btn:hover { background: rgba(0,255,255,0.08); box-shadow: 0 0 18px rgba(0,255,255,0.3); }
  #play-btn svg { display: block; }
  .progress-col { flex: 1; }
  .progress-bar-bg { height: 3px; background: #1a1a1a; border-radius: 2px; overflow: hidden; margin-bottom: 8px; cursor: pointer; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #0ff, #f0f); border-radius: 2px; width: 0%; transition: width 0.1s linear; }
  .time-row { display: flex; justify-content: space-between; font-size: 11px; color: #555; }
  .rings-wrap { display: flex; align-items: center; gap: 10px; }
  .ring-label { font-size: 9px; color: #444; letter-spacing: 0.1em; writing-mode: vertical-lr; text-transform: uppercase; }
  .ring-svg { width: 52px; height: 52px; flex-shrink: 0; }
  .meta-row { display: flex; justify-content: space-between; align-items: center; padding: 0 32px 22px; }
  .tag { font-size: 9px; letter-spacing: 0.18em; padding: 4px 10px; border-radius: 10px; text-transform: uppercase; }
  .tag-live { border: 1px solid #f0f; color: #f0f; }
  .tag-hq { border: 1px solid #0ff; color: #0ff; }
  .tag-bpm { border: 1px solid #555; color: #555; }
</style>

<div id="spec-root">
  <div class="spec-top">
    <p class="track-title">Neon Drift</p>
    <p class="track-sub">SYNTHWAVE · 128 BPM · 4:27</p>
  </div>

  <div class="bars-wrap" id="bars-wrap"></div>

  <div class="waveform-wrap">
    <svg id="wavesvg" viewBox="0 0 616 56" preserveAspectRatio="none">
      <polyline id="waveline" points="" fill="none" stroke="#0ff" stroke-width="1.5" opacity="0.7"/>
    </svg>
  </div>

  <div class="controls-row">
    <button id="play-btn" aria-label="Play">
      <svg id="play-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
        <polygon points="5,3 17,10 5,17" fill="#0ff"/>
      </svg>
    </button>
    <div class="progress-col">
      <div class="progress-bar-bg" id="progress-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="time-row">
        <span id="time-cur">0:00</span>
        <span>4:27</span>
      </div>
    </div>
    <div class="rings-wrap">
      <span class="ring-label">LEVEL</span>
      <svg class="ring-svg" viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="22" fill="none" stroke="#111" stroke-width="4"/>
        <circle id="ring1" cx="26" cy="26" r="22" fill="none" stroke="#0ff" stroke-width="4" stroke-dasharray="138.2" stroke-dashoffset="138.2" stroke-linecap="round" transform="rotate(-90 26 26)" opacity="0.85"/>
        <circle cx="26" cy="26" r="14" fill="none" stroke="#111" stroke-width="3"/>
        <circle id="ring2" cx="26" cy="26" r="14" fill="none" stroke="#f0f" stroke-width="3" stroke-dasharray="87.96" stroke-dashoffset="87.96" stroke-linecap="round" transform="rotate(-90 26 26)" opacity="0.7"/>
      </svg>
    </div>
  </div>

  <div class="meta-row">
    <span class="tag tag-live">● Live</span>
    <span class="tag tag-hq">HQ 320kbps</span>
    <span class="tag tag-bpm">128 BPM</span>
  </div>
</div>

<script>
(function(){
  const NUM_BARS = 88;
  const wrap = document.getElementById('bars-wrap');
  const bars = [];
  for(let i = 0; i < NUM_BARS; i++){
    const b = document.createElement('div');
    b.className = 'bar';
    const t = i / (NUM_BARS - 1);
    const hue1 = 180, hue2 = 300;
    const h = Math.round(hue1 + t * (hue2 - hue1));
    b.style.background = `hsl(${h}, 100%, 60%)`;
    b.style.height = '4px';
    wrap.appendChild(b);
    bars.push(b);
  }

  const waveline = document.getElementById('waveline');
  const W = 616, H = 56, MID = H/2;
  const waveSeeds = Array.from({length: W}, () => Math.random() * 2 - 1);

  let playing = false;
  let animId = null;
  let phase = 0;
  let elapsed = 0;
  let lastTs = null;
  const TOTAL = 267;

  const barTargets = new Float32Array(NUM_BARS);
  const barCur = new Float32Array(NUM_BARS);
  let retargetTimer = 0;

  function bassProfile(i){ 
    const t = i / NUM_BARS;
    if(t < 0.12) return 0.85 + Math.random()*0.15;
    if(t < 0.3) return 0.55 + Math.random()*0.35;
    if(t < 0.6) return 0.25 + Math.random()*0.45;
    return 0.05 + Math.random()*0.25;
  }

  function retarget(){
    for(let i=0;i<NUM_BARS;i++) barTargets[i] = bassProfile(i);
  }
  retarget();

  const playBtn = document.getElementById('play-btn');
  const playIcon = document.getElementById('play-icon');
  const progressFill = document.getElementById('progress-fill');
  const timeCur = document.getElementById('time-cur');
  const ring1 = document.getElementById('ring1');
  const ring2 = document.getElementById('ring2');
  const r1circ = 138.2, r2circ = 87.96;

  playBtn.addEventListener('click', toggle);

  function toggle(){
    playing = !playing;
    if(playing){
      playIcon.innerHTML = '<rect x="4" y="3" width="4" height="14" rx="1" fill="#0ff"/><rect x="12" y="3" width="4" height="14" rx="1" fill="#0ff"/>';
      lastTs = null;
      animId = requestAnimationFrame(tick);
    } else {
      playIcon.innerHTML = '<polygon points="5,3 17,10 5,17" fill="#0ff"/>';
      cancelAnimationFrame(animId);
    }
  }

  function fmt(s){ return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'); }

  function tick(ts){
    if(!lastTs) lastTs = ts;
    const dt = (ts - lastTs) / 1000;
    lastTs = ts;
    elapsed = Math.min(elapsed + dt, TOTAL);
    phase += dt * 2.8;
    retargetTimer += dt;
    if(retargetTimer > 0.18){ retargetTimer=0; retarget(); }

    const lerp = 1 - Math.exp(-dt * 12);
    let avgH = 0;
    for(let i=0;i<NUM_BARS;i++){
      barCur[i] += (barTargets[i] - barCur[i]) * lerp;
      const beatPulse = 1 + 0.18 * Math.abs(Math.sin(phase * 1.0 + i * 0.07));
      const h = Math.max(4, Math.round(barCur[i] * 110 * beatPulse));
      bars[i].style.height = h + 'px';
      avgH += barCur[i];
    }
    avgH /= NUM_BARS;

    const pts = [];
    for(let x=0;x<W;x+=3){
      const seed = waveSeeds[x] || 0;
      const y = MID + seed * 14 * avgH + Math.sin(x/35 + phase) * 10 * avgH + Math.sin(x/18 - phase*1.3) * 5 * avgH;
      pts.push(x+','+y.toFixed(1));
    }
    waveline.setAttribute('points', pts.join(' '));

    const prog = elapsed / TOTAL;
    progressFill.style.width = (prog * 100).toFixed(1) + '%';
    timeCur.textContent = fmt(elapsed);

    ring1.setAttribute('stroke-dashoffset', (r1circ * (1 - Math.min(avgH * 1.5, 0.95))).toFixed(1));
    ring2.setAttribute('stroke-dashoffset', (r2circ * (1 - Math.min(avgH * 1.2, 0.85))).toFixed(1));

    if(elapsed < TOTAL) animId = requestAnimationFrame(tick);
    else { playing = false; playIcon.innerHTML = '<polygon points="5,3 17,10 5,17" fill="#0ff"/>'; }
  }
})();
</script>
