
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  #vis-root {
    background: #000;
    min-height: 520px;
    border-radius: 12px;
    padding: 24px;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow: hidden;
    position: relative;
  }
  .top-bar { display: flex; justify-content: space-between; align-items: center; }
  .station-label { color: #0ff; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; }
  .time-display { color: #0ff; font-size: 13px; letter-spacing: 2px; }
  #waveform-svg { width: 100%; height: 60px; display: block; }
  .freq-section { display: flex; flex-direction: column; gap: 8px; }
  .freq-label { color: #555; font-size: 10px; letter-spacing: 3px; }
  #bar-container {
    display: flex;
    align-items: flex-end;
    height: 140px;
    gap: 2px;
    overflow: hidden;
  }
  .bar {
    flex: 1;
    min-width: 2px;
    transform-origin: bottom;
    border-radius: 1px 1px 0 0;
    transition: background 0.1s;
  }
  .controls { display: flex; align-items: center; gap: 20px; }
  #play-btn {
    width: 52px; height: 52px; border-radius: 50%;
    border: 2px solid #0ff;
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    flex-shrink: 0;
  }
  #play-btn::before {
    content: '';
    width: 0; height: 0;
    border-style: solid;
    border-width: 9px 0 9px 16px;
    border-color: transparent transparent transparent #0ff;
    margin-left: 3px;
    transition: all 0.2s;
  }
  #play-btn.playing::before {
    border: none;
    width: 14px; height: 16px;
    border-left: 4px solid #0ff;
    border-right: 4px solid #0ff;
    margin-left: 0;
  }
  #play-btn:hover { box-shadow: 0 0 12px #0ff4; }
  .track-info { flex: 1; }
  .track-name { color: #fff; font-size: 14px; letter-spacing: 1px; }
  .track-sub { color: #555; font-size: 11px; letter-spacing: 2px; margin-top: 3px; }
  .meter-rings { display: flex; gap: 12px; align-items: center; }
  .ring-wrap { position: relative; width: 44px; height: 44px; }
  .ring-wrap svg { width: 44px; height: 44px; }
  .ring-label { position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%); color: #444; font-size: 9px; letter-spacing: 1px; white-space: nowrap; }
  .bottom-strip { display: flex; gap: 4px; align-items: center; }
  .mini-bar { width: 3px; border-radius: 2px; }
  .freq-nums { display: flex; justify-content: space-between; padding: 0 1px; }
  .freq-num { color: #333; font-size: 9px; letter-spacing: 1px; }
</style>

<div id="vis-root">
  <div class="top-bar">
    <div class="station-label">SPECTRUM · FM</div>
    <div class="time-display" id="clock">00:00:00</div>
  </div>

  <svg id="waveform-svg" viewBox="0 0 600 60" preserveAspectRatio="none">
    <polyline id="wave-line" points="" fill="none" stroke="#0ff" stroke-width="1.5" opacity="0.7"/>
    <polyline id="wave-line2" points="" fill="none" stroke="#f0f" stroke-width="0.8" opacity="0.4"/>
  </svg>

  <div class="freq-section">
    <div class="freq-label">FREQUENCY SPECTRUM</div>
    <div id="bar-container"></div>
    <div class="freq-nums">
      <span class="freq-num">20Hz</span>
      <span class="freq-num">200Hz</span>
      <span class="freq-num">1kHz</span>
      <span class="freq-num">5kHz</span>
      <span class="freq-num">20kHz</span>
    </div>
  </div>

  <div class="controls">
    <button id="play-btn" onclick="togglePlay()"></button>
    <div class="track-info">
      <div class="track-name">NEURAL DRIFT</div>
      <div class="track-sub">SYNTHWAVE · 128 BPM</div>
    </div>
    <div class="meter-rings" id="rings"></div>
  </div>

  <div class="bottom-strip" id="mini-strip"></div>
</div>

<script>
const NUM_BARS = 64;
const NUM_MINI = 90;
let isPlaying = false;
let frame = 0;
let bands = new Array(NUM_BARS).fill(0);
let targets = new Array(NUM_BARS).fill(0);
let wavePhase = 0;
let meterVals = [0, 0, 0];
let meterTargets = [0, 0, 0];
let raf;

const container = document.getElementById('bar-container');
const miniStrip = document.getElementById('mini-strip');
const ringsEl = document.getElementById('rings');

function hue(i, n) {
  const t = i / n;
  const r = Math.round(255 * (t < 0.5 ? 0 : (t - 0.5) * 2));
  const g = Math.round(255 * (t < 0.33 ? t * 3 : t < 0.66 ? 1 : 1 - (t - 0.66) * 3));
  const b = Math.round(255 * (t < 0.5 ? 1 - t * 2 : 0));
  return `rgb(${r},${g},${b})`;
}

function gradStyle(i, n, h) {
  const t = i / n;
  const topH = t < 0.5 ? 180 - t * 160 : 20;
  const btH = t < 0.5 ? 120 : 30 + t * 60;
  const sat = 90 + Math.sin(t * Math.PI) * 10;
  return `linear-gradient(to top, hsl(${btH},${sat}%,50%), hsl(${topH},100%,60%))`;
}

for (let i = 0; i < NUM_BARS; i++) {
  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.style.height = '4px';
  bar.style.background = gradStyle(i, NUM_BARS, 0);
  container.appendChild(bar);
}

for (let i = 0; i < NUM_MINI; i++) {
  const mb = document.createElement('div');
  mb.className = 'mini-bar';
  mb.style.height = '8px';
  mb.style.background = '#1a1a1a';
  miniStrip.appendChild(mb);
}

const METER_LABELS = ['L', 'R', 'MID'];
const METER_COLORS = ['#0ff', '#f0f', '#7f7'];
for (let m = 0; m < 3; m++) {
  const wrap = document.createElement('div');
  wrap.className = 'ring-wrap';
  const r = 18, cx = 22, cy = 22, stroke = 3;
  const circ = 2 * Math.PI * r;
  wrap.innerHTML = `<svg viewBox="0 0 44 44">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#1a1a1a" stroke-width="${stroke}"/>
    <circle id="ring${m}" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${METER_COLORS[m]}" stroke-width="${stroke}"
      stroke-dasharray="${circ}" stroke-dashoffset="${circ}" stroke-linecap="round"
      transform="rotate(-90 ${cx} ${cy})" opacity="0.9"/>
    <text x="${cx}" y="${cy+4}" text-anchor="middle" fill="${METER_COLORS[m]}" font-size="9" font-family="Courier New">0</text>
  </svg>
  <div class="ring-label">${METER_LABELS[m]}</div>`;
  ringsEl.appendChild(wrap);
}

function makeTarget(isPlaying) {
  if (!isPlaying) return new Array(NUM_BARS).fill(0);
  const t = [];
  for (let i = 0; i < NUM_BARS; i++) {
    const norm = i / NUM_BARS;
    let base = norm < 0.15 ? 0.6 + Math.random() * 0.4 :
               norm < 0.3  ? 0.4 + Math.random() * 0.5 :
               norm < 0.6  ? 0.2 + Math.random() * 0.5 :
                              0.05 + Math.random() * 0.25;
    base *= 0.7 + 0.3 * Math.sin(frame * 0.04 + i * 0.4);
    t.push(Math.min(1, base));
  }
  return t;
}

function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = `${h}:${m}:${s}`;
}

function updateWave() {
  const svg = document.getElementById('waveform-svg');
  const W = 600, H = 60, mid = 30;
  let pts = '', pts2 = '';
  for (let x = 0; x <= W; x += 4) {
    const t = x / W;
    const amp = isPlaying ? 18 + 10 * Math.sin(t * Math.PI) : 3;
    const y = mid + amp * Math.sin(t * 14 + wavePhase) * Math.sin(t * 3.1 - wavePhase * 0.7);
    const y2 = mid + amp * 0.6 * Math.sin(t * 22 - wavePhase * 1.3 + 1.2) * Math.cos(t * 5 + wavePhase * 0.4);
    pts += `${x},${y} `;
    pts2 += `${x},${y2} `;
  }
  document.getElementById('wave-line').setAttribute('points', pts);
  document.getElementById('wave-line2').setAttribute('points', pts2);
}

function tick() {
  frame++;
  if (frame % 6 === 0) targets = makeTarget(isPlaying);
  wavePhase += isPlaying ? 0.12 : 0.01;

  const bars = container.children;
  for (let i = 0; i < NUM_BARS; i++) {
    bands[i] += (targets[i] - bands[i]) * (isPlaying ? 0.22 : 0.08);
    const h = Math.max(2, bands[i] * 130);
    bars[i].style.height = h + 'px';
    bars[i].style.background = gradStyle(i, NUM_BARS, bands[i]);
  }

  for (let m = 0; m < 3; m++) {
    const v = m === 0 ? bands.slice(0, NUM_BARS/3).reduce((a,b)=>a+b,0)/(NUM_BARS/3) :
              m === 1 ? bands.slice(NUM_BARS/3, 2*NUM_BARS/3).reduce((a,b)=>a+b,0)/(NUM_BARS/3) :
                         bands.slice(2*NUM_BARS/3).reduce((a,b)=>a+b,0)/(NUM_BARS/3);
    meterTargets[m] = v;
    meterVals[m] += (meterTargets[m] - meterVals[m]) * 0.15;
    const r = 18, circ = 2 * Math.PI * r;
    const offset = circ * (1 - meterVals[m]);
    const ringEl = document.getElementById('ring' + m);
    ringEl.setAttribute('stroke-dashoffset', offset);
    const txt = ringEl.nextElementSibling || ringEl.parentElement.querySelector('text');
    const pct = Math.round(meterVals[m] * 100);
    ringEl.parentElement.querySelector('text').textContent = pct;
  }

  const mini = miniStrip.children;
  for (let i = 0; i < NUM_MINI; i++) {
    const norm = i / NUM_MINI;
    const bandIdx = Math.floor(norm * NUM_BARS);
    const v = bands[bandIdx];
    const h = Math.max(4, v * 28 + 4);
    mini[i].style.height = h + 'px';
    const t = norm;
    const r = Math.round(t * 180);
    const b = Math.round((1-t) * 255);
    mini[i].style.background = isPlaying ? `rgb(${r},${Math.round(v*200)},${b})` : '#1a1a1a';
  }

  updateWave();
  if (frame % 30 === 0) updateClock();
  raf = requestAnimationFrame(tick);
}

function togglePlay() {
  isPlaying = !isPlaying;
  document.getElementById('play-btn').classList.toggle('playing', isPlaying);
}

updateClock();
setInterval(updateClock, 1000);
raf = requestAnimationFrame(tick);
</script>
