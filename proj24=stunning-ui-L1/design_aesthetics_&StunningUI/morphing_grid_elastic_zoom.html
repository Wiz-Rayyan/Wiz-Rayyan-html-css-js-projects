
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap');
  :root{--ease-spring:cubic-bezier(0.34,1.56,0.64,1);--ease-snap:cubic-bezier(0.4,0,0.2,1)}
  body{background:transparent}
  #app{font-family:'DM Sans',sans-serif;padding:1rem 0;min-height:600px;position:relative}
  .header{display:flex;align-items:baseline;gap:12px;margin-bottom:1.25rem}
  .header h2{font-family:'DM Serif Display',serif;font-size:22px;font-weight:400;color:var(--color-text-primary)}
  .header span{font-size:13px;color:var(--color-text-secondary)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;position:relative}
  .card{border-radius:10px;overflow:hidden;cursor:zoom-in;position:relative;aspect-ratio:3/4;transform-origin:center center;transition:transform .2s var(--ease-snap);will-change:transform;user-select:none}
  .card:hover{transform:scale(1.03)}
  .card-img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
  .card-label{position:absolute;bottom:0;left:0;right:0;padding:10px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:12px;font-weight:500;letter-spacing:.02em;line-height:1.3;pointer-events:none}
  .card-label small{display:block;font-size:10px;font-weight:300;opacity:.75;margin-top:2px}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:100;pointer-events:none;transition:background .35s ease}
  .overlay.visible{background:rgba(0,0,0,.72);pointer-events:all}
  .detail{position:fixed;z-index:101;border-radius:10px;overflow:hidden;pointer-events:none;will-change:transform,border-radius;background:#111}
  .detail.active{pointer-events:all;cursor:grab}
  .detail.active:active{cursor:grabbing}
  .detail-img{width:100%;height:55%;object-fit:cover;display:block}
  .detail-body{padding:20px 22px 24px;background:#111;color:#fff}
  .detail-tag{display:inline-block;font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#e8c87a;margin-bottom:10px}
  .detail-title{font-family:'DM Serif Display',serif;font-size:26px;font-weight:400;line-height:1.15;color:#fff;margin-bottom:8px;opacity:0;transform:translateY(10px);transition:opacity .25s ease,transform .25s ease}
  .detail-meta{font-size:13px;color:rgba(255,255,255,.55);margin-bottom:14px;opacity:0;transform:translateY(10px);transition:opacity .25s ease .05s,transform .25s ease .05s}
  .detail-desc{font-size:14px;color:rgba(255,255,255,.78);line-height:1.65;opacity:0;transform:translateY(10px);transition:opacity .25s ease .1s,transform .25s ease .1s}
  .detail-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s ease .15s,background .15s ease;backdrop-filter:blur(4px)}
  .detail-close:hover{background:rgba(255,255,255,.28)}
  .detail.content-ready .detail-title,
  .detail.content-ready .detail-meta,
  .detail.content-ready .detail-desc,
  .detail.content-ready .detail-close{opacity:1;transform:none}
  .hint{text-align:center;font-size:12px;color:var(--color-text-secondary);margin-top:1rem;opacity:.7}
  @media(max-width:480px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>

<div id="app">
  <h2 class="sr-only">Morphing grid with elastic zoom — click a card to expand it to full detail view</h2>
  <div class="header">
    <h2>Explore</h2>
    <span>12 items</span>
  </div>
  <div class="grid" id="grid"></div>
  <p class="hint">Click any card to expand · Pinch or drag down to dismiss</p>
</div>

<div class="overlay" id="overlay"></div>
<div class="detail" id="detail">
  <button class="detail-close" id="closeBtn" aria-label="Close detail view">×</button>
  <img class="detail-img" id="detailImg" src="" alt="">
  <div class="detail-body">
    <span class="detail-tag" id="detailTag"></span>
    <h3 class="detail-title" id="detailTitle"></h3>
    <p class="detail-meta" id="detailMeta"></p>
    <p class="detail-desc" id="detailDesc"></p>
  </div>
</div>

<script>
const items=[
  {id:1,color:'#2d4a3e',accent:'#6dbf8f',tag:'Nature',title:'Morning Fog',meta:'Yosemite Valley · 6:14 AM',desc:'Dense fog rolls through the valley floor as sunlight crests the granite walls, casting long amber shadows across the meadow.'},
  {id:2,color:'#3a2d4a',accent:'#b08fd4',tag:'Architecture',title:'Brutalist Forms',meta:'São Paulo · 1972',desc:'Raw concrete geometry frames the sky in a grid of perpendicular shadows, a monument to mid-century ambition and urban scale.'},
  {id:3,color:'#4a3020',accent:'#e0a060',tag:'Street',title:'Night Market',meta:'Bangkok · 9:42 PM',desc:'Steam rises from a hundred woks as vendors call out over the din of motorbikes, neon and incandescent light painting the crowd gold.'},
  {id:4,color:'#1c3a4a',accent:'#5ec0d8',tag:'Ocean',title:'Pelagic Blue',meta:'Pacific · 400m depth',desc:'In the mesopelagic zone, bioluminescent organisms drift in total silence — an ocean layer that has never seen sunlight.'},
  {id:5,color:'#3d2020',accent:'#e06060',tag:'Portrait',title:'Afternoon Light',meta:'Oaxaca · 3:18 PM',desc:'Side light catches dust in the air above the weaving loom, a centuries-old craft performed in the same doorway each afternoon.'},
  {id:6,color:'#2d3d20',accent:'#90c860',tag:'Macro',title:'Spore Cloud',meta:'Oregon Forest · Autumn',desc:'A single puffball releases forty billion spores in a slow exhale, each one a potential mycelial network compressed to invisibility.'},
  {id:7,color:'#3a3020',accent:'#d4a840',tag:'Desert',title:'Salt Flats',meta:'Salar de Uyuni · Midday',desc:'Six billion tonnes of salt form a mirror so vast that weather satellites use it for calibration — the flattest surface on Earth.'},
  {id:8,color:'#20303d',accent:'#4090c0',tag:'Aerial',title:'River Delta',meta:'Mississippi · 1200m',desc:'The river meets the Gulf in a fractal fan of sediment channels, each branch a different shade of brown, green, and pewter.'},
  {id:9,color:'#3d2030',accent:'#d060a0',tag:'Abstract',title:'Chromatic Blur',meta:'Studio · Long exposure',desc:'Twelve coloured gels on a spinning rig, photographed at 1/4 second — the image required forty-seven attempts to achieve this balance.'},
  {id:10,color:'#203a20',accent:'#60c068',tag:'Wildlife',title:'Murmuration',meta:'Rome · November dusk',desc:'Three hundred thousand starlings perform a fluid geometry that no individual bird choreographs — an emergent intelligence made of wings.'},
  {id:11,color:'#2a2a3d',accent:'#7070d4',tag:'Space',title:'Nebular Drift',meta:'NGC 2237 · 5200 ly',desc:'Hydrogen clouds collapse under gravity in a region where new stars have been forming for the past five million years without pause.'},
  {id:12,color:'#3d3020',accent:'#c09040',tag:'Urban',title:'Grid & Shadow',meta:'Manhattan · 2 PM',desc:'Twice a year the street grid aligns with the setting sun, flooding canyons of glass and steel with unobstructed horizontal light.'}
];

const grid=document.getElementById('grid');
const detail=document.getElementById('detail');
const overlay=document.getElementById('overlay');
const closeBtn=document.getElementById('closeBtn');

let activeCard=null,isOpen=false,animating=false;
let dragStartY=0,dragCurrentY=0,isDragging=false;
let pinchStartDist=0,pinchActive=false;

function makeCard(item){
  const el=document.createElement('div');
  el.className='card';
  el.dataset.id=item.id;
  el.style.background=item.color;
  el.innerHTML=`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;padding:12px">
    <div style="width:36px;height:36px;border-radius:50%;background:${item.accent}26;border:1.5px solid ${item.accent}60;display:flex;align-items:center;justify-content:center">
      <div style="width:14px;height:14px;border-radius:50%;background:${item.accent}"></div>
    </div>
    <div style="height:3px;width:40%;background:${item.accent}40;border-radius:2px;margin-top:4px"></div>
    <div style="height:2px;width:60%;background:${item.accent}25;border-radius:2px"></div>
  </div>
  <div class="card-label">${item.title}<small>${item.tag}</small></div>`;
  el.addEventListener('click',()=>openCard(el,item));
  el.addEventListener('touchstart',onTouchStart,{passive:true});
  el.addEventListener('touchmove',onTouchMoveCard,{passive:false});
  el.addEventListener('touchend',onTouchEndCard,{passive:true});
  return el;
}

items.forEach(item=>grid.appendChild(makeCard(item)));

function openCard(cardEl,item){
  if(isOpen||animating)return;
  animating=true;
  activeCard=cardEl;
  const rect=cardEl.getBoundingClientRect();
  const vw=window.innerWidth,vh=window.innerHeight;
  const targetW=Math.min(vw*0.88,400);
  const targetH=Math.min(vh*0.82,580);
  const targetX=(vw-targetW)/2;
  const targetY=(vh-targetH)/2;
  detail.style.cssText=`left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;height:${rect.height}px;border-radius:10px;transition:none;position:fixed`;
  detail.style.background=item.color;
  document.getElementById('detailImg').style.cssText='opacity:0';
  document.getElementById('detailImg').style.background=item.color;
  document.getElementById('detailTag').textContent=item.tag;
  document.getElementById('detailTitle').textContent=item.title;
  document.getElementById('detailMeta').textContent=item.meta;
  document.getElementById('detailDesc').textContent=item.desc;
  detail.classList.remove('content-ready','active');
  overlay.classList.add('visible');
  cardEl.style.opacity='0';
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      detail.style.transition='left .42s var(--ease-spring),top .42s var(--ease-spring),width .42s var(--ease-spring),height .42s var(--ease-spring),border-radius .35s ease';
      detail.style.left=targetX+'px';
      detail.style.top=targetY+'px';
      detail.style.width=targetW+'px';
      detail.style.height=targetH+'px';
      detail.style.borderRadius='16px';
      detail.style.background='#111';
      document.getElementById('detailImg').style.cssText='opacity:1;transition:opacity .25s ease .2s';
      setTimeout(()=>{
        detail.classList.add('active','content-ready');
        isOpen=true;animating=false;
      },420);
    });
  });
}

function closeDetail(){
  if(!isOpen||animating||!activeCard)return;
  animating=true;
  detail.classList.remove('content-ready');
  const rect=activeCard.getBoundingClientRect();
  overlay.classList.remove('visible');
  setTimeout(()=>{
    detail.style.transition='left .38s var(--ease-snap),top .38s var(--ease-snap),width .38s var(--ease-snap),height .38s var(--ease-snap),border-radius .3s ease,opacity .3s ease';
    detail.style.left=rect.left+'px';
    detail.style.top=rect.top+'px';
    detail.style.width=rect.width+'px';
    detail.style.height=rect.height+'px';
    detail.style.borderRadius='10px';
    detail.style.opacity='0';
  },60);
  setTimeout(()=>{
    detail.classList.remove('active');
    detail.style.opacity='1';
    activeCard.style.opacity='1';
    activeCard=null;
    isOpen=false;animating=false;
    isDragging=false;
    detail.style.transform='';
  },440);
}

overlay.addEventListener('click',closeDetail);
closeBtn.addEventListener('click',closeDetail);

let dragBaseTop=0;
detail.addEventListener('mousedown',e=>{
  if(!isOpen)return;
  isDragging=true;
  dragStartY=e.clientY;
  dragBaseTop=parseFloat(detail.style.top)||0;
  detail.style.transition='none';
});
window.addEventListener('mousemove',e=>{
  if(!isDragging||!isOpen)return;
  const dy=e.clientY-dragStartY;
  detail.style.top=(dragBaseTop+dy)+'px';
  const progress=Math.min(Math.abs(dy)/180,1);
  overlay.style.background=`rgba(0,0,0,${0.72*(1-progress)})`;
});
window.addEventListener('mouseup',e=>{
  if(!isDragging)return;
  isDragging=false;
  const dy=e.clientY-dragStartY;
  if(Math.abs(dy)>90)closeDetail();
  else{
    const vw=window.innerWidth,vh=window.innerHeight;
    const tw=Math.min(vw*.88,400),th=Math.min(vh*.82,580);
    detail.style.transition='top .35s var(--ease-spring)';
    detail.style.top=((vh-th)/2)+'px';
    overlay.style.background='rgba(0,0,0,0.72)';
  }
});

detail.addEventListener('touchstart',e=>{
  if(!isOpen)return;
  if(e.touches.length===2){
    pinchActive=true;
    pinchStartDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  } else if(e.touches.length===1){
    isDragging=true;
    dragStartY=e.touches[0].clientY;
    dragBaseTop=parseFloat(detail.style.top)||0;
    detail.style.transition='none';
  }
},{passive:true});

detail.addEventListener('touchmove',e=>{
  if(!isOpen)return;
  if(pinchActive&&e.touches.length===2){
    e.preventDefault();
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(d<pinchStartDist*0.7)closeDetail();
  } else if(isDragging&&e.touches.length===1){
    e.preventDefault();
    const dy=e.touches[0].clientY-dragStartY;
    if(dy>0){
      detail.style.top=(dragBaseTop+dy)+'px';
      const progress=Math.min(dy/180,1);
      overlay.style.background=`rgba(0,0,0,${0.72*(1-progress)})`;
    }
  }
},{passive:false});

detail.addEventListener('touchend',e=>{
  if(pinchActive){pinchActive=false;return}
  if(!isDragging)return;
  isDragging=false;
  const touch=e.changedTouches[0];
  const dy=touch.clientY-dragStartY;
  if(dy>90)closeDetail();
  else{
    const vw=window.innerWidth,vh=window.innerHeight;
    const tw=Math.min(vw*.88,400),th=Math.min(vh*.82,580);
    detail.style.transition='top .35s var(--ease-spring)';
    detail.style.top=((vh-th)/2)+'px';
    overlay.style.background='rgba(0,0,0,0.72)';
  }
},{passive:true});

function onTouchStart(e){
  if(isOpen)return;
  if(e.touches.length===2){
    pinchActive=true;
    pinchStartDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  }
}
function onTouchMoveCard(e){
  if(!pinchActive||e.touches.length!==2)return;
  e.preventDefault();
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  const card=e.currentTarget;
  const item=items.find(i=>i.id==card.dataset.id);
  if(d>pinchStartDist*1.3&&!isOpen)openCard(card,item);
}
function onTouchEndCard(){pinchActive=false}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&isOpen)closeDetail()});
</script>
