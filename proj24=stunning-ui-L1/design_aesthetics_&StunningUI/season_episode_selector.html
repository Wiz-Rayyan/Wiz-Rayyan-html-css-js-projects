
<style>
  :root { --ep-thumb-h: 108px; }
  .sel-header { padding: 1.25rem 0 0; }
  .sel-controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .sel-meta { font-size: 13px; color: var(--color-text-secondary); margin-left: auto; }
  .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .ep-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; cursor: pointer; transition: border-color 0.15s, transform 0.12s; position: relative; }
  .ep-card:hover { border-color: var(--color-border-secondary); transform: translateY(-2px); }
  .ep-card.playing { border: 2px solid #3B6D11; }
  .ep-thumb { position: relative; height: var(--ep-thumb-h); background: var(--color-background-secondary); overflow: hidden; }
  .ep-thumb-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ep-thumb-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 28px; color: var(--color-text-tertiary); }
  .ep-play-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.42); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.15s; border-radius: 0; }
  .ep-card:hover .ep-play-overlay { opacity: 1; }
  .ep-play-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; }
  .ep-play-btn i { font-size: 18px; color: #222; margin-left: 2px; }
  .ep-watched-badge { position: absolute; top: 7px; right: 7px; width: 22px; height: 22px; border-radius: 50%; background: #3B6D11; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
  .ep-watched-badge i { font-size: 12px; color: #fff; }
  .ep-progress-bar { position: absolute; bottom: 0; left: 0; height: 3px; background: #3B6D11; transition: width 0.3s; }
  .ep-body { padding: 10px 12px 12px; }
  .ep-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .ep-num { font-size: 11px; color: var(--color-text-tertiary); font-weight: 500; letter-spacing: 0.03em; text-transform: uppercase; }
  .ep-dur { font-size: 11px; color: var(--color-text-tertiary); }
  .ep-title { font-size: 13px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 5px; line-height: 1.3; }
  .ep-desc { font-size: 12px; color: var(--color-text-secondary); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .now-playing-bar { display: none; align-items: center; gap: 12px; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 10px 14px; margin-bottom: 1.25rem; font-size: 13px; }
  .now-playing-bar.visible { display: flex; }
  .np-dot { width: 8px; height: 8px; border-radius: 50%; background: #3B6D11; animation: pulse 1.4s ease-in-out infinite; flex-shrink: 0; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }
  .np-label { color: var(--color-text-secondary); }
  .np-title { color: var(--color-text-primary); font-weight: 500; }
  select { font-size: 14px; padding: 7px 12px; min-width: 160px; }
</style>

<h2 class="sr-only">Season and episode selector — pick a season and click an episode to play</h2>

<div class="sel-header">
  <div class="sel-controls">
    <select id="season-select" aria-label="Select season"></select>
    <span class="sel-meta" id="ep-count"></span>
  </div>
  <div class="now-playing-bar" id="now-playing">
    <span class="np-dot" aria-hidden="true"></span>
    <span class="np-label">Now playing —</span>
    <span class="np-title" id="np-title"></span>
  </div>
  <div class="ep-grid" id="ep-grid"></div>
</div>

<script>
const SHOW = {
  title: "Stellar Drift",
  seasons: [
    {
      id: 1, label: "Season 1",
      episodes: [
        { n:1, title:"Pilot", dur:"52m", desc:"The crew of the Helios makes first contact with an anomaly beyond known space.", watched:true, progress:100, color:"#1a3a5c" },
        { n:2, title:"The Long Dark", dur:"48m", desc:"A power failure leaves the ship adrift as tensions rise among the crew.", watched:true, progress:100, color:"#2a1a4a" },
        { n:3, title:"Signal Lost", dur:"51m", desc:"A mysterious broadcast leads the Helios into a region of unexplored space.", watched:true, progress:100, color:"#1a3a2a" },
        { n:4, title:"Fractured Light", dur:"46m", desc:"Dr. Voss discovers the anomaly may be sentient — and watching them.", watched:false, progress:62, color:"#3a2a1a" },
        { n:5, title:"Gravity's Edge", dur:"55m", desc:"A daring EVA mission to retrieve a probe goes wrong when the hull begins to fail.", watched:false, progress:0, color:"#1a2a3a" },
        { n:6, title:"Into the Fold", dur:"58m", desc:"The season finale. The crew must make an impossible choice as the anomaly expands.", watched:false, progress:0, color:"#3a1a2a" },
      ]
    },
    {
      id: 2, label: "Season 2",
      episodes: [
        { n:1, title:"New Horizons", dur:"54m", desc:"Six months later. The crew returns to discover Earth has changed in their absence.", watched:false, progress:0, color:"#2a1a1a" },
        { n:2, title:"The Quiet War", dur:"49m", desc:"Political factions on Earth vie for control of the Helios mission data.", watched:false, progress:0, color:"#1a1a3a" },
        { n:3, title:"Echoes", dur:"47m", desc:"Commander Torres experiences visions from inside the anomaly she cannot explain.", watched:false, progress:0, color:"#1a3a1a" },
        { n:4, title:"Fault Lines", dur:"53m", desc:"A crew member goes missing during a routine survey — or did they ever exist?", watched:false, progress:0, color:"#2a2a1a" },
        { n:5, title:"Dark Matter", dur:"50m", desc:"The anomaly sends a message. It knows their names. It knows their secrets.", watched:false, progress:0, color:"#3a1a3a" },
        { n:6, title:"Threshold", dur:"44m", desc:"Yuna risks everything on a solo mission to communicate with the anomaly directly.", watched:false, progress:0, color:"#1a2a1a" },
        { n:7, title:"The Return", dur:"62m", desc:"A two-part season finale. Not everyone will make it home.", watched:false, progress:0, color:"#2a1a3a" },
      ]
    },
    {
      id: 3, label: "Season 3",
      episodes: [
        { n:1, title:"Reckoning", dur:"56m", desc:"Two years on. A new anomaly is detected — this one is closer to Earth.", watched:false, progress:0, color:"#1a3a3a" },
        { n:2, title:"The Other Side", dur:"51m", desc:"For the first time, someone crosses through the anomaly and returns.", watched:false, progress:0, color:"#3a2a3a" },
        { n:3, title:"Inheritance", dur:"48m", desc:"What the traveller brings back will change humanity's understanding of time.", watched:false, progress:0, color:"#3a3a1a" },
        { n:4, title:"Zero Point", dur:"53m", desc:"The crew discovers the anomalies are not random — they form a pattern.", watched:false, progress:0, color:"#1a1a2a" },
      ]
    }
  ]
};

let currentSeason = 0;
let playingEp = null;

const seasonSelect = document.getElementById('season-select');
const epGrid = document.getElementById('ep-grid');
const epCount = document.getElementById('ep-count');
const nowPlaying = document.getElementById('now-playing');
const npTitle = document.getElementById('np-title');

SHOW.seasons.forEach((s, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = s.label;
  seasonSelect.appendChild(opt);
});

function thumb(ep) {
  const svg = `<svg viewBox="0 0 320 108" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <rect width="320" height="108" fill="${ep.color}"/>
    ${Array.from({length:40}, (_,i) => {
      const x = Math.sin(i*137.5)*140+160, y = Math.cos(i*97.3)*44+54;
      const r = Math.random()*1.5+0.4;
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="rgba(255,255,255,${(Math.random()*0.6+0.2).toFixed(2)})"/>`;
    }).join('')}
    <text x="160" y="62" text-anchor="middle" font-family="sans-serif" font-size="13" fill="rgba(255,255,255,0.55)" font-weight="500">E${ep.n}</text>
  </svg>`;
  return `data:image/svg+xml;base64,${btoa(svg)}`;
}

function renderGrid(seasonIdx) {
  const season = SHOW.seasons[seasonIdx];
  const eps = season.episodes;
  epCount.textContent = `${eps.length} episode${eps.length !== 1 ? 's' : ''} · ${eps.filter(e=>e.watched).length} watched`;
  epGrid.innerHTML = eps.map((ep, i) => {
    const isPlaying = playingEp && playingEp.seasonIdx === seasonIdx && playingEp.epIdx === i;
    return `
    <div class="ep-card${isPlaying ? ' playing' : ''}" data-s="${seasonIdx}" data-e="${i}" role="button" tabindex="0" aria-label="Play ${ep.title}">
      <div class="ep-thumb">
        <img class="ep-thumb-img" src="${thumb(ep)}" alt="" aria-hidden="true">
        <div class="ep-play-overlay" aria-hidden="true">
          <button class="ep-play-btn" tabindex="-1"><i class="ti ti-player-play"></i></button>
        </div>
        ${ep.watched ? `<div class="ep-watched-badge" title="Watched"><i class="ti ti-check"></i></div>` : ''}
        ${ep.progress > 0 && ep.progress < 100 ? `<div class="ep-progress-bar" style="width:${ep.progress}%"></div>` : ''}
      </div>
      <div class="ep-body">
        <div class="ep-row">
          <span class="ep-num">Ep ${ep.n}</span>
          <span class="ep-dur"><i class="ti ti-clock" style="font-size:11px;vertical-align:-1px;margin-right:2px" aria-hidden="true"></i>${ep.dur}</span>
        </div>
        <div class="ep-title">${ep.title}</div>
        <div class="ep-desc">${ep.desc}</div>
      </div>
    </div>`;
  }).join('');

  document.querySelectorAll('.ep-card').forEach(card => {
    const handler = () => {
      const s = parseInt(card.dataset.s), e = parseInt(card.dataset.e);
      playEpisode(s, e);
    };
    card.addEventListener('click', handler);
    card.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') handler(); });
  });
}

function playEpisode(seasonIdx, epIdx) {
  const ep = SHOW.seasons[seasonIdx].episodes[epIdx];
  playingEp = { seasonIdx, epIdx };
  if (ep.progress === 0) ep.progress = 5;
  npTitle.textContent = `${SHOW.seasons[seasonIdx].label} · E${ep.n} — ${ep.title}`;
  nowPlaying.classList.add('visible');
  renderGrid(currentSeason);
}

seasonSelect.addEventListener('change', () => {
  currentSeason = parseInt(seasonSelect.value);
  renderGrid(currentSeason);
});

renderGrid(0);
</script>
