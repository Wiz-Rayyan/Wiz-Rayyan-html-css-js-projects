
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .phone-shell {
    width: 320px;
    height: 580px;
    background: #f5f5f5;
    border-radius: 40px;
    border: 8px solid #222;
    overflow: hidden;
    position: relative;
    margin: 1.5rem auto;
    box-shadow: 0 2px 24px rgba(0,0,0,0.18);
  }

  .phone-notch {
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 100px; height: 22px;
    background: #222;
    border-radius: 0 0 16px 16px;
    z-index: 10;
  }

  .site-page {
    width: 100%;
    height: 100%;
    background: #fff;
    position: relative;
    overflow: hidden;
  }

  .site-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 32px 20px 16px;
    position: relative;
    z-index: 1;
  }

  .logo {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: #0a0a0a;
    font-family: sans-serif;
    text-transform: uppercase;
  }

  .site-body {
    padding: 12px 20px;
  }

  .placeholder-hero {
    width: 100%;
    height: 140px;
    background: #f0f0f0;
    border-radius: 12px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #bbb;
    font-size: 12px;
    font-family: sans-serif;
  }

  .placeholder-text {
    height: 10px;
    background: #f0f0f0;
    border-radius: 6px;
    margin-bottom: 8px;
  }

  .hamburger-btn {
    width: 32px;
    height: 28px;
    background: none;
    border: none;
    cursor: pointer;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0;
    padding: 0;
  }

  .ham-line {
    display: block;
    width: 24px;
    height: 2px;
    background: #0a0a0a;
    border-radius: 1px;
    position: absolute;
    left: 4px;
    transition: transform 0.38s cubic-bezier(0.23, 1, 0.32, 1),
                opacity 0.28s ease;
    transform-origin: center center;
  }

  .ham-line-top    { top: 6px; }
  .ham-line-mid    { top: 13px; }
  .ham-line-bottom { top: 20px; }

  .hamburger-btn.is-open .ham-line-top {
    transform: translateY(7px) rotate(45deg);
  }
  .hamburger-btn.is-open .ham-line-mid {
    opacity: 0;
    transform: scaleX(0.4);
  }
  .hamburger-btn.is-open .ham-line-bottom {
    transform: translateY(-7px) rotate(-45deg);
  }

  .fullscreen-menu {
    position: absolute;
    inset: 0;
    background: #0a0a0a;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.38s cubic-bezier(0.23, 1, 0.32, 1);
  }

  .fullscreen-menu.is-open {
    opacity: 1;
    pointer-events: all;
  }

  .close-btn {
    position: absolute;
    top: 28px;
    right: 20px;
    width: 32px;
    height: 32px;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .close-btn svg {
    width: 20px;
    height: 20px;
    stroke: #ffffff;
    stroke-width: 2;
  }

  .nav-links {
    list-style: none;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .nav-links li {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.23, 1, 0.32, 1);
  }

  .fullscreen-menu.is-open .nav-links li:nth-child(1) { opacity: 1; transform: translateY(0); transition-delay: 0.08s; }
  .fullscreen-menu.is-open .nav-links li:nth-child(2) { opacity: 1; transform: translateY(0); transition-delay: 0.13s; }
  .fullscreen-menu.is-open .nav-links li:nth-child(3) { opacity: 1; transform: translateY(0); transition-delay: 0.18s; }
  .fullscreen-menu.is-open .nav-links li:nth-child(4) { opacity: 1; transform: translateY(0); transition-delay: 0.23s; }
  .fullscreen-menu.is-open .nav-links li:nth-child(5) { opacity: 1; transform: translateY(0); transition-delay: 0.28s; }

  .nav-links a {
    font-size: 32px;
    font-weight: 600;
    color: #ffffff;
    text-decoration: none;
    letter-spacing: -0.02em;
    font-family: sans-serif;
    line-height: 1.3;
    transition: color 0.2s ease;
    display: inline-block;
    position: relative;
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    left: 0; bottom: 0;
    width: 0; height: 2px;
    background: #fff;
    transition: width 0.3s ease;
  }

  .nav-links a:hover { color: rgba(255,255,255,0.5); }

  .menu-footer {
    position: absolute;
    bottom: 28px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    opacity: 0;
    transition: opacity 0.5s ease 0.35s;
  }

  .fullscreen-menu.is-open .menu-footer {
    opacity: 1;
  }

  .menu-footer span {
    font-size: 10px;
    color: rgba(255,255,255,0.3);
    font-family: sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .scroll-note {
    text-align: center;
    font-size: 12px;
    color: var(--color-text-secondary);
    font-family: sans-serif;
    margin: 0 auto 0.5rem;
    opacity: 0.7;
  }
</style>

<p class="scroll-note">Tap the menu icon to interact</p>

<div class="phone-shell">
  <div class="phone-notch"></div>

  <div class="site-page" id="sitePage">
    <header class="site-header">
      <span class="logo">Studio</span>
      <button class="hamburger-btn" id="hamBtn" aria-label="Open menu">
        <span class="ham-line ham-line-top"></span>
        <span class="ham-line ham-line-mid"></span>
        <span class="ham-line ham-line-bottom"></span>
      </button>
    </header>

    <div class="site-body">
      <div class="placeholder-hero" style="font-family:sans-serif;">hero image</div>
      <div class="placeholder-text" style="width:80%"></div>
      <div class="placeholder-text" style="width:60%"></div>
      <div class="placeholder-text" style="width:90%;margin-top:14px"></div>
      <div class="placeholder-text" style="width:70%"></div>
    </div>

    <nav class="fullscreen-menu" id="fullMenu" role="dialog" aria-label="Navigation menu">
      <button class="close-btn" id="closeBtn" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="5" y1="5" x2="19" y2="19"/>
          <line x1="19" y1="5" x2="5" y2="19"/>
        </svg>
      </button>

      <ul class="nav-links">
        <li><a href="#">Work</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Journal</a></li>
        <li><a href="#">Contact</a></li>
      </ul>

      <div class="menu-footer">
        <span>© 2026 Studio</span>
        <span>IG &nbsp;TW &nbsp;LI</span>
      </div>
    </nav>
  </div>
</div>

<script>
  const hamBtn = document.getElementById('hamBtn');
  const closeBtn = document.getElementById('closeBtn');
  const fullMenu = document.getElementById('fullMenu');

  function openMenu() {
    hamBtn.classList.add('is-open');
    fullMenu.classList.add('is-open');
  }

  function closeMenu() {
    hamBtn.classList.remove('is-open');
    fullMenu.classList.remove('is-open');
  }

  hamBtn.addEventListener('click', openMenu);
  closeBtn.addEventListener('click', closeMenu);

  fullMenu.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', e => { e.preventDefault(); closeMenu(); });
  });
</script>
