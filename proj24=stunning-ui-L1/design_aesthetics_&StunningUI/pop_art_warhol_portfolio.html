  .pop-wrap {
    background: #FFE000;
    font-family: Impact, Anton, 'Arial Narrow', sans-serif;
    padding: 0;
    overflow: hidden;
  }
  .pop-header {
    background: #000;
    color: #FFE000;
    text-align: center;
    padding: 18px 0 12px;
    font-size: 42px;
    letter-spacing: 6px;
    border-bottom: 5px solid #E8003A;
    text-shadow: 4px 4px 0 #E8003A;
  }
  .pop-sub {
    background: #E8003A;
    color: #fff;
    text-align: center;
    font-size: 15px;
    letter-spacing: 3px;
    padding: 6px 0;
    border-bottom: 4px solid #000;
  }
  .dots-bg {
    background-image: radial-gradient(circle, #00B4D8 1.5px, transparent 1.5px),
                      radial-gradient(circle, #E8003A 1.5px, transparent 1.5px),
                      radial-gradient(circle, #FFE000 1.5px, transparent 1.5px);
    background-size: 18px 18px, 18px 18px, 18px 18px;
    background-position: 0 0, 9px 9px, 4px 14px;
    background-color: #fff;
    padding: 20px 16px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
  }
  .panel {
    border: 4px solid #000;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.08s;
  }
  .panel:hover { transform: scale(1.04); z-index: 2; }
  .panel svg { width: 100%; height: 100%; }
  .p1 { background: #00B4D8; }
  .p2 { background: #E8003A; }
  .p3 { background: #FFE000; }
  .p4 { background: #7B2FBE; }
  .p5 { background: #FF6B00; }
  .p6 { background: #E8003A; }
  .p7 { background: #00B4D8; }
  .p8 { background: #FFE000; }
  .caption-bar {
    background: #000;
    color: #FFE000;
    font-size: 11px;
    letter-spacing: 2px;
    text-align: center;
    padding: 5px 2px;
    border-top: 3px solid #E8003A;
  }
  .speech {
    background: #fff;
    border: 3px solid #000;
    border-radius: 8px 8px 8px 0;
    font-family: Impact, sans-serif;
    font-size: 11px;
    padding: 4px 6px;
    position: absolute;
    top: 6px; left: 6px;
    max-width: 75%;
    line-height: 1.2;
    color: #000;
    z-index: 3;
  }
  .bottom-strip {
    background: #E8003A;
    border-top: 5px solid #000;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 10px 0;
  }
  .bottom-strip span {
    color: #FFE000;
    font-size: 13px;
    letter-spacing: 2px;
    text-shadow: 2px 2px 0 #000;
  }
  .halftone-overlay {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(0,0,0,0.18) 1px, transparent 1px);
    background-size: 6px 6px;
    pointer-events: none;
  }
</style>
