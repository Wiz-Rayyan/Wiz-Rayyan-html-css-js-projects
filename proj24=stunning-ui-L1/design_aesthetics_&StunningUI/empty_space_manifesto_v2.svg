<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg" style="">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Empty space manifesto v2</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Vast whitespace with sparse, faint text elements drifting across the canvas at low opacity.</desc>

  <text x="72" y="98" text-anchor="start" font-family="var(--font-serif)" font-size="52" font-weight="400" fill="var(--color-text-primary)" opacity="0.06" letter-spacing="-0.02em" style="fill:rgb(250, 249, 245);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.06;font-family:&quot;Anthropic Serif&quot;, Georgia, &quot;Times New Roman&quot;, serif;font-size:52px;font-weight:400;text-anchor:start;dominant-baseline:auto">silence</text>

  <text x="340" y="210" text-anchor="middle" font-family="var(--font-sans)" font-size="10" fill="var(--color-text-primary)" opacity="0.18" letter-spacing="0.18em" style="fill:rgb(250, 249, 245);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.18;font-family:&quot;Anthropic Sans&quot;, sans-serif;font-size:10px;font-weight:400;text-anchor:middle;dominant-baseline:auto">NOTHING IS MISSING</text>

  <line x1="260" y1="268" x2="420" y2="268" stroke="var(--color-text-primary)" stroke-width="0.4" opacity="0.12" style="fill:rgb(0, 0, 0);stroke:rgb(250, 249, 245);color:rgb(255, 255, 255);stroke-width:0.4px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.12;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <text x="618" y="310" text-anchor="end" font-family="var(--font-serif)" font-size="11" font-style="italic" fill="var(--color-text-primary)" opacity="0.22" letter-spacing="0.03em" style="fill:rgb(250, 249, 245);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.22;font-family:&quot;Anthropic Serif&quot;, Georgia, &quot;Times New Roman&quot;, serif;font-size:11px;font-weight:400;font-style:italic;text-anchor:end;dominant-baseline:auto">you are still here.</text>

  <text x="618" y="488" text-anchor="end" font-family="var(--font-serif)" font-size="11" font-style="italic" fill="var(--color-text-primary)" opacity="0.28" letter-spacing="0.04em" style="fill:rgb(250, 249, 245);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.28;font-family:&quot;Anthropic Serif&quot;, Georgia, &quot;Times New Roman&quot;, serif;font-size:11px;font-weight:400;font-style:italic;text-anchor:end;dominant-baseline:auto">the absence is the design.</text>
</svg>