
<h2 class="sr-only">Interactive WebGL shader hero with full-screen plasma background, mouse-reactive noise, and text overlay with backdrop-filter blur</h2>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
#shader-root {
  position: relative;
  width: 100%;
  height: 520px;
  overflow: hidden;
  border-radius: 12px;
  cursor: crosshair;
  font-family: 'Courier New', monospace;
}
canvas#glcanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
.hero-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.hero-card {
  background: rgba(0,0,0,0.28);
  backdrop-filter: blur(12px) saturate(1.4);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 16px;
  padding: 2.5rem 3.5rem;
  text-align: center;
  max-width: 460px;
}
.eyebrow {
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(180,255,230,0.7);
  margin-bottom: 1rem;
}
.hero-title {
  font-family: 'Georgia', serif;
  font-size: 2.6rem;
  font-weight: 400;
  color: #fff;
  line-height: 1.15;
  letter-spacing: -0.02em;
  margin-bottom: 1rem;
}
.hero-title span {
  background: linear-gradient(135deg, #6ef9d2, #a78bfa, #f472b6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero-sub {
  font-size: 13px;
  color: rgba(255,255,255,0.55);
  line-height: 1.7;
  letter-spacing: 0.02em;
}
.coords {
  position: absolute;
  bottom: 16px;
  right: 20px;
  font-size: 10px;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.25);
  font-family: 'Courier New', monospace;
}
.mode-btn {
  position: absolute;
  top: 16px;
  right: 16px;
  pointer-events: all;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.6);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 6px 12px;
  border-radius: 20px;
  cursor: pointer;
}
.mode-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }
</style>

<div id="shader-root">
  <canvas id="glcanvas"></canvas>
  <div class="hero-overlay">
    <div class="hero-card">
      <p class="eyebrow">WebGL Fragment Shader</p>
      <h1 class="hero-title">Liquid<br><span>Plasma</span><br>Reality</h1>
      <p class="hero-sub">Mouse-reactive noise fields.<br>Move your cursor across the canvas.</p>
    </div>
  </div>
  <div class="coords" id="coords">0.000 / 0.000</div>
  <button class="mode-btn" id="mode-btn">Fractal</button>
</div>

<script>
(function() {
  const root = document.getElementById('shader-root');
  const canvas = document.getElementById('glcanvas');
  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;

  const VS = `
    attribute vec2 a_pos;
    void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
  `;

  const PLASMA_FS = `
    precision highp float;
    uniform float u_time;
    uniform vec2 u_res;
    uniform vec2 u_mouse;

    vec3 hash3(vec2 p) {
      vec3 q = vec3(dot(p, vec2(127.1,311.7)), dot(p, vec2(269.5,183.3)), dot(p, vec2(419.2,371.9)));
      return fract(sin(q) * 43758.5453);
    }

    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      float a = dot(hash3(i).xy, vec2(1.0));
      float b = dot(hash3(i + vec2(1,0)).xy, vec2(1.0));
      float c = dot(hash3(i + vec2(0,1)).xy, vec2(1.0));
      float d = dot(hash3(i + vec2(1,1)).xy, vec2(1.0));
      return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
    }

    float fbm(vec2 p) {
      float v = 0.0, a = 0.5;
      mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
      for (int i = 0; i < 6; i++) { v += a * noise(p); p = m * p; a *= 0.5; }
      return v;
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / u_res;
      vec2 m = u_mouse / u_res;
      float t = u_time * 0.18;

      vec2 q = vec2(fbm(uv + t * 0.4), fbm(uv + 1.0));
      vec2 r = vec2(
        fbm(uv + 1.0 * q + vec2(1.7, 9.2) + t * 0.15 + m * 1.5),
        fbm(uv + 1.0 * q + vec2(8.3, 2.8) + t * 0.126)
      );
      float f = fbm(uv + r);

      float d = length(uv - m);
      f += 0.25 * exp(-d * 3.5);

      vec3 col = mix(
        vec3(0.04, 0.01, 0.12),
        vec3(0.08, 0.42, 0.55),
        clamp(f * f * 4.0, 0.0, 1.0)
      );
      col = mix(col, vec3(0.52, 0.08, 0.42), clamp(length(q), 0.0, 1.0));
      col = mix(col, vec3(0.05, 0.72, 0.62), clamp(length(r.x), 0.0, 1.0));

      col += 0.15 * exp(-d * 5.0) * vec3(0.4, 1.0, 0.8);
      col = pow(col, vec3(1.0 / 1.8));

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  const FRACTAL_FS = `
    precision highp float;
    uniform float u_time;
    uniform vec2 u_res;
    uniform vec2 u_mouse;

    vec2 cmul(vec2 a, vec2 b) { return vec2(a.x*b.x - a.y*b.y, a.x*b.y + a.y*b.x); }

    void main() {
      vec2 uv = (gl_FragCoord.xy - u_res * 0.5) / min(u_res.x, u_res.y);
      vec2 m = (u_mouse - u_res * 0.5) / min(u_res.x, u_res.y);
      float t = u_time * 0.08;

      uv *= 2.2 + 0.5 * sin(t * 0.3);

      vec2 c = vec2(-0.745 + m.x * 0.15 + 0.12 * sin(t), 0.113 + m.y * 0.08 + 0.06 * cos(t * 0.7));
      vec2 z = uv;
      float iter = 0.0;
      const float MAX = 80.0;

      for (float i = 0.0; i < 80.0; i++) {
        z = cmul(z, z) + c;
        if (dot(z, z) > 4.0) { iter = i; break; }
        iter = i;
      }

      float smooth_i = iter - log2(log2(dot(z,z))) + 4.0;
      float n = smooth_i / MAX;

      float d = length(uv - m * 0.5);
      n += 0.08 * exp(-d * 4.0);

      vec3 a = vec3(0.5) + 0.5 * cos(6.28318 * (vec3(0.0, 0.33, 0.67) + n * 3.0 + t));
      vec3 b = vec3(0.5) + 0.5 * cos(6.28318 * (vec3(0.0, 0.33, 0.67) + n * 6.0 + t * 0.5));
      vec3 col = mix(a, b, 0.5 + 0.5 * sin(n * 12.0 + t));

      if (iter == 79.0) col = vec3(0.0);
      col = pow(col, vec3(0.9));

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  let mode = 'plasma';
  let prog = null;
  let uniforms = {};

  function compile(src) {
    function sh(type, s) {
      const x = gl.createShader(type);
      gl.shaderSource(x, s); gl.compileShader(x);
      return x;
    }
    const p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, VS));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, src));
    gl.linkProgram(p);
    return p;
  }

  function buildProg(fs) {
    if (prog) gl.deleteProgram(prog);
    prog = compile(fs);
    gl.useProgram(prog);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'a_pos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    uniforms = {
      time: gl.getUniformLocation(prog, 'u_time'),
      res: gl.getUniformLocation(prog, 'u_res'),
      mouse: gl.getUniformLocation(prog, 'u_mouse')
    };
  }

  buildProg(PLASMA_FS);

  let mouse = { x: 0, y: 0, tx: 0, ty: 0 };

  root.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mouse.tx = e.clientX - r.left;
    mouse.ty = r.height - (e.clientY - r.top);
    document.getElementById('coords').textContent =
      (mouse.tx / r.width).toFixed(3) + ' / ' + (mouse.ty / r.height).toFixed(3);
  });

  document.getElementById('mode-btn').addEventListener('click', function() {
    mode = mode === 'plasma' ? 'fractal' : 'plasma';
    this.textContent = mode === 'plasma' ? 'Fractal' : 'Plasma';
    buildProg(mode === 'plasma' ? PLASMA_FS : FRACTAL_FS);
  });

  function resize() {
    canvas.width = root.clientWidth;
    canvas.height = root.clientHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  resize();
  new ResizeObserver(resize).observe(root);

  let start = performance.now();
  function frame() {
    mouse.x += (mouse.tx - mouse.x) * 0.06;
    mouse.y += (mouse.ty - mouse.y) * 0.06;
    const t = (performance.now() - start) / 1000;
    gl.useProgram(prog);
    gl.uniform1f(uniforms.time, t);
    gl.uniform2f(uniforms.res, canvas.width, canvas.height);
    gl.uniform2f(uniforms.mouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
