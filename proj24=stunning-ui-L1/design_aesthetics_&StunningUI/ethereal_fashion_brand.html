
<style>
  @keyframes float {
    0%, 100% { transform: translateY(0px); opacity: 0.08; }
    50% { transform: translateY(-18px); opacity: 0.18; }
  }
  @keyframes drift {
    0% { transform: translateX(0) translateY(0); }
    33% { transform: translateX(12px) translateY(-8px); }
    66% { transform: translateX(-8px) translateY(6px); }
    100% { transform: translateX(0) translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .scene {
    background: #0a0a0a;
    min-height: 600px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 40px;
    animation: fadeIn 1s ease both;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.10);
    pointer-events: none;
  }
  .eyebrow {
    font-family: var(--font-sans);
    font-size: 11px;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.28);
    text-transform: uppercase;
    margin-bottom: 20px;
    animation: fadeIn 1.2s ease both;
  }
  .wordmark {
    font-family: var(--font-serif);
    font-size: 52px;
    font-weight: 400;
    color: rgba(255,255,255,0.18);
    letter-spacing: 0.15em;
    margin-bottom: 8px;
    transition: color 0.8s ease;
    cursor: default;
    animation: fadeIn 1.4s ease both;
  }
  .wordmark:hover { color: rgba(255,255,255,0.72); }
  .tagline {
    font-family: var(--font-sans);
    font-size: 13px;
    color: rgba(255,255,255,0.22);
    letter-spacing: 0.18em;
    margin-bottom: 56px;
    transition: color 0.8s ease;
    cursor: default;
    animation: fadeIn 1.6s ease both;
  }
  .tagline:hover { color: rgba(255,255,255,0.65); }
  .divider {
    width: 1px;
    height: 48px;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.2), transparent);
    margin-bottom: 56px;
    animation: fadeIn 1.8s ease both;
  }
  .product-row {
    display: flex;
    gap: 20px;
    margin-bottom: 56px;
    animation: fadeIn 2s ease both;
  }
  .product-card {
    width: 160px;
    padding: 28px 20px 24px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: background 0.6s ease, border-color 0.6s ease;
    position: relative;
  }
  .product-card:hover {
    background: rgba(255,255,255,0.09);
    border-color: rgba(255,255,255,0.18);
  }
  .product-card:hover .product-icon { opacity: 0.55; }
  .product-card:hover .product-name { color: rgba(255,255,255,0.75); }
  .product-card:hover .product-price { color: rgba(255,255,255,0.5); }
  .product-icon {
    width: 64px;
    height: 80px;
    opacity: 0.18;
    transition: opacity 0.6s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .product-name {
    font-family: var(--font-sans);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.28);
    text-align: center;
    transition: color 0.6s ease;
  }
  .product-price {
    font-family: var(--font-serif);
    font-size: 14px;
    color: rgba(255,255,255,0.18);
    transition: color 0.6s ease;
  }
  .btn-row {
    display: flex;
    gap: 16px;
    animation: fadeIn 2.2s ease both;
  }
  .btn-ghost {
    font-family: var(--font-sans);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 14px 32px;
    cursor: pointer;
    transition: color 0.5s, background 0.5s, border-color 0.5s;
    outline: none;
  }
  .btn-ghost:hover {
    color: rgba(255,255,255,0.78);
    background: rgba(255,255,255,0.10);
    border-color: rgba(255,255,255,0.28);
  }
  .btn-ghost.primary {
    color: rgba(255,255,255,0.32);
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.16);
  }
  .btn-ghost.primary:hover {
    color: rgba(255,255,255,0.85);
    background: rgba(255,255,255,0.15);
    border-color: rgba(255,255,255,0.35);
  }
  .nav {
    position: absolute;
    top: 28px;
    left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 40px;
  }
  .nav-link {
    font-family: var(--font-sans);
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.22);
    cursor: pointer;
    transition: color 0.5s;
  }
  .nav-link:hover { color: rgba(255,255,255,0.7); }
  .footer-text {
    position: absolute;
    bottom: 24px;
    font-family: var(--font-sans);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.12);
    text-transform: uppercase;
  }
</style>

<script>
const scene = document.getElementById('scene');
const W = scene.offsetWidth || 680;
const H = 600;

const particles = [
  { w:6,  h:6,  x:0.08, y:0.12, dur:7,  delay:0   },
  { w:3,  h:3,  x:0.18, y:0.65, dur:9,  delay:1.2 },

  { w:7,  h:7,  x:0.58, y:0.15, dur:13, delay:0.8 },

  { w:5,  h:5,  x:0.90, y:0.72, dur:9,  delay:1.8 },

  { w:2,  h:2,  x:0.50, y:0.55, dur:7,  delay:3   },
  { w:5,  h:5,  x:0.95, y:0.45, dur:15, delay:0.2 },
  { w:9,  h:9,  x:0.04, y:0.40, dur:12, delay:1.7 },
];

particles.forEach(p => {
  const el = document.createElement('div');
  el.className = 'particle';
  el.style.cssText = `
    width:${p.w}px;height:${p.h}px;
    left:${p.x*100}%;top:${p.y*100}%;
    animation:float ${p.dur}s ease-in-out ${p.delay}s infinite, drift ${p.dur*1.4}s ease-in-out ${p.delay*0.5}s infinite;
  `;
  scene.appendChild(el);
});
</script>
