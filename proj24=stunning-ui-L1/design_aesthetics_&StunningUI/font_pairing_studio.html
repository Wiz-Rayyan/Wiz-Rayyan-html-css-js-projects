<style>
*{box-sizing:border-box;margin:0;padding:0;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

:root{
  --ed-accent:#3C3489; --ed-light:#EEEDFE; --ed-mid:#7F77DD;
  --st-accent:#0F6E56; --st-light:#E1F5EE; --st-mid:#1D9E75;
  --tc-accent:#185FA5; --tc-light:#E6F1FB; --tc-mid:#378ADD;
  --ex-accent:#993C1D; --ex-light:#FAECE7; --ex-mid:#D85A30;
  --fr-accent:#854F0B; --fr-light:#FAEEDA; --fr-mid:#BA7517;
}

.studio{font-family:var(--font-sans);}

.nav{
  display:flex;gap:0;border-bottom:0.5px solid var(--color-border-tertiary);
  margin-bottom:0;overflow-x:auto;
}
.nav-btn{
  flex-shrink:0;padding:14px 20px;border:none;background:transparent;
  font-family:var(--font-sans);font-size:13px;font-weight:500;
  color:var(--color-text-secondary);cursor:pointer;border-bottom:2px solid transparent;
  transition:all 0.15s;margin-bottom:-0.5px;white-space:nowrap;
}
.nav-btn:hover{color:var(--color-text-primary);}
.nav-btn.on{color:var(--color-text-primary);border-bottom-color:var(--color-text-primary);}

.workspace{display:grid;grid-template-columns:1fr 340px;min-height:520px;}

.canvas{
  padding:3rem 2.5rem;border-right:0.5px solid var(--color-border-tertiary);
  display:flex;flex-direction:column;justify-content:center;
  position:relative;overflow:hidden;
}

.canvas-inner{transition:opacity 0.2s;}

.sidebar{padding:1.5rem;display:flex;flex-direction:column;gap:0;}

.sidebar-section{padding:1rem 0;border-bottom:0.5px solid var(--color-border-tertiary);}
.sidebar-section:last-child{border-bottom:none;}
.sidebar-label{font-size:10px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-text-tertiary);margin-bottom:10px;}

.specimen-row{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;}
.spec-name{font-size:13px;color:var(--color-text-primary);}
.spec-sub{font-size:11px;color:var(--color-text-tertiary);}

.preview-toggle{display:flex;gap:4px;margin-bottom:1rem;}
.ptoggle{
  padding:5px 12px;border-radius:100px;font-size:12px;font-weight:500;
  border:0.5px solid var(--color-border-secondary);background:transparent;
  color:var(--color-text-secondary);cursor:pointer;font-family:var(--font-sans);
  transition:all 0.15s;
}
.ptoggle.on{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary);}

.size-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.size-label{font-size:12px;color:var(--color-text-secondary);min-width:32px;}
input[type=range]{flex:1;height:3px;accent-color:var(--color-text-primary);}
.size-val{font-size:12px;color:var(--color-text-secondary);min-width:28px;text-align:right;}

.prompt-area{margin-top:auto;}
.prompt-box{
  background:var(--color-background-secondary);border-radius:var(--border-radius-md);
  padding:10px 12px;font-family:var(--font-mono);font-size:11px;
  color:var(--color-text-secondary);line-height:1.6;
  white-space:pre-wrap;word-break:break-word;margin-bottom:8px;
}
.copy-btn{
  width:100%;padding:8px;border-radius:var(--border-radius-md);
  border:0.5px solid var(--color-border-secondary);background:transparent;
  font-size:13px;font-weight:500;font-family:var(--font-sans);
  color:var(--color-text-primary);cursor:pointer;transition:all 0.15s;
}
.copy-btn:hover{background:var(--color-background-secondary);}
.copy-btn.done{color:var(--color-text-success);border-color:var(--color-border-success);}

.accent-dot{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  margin-right:6px;vertical-align:middle;flex-shrink:0;
}

.canvas-bg-dot{
  position:absolute;width:200px;height:200px;border-radius:50%;
  opacity:0.06;pointer-events:none;
}

.hero-word{display:block;transition:font-size 0.2s;}
.sub-word{display:block;transition:font-size 0.2s;}

.ui-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:1.5rem;}
.ui-pill{padding:8px 18px;border-radius:100px;font-size:13px;cursor:default;transition:opacity 0.2s;}
.ui-pill-ghost{padding:8px 18px;border-radius:100px;font-size:13px;cursor:default;background:transparent;}
.ui-stat{font-size:13px;color:var(--color-text-secondary);}

.kicker{font-size:11px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:12px;display:block;}

</style>

<h2 class="sr-only">Font pairing studio — select a style, adjust size, toggle preview modes, copy the AI prompt</h2>

<div class="studio">
  <nav class="nav" id="nav">
    <button class="nav-btn on" data-id="editorial">Editorial</button>
    <button class="nav-btn" data-id="startup">Startup</button>
    <button class="nav-btn" data-id="tech">Tech / SaaS</button>
    <button class="nav-btn" data-id="experimental">Experimental</button>
    <button class="nav-btn" data-id="friendly">Friendly</button>

  <div class="workspace">
    <div class="canvas" id="canvas">
      <div class="canvas-bg-dot" id="bgdot" style="right:-60px;bottom:-60px;background:#7F77DD;"></div>

    </div>

    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Preview mode</div>
        <div class="preview-toggle">
          <button class="ptoggle on" data-mode="hero">Hero</button>
          <button class="ptoggle" data-mode="article">Article</button>
          <button class="ptoggle" data-mode="ui">UI</button>

      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">Heading size</div>
        <div class="size-row">
          <span class="size-label">Size</span>
          <input type="range" id="hsize" min="24" max="72" value="48" step="2">
          <span class="size-val" id="hsize-out">48px</span>
        </div>
      </div>

      <div class="sidebar-section" id="font-info">
      </div>

      <div class="sidebar-section prompt-area">
        <div class="sidebar-label">AI prompt</div>
        <div class="prompt-box" id="prompt-txt"></div>
        <button class="copy-btn" id="copy-btn">Copy prompt</button>
      </div>
    </div>
  </div>
</div>

let current = 'editorial';
let mode = 'hero';
let hsize = 48;

function render(){
  const p = PAIRS[current];
  document.getElementById('bgdot').style.background = p.bgDot;

  const html = p[mode]();
  document.getElementById('canvas-inner').innerHTML = html;

  const hw = document.getElementById('hw');
  if(hw) hw.style.fontSize = hsize+'px';

  document.getElementById('font-info').innerHTML = `
    <div class="sidebar-label">Fonts</div>
    <div class="specimen-row">
      <span class="spec-name" style="font-family:${p.headFont};font-weight:${p.headWeight};font-size:18px;">${p.headName}</span>
      <span class="spec-sub">Headings · weight ${p.headWeight} · ${p.headSrc}</span>
    </div>
    <div class="specimen-row">
      <span class="spec-name" style="font-family:${p.bodyFont};font-size:15px;">The body text flows here</span>
      <span class="spec-sub">${p.bodyName} · weight 400/500 · ${p.bodySrc}</span>
    </div>
  `;

  document.getElementById('prompt-txt').textContent = p.prompt;
}

document.getElementById('nav').addEventListener('click', e=>{
  const btn = e.target.closest('.nav-btn');
  if(!btn) return;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  current = btn.dataset.id;
  render();
});

document.querySelectorAll('.ptoggle').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.ptoggle').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    mode = btn.dataset.mode;
    render();
  });
});

const hslider = document.getElementById('hsize');
hslider.addEventListener('input',()=>{
  hsize = parseInt(hslider.value);
  document.getElementById('hsize-out').textContent = hsize+'px';
  const hw = document.getElementById('hw');
  if(hw) hw.style.fontSize = hsize+'px';
});

document.getElementById('copy-btn').addEventListener('click',function(){
  const txt = document.getElementById('prompt-txt').textContent;
  navigator.clipboard.writeText(txt).then(()=>{
    this.textContent='Copied ✓';
    this.classList.add('done');
    setTimeout(()=>{this.textContent='Copy prompt';this.classList.remove('done');},2000);
  });
});

render();
</script>
