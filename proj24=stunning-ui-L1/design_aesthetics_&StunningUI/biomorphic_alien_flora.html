
<style>
  @keyframes pulse { 0%,100%{transform:scale(1) translate(-50%,-50%);opacity:.85} 50%{transform:scale(1.12) translate(-50%,-50%);opacity:1} }
  @keyframes pulse2 { 0%,100%{transform:scale(1) translate(-50%,-50%);opacity:.7} 50%{transform:scale(1.08) translate(-50%,-50%);opacity:.95} }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-18px)} }
  @keyframes floatB { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-12px) rotate(4deg)} }
  @keyframes tentacleWave { 0%,100%{d:path("M 0 0 C 20 -40 40 -20 50 -80 C 60 -130 30 -160 50 -200")} 50%{d:path("M 0 0 C -20 -40 10 -30 30 -90 C 50 -150 60 -160 40 -200")} }
  @keyframes tentacleWave2 { 0%,100%{d:path("M 0 0 C -20 -30 -30 -60 -10 -100 C 10 -140 30 -150 10 -200")} 50%{d:path("M 0 0 C 10 -30 30 -70 20 -110 C 10 -150 -10 -160 5 -200")} }
  @keyframes sporeFloat { 0%,100%{transform:translateY(0) scale(1)} 33%{transform:translateY(-8px) scale(1.05)} 66%{transform:translateY(4px) scale(.96)} }
  @keyframes glowPulse { 0%,100%{opacity:.4} 50%{opacity:.85} }
  @keyframes podHover { 0%,100%{filter:drop-shadow(0 0 8px #39ff7088) drop-shadow(0 0 24px #39ff7044)} 50%{filter:drop-shadow(0 0 14px #39ff70cc) drop-shadow(0 0 40px #39ff7066)} }
  @keyframes rotate { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  @keyframes eyePulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.25)} }
  @keyframes driftIn { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }

  .scene {
    background: radial-gradient(ellipse at 30% 40%, #1a0a2e 0%, #0d001a 50%, #000510 100%);
    min-height: 600px;
    width: 100%;
    position: relative;
    overflow: hidden;
    font-family: 'Inter', 'Helvetica Neue', sans-serif;
    cursor: default;
  }

  .blob {
    position: absolute;
    transform: translate(-50%, -50%);
    animation: pulse 4s ease-in-out infinite;
    mix-blend-mode: screen;
  }
  .blob2 { animation: pulse2 5.5s ease-in-out infinite; }

  .tentacle-wrap {
    position: absolute;
    bottom: 0;
    animation: float 6s ease-in-out infinite;
  }
  .tentacle-wrap.b { animation: floatB 8s ease-in-out infinite; }

  .spore {
    position: absolute;
    border-radius: 50%;
    mix-blend-mode: screen;
    animation: sporeFloat 3s ease-in-out infinite;
  }

  .glow-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid;
    animation: glowPulse 3s ease-in-out infinite;
    mix-blend-mode: screen;
  }

  .pod-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    border-radius: 40px;
    border: 1.5px solid #39ff70;
    background: rgba(0,0,0,0.5);
    color: #39ff70;
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    animation: podHover 2.5s ease-in-out infinite;
    transition: background .2s;
    margin: 0 8px;
  }
  .pod-btn:hover { background: rgba(57,255,112,.12); }
  .pod-btn .dot {
    width: 8px; height: 8px;
    background: #39ff70;
    border-radius: 50%;
    box-shadow: 0 0 8px #39ff70, 0 0 20px #39ff70;
  }

  .headline {
    font-size: clamp(28px, 5vw, 52px);
    font-weight: 100;
    letter-spacing: 6px;
    color: #e8d0ff;
    text-shadow: 0 0 20px #b06eff88, 0 0 60px #7033cc44;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.1;
  }
  .subline {
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 4px;
    color: #7a5c99;
    text-transform: uppercase;
    text-align: center;
    margin-top: 10px;
  }

  .content-center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    animation: driftIn .8s ease-out both;
    z-index: 10;
    width: 90%;
  }

  .eye {
    display: inline-block;
    animation: eyePulse 3s ease-in-out infinite;
    margin-bottom: 20px;
  }

  .hex-grid {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
  }

  .orbit {
    position: absolute;
    border-radius: 50%;
    border: 0.5px solid rgba(180,80,255,0.15);
    animation: rotate 20s linear infinite;
  }
</style>

<div class="scene" id="scene">

  <svg class="hex-grid" viewBox="0 0 680 600" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="bgGlow" cx="30%" cy="40%">
        <stop offset="0%" stop-color="#3a0d6e" stop-opacity=".4"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="bgGlow2" cx="80%" cy="70%">
        <stop offset="0%" stop-color="#0d3a2e" stop-opacity=".4"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="podGrad" cx="50%" cy="30%">
        <stop offset="0%" stop-color="#a0ffcc" stop-opacity=".9"/>
        <stop offset="60%" stop-color="#39ff70" stop-opacity=".7"/>
        <stop offset="100%" stop-color="#003322" stop-opacity="1"/>
      </radialGradient>
      <radialGradient id="podGrad2" cx="50%" cy="30%">
        <stop offset="0%" stop-color="#ffcc88" stop-opacity=".9"/>
        <stop offset="60%" stop-color="#ff6600" stop-opacity=".7"/>
        <stop offset="100%" stop-color="#220800" stop-opacity="1"/>
      </radialGradient>
      <radialGradient id="blobViolet" cx="50%" cy="50%">
        <stop offset="0%" stop-color="#b06eff" stop-opacity=".5"/>
        <stop offset="100%" stop-color="#4a00bb" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="blobTeal" cx="50%" cy="50%">
        <stop offset="0%" stop-color="#00ffcc" stop-opacity=".35"/>
        <stop offset="100%" stop-color="#003333" stop-opacity="0"/>
      </radialGradient>
      <filter id="glow1"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glow2"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>

    <rect width="680" height="600" fill="url(#bgGlow)"/>
    <rect width="680" height="600" fill="url(#bgGlow2)"/>

    <g filter="url(#glow1)" style="mix-blend-mode:screen">
      <ellipse cx="200" cy="300" rx="180" ry="140" fill="url(#blobViolet)">
        <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="5s" repeatCount="indefinite" additive="sum"/>
      </ellipse>
    </g>
    <g filter="url(#glow1)" style="mix-blend-mode:screen">
      <ellipse cx="500" cy="380" rx="140" ry="120" fill="url(#blobTeal)">
        <animateTransform attributeName="transform" type="scale" values="1;1.06;1" dur="6.5s" begin="1s" repeatCount="indefinite" additive="sum"/>
      </ellipse>
    </g>

    <g transform="translate(80,600)" style="mix-blend-mode:screen" filter="url(#glow2)">
      <path d="M 0 0 C 20 -40 40 -20 50 -80 C 60 -130 30 -160 50 -200"
        fill="none" stroke="#8a2be2" stroke-width="2.5" stroke-linecap="round" opacity=".8">
        <animate attributeName="d"
          values="M 0 0 C 20 -40 40 -20 50 -80 C 60 -130 30 -160 50 -200;M 0 0 C -20 -40 10 -30 30 -90 C 50 -150 60 -160 40 -200;M 0 0 C 20 -40 40 -20 50 -80 C 60 -130 30 -160 50 -200"
          dur="4s" repeatCount="indefinite"/>
      </path>
      <path d="M 0 0 C -10 -30 20 -50 5 -100 C -5 -140 -25 -150 -5 -190"
        fill="none" stroke="#6600cc" stroke-width="1.5" stroke-linecap="round" opacity=".6">
        <animate attributeName="d"
          values="M 0 0 C -10 -30 20 -50 5 -100 C -5 -140 -25 -150 -5 -190;M 0 0 C 10 -30 -20 -60 10 -110 C 30 -150 10 -155 15 -190;M 0 0 C -10 -30 20 -50 5 -100 C -5 -140 -25 -150 -5 -190"
          dur="5s" begin=".5s" repeatCount="indefinite"/>
      </path>
      <path d="M 0 0 C 30 -20 10 -60 25 -110 C 40 -155 20 -170 35 -200"
        fill="none" stroke="#b06eff" stroke-width="1.5" stroke-linecap="round" opacity=".5">
        <animate attributeName="d"
          values="M 0 0 C 30 -20 10 -60 25 -110 C 40 -155 20 -170 35 -200;M 0 0 C -30 -20 5 -55 15 -105 C 25 -150 40 -165 30 -200;M 0 0 C 30 -20 10 -60 25 -110 C 40 -155 20 -170 35 -200"
          dur="6s" begin="1s" repeatCount="indefinite"/>
      </path>
    </g>

    <g transform="translate(600,600)" style="mix-blend-mode:screen" filter="url(#glow2)">
      <path d="M 0 0 C -20 -35 -30 -70 -15 -120 C 0 -165 15 -155 -5 -200"
        fill="none" stroke="#00cc88" stroke-width="2" stroke-linecap="round" opacity=".75">
        <animate attributeName="d"
          values="M 0 0 C -20 -35 -30 -70 -15 -120 C 0 -165 15 -155 -5 -200;M 0 0 C 10 -40 -10 -75 0 -125 C 10 -170 -10 -160 5 -200;M 0 0 C -20 -35 -30 -70 -15 -120 C 0 -165 15 -155 -5 -200"
          dur="4.5s" repeatCount="indefinite"/>
      </path>
      <path d="M 0 0 C 10 -30 25 -65 10 -110 C -5 -150 10 -165 5 -200"
        fill="none" stroke="#39ff70" stroke-width="1.5" stroke-linecap="round" opacity=".55">
        <animate attributeName="d"
          values="M 0 0 C 10 -30 25 -65 10 -110 C -5 -150 10 -165 5 -200;M 0 0 C -15 -35 5 -60 -5 -115 C -15 -155 5 -168 -5 -200;M 0 0 C 10 -30 25 -65 10 -110 C -5 -150 10 -165 5 -200"
          dur="5.5s" begin=".8s" repeatCount="indefinite"/>
      </path>
    </g>

    <g filter="url(#glow2)">
      <circle cx="150" cy="160" r="22" fill="url(#podGrad)" style="mix-blend-mode:screen">
        <animate attributeName="r" values="22;26;22" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".8;1;.8" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="150" cy="160" r="30" fill="none" stroke="#39ff70" stroke-width="0.5" opacity=".4">
        <animate attributeName="r" values="26;40;26" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".4;0;.4" dur="3s" repeatCount="indefinite"/>
      </circle>

      <circle cx="540" cy="100" r="16" fill="url(#podGrad2)" style="mix-blend-mode:screen">
        <animate attributeName="r" values="16;20;16" dur="4s" begin=".5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".75;1;.75" dur="4s" begin=".5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="540" cy="100" r="24" fill="none" stroke="#ff6600" stroke-width="0.5" opacity=".4">
        <animate attributeName="r" values="20;36;20" dur="4s" begin=".5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".4;0;.4" dur="4s" begin=".5s" repeatCount="indefinite"/>
      </circle>

      <circle cx="340" cy="80" r="10" fill="#cc44ff" style="mix-blend-mode:screen" opacity=".9">
        <animate attributeName="cy" values="80;65;80" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="r" values="10;13;10" dur="5s" repeatCount="indefinite"/>
      </circle>

      <circle cx="440" cy="470" r="14" fill="url(#podGrad)" style="mix-blend-mode:screen">
        <animate attributeName="r" values="14;17;14" dur="3.5s" begin="1s" repeatCount="indefinite"/>
      </circle>

      <circle cx="220" cy="450" r="9" fill="#ff4488" style="mix-blend-mode:screen" opacity=".8">
        <animate attributeName="cy" values="450;438;450" dur="4s" begin="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g fill="none" style="mix-blend-mode:screen" filter="url(#glow2)">
      <ellipse cx="200" cy="300" rx="160" ry="110" stroke="#7020d0" stroke-width="0.5" opacity=".3">
        <animate attributeName="rx" values="160;175;160" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="110;120;110" dur="5s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="500" cy="380" rx="120" ry="90" stroke="#00cc88" stroke-width="0.5" opacity=".25">
        <animate attributeName="rx" values="120;135;120" dur="6s" begin="1s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <g opacity=".4" style="mix-blend-mode:screen">
      <circle cx="310" cy="180" r="1.5" fill="#cc88ff"><animate attributeName="opacity" values=".3;.9;.3" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="370" cy="220" r="1" fill="#88ffcc"><animate attributeName="opacity" values=".2;.8;.2" dur="3.1s" begin=".5s" repeatCount="indefinite"/></circle>
      <circle cx="280" cy="430" r="2" fill="#ff88cc"><animate attributeName="opacity" values=".3;1;.3" dur="2.7s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="460" cy="200" r="1.5" fill="#ffaa44"><animate attributeName="opacity" values=".2;.7;.2" dur="3.5s" begin=".3s" repeatCount="indefinite"/></circle>
      <circle cx="120" cy="350" r="1" fill="#44ffaa"><animate attributeName="opacity" values=".3;.9;.3" dur="2s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="580" cy="300" r="1.5" fill="#cc44ff"><animate attributeName="opacity" values=".2;.8;.2" dur="4s" begin=".7s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="480" r="1" fill="#ffffff"><animate attributeName="opacity" values=".1;.6;.1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="180" cy="250" r="2" fill="#6699ff"><animate attributeName="opacity" values=".2;.7;.2" dur="3.8s" begin=".9s" repeatCount="indefinite"/></circle>
    </g>
  </svg>

  <div class="content-center">
    <div class="eye">
      <svg viewBox="0 0 60 30" width="60" height="30">
        <ellipse cx="30" cy="15" rx="28" ry="12" fill="none" stroke="#b06eff" stroke-width="1" opacity=".8"/>
        <circle cx="30" cy="15" r="8" fill="#4a00bb" opacity=".9"/>
        <circle cx="30" cy="15" r="5" fill="#b06eff" opacity=".8">
          <animate attributeName="r" values="5;7;5" dur="3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="27" cy="13" r="1.5" fill="#ffffff" opacity=".9"/>
      </svg>
    </div>

    <div class="headline">Xenoflora<br>Collective</div>
    <div class="subline">Expedition VII — Deep Biome Survey</div>

    <div style="margin-top: 36px; display: flex; justify-content: center; flex-wrap: wrap; gap: 8px;">
      <button class="pod-btn"><span class="dot"></span>Enter Biome</button>
      <button class="pod-btn" style="border-color:#ff6600;color:#ff9944;animation-name:none;filter:drop-shadow(0 0 8px #ff660066)"><span class="dot" style="background:#ff7722;box-shadow:0 0 8px #ff7722,0 0 20px #ff7722"></span>Specimens</button>
      <button class="pod-btn" style="border-color:#cc44ff;color:#e088ff;animation-name:none;filter:drop-shadow(0 0 8px #cc44ff55)"><span class="dot" style="background:#cc44ff;box-shadow:0 0 8px #cc44ff,0 0 20px #cc44ff"></span>Archive</button>
    </div>

    <div style="margin-top: 32px; display: flex; justify-content: center; gap: 32px; opacity:.5">
      <span style="font-size:10px;letter-spacing:3px;color:#7a5c99;text-transform:uppercase">Bioluminescent</span>
      <span style="font-size:10px;letter-spacing:3px;color:#7a5c99;text-transform:uppercase">·</span>
      <span style="font-size:10px;letter-spacing:3px;color:#7a5c99;text-transform:uppercase">Xenomorphic</span>
      <span style="font-size:10px;letter-spacing:3px;color:#7a5c99;text-transform:uppercase">·</span>
      <span style="font-size:10px;letter-spacing:3px;color:#7a5c99;text-transform:uppercase">Living</span>
    </div>
  </div>

</div>
