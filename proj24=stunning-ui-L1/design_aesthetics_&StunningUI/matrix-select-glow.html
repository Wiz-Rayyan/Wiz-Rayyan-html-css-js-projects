<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Matrix / Select Glow</title>
<style>
  :root {
    --surface-2: #ffffff;
    --surface-1: #f4f4f2;
    --surface-0: #ececea;
    --border: #dddad2;
    --border-strong: #c7c3b8;
    --text-primary: #1c1c1a;
    --text-secondary: #6b6a65;
    --accent: #378ADD;
    --accent-bg: #E6F1FB;
    --accent-border: #185FA5;
    --accent-text: #0C447C;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--surface-0);
    color: var(--text-primary);
    padding: 2rem;
    margin: 0;
  }
  .card {
    max-width: 720px;
    margin: 0 auto;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
  }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    gap: 8px;
  }
  #count-label { font-size: 14px; color: var(--text-secondary); margin: 0; }
  button {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border-strong);
    background: var(--surface-2);
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover { background: var(--surface-1); }
  button:active { transform: scale(0.97); }

  #grid-wrap { overflow-x: auto; }
  #matrix {
    display: grid;
    grid-template-columns: 140px repeat(5, 1fr);
    min-width: 560px;
  }
  .mx-cell {
    aspect-ratio: 1;
    min-height: 44px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: var(--surface-2);
    transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.2s ease, transform 0.15s ease;
  }
  .mx-cell svg { opacity: 0; transition: opacity 0.15s ease; width: 18px; height: 18px; }
  .mx-cell.selected {
    background: var(--accent-bg);
    border-color: var(--accent-border);
    box-shadow: 0 0 0 2px rgba(55,138,221,0.25), 0 0 12px rgba(55,138,221,0.35);
  }
  .mx-cell.selected svg { opacity: 1; stroke: var(--accent-text); }
  .mx-cell.hl-row, .mx-cell.hl-col { background: var(--surface-1); }
  .mx-cell.selected.hl-row, .mx-cell.selected.hl-col { background: var(--accent-bg); }

  .mx-rowhead, .mx-colhead {
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    padding: 6px 10px;
  }
  .mx-colhead {
    justify-content: center;
    text-align: center;
    font-weight: 600;
    color: var(--text-primary);
    border-bottom: 1px solid var(--border);
  }
  .mx-rowhead { border-right: 1px solid var(--border); }
  .mx-rowhead.hl-row, .mx-colhead.hl-col {
    background: var(--surface-1);
    color: var(--text-primary);
  }
  .mx-corner { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }

  @keyframes pulse-btn {
    0% { transform: scale(1); box-shadow: none; }
    40% { transform: scale(1.05); background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent-text); box-shadow: 0 0 14px rgba(55,138,221,0.45); }
    100% { transform: scale(1); box-shadow: none; }
  }
  .pulse { animation: pulse-btn 0.4s ease; }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0.001; } }
  .fade-out { animation: fadeOut 0.3s ease forwards; }
</style>
</head>
<body>
<div class="card">
  <div class="toolbar">
    <p id="count-label">0 of 25 selected</p>
    <div style="display:flex; gap:8px;">
      <button id="select-all-btn">Select all</button>
      <button id="deselect-btn">Deselect all</button>
    </div>
  </div>
  <div id="grid-wrap">
    <div id="matrix"></div>
  </div>
</div>

<script>
(function(){
  const rows = ["Real-time sync", "Offline mode", "API access", "Custom roles", "Audit log"];
  const cols = ["Free", "Starter", "Team", "Business", "Enterprise"];
  const grid = document.getElementById('matrix');
  const countLabel = document.getElementById('count-label');
  const total = rows.length * cols.length;
  const selected = new Set();
  const checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

  const corner = document.createElement('div');
  corner.className = 'mx-corner';
  grid.appendChild(corner);

  cols.forEach((c, ci) => {
    const h = document.createElement('div');
    h.className = 'mx-colhead';
    h.textContent = c;
    h.dataset.col = ci;
    grid.appendChild(h);
  });

  rows.forEach((r, ri) => {
    const h = document.createElement('div');
    h.className = 'mx-rowhead';
    h.textContent = r;
    h.dataset.row = ri;
    grid.appendChild(h);

    cols.forEach((c, ci) => {
      const cell = document.createElement('div');
      cell.className = 'mx-cell';
      cell.dataset.row = ri;
      cell.dataset.col = ci;
      cell.setAttribute('role', 'button');
      cell.setAttribute('aria-label', r + ' - ' + c);
      cell.innerHTML = checkSvg;
      cell.addEventListener('click', () => toggleCell(cell));
      cell.addEventListener('mouseenter', () => setHighlight(ri, ci, true));
      cell.addEventListener('mouseleave', () => setHighlight(ri, ci, false));
      grid.appendChild(cell);
    });
  });

  function key(r,c){ return r + '-' + c; }

  function toggleCell(cell){
    const r = cell.dataset.row, c = cell.dataset.col;
    const k = key(r,c);
    if (selected.has(k)) {
      selected.delete(k);
      cell.classList.remove('selected');
    } else {
      selected.add(k);
      cell.classList.add('selected');
    }
    updateCount();
  }

  function setHighlight(r, c, on){
    document.querySelectorAll('.mx-cell[data-row="'+r+'"]').forEach(el => el.classList.toggle('hl-row', on));
    document.querySelectorAll('.mx-cell[data-col="'+c+'"]').forEach(el => el.classList.toggle('hl-col', on));
    const rh = document.querySelector('.mx-rowhead[data-row="'+r+'"]');
    const ch = document.querySelector('.mx-colhead[data-col="'+c+'"]');
    if (rh) rh.classList.toggle('hl-row', on);
    if (ch) ch.classList.toggle('hl-col', on);
  }

  function updateCount(){
    countLabel.textContent = selected.size + ' of ' + total + ' selected';
  }

  document.getElementById('select-all-btn').addEventListener('click', (e) => {
    document.querySelectorAll('.mx-cell').forEach(cell => {
      const k = key(cell.dataset.row, cell.dataset.col);
      selected.add(k);
      cell.classList.add('selected');
    });
    e.currentTarget.classList.remove('pulse');
    void e.currentTarget.offsetWidth;
    e.currentTarget.classList.add('pulse');
    updateCount();
  });

  document.getElementById('deselect-btn').addEventListener('click', () => {
    document.querySelectorAll('.mx-cell.selected').forEach(cell => {
      cell.classList.add('fade-out');
      setTimeout(() => {
        cell.classList.remove('selected', 'fade-out');
      }, 280);
    });
    selected.clear();
    setTimeout(updateCount, 280);
  });
})();
</script>
</body>
</html>
