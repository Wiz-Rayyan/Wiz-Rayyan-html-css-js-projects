<h2 class="sr-only">Interstitial aesthetic: a webpage layout rendered with all content hidden, revealing only the structural negative space — margins, padding, gutters — as colored regions.</h2>

<div class="stage" id="stage">
  <span class="mode-label" id="mode-label">INTERSTITIAL MODE</span>
  <button class="toggle-btn" id="toggle">reveal content</button>

  <div id="page">
    <div class="header-bar" style="position:relative;">
      <div class="logo-area item"></div>
      <div class="nav-item item" style="height:20px; width:60px; border-radius:2px;"></div>
      <div class="nav-item item" style="height:20px; width:60px; border-radius:2px;"></div>
      <div class="nav-item item" style="height:20px; width:70px; border-radius:2px;"></div>
      <div style="flex:1;"></div>
      <div class="item" style="width:36px; height:36px; border-radius:50%;"></div>
    </div>

    <div class="main-layout">
      <div class="main-content">
        <div class="hero-section">
          <div class="hero-title item"></div>
          <div class="hero-sub item"></div>
          <div class="hero-sub item" style="width:40%;"></div>
          <div class="cta-row">
            <div class="btn item"></div>
            <div class="btn-ghost item"></div>
          </div>
        </div>

        <div class="cards-row">
          <div class="card" style="position:relative;">
            <div class="card-icon item"></div>
            <div class="card-title item"></div>

              <div class="text-line short item"></div>
            </div>
          </div>
          <div class="card" style="position:relative;">
            <div class="card-icon item"></div>
            <div class="card-title item"></div>
            <div class="card-body">
              <div class="text-line item"></div>
              <div class="text-line medium item"></div>
              <div class="text-line short item"></div>
            </div>
          </div>
          <div class="card" style="position:relative;">
            <div class="card-icon item"></div>
            <div class="card-title item"></div>
            <div class="card-body">
              <div class="text-line item"></div>
              <div class="text-line medium item"></div>
              <div class="text-line short item"></div>
            </div>
          </div>
        </div>

        <div class="footer-bar">
          <div class="footer-col">
            <div class="footer-line item" style="width:80px; height:14px;"></div>
            <div class="footer-line item"></div>
            <div class="footer-line item" style="width:70%;"></div>
            <div class="footer-line item" style="width:55%;"></div>
          </div>
          <div class="footer-col">

            <div class="footer-line item"></div>
            <div class="footer-line item" style="width:60%;"></div>

          </div>
          <div class="footer-col">
            <div class="footer-line item" style="width:70px; height:14px;"></div>

            <div class="footer-line item" style="width:50%;"></div>

      </div>

      <div class="sidebar-col">
        <div class="sidebar">
          <div class="sidebar-item" style="position:relative;">
            <div class="avatar item"></div>
            <div class="sidebar-text">

<script>
const SPACE_COLOR = 'rgba(106, 160, 255, 0.18)';
const CONTENT_BG = 'var(--color-background-secondary)';
const items = document.querySelectorAll('.item');
const toggle = document.getElementById('toggle');
const label = document.getElementById('mode-label');
const stage = document.getElementById('stage');

let interstitial = true;

function applyMode() {
  if (interstitial) {
    stage.style.background = 'var(--color-background-primary)';
    items.forEach(el => {
      el.style.background = 'transparent';
      el.style.opacity = '0';
    });
    paintSpaces();
    toggle.textContent = 'reveal content';
    label.textContent = 'INTERSTITIAL MODE';
  } else {
    clearCanvas();
    stage.style.background = 'var(--color-background-primary)';
    items.forEach(el => {
      el.style.background = CONTENT_BG;
      el.style.opacity = '1';
    });
    toggle.textContent = 'hide content';
    label.textContent = 'CONTENT MODE';
  }
}

let canvas;
function paintSpaces() {
  if (canvas) canvas.remove();
  canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;';
  canvas.width = stage.offsetWidth;
  canvas.height = stage.scrollHeight;
  stage.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  const pageRect = document.getElementById('page').getBoundingClientRect();
  const stageRect = stage.getBoundingClientRect();

  ctx.fillStyle = SPACE_COLOR;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.clearRect(
    pageRect.left - stageRect.left,
    pageRect.top - stageRect.top,
    pageRect.width,
    pageRect.height
  );

  items.forEach(el => {
    const r = el.getBoundingClientRect();
    const x = r.left - stageRect.left;
    const y = r.top - stageRect.top + window.scrollY;
    ctx.clearRect(x, y, r.width, r.height);
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(x, y, r.width, r.height);
    ctx.fillStyle = SPACE_COLOR;
  });
}

function clearCanvas() {
  if (canvas) { canvas.remove(); canvas = null; }
}

toggle.addEventListener('click', () => {
  interstitial = !interstitial;
  applyMode();
});

window.addEventListener('resize', () => { if (interstitial) paintSpaces(); });

applyMode();
</script>
