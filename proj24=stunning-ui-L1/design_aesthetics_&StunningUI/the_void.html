
<style>
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.03; }
    94% { opacity: 1; }
    97% { opacity: 0.06; }
    98% { opacity: 1; }
  }
  @keyframes cursor {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes scanline {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(400px); }
  }
  .void-screen {
    position: relative;
    width: 100%;
    height: 400px;
    background: #000000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    animation: flicker 8s infinite;
    border-radius: 4px;
  }
  .scanline {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 2px;
    background: rgba(255,255,255,0.015);
    animation: scanline 6s linear infinite;
    pointer-events: none;
  }
  .console-layer {
    position: absolute;
    bottom: 24px;
    left: 28px;
    right: 28px;
    font-size: 11px;
    color: rgba(255,255,255,0.18);
    line-height: 1.7;
    animation: fadeIn 3s ease-in 0.5s both;
  }
  .console-line { display: block; }
  .console-line.dim { color: rgba(255,255,255,0.07); }
  .console-line.strike { text-decoration: line-through; color: rgba(255,255,255,0.06); }
  .cursor {
    display: inline-block;
    width: 7px;
    height: 12px;
    background: rgba(255,255,255,0.18);
    vertical-align: middle;
    animation: cursor 1.1s step-end infinite;
    margin-left: 2px;
  }
  .center-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -60%);
    text-align: center;
    animation: fadeIn 5s ease-in 2s both;
  }
  .void-label {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 0.35em;
    color: rgba(255,255,255,0.06);
    text-transform: uppercase;
  }
  .noise-overlay {
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    background-size: 200px 200px;
    opacity: 0.4;
    pointer-events: none;
  }
</style>

<div class="void-screen" role="img" aria-label="A black void — an empty browser window with nothing in it">
  <div class="noise-overlay"></div>
  <div class="scanline"></div>

  <div class="center-text">
    <div class="void-label">nothing</div>
  </div>

  <div class="console-layer">
    <span class="console-line strike">document.documentElement.innerHTML = ""</span>
    <span class="console-line strike">document.head.remove()</span>
    <span class="console-line strike">document.body.remove()</span>
    <span class="console-line dim">// there is nothing left to remove</span>
    <span class="console-line dim" style="margin-top:6px; display:block">console.log("...")<span class="cursor"></span></span>
  </div>
</div>
