
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; }
  #canvas {
    width: 100%;
    height: 520px;
    position: relative;
    overflow: hidden;
    cursor: ns-resize;
    user-select: none;
  }
  .cell {
    width: 44px;
    height: 44px;
    border: 0.5px solid rgba(80,80,200,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    transition: transform 0.6s cubic-bezier(.4,0,.2,1), opacity 0.6s, border-color 0.6s;
    will-change: transform, opacity;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #7F77DD;
    transition: all 0.6s cubic-bezier(.4,0,.2,1);
  }
  #boundary-line {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, #D85A30 20%, #D85A30 80%, transparent 100%);
    pointer-events: none;
    z-index: 10;
    transition: top 0.1s;
  }
  #label-order {
    position: absolute;
    left: 20px;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: #534AB7;
    font-weight: 500;
    text-transform: uppercase;
    pointer-events: none;
    transition: top 0.1s;
    z-index: 11;
  }
  #label-chaos {
    position: absolute;
    left: 20px;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: #993C1D;
    font-weight: 500;
    text-transform: uppercase;
    pointer-events: none;
    transition: top 0.1s;
    z-index: 11;
  }
  #hint {
    position: absolute;
    bottom: 14px;
    width: 100%;
    text-align: center;
    font-size: 12px;
    color: rgba(120,120,120,0.6);
    pointer-events: none;
    z-index: 12;
    letter-spacing: 0.05em;
  }
</style>

<h2 class="sr-only">Order and chaos visualization: a grid of dots that transitions from structured order at the top to random entropy at the bottom. Drag to move the boundary.</h2>

<div id="canvas">
  <div id="boundary-line"></div>
  <div id="label-order">order</div>
  <div id="label-chaos">chaos</div>
  <div id="hint">drag to shift the boundary</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const boundaryLine = document.getElementById('boundary-line');
const labelOrder = document.getElementById('label-order');
const labelChaos = document.getElementById('label-chaos');

const COLS = 14;
const ROWS = 11;
const CELL = 44;
const PAD_X = 20;
const PAD_Y = 20;

let boundaryRatio = 0.45;
let cells = [];
let chaosOffsets = [];
let isDragging = false;

function randRange(a, b) { return a + Math.random() * (b - a); }

function initCells() {
  canvas.querySelectorAll('.cell').forEach(e => e.remove());
  cells = [];
  chaosOffsets = [];

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const el = document.createElement('div');
      el.className = 'cell';
      const dot = document.createElement('div');
      dot.className = 'dot';
      el.appendChild(dot);
      canvas.appendChild(el);

      const baseX = PAD_X + c * CELL;
      const baseY = PAD_Y + r * CELL;

      const chaos = {
        x: randRange(-120, 120),
        y: randRange(-80, 80),
        rot: randRange(-160, 160),
        scale: randRange(0.4, 2.2),
        dotSize: randRange(3, 18),
        opacity: randRange(0.2, 0.9),
      };

      cells.push({ el, dot, baseX, baseY, r, c });
      chaosOffsets.push(chaos);
    }
  }
}

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

function render() {
  const H = canvas.clientHeight;
  const W = canvas.clientWidth;
  const boundaryY = boundaryRatio * H;

  boundaryLine.style.top = boundaryY + 'px';
  labelOrder.style.top = Math.max(8, boundaryY - 24) + 'px';
  labelChaos.style.top = Math.min(H - 36, boundaryY + 10) + 'px';

  const totalW = COLS * CELL;
  const totalH = ROWS * CELL;
  const offsetX = (W - totalW) / 2 - PAD_X;

  cells.forEach((cell, i) => {
    const { el, dot, baseX, baseY, r, c } = cell;
    const chaos = chaosOffsets[i];

    const x = baseX + offsetX;
    const y = baseY;

    const cellCenterY = y + CELL / 2;

    const dist = (cellCenterY - boundaryY) / H;
    const rawT = clamp(dist * 3.5, -1, 1);
    const t = clamp((rawT + 1) / 2, 0, 1);
    const te = easeInOut(t);

    const tx = lerp(0, chaos.x, te);
    const ty = lerp(0, chaos.y, te);
    const rot = lerp(0, chaos.rot, te);
    const scale = lerp(1, chaos.scale, te);
    const opacity = lerp(0.92, chaos.opacity, te);
    const dotSize = lerp(6, chaos.dotSize, te);

    const r_val = Math.round(lerp(127, 216, te));
    const g_val = Math.round(lerp(119, 90, te));
    const b_val = Math.round(lerp(221, 48, te));
    const dotColor = `rgb(${r_val},${g_val},${b_val})`;

    const borderAlpha = lerp(0.18, 0.04, te);

    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg) scale(${scale})`;
    el.style.opacity = opacity;
    el.style.borderColor = `rgba(80,80,200,${borderAlpha})`;
    el.style.transition = isDragging
      ? 'transform 0.08s, opacity 0.08s, border-color 0.08s'
      : 'transform 0.5s cubic-bezier(.4,0,.2,1), opacity 0.5s, border-color 0.5s';

    dot.style.width = dotSize + 'px';
    dot.style.height = dotSize + 'px';
    dot.style.background = dotColor;
    dot.style.borderRadius = lerp(50, 20, te) + '%';
    dot.style.transition = el.style.transition;
  });
}

function setFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const y = clientY - rect.top;
  boundaryRatio = clamp(y / rect.height, 0.1, 0.9);
  render();
}

canvas.addEventListener('mousedown', e => { isDragging = true; setFromEvent(e); });
window.addEventListener('mousemove', e => { if (isDragging) setFromEvent(e); });
window.addEventListener('mouseup', () => { isDragging = false; });

canvas.addEventListener('touchstart', e => { isDragging = true; setFromEvent(e); e.preventDefault(); }, { passive: false });
window.addEventListener('touchmove', e => { if (isDragging) setFromEvent(e); }, { passive: false });
window.addEventListener('touchend', () => { isDragging = false; });

initCells();
render();

let animT = 0;
let autoDir = 1;
let autoActive = true;
function autoAnimate() {
  if (autoActive && !isDragging) {
    animT += 0.003 * autoDir;
    if (animT > 0.72) autoDir = -1;
    if (animT < 0.18) autoDir = 1;
    boundaryRatio = 0.45 + Math.sin(animT * Math.PI) * 0.22;
    render();
  }
  requestAnimationFrame(autoAnimate);
}
canvas.addEventListener('mousedown', () => { autoActive = false; });
canvas.addEventListener('touchstart', () => { autoActive = false; });
autoAnimate();
</script>
