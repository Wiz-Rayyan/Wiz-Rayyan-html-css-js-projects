
<style>
*{margin:0;padding:0;box-sizing:border-box;}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap');

.wrap{display:flex;flex-direction:column;align-items:center;padding:1.5rem 0 2rem;}

.phone{
  width:300px;height:600px;
  background:#0e0e0e;
  border-radius:44px;
  border:1.5px solid #2a2a2a;
  overflow:hidden;
  position:relative;
}

.notch{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:90px;height:24px;
  background:#0e0e0e;
  border-radius:0 0 14px 14px;
  z-index:20;
}

.site{
  width:100%;height:100%;
  background:#f5f3ef;
  position:relative;
  overflow:hidden;
  font-family:'Inter',sans-serif;
}

.hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:36px 22px 0;
  position:relative;z-index:2;
}

.logo-text{
  font-size:13px;font-weight:700;letter-spacing:0.14em;
  color:#0e0e0e;text-transform:uppercase;
}

.page-content{padding:20px 22px 0;}

.big-text{
  font-size:26px;font-weight:700;line-height:1.15;
  color:#0e0e0e;margin-bottom:14px;
  letter-spacing:-0.03em;
}

.sub-text{font-size:11px;color:#888;line-height:1.6;margin-bottom:20px;}

.img-block{
  width:100%;height:120px;
  background:#e0ddd6;
  border-radius:14px;
  position:relative;overflow:hidden;
}

.img-block::before{
  content:'';position:absolute;
  top:30px;left:20px;
  width:60px;height:60px;
  background:#c8c3b8;border-radius:50%;
}
.img-block::after{
  content:'';position:absolute;
  top:50px;left:50px;right:20px;bottom:20px;
  background:#d6d1c8;border-radius:10px;
}

.ham-btn{
  width:36px;height:36px;
  background:none;border:none;cursor:pointer;
  position:relative;display:flex;align-items:center;justify-content:center;
  padding:0;
}

.line{
  position:absolute;left:6px;
  width:24px;height:2px;
  background:#0e0e0e;border-radius:2px;
  transition:transform 0.5s cubic-bezier(0.76,0,0.24,1),
             opacity 0.3s ease,
             background 0.4s ease;
  transform-origin:center;
}
.lt{top:10px;}
.lm{top:17px;}
.lb{top:24px;}

.ham-btn.open .lt{transform:translateY(7px) rotate(45deg);background:#fff;}
.ham-btn.open .lm{opacity:0;transform:scaleX(0);}
.ham-btn.open .lb{transform:translateY(-7px) rotate(-45deg);background:#fff;}

.overlay{
  position:absolute;inset:0;
  background:#0a0a0a;
  z-index:999;
  display:flex;flex-direction:column;
  transform:translateY(-100%);
  transition:transform 0.7s cubic-bezier(0.76,0,0.24,1);
}

.overlay.open{transform:translateY(0);}

.ov-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:36px 22px 0;flex-shrink:0;
}

.ov-logo{font-size:13px;font-weight:700;letter-spacing:0.14em;color:#2a2a2a;text-transform:uppercase;}

.close-x{
  width:36px;height:36px;background:none;border:none;cursor:pointer;
  position:relative;display:flex;align-items:center;justify-content:center;
}
.close-x::before,.close-x::after{
  content:'';position:absolute;
  width:18px;height:1.5px;background:#fff;border-radius:2px;
}
.close-x::before{transform:rotate(45deg);}
.close-x::after{transform:rotate(-45deg);}

.nav{
  flex:1;display:flex;flex-direction:column;
  justify-content:center;padding:0 22px;
  gap:0;overflow:hidden;
}

.nav-item{
  display:block;
  padding:10px 0;
  font-size:34px;font-weight:700;
  color:#fff;
  letter-spacing:-0.04em;
  text-decoration:none;
  line-height:1;
  position:relative;
  cursor:pointer;
  opacity:0;
  transform:translateY(30px);
  transition:opacity 0.55s cubic-bezier(0.23,1,0.32,1),
             transform 0.55s cubic-bezier(0.23,1,0.32,1),
             color 0.2s ease;
  border-bottom:0.5px solid #1c1c1c;
}

.nav-item:last-child{border-bottom:none;}

.nav-item .num{
  position:absolute;right:0;top:50%;transform:translateY(-50%);
  font-size:10px;color:#333;letter-spacing:0.1em;font-weight:400;
}

.nav-item:hover{color:rgba(255,255,255,0.35);}

.overlay.open .nav-item:nth-child(1){opacity:1;transform:translateY(0);transition-delay:0.15s;}
.overlay.open .nav-item:nth-child(2){opacity:1;transform:translateY(0);transition-delay:0.2s;}
.overlay.open .nav-item:nth-child(3){opacity:1;transform:translateY(0);transition-delay:0.25s;}
.overlay.open .nav-item:nth-child(4){opacity:1;transform:translateY(0);transition-delay:0.3s;}
.overlay.open .nav-item:nth-child(5){opacity:1;transform:translateY(0);transition-delay:0.35s;}

.ov-footer{
  padding:20px 22px;flex-shrink:0;
  display:flex;justify-content:space-between;align-items:flex-end;
  opacity:0;transition:opacity 0.5s ease 0.5s;
}
.overlay.open .ov-footer{opacity:1;}

.ft-tag{font-size:9px;color:#2a2a2a;letter-spacing:0.12em;text-transform:uppercase;line-height:1.8;}

.socials{display:flex;gap:12px;}
.soc{
  width:28px;height:28px;border:0.5px solid #2a2a2a;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:border-color 0.2s ease;
}
.soc:hover{border-color:#555;}
.soc svg{width:11px;height:11px;fill:#333;}

.reveal-line{
  position:absolute;bottom:0;left:0;right:0;
  height:0.5px;background:#1c1c1c;
  transform:scaleX(0);transform-origin:left;
  transition:transform 0.6s cubic-bezier(0.23,1,0.32,1);
}
.overlay.open .reveal-line{transform:scaleX(1);transition-delay:0.6s;}

.hint{
  font-size:11px;color:var(--color-text-secondary);
  font-family:sans-serif;text-align:center;
  margin-bottom:12px;opacity:0.6;
}
</style>

<div class="wrap">
  <p class="hint">Tap the menu icon</p>
  <div class="phone">
    <div class="notch"></div>
    <div class="site">
      <header class="hdr">
        <span class="logo-text">Archē</span>
        <button class="ham-btn" id="ham" aria-label="Open menu">
          <span class="line lt"></span>
          <span class="line lm"></span>
          <span class="line lb"></span>
        </button>
      </header>
      <div class="page-content">
        <h1 class="big-text">We build<br>digital<br>futures.</h1>
        <p class="sub-text">Award-winning studio crafting<br>brands for tomorrow's world.</p>
        <div class="img-block"></div>
      </div>

      <div class="overlay" id="overlay">
        <header class="ov-hdr">
          <span class="ov-logo">Archē</span>
          <button class="close-x" id="closeBtn" aria-label="Close menu"></button>
        </header>

        <nav class="nav">
          <a class="nav-item" href="#">Work<span class="num">01</span></a>
          <a class="nav-item" href="#">Studio<span class="num">02</span></a>
          <a class="nav-item" href="#">Services<span class="num">03</span></a>
          <a class="nav-item" href="#">Journal<span class="num">04</span></a>
          <a class="nav-item" href="#">Contact<span class="num">05</span></a>
        </nav>

        <div class="reveal-line"></div>

        <footer class="ov-footer">
          <div class="ft-tag">
            <div>© 2026 Archē Studio</div>
            <div>Mumbai · London · NY</div>
          </div>
          <div class="socials">
            <div class="soc">
              <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
            </div>
            <div class="soc">
              <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/></svg>
            </div>
            <div class="soc">
              <svg viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>
            </div>
          </div>
        </footer>
      </div>

    </div>
  </div>
</div>

<script>
const ham = document.getElementById('ham');
const overlay = document.getElementById('overlay');
const closeBtn = document.getElementById('closeBtn');

function open(){
  ham.classList.add('open');
  overlay.classList.add('open');
}
function close(){
  ham.classList.remove('open');
  overlay.classList.remove('open');
}

ham.addEventListener('click', open);
closeBtn.addEventListener('click', close);

overlay.querySelectorAll('.nav-item').forEach(a => {
  a.addEventListener('click', e => { e.preventDefault(); close(); });
});
</script>
