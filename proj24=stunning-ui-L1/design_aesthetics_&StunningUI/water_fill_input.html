<h2 class="sr-only">Interactive demo of a water-fill input field that rises on focus and turns green or red based on validation</h2>
<style>
.wf-wrap{max-width:360px;margin:0 auto;padding:2rem 0}
.wf-field{position:relative;height:52px;border-radius:var(--radius);border:0.5px solid var(--border);overflow:hidden;background:var(--surface-2)}
.wf-water{position:absolute;left:0;right:0;bottom:0;height:0%;background:var(--wf-color,#378ADD);opacity:0.08;transition:height 0.6s cubic-bezier(.22,.9,.35,1),background 0.3s;}
.wf-wave{position:absolute;left:-25%;right:-25%;top:-6px;height:12px;opacity:0.35;}
.wf-input{position:relative;z-index:2;width:100%;height:52px;border:none;background:transparent;padding:0 14px;font-size:15px;color:var(--text-primary);outline:none;box-shadow:none !important;}
.wf-label{font-size:13px;color:var(--text-secondary);margin:0 0 8px;}
.wf-status{font-size:13px;margin-top:8px;min-height:18px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;}
.wf-splash{position:absolute;width:5px;height:5px;border-radius:50%;background:#E24B4A;opacity:0;pointer-events:none;z-index:3;}
</style>
<div class="wf-wrap">
  <p class="wf-label">Email address</p>
  <div class="wf-field" id="wfField">
    <div class="wf-water" id="wfWater">
      <svg class="wf-wave" id="wfWave" viewBox="0 0 400 12" preserveAspectRatio="none">
        <path id="wfWavePath" d="M0,6 Q25,0 50,6 T100,6 T150,6 T200,6 T250,6 T300,6 T350,6 T400,6 V12 H0 Z" fill="currentColor"/>
      </svg>
    </div>
    <input class="wf-input" id="wfInput" type="text" placeholder="name@company.com" autocomplete="off" />
  </div>
  <p class="wf-status" id="wfStatus">Focus the field to see it fill.</p>
</div>
<script>
(function(){
  var field = document.getElementById('wfField');
  var water = document.getElementById('wfWater');
  var input = document.getElementById('wfInput');
  var status = document.getElementById('wfStatus');
  var wave = document.getElementById('wfWave');

  var neutral = '#378ADD';
  var good = '#639922';
  var bad = '#E24B4A';

  function isValidEmail(v){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  }

  function setColor(c){
    water.style.background = c;
    wave.style.color = c;
  }

  function splash(){
    for(var i=0;i<6;i++){
      var d = document.createElement('div');
      d.className = 'wf-splash';
      var x = 20 + Math.random()*(field.clientWidth-40);
      d.style.left = x+'px';
      d.style.bottom = '4px';
      field.appendChild(d);
      var dx = (Math.random()-0.5)*40;
      var dy = -(20+Math.random()*24);
      d.animate([
        {transform:'translate(0,0)', opacity:1},
        {transform:'translate('+dx+'px,'+dy+'px)', opacity:0}
      ], {duration:450+Math.random()*200, easing:'ease-out'});
      setTimeout(function(el){ return function(){ el.remove(); }; }(d), 700);
    }
  }

  function update(rippled){
    var v = input.value.trim();
    if(v.length===0){
      setColor(neutral);
      water.style.opacity = document.activeElement===input ? '0.08' : '0';
      status.textContent = document.activeElement===input ? 'Rising...' : 'Focus the field to see it fill.';
      status.style.color = 'var(--text-secondary)';
      return;
    }
    if(isValidEmail(v)){
      setColor(good);
      water.style.opacity = '0.14';
      status.innerHTML = '<i class="ti ti-check" style="color:var(--text-success);font-size:16px" aria-hidden="true"></i> Looks good';
      status.style.color = 'var(--text-success)';
    } else {
      setColor(bad);
      water.style.opacity = '0.14';
      status.innerHTML = '<i class="ti ti-x" style="color:var(--text-danger);font-size:16px" aria-hidden="true"></i> Needs an @ and a domain';
      status.style.color = 'var(--text-danger)';
      if(rippled) splash();
    }
  }

  input.addEventListener('focus', function(){
    water.style.height = '100%';
    update(false);
  });

  input.addEventListener('blur', function(){
    water.style.height = '0%';
    var v = input.value.trim();
    status.textContent = v.length===0 ? 'Focus the field to see it fill.' : status.textContent;
  });

  input.addEventListener('input', function(){
    update(true);
  });
})();
</script>
