
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; }
  #stage {
    width: 100%;
    min-height: 520px;
    background: #000;
    position: relative;
    overflow: hidden;
    font-family: var(--font-mono, monospace);
    cursor: default;
    border-radius: var(--border-radius-lg);
  }

  #stars-canvas { position: absolute; inset: 0; }

  #clock-ring {
    position: absolute;
    top: 30px; right: 30px;
    width: 90px; height: 90px;
  }

  #taunt {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }
  #taunt-line {
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    transition: opacity 0.08s;
  }
  #taunt-year {
    font-size: 52px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.02em;
    line-height: 1;
    margin: 6px 0 4px;
    font-variant-numeric: tabular-nums;
  }
  #taunt-sub {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.22);
  }

  #timeline {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: rgba(255,255,255,0.06);
  }
  #timeline-fill {
    height: 100%;
    background: rgba(255,255,255,0.4);
    width: 0%;
    transition: width 0.016s linear;
  }

  .era-label {
    position: absolute;
    bottom: 14px;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: rgba(255,255,255,0.18);
    text-transform: uppercase;
    transform: translateX(-50%);
    white-space: nowrap;
    pointer-events: none;
  }

  #event-flash {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, calc(-50% + 64px));
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,200,80,0.9);
    opacity: 0;
    pointer-events: none;
    z-index: 20;
    transition: opacity 0.04s;
    text-align: center;
  }

  #speed-label {
    position: absolute;
    top: 18px; left: 22px;
    font-size: 10px;
    color: rgba(255,255,255,0.18);
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  #pause-btn {
    position: absolute;
    bottom: 20px; right: 20px;
    background: rgba(255,255,255,0.07);
    border: 0.5px solid rgba(255,255,255,0.18);
    color: rgba(255,255,255,0.5);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    z-index: 30;
    font-family: var(--font-mono, monospace);
    transition: background 0.12s, color 0.12s;
  }
  #pause-btn:hover { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.75); }

  #particle-layer { position: absolute; inset: 0; pointer-events: none; }
</style>

<div id="stage">
  <canvas id="stars-canvas"></canvas>
  <canvas id="particle-layer"></canvas>

  <div id="speed-label">1 sec = 1 hour</div>

  <svg id="clock-ring" viewBox="0 0 90 90">
    <circle cx="45" cy="45" r="38" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle id="clock-arc" cx="45" cy="45" r="38" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"
      stroke-dasharray="238.76" stroke-dashoffset="238.76" stroke-linecap="round"
      transform="rotate(-90 45 45)" style="transition:stroke-dashoffset 0.016s linear"/>
    <line id="clock-hand-h" x1="45" y1="45" x2="45" y2="22" stroke="rgba(255,255,255,0.55)" stroke-width="1" stroke-linecap="round"/>
    <line id="clock-hand-m" x1="45" y1="45" x2="45" y2="16" stroke="rgba(255,255,255,0.3)" stroke-width="0.5" stroke-linecap="round"/>
    <circle cx="45" cy="45" r="2" fill="rgba(255,255,255,0.6)"/>
  </svg>

  <div id="taunt">
    <div id="taunt-line">you are watching</div>
    <div id="taunt-year">13,800,000,000</div>
    <div id="taunt-sub">years · in real time</div>
  </div>

  <div id="event-flash"></div>

  <div id="timeline">
    <div id="timeline-fill"></div>
  </div>

  <button id="pause-btn">pause</button>
</div>

<script>
(function() {
  const stage = document.getElementById('stage');
  const starsCanvas = document.getElementById('stars-canvas');
  const sc = starsCanvas.getContext('2d');
  const partCanvas = document.getElementById('particle-layer');
  const pc = partCanvas.getContext('2d');

  const clockArc = document.getElementById('clock-arc');
  const handH = document.getElementById('clock-hand-h');
  const handM = document.getElementById('clock-hand-m');
  const yearEl = document.getElementById('taunt-year');
  const lineEl = document.getElementById('taunt-line');
  const subEl = document.getElementById('taunt-sub');
  const timelineFill = document.getElementById('timeline-fill');
  const eventFlash = document.getElementById('event-flash');
  const pauseBtn = document.getElementById('pause-btn');

  let W, H;
  function resize() {
    W = stage.offsetWidth;
    H = stage.offsetHeight;
    starsCanvas.width = W; starsCanvas.height = H;
    partCanvas.width = W; partCanvas.height = H;
    drawStars();
  }

  const TOTAL_YEARS = 13_800_000_000;
  const CYCLE_MS = 24000;
  const ERA_COLOR_STOPS = [
    { pct: 0,    bg: [0,0,8] },
    { pct: 0.02, bg: [12,4,30] },
    { pct: 0.08, bg: [4,10,28] },
    { pct: 0.25, bg: [2,8,18] },
    { pct: 0.55, bg: [3,12,22] },
    { pct: 0.80, bg: [4,14,18] },
    { pct: 0.95, bg: [6,14,20] },
    { pct: 1.0,  bg: [8,16,24] },
  ];

  const EVENTS = [
    { pct: 0.0001, label: "big bang" },
    { pct: 0.003,  label: "first stars ignite" },
    { pct: 0.016,  label: "early galaxies form" },
    { pct: 0.033,  label: "milky way forms" },
    { pct: 0.33,   label: "solar system born" },
    { pct: 0.36,   label: "earth forms" },
    { pct: 0.42,   label: "first life" },
    { pct: 0.88,   label: "multicellular life" },
    { pct: 0.966,  label: "cambrian explosion" },
    { pct: 0.985,  label: "dinosaurs" },
    { pct: 0.9996, label: "homo sapiens" },
    { pct: 0.9999978, label: "you are born" },
    { pct: 1.0,    label: "→ now" },
  ];

  const ERA_LABELS = [
    { pct: 0.003, text: "primordial" },
    { pct: 0.1,   text: "stellar nurseries" },
    { pct: 0.35,  text: "solar system" },
    { pct: 0.7,   text: "evolution" },
    { pct: 0.97,  text: "complex life" },
    { pct: 0.9999, text: "humans" },
  ];

  let stars = [];
  function drawStars() {
    sc.clearRect(0, 0, W, H);
    stars = [];
    const n = Math.floor(W * H / 900);
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * (H - 20),
        r: Math.random() * 1.1 + 0.2,
        alpha: Math.random() * 0.7 + 0.1,
        twinkleSpeed: Math.random() * 0.04 + 0.01,
        twinkleOffset: Math.random() * Math.PI * 2,
      });
    }
  }

  function lerpColor(a, b, t) {
    return [
      a[0] + (b[0]-a[0])*t,
      a[1] + (b[1]-a[1])*t,
      a[2] + (b[2]-a[2])*t,
    ];
  }
  function getBgColor(pct) {
    for (let i = 1; i < ERA_COLOR_STOPS.length; i++) {
      if (pct <= ERA_COLOR_STOPS[i].pct) {
        const prev = ERA_COLOR_STOPS[i-1];
        const next = ERA_COLOR_STOPS[i];
        const t = (pct - prev.pct) / (next.pct - prev.pct);
        const c = lerpColor(prev.bg, next.bg, t);
        return `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
      }
    }
    return `rgb(8,16,24)`;
  }

  function formatYear(y) {
    if (y < 1000) return Math.round(y).toLocaleString();
    if (y < 1_000_000) return (y/1000).toFixed(1).replace(/\.0$/,'') + 'K';
    if (y < 1_000_000_000) return (y/1_000_000).toFixed(2).replace(/\.?0+$/,'') + 'M';
    return (y/1_000_000_000).toFixed(3).replace(/\.?0+$/,'') + 'B';
  }

  const ERA_MSGS = [
    [0,      0.001, "the universe is born"],
    [0.001,  0.01,  "you are watching"],
    [0.01,   0.05,  "stars are forming"],
    [0.05,   0.33,  "galaxies take shape"],
    [0.33,   0.42,  "earth cools"],
    [0.42,   0.88,  "life begins"],
    [0.88,   0.966, "creatures evolve"],
    [0.966,  0.998, "eons pass"],
    [0.998,  1.0,   "moments ago"],
  ];

  function getMsg(pct) {
    for (const [a,b,m] of ERA_MSGS) if (pct >= a && pct < b) return m;
    return "you are watching";
  }

  let particles = [];
  function spawnParticle() {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.85,
      vx: (Math.random()-0.5)*0.6,
      vy: Math.random()*0.4 + 0.1,
      r: Math.random()*1.4+0.3,
      life: 1,
      decay: Math.random()*0.008+0.003,
      color: `hsla(${200+Math.random()*80|0},60%,80%,`,
    });
  }

  let eventFiredIdx = new Set();
  let flashTimeout = null;
  function checkEvents(pct) {
    for (let i = 0; i < EVENTS.length; i++) {
      if (!eventFiredIdx.has(i) && pct >= EVENTS[i].pct) {
        eventFiredIdx.add(i);
        eventFlash.textContent = EVENTS[i].label;
        eventFlash.style.opacity = '1';
        clearTimeout(flashTimeout);
        flashTimeout = setTimeout(() => { eventFlash.style.opacity = '0'; }, 900);
      }
    }
  }

  let paused = false;
  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? 'resume' : 'pause';
  });

  let startTime = performance.now();
  let lastPct = 0;

  function frame(now) {
    requestAnimationFrame(frame);
    if (paused) return;

    const elapsed = (now - startTime) % CYCLE_MS;
    const pct = elapsed / CYCLE_MS;

    if (pct < lastPct) {
      eventFiredIdx.clear();
    }
    lastPct = pct;

    checkEvents(pct);

    const year = pct * TOTAL_YEARS;
    yearEl.textContent = formatYear(year) + ' yrs';
    lineEl.textContent = getMsg(pct);

    const arcLen = 238.76;
    const hoursInDay = (pct * TOTAL_YEARS * 24) % 24;
    const minutesInHour = (hoursInDay * 60) % 60;
    const hourAngle = (hoursInDay / 12) * 360;
    const minAngle = (minutesInHour / 60) * 360;

    function rotPoint(cx,cy,px,py,deg) {
      const r = deg * Math.PI / 180;
      const dx = px-cx, dy = py-cy;
      return {
        x: cx + dx*Math.cos(r) - dy*Math.sin(r),
        y: cy + dx*Math.sin(r) + dy*Math.cos(r),
      };
    }
    const hPt = rotPoint(45,45,45,22,hourAngle);
    const mPt = rotPoint(45,45,45,16,minAngle);
    handH.setAttribute('x2', hPt.x); handH.setAttribute('y2', hPt.y);
    handM.setAttribute('x2', mPt.x); handM.setAttribute('y2', mPt.y);
    clockArc.style.strokeDashoffset = arcLen * (1 - (minutesInHour / 60));

    stage.style.background = getBgColor(pct);
    timelineFill.style.width = (pct * 100) + '%';

    if (Math.random() < 0.4 + pct * 0.5) spawnParticle();

    pc.clearRect(0, 0, W, H);
    sc.clearRect(0, 0, W, H);

    const t = now * 0.001;
    for (const s of stars) {
      const alpha = s.alpha * (0.6 + 0.4 * Math.sin(t * s.twinkleSpeed + s.twinkleOffset));
      sc.beginPath();
      sc.arc(s.x, s.y, s.r, 0, Math.PI*2);
      sc.fillStyle = `rgba(255,255,255,${alpha * Math.min(1, pct * 50 + 0.3)})`;
      sc.fill();
    }

    particles = particles.filter(p => p.life > 0);
    for (const p of particles) {
      pc.beginPath();
      pc.arc(p.x, p.y, p.r, 0, Math.PI*2);
      pc.fillStyle = p.color + (p.life * 0.3) + ')';
      pc.fill();
      p.x += p.vx; p.y += p.vy;
      p.life -= p.decay;
    }
  }

  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(frame);
})();
</script>
