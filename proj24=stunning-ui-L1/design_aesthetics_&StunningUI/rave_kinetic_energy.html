
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body, .rave-root { background: #000; }
  .rave-root {
    min-height: 600px;
    background: #050008;
    overflow: hidden;
    position: relative;
    font-family: 'Space Grotesk', 'Arial Black', sans-serif;
  }
  .laser-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,255,200,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,200,0.07) 1px, transparent 1px);
    background-size: 38px 38px;
    transform: skewY(-8deg) scaleY(1.3);
    transform-origin: center;
    animation: gridPulse 2s ease-in-out infinite alternate;
  }
  @keyframes gridPulse {
    0%   { opacity: 0.5; transform: skewY(-8deg) scaleY(1.3) translateY(0px); }
    100% { opacity: 1;   transform: skewY(-8deg) scaleY(1.3) translateY(-8px); }
  }
  .laser-grid-2 {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,0,200,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,0,200,0.05) 1px, transparent 1px);
    background-size: 72px 72px;
    transform: skewY(6deg) scaleY(1.2);
    animation: gridPulse2 1.7s ease-in-out infinite alternate;
  }
  @keyframes gridPulse2 {
    0%   { opacity: 0.3; transform: skewY(6deg) scaleY(1.2) translateY(0); }
    100% { opacity: 0.8; transform: skewY(6deg) scaleY(1.2) translateY(6px); }
  }
  .scanline {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent, transparent 3px,
      rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
    );
    pointer-events: none;
    z-index: 20;
  }
  .content {
    position: relative; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 600px;
    padding: 2rem 1rem;
    gap: 2rem;
  }
  .hero-title {
    font-family: 'Bebas Neue', 'Arial Black', sans-serif;
    font-size: clamp(64px, 14vw, 110px);
    letter-spacing: 0.12em;
    text-align: center;
    line-height: 0.9;
    animation: titleGlow 0.5s infinite alternate, hueShift 3s linear infinite;
    color: #fff;
    text-transform: uppercase;
  }
  @keyframes titleGlow {
    0% {
      text-shadow:
        0 0 8px #ff00cc, 0 0 20px #ff00cc, 0 0 40px #ff00cc,
        0 0 80px #ff00cc;
    }
    100% {
      text-shadow:
        0 0 12px #00ffcc, 0 0 30px #00ffcc, 0 0 60px #00ffcc,
        0 0 120px #00ffcc;
    }
  }
  @keyframes hueShift {
    0%   { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }
  .subtitle {
    font-size: 13px;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: #00ffcc;
    text-align: center;
    animation: subtitlePulse 0.8s ease-in-out infinite alternate;
  }
  @keyframes subtitlePulse {
    0% { opacity: 0.5; letter-spacing: 0.45em; color: #00ffcc; }
    100% { opacity: 1;   letter-spacing: 0.55em; color: #ff00aa; }
  }
  .pills {
    display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
  }
  .pill {
    padding: 6px 18px;
    border-radius: 100px;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 700;
    border: 1.5px solid;
    animation: pillBlink 1.2s ease-in-out infinite alternate;
  }
  .pill:nth-child(1) { border-color: #ff00cc; color: #ff00cc; animation-delay: 0s; }
  .pill:nth-child(2) { border-color: #00ffcc; color: #00ffcc; animation-delay: 0.3s; }
  .pill:nth-child(3) { border-color: #aaff00; color: #aaff00; animation-delay: 0.6s; }
  .pill:nth-child(4) { border-color: #ff6600; color: #ff6600; animation-delay: 0.9s; }
  @keyframes pillBlink {
    0% { box-shadow: 0 0 4px currentColor, inset 0 0 4px currentColor; opacity: 0.7; }
    100% { box-shadow: 0 0 14px currentColor, 0 0 28px currentColor, inset 0 0 8px currentColor; opacity: 1; }
  }
  .bars {
    display: flex; align-items: flex-end; gap: 5px;
    height: 60px;
  }
  .bar {
    width: 12px;
    border-radius: 3px 3px 0 0;
    animation: barDance 0.4s ease-in-out infinite alternate;
  }
  .bar:nth-child(1)  { background: #ff00cc; animation-duration: 0.38s; animation-delay: 0.00s; }
  .bar:nth-child(2)  { background: #ff3399; animation-duration: 0.29s; animation-delay: 0.05s; }
  .bar:nth-child(3)  { background: #cc00ff; animation-duration: 0.44s; animation-delay: 0.10s; }
  .bar:nth-child(4)  { background: #6600ff; animation-duration: 0.33s; animation-delay: 0.02s; }
  .bar:nth-child(5)  { background: #00ccff; animation-duration: 0.41s; animation-delay: 0.08s; }
  .bar:nth-child(6)  { background: #00ffcc; animation-duration: 0.27s; animation-delay: 0.15s; }
  .bar:nth-child(7)  { background: #00ff66; animation-duration: 0.48s; animation-delay: 0.03s; }
  .bar:nth-child(8)  { background: #aaff00; animation-duration: 0.36s; animation-delay: 0.12s; }
  .bar:nth-child(9)  { background: #ffee00; animation-duration: 0.31s; animation-delay: 0.07s; }
  .bar:nth-child(10) { background: #ff6600; animation-duration: 0.43s; animation-delay: 0.18s; }
  .bar:nth-child(11) { background: #ff2200; animation-duration: 0.26s; animation-delay: 0.04s; }
  .bar:nth-child(12) { background: #ff00cc; animation-duration: 0.39s; animation-delay: 0.09s; }
  @keyframes barDance {
    0%   { height: 8px;  filter: brightness(0.7); }
    100% { height: 55px; filter: brightness(1.4) drop-shadow(0 0 6px currentColor); }
  }
  .orbs {
    position: absolute; inset: 0; pointer-events: none; z-index: 3;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    mix-blend-mode: screen;
    animation: orbFloat linear infinite;
  }
  .orb-1 { width: 180px; height: 180px; background: radial-gradient(circle, #ff00cc88 0%, transparent 70%); top: -60px; left: 10%; animation-duration: 7s; animation-delay: 0s; }
  .orb-2 { width: 220px; height: 220px; background: radial-gradient(circle, #00ffcc66 0%, transparent 70%); top: 30%; right: -80px; animation-duration: 9s; animation-delay: -3s; }
  .orb-3 { width: 140px; height: 140px; background: radial-gradient(circle, #6600ff77 0%, transparent 70%); bottom: 0; left: 30%; animation-duration: 6s; animation-delay: -1.5s; }
  .orb-4 { width: 100px; height: 100px; background: radial-gradient(circle, #aaff0055 0%, transparent 70%); top: 50%; left: 50%; animation-duration: 5s; animation-delay: -4s; }
  @keyframes orbFloat {
    0%   { transform: translate(0,0) scale(0.8); opacity: 0.6; }
    33%  { transform: translate(30px,-40px) scale(1.1); opacity: 1; }
    66%  { transform: translate(-20px,20px) scale(0.9); opacity: 0.7; }
    100% { transform: translate(0,0) scale(0.8); opacity: 0.6; }
  }
  .laser-lines {
    position: absolute; inset: 0; z-index: 4; pointer-events: none;
    overflow: hidden;
  }
  .laser {
    position: absolute;
    height: 1px;
    width: 60%;
    transform-origin: left center;
    animation: laserSweep linear infinite;
  }
  .laser-1 { top: 20%; left: 0; background: linear-gradient(90deg, transparent, #ff00cc, transparent); animation-duration: 2.1s; }
  .laser-2 { top: 55%; right: 0; transform-origin: right center; background: linear-gradient(90deg, transparent, #00ffcc, transparent); animation-duration: 1.8s; animation-delay: -0.7s; }
  .laser-3 { top: 75%; left: 20%; background: linear-gradient(90deg, transparent, #aaff00, transparent); animation-duration: 2.5s; animation-delay: -1.2s; }
  @keyframes laserSweep {
    0%   { opacity: 0; transform: rotate(-25deg) scaleX(0.3); }
    30%  { opacity: 0.9; transform: rotate(0deg) scaleX(1); }
    60%  { opacity: 0.6; transform: rotate(15deg) scaleX(0.8); }
    100% { opacity: 0; transform: rotate(30deg) scaleX(0.2); }
  }
  .strobe {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: white;
    animation: strobe 3.2s steps(1) infinite;
  }
  @keyframes strobe {
    0%    { opacity: 0; }
    91%   { opacity: 0; }
    91.5% { opacity: 0.04; }
    92%   { opacity: 0; }
    94%   { opacity: 0; }
    94.4% { opacity: 0.03; }
    94.8% { opacity: 0; }
    100%  { opacity: 0; }
  }
  .btn-rave {
    margin-top: 0.5rem;
    padding: 10px 32px;
    background: transparent;
    border: 2px solid #ff00cc;
    color: #ff00cc;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    animation: btnPulse 0.7s ease-in-out infinite alternate;
    transition: background 0.2s;
  }
  .btn-rave:hover { background: #ff00cc22; }
  @keyframes btnPulse {
    0% { box-shadow: 0 0 6px #ff00cc, 0 0 12px #ff00cc; }
    100% { box-shadow: 0 0 18px #ff00cc, 0 0 40px #ff00cc, 0 0 6px #ff00cc inset; }
  }
  .bpm-counter {
    position: absolute; top: 16px; right: 20px;
    font-size: 11px; letter-spacing: 0.2em;
    color: #ff00cc; z-index: 15;
    animation: bpmFlash 0.5s ease-in-out infinite alternate;
  }
  @keyframes bpmFlash {
    0% { opacity: 0.4; }
    100% { opacity: 1; text-shadow: 0 0 10px #ff00cc; }
  }
  .tag-line {
    font-size: 10px; letter-spacing: 0.5em; text-transform: uppercase;
    color: #ffffff44; text-align: center;
  }
</style>

<div class="rave-root" aria-label="Rave kinetic energy visual with pulsing neon animations">
  <div class="laser-grid"></div>
  <div class="laser-grid-2"></div>
  <div class="orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>
  <div class="laser-lines">
    <div class="laser laser-1"></div>
    <div class="laser laser-2"></div>
    <div class="laser laser-3"></div>
  </div>
  <div class="strobe"></div>
  <div class="scanline"></div>

  <div class="bpm-counter" id="bpm">140 BPM</div>

  <div class="content">
    <div class="subtitle">Kinetic Energy</div>
    <div class="hero-title">RAVE</div>

    <div class="bars">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>

    <div class="pills">
      <div class="pill">Techno</div>
      <div class="pill">Acid</div>
      <div class="pill">Jungle</div>
      <div class="pill">Hardcore</div>
    </div>

    <button class="btn-rave" onclick="sendPrompt('Build me a full Rave-themed landing page with ticket countdown, lineup, and map')">Build the full experience ↗</button>
    <div class="tag-line">DOORS OPEN AT MIDNIGHT · NO FLASH PHOTOGRAPHY</div>
  </div>
</div>

<script>
  const bpmEl = document.getElementById('bpm');
  const bpms = [128, 132, 136, 138, 140, 142, 145, 150, 174];
  let i = 0;
  setInterval(() => {
    i = (i + 1) % bpms.length;
    bpmEl.textContent = bpms[i] + ' BPM';
  }, 2800);
</script>
