
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .success-scene {
    position: relative;
    min-height: 520px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--color-background-primary);
    border-radius: var(--border-radius-lg);
    border: 0.5px solid var(--color-border-tertiary);
    user-select: none;
  }

  canvas#confetti-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .success-content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 2rem;
  }

  .checkmark-ring {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: var(--color-background-success);
    border: 0.5px solid var(--color-border-success);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: checkDrop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
  }

  @keyframes checkDrop {
    0%   { transform: scale(0) translateY(-40px); opacity: 0; }
    60%  { transform: scale(1.15) translateY(0); opacity: 1; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  .checkmark-ring i {
    font-size: 40px;
    color: var(--color-text-success);
  }

  .success-text {
    text-align: center;
    animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.55s both;
  }

  @keyframes slideUp {
    from { transform: translateY(50px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  .success-text h2 {
    font-size: 22px;
    font-weight: 500;
    color: var(--color-text-primary);
    margin-bottom: 6px;
  }

  .success-text p {
    font-size: 15px;
    color: var(--color-text-secondary);
    line-height: 1.6;
  }

  .order-pill {
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: 999px;
    padding: 6px 18px;
    font-size: 13px;
    color: var(--color-text-secondary);
    animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.7s both;
  }

  .order-pill span {
    color: var(--color-text-primary);
    font-weight: 500;
  }

  .cta-btn {
    margin-top: 8px;
    padding: 13px 32px;
    border-radius: var(--border-radius-lg);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.85s both, glowPulse 2s ease-in-out 1.5s infinite;
    transition: transform 0.15s;
  }

  .cta-btn:hover { transform: scale(1.03); }
  .cta-btn:active { transform: scale(0.97); }

  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 0 0 transparent; border-color: var(--color-border-secondary); }
    50%       { box-shadow: 0 0 0 4px color-mix(in srgb, var(--color-text-success) 18%, transparent); border-color: var(--color-border-success); }
  }

  .replay-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 3;
    background: transparent;
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-md);
    color: var(--color-text-secondary);
    font-size: 13px;
    padding: 5px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s;
  }
  .replay-btn:hover { background: var(--color-background-secondary); }
</style>

<h2 class="sr-only">Order success celebration animation with confetti burst and checkmark</h2>

<div class="success-scene" id="scene">
  <canvas id="confetti-canvas"></canvas>

  <div class="success-content" id="success-content">
    <div class="checkmark-ring">
      <i class="ti ti-check" aria-hidden="true"></i>
    </div>
    <div class="success-text">
      <h2>Order confirmed!</h2>
      <p>Your items are on their way.<br>You'll get a tracking email shortly.</p>
    </div>
    <div class="order-pill">Order <span>#ORD-29418</span> · ₹2,490</div>
    <button class="cta-btn" onclick="sendPrompt('Show me product recommendations based on my recent order')">
      Continue shopping ↗
    </button>
  </div>

  <button class="replay-btn" id="replay-btn" aria-label="Replay animation">
    <i class="ti ti-refresh" aria-hidden="true"></i> Replay
  </button>
</div>

<script>
(function() {
  const canvas = document.getElementById('confetti-canvas');
  const scene  = document.getElementById('scene');
  const ctx    = canvas.getContext('2d');

  const COLORS = [
    '#7F77DD','#AFA9EC',
    '#1D9E75','#5DCAA5',
    '#D85A30','#F0997B',
    '#D4537E','#ED93B1',
    '#378ADD','#85B7EB',
    '#BA7517','#EF9F27',
    '#639922','#97C459',
    '#E24B4A','#F09595'
  ];

  let particles = [];
  let animId = null;
  let startTime = null;
  const DURATION = 3500;

  function resize() {
    canvas.width  = scene.offsetWidth;
    canvas.height = scene.offsetHeight;
  }

  function makeParticle(burst) {
    const cx = canvas.width  * (0.3 + Math.random() * 0.4);
    const cy = canvas.height * (burst ? 0.45 : -0.05);
    const angle = burst
      ? (Math.random() * Math.PI * 2)
      : (Math.PI * 0.5 + (Math.random() - 0.5) * 1.2);
    const speed = burst
      ? (4 + Math.random() * 9)
      : (3 + Math.random() * 5);
    return {
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed * (burst ? 1 : -1),
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      w: 6 + Math.random() * 7,
      h: 4 + Math.random() * 5,
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.3,
      gravity: 0.18 + Math.random() * 0.12,
      alpha: 1,
      shape: Math.random() < 0.3 ? 'circle' : 'rect'
    };
  }

  function burst() {
    for (let i = 0; i < 220; i++) {
      particles.push(makeParticle(true));
    }
  }

  function tick(ts) {
    if (!startTime) startTime = ts;
    const elapsed = ts - startTime;

    resize();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (elapsed < 800 && particles.length < 220) {
      for (let i = 0; i < 4; i++) particles.push(makeParticle(false));
    }

    particles.forEach(p => {
      p.x  += p.vx;
      p.y  += p.vy;
      p.vy += p.gravity;
      p.vx *= 0.99;
      p.rot += p.rotV;
      if (elapsed > DURATION - 800) {
        p.alpha = Math.max(0, p.alpha - 0.025);
      }
    });

    particles = particles.filter(p => p.y < canvas.height + 20 && p.alpha > 0);

    particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle   = p.color;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      if (p.shape === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      }
      ctx.restore();
    });

    if (elapsed < DURATION || particles.length > 0) {
      animId = requestAnimationFrame(tick);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  function launch() {
    if (animId) cancelAnimationFrame(animId);
    particles = [];
    startTime = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    burst();
    animId = requestAnimationFrame(tick);

    const content = document.getElementById('success-content');
    content.style.animation = 'none';
    void content.offsetWidth;
    content.style.animation = '';

    content.querySelectorAll('[style*="animation"], .checkmark-ring, .success-text, .order-pill, .cta-btn').forEach(el => {
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = '';
    });
  }

  document.getElementById('replay-btn').addEventListener('click', launch);
  resize();
  setTimeout(launch, 100);
})();
</script>
