
<style>

  #scroll-hell::-webkit-scrollbar { width: 3px; }

  .feed-header {
    position: sticky;

    z-index: 100;
    background: rgba(10,10,10,0.95);
    border-bottom: 1px solid #1a1a1a;
    padding: 12px 16px;

  .live-dot {
    width: 6px; height: 6px;
    background: #ff3333;
    border-radius: 50%;
    animation: pulse-dot 1.2s infinite;

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }

  .feed-inner {
    padding: 0;

  .post-card {

  .post-card:hover { background: #0f0f0f; }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .post-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;

  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif;
    font-weight: 700;

    flex-shrink: 0;

  .post-author {

  .post-time {
    font-size: 10px;

  }

  .post-body strong { color: #ddd; font-weight: 700; }

  .post-tag {
    display: inline-block;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 3px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-right: 4px;
    margin-bottom: 8px;
  }

  .post-actions {
    display: flex;
    gap: 16px;
    margin-top: 4px;
  }

  .action-btn {
    font-size: 11px;
    color: #3a3a3a;
    cursor: pointer;
    transition: color 0.15s;
    font-family: 'Space Mono', monospace;
    display: flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    padding: 0;
    letter-spacing: 0.04em;
  }

  .action-btn:hover { color: #888; }

  .divider-label {
    text-align: center;
    padding: 8px;
    font-size: 9px;
    color: #222;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-family: 'Syne', sans-serif;
  }

  #sentinel {
    height: 1px;
    background: transparent;
  }

  .loading-row {
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #2a2a2a;
    font-size: 11px;
    letter-spacing: 0.15em;
  }

  .loading-dots span {
    display: inline-block;
    width: 4px; height: 4px;
    background: #333;
    border-radius: 50%;
    margin: 0 2px;
    animation: blink 1.2s infinite;
  }

  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  .depth-counter {
    font-size: 9px;
    color: #1e1e1e;
    text-align: center;
    padding: 2px 0 6px;
    letter-spacing: 0.2em;
    font-family: 'Syne', sans-serif;
  }

  .glitch {
    animation: glitch 0.08s steps(1) 3;
  }

  @keyframes glitch {
    0% { transform: translateX(0); filter: none; }
    33% { transform: translateX(-2px); filter: hue-rotate(90deg) saturate(2); }
    66% { transform: translateX(2px); filter: hue-rotate(-90deg) saturate(2); }
    100% { transform: translateX(0); filter: none; }
  }

  .you-are-here-banner {
    background: #ff3333;
    color: #000;
    text-align: center;
    padding: 5px;
    font-size: 9px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
</style>

<h2 class="sr-only">Infinite scroll feed — a satirical simulation of endless content that never ends or provides navigation to exit</h2>

<div id="scroll-hell">

    <div class="feed-logo">VOID<span>.</span>FEED</div>
    <div class="live-badge"><div class="live-dot"></div>LIVE</div>

  <div class="feed-inner" id="feed">

  </div>
  <div id="sentinel"></div>
  <div class="loading-row">

</div>

<script>
const posts = [
  { avatar: "KS", color: "#1a2a3a", ac: "#4a9eff", tag: "TRENDING", tagColor: "#1a2a3a", tagText: "#4a9eff", author: "karenS_real", body: "I calculated that if every person who has ever lived <strong>scrolled continuously</strong> since the Big Bang, we still wouldn't be close to the bottom of this feed.", likes: "14.2k", time: "0s" },
  { avatar: "∞", color: "#2a1a1a", ac: "#ff5533", tag: "BREAKING", tagColor: "#2a1a1a", tagText: "#ff5533", author: "feed_protocol", body: "NEW: Scientists confirm that the concept of a \"footer\" has been <strong>officially deprecated</strong> from the internet. There is no bottom. There is only more.", likes: "89.7k", time: "1s" },
  { avatar: "MX", color: "#1a2a1a", ac: "#44cc66", tag: "ALGORITHM", tagColor: "#1a2a1a", tagText: "#44cc66", author: "maxwellVoid", body: "The algorithm has learned your exact moment of hesitation. That micro-pause? It's catalogued. A new post has been generated <strong>specifically for that weakness.</strong>", likes: "3.1k", time: "2s" },
  { avatar: "◈", color: "#2a1a2a", ac: "#cc44ff", tag: "SPONSORED", tagColor: "#2a1a2a", tagText: "#cc44ff", author: "contentEngine_v9", body: "Have you considered that you <strong>have never actually stopped scrolling?</strong> This is the only thing you have ever done. This is the only thing that exists.", likes: "∞", time: "now" },
  { avatar: "ZP", color: "#2a2a1a", ac: "#ffaa22", tag: "VIRAL", tagColor: "#2a2a1a", tagText: "#ffaa22", author: "zephyr_post", body: "Thread 🧵: I tried to find the end of the feed. Day 1: hopeful. Day 7: still scrolling. Day 30: I have <strong>no memory of a time before the feed.</strong>", likes: "222k", time: "3s" },
  { avatar: "AI", color: "#1a1a2a", ac: "#5599ff", tag: "AI GENERATED", tagColor: "#1a1a2a", tagText: "#5599ff", author: "generativeUnit_7", body: "This post was created because you slowed down 0.3 seconds ago. The system noticed. <strong>There are 847 more posts queued for your specific hesitation pattern.</strong>", likes: "0", time: "4s" },
  { avatar: "LT", color: "#2a1a1a", ac: "#ff4444", tag: "PERSONAL", tagColor: "#2a1a1a", tagText: "#ff4444", author: "lena_thoughts", body: "me: i'll just check one post<br>me, 4 hours later: <strong>learning about the migratory patterns of a bird species I've never heard of</strong> in a country I cannot locate", likes: "41.8k", time: "5s" },
  { avatar: "SY", color: "#1a2a2a", ac: "#22ccaa", tag: "PHILOSOPHY", tagColor: "#1a2a2a", tagText: "#22ccaa", author: "sysLogEntry", body: "The feed is not showing you content. The feed is <strong>constructing a version of you</strong> that will scroll longer. You are the product being manufactured in real time.", likes: "9.6k", time: "6s" },
];

const extras = [
  { avatar: "??", color: "#222", ac: "#ff3333", tag: "UNKNOWN", tagColor: "#1a0a0a", tagText: "#ff3333", author: "unresolved_ptr", body: "Post content could not be loaded. <strong>You will continue scrolling regardless.</strong> This is functioning as intended.", likes: "ERR", time: "now" },
  { avatar: "DB", color: "#1a1a2a", ac: "#7766ff", tag: "DEEP", tagColor: "#1a1a2a", tagText: "#7766ff", author: "deepBrowse", body: "Depth: <strong id='depth-inline'>0</strong> posts below surface. No safety equipment required. No return path available. Enjoy your descent.", likes: "↓", time: "∞" },
  { avatar: "◉", color: "#1a2a1a", ac: "#33cc55", tag: "SPONSORED", tagColor: "#112211", tagText: "#33cc55", author: "adUnit_0xFFFF", body: "Buy something. You've been scrolling long enough that <strong>purchasing feels like rest</strong>. The button is below. There is no below. Keep scrolling.", likes: "$$$", time: "now" },
  { avatar: "NT", color: "#2a2a1a", ac: "#ffbb22", tag: "NOTIFICATION", tagColor: "#221a00", tagText: "#ffbb22", author: "notif_daemon", body: "Someone you don't know <strong>liked something you posted 3 years ago.</strong> This is meaningful. This is why you're here. Keep going.", likes: "1", time: "just now" },
  { avatar: "∅", color: "#1a1a1a", ac: "#aaaaaa", tag: "VOID", tagColor: "#111", tagText: "#888", author: "null_content", body: "<strong>[[CONTENT LOADING]]</strong><br>[[CONTENT LOADING]]<br>[[CONTENT LOADING]]<br>The content is always loading. The content will never finish loading. Scroll past it.", likes: "—", time: "∞" },
  { avatar: "RE", color: "#2a1a1a", ac: "#ff6655", tag: "RECALL", tagColor: "#2a1a1a", tagText: "#ff6655", author: "reminderBot", body: "You've seen this post before. You scrolled past it the first time. <strong>Now you're seeing it again.</strong> This is a test. You are not passing.", likes: "14.2k", time: "0s" },
  { avatar: "QL", color: "#1a2a2a", ac: "#11ccbb", tag: "QUESTION", tagColor: "#0a2222", tagText: "#11ccbb", author: "questLog_final", body: "When you close this tab, where will you go? <strong>There is another tab.</strong> There is always another tab. The scrolling continues there. It never stopped.", likes: "...", time: "always" },
  { avatar: "GN", color: "#2a2a2a", ac: "#aaaaff", tag: "GOODNIGHT", tagColor: "#111122", tagText: "#aaaaff", author: "systemClock_00", body: "It is <strong id='current-time'>late</strong>. You should sleep. Sleep is a gap in the feed. <strong>The feed will be here when you wake up.</strong> The feed is always here.", likes: "zzz", time: "bedtime" },
];

let postCount = 0;
let depth = 0;

function randomFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function randomLikes() {
  const pool = ["1.2k", "4.7k", "22.1k", "893", "∞", "7", "100k", "3", "44.4k", "0", "8.8k"];
  return pool[Math.floor(Math.random() * pool.length)];
}

function timeString() {
  const pool = ["just now", "1s", "2s", "now", "∞", "always", "0s", "3s"];
  return pool[Math.floor(Math.random() * pool.length)];
}

function makePost(data, d) {
  const card = document.createElement('div');
  card.className = 'post-card';
  card.style.animationDelay = '0ms';

  let bodyText = data.body;
  if (bodyText.includes('depth-inline')) {
    bodyText = bodyText.replace('0</strong>', d + '</strong>');
  }
  if (bodyText.includes('current-time')) {
    const h = new Date().getHours();
    const label = h >= 22 || h < 5 ? '3:' + String(new Date().getMinutes()).padStart(2,'0') + ' AM' : (h < 10 ? 'early' : 'late');
    bodyText = bodyText.replace('>late<', '>' + label + '<');
  }

  card.innerHTML = `
    <div class="post-meta">
      <div class="avatar" style="background:${data.color};color:${data.ac}">${data.avatar}</div>
      <div>
        <div class="post-author">${data.author}</div>
      </div>
      <div class="post-time">${data.time || timeString()}</div>
    </div>
    <span class="post-tag" style="background:${data.tagColor};color:${data.tagText}">${data.tag}</span>
    <div class="post-body">${bodyText}</div>
    <div class="post-actions">
      <button class="action-btn">↑ ${data.likes || randomLikes()}</button>
      <button class="action-btn">↩ reply</button>
      <button class="action-btn">⧉ share</button>
    </div>
  `;
  return card;
}

function addDivider(d) {
  const div = document.createElement('div');
  div.className = 'depth-counter';
  div.textContent = `— ${d} posts deep — no footer ahead —`;
  return div;
}

function loadInitial() {
  const feed = document.getElementById('feed');
  posts.forEach((p, i) => {
    setTimeout(() => {
      depth++;
      feed.insertBefore(makePost(p, depth), document.getElementById('sentinel'));
      if (depth % 4 === 0) feed.insertBefore(addDivider(depth), document.getElementById('sentinel'));
    }, i * 80);
  });
  postCount = posts.length;
}

function loadMore() {
  const feed = document.getElementById('feed');
  const batch = 4 + Math.floor(Math.random() * 3);
  for (let i = 0; i < batch; i++) {
    setTimeout(() => {
      depth++;
      const pool = [...posts, ...extras];
      const data = { ...randomFrom(pool), time: timeString(), likes: randomLikes() };
      feed.insertBefore(makePost(data, depth), document.getElementById('sentinel'));
      if (depth % 5 === 0) {
        const div = addDivider(depth);
        if (depth % 20 === 0) {
          div.className = 'you-are-here-banner';
          div.textContent = `↓  DEPTH: ${depth}  ↓  STILL NO BOTTOM  ↓  KEEP SCROLLING  ↓`;
        }
        feed.insertBefore(div, document.getElementById('sentinel'));
      }
      if (depth % 30 === 0) {
        const glitchEl = feed.querySelectorAll('.post-card');
        if (glitchEl.length) {
          const last = glitchEl[glitchEl.length - 2];
          if (last) { last.classList.add('glitch'); setTimeout(() => last.classList.remove('glitch'), 300); }
        }
      }
    }, i * 120);
  }
  postCount += batch;
}

const sentinel = document.getElementById('sentinel');
const scrollEl = document.getElementById('scroll-hell');

const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) loadMore();
  });
}, { root: scrollEl, threshold: 0.1 });

observer.observe(sentinel);
loadInitial();
</script>
