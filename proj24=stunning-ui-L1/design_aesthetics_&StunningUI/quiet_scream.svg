<svg width="100%" viewBox="0 0 690 830" role="img" xmlns="http://www.w3.org/2000/svg" style="">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Quiet Scream</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A vast white space with nearly invisible text screaming for help. The visual silence contradicts the desperate content.</desc>

  

  <rect width="680" height="820" style="fill:rgb(249, 249, 249);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <text x="340" y="118" text-anchor="middle" style="fill:rgb(242, 242, 242);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;font-size:6px;font-weight:200;text-anchor:middle;dominant-baseline:auto">please</text>
  <text x="340" y="178" text-anchor="middle" style="fill:rgb(242, 242, 242);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;font-size:6px;font-weight:200;text-anchor:middle;dominant-baseline:auto">is anyone there</text>
  <text x="340" y="248" text-anchor="middle" style="fill:rgb(239, 239, 239);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;font-size:7px;font-weight:300;text-anchor:middle;dominant-baseline:auto">i am screaming</text>
  <text x="340" y="318" text-anchor="middle" style="fill:rgb(236, 236, 236);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;font-size:9px;font-weight:200;text-anchor:middle;dominant-baseline:auto">help</text>
  <text x="340" y="388" text-anchor="middle" style="fill:rgb(232, 232, 232);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;font-size:8px;font-weight:300;text-anchor:middle;dominant-baseline:auto">someone notice me</text>
  <text x="340" y="448" text-anchor="middle" style="fill:rgb(242, 242, 242);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;font-size:6px;font-weight:200;text-anchor:middle;dominant-baseline:auto">i have been here the whole time</text>
  <text x="340" y="508" text-anchor="middle" style="fill:rgb(239, 239, 239);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;font-size:7px;font-weight:300;text-anchor:middle;dominant-baseline:auto">i am not okay</text>
  <text x="340" y="568" text-anchor="middle" style="fill:rgb(242, 242, 242);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;font-size:6px;font-weight:200;text-anchor:middle;dominant-baseline:auto">look closer</text>
  <text x="340" y="628" text-anchor="middle" style="fill:rgb(236, 236, 236);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;font-size:9px;font-weight:200;text-anchor:middle;dominant-baseline:auto">help</text>
  <text x="340" y="688" text-anchor="middle" style="fill:rgb(242, 242, 242);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;font-size:6px;font-weight:200;text-anchor:middle;dominant-baseline:auto">i said it twice</text>
  <text x="340" y="748" text-anchor="middle" style="fill:rgb(242, 242, 242);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;font-size:6px;font-weight:200;text-anchor:middle;dominant-baseline:auto">did you hear me the first time</text>
</svg>