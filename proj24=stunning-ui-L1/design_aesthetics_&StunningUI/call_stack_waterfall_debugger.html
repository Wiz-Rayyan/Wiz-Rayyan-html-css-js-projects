<style>
h2.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-mono);font-size:13px}
.root{display:grid;grid-template-columns:1fr 300px;gap:0;min-height:520px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden}
.editor-pane{background:var(--color-background-secondary);border-right:0.5px solid var(--color-border-tertiary);display:flex;flex-direction:column}
.editor-header{padding:8px 14px;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;gap:8px;font-size:12px;color:var(--color-text-secondary);background:var(--color-background-primary)}
.editor-header i{font-size:15px}
.editor-body{flex:1;overflow-y:auto;padding:8px 0}
.code-line{display:flex;align-items:center;gap:0;padding:1px 0;transition:background 0.2s}
.code-line.active{background:rgba(255,210,80,0.13)}
.line-num{width:36px;text-align:right;padding-right:10px;font-size:11px;color:var(--color-text-tertiary);user-select:none;flex-shrink:0}
.line-arrow{width:14px;font-size:11px;color:#EF9F27;flex-shrink:0}
.line-text{white-space:pre;font-size:12px;color:var(--color-text-secondary)}
.line-text .kw{color:#7F77DD}.line-text .fn{color:#1D9E75}.line-text .str{color:#D85A30}.line-text .num{color:#378ADD}.line-text .cm{color:var(--color-text-tertiary)}
.stack-pane{display:flex;flex-direction:column}
.stack-header{padding:8px 14px;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:space-between;background:var(--color-background-primary)}
.stack-header-left{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--color-text-secondary)}
.stack-header-left i{font-size:15px}
.btn-replay{font-size:11px;padding:3px 10px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);cursor:pointer;display:flex;align-items:center;gap:4px}
.btn-replay:hover{background:var(--color-background-secondary)}
.stack-frames{flex:1;overflow-y:auto;padding:10px 10px 10px}
.frame{border-radius:var(--border-radius-md);border:1.5px solid transparent;padding:9px 12px;margin-bottom:7px;cursor:pointer;position:relative;transform:translateY(-28px);opacity:0;transition:transform 0.38s cubic-bezier(.34,1.56,.64,1),opacity 0.3s ease,border-color 0.2s,box-shadow 0.2s;user-select:none}
.frame.visible{transform:translateY(0);opacity:1}
.frame:hover{border-color:var(--color-border-secondary) !important}
.frame.selected{box-shadow:0 0 0 2.5px #EF9F27 !important;border-color:#EF9F27 !important}
.frame.current{border-color:#EF9F27;box-shadow:0 0 0 2px rgba(239,159,39,0.3)}
.frame-name{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:2px}
.frame-loc{font-size:11px;color:var(--color-text-tertiary)}
.frame-badge{position:absolute;top:7px;right:10px;font-size:10px;padding:1px 7px;border-radius:99px;font-family:var(--font-sans)}
.scope-panel{border-top:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);overflow:hidden;max-height:0;transition:max-height 0.28s ease}
.scope-panel.open{max-height:220px}
.scope-inner{padding:10px 14px}
.scope-section{margin-bottom:8px}
.scope-label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.05em;color:var(--color-text-tertiary);margin-bottom:5px;font-family:var(--font-sans)}
.scope-row{display:flex;justify-content:space-between;padding:2px 0;gap:8px}
.scope-key{color:var(--color-text-secondary);font-size:11px;min-width:80px}
.scope-val{color:#1D9E75;font-size:11px;text-align:right}
</style>
<h2 class="sr-only">Call stack waterfall debugger — interactive visualization of function call frames with scope inspection</h2>

<div class="root">
  <div class="editor-pane">
    <div class="editor-header"><i class="ti ti-code" aria-hidden="true"></i> app.js — paused at breakpoint</div>
    <div class="editor-body" id="editorBody"></div>
  </div>
  <div class="stack-pane">
    <div class="stack-header">
      <div class="stack-header-left"><i class="ti ti-layers-subtract" aria-hidden="true"></i> call stack</div>
      <button class="btn-replay" id="btnReplay" aria-label="Replay waterfall animation"><i class="ti ti-player-play" aria-hidden="true"></i> replay</button>
    </div>
    <div class="stack-frames" id="stackFrames"></div>
    <div class="scope-panel" id="scopePanel">
      <div class="scope-inner" id="scopeInner"></div>
    </div>
  </div>
</div>

<script>
const FRAMES = [
  {
    name: "fetchUserData",
    file: "api.js",
    line: 42,
    badge: "● paused",
    badgeColor: "#D85A30",
    bg: "#E6F1FB",
    bgDark: "#042C53",
    border: "#185FA5",
    depth: 0,
    scope: {
      local: { userId: "\"user_4821\"", retries: "3", timeout: "5000" },
      closure: { baseUrl: "\"https://api.app.io\"", token: "\"Bearer …af3\"" },
    }
  },
  {
    name: "loadProfile",
    file: "profile.js",
    line: 18,
    badge: null,
    bg: "#B5D4F4",
    bgDark: "#0C447C",
    border: "#378ADD",
    depth: 1,
    scope: {
      local: { profileId: "42", cache: "null" },
      closure: { store: "{ users: Map(3) }" },
    }
  },
  {
    name: "initDashboard",
    file: "dashboard.js",
    line: 7,
    badge: null,
    bg: "#85B7EB",
    bgDark: "#185FA5",
    border: "#378ADD",
    depth: 2,
    scope: {
      local: { config: "{ theme: \"dark\" }" },
      closure: { router: "Router { … }" },
    }
  },
  {
    name: "bootstrap",
    file: "main.js",
    line: 3,
    badge: null,
    bg: "#4A6FA0",
    bgDark: "#0C447C",
    border: "#185FA5",
    depth: 3,
    scope: {
      local: { env: "\"production\"" },
      global: { window: "Window { … }", document: "Document { … }" },
    }
  },
  {
    name: "(anonymous)",
    file: "index.html",
    line: 1,
    badge: null,
    bg: "#2A4A70",
    bgDark: "#042C53",
    border: "#0C447C",
    depth: 4,
    scope: {
      global: { window: "Window { … }", navigator: "Navigator { … }" },
    }
  }
];

const CODE_LINES = [
  {n:1,  t: '<span class="kw">import</span> { api } <span class="kw">from</span> <span class="str">\'./api\'</span>'},
  {n:2,  t: ''},
  {n:3,  t: '<span class="kw">async function</span> <span class="fn">fetchUserData</span>(userId) {'},
  {n:4,  t: '  <span class="kw">const</span> retries = <span class="num">3</span>'},
  {n:5,  t: '  <span class="kw">const</span> timeout = <span class="num">5000</span>'},
  {n:6,  t: '  <span class="cm">// validate and fetch from API</span>'},
  {n:7,  t: '  <span class="kw">if</span> (!userId) <span class="kw">throw new</span> Error(<span class="str">\'Missing id\'</span>)'},
  {n:8,  t: ''},
  {n:9,  t: '  <span class="kw">const</span> res = <span class="kw">await</span> <span class="fn">api</span>.get('},
  {n:10, t: '    <span class="str">`/users/${userId}`</span>, { retries, timeout }'},
  {n:11, t: '  )'},
  {n:12, t: ''},
  {n:13, t: '  <span class="kw">return</span> res.data   <span class="cm">// ← breakpoint</span>'},
  {n:14, t: '}'},
];

const lineForFrame = [13, 9, 7, 3, 1];

let selectedFrame = null;

function buildEditor(activeLine) {
  const body = document.getElementById("editorBody");
  body.innerHTML = CODE_LINES.map(l => {
    const isActive = l.n === activeLine;
    return `<div class="code-line${isActive?" active":""}" data-line="${l.n}">
      <span class="line-num">${l.n}</span>
      <span class="line-arrow">${isActive?"▶":""}</span>
      <span class="line-text">${l.t}</span>
    </div>`;
  }).join("");
  if(activeLine){
    const el = body.querySelector(`[data-line="${activeLine}"]`);
    if(el) el.scrollIntoView({block:"center", behavior:"smooth"});
  }
}

function buildStack() {
  const container = document.getElementById("stackFrames");
  container.innerHTML = FRAMES.map((f,i) => {
    const textColor = f.depth >= 3 ? "#E6F1FB" : f.depth >= 2 ? "#042C53" : "#042C53";
    const subtextColor = f.depth >= 3 ? "rgba(230,241,251,0.65)" : "rgba(4,44,83,0.6)";
    return `<div class="frame${i===0?" current selected":""}" id="frame-${i}" data-idx="${i}"
      style="background:${f.bg};border-color:${i===0?'#EF9F27':f.border}"
      role="button" tabindex="0" aria-label="Frame ${f.name}">
      <div class="frame-name" style="color:${textColor}">${f.name}</div>
      <div class="frame-loc" style="color:${subtextColor}">${f.file} : ${f.line}</div>
      ${f.badge?`<span class="frame-badge" style="background:rgba(216,90,48,0.13);color:${f.badgeColor}">${f.badge}</span>`:""}
    </div>`;
  }).join("");

  container.querySelectorAll(".frame").forEach(el => {
    el.addEventListener("click", () => selectFrame(parseInt(el.dataset.idx)));
    el.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" ") selectFrame(parseInt(el.dataset.idx)); });
    el.addEventListener("mouseenter", () => {
      if(selectedFrame === null) showScope(parseInt(el.dataset.idx), false);
    });
    el.addEventListener("mouseleave", () => {
      if(selectedFrame === null) closeScope();
    });
  });
}

function selectFrame(idx) {
  selectedFrame = idx;
  document.querySelectorAll(".frame").forEach((el,i) => {
    el.classList.toggle("selected", i===idx);
  });
  buildEditor(lineForFrame[idx]);
  showScope(idx, true);
}

function showScope(idx, persist) {
  const f = FRAMES[idx];
  const panel = document.getElementById("scopePanel");
  const inner = document.getElementById("scopeInner");
  const sections = ["local","closure","global"];
  let html = "";
  sections.forEach(sec => {
    if(!f.scope[sec]) return;
    html += `<div class="scope-section"><div class="scope-label">${sec}</div>`;
    Object.entries(f.scope[sec]).forEach(([k,v]) => {
      html += `<div class="scope-row"><span class="scope-key">${k}</span><span class="scope-val">${v}</span></div>`;
    });
    html += "</div>";
  });
  inner.innerHTML = html;
  panel.classList.add("open");
}

function closeScope() {
  document.getElementById("scopePanel").classList.remove("open");
}

function animateFrames() {
  const frames = document.querySelectorAll(".frame");
  frames.forEach(f => f.classList.remove("visible"));
  frames.forEach((f, i) => {
    setTimeout(() => f.classList.add("visible"), 80 + i * 90);
  });
}

function init() {
  buildEditor(lineForFrame[0]);
  buildStack();
  setTimeout(animateFrames, 80);
}

document.getElementById("btnReplay").addEventListener("click", () => {
  selectedFrame = null;
  closeScope();
  buildEditor(lineForFrame[0]);
  buildStack();
  setTimeout(animateFrames, 80);
});

init();
</script>
