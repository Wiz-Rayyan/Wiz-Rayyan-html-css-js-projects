
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; }
  #player {
    padding: 2rem 1.5rem 1.5rem;
    font-family: var(--font-sans);
    max-width: 680px;
  }
  #top { display: flex; align-items: center; gap: 1.25rem; margin-bottom: 1.5rem; }
  #album {
    width: 64px; height: 64px; border-radius: var(--border-radius-md);
    background: linear-gradient(135deg, #534AB7 0%, #1D9E75 100%);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  #album-inner {
    width: 22px; height: 22px; border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    position: relative;
  }
  #album-inner::after {
    content: '';
    position: absolute; inset: 50%; transform: translate(-50%,-50%);
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(255,255,255,0.6);
  }
  #meta { flex: 1; min-width: 0; }
  #title { font-size: 16px; font-weight: 500; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #artist { font-size: 13px; color: var(--color-text-secondary); margin-top: 2px; }
  #time-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; }
  #waveform-wrap {
    position: relative; cursor: pointer; margin-bottom: 1rem;
    border-radius: var(--border-radius-md); overflow: hidden;
  }
  #waveform { display: block; width: 100%; height: 72px; border-radius: var(--border-radius-md); }
  #seek-thumb {
    position: absolute; top: 0; bottom: 0; width: 2px;
    background: rgba(255,255,255,0.7);
    pointer-events: none;
    transform: translateX(-50%);
    display: none;
  }
  #controls { display: flex; align-items: center; gap: 1rem; }
  #play-btn {
    width: 40px; height: 40px; border-radius: 50%;
    border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-primary);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.1s;
    color: var(--color-text-primary); font-size: 16px;
    flex-shrink: 0;
  }
  #play-btn:hover { background: var(--color-background-secondary); }
  #play-btn:active { transform: scale(0.95); }
  #vol-wrap { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  #vol-icon { font-size: 15px; color: var(--color-text-secondary); }
  #vol { width: 80px; }
  #source-label { font-size: 11px; color: var(--color-text-tertiary); margin-left: 0.5rem; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
</style>

<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Now playing waveform audio visualizer with playback controls</h2>

<div id="player">
  <div id="top">
    <div id="album"><div id="album-inner"></div></div>
    <div id="meta">
      <div id="title">Midnight Bloom</div>
      <div id="artist">Aurora Waves · Echoes LP</div>
    </div>
  </div>

  <div id="waveform-wrap">
    <canvas id="waveform"></canvas>
    <div id="seek-thumb"></div>
  </div>

  <div id="time-row">
    <span id="cur">0:00</span>
    <span id="dur">3:42</span>
  </div>

  <div id="controls">
    <button id="play-btn" aria-label="Play">
      <i class="ti ti-player-play" aria-hidden="true"></i>
    </button>
    <div id="vol-wrap">
      <i class="ti ti-volume" id="vol-icon" aria-hidden="true"></i>
      <input type="range" id="vol" min="0" max="100" value="75" step="1" aria-label="Volume">
    </div>
    <span id="source-label" title="Click to load your own audio file">use your file</span>
  </div>
  <input type="file" id="file-input" accept="audio/*" style="display:none">
</div>

<script>
(function(){
  const canvas = document.getElementById('waveform');
  const ctx = canvas.getContext('2d');
  const playBtn = document.getElementById('play-btn');
  const playIcon = playBtn.querySelector('i');
  const volInput = document.getElementById('vol');
  const curEl = document.getElementById('cur');
  const seekThumb = document.getElementById('seek-thumb');
  const wrapEl = document.getElementById('waveform-wrap');
  const fileInput = document.getElementById('file-input');
  const sourceLabel = document.getElementById('source-label');

  let audioCtx, analyser, source, gainNode;
  let isPlaying = false;
  let animId;
  let audioBuffer = null;
  let startTime = 0;
  let pauseOffset = 0;
  const totalDuration = 222;

  function fmt(s) {
    return Math.floor(s/60)+':'+(Math.floor(s%60)+'').padStart(2,'0');
  }

  document.getElementById('dur').textContent = fmt(totalDuration);

  function initCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      gainNode = audioCtx.createGain();
      gainNode.gain.value = volInput.value / 100;
      analyser.connect(gainNode);
      gainNode.connect(audioCtx.destination);
    }
  }

  const W = 640, H = 72;
  canvas.width = W; canvas.height = H;

  const BAR_COUNT = 80;
  const GAP = 2;
  const barW = (W - GAP * (BAR_COUNT - 1)) / BAR_COUNT;
  const IDLE_HEIGHTS = Array.from({length: BAR_COUNT}, (_,i) => {
    const t = i / BAR_COUNT;
    return 4 + 22 * Math.sin(t * Math.PI) * (0.5 + 0.5 * Math.sin(t * Math.PI * 7 + 1.2));
  });

  let animPhase = 0;
  let flattenRatio = 1;

  function getStyle(varName) {
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim()
      || getComputedStyle(document.body).getPropertyValue(varName).trim();
  }

  function draw(freqData) {
    ctx.clearRect(0, 0, W, H);

    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const barColor = isDark ? 'rgba(255,255,255,0.75)' : 'rgba(83,74,183,0.85)';
    const barDim   = isDark ? 'rgba(255,255,255,0.15)' : 'rgba(83,74,183,0.15)';

    for (let i = 0; i < BAR_COUNT; i++) {
      let h;
      if (freqData) {
        const idx = Math.floor(i / BAR_COUNT * (analyser.frequencyBinCount));
        const raw = freqData[idx] / 255;
        const boosted = Math.pow(raw, 0.7);
        h = 4 + boosted * (H - 8);
      } else {
        const wave = Math.sin(animPhase + i * 0.18) * 0.35 + 0.65;
        h = IDLE_HEIGHTS[i] * wave * flattenRatio;
        h = Math.max(2, h);
      }

      const x = i * (barW + GAP);
      const y = (H - h) / 2;

      const progress = getCurrentProgress();
      const filled = i / BAR_COUNT < progress;
      ctx.fillStyle = filled ? barColor : barDim;
      ctx.beginPath();
      ctx.roundRect(x, y, barW, h, 2);
      ctx.fill();
    }
  }

  function getCurrentProgress() {
    if (!isPlaying && pauseOffset === 0) return 0;
    const elapsed = isPlaying ? audioCtx ? (audioCtx.currentTime - startTime + pauseOffset) : pauseOffset : pauseOffset;
    return Math.min(elapsed / totalDuration, 1);
  }

  function updateTime() {
    if (!audioCtx) return;
    const elapsed = isPlaying
      ? Math.min(audioCtx.currentTime - startTime + pauseOffset, totalDuration)
      : pauseOffset;
    curEl.textContent = fmt(Math.max(0, elapsed));
  }

  function loop() {
    animPhase += 0.04;
    if (freqData && isPlaying) {
      analyser.getByteFrequencyData(freqData);
      draw(freqData);
    } else {
      if (!isPlaying && flattenRatio > 0.05) {
        flattenRatio = Math.max(0.05, flattenRatio * 0.92);
      } else if (isPlaying && flattenRatio < 1) {
        flattenRatio = Math.min(1, flattenRatio + 0.08);
      }
      draw(null);
    }
    updateTime();
    animId = requestAnimationFrame(loop);
  }

  let freqData = null;

  loop();

  async function loadAndPlay(arrayBuffer) {
    initCtx();
    if (source) { try { source.stop(); } catch(e){} source.disconnect(); }
    audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
    source = audioCtx.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    startTime = audioCtx.currentTime;
    source.start(0, pauseOffset);
    isPlaying = true;
    flattenRatio = 1;
    playIcon.className = 'ti ti-player-pause';
    playBtn.setAttribute('aria-label', 'Pause');
    source.onended = () => {
      if (isPlaying) {
        isPlaying = false;
        pauseOffset = 0;
        flattenRatio = 1;
        playIcon.className = 'ti ti-player-play';
        playBtn.setAttribute('aria-label', 'Play');
      }
    };
  }

  async function togglePlay() {
    initCtx();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    if (!audioBuffer) {
      flattenRatio = 1;
      isPlaying = !isPlaying;
      playIcon.className = isPlaying ? 'ti ti-player-pause' : 'ti ti-player-play';
      playBtn.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
      if (!isPlaying) flattenRatio = 1;
      return;
    }

    if (isPlaying) {
      pauseOffset += audioCtx.currentTime - startTime;
      if (source) { try { source.stop(); } catch(e){} }
      isPlaying = false;
      flattenRatio = 1;
      playIcon.className = 'ti ti-player-play';
      playBtn.setAttribute('aria-label', 'Play');
    } else {
      if (source) { try { source.stop(); } catch(e){} source.disconnect(); }
      source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(analyser);
      freqData = new Uint8Array(analyser.frequencyBinCount);
      startTime = audioCtx.currentTime;
      source.start(0, pauseOffset % audioBuffer.duration);
      isPlaying = true;
      flattenRatio = 1;
      playIcon.className = 'ti ti-player-pause';
      playBtn.setAttribute('aria-label', 'Pause');
      source.onended = () => {
        if (isPlaying) {
          isPlaying = false;
          pauseOffset = 0;
          playIcon.className = 'ti ti-player-play';
        }
      };
    }
  }

  playBtn.addEventListener('click', togglePlay);

  wrapEl.addEventListener('click', (e) => {
    const rect = wrapEl.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    const seekTo = ratio * (audioBuffer ? audioBuffer.duration : totalDuration);
    pauseOffset = seekTo;
    if (isPlaying && audioBuffer) {
      if (source) { try { source.stop(); } catch(e){} source.disconnect(); }
      source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(analyser);
      startTime = audioCtx.currentTime;
      source.start(0, seekTo);
      source.onended = () => {
        if (isPlaying) {
          isPlaying = false;
          pauseOffset = 0;
          playIcon.className = 'ti ti-player-play';
        }
      };
    }
  });

  wrapEl.addEventListener('mousemove', (e) => {
    const rect = wrapEl.getBoundingClientRect();
    const x = e.clientX - rect.left;
    seekThumb.style.left = x + 'px';
    seekThumb.style.display = 'block';
  });

  wrapEl.addEventListener('mouseleave', () => {
    seekThumb.style.display = 'none';
  });

  volInput.addEventListener('input', () => {
    if (gainNode) gainNode.gain.value = volInput.value / 100;
    const v = parseInt(volInput.value);
    const icon = document.getElementById('vol-icon');
    icon.className = v === 0 ? 'ti ti-volume-off' : v < 50 ? 'ti ti-volume-2' : 'ti ti-volume';
  });

  sourceLabel.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById('title').textContent = file.name.replace(/\.[^.]+$/, '');
    document.getElementById('artist').textContent = 'Your file';
    pauseOffset = 0;
    const ab = await file.arrayBuffer();
    loadAndPlay(ab);
  });
})();
</script>
