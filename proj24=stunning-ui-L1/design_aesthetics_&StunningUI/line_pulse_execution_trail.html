
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --sweep-color: #00FFCC;
  --trail-color: rgba(0,255,204,0.18);
  --bp-color: #FF4455;
  --line-h: 28px;
}
body { background: transparent; }
.editor-wrap {
  background: #0d1117;
  border-radius: 12px;
  overflow: hidden;
  font-family: var(--font-mono, monospace);
  font-size: 13px;
  border: 0.5px solid rgba(255,255,255,0.08);
}
.editor-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px;
  background: #161b22;
  border-bottom: 0.5px solid rgba(255,255,255,0.08);
}
.dot { width: 11px; height: 11px; border-radius: 50%; }
.d-red { background: #FF5F57; } .d-yellow { background: #FEBC2E; } .d-green { background: #28C840; }
.file-label { color: rgba(255,255,255,0.35); font-size: 12px; margin-left: 4px; }
.controls { margin-left: auto; display: flex; gap: 8px; }
.run-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 4px 14px; border-radius: 6px;
  background: rgba(0,255,204,0.12); border: 0.5px solid rgba(0,255,204,0.35);
  color: #00FFCC; font-size: 12px; cursor: pointer; transition: background 0.15s;
  font-family: var(--font-mono, monospace);
}
.run-btn:hover { background: rgba(0,255,204,0.2); }
.run-btn.running { opacity: 0.5; pointer-events: none; }
.speed-select {
  background: #161b22; border: 0.5px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.5); font-size: 12px; padding: 4px 8px;
  border-radius: 6px; cursor: pointer; font-family: var(--font-mono, monospace);
}
.gutter {
  display: flex; flex-direction: column;
  position: absolute; left: 0; top: 0; bottom: 0; width: 40px;
  background: #0d1117; border-right: 0.5px solid rgba(255,255,255,0.06);
  user-select: none;
}
.code-body { position: relative; padding: 8px 0; }
.code-line {
  display: flex; align-items: stretch;
  height: var(--line-h); position: relative; cursor: pointer;
  transition: background 0.1s;
}
.code-line:hover { background: rgba(255,255,255,0.03); }
.line-num {
  width: 40px; min-width: 40px; text-align: right; padding-right: 14px;
  color: rgba(255,255,255,0.2); font-size: 12px; line-height: var(--line-h);
  position: relative; user-select: none; flex-shrink: 0;
}
.bp-dot {
  position: absolute; left: 5px; top: 50%; transform: translateY(-50%);
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--bp-color); opacity: 0; transition: opacity 0.15s;
  box-shadow: 0 0 0 0 rgba(255,68,85,0.5);
}
.code-line.has-bp .bp-dot { opacity: 1; }
.code-line.bp-pulse .bp-dot { animation: bp-ring 0.6s ease-out; }
@keyframes bp-ring {
  0%   { box-shadow: 0 0 0 0 rgba(255,68,85,0.7); }
  100% { box-shadow: 0 0 0 8px rgba(255,68,85,0); }
}
.line-code {
  flex: 1; padding: 0 16px; line-height: var(--line-h);
  color: rgba(255,255,255,0.75); white-space: pre; overflow: hidden;
  position: relative;
}
.sweep-overlay {
  position: absolute; inset: 0; pointer-events: none;
  opacity: 0;
}
.sweep-overlay.sweeping {
  opacity: 1;
  animation: sweep-pass 0.45s ease-out forwards;
}
@keyframes sweep-pass {
  0%   { background: linear-gradient(90deg, transparent 0%, transparent 0%,   rgba(0,255,204,0) 0%,  rgba(0,255,204,0.55) 0%,  rgba(0,255,204,0) 0%); }
  30%  { background: linear-gradient(90deg, transparent 0%, transparent 5%,  rgba(0,255,204,0) 5%,  rgba(0,255,204,0.55) 20%, rgba(0,255,204,0) 35%); }
  70%  { background: linear-gradient(90deg, transparent 40%, rgba(0,255,204,0) 55%, rgba(0,255,204,0.4) 70%, rgba(0,255,204,0) 80%); }
  100% { background: linear-gradient(90deg, transparent 80%, rgba(0,255,204,0) 95%, rgba(0,255,204,0.1) 98%, rgba(0,255,204,0) 100%); opacity: 0; }
}
.code-line.trail { background: var(--trail-color); transition: background 1s ease-out; }
.code-line.trail-fade { background: transparent; transition: background 1s ease-out; }
.code-line.active-line { background: rgba(0,255,204,0.07); }
.exec-cursor {
  position: absolute; left: 40px; height: var(--line-h); width: 2px;
  background: var(--sweep-color); opacity: 0; pointer-events: none;
  box-shadow: 0 0 6px var(--sweep-color);
  transition: top 0.18s cubic-bezier(0.4,0,0.2,1);
  z-index: 10;
}
.status-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 16px; background: #161b22;
  border-top: 0.5px solid rgba(255,255,255,0.06);
  font-size: 11px;
}
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.2); }
.status-dot.running { background: var(--sweep-color); animation: pulse-dot 1s infinite; }
.status-dot.done { background: #28C840; }
.status-dot.bp-hit { background: var(--bp-color); }
@keyframes pulse-dot { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
.status-text { color: rgba(255,255,255,0.3); }

.kw { color: #FF79C6; } .fn { color: #50FA7B; } .str { color: #F1FA8C; }
.num { color: #BD93F9; } .cm { color: rgba(255,255,255,0.25); }
.op { color: #FF79C6; } .var { color: #8BE9FD; } .prop { color: #50FA7B; }

.legend {
  display: flex; gap: 16px; padding: 10px 16px 6px;
  flex-wrap: wrap;
}
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: rgba(255,255,255,0.35); }
.legend-swatch { width: 10px; height: 10px; border-radius: 2px; }
</style>

<h2 class="sr-only">Line Pulse / Execution Trail — interactive code execution visualizer with sweep animation, trail effects, and breakpoints</h2>

<div class="editor-wrap">
  <div class="editor-header">
    <div class="dot d-red"></div><div class="dot d-yellow"></div><div class="dot d-green"></div>
    <span class="file-label">fibonacci.js</span>
    <div class="controls">
      <select class="speed-select" id="speedSel">
        <option value="300">fast</option>
        <option value="500" selected>normal</option>
        <option value="900">slow</option>
      </select>
      <button class="run-btn" id="runBtn" onclick="runAll()">
        <i class="ti ti-player-play" aria-hidden="true" style="font-size:12px"></i> Run
      </button>
    </div>
  </div>

  <div class="code-body" id="codeBody">
    <div class="exec-cursor" id="execCursor"></div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-swatch" style="background:rgba(0,255,204,0.45)"></div>sweep</div>
    <div class="legend-item"><div class="legend-swatch" style="background:rgba(0,255,204,0.18)"></div>trail</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#FF4455; border-radius:50%"></div>breakpoint (click line #)</div>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">click run or click a line number to run from there</span>
  </div>
</div>

<script>
const lines = [
  { html: `<span class="kw">function</span> <span class="fn">fibonacci</span>(<span class="var">n</span>) {`, indent: 0 },
  { html: `  <span class="kw">if</span> (<span class="var">n</span> <span class="op">&lt;=</span> <span class="num">1</span>) <span class="kw">return</span> <span class="var">n</span>;`, indent: 1 },
  { html: `  <span class="kw">let</span> <span class="var">a</span> <span class="op">=</span> <span class="num">0</span>, <span class="var">b</span> <span class="op">=</span> <span class="num">1</span>;`, indent: 1 },
  { html: `  <span class="kw">for</span> (<span class="kw">let</span> <span class="var">i</span> <span class="op">=</span> <span class="num">2</span>; <span class="var">i</span> <span class="op">&lt;=</span> <span class="var">n</span>; <span class="var">i</span><span class="op">++</span>) {`, indent: 1 },
  { html: `    <span class="kw">let</span> <span class="var">sum</span> <span class="op">=</span> <span class="var">a</span> <span class="op">+</span> <span class="var">b</span>;`, indent: 2 },
  { html: `    <span class="var">a</span> <span class="op">=</span> <span class="var">b</span>;`, indent: 2 },
  { html: `    <span class="var">b</span> <span class="op">=</span> <span class="var">sum</span>;`, indent: 2 },
  { html: `  }`, indent: 1 },
  { html: `  <span class="kw">return</span> <span class="var">b</span>;`, indent: 1 },
  { html: `}`, indent: 0 },
  { html: ``, indent: 0, blank: true },
  { html: `<span class="kw">const</span> <span class="var">result</span> <span class="op">=</span> <span class="fn">fibonacci</span>(<span class="num">10</span>);`, indent: 0 },
  { html: `<span class="prop">console</span>.<span class="fn">log</span>(<span class="str">\`fib(10) = \${</span><span class="var">result</span><span class="str">}\`</span>);`, indent: 0 },
];

const body = document.getElementById('codeBody');
const cursor = document.getElementById('execCursor');
const runBtn = document.getElementById('runBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const breakpoints = new Set();
let running = false;

lines.forEach((l, i) => {
  const row = document.createElement('div');
  row.className = 'code-line';
  row.dataset.idx = i;
  row.innerHTML = `
    <div class="line-num" data-num="${i}">
      <div class="bp-dot"></div>
      ${i + 1}
    </div>
    <div class="line-code">${l.html || ''}<div class="sweep-overlay"></div></div>
  `;
  row.querySelector('.line-num').addEventListener('click', (e) => {
    e.stopPropagation();
    toggleBreakpoint(i, row);
  });
  row.addEventListener('click', () => {
    if (!running) runFrom(i);
  });
  body.appendChild(row);
});

function toggleBreakpoint(idx, row) {
  if (breakpoints.has(idx)) {
    breakpoints.delete(idx);
    row.classList.remove('has-bp');
  } else {
    breakpoints.add(idx);
    row.classList.add('has-bp');
  }
}

function getRows() { return body.querySelectorAll('.code-line'); }

function setStatus(state, msg) {
  statusDot.className = 'status-dot' + (state ? ' ' + state : '');
  statusText.textContent = msg;
}

async function sweep(row, idx) {
  const overlay = row.querySelector('.sweep-overlay');
  cursor.style.top = (8 + idx * 28) + 'px';
  cursor.style.opacity = '1';
  row.classList.add('active-line');
  overlay.classList.remove('sweeping');
  void overlay.offsetWidth;
  overlay.classList.add('sweeping');
  await new Promise(r => setTimeout(r, 450));
  overlay.classList.remove('sweeping');
  row.classList.remove('active-line');
  row.classList.add('trail');
  cursor.style.opacity = '0';
  setTimeout(() => {
    row.classList.remove('trail');
    row.classList.add('trail-fade');
    setTimeout(() => row.classList.remove('trail-fade'), 1000);
  }, 1000);
}

async function runFrom(startIdx) {
  if (running) return;
  running = true;
  runBtn.classList.add('running');
  const rows = getRows();
  rows.forEach(r => { r.classList.remove('trail','trail-fade','active-line'); });
  setStatus('running', 'executing…');

  const speed = parseInt(document.getElementById('speedSel').value);
  for (let i = startIdx; i < lines.length; i++) {
    if (lines[i].blank) continue;
    if (breakpoints.has(i)) {
      const row = rows[i];
      row.classList.add('bp-pulse');
      setTimeout(() => row.classList.remove('bp-pulse'), 700);
      setStatus('bp-hit', `paused at breakpoint — line ${i + 1}`);
      cursor.style.top = (8 + i * 28) + 'px';
      cursor.style.opacity = '1';
      await new Promise(r => setTimeout(r, speed * 2));
      setStatus('running', 'continuing…');
    }
    await sweep(rows[i], i);
    await new Promise(r => setTimeout(r, speed * 0.4));
  }

  cursor.style.opacity = '0';
  setStatus('done', 'execution complete — fib(10) = 55');
  running = false;
  runBtn.classList.remove('running');
}

function runAll() { runFrom(0); }
</script>
