
<h2 class="sr-only">Masonry cascade filter — click a category pill to filter products with animated FLIP transitions</h2>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.wrap { padding: 1.5rem 0; }
.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
.heading { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
.count-wrap { font-size: 13px; color: var(--color-text-secondary); }
.count-num { font-size: 22px; font-weight: 500; color: var(--color-text-primary); display: inline-block; min-width: 32px; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.5rem; }
.pill {
  padding: 7px 16px; border-radius: 999px;
  border: 0.5px solid var(--color-border-secondary);
  background: var(--color-background-primary);
  font-size: 13px; font-weight: 500; cursor: pointer;
  color: var(--color-text-secondary);
  transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), background 0.2s, color 0.2s, border-color 0.2s;
  transform-origin: center;
  user-select: none;
}
.pill.active {
  background: var(--color-text-primary);
  color: var(--color-background-primary);
  border-color: var(--color-text-primary);
  transform: scale(1.1);
}
.pill:not(.active):hover { transform: scale(0.97); background: var(--color-background-secondary); }
.grid {
  columns: 3; gap: 14px;
}
@media (max-width: 500px) { .grid { columns: 2; } }
.card {
  break-inside: avoid;
  margin-bottom: 14px;
  border-radius: var(--border-radius-lg);
  border: 0.5px solid var(--color-border-tertiary);
  background: var(--color-background-primary);
  overflow: hidden;
  cursor: pointer;
  transition: opacity 0.3s ease, border-color 0.2s;
}
.card:hover { border-color: var(--color-border-secondary); }
.card-img {
  width: 100%; display: block;
  background: var(--color-background-secondary);
  position: relative; overflow: hidden;
}
.card-img-inner {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; line-height: 1;
}
.card-body { padding: 10px 12px 12px; }
.card-name { font-size: 13px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 2px; }
.card-cat { font-size: 11px; color: var(--color-text-tertiary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
.card-price { font-size: 14px; font-weight: 500; color: var(--color-text-primary); }
.card-badge {
  font-size: 11px; padding: 3px 8px; border-radius: 999px;
  display: inline-block; margin-top: 4px;
}
.badge-sale { background: #FCEBEB; color: #A32D2D; }
.badge-new { background: #E6F1FB; color: #185FA5; }
.badge-hot { background: #FAEEDA; color: #854F0B; }
.card.hiding { opacity: 0; transform: scale(0.92); transition: opacity 0.25s ease, transform 0.25s ease; }
.card.showing { opacity: 1; transform: scale(1); }
.card.out { display: none; }
</style>

<div class="wrap">
  <div class="top">
    <div class="heading">Products</div>
    <div class="count-wrap"><span class="count-num" id="cnt">12</span> items</div>
  </div>
  <div class="pills" id="pills"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
const products = [
  { id:1,  name:"Cloud Runner",     cat:"Footwear",   price:"₹4,299",  color:"#B5D4F4", emoji:"👟", badge:"new",  h:140 },
  { id:2,  name:"Linen Tote",       cat:"Bags",       price:"₹2,199",  color:"#C0DD97", emoji:"👜", badge:"",     h:110 },
  { id:3,  name:"Merino Crewneck",  cat:"Tops",       price:"₹3,599",  color:"#F4C0D1", emoji:"🧶", badge:"sale", h:130 },
  { id:4,  name:"Cargo Shorts",     cat:"Bottoms",    price:"₹1,899",  color:"#FAC775", emoji:"🩳", badge:"",     h:100 },
  { id:5,  name:"Slide Sandal",     cat:"Footwear",   price:"₹1,499",  color:"#CFC4F6", emoji:"🩴", badge:"hot",  h:105 },
  { id:6,  name:"Canvas Backpack",  cat:"Bags",       price:"₹3,999",  color:"#9FE1CB", emoji:"🎒", badge:"new",  h:125 },
  { id:7,  name:"Printed Tee",      cat:"Tops",       price:"₹999",    color:"#FAC775", emoji:"👕", badge:"sale", h:95  },
  { id:8,  name:"Wide Leg Pants",   cat:"Bottoms",    price:"₹2,799",  color:"#F5C4B3", emoji:"👖", badge:"",     h:145 },
  { id:9,  name:"High Knit Sock",   cat:"Footwear",   price:"₹399",    color:"#B5D4F4", emoji:"🧦", badge:"",     h:90  },
  { id:10, name:"Bucket Hat",       cat:"Accessories",price:"₹1,299",  color:"#F4C0D1", emoji:"🪖", badge:"hot",  h:115 },
  { id:11, name:"Polo Collar",      cat:"Tops",       price:"₹1,799",  color:"#C0DD97", emoji:"👔", badge:"new",  h:120 },
  { id:12, name:"Mini Shoulder Bag",cat:"Bags",       price:"₹2,599",  color:"#CFC4F6", emoji:"👛", badge:"",     h:110 },
];

const cats = ["All", ...new Set(products.map(p => p.cat))];
let active = "All";

const pillsEl = document.getElementById("pills");
const gridEl  = document.getElementById("grid");
const cntEl   = document.getElementById("cnt");

function animateCount(to) {
  const from = parseInt(cntEl.textContent);
  if (from === to) return;
  const dur = 350, start = performance.now();
  requestAnimationFrame(function step(t) {
    const p = Math.min((t - start) / dur, 1);
    const ease = 1 - Math.pow(1 - p, 3);
    cntEl.textContent = Math.round(from + (to - from) * ease);
    if (p < 1) requestAnimationFrame(step);
  });
}

function renderPills() {
  pillsEl.innerHTML = "";
  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "pill" + (c === active ? " active" : "");
    b.textContent = c;
    b.addEventListener("click", () => filter(c));
    pillsEl.appendChild(b);
  });
}

function renderGrid() {
  gridEl.innerHTML = "";
  products.forEach(p => {
    const card = document.createElement("div");
    card.className = "card showing";
    card.dataset.cat = p.cat;
    card.innerHTML = `
      <div class="card-img" style="height:${p.h}px; background:${p.color}20;">
        <div class="card-img-inner" style="height:${p.h}px;">${p.emoji}</div>
      </div>
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="card-cat">${p.cat}</div>
        <div class="card-price">${p.price}</div>
        ${p.badge ? `<div><span class="card-badge badge-${p.badge}">${p.badge === 'sale' ? 'Sale' : p.badge === 'new' ? 'New' : 'Hot'}</span></div>` : ""}
      </div>
    `;
    gridEl.appendChild(card);
  });
}

function filter(cat) {
  if (cat === active) return;
  active = cat;
  renderPills();

  const cards = gridEl.querySelectorAll(".card");
  const visible = cat === "All"
    ? products
    : products.filter(p => p.cat === cat);

  animateCount(visible.length);

  cards.forEach((card, i) => {
    const match = cat === "All" || card.dataset.cat === cat;
    if (!match) {
      card.style.transition = `opacity 0.2s ease ${i * 15}ms, transform 0.2s ease ${i * 15}ms`;
      card.style.opacity = "0";
      card.style.transform = "scale(0.88)";
      setTimeout(() => { card.style.display = "none"; }, 250);
    } else {
      card.style.display = "";
      card.style.transition = "none";
      card.style.opacity = "0";
      card.style.transform = "scale(0.92) translateY(8px)";
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          card.style.transition = `opacity 0.35s ease ${i * 30}ms, transform 0.35s cubic-bezier(0.34,1.4,0.64,1) ${i * 30}ms`;
          card.style.opacity = "1";
          card.style.transform = "scale(1) translateY(0)";
        });
      });
    }
  });
}

renderPills();
renderGrid();
</script>
