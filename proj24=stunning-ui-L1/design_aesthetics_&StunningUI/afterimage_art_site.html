
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  #afterimage-root {
    background: #00FFFF;
    min-height: 520px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 3rem 2rem;
    font-family: 'Space Grotesk', sans-serif;
    transition: background 0.1s;
  }

  .burn-wrapper {
    position: relative;
    display: inline-block;
    text-align: center;
  }

  .main-text {
    font-size: clamp(48px, 10vw, 88px);
    font-weight: 700;
    color: #FF0000;
    letter-spacing: -2px;
    line-height: 1;
    position: relative;
    z-index: 2;
    text-transform: uppercase;
    user-select: none;
  }

  .ghost {
    position: absolute;
    top: 0; left: 0;
    font-size: clamp(48px, 10vw, 88px);
    font-weight: 700;
    letter-spacing: -2px;
    line-height: 1;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 3;
    mix-blend-mode: difference;
    color: #FF00FF;
    transform: translate(10px, 10px);
    animation: ghostShift 2s steps(1) infinite;
  }

  .ghost2 {
    position: absolute;
    top: 0; left: 0;
    font-size: clamp(48px, 10vw, 88px);
    font-weight: 700;
    letter-spacing: -2px;
    line-height: 1;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 3;
    mix-blend-mode: difference;
    color: #FFFF00;
    transform: translate(-8px, -6px);
    animation: ghostShift2 2s steps(1) infinite;
  }

  @keyframes ghostShift {
    0%   { transform: translate(10px, 10px); color: #FF00FF; opacity: 0.9; }
    25%  { transform: translate(-10px, 8px); color: #00FF00; opacity: 0.8; }
    50%  { transform: translate(8px, -10px); color: #FFFF00; opacity: 0.9; }
    75%  { transform: translate(-8px, -8px); color: #FF8000; opacity: 0.7; }
    100% { transform: translate(10px, 10px); color: #FF00FF; opacity: 0.9; }
  }

  @keyframes ghostShift2 {
    0%   { transform: translate(-8px, -6px); color: #FFFF00; opacity: 0.6; }
    25%  { transform: translate(12px, -10px); color: #FF00FF; opacity: 0.7; }
    50%  { transform: translate(-12px, 12px); color: #00FFFF; opacity: 0.5; }
    75%  { transform: translate(6px, 14px); color: #00FF00; opacity: 0.8; }
    100% { transform: translate(-8px, -6px); color: #FFFF00; opacity: 0.6; }
  }

  #afterimage-root .subtitle {
    margin-top: 2rem;
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #006060;
    animation: subColorShift 2s steps(1) infinite;
    position: relative;
    z-index: 2;
  }

  @keyframes subColorShift {
    0%   { color: #006060; }
    25%  { color: #800000; }
    50%  { color: #008000; }
    75%  { color: #604000; }
  }

  .scan-lines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      180deg,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.03) 3px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
    z-index: 10;
  }

  .flicker {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 9;
    animation: flicker 2s steps(1) infinite;
  }

  @keyframes flicker {
    0%   { background: rgba(255,0,0,0.02); }
    25%  { background: rgba(0,255,0,0.02); }
    50%  { background: rgba(0,0,255,0.03); }
    75%  { background: rgba(255,255,0,0.01); }
  }

  .bg-anim {
    animation: bgShift 2s steps(1) infinite;
  }

  @keyframes bgShift {
    0%   { background: #00FFFF; }
    25%  { background: #00EEFF; }
    50%  { background: #00FFEE; }
    75%  { background: #00F8F8; }
  }

  .corner-dot {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    animation: dotColor 2s steps(1) infinite;
  }
  .tl { top: 16px; left: 16px; }
  .tr { top: 16px; right: 16px; }
  .bl { bottom: 16px; left: 16px; }
  .br { bottom: 16px; right: 16px; }

  @keyframes dotColor {
    0%   { background: #FF0000; }
    25%  { background: #FF00FF; }
    50%  { background: #FFFF00; }
    75%  { background: #FF8000; }
  }

  .instruction {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    white-space: nowrap;
    animation: instrColor 2s steps(1) infinite;
    z-index: 11;
  }

  @keyframes instrColor {
    0%   { color: rgba(0,60,60,0.7); }
    25%  { color: rgba(100,0,0,0.7); }
    50%  { color: rgba(0,80,0,0.7); }
    75%  { color: rgba(80,40,0,0.7); }
  }
</style>

<div id="afterimage-root" class="bg-anim">
  <div class="scan-lines"></div>
  <div class="flicker"></div>
  <div class="corner-dot tl"></div>
  <div class="corner-dot tr"></div>
  <div class="corner-dot bl"></div>
  <div class="corner-dot br"></div>

  <div class="burn-wrapper">
    <div class="main-text" id="main">AFTERIMAGE</div>
    <div class="ghost" id="ghost1">AFTERIMAGE</div>
    <div class="ghost2" id="ghost2">AFTERIMAGE</div>
  </div>

  <div class="subtitle">optical phenomenon · digital artifact · op art</div>
  <div class="instruction">stare at the center · look away · close your eyes</div>
</div>
