
<style>
  @import url('https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=IM+Fell+English:ital@0;1&display=swap');

  .hween-root {
    background: #1A0F0A;
    min-height: 620px;
    position: relative;
    overflow: hidden;
    font-family: 'IM Fell English', Georgia, serif;
  }

  .crack-overlay {
    position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background-image:
      linear-gradient(135deg, transparent 48%, rgba(0,0,0,0.25) 49%, transparent 51%),
      linear-gradient(60deg, transparent 52%, rgba(255,80,0,0.06) 53%, transparent 55%);
    mix-blend-mode: overlay;
  }

  .cobweb-tl, .cobweb-tr {
    position: absolute; top: 0; z-index: 3; pointer-events: none;
  }
  .cobweb-tl { left: 0; }
  .cobweb-tr { right: 0; transform: scaleX(-1); }

  .site-header {
    text-align: center; padding: 2.5rem 1.5rem 0.5rem; position: relative; z-index: 5;
  }

  .site-title {
    font-family: 'UnifrakturMaguntia', cursive;
    font-size: 52px; color: #FF8C00; margin: 0; line-height: 1.1;
    text-shadow: 0 0 24px rgba(255,100,0,0.6), 0 0 60px rgba(180,50,0,0.3);
    letter-spacing: 2px;
  }

  .site-sub {
    font-size: 14px; color: #B85C00; font-style: italic; letter-spacing: 4px;
    text-transform: uppercase; margin-top: 4px;
  }

  .candle-row {
    display: flex; justify-content: center; gap: 40px; margin: 1.2rem 0 0.6rem; position: relative; z-index: 5;
  }

  .candle-wrap { display: flex; flex-direction: column; align-items: center; }

  .flame { animation: flicker 1.6s ease-in-out infinite alternate; transform-origin: bottom center; }
  .flame2 { animation: flicker2 1.3s ease-in-out infinite alternate; transform-origin: bottom center; }
  @keyframes flicker {
    0%   { opacity: 0.85; transform: scale(1,1) skewX(0deg); }
    30%  { opacity: 1;    transform: scale(1.05,1.12) skewX(-3deg); }
    60%  { opacity: 0.9;  transform: scale(0.95,0.97) skewX(2deg); }
    100% { opacity: 0.75; transform: scale(1.02,1.08) skewX(-2deg); }
  }
  @keyframes flicker2 {
    0%   { opacity: 0.9;  transform: scale(1,1.05) skewX(2deg); }
    40%  { opacity: 0.75; transform: scale(0.95,0.93) skewX(-2deg); }
    80%  { opacity: 1;    transform: scale(1.06,1.1) skewX(0deg); }
    100% { opacity: 0.8;  transform: scale(0.98,1.03) skewX(3deg); }
  }

  .cards-row {
    display: flex; justify-content: center; gap: 18px;
    padding: 0 1.5rem 1rem; position: relative; z-index: 5; flex-wrap: wrap;
  }

  .postcard {
    width: 178px; border-radius: 4px; padding: 0;
    background: #F5E8C6;
    border: 2px solid #8B4513;
    box-shadow: 0 4px 24px rgba(0,0,0,0.6), inset 0 0 18px rgba(100,40,0,0.15);
    position: relative; overflow: hidden;
    transform-origin: bottom center;
    transition: transform 0.25s;
    cursor: pointer;
  }
  .postcard:hover { transform: translateY(-5px) rotate(-1deg); }

  .postcard-inner { padding: 14px 12px 12px; }

  .postcard-stamp {
    position: absolute; top: 8px; right: 8px;
    width: 26px; height: 32px; border: 1.5px solid #8B4513;
    background: #C8A05A; display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }

  .postcard-illus {
    width: 100%; height: 80px; display: flex; align-items: center; justify-content: center;
    margin-bottom: 8px; border-bottom: 1px solid rgba(139,69,19,0.3);
  }

  .postcard-title {
    font-family: 'UnifrakturMaguntia', cursive;
    font-size: 18px; color: #5C2000; text-align: center; margin: 0 0 4px;
    line-height: 1.1;
  }

  .postcard-date {
    font-size: 10px; color: #8B5E3C; text-align: center; font-style: italic;
    letter-spacing: 1px;
  }

  .torn-edge {
    height: 10px; overflow: hidden; position: relative;
    background: #1A0F0A; margin-bottom: -1px;
  }

  .bottom-bar {
    background: rgba(255,140,0,0.07);
    border-top: 1px solid rgba(255,100,0,0.2);
    display: flex; justify-content: center; gap: 32px;
    padding: 12px 24px;
    position: relative; z-index: 5;
  }

  .nav-link {
    color: #FF8C00; font-size: 13px; letter-spacing: 2px;
    text-transform: uppercase; cursor: pointer; opacity: 0.8;
    transition: opacity 0.2s;
    font-family: 'IM Fell English', serif;
  }
  .nav-link:hover { opacity: 1; }

  .pumpkin-row {
    display: flex; justify-content: center; gap: 16px;
    margin: 0.4rem 0 0.2rem; position: relative; z-index: 5;
  }

  .section-label {
    text-align: center; font-size: 11px; letter-spacing: 5px; color: #6B3A00;
    text-transform: uppercase; margin: 0.2rem 0 0.8rem; position: relative; z-index: 5;
  }
  .section-label::before, .section-label::after {
    content: '—';  margin: 0 8px; color: #3D1A00;
  }
</style>
