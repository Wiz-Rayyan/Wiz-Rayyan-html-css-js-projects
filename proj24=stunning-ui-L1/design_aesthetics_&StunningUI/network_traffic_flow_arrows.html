<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Diagram of five network nodes with animated arrows showing data flow between them, where arrow thickness and speed represent traffic volume. Hover an arrow for volume and rate, click for flow history.</h2>
<style>
@keyframes dashmove { to { stroke-dashoffset: -28; } }
@keyframes glowpulse { 0%,100%{ opacity:.12 } 50%{ opacity:.26 } }
.flow-path { stroke-dasharray: 10 8; animation: dashmove var(--dur,1.5s) linear infinite; }
.flow-glow { animation: glowpulse 2.4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .flow-path { animation: none; }
  .flow-glow { animation: none; opacity:.16; }
}
.flow-hit { cursor: pointer; }
.node-box { fill: var(--surface-1); stroke: var(--border-strong); }
.bar { background: var(--text-accent); border-radius: 2px 2px 0 0; }
</style>

<div style="position:relative;">
  <svg width="100%" viewBox="0 0 680 360" role="img">
    <title>Network traffic flow diagram</title>
    <desc>Client connects to an API gateway, which fans out to an auth service, a database, and a cache. Arrow thickness and animation speed represent traffic volume.</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#378ADD"/>
        <stop offset="100%" stop-color="#185FA5"/>
      </linearGradient>
    </defs>

    <path class="flow-glow" d="M160,190 L250,190" fill="none" stroke="#378ADD" stroke-width="12" stroke-linecap="round"/>
    <path class="flow-glow" d="M400,185 L440,185 L440,82 L480,82" fill="none" stroke="#378ADD" stroke-width="9" stroke-linecap="round"/>
    <path class="flow-glow" d="M400,190 L480,190" fill="none" stroke="#378ADD" stroke-width="10.5" stroke-linecap="round"/>
    <path class="flow-glow" d="M400,195 L440,195 L440,298 L480,298" fill="none" stroke="#378ADD" stroke-width="8.5" stroke-linecap="round"/>

    <g class="flow-hit" data-flow="f1" onmousemove="showTip(event,'f1')" onmouseleave="hideTip()" onclick="openModal('f1')">
      <path style="--dur:0.51s" class="flow-path" d="M160,190 L250,190" fill="none" stroke="url(#flowGrad)" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
      <path d="M160,180 L250,180 L250,200 L160,200 Z" fill="transparent"/>
    </g>
    <g class="flow-hit" data-flow="f2" onmousemove="showTip(event,'f2')" onmouseleave="hideTip()" onclick="openModal('f2')">
      <path style="--dur:1.93s" class="flow-path" d="M400,185 L440,185 L440,82 L480,82" fill="none" stroke="url(#flowGrad)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
      <path d="M400,175 L450,175 L450,72 L480,72 L480,92 L450,92 L450,195 L400,195 Z" fill="transparent"/>
    </g>
    <g class="flow-hit" data-flow="f3" onmousemove="showTip(event,'f3')" onmouseleave="hideTip()" onclick="openModal('f3')">
      <path style="--dur:1.2s" class="flow-path" d="M400,190 L480,190" fill="none" stroke="url(#flowGrad)" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow)"/>
      <path d="M400,178 L480,178 L480,202 L400,202 Z" fill="transparent"/>
    </g>
    <g class="flow-hit" data-flow="f4" onmousemove="showTip(event,'f4')" onmouseleave="hideTip()" onclick="openModal('f4')">
      <path style="--dur:2.19s" class="flow-path" d="M400,195 L440,195 L440,298 L480,298" fill="none" stroke="url(#flowGrad)" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
      <path d="M400,185 L450,185 L450,288 L480,288 L480,308 L450,308 L450,205 L400,205 Z" fill="transparent"/>
    </g>

    <g>
      <rect class="node-box" x="40" y="168" width="120" height="44" rx="8" stroke-width="0.5"/>
      <text class="th" x="100" y="190" text-anchor="middle" dominant-baseline="central" fill="var(--text-primary)">Client</text>
    </g>
    <g>
      <rect class="node-box" x="250" y="168" width="150" height="44" rx="8" stroke-width="0.5"/>
      <text class="th" x="325" y="190" text-anchor="middle" dominant-baseline="central" fill="var(--text-primary)">API gateway</text>
    </g>
    <g>
      <rect class="node-box" x="480" y="60" width="140" height="44" rx="8" stroke-width="0.5"/>
      <text class="th" x="550" y="82" text-anchor="middle" dominant-baseline="central" fill="var(--text-primary)">Auth service</text>
    </g>
    <g>
      <rect class="node-box" x="480" y="168" width="140" height="44" rx="8" stroke-width="0.5"/>
      <text class="th" x="550" y="190" text-anchor="middle" dominant-baseline="central" fill="var(--text-primary)">Database</text>
    </g>
    <g>
      <rect class="node-box" x="480" y="276" width="140" height="44" rx="8" stroke-width="0.5"/>
      <text class="th" x="550" y="298" text-anchor="middle" dominant-baseline="central" fill="var(--text-primary)">Cache</text>
    </g>

    <text class="ts" x="340" y="340" text-anchor="middle" fill="var(--text-muted)">Arrow thickness and speed represent traffic volume</text>
  </svg>

  <div id="tooltip" style="display:none;position:absolute;pointer-events:none;background:var(--surface-2);border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:6px 10px;font-size:12px;color:var(--text-primary);box-shadow:var(--shadow-sm,0 0 0 1px rgba(0,0,0,0.05));white-space:nowrap;"></div>
</div>

<div id="modal-overlay" style="display:none;min-height:1px;position:relative;">
  <div style="position:absolute;inset:0;background:rgba(0,0,0,0.45);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:1rem;z-index:1;" onclick="if(event.target===this) closeModal()">
    <div style="background:var(--surface-2);border-radius:12px;border:0.5px solid var(--border);padding:1.25rem;width:100%;max-width:360px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <p id="modal-title" style="font-size:16px;font-weight:500;margin:0;"></p>
        <button onclick="closeModal()" aria-label="Close" style="border:none;background:transparent;cursor:pointer;padding:4px;color:var(--text-secondary);"><i class="ti ti-x" style="font-size:18px;" aria-hidden="true"></i></button>
      </div>
      <table style="width:100%;font-size:13px;margin-bottom:14px;">
        <tr><td style="color:var(--text-secondary);padding:3px 0;">Source</td><td id="modal-source" style="text-align:right;padding:3px 0;"></td></tr>
        <tr><td style="color:var(--text-secondary);padding:3px 0;">Destination</td><td id="modal-dest" style="text-align:right;padding:3px 0;"></td></tr>
        <tr><td style="color:var(--text-secondary);padding:3px 0;">Current volume</td><td id="modal-volume" style="text-align:right;padding:3px 0;"></td></tr>
        <tr><td style="color:var(--text-secondary);padding:3px 0;">Avg latency</td><td id="modal-latency" style="text-align:right;padding:3px 0;"></td></tr>
      </table>
      <p style="font-size:12px;color:var(--text-muted);margin:0 0 6px;">Volume, last 7 intervals</p>
      <div id="modal-history" style="display:flex;align-items:flex-end;gap:6px;height:60px;"></div>
    </div>
  </div>
</div>

<script>
const flows = {
  f1: { source:'Client', dest:'API gateway', volume:'850 req/s', latency:'12 ms', history:[620,700,780,820,850,830,860] },
  f2: { source:'API gateway', dest:'Auth service', volume:'210 req/s', latency:'45 ms', history:[180,190,200,205,210,208,212] },
  f3: { source:'API gateway', dest:'Database', volume:'540 req/s', latency:'28 ms', history:[480,500,520,530,540,535,545] },
  f4: { source:'API gateway', dest:'Cache', volume:'95 req/s', latency:'8 ms', history:[70,80,85,90,95,92,98] }
};

function showTip(evt, id) {
  const f = flows[id];
  const tip = document.getElementById('tooltip');
  const container = evt.currentTarget.closest('svg').parentElement;
  const rect = container.getBoundingClientRect();
  tip.innerHTML = f.source + ' &rarr; ' + f.dest + '<br><span style="color:var(--text-secondary)">' + f.volume + ' &middot; ' + f.latency + ' avg</span>';
  tip.style.left = (evt.clientX - rect.left + 12) + 'px';
  tip.style.top = (evt.clientY - rect.top - 28) + 'px';
  tip.style.display = 'block';
}
function hideTip() {
  document.getElementById('tooltip').style.display = 'none';
}
function openModal(id) {
  const f = flows[id];
  document.getElementById('modal-title').textContent = f.source + ' \u2192 ' + f.dest;
  document.getElementById('modal-source').textContent = f.source;
  document.getElementById('modal-dest').textContent = f.dest;
  document.getElementById('modal-volume').textContent = f.volume;
  document.getElementById('modal-latency').textContent = f.latency;
  const max = Math.max(...f.history);
  const barsHtml = f.history.map(v => '<div class="bar" style="width:16px;height:' + Math.round((v/max)*56) + 'px;" title="' + v + '"></div>').join('');
  document.getElementById('modal-history').innerHTML = barsHtml;
  document.getElementById('modal-overlay').style.display = 'block';
}
function closeModal() {
  document.getElementById('modal-overlay').style.display = 'none';
}
</script>
