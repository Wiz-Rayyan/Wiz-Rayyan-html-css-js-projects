<h2 class="sr-only">Interactive floating label form demo showing label animation on focus and input</h2>
<div style="padding: 2rem 0; max-width: 480px; margin: 0 auto;">

<p style="font-size: 13px; color: var(--color-text-secondary); margin: 0 0 2rem; letter-spacing: 0.02em;">Click any field to see the label float</p>

<style>
.fl-group { position: relative; margin-bottom: 1.5rem; }
.fl-input {
  width: 100%;
  height: 56px;
  padding: 18px 14px 6px;
  font-size: 15px;
  font-family: var(--font-sans);
  color: var(--color-text-primary);
  background: var(--color-background-primary);
  border: 1.5px solid var(--color-border-secondary);
  border-radius: 12px;
  outline: none;
  box-sizing: border-box;
  transition: border-color 0.2s;
}
.fl-input:hover { border-color: var(--color-border-primary); }
.fl-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
.fl-label {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 15px;
  font-family: var(--font-sans);
  color: var(--color-text-secondary);
  pointer-events: none;
  transition: top 0.2s ease, font-size 0.2s ease, color 0.2s ease, transform 0.2s ease;
  transform-origin: left center;
  background: transparent;
  padding: 0 2px;
}
.fl-input:focus ~ .fl-label,
.fl-input.has-value ~ .fl-label {
  top: 8px;
  transform: translateY(0);
  font-size: 11px;
  color: #3b82f6;
  font-weight: 500;
  letter-spacing: 0.03em;
}
.fl-input:not(:focus).has-value ~ .fl-label { color: var(--color-text-tertiary); }
.fl-hint { font-size: 12px; color: var(--color-text-tertiary); margin: 4px 0 0 4px; }

.demo-badge {
  display: inline-block;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--color-background-secondary);
  color: var(--color-text-secondary);
  border: 0.5px solid var(--color-border-tertiary);
  margin-left: 8px;
  vertical-align: middle;
  font-weight: 400;
}

.state-track {
  display: flex;
  gap: 8px;
  margin-top: 6px;
  align-items: center;
}
.state-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--color-border-secondary);
  transition: background 0.2s;
}
.state-dot.active { background: #3b82f6; }
.state-label { font-size: 11px; color: var(--color-text-tertiary); }
</style>

<div class="fl-group" id="g1">
  <input class="fl-input" type="text" id="f1" autocomplete="off" />
  <label class="fl-label" for="f1">Full name</label>
  <div class="state-track">
    <div class="state-dot" id="d1-idle" title="idle"></div>
    <div class="state-dot" id="d1-focus" title="focused"></div>
    <div class="state-dot" id="d1-filled" title="filled"></div>
    <span class="state-label" id="s1">idle</span>
  </div>
</div>

<div class="fl-group" id="g2">
  <input class="fl-input" type="email" id="f2" autocomplete="off" />
  <label class="fl-label" for="f2">Email address</label>
  <div class="state-track">
    <div class="state-dot" id="d2-idle" title="idle"></div>
    <div class="state-dot" id="d2-focus" title="focused"></div>
    <div class="state-dot" id="d2-filled" title="filled"></div>
    <span class="state-label" id="s2">idle</span>
  </div>
</div>

<div class="fl-group" id="g3">
  <input class="fl-input" type="password" id="f3" autocomplete="off" />
  <label class="fl-label" for="f3">Password</label>
  <div class="state-track">
    <div class="state-dot" id="d3-idle" title="idle"></div>
    <div class="state-dot" id="d3-focus" title="focused"></div>
    <div class="state-dot" id="d3-filled" title="filled"></div>
    <span class="state-label" id="s3">idle</span>
  </div>
</div>

<div style="margin-top: 2rem; padding: 1rem 1.25rem; background: var(--color-background-secondary); border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-tertiary);">
  <p style="font-size: 13px; font-weight: 500; margin: 0 0 10px; color: var(--color-text-primary);">The three states</p>
  <div style="display: flex; gap: 24px; flex-wrap: wrap;">
    <div style="display: flex; align-items: center; gap: 6px;">
      <div style="width: 8px; height: 8px; border-radius: 50%; background: var(--color-border-secondary);"></div>
      <span style="font-size: 12px; color: var(--color-text-secondary);">idle — label centered</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <div style="width: 8px; height: 8px; border-radius: 50%; background: #3b82f6;"></div>
      <span style="font-size: 12px; color: var(--color-text-secondary);">focused — label floats up</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <div style="width: 8px; height: 8px; border-radius: 50%; background: var(--color-border-primary);"></div>
      <span style="font-size: 12px; color: var(--color-text-secondary);">filled — stays up, muted</span>
    </div>
  </div>
</div>

</div>

<script>
const fields = [
  { input: 'f1', idle: 'd1-idle', focus: 'd1-focus', filled: 'd1-filled', status: 's1' },
  { input: 'f2', idle: 'd2-idle', focus: 'd2-focus', filled: 'd2-filled', status: 's2' },
  { input: 'f3', idle: 'd3-idle', focus: 'd3-focus', filled: 'd3-filled', status: 's3' },
];

function updateState(f, state) {
  const dots = [f.idle, f.focus, f.filled];
  const labels = ['idle', 'focused', 'filled'];
  const idx = labels.indexOf(state);
  dots.forEach((id, i) => {
    const el = document.getElementById(id);
    el.classList.toggle('active', i === idx);
  });
  document.getElementById(f.status).textContent = state;
}

fields.forEach(f => {
  const input = document.getElementById(f.input);
  updateState(f, 'idle');

  input.addEventListener('focus', () => updateState(f, 'focused'));
  input.addEventListener('blur', () => {
    if (input.value.trim()) {
      input.classList.add('has-value');
      updateState(f, 'filled');
    } else {
      input.classList.remove('has-value');
      updateState(f, 'idle');
    }
  });
  input.addEventListener('input', () => {
    if (input.value.trim()) {
      input.classList.add('has-value');
    } else {
      input.classList.remove('has-value');
    }
  });
});
</script>
