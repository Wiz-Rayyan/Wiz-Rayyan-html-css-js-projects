
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  .dp-root {
    font-family: 'Saira Condensed', sans-serif;
    background: linear-gradient(180deg, #0F172A 0%, #1E293B 50%, #334155 100%);
    border-radius: 16px;
    padding: 24px;
    color: #E2E8F0;
    min-height: 520px;
    position: relative;
    overflow: hidden;
  }
  .dp-glow {
    position: absolute;
    top: -60px; left: 50%;
    transform: translateX(-50%);
    width: 300px; height: 150px;
    background: radial-gradient(ellipse, rgba(0,255,204,0.07) 0%, transparent 70%);
    pointer-events: none;
  }
  .dp-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .dp-badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #00FFCC;
    text-transform: uppercase;
    border: 1px solid rgba(0,255,204,0.3);
    padding: 3px 10px;
    border-radius: 4px;
  }
  .dp-time {
    font-size: 13px;
    color: #94A3B8;
    letter-spacing: 1px;
  }
  .dp-title {
    font-size: 32px;
    font-weight: 900;
    color: #F1F5F9;
    letter-spacing: 1px;
    line-height: 1;
    margin-bottom: 4px;
  }
  .dp-sub {
    font-size: 14px;
    color: #64748B;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  .dp-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .dp-card {
    background: rgba(255,255,255,0.04);
    border: 0.5px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 14px;
  }
  .dp-card-label {
    font-size: 11px;
    color: #64748B;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .dp-card-value {
    font-size: 28px;
    font-weight: 700;
    color: #F1F5F9;
    line-height: 1;
  }
  .dp-card-unit {
    font-size: 13px;
    color: #94A3B8;
    margin-left: 3px;
  }
  .dp-card-delta {
    font-size: 12px;
    color: #00FFCC;
    margin-top: 4px;
  }
  .dp-timer-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .dp-stopwatch {
    background: rgba(0,255,204,0.05);
    border: 1px solid rgba(0,255,204,0.2);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }
  .dp-sw-label {
    font-size: 11px;
    color: #00FFCC;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .dp-sw-time {
    font-size: 40px;
    font-weight: 900;
    color: #00FFCC;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    margin-bottom: 10px;
  }
  .dp-sw-controls {
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .dp-btn {
    font-family: 'Saira Condensed', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 5px;
    cursor: pointer;
    border: 1px solid rgba(0,255,204,0.4);
    background: rgba(0,255,204,0.1);
    color: #00FFCC;
    transition: background 0.15s;
  }
  .dp-btn:hover { background: rgba(0,255,204,0.2); }
  .dp-btn.reset {
    border-color: rgba(148,163,184,0.3);
    background: transparent;
    color: #94A3B8;
  }
  .dp-countdown {
    background: rgba(255,255,255,0.03);
    border: 0.5px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }
  .dp-cd-label {
    font-size: 11px;
    color: #94A3B8;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .dp-cd-time {
    font-size: 40px;
    font-weight: 900;
    color: #F1F5F9;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    margin-bottom: 10px;
  }
  .dp-cd-controls {
    display: flex;
    gap: 6px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .dp-cd-preset {
    font-family: 'Saira Condensed', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    border: 0.5px solid rgba(255,255,255,0.12);
    background: transparent;
    color: #94A3B8;
    transition: all 0.15s;
  }
  .dp-cd-preset:hover, .dp-cd-preset.active {
    background: rgba(255,255,255,0.08);
    color: #E2E8F0;
    border-color: rgba(255,255,255,0.25);
  }
  .dp-rings-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .dp-ring-wrap {
    background: rgba(255,255,255,0.03);
    border: 0.5px solid rgba(255,255,255,0.07);
    border-radius: 10px;
    padding: 12px 8px;
    text-align: center;
  }
  .dp-ring-label {
    font-size: 10px;
    color: #64748B;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 8px;
  }
  .dp-ring-val {
    font-size: 13px;
    font-weight: 700;
    color: #CBD5E1;
    margin-top: 2px;
  }
</style>

<div class="dp-root">
  <div class="dp-glow"></div>

  <div class="dp-header">
    <span class="dp-badge">Dawn Patrol</span>
    <span class="dp-time" id="live-clock">05:00:00</span>
  </div>

  <div class="dp-title">MORNING GRIND</div>
  <div class="dp-sub">Thursday · May 21 · Week 21</div>

  <div class="dp-grid">
    <div class="dp-card">
      <div class="dp-card-label">Calories</div>
      <div class="dp-card-value">486<span class="dp-card-unit">kcal</span></div>
      <div class="dp-card-delta">↑ 12% vs yesterday</div>
    </div>
    <div class="dp-card">
      <div class="dp-card-label">Heart Rate</div>
      <div class="dp-card-value" id="hr-val">148<span class="dp-card-unit">bpm</span></div>
      <div class="dp-card-delta">Zone 4 · Threshold</div>
    </div>
    <div class="dp-card">
      <div class="dp-card-label">Streak</div>
      <div class="dp-card-value">23<span class="dp-card-unit">days</span></div>
      <div class="dp-card-delta">Personal best 🔥</div>
    </div>
  </div>

  <div class="dp-timer-row">
    <div class="dp-stopwatch">
      <div class="dp-sw-label">Stopwatch</div>
      <div class="dp-sw-time" id="sw-display">00:00.0</div>
      <div class="dp-sw-controls">
        <button class="dp-btn" id="sw-btn" onclick="swToggle()">Start</button>
        <button class="dp-btn reset" onclick="swReset()">Reset</button>
      </div>
    </div>

    <div class="dp-countdown">
      <div class="dp-cd-label">Rest Timer</div>
      <div class="dp-cd-time" id="cd-display">01:30</div>
      <div class="dp-cd-controls">
        <button class="dp-cd-preset active" onclick="setCD(30, this)">30s</button>
        <button class="dp-cd-preset" onclick="setCD(60, this)">1m</button>
        <button class="dp-cd-preset" onclick="setCD(90, this)">90s</button>
        <button class="dp-cd-preset" onclick="setCD(120, this)">2m</button>
        <button class="dp-btn" id="cd-btn" onclick="cdToggle()" style="padding:4px 12px;font-size:11px;">Start</button>
      </div>
    </div>
  </div>

  <div class="dp-rings-row">
    <div class="dp-ring-wrap">
      <svg width="60" height="60" viewBox="0 0 60 60">
        <circle cx="30" cy="30" r="24" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="6"/>
        <circle cx="30" cy="30" r="24" fill="none" stroke="#00FFCC" stroke-width="6"
          stroke-dasharray="150.8" stroke-dashoffset="30" stroke-linecap="round"
          transform="rotate(-90 30 30)"/>
        <text x="30" y="35" text-anchor="middle" fill="#00FFCC" font-family="Saira Condensed,sans-serif" font-size="13" font-weight="700">80%</text>
      </svg>
      <div class="dp-ring-label">Move</div>
      <div class="dp-ring-val">8.0k steps</div>
    </div>
    <div class="dp-ring-wrap">
      <svg width="60" height="60" viewBox="0 0 60 60">
        <circle cx="30" cy="30" r="24" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="6"/>
        <circle cx="30" cy="30" r="24" fill="none" stroke="#38BDF8" stroke-width="6"
          stroke-dasharray="150.8" stroke-dashoffset="55" stroke-linecap="round"
          transform="rotate(-90 30 30)"/>
        <text x="30" y="35" text-anchor="middle" fill="#38BDF8" font-family="Saira Condensed,sans-serif" font-size="13" font-weight="700">64%</text>
      </svg>
      <div class="dp-ring-label">Exercise</div>
      <div class="dp-ring-val">38 / 60 min</div>
    </div>
    <div class="dp-ring-wrap">
      <svg width="60" height="60" viewBox="0 0 60 60">
        <circle cx="30" cy="30" r="24" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="6"/>
        <circle cx="30" cy="30" r="24" fill="none" stroke="#F472B6" stroke-width="6"
          stroke-dasharray="150.8" stroke-dashoffset="22" stroke-linecap="round"
          transform="rotate(-90 30 30)"/>
        <text x="30" y="35" text-anchor="middle" fill="#F472B6" font-family="Saira Condensed,sans-serif" font-size="13" font-weight="700">85%</text>
      </svg>
      <div class="dp-ring-label">Stand</div>
      <div class="dp-ring-val">11 / 12 hrs</div>
    </div>
    <div class="dp-ring-wrap">
      <svg width="60" height="60" viewBox="0 0 60 60">
        <circle cx="30" cy="30" r="24" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="6"/>
        <circle cx="30" cy="30" r="24" fill="none" stroke="#FACC15" stroke-width="6"
          stroke-dasharray="150.8" stroke-dashoffset="75" stroke-linecap="round"
          transform="rotate(-90 30 30)"/>
        <text x="30" y="35" text-anchor="middle" fill="#FACC15" font-family="Saira Condensed,sans-serif" font-size="13" font-weight="700">50%</text>
      </svg>
      <div class="dp-ring-label">Hydration</div>
      <div class="dp-ring-val">1.0 / 2.0 L</div>
    </div>
  </div>
</div>

<script>
  // Live clock
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('live-clock').textContent = h+':'+m+':'+s;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // HR flicker
  setInterval(() => {
    const base = 148;
    const v = base + Math.round((Math.random()-0.5)*6);
    document.getElementById('hr-val').innerHTML = v+'<span class="dp-card-unit">bpm</span>';
  }, 1800);

  // Stopwatch
  let swRunning = false, swStart = 0, swElapsed = 0, swRaf = null;
  function swTick() {
    const total = swElapsed + (Date.now() - swStart);
    const mins = Math.floor(total/60000);
    const secs = Math.floor((total%60000)/1000);
    const tenths = Math.floor((total%1000)/100);
    document.getElementById('sw-display').textContent =
      String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0')+'.'+tenths;
    if(swRunning) swRaf = requestAnimationFrame(swTick);
  }
  function swToggle() {
    swRunning = !swRunning;
    const btn = document.getElementById('sw-btn');
    if(swRunning) { swStart = Date.now(); btn.textContent='Pause'; swTick(); }
    else { swElapsed += Date.now()-swStart; btn.textContent='Resume'; cancelAnimationFrame(swRaf); }
  }
  function swReset() {
    swRunning=false; swElapsed=0; cancelAnimationFrame(swRaf);
    document.getElementById('sw-display').textContent='00:00.0';
    document.getElementById('sw-btn').textContent='Start';
  }

  // Countdown
  let cdSecs = 90, cdRemain = 90, cdRunning = false, cdInt = null;
  function setCD(s, el) {
    cdSecs = s; cdRemain = s; cdRunning = false;
    clearInterval(cdInt);
    document.getElementById('cd-btn').textContent = 'Start';
    renderCD();
    document.querySelectorAll('.dp-cd-preset').forEach(b=>b.classList.remove('active'));
    el.classList.add('active');
  }
  function renderCD() {
    const m = Math.floor(cdRemain/60);
    const s = cdRemain%60;
    document.getElementById('cd-display').textContent =
      String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    const el = document.getElementById('cd-display');
    el.style.color = cdRemain <= 10 ? '#F87171' : '#F1F5F9';
  }
  function cdToggle() {
    if(cdRunning) {
      clearInterval(cdInt); cdRunning=false;
      document.getElementById('cd-btn').textContent='Resume';
    } else {
      if(cdRemain===0){cdRemain=cdSecs;}
      cdRunning=true;
      document.getElementById('cd-btn').textContent='Pause';
      cdInt = setInterval(()=>{
        cdRemain--;
        renderCD();
        if(cdRemain<=0){clearInterval(cdInt);cdRunning=false;document.getElementById('cd-btn').textContent='Start';}
      },1000);
    }
  }
  renderCD();
</script>
