
<style>
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  @keyframes blink { 0%,90%,100%{opacity:1} 95%{opacity:0} }
  @keyframes drip { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.15)} }
  @keyframes wiggle { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} }
  .ghost { animation: float 3s ease-in-out infinite; }
  .eye { animation: blink 4s ease-in-out infinite; }
  .drip { animation: drip 2s ease-in-out infinite; }
  .skull { animation: wiggle 5s ease-in-out infinite; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; }
</style>

<div style="background:#FFC0CB; border-radius:20px; padding:28px 24px 24px; font-family:'Comic Sans MS',cursive,sans-serif; position:relative; border: 3px dashed #cc7a8a; outline: 3px dotted #ff9aaa; outline-offset: 4px; max-width:620px; margin:0 auto;">

  <!-- stitched corner patches -->
  <div style="position:absolute;top:-2px;left:16px;width:32px;height:12px;background:#f9e0e4;border:1.5px dashed #cc7a8a;border-radius:3px;"></div>
  <div style="position:absolute;top:-2px;right:16px;width:32px;height:12px;background:#f9e0e4;border:1.5px dashed #cc7a8a;border-radius:3px;"></div>

  <!-- header -->
  <div style="text-align:center;margin-bottom:20px;">
    <p style="font-size:11px;letter-spacing:4px;color:#8a4455;text-transform:uppercase;margin-bottom:4px;">✦ japanese micro-aesthetic ✦</p>
    <h1 style="font-size:28px;font-weight:900;color:#2a0a12;letter-spacing:-0.5px;line-height:1.1;">kimo<span style="color:#cc2244;">✕</span>kawaii</h1>
    <p style="font-size:12px;color:#6b3040;margin-top:4px;">creepy cute · 気持ち悪い可愛い</p>
  </div>

  <!-- main characters row -->
  <div style="display:flex;justify-content:center;gap:24px;align-items:flex-end;margin-bottom:20px;">

    <!-- ghost character -->
    <div style="text-align:center;">
      <div class="ghost" style="display:inline-block;">
        <svg width="72" height="88" viewBox="0 0 72 88">
          <!-- ghost body -->
          <path d="M10 40 Q10 10 36 10 Q62 10 62 40 L62 78 Q52 68 46 78 Q40 68 36 78 Q32 68 26 78 Q20 68 10 78 Z" fill="white" stroke="#cc7a8a" stroke-width="1.5"/>
          <!-- ghost blushing cheeks -->
          <ellipse cx="22" cy="48" rx="6" ry="4" fill="#ffaabb" opacity="0.5"/>
          <ellipse cx="50" cy="48" rx="6" ry="4" fill="#ffaabb" opacity="0.5"/>
          <!-- one eye (normal) -->
          <ellipse class="eye" cx="28" cy="40" rx="5" ry="6" fill="#2a0a12"/>
          <circle cx="30" cy="38" r="1.5" fill="white"/>
          <!-- eye patch over other eye -->
          <rect x="38" y="33" width="16" height="11" rx="2" fill="#2a0a12" stroke="#cc7a8a" stroke-width="1"/>
          <line x1="38" y1="38" x2="54" y2="38" stroke="#cc7a8a" stroke-width="0.75"/>
          <!-- X on eye patch -->
          <line x1="42" y1="35" x2="50" y2="42" stroke="#FFC0CB" stroke-width="1.5"/>
          <line x1="50" y1="35" x2="42" y2="42" stroke="#FFC0CB" stroke-width="1.5"/>
          <!-- stitched mouth -->
          <path d="M26 56 Q36 62 46 56" fill="none" stroke="#2a0a12" stroke-width="1.5" stroke-dasharray="3,2"/>
        </svg>
      </div>
      <div style="font-size:10px;color:#6b3040;margin-top:2px;">yurei-chan</div>
    </div>

    <!-- center bandage decoration + drip -->
    <div style="text-align:center;flex:1;max-width:160px;">
      <!-- bloody drip -->
      <div class="drip" style="display:inline-block;margin-bottom:4px;">
        <svg width="60" height="36" viewBox="0 0 60 36">
          <ellipse cx="30" cy="6" rx="18" ry="6" fill="#cc2244" opacity="0.85"/>
          <path d="M20 6 Q16 20 18 30 Q20 36 22 30 Q24 20 24 6" fill="#cc2244" opacity="0.85"/>
          <path d="M30 6 Q28 16 30 28 Q32 16 30 6" fill="#cc2244" opacity="0.85"/>
          <path d="M40 6 Q44 20 42 30 Q40 36 38 30 Q36 20 36 6" fill="#cc2244" opacity="0.85"/>
        </svg>
      </div>
      <div style="background:#fff5f6;border:1.5px dashed #cc7a8a;border-radius:8px;padding:10px 8px;position:relative;">
        <!-- bandage SVG -->
        <svg width="100" height="28" viewBox="0 0 100 28" style="display:block;margin:0 auto 6px;">
          <rect x="0" y="8" width="100" height="12" rx="6" fill="#f5e6d3" stroke="#c8a882" stroke-width="1"/>
          <rect x="36" y="4" width="28" height="20" rx="3" fill="#f5e6d3" stroke="#c8a882" stroke-width="1"/>
          <circle cx="50" cy="14" r="5" fill="#ead0b8" stroke="#c8a882" stroke-width="0.75"/>
          <line x1="8" y1="12" x2="8" y2="16" stroke="#c8a882" stroke-width="0.75"/>
          <line x1="16" y1="12" x2="16" y2="16" stroke="#c8a882" stroke-width="0.75"/>
          <line x1="84" y1="12" x2="84" y2="16" stroke="#c8a882" stroke-width="0.75"/>
          <line x1="92" y1="12" x2="92" y2="16" stroke="#c8a882" stroke-width="0.75"/>
        </svg>
        <p style="font-size:11px;color:#8a4455;font-weight:700;letter-spacing:1px;">CUTE BUT WRONG</p>
      </div>
    </div>

    <!-- skeleton character -->
    <div class="skull" style="text-align:center;">
      <svg width="72" height="88" viewBox="0 0 72 88">
        <!-- skull -->
        <ellipse cx="36" cy="35" rx="22" ry="24" fill="white" stroke="#cc7a8a" stroke-width="1.5"/>
        <!-- rosy cheeks -->
        <ellipse cx="20" cy="40" rx="7" ry="5" fill="#ffaabb" opacity="0.4"/>
        <ellipse cx="52" cy="40" rx="7" ry="5" fill="#ffaabb" opacity="0.4"/>
        <!-- skull eye sockets -->
        <ellipse cx="27" cy="33" rx="7" ry="8" fill="#2a0a12"/>
        <ellipse cx="45" cy="33" rx="7" ry="8" fill="#2a0a12"/>
        <!-- cute glints in skull eyes -->
        <circle cx="29" cy="30" r="2" fill="white" opacity="0.6"/>
        <circle cx="47" cy="30" r="2" fill="white" opacity="0.6"/>
        <!-- nose -->
        <path d="M33 45 Q36 48 39 45" fill="none" stroke="#2a0a12" stroke-width="1.5" stroke-linecap="round"/>
        <!-- teeth smile -->
        <rect x="22" y="51" width="28" height="10" rx="4" fill="white" stroke="#cc7a8a" stroke-width="1"/>
        <line x1="30" y1="51" x2="30" y2="61" stroke="#cc7a8a" stroke-width="0.75"/>
        <line x1="36" y1="51" x2="36" y2="61" stroke="#cc7a8a" stroke-width="0.75"/>
        <line x1="42" y1="51" x2="42" y2="61" stroke="#cc7a8a" stroke-width="0.75"/>
        <!-- spine stub -->
        <rect x="32" y="62" width="8" height="6" rx="2" fill="white" stroke="#cc7a8a" stroke-width="1"/>
        <rect x="31" y="70" width="10" height="6" rx="2" fill="white" stroke="#cc7a8a" stroke-width="1"/>
        <rect x="32" y="78" width="8" height="6" rx="2" fill="white" stroke="#cc7a8a" stroke-width="1"/>
      </svg>
      <div style="font-size:10px;color:#6b3040;margin-top:2px;">hone-chan</div>
    </div>
  </div>

  <!-- tag row -->
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:18px;">
    <span style="background:#2a0a12;color:#FFC0CB;font-size:10px;letter-spacing:1.5px;padding:4px 10px;border-radius:20px;text-transform:uppercase;">♡ pastel horror</span>
    <span style="background:#cc2244;color:#ffe0e8;font-size:10px;letter-spacing:1.5px;padding:4px 10px;border-radius:20px;text-transform:uppercase;">骨 streetwear</span>
    <span style="background:#fff;color:#cc7a8a;font-size:10px;letter-spacing:1.5px;padding:4px 10px;border-radius:20px;border:1px dashed #cc7a8a;text-transform:uppercase;">✦ indie horror</span>
  </div>

  <!-- bottom palette swatch row -->
  <div style="display:flex;gap:6px;align-items:center;justify-content:center;margin-bottom:14px;">
    <div style="width:28px;height:28px;border-radius:50%;background:#FFC0CB;border:1.5px dashed #cc7a8a;"></div>
    <div style="width:28px;height:28px;border-radius:50%;background:#ffe0e8;border:1.5px dashed #cc7a8a;"></div>
    <div style="width:28px;height:28px;border-radius:50%;background:#fff;border:1.5px dashed #cc7a8a;"></div>
    <div style="width:28px;height:28px;border-radius:50%;background:#2a0a12;border:1.5px solid #2a0a12;"></div>
    <div style="width:28px;height:28px;border-radius:50%;background:#cc2244;border:1.5px solid #cc2244;"></div>
    <div style="width:28px;height:28px;border-radius:50%;background:#f5e6d3;border:1.5px dashed #c8a882;"></div>
    <p style="font-size:10px;color:#8a4455;margin-left:4px;letter-spacing:0.5px;">kimo-kawaii palette</p>
  </div>

  <!-- footer rule -->
  <div style="border-top:1.5px dashed #cc7a8a;padding-top:10px;text-align:center;">
    <p style="font-size:10px;color:#8a4455;letter-spacing:2px;text-transform:uppercase;">cute is dangerous · 可愛いは危険</p>
  </div>
</div>
