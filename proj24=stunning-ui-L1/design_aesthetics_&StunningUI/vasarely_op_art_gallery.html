
<style>
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.012); }
  }
  @keyframes rotate-slow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes shimmer {
    0% { transform: translateX(0) translateY(0); }
    25% { transform: translateX(2px) translateY(-2px); }
    50% { transform: translateX(0) translateY(-4px); }
    75% { transform: translateX(-2px) translateY(-2px); }
    100% { transform: translateX(0) translateY(0); }
  }
  @keyframes breathe {
    0%, 100% { transform: scaleX(1) scaleY(1); }
    50% { transform: scaleX(1.018) scaleY(0.984); }
  }
  @keyframes warp {
    0%, 100% { filter: contrast(1.8) brightness(1); }
    50% { filter: contrast(2.2) brightness(0.95); }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { background: #000; }

  .gallery {
    background: #000;
    padding: 0;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: auto auto auto;
    gap: 2px;
    width: 100%;
  }

  .panel {
    position: relative;
    overflow: hidden;
    aspect-ratio: 1;
    cursor: crosshair;
  }

  .panel-wide {
    grid-column: span 2;
    aspect-ratio: 2/1;
  }

  .panel-tall {
    grid-row: span 2;
    aspect-ratio: 1/2;
  }

  .panel svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .label {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 6px 10px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #fff;
    mix-blend-mode: difference;
    opacity: 0;
    transition: opacity 0.3s;
    background: rgba(0,0,0,0.5);
  }

  .panel:hover .label { opacity: 1; }

  .anim-pulse { animation: pulse 3s ease-in-out infinite; }
  .anim-breathe { animation: breathe 4s ease-in-out infinite; }
  .anim-shimmer { animation: shimmer 5s ease-in-out infinite; }
  .anim-warp { animation: warp 3.5s ease-in-out infinite; }
  .anim-rotate { animation: rotate-slow 20s linear infinite; }
</style>

  <!-- 3. Checkerboard morphing (tall) -->
  <div class="panel panel-tall">
    <svg viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg" class="anim-warp">
      <rect width="200" height="400" fill="#000"/>
      <defs>
        <pattern id="chk" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">

          <rect x="10" y="10" width="10" height="10" fill="#fff"/>

      <!-- Morphing checkerboard using ellipses to distort -->
      <g>
        <!-- row by row, squished in middle to create bulge -->
        <rect x="0" y="0" width="200" height="200" fill="url(#chk)" transform="scale(1,1)"/>
        <!-- sphere-like distortion overlay -->
        <ellipse cx="100" cy="100" rx="90" ry="90" fill="none" stroke="#000" stroke-width="0"/>
        <!-- create illusion of sphere with concentric scaled rects -->

        <rect x="0" y="0" width="200" height="200" fill="url(#chk2)"/>

    </svg>
