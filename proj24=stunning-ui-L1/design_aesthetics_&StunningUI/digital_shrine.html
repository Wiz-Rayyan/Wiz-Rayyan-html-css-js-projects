
<style>
  @keyframes flicker {
    0%,100%{transform:scaleX(1) scaleY(1);opacity:1}
    20%{transform:scaleX(0.92) scaleY(1.06);opacity:0.94}
    40%{transform:scaleX(1.05) scaleY(0.97);opacity:0.98}
    60%{transform:scaleX(0.97) scaleY(1.04);opacity:0.92}
    80%{transform:scaleX(1.03) scaleY(0.98);opacity:0.97}
  }
  @keyframes flicker2 {
    0%,100%{transform:scaleX(1) scaleY(1);opacity:0.85}
    25%{transform:scaleX(1.06) scaleY(0.95);opacity:0.9}
    50%{transform:scaleX(0.94) scaleY(1.07);opacity:0.8}
    75%{transform:scaleX(1.04) scaleY(0.96);opacity:0.88}
  }
  @keyframes smokeRise {
    0%{transform:translateY(0) translateX(0) scaleX(1);opacity:0.18}
    30%{transform:translateY(-28px) translateX(4px) scaleX(1.2);opacity:0.12}
    60%{transform:translateY(-56px) translateX(-3px) scaleX(1.5);opacity:0.07}
    100%{transform:translateY(-90px) translateX(2px) scaleX(1.8);opacity:0}
  }
  @keyframes smokeRise2 {
    0%{transform:translateY(0) translateX(0) scaleX(1);opacity:0.15}
    40%{transform:translateY(-35px) translateX(-5px) scaleX(1.3);opacity:0.09}
    70%{transform:translateY(-65px) translateX(3px) scaleX(1.6);opacity:0.05}
    100%{transform:translateY(-95px) translateX(-2px) scaleX(2);opacity:0}
  }
  @keyframes pulseGlow {
    0%,100%{opacity:0.18}
    50%{opacity:0.28}
  }
  @keyframes floatUp {
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-4px)}
  }
  @keyframes shimmer {
    0%,100%{opacity:0.6}
    50%{opacity:1}
  }
  .shrine-wrap {
    background:#1A0F0A;
    min-height:600px;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:2.5rem 1.5rem 3rem;
    font-family:Georgia,serif;
    position:relative;
    overflow:hidden;
  }
  .shrine-title {
    color:#D4A96A;
    font-size:13px;
    letter-spacing:0.3em;
    text-transform:uppercase;
    margin:0 0 0.4rem;
    opacity:0.7;
  }
  .shrine-name {
    color:#F0DEC0;
    font-size:24px;
    font-weight:400;
    margin:0 0 0.2rem;
    letter-spacing:0.08em;
  }
  .shrine-dates {
    color:#8C6840;
    font-size:12px;
    letter-spacing:0.2em;
    margin:0 0 2rem;
  }
  .icon-grid {
    display:grid;
    grid-template-columns:repeat(3,80px);
    gap:10px;
    margin-bottom:1.8rem;
  }
  .icon-cell {
    width:80px;
    height:80px;
    border:1px solid #3A2510;
    background:#1F1208;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:4px;
    position:relative;
    animation:shimmer 3s ease-in-out infinite;
  }
  .icon-cell:nth-child(2){animation-delay:0.5s}
  .icon-cell:nth-child(3){animation-delay:1s}
  .icon-cell:nth-child(4){animation-delay:1.5s}
  .icon-cell:nth-child(5){animation-delay:0.25s}
  .icon-cell:nth-child(6){animation-delay:0.75s}
  .icon-cell svg{opacity:0.85}
  .altar-row {
    display:flex;
    align-items:flex-end;
    gap:2.5rem;
    margin-bottom:1.5rem;
    position:relative;
  }
  .candle-wrap {
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
  }
  .flame {
    transform-origin:50% 100%;
    animation:flicker 1.7s ease-in-out infinite;
  }
  .flame2 {
    transform-origin:50% 100%;
    animation:flicker2 2.1s ease-in-out infinite;
  }
  .smoke-thread {
    position:absolute;
    animation:smokeRise 2.8s ease-out infinite;
    pointer-events:none;
  }
  .smoke-thread2 {
    position:absolute;
    animation:smokeRise2 3.2s ease-out infinite 0.6s;
    pointer-events:none;
  }
  .bowl-float {
    animation:floatUp 4s ease-in-out infinite;
  }
  .geo-glow {
    animation:pulseGlow 3.5s ease-in-out infinite;
  }
  .offering-text {
    color:#8C6840;
    font-size:11px;
    letter-spacing:0.15em;
    margin-top:0.5rem;
    text-align:center;
  }
  .inscription {
    color:#6B4E2A;
    font-size:12px;
    font-style:italic;
    letter-spacing:0.12em;
    text-align:center;
    max-width:280px;
    line-height:1.8;
    margin-top:1rem;
    border-top:1px solid #2A1A0A;
    padding-top:1rem;
  }
  .ambient {
    position:absolute;
    top:0;left:0;right:0;bottom:0;
    pointer-events:none;
    background:radial-gradient(ellipse 60% 40% at 50% 60%, #3D1E0820 0%, transparent 70%);
  }
</style>

  <p class="inscription">
    "She who loved without measure,<br>
    whose laughter opened every door —<br>
    remembered always, dimmed never."
