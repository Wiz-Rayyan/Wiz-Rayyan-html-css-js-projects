
<style>
  @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  .scene {
    min-height: 600px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0906;
    position: relative;
    overflow: hidden;
    cursor: default;
  }

  .room-noise {
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.012) 2px, rgba(255,255,255,0.012) 3px),
      repeating-linear-gradient(90deg, transparent, transparent 4px, rgba(255,255,255,0.006) 4px, rgba(255,255,255,0.006) 5px);
    pointer-events: none;
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.85) 100%);
    pointer-events: none;
    z-index: 2;
  }

  .doorway-wrap {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .doorway {
    position: relative;
    width: 220px;
    height: 340px;
  }

  .beyond {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #1a2a1a 0%, #0d1a0d 40%, #060d06 100%);
    border-radius: 0;
    overflow: hidden;
    transition: filter 0.9s ease;
    filter: blur(6px) brightness(0.5);
  }

  .scene:hover .beyond {
    filter: blur(2px) brightness(0.75);
  }

  .beyond-light {
    position: absolute;
    top: -60px;
    left: 50%;
    transform: translateX(-50%);
    width: 180px;
    height: 220px;
    background: radial-gradient(ellipse at 50% 0%, rgba(180,220,130,0.18) 0%, transparent 70%);
    pointer-events: none;
  }

  .beyond-floor-line {
    position: absolute;
    bottom: 30%;
    left: 10%;
    right: 10%;
    height: 1px;
    background: rgba(160,200,100,0.06);
    transition: opacity 0.9s ease;
    opacity: 0;
  }

  .scene:hover .beyond-floor-line {
    opacity: 1;
  }

  .beyond-shape {
    position: absolute;
    bottom: 28%;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 60px;
    background: rgba(140,180,80,0.07);
    transition: opacity 0.9s ease;
    opacity: 0;
  }

  .scene:hover .beyond-shape {
    opacity: 1;
  }

  .frame {
    position: absolute;
    inset: -1px;
    pointer-events: none;
  }

  .frame::before {
    content: '';
    position: absolute;
    inset: 0;
    border-left: 14px solid #1c1510;
    border-right: 14px solid #1c1510;
    border-top: 14px solid #1c1510;
    box-shadow:
      inset 3px 0 6px rgba(0,0,0,0.6),
      inset -3px 0 6px rgba(0,0,0,0.6),
      inset 0 3px 6px rgba(0,0,0,0.6),
      2px 0 12px rgba(0,0,0,0.9),
      -2px 0 12px rgba(0,0,0,0.9),
      0 -2px 12px rgba(0,0,0,0.9);
  }

  .frame-inner-left {
    position: absolute;
    left: 14px;
    top: 14px;
    bottom: 0;
    width: 3px;
    background: linear-gradient(to right, #2a1f14, #4a3520);
  }

  .frame-inner-right {
    position: absolute;
    right: 14px;
    top: 14px;
    bottom: 0;
    width: 3px;
    background: linear-gradient(to left, #2a1f14, #4a3520);
  }

  .frame-inner-top {
    position: absolute;
    left: 14px;
    right: 14px;
    top: 14px;
    height: 3px;
    background: linear-gradient(to bottom, #2a1f14, #4a3520);
  }

  .threshold-line {
    position: absolute;
    bottom: 0;
    left: -28px;
    right: -28px;
    height: 2px;
    background: linear-gradient(to right,
      transparent 0%,
      rgba(180,150,90,0.15) 10%,
      rgba(200,170,100,0.55) 30%,
      rgba(220,190,120,0.7) 50%,
      rgba(200,170,100,0.55) 70%,
      rgba(180,150,90,0.15) 90%,
      transparent 100%
    );
    transition: opacity 0.6s ease;
  }

  .threshold-label {
    position: absolute;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'IM Fell English', Georgia, serif;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: rgba(180,150,90,0.35);
    white-space: nowrap;
    font-style: italic;
    transition: color 0.6s ease;
  }

  .scene:hover .threshold-label {
    color: rgba(180,150,90,0.55);
  }

  .walls {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .wall-left {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    right: calc(50% + 110px + 14px);
    background: #0f0c09;
    box-shadow: inset -20px 0 40px rgba(0,0,0,0.4);
  }

  .wall-right {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    left: calc(50% + 110px + 14px);
    background: #0f0c09;
    box-shadow: inset 20px 0 40px rgba(0,0,0,0.4);
  }

  .wall-top {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: calc(50% + 170px + 14px);
    background: #0f0c09;
    box-shadow: inset 0 -20px 40px rgba(0,0,0,0.4);
  }

  .floor {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: calc(50% - 170px - 14px);
    background: #0d0b08;
  }

  .floor-line {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(to right,
      transparent 0%,
      rgba(100,80,50,0.4) 20%,
      rgba(130,100,60,0.6) 50%,
      rgba(100,80,50,0.4) 80%,
      transparent 100%
    );
  }

  .enter-text {
    position: relative;
    z-index: 4;
    margin-top: 48px;
    font-family: 'IM Fell English', Georgia, serif;
    font-size: 22px;
    font-style: italic;
    color: rgba(210,185,130,0.45);
    letter-spacing: 0.08em;
    text-align: center;
    transition: color 0.9s ease, text-shadow 0.9s ease;
    user-select: none;
  }

  .scene:hover .enter-text {
    color: rgba(210,185,130,0.75);
    text-shadow: 0 0 30px rgba(180,150,80,0.2);
  }

  .enter-mark {
    display: inline-block;
    opacity: 0.5;
    animation: breathe 3.8s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.7; }
  }

  .footnote {
    position: relative;
    z-index: 4;
    margin-top: 16px;
    font-family: Georgia, serif;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: rgba(140,120,80,0.25);
    text-align: center;
    font-style: italic;
    transition: color 0.9s ease;
    user-select: none;
  }

  .scene:hover .footnote {
    color: rgba(140,120,80,0.4);
  }

  .light-spill {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    height: 60px;
    background: radial-gradient(ellipse at 50% 0%, rgba(140,180,80,0.07) 0%, transparent 70%);
    pointer-events: none;
    z-index: 2;
    transition: opacity 0.9s ease;
    opacity: 0;
  }

  .scene:hover .light-spill {
    opacity: 1;
  }

  .corner-mark {
    position: absolute;
    z-index: 4;
    font-family: Georgia, serif;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: rgba(120,100,60,0.18);
    font-style: italic;
  }

  .corner-mark.tl { top: 18px; left: 22px; }
  .corner-mark.tr { top: 18px; right: 22px; }
</style>

<div class="scene">
  <div class="room-noise"></div>
  <div class="vignette"></div>

  <div class="walls">
    <div class="wall-left"></div>
    <div class="wall-right"></div>
    <div class="wall-top"></div>
    <div class="floor">
      <div class="floor-line"></div>
    </div>
  </div>

  <div class="corner-mark tl">I</div>
  <div class="corner-mark tr">I</div>

  <div class="doorway-wrap">
    <div class="doorway">
      <div class="beyond">
        <div class="beyond-light"></div>
        <div class="beyond-floor-line"></div>
        <div class="beyond-shape"></div>
      </div>

      <div class="frame">
        <div class="frame-inner-left"></div>
        <div class="frame-inner-right"></div>
        <div class="frame-inner-top"></div>
      </div>

      <div class="threshold-line"></div>
      <div class="threshold-label">threshold</div>
    </div>

    <div class="light-spill"></div>

    <div class="enter-text">Enter<span class="enter-mark">?</span></div>
    <div class="footnote">hover to see what waits</div>
  </div>
</div>
