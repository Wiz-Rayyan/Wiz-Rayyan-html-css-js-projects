
<style>
*{box-sizing:border-box;margin:0;padding:0}
.shell{display:flex;height:580px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-primary);font-family:var(--font-sans)}
.sidebar{width:320px;min-width:320px;border-right:0.5px solid var(--color-border-tertiary);display:flex;flex-direction:column}
.sidebar-header{padding:16px;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:space-between}
.sidebar-header h2{font-size:17px;font-weight:500;color:var(--color-text-primary)}
.header-icons{display:flex;gap:8px}
.icon-btn{width:32px;height:32px;border-radius:var(--border-radius-md);border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--color-text-secondary);font-size:18px}
.icon-btn:hover{background:var(--color-background-secondary)}
.search-wrap{padding:10px 12px;border-bottom:0.5px solid var(--color-border-tertiary)}
.search-wrap input{width:100%;padding:7px 12px 7px 34px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);font-size:13px;color:var(--color-text-primary);outline:none}
.search-wrap{position:relative}
.search-wrap .ti-search{position:absolute;left:22px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--color-text-secondary);pointer-events:none}
.conv-list{overflow-y:auto;flex:1}
.conv-list::-webkit-scrollbar{width:4px}
.conv-list::-webkit-scrollbar-thumb{background:var(--color-border-secondary);border-radius:4px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:0.5px solid var(--color-border-tertiary);cursor:pointer;position:relative;transition:background 0.12s;border-left:3px solid transparent}
.row:hover{background:var(--color-background-secondary)}
.row.active{background:var(--color-background-info);border-left:3px solid #378ADD}
.row.active .name{color:var(--color-text-info)}
.avatar{width:42px;height:42px;min-width:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;position:relative}
.avatar img{width:42px;height:42px;border-radius:50%;object-fit:cover}
.online-dot{position:absolute;bottom:1px;right:1px;width:10px;height:10px;border-radius:50%;background:#22c55e;border:2px solid var(--color-background-primary)}
.row.active .online-dot{border-color:#E6F1FB}
.info{flex:1;min-width:0}
.top-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.name{font-size:14px;font-weight:500;color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.time{font-size:11px;color:var(--color-text-tertiary);white-space:nowrap;flex-shrink:0}
.bottom-row{display:flex;justify-content:space-between;align-items:center}
.preview{font-size:12px;color:var(--color-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.preview.unread-preview{color:var(--color-text-primary);font-weight:500}
.badge{background:#E24B4A;color:#fff;font-size:10px;font-weight:500;border-radius:10px;padding:1px 6px;min-width:18px;text-align:center;flex-shrink:0}
.muted-icon{font-size:13px;color:var(--color-text-tertiary)}
.delivered{font-size:13px;color:#378ADD}
.main{flex:1;display:flex;flex-direction:column}
.chat-header{padding:14px 18px;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;gap:12px}
.chat-header .avatar{width:36px;height:36px;min-width:36px;font-size:12px}
.chat-header-info .name{font-size:15px;font-weight:500;color:var(--color-text-primary)}
.chat-header-info .status{font-size:12px;color:#22c55e}
.chat-header-actions{margin-left:auto;display:flex;gap:4px}
.messages{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-thumb{background:var(--color-border-secondary);border-radius:4px}
.msg{max-width:70%;padding:9px 13px;font-size:13px;line-height:1.5}
.msg.them{background:var(--color-background-secondary);border-radius:0 var(--border-radius-lg) var(--border-radius-lg) var(--border-radius-lg);color:var(--color-text-primary);align-self:flex-start}
.msg.me{background:#378ADD;border-radius:var(--border-radius-lg) var(--border-radius-lg) 0 var(--border-radius-lg);color:#fff;align-self:flex-end}
.msg-time{font-size:10px;margin-top:3px;opacity:0.65;text-align:right}
.msg.them .msg-time{text-align:left}
.composer{padding:12px 14px;border-top:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;gap:10px}
.composer input{flex:1;padding:9px 14px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);font-size:13px;color:var(--color-text-primary);outline:none}
.send-btn{width:36px;height:36px;border-radius:50%;background:#378ADD;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0}
.send-btn:hover{background:#185FA5}
.ctx-menu{position:fixed;z-index:99;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);box-shadow:0 4px 16px rgba(0,0,0,0.12);min-width:160px;display:none;overflow:hidden}
.ctx-menu.show{display:block}
.ctx-item{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:13px;color:var(--color-text-primary);cursor:pointer;border:none;background:none;width:100%;text-align:left}
.ctx-item:hover{background:var(--color-background-secondary)}
.ctx-item.danger{color:var(--color-text-danger)}
.ctx-divider{height:0.5px;background:var(--color-border-tertiary);margin:2px 0}
.empty-chat{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:var(--color-text-tertiary);gap:10px;font-size:14px}
.empty-chat i{font-size:40px;opacity:0.4}
</style>

<h2 class="sr-only">Conversation list UI mockup with clickable rows, active state highlighting, and a context menu for conversation actions.</h2>

<div class="shell">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Messages</h2>
      <div class="header-icons">
        <button class="icon-btn" aria-label="Filter"><i class="ti ti-adjustments-horizontal" aria-hidden="true"></i></button>
        <button class="icon-btn" aria-label="New chat"><i class="ti ti-edit" aria-hidden="true"></i></button>
      </div>
    </div>
    <div class="search-wrap">
      <i class="ti ti-search"></i>
      <input type="text" placeholder="Search conversations…" aria-label="Search">
    </div>
    <div class="conv-list" id="convList"></div>
  </div>
  <div class="main" id="mainPanel">
    <div class="empty-chat" id="emptyState">
      <i class="ti ti-message-circle" aria-hidden="true"></i>
      <span>Select a conversation</span>
    </div>
  </div>
</div>

<div class="ctx-menu" id="ctxMenu" role="menu" aria-label="Conversation actions">
  <button class="ctx-item" id="ctxMute" role="menuitem"><i class="ti ti-bell-off" aria-hidden="true"></i> Mute</button>
  <button class="ctx-item" role="menuitem"><i class="ti ti-archive" aria-hidden="true"></i> Archive</button>
  <button class="ctx-item" role="menuitem"><i class="ti ti-pin" aria-hidden="true"></i> Pin</button>
  <div class="ctx-divider"></div>
  <button class="ctx-item danger" id="ctxDelete" role="menuitem"><i class="ti ti-trash" aria-hidden="true"></i> Delete</button>
</div>

<script>
const convos = [
  {id:1, name:'Aria Patel', initials:'AP', color:'#E6F1FB', textColor:'#0C447C', online:true, unread:3, muted:false, time:'9:41 AM', preview:'Sure, let me check the design files', messages:[{me:false,text:'Hey! Are you free for a quick call?',time:'9:38 AM'},{me:true,text:'Give me 5 mins, finishing something up',time:'9:39 AM'},{me:false,text:'Sure, let me check the design files',time:'9:41 AM'}]},
  {id:2, name:'Dev Team', initials:'DT', color:'#EAF3DE', textColor:'#3B6D11', online:false, unread:12, muted:false, time:'9:22 AM', preview:'PR #47 is ready for review', messages:[{me:false,text:'Just pushed the auth changes',time:'9:18 AM'},{me:false,text:'PR #47 is ready for review',time:'9:22 AM'},{me:true,text:'On it 👍',time:'9:23 AM'}]},
  {id:3, name:'Marcus Reid', initials:'MR', color:'#FAEEDA', textColor:'#633806', online:true, unread:0, muted:false, time:'Yesterday', preview:'Thanks for sending that over!', messages:[{me:true,text:'Here\'s the invoice you requested',time:'Yesterday'},{me:false,text:'Thanks for sending that over!',time:'Yesterday'}]},
  {id:4, name:'Lena Kovač', initials:'LK', color:'#FBEAF0', textColor:'#72243E', online:false, unread:0, muted:true, time:'Mon', preview:'See you at the standup', messages:[{me:false,text:'Are you joining the meeting?',time:'Mon'},{me:true,text:'Yes, 10 mins late though',time:'Mon'},{me:false,text:'See you at the standup',time:'Mon'}]},
  {id:5, name:'Jasper Ng', initials:'JN', color:'#EEEDFE', textColor:'#3C3489', online:false, unread:1, muted:false, time:'Sun', preview:'Did you see the match last night?', messages:[{me:false,text:'Did you see the match last night?',time:'Sun'}]},
  {id:6, name:'Sara & Tom', initials:'ST', color:'#FAECE7', textColor:'#993C1D', online:false, unread:0, muted:false, time:'Fri', preview:'You: Sounds like a plan 🎉', messages:[{me:true,text:'Let\'s meet Saturday at noon',time:'Fri'},{me:false,text:'Works for me!',time:'Fri'},{me:true,text:'Sounds like a plan 🎉',time:'Fri'}]},
];

let activeId = null;
let longPressTimer = null;
let ctxTargetId = null;

function renderList(filter=''){
  const list = document.getElementById('convList');
  list.innerHTML = '';
  convos.filter(c=>c.name.toLowerCase().includes(filter.toLowerCase())).forEach(c=>{
    const row = document.createElement('div');
    row.className = 'row'+(activeId===c.id?' active':'');
    row.dataset.id = c.id;
    row.setAttribute('role','button');
    row.setAttribute('tabindex','0');
    row.setAttribute('aria-label', c.name+', '+c.preview);
    row.innerHTML = `
      <div class="avatar" style="background:${c.color};color:${c.textColor}">
        ${c.initials}
        ${c.online?'<span class="online-dot"></span>':''}
      </div>
      <div class="info">
        <div class="top-row">
          <span class="name">${c.name}</span>
          <span class="time">${c.time}</span>
        </div>
        <div class="bottom-row">
          <span class="preview${c.unread>0?' unread-preview':''}">${c.preview}</span>
          <span style="display:flex;align-items:center;gap:4px">
            ${c.muted?'<i class="ti ti-bell-off muted-icon" aria-hidden="true"></i>':''}
            ${c.unread>0?`<span class="badge" aria-label="${c.unread} unread">${c.unread}</span>`:''}
          </span>
        </div>
      </div>`;
    row.addEventListener('click',()=>openConvo(c.id));
    row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')openConvo(c.id)});
    row.addEventListener('mousedown',e=>startLongPress(e,c.id));
    row.addEventListener('mouseup',cancelLongPress);
    row.addEventListener('mouseleave',cancelLongPress);
    row.addEventListener('touchstart',e=>startLongPress(e,c.id),{passive:true});
    row.addEventListener('touchend',cancelLongPress);
    list.appendChild(row);
  });
}

function startLongPress(e,id){
  longPressTimer = setTimeout(()=>showCtxMenu(e,id),600);
}
function cancelLongPress(){
  clearTimeout(longPressTimer);
}
function showCtxMenu(e,id){
  ctxTargetId = id;
  const menu = document.getElementById('ctxMenu');
  const c = convos.find(x=>x.id===id);
  document.getElementById('ctxMute').innerHTML = `<i class="ti ti-${c.muted?'bell':'bell-off'}" aria-hidden="true"></i> ${c.muted?'Unmute':'Mute'}`;
  const x = Math.min((e.clientX||e.touches?.[0]?.clientX||100), window.innerWidth-170);
  const y = Math.min((e.clientY||e.touches?.[0]?.clientY||100), window.innerHeight-160);
  menu.style.left = x+'px';
  menu.style.top = y+'px';
  menu.classList.add('show');
}
document.addEventListener('click',e=>{
  if(!document.getElementById('ctxMenu').contains(e.target)){
    document.getElementById('ctxMenu').classList.remove('show');
  }
});
document.getElementById('ctxMute').addEventListener('click',()=>{
  if(ctxTargetId){const c=convos.find(x=>x.id===ctxTargetId);c.muted=!c.muted;renderList();}
  document.getElementById('ctxMenu').classList.remove('show');
});
document.getElementById('ctxDelete').addEventListener('click',()=>{
  if(ctxTargetId){
    const idx=convos.findIndex(x=>x.id===ctxTargetId);
    if(idx>-1)convos.splice(idx,1);
    if(activeId===ctxTargetId){activeId=null;renderMain(null);}
    renderList();
  }
  document.getElementById('ctxMenu').classList.remove('show');
});

function openConvo(id){
  const c = convos.find(x=>x.id===id);
  if(!c) return;
  c.unread = 0;
  activeId = id;
  renderList();
  renderMain(c);
}

function renderMain(c){
  const panel = document.getElementById('mainPanel');
  if(!c){
    panel.innerHTML = '<div class="empty-chat" id="emptyState"><i class="ti ti-message-circle" aria-hidden="true"></i><span>Select a conversation</span></div>';
    return;
  }
  panel.innerHTML = `
    <div class="chat-header">
      <div class="avatar" style="background:${c.color};color:${c.textColor}">${c.initials}</div>
      <div class="chat-header-info">
        <div class="name">${c.name}</div>
        <div class="status">${c.online?'● Online':'Last seen recently'}</div>
      </div>
      <div class="chat-header-actions">
        <button class="icon-btn" aria-label="Voice call"><i class="ti ti-phone" aria-hidden="true"></i></button>
        <button class="icon-btn" aria-label="Video call"><i class="ti ti-video" aria-hidden="true"></i></button>
        <button class="icon-btn" aria-label="More options"><i class="ti ti-dots-vertical" aria-hidden="true"></i></button>
      </div>
    </div>
    <div class="messages" id="msgArea">
      ${c.messages.map(m=>`<div class="msg ${m.me?'me':'them'}"><div>${m.text}</div><div class="msg-time">${m.time}${m.me?' <i class="ti ti-checks delivered" aria-hidden="true"></i>':''}</div></div>`).join('')}
    </div>
    <div class="composer">
      <button class="icon-btn" aria-label="Attach"><i class="ti ti-paperclip" aria-hidden="true"></i></button>
      <input type="text" id="msgInput" placeholder="Type a message…" aria-label="Message input">
      <button class="send-btn" id="sendBtn" aria-label="Send"><i class="ti ti-send" aria-hidden="true"></i></button>
    </div>`;
  document.getElementById('sendBtn').addEventListener('click',()=>sendMsg(c));
  document.getElementById('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg(c)});
}

function sendMsg(c){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text) return;
  c.messages.push({me:true,text,time:'Just now'});
  c.preview = 'You: '+text;
  c.time = 'Just now';
  input.value='';
  renderMain(c);
  renderList();
  const area = document.getElementById('msgArea');
  if(area) area.scrollTop = area.scrollHeight;
}

document.querySelector('.search-wrap input').addEventListener('input',e=>renderList(e.target.value));
renderList();
openConvo(1);
</script>
