
<style>
  @keyframes flicker {
    0%,100%{opacity:1} 50%{opacity:.92}
  }
  @keyframes grain {
    0%,100%{transform:translate(0,0)} 10%{transform:translate(-1%,-1%)} 20%{transform:translate(1%,1%)} 30%{transform:translate(-2%,0)} 40%{transform:translate(2%,-1%)} 50%{transform:translate(-1%,2%)} 60%{transform:translate(1%,-2%)} 70%{transform:translate(-2%,1%)} 80%{transform:translate(2%,0)} 90%{transform:translate(0,2%)}
  }
  @keyframes scanline {
    0%{transform:translateY(-100%)} 100%{transform:translateY(100vh)}
  }
  @keyframes signalpulse {
    0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)} 50%{box-shadow:0 0 40px 10px rgba(255,255,255,0.06)}
  }
</style>

<div style="position:relative;width:100%;min-height:520px;overflow:hidden;background:#0a0a0a;border-radius:8px;">

  <div id="noiseCanvas" style="position:absolute;inset:0;z-index:1;"></div>

  <div style="position:absolute;inset:0;z-index:2;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.18) 0px,rgba(0,0,0,0.18) 1px,transparent 1px,transparent 3px);pointer-events:none;animation:scanline 6s linear infinite;height:200%;"></div>

  <div style="position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;animation:flicker 4s ease-in-out infinite;">
    <div style="position:relative;background:rgba(8,8,8,0.92);border:1px solid rgba(255,255,255,0.12);border-radius:4px;padding:2.5rem 3rem;max-width:320px;text-align:center;animation:signalpulse 5s ease-in-out infinite;backdrop-filter:none;">
      <div style="position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:40px;height:2px;background:#e8e8e8;"></div>
      <p style="font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:rgba(255,255,255,0.35);margin:0 0 1.2rem;font-family:monospace;">SIGNAL RECEIVED</p>
      <p style="font-size:22px;font-weight:500;color:#f0f0f0;margin:0 0 1rem;line-height:1.4;font-family:var(--font-sans);">The message matters because of the chaos surrounding it.</p>
      <div style="width:24px;height:1px;background:rgba(255,255,255,0.2);margin:1.2rem auto 0;"></div>
      <p style="font-size:11px;color:rgba(255,255,255,0.3);margin:1rem 0 0;font-family:monospace;letter-spacing:0.1em;">37.4 MHz — CARRIER LOCK</p>
    </div>
  </div>

  <div style="position:absolute;bottom:16px;right:20px;z-index:4;font-size:10px;font-family:monospace;color:rgba(255,255,255,0.18);letter-spacing:0.15em;">SNR: 0.3 dB</div>
  <div style="position:absolute;bottom:16px;left:20px;z-index:4;font-size:10px;font-family:monospace;color:rgba(255,255,255,0.18);letter-spacing:0.15em;">RX ████░░░░░░</div>
</div>

<canvas id="grain" style="display:none"></canvas>

<script>
(function(){
  const container = document.getElementById('noiseCanvas');
  const W = 700, H = 520;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  canvas.style.cssText = 'width:100%;height:100%;image-rendering:pixelated;opacity:0.85;';
  container.appendChild(canvas);
  const ctx = canvas.getContext('2d');

  const COLS = 120, ROWS = 90;
  const cw = W/COLS, ch = H/ROWS;

  const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノ░▒▓█▄▀■□▪▫◆◇○●∇∆∫∑≈≠∞÷×±';

  function rand(min,max){return Math.random()*(max-min)+min;}

  const grid = [];
  for(let r=0;r<ROWS;r++){
    grid[r]=[];
    for(let c=0;c<COLS;c++){
      grid[r][c]={
        ch: chars[Math.floor(Math.random()*chars.length)],
        opacity: Math.random(),
        color: Math.random()<0.05 ? '#ff3' : Math.random()<0.03 ? '#4af' : '#fff',
        size: rand(7,11)
      };
    }
  }

  const CX = COLS/2, CY = ROWS/2;
  const sigR = 12, sigC = 18;

  function inSignal(r,c){
    const dr=(r-CY)/sigR, dc=(c-CX)/sigC;
    return dr*dr+dc*dc<1;
  }

  function drawFrame(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#080808';
    ctx.fillRect(0,0,W,H);

    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        const cell = grid[r][c];
        if(inSignal(r,c)) continue;

        if(Math.random()<0.12){
          cell.ch = chars[Math.floor(Math.random()*chars.length)];
          cell.opacity = Math.random();
        }

        const distFromCenter = Math.sqrt(Math.pow((r-CY)/sigR,2)+Math.pow((c-CX)/sigC,2));
        const boost = distFromCenter < 1.8 ? Math.max(0,(1.8-distFromCenter)/0.8)*0.5 : 0;

        ctx.globalAlpha = Math.min(1, cell.opacity + boost);
        ctx.fillStyle = cell.color;
        ctx.font = `${cell.size}px monospace`;
        ctx.fillText(cell.ch, c*cw, r*ch + ch*0.8);
      }
    }

    ctx.globalAlpha = 1;

    const grd = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.min(W,H)*0.22);
    grd.addColorStop(0,'rgba(8,8,8,0.95)');
    grd.addColorStop(0.6,'rgba(8,8,8,0.7)');
    grd.addColorStop(1,'rgba(8,8,8,0)');
    ctx.fillStyle=grd;
    ctx.fillRect(0,0,W,H);
  }

  let frame=0;
  function loop(){
    frame++;
    drawFrame();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
