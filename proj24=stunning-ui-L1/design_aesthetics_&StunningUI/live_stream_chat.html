<style>
*{box-sizing:border-box;margin:0;padding:0}
.shell{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;display:flex;flex-direction:column;height:560px;width:100%;max-width:400px;margin:0 auto;font-family:var(--font-sans)}
.header{background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.channel{display:flex;align-items:center;gap:8px}
.live-dot{width:8px;height:8px;border-radius:50%;background:#e24b4a;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.live-label{font-size:11px;font-weight:500;color:#e24b4a;letter-spacing:.04em}
.channel-name{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.viewer-count{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--color-text-secondary)}
.messages{flex:1;overflow-y:auto;padding:8px 0;scroll-behavior:smooth}
.messages::-webkit-scrollbar{width:3px}
.messages::-webkit-scrollbar-thumb{background:var(--color-border-secondary);border-radius:2px}
.msg{padding:5px 12px 5px 10px;font-size:13px;line-height:1.45;cursor:pointer;position:relative;transition:background .15s;display:flex;align-items:flex-start;gap:0;animation:slideIn .22s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg.flash{animation:slideIn .22s ease-out, flashBg .6s ease-out}
@keyframes flashBg{0%{background:rgba(55,138,221,0.15)}100%{background:transparent}}
.msg:hover{background:var(--color-background-secondary)}
.msg:hover .msg-actions{opacity:1}
.msg-body{flex:1;min-width:0}
.badges{display:inline-flex;gap:3px;margin-right:4px;vertical-align:middle}
.badge{font-size:10px;font-weight:500;padding:1px 5px;border-radius:4px;letter-spacing:.02em}
.badge.mod{background:#0f6e56;color:#9fe1cb}
.badge.vip{background:#533ab7;color:#cecbf6}
.badge.sub{background:#185fa5;color:#b5d4f4}
.badge.owner{background:#854f0b;color:#fac775}
.username{font-weight:500;font-size:13px;margin-right:4px;cursor:pointer}
.username:hover{text-decoration:underline}
.msg-text{color:var(--color-text-primary);word-break:break-word}
.emote{display:inline-block;width:20px;height:20px;border-radius:2px;vertical-align:middle;margin:0 1px;font-size:16px;text-align:center;line-height:20px}
.msg-actions{opacity:0;display:flex;align-items:center;gap:6px;margin-top:3px;transition:opacity .15s}
.msg-action-btn{font-size:11px;color:var(--color-text-secondary);background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:4px;padding:2px 7px;cursor:pointer;transition:background .12s}
.msg-action-btn:hover{background:var(--color-background-tertiary)}
.timestamp{font-size:10px;color:var(--color-text-tertiary);margin-right:6px}
.input-row{border-top:0.5px solid var(--color-border-tertiary);padding:10px 12px;display:flex;gap:8px;flex-shrink:0;background:var(--color-background-primary);align-items:center}
.chat-input{flex:1;font-size:13px;padding:7px 10px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);outline:none;transition:border .15s}
.chat-input:focus{border-color:var(--color-border-primary);box-shadow:0 0 0 2px rgba(55,138,221,.12)}
.send-btn{background:var(--color-background-info);color:var(--color-text-info);border:none;border-radius:var(--border-radius-md);padding:7px 12px;font-size:13px;font-weight:500;cursor:pointer;transition:opacity .12s;display:flex;align-items:center;gap:4px}
.send-btn:hover{opacity:.85}
.send-btn:active{transform:scale(.97)}
.emote-btn{background:none;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:6px 8px;cursor:pointer;font-size:14px;color:var(--color-text-secondary);transition:background .12s}
.emote-btn:hover{background:var(--color-background-secondary)}
.emote-picker{display:none;position:absolute;bottom:52px;left:12px;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:8px;display:none;flex-wrap:wrap;gap:6px;width:200px;z-index:10}
.emote-picker.open{display:flex}
.ep-emote{font-size:20px;cursor:pointer;padding:3px;border-radius:4px;transition:background .12s}
.ep-emote:hover{background:var(--color-background-secondary)}
.sys-msg{padding:4px 12px;font-size:11px;color:var(--color-text-tertiary);text-align:center}
.own-msg .msg-body .username{color:#185fa5}
.paused-notice{display:none;text-align:center;padding:6px;font-size:11px;color:var(--color-text-tertiary);background:var(--color-background-secondary);cursor:pointer}
.paused-notice.show{display:block}
</style>

<div style="padding:1rem 0">
<h2 class="sr-only">Live stream chat widget — real-time scrolling chat with badges, emotes, and viewer count</h2>
<div class="shell" id="chatShell">
  <div class="header">
    <div class="channel">
      <div class="live-dot"></div>
      <span class="live-label">LIVE</span>
      <span class="channel-name">StreamChannel</span>
    </div>
    <div class="viewer-count"><i class="ti ti-eye" aria-hidden="true" style="font-size:14px"></i><span id="viewerCount">4,218</span></div>
  </div>
  <div class="messages" id="msgList"></div>
  <div class="paused-notice" id="pausedNotice" onclick="resumeScroll()"><i class="ti ti-arrow-down" aria-hidden="true"></i> new messages — click to resume</div>
  <div class="input-row" style="position:relative">
    <div class="emote-picker" id="emotePicker">
      <span class="ep-emote" title="Pog" onclick="insertEmote('pog')">😮</span>
      <span class="ep-emote" title="LUL" onclick="insertEmote('lul')">😂</span>
      <span class="ep-emote" title="PogChamp" onclick="insertEmote('pogchamp')">😤</span>
      <span class="ep-emote" title="Clap" onclick="insertEmote('clap')">👏</span>
      <span class="ep-emote" title="catJAM" onclick="insertEmote('catjam')">🐱</span>
      <span class="ep-emote" title="KEKW" onclick="insertEmote('kekw')">🤣</span>
      <span class="ep-emote" title="5Head" onclick="insertEmote('5head')">🧠</span>
      <span class="ep-emote" title="Sadge" onclick="insertEmote('sadge')">😢</span>
      <span class="ep-emote" title="HeyGuys" onclick="insertEmote('heyguys')">👋</span>
    </div>
    <button class="emote-btn" id="emoteToggle" onclick="togglePicker()" title="Emotes" aria-label="Open emote picker"><i class="ti ti-mood-happy" aria-hidden="true"></i></button>
    <input class="chat-input" id="chatInput" type="text" placeholder="Send a message…" maxlength="200" autocomplete="off" />
    <button class="send-btn" onclick="sendMessage()" aria-label="Send"><i class="ti ti-send" aria-hidden="true" style="font-size:14px"></i></button>
  </div>
</div>
</div>

<script>
const emoteMap={pog:'😮',lul:'😂',pogchamp:'😤',clap:'👏',catjam:'🐱',kekw:'🤣','5head':'🧠',sadge:'😢',heyguys:'👋'};
const emoteRegex=/:(pog|lul|pogchamp|clap|catjam|kekw|5head|sadge|heyguys):/gi;

const users=[
  {name:'xXDarkSlayerXx',badges:['sub'],color:'#639922'},
  {name:'ProGamer99',badges:['mod'],color:'#185fa5'},
  {name:'CutieStreamer',badges:['vip','sub'],color:'#993556'},
  {name:'LeetCoder',badges:['sub'],color:'#533ab7'},
  {name:'NightOwl_42',badges:[],color:'#5f5e5a'},
  {name:'StreamQueen',badges:['vip'],color:'#993c1d'},
  {name:'GigaChad_IRL',badges:[],color:'#3b6d11'},
  {name:'SpeedrunGod',badges:['mod','sub'],color:'#0f6e56'},
  {name:'ChillVibes',badges:['sub'],color:'#854f0b'},
  {name:'JustPassingBy',badges:[],color:'#5f5e5a'},
];

const msgs=[
  'LETS GOOO :pogchamp:',
  'this is insane :kekw:',
  'what a play :clap: :clap:',
  ':pog: I cant believe it',
  'hi chat :heyguys:',
  'first time here, loving it!',
  'POG POG POG',
  'KEKW chat is wild today',
  'how long has stream been live?',
  ':lul: that was so funny',
  'this game is cracked',
  'W stream as always',
  'bro is goated :5head:',
  'noooo :sadge: why',
  ':catjam: music is fire',
  'clip that!!',
  'let him cook :5head:',
  'sub hype!!! :clap:',
  'first sub on this channel',
  'can you play the other map?',
];

let viewerBase=4218,msgCount=0,isUserScrolling=false,pendingCount=0;
const list=document.getElementById('msgList');
const notice=document.getElementById('pausedNotice');
const input=document.getElementById('chatInput');

function renderBadges(badges){
  if(!badges.length)return'';
  return'<span class="badges">'+badges.map(b=>`<span class="badge ${b}">${b.toUpperCase()}</span>`).join('')+'</span>';
}

function renderText(text){
  return text.replace(emoteRegex,(m,name)=>{
    const e=emoteMap[name.toLowerCase()]||'';
    return`<span class="emote" title=":${name}:">${e}</span>`;
  });
}

function addMsg(user,text,isOwn=false){
  const now=new Date();
  const ts=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  const div=document.createElement('div');
  div.className='msg flash'+(isOwn?' own-msg':'');
  div.innerHTML=`<div class="msg-body"><span class="timestamp">${ts}</span>${renderBadges(user.badges)}<span class="username" style="color:${user.color}">${user.name}</span><span class="msg-text"> ${renderText(text)}</span><div class="msg-actions"><button class="msg-action-btn">↩ Reply</button><button class="msg-action-btn" style="color:var(--color-text-danger)">⚑ Report</button></div></div>`;
  
  const atBottom=list.scrollHeight-list.scrollTop-list.clientHeight<60;
  list.appendChild(div);
  msgCount++;
  if(msgCount>120){list.removeChild(list.firstChild);}
  
  if(atBottom&&!isUserScrolling){
    list.scrollTop=list.scrollHeight;
    pendingCount=0;
    notice.classList.remove('show');
  } else {
    pendingCount++;
    notice.textContent=`▼ ${pendingCount} new message${pendingCount>1?'s':''} — click to resume`;
    notice.classList.add('show');
  }
}

function addSysMsg(text){
  const div=document.createElement('div');
  div.className='sys-msg';
  div.textContent=text;
  list.appendChild(div);
  list.scrollTop=list.scrollHeight;
}

list.addEventListener('scroll',()=>{
  const atBottom=list.scrollHeight-list.scrollTop-list.clientHeight<60;
  if(atBottom){isUserScrolling=false;pendingCount=0;notice.classList.remove('show');}
  else{isUserScrolling=true;}
});

function resumeScroll(){
  isUserScrolling=false;
  list.scrollTop=list.scrollHeight;
  pendingCount=0;
  notice.classList.remove('show');
}

function sendMessage(){
  const v=input.value.trim();
  if(!v)return;
  const me={name:'You',badges:[],color:'#185fa5'};
  addMsg(me,v,true);
  input.value='';
  document.getElementById('emotePicker').classList.remove('open');
}

input.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage();});

function insertEmote(name){
  input.value+=(input.value&&!input.value.endsWith(' ')?'':'')+`:${name}: `;
  input.focus();
}

function togglePicker(){
  document.getElementById('emotePicker').classList.toggle('open');
}

document.addEventListener('click',e=>{
  const picker=document.getElementById('emotePicker');
  const btn=document.getElementById('emoteToggle');
  if(!picker.contains(e.target)&&!btn.contains(e.target))picker.classList.remove('open');
});

function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function randItem(arr){return arr[Math.floor(Math.random()*arr.length)];}

function simulateChat(){
  const user=randItem(users);
  const text=randItem(msgs);
  addMsg(user,text);
}

function updateViewers(){
  viewerBase+=randInt(-15,20);
  if(viewerBase<3800)viewerBase=3800;
  document.getElementById('viewerCount').textContent=viewerBase.toLocaleString();
}

for(let i=0;i<8;i++){
  const user=randItem(users);
  const text=randItem(msgs);
  const div=document.createElement('div');
  const now=new Date(Date.now()-randInt(10,300)*1000);
  const ts=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  div.className='msg';
  div.innerHTML=`<div class="msg-body"><span class="timestamp">${ts}</span>${renderBadges(user.badges)}<span class="username" style="color:${user.color}">${user.name}</span><span class="msg-text"> ${renderText(text)}</span><div class="msg-actions"><button class="msg-action-btn">↩ Reply</button><button class="msg-action-btn" style="color:var(--color-text-danger)">⚑ Report</button></div></div>`;
  list.appendChild(div);
}
list.scrollTop=list.scrollHeight;
addSysMsg('🎉 xXDarkSlayerXx just subscribed!');

setInterval(simulateChat,randInt(1200,2800));
setInterval(()=>{
  if(Math.random()<.3)simulateChat();
},800);
setInterval(updateViewers,3500);
setInterval(()=>{
  if(Math.random()<.05)addSysMsg('🎉 '+randItem(users).name+' just subscribed!');
},5000);
</script>
