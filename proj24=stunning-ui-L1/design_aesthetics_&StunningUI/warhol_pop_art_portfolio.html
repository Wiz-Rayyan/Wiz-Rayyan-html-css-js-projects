  * { box-sizing: border-box; margin: 0; padding: 0; }

  .dot-label {

    color: #000;

    font-family: 'Anton', Impact, sans-serif;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    border-left: 5px solid #000;
    border-right: 5px solid #000;
  }
  .cell {
    position: relative;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 4px solid #000;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .cell:hover { transform: scale(1.04); z-index: 2; }
  .cell svg { width: 100%; height: 100%; display: block; }
  .cell-label {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: #000;
    color: #fff;
    font-family: 'Anton', Impact, sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    text-align: center;
    padding: 4px 2px 3px;
    text-transform: uppercase;
  }
  .speech-section {
    background: #fff;
    border: 5px solid #000;
    border-top: none;
    padding: 18px 20px;
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  .speech-bubble {
    background: #fff;
    border: 4px solid #000;
    border-radius: 12px;
    padding: 12px 16px;
    flex: 1;
    position: relative;
    font-family: 'Anton', Impact, sans-serif;
    font-size: 20px;
    letter-spacing: 1px;
    line-height: 1.3;
    color: #000;
  }
  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -18px;
    left: 30px;
    border: 10px solid transparent;
    border-top-color: #000;
  }
  .speech-bubble .inner::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 32px;
    border: 8px solid transparent;
    border-top-color: #fff;
  }
  .speech-bubble .inner { position: relative; display: block; }
  .tag-row {
    display: flex;
    gap: 0;
    border-top: 5px solid #000;
    border-left: 5px solid #000;
    border-right: 5px solid #000;
  }
  .tag {
    flex: 1;
    background: #ff0090;
    color: #fff200;
    font-family: 'Anton', Impact, sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    text-align: center;
    padding: 10px 4px;
    border-right: 4px solid #000;
    text-transform: uppercase;
  }
  .tag:last-child { border-right: none; background: #00b7ff; color: #000; }
  .tag:nth-child(3) { background: #ff6600; color: #fff; }
  .tag:nth-child(2) { background: #000; color: #fff200; }
  .footer {
