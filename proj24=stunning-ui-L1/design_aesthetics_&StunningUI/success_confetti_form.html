<h2 class="sr-only">A signup form that, on submit, morphs into a success card with a confetti burst and animated checkmark, with a dismiss option to reset.</h2>
<div style="position: relative; max-width: 380px; margin: 0 auto; min-height: 320px;">
  <canvas id="confetti-canvas" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5;"></canvas>

  <form id="signup-form" style="background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 12px; padding: 1.5rem; transition: transform 0.3s var(--ease-out, ease), opacity 0.3s ease;">
    <h3 style="margin: 0 0 4px;">Create your account</h3>
    <p style="font-size: 13px; color: var(--text-secondary); margin: 0 0 1.25rem;">Join in a few seconds.</p>

    <label style="font-size: 13px; color: var(--text-secondary); display: block; margin-bottom: 4px;">Name</label>
    <input id="f-name" type="text" placeholder="Ada Lovelace" style="width: 100%; margin-bottom: 12px; box-sizing: border-box;" />

    <label style="font-size: 13px; color: var(--text-secondary); display: block; margin-bottom: 4px;">Email</label>
    <input id="f-email" type="email" placeholder="ada@example.com" style="width: 100%; margin-bottom: 20px; box-sizing: border-box;" />

    <button type="submit" style="width: 100%; background: var(--fill-accent, var(--text-accent)); color: var(--on-accent, white); border: none;">Sign up</button>
  </form>

  <div id="success-card" style="display: none; position: absolute; inset: 0; background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 12px; padding: 2rem 1.5rem; flex-direction: column; align-items: center; text-align: center; transform: scale(0); transition: transform 0.35s var(--ease-out, ease);">
    <svg id="checkmark-svg" width="64" height="64" viewBox="0 0 64 64" style="margin-bottom: 1rem; transform: scale(0); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);">
      <circle cx="32" cy="32" r="30" class="c-green" fill="var(--bg-success)" stroke="var(--border-success)" stroke-width="2"/>
      <path d="M20 33 L28 41 L44 24" fill="none" stroke="var(--text-success)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="40" stroke-dashoffset="40" id="check-path"/>
    </svg>
    <div id="success-text" style="opacity: 0; transform: translateY(20px); transition: opacity 0.35s ease, transform 0.35s ease;">
      <h3 style="margin: 0 0 4px;">You're all set</h3>
      <p style="font-size: 14px; color: var(--text-secondary); margin: 0 0 1.25rem;">Welcome aboard. Check your inbox to confirm.</p>
      <button id="dismiss-btn" type="button" style="padding: 8px 20px;">Dismiss</button>
    </div>
  </div>
</div>

<script>
(function() {
  const form = document.getElementById('signup-form');
  const successCard = document.getElementById('success-card');
  const checkmarkSvg = document.getElementById('checkmark-svg');
  const checkPath = document.getElementById('check-path');
  const successText = document.getElementById('success-text');
  const dismissBtn = document.getElementById('dismiss-btn');
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const colors = ['#7F77DD', '#1D9E75', '#D85A30', '#D4537E', '#378ADD', '#EF9F27'];
  let particles = [];
  let animId = null;

  function burstConfetti() {
    particles = [];
    const cx = canvas.width / 2;
    const cy = canvas.height * 0.25;
    for (let i = 0; i < 120; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 6;
      particles.push({
        x: cx,
        y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        gravity: 0.15 + Math.random() * 0.08,
        size: 4 + Math.random() * 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 10,
        life: 1,
        decay: 0.006 + Math.random() * 0.006
      });
    }
    if (!animId) animate();
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    for (const p of particles) {
      if (p.life <= 0) continue;
      alive = true;
      p.vy += p.gravity;
      p.x += p.vx;
      p.y += p.vy;
      p.rotation += p.rotSpeed;
      p.life -= p.decay;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      ctx.restore();
    }
    if (alive) {
      animId = requestAnimationFrame(animate);
    } else {
      animId = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    form.style.transform = 'scale(0.95)';
    form.style.opacity = '0';

    setTimeout(function() {
      form.style.display = 'none';
      successCard.style.display = 'flex';
      requestAnimationFrame(function() {
        successCard.style.transform = 'scale(1)';
      });
      burstConfetti();

      setTimeout(function() {
        checkmarkSvg.style.transform = 'scale(1.2)';
        checkPath.style.transition = 'stroke-dashoffset 0.3s ease 0.1s';
        checkPath.style.strokeDashoffset = '0';
        setTimeout(function() {
          checkmarkSvg.style.transform = 'scale(1)';
        }, 180);
      }, 100);

      setTimeout(function() {
        successText.style.opacity = '1';
        successText.style.transform = 'translateY(0)';
      }, 350);
    }, 300);
  });

  dismissBtn.addEventListener('click', function() {
    successCard.style.transform = 'scale(0)';
    setTimeout(function() {
      successCard.style.display = 'none';
      form.style.display = 'block';
      form.reset();
      checkmarkSvg.style.transform = 'scale(0)';
      checkPath.style.transition = 'none';
      checkPath.style.strokeDashoffset = '40';
      successText.style.opacity = '0';
      successText.style.transform = 'translateY(20px)';
      requestAnimationFrame(function() {
        form.style.transform = 'scale(1)';
        form.style.opacity = '1';
      });
    }, 350);
  });
})();
</script>
