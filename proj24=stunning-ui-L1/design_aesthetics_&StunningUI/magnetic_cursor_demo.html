<div style="min-height:520px;padding:2rem;position:relative;overflow:hidden;" id="demo-root">
  <h2 class="sr-only">Interactive magnetic cursor demo — move your mouse around the preview area to see the custom cursor effect</h2>

  <div id="cursor-dot" style="position:fixed;width:8px;height:8px;border-radius:50%;background:#00d4ff;pointer-events:none;transform:translate(-50%,-50%);transition:width 0.2s,height 0.2s,background 0.2s,opacity 0.2s;z-index:9999;opacity:0;mix-blend-mode:normal;"></div>
  <div id="cursor-ring" style="position:fixed;width:32px;height:32px;border-radius:50%;border:1.5px solid rgba(0,212,255,0.5);pointer-events:none;transform:translate(-50%,-50%);transition:width 0.25s,height 0.25s,border-color 0.2s,opacity 0.2s;z-index:9998;opacity:0;"></div>

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;">
    <div>
      <p style="font-size:13px;color:var(--color-text-secondary);margin:0;">Move your mouse around — cursor is hidden inside this demo</p>
    </div>
    <div id="state-badge" style="font-size:12px;padding:4px 12px;border-radius:20px;background:var(--color-background-secondary);color:var(--color-text-secondary);border:0.5px solid var(--color-border-tertiary);transition:background 0.2s,color 0.2s;">idle</div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.5rem;">
    <div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem;">
      <p style="font-size:12px;color:var(--color-text-secondary);margin:0 0 4px;">dot size</p>
      <p style="font-size:22px;font-weight:500;margin:0;" id="stat-size">8px</p>
    </div>
    <div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem;">
      <p style="font-size:12px;color:var(--color-text-secondary);margin:0 0 4px;">lag frames</p>
      <p style="font-size:22px;font-weight:500;margin:0;" id="stat-lag">2</p>
    </div>
  </div>

  <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:2rem;" id="interactive-zone">
    <a href="#" onclick="return false;" style="font-size:14px;padding:8px 18px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);color:var(--color-text-primary);text-decoration:none;">Hover me</a>
    <button style="font-size:14px;padding:8px 18px;border-radius:var(--border-radius-md);">Click me</button>
    <a href="#" onclick="return false;" style="font-size:14px;padding:8px 18px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);color:var(--color-text-primary);text-decoration:none;">Another link</a>
    <button style="font-size:14px;padding:8px 18px;border-radius:var(--border-radius-md);">Button</button>
  </div>

  <div style="border-top:0.5px solid var(--color-border-tertiary);padding-top:1.25rem;">
    <p style="font-size:13px;font-weight:500;margin:0 0 10px;color:var(--color-text-secondary);">Lag smoothing</p>
    <div style="display:flex;align-items:center;gap:12px;">
      <input type="range" min="1" max="20" value="10" id="lag-slider" style="flex:1;">
      <span id="lag-val" style="font-size:14px;font-weight:500;min-width:40px;">0.10</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:12px;">
      <label style="font-size:13px;color:var(--color-text-secondary);min-width:80px;">Dot color</label>
      <div style="display:flex;gap:8px;" id="color-picker">
        <div class="cpick" data-c="#00d4ff" style="width:20px;height:20px;border-radius:50%;background:#00d4ff;cursor:pointer;outline:2px solid #00d4ff;outline-offset:2px;"></div>
        <div class="cpick" data-c="#ff6b6b" style="width:20px;height:20px;border-radius:50%;background:#ff6b6b;cursor:pointer;"></div>
        <div class="cpick" data-c="#a78bfa" style="width:20px;height:20px;border-radius:50%;background:#a78bfa;cursor:pointer;"></div>
        <div class="cpick" data-c="#34d399" style="width:20px;height:20px;border-radius:50%;background:#34d399;cursor:pointer;"></div>
        <div class="cpick" data-c="#fbbf24" style="width:20px;height:20px;border-radius:50%;background:#fbbf24;cursor:pointer;"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const dot = document.getElementById('cursor-dot');
  const ring = document.getElementById('cursor-ring');
  const badge = document.getElementById('state-badge');
  const statSize = document.getElementById('stat-size');
  const lagSlider = document.getElementById('lag-slider');
  const lagVal = document.getElementById('lag-val');

  let mx = -200, my = -200;
  let dx = -200, dy = -200;
  let rx = -200, ry = -200;
  let lerpDot = 0.1;
  let lerpRing = 0.06;
  let curColor = '#00d4ff';
  let isHover = false;
  let isClick = false;
  let inside = false;
  let raf;

  lagSlider.addEventListener('input', () => {
    const v = parseInt(lagSlider.value);
    lerpDot = v / 100;
    lagVal.textContent = (v / 100).toFixed(2);
  });

  document.querySelectorAll('.cpick').forEach(el => {
    el.addEventListener('click', () => {
      curColor = el.dataset.c;
      dot.style.background = curColor;
      ring.style.borderColor = curColor + '80';
      document.querySelectorAll('.cpick').forEach(e => { e.style.outline = 'none'; e.style.outlineOffset = '0'; });
      el.style.outline = '2px solid ' + curColor;
      el.style.outlineOffset = '2px';
    });
  });

  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    if (!inside) { dot.style.opacity = '1'; ring.style.opacity = '1'; inside = true; }
  });

  document.addEventListener('mouseleave', () => { inside = false; dot.style.opacity = '0'; ring.style.opacity = '0'; });

  const interactables = document.querySelectorAll('a, button');
  interactables.forEach(el => {
    el.addEventListener('mouseenter', () => {
      isHover = true;
      dot.style.width = '24px'; dot.style.height = '24px';
      dot.style.background = curColor;
      dot.style.opacity = '0.85';
      ring.style.width = '48px'; ring.style.height = '48px';
      ring.style.borderColor = curColor + 'aa';
      badge.textContent = 'hover'; badge.style.background = 'rgba(0,212,255,0.12)'; badge.style.color = curColor;
      statSize.textContent = '24px';
    });
    el.addEventListener('mouseleave', () => {
      isHover = false;
      dot.style.width = '8px'; dot.style.height = '8px';
      dot.style.background = curColor; dot.style.opacity = '1';
      ring.style.width = '32px'; ring.style.height = '32px';
      ring.style.borderColor = curColor + '80';
      badge.textContent = 'idle'; badge.style.background = 'var(--color-background-secondary)'; badge.style.color = 'var(--color-text-secondary)';
      statSize.textContent = '8px';
    });
    el.addEventListener('mousedown', () => {
      isClick = true;
      dot.style.transform = 'translate(-50%,-50%) scale(0.5)';
      badge.textContent = 'click'; badge.style.background = 'rgba(0,212,255,0.2)'; badge.style.color = curColor;
      setTimeout(() => { dot.style.transform = 'translate(-50%,-50%) scale(1)'; isClick = false; }, 180);
    });
    el.style.cursor = 'none';
  });

  function tick() {
    dx += (mx - dx) * lerpDot;
    dy += (my - dy) * lerpDot;
    rx += (mx - rx) * lerpRing;
    ry += (my - ry) * lerpRing;
    if (!isClick) {
      dot.style.left = dx + 'px'; dot.style.top = dy + 'px';
    } else {
      dot.style.left = dx + 'px'; dot.style.top = dy + 'px';
    }
    ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
    raf = requestAnimationFrame(tick);
  }
  tick();
})();
</script>
