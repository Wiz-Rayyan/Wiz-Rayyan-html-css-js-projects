
<style>
  @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Share+Tech+Mono&display=swap');
  .hud{background:#0A0A0A;width:100%;min-height:520px;position:relative;overflow:hidden;font-family:'Russo One',sans-serif;color:#fff;}

  @keyframes scan{0%{top:0}100%{top:100%}}
  .blink{animation:blink 1.2s step-end infinite;}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .killfeed-entry{animation:slidein 0.3s ease;}
  @keyframes slidein{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
  .weapon-wheel{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);opacity:0;transition:opacity 0.2s;z-index:20;}
  .hud:hover .weapon-wheel{opacity:1;}
  .compass-tick{font-family:'Share Tech Mono',monospace;font-size:11px;}
  .obj-marker{position:absolute;font-size:11px;font-family:'Share Tech Mono',monospace;letter-spacing:1px;}

<script>
let hp=72,armor=45,secs=84;
function tick(){
  secs=Math.max(0,secs-1);
  const m=String(Math.floor(secs/60)).padStart(2,'0');
  const s=String(secs%60).padStart(2,'0');
  const el=document.getElementById('round-timer');
  if(el)el.textContent=m+':'+s;
  if(secs===0&&el)el.style.color='#FF3C3C';
}
setInterval(tick,1000);
let heading=42;
function drift(){
  heading=(heading+Math.floor(Math.random()*3)-1+360)%360;
  const h=document.getElementById('compass-heading');
  if(h)h.textContent=String(heading).padStart(3,'0');
}
setInterval(drift,2000);
document.getElementById('hud').addEventListener('click',function(){
  hp=Math.max(10,hp-Math.floor(Math.random()*12+3));
  armor=Math.max(0,armor-Math.floor(Math.random()*8));
  const hb=document.getElementById('hp-bar');
  const hv=document.getElementById('hp-val');
  const ab=document.getElementById('armor-bar');
  const av=document.getElementById('armor-val');
  if(hb)hb.style.width=hp+'%';
  if(hv)hv.textContent=hp;
  if(ab)ab.style.width=armor+'%';
  if(av)av.textContent=armor;
  if(hp<30&&hv)hv.style.animation='blink 0.6s step-end infinite';
});
</script>
