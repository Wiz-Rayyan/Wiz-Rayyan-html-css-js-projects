<style>
*{box-sizing:border-box;margin:0;padding:0}
#root{font-family:var(--font-sans);padding:1rem 0;display:flex;flex-direction:column;gap:12px}
#player-bar{display:flex;align-items:center;gap:12px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px 16px}
#play-btn{width:36px;height:36px;border-radius:50%;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.15s}
#play-btn:hover{background:var(--color-background-tertiary)}
#timeline{flex:1;cursor:pointer}
#time-label{font-size:13px;color:var(--color-text-secondary);min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
#search-bar{display:flex;gap:8px;align-items:center}
#search-input{flex:1;font-size:14px;padding:6px 12px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary)}
#search-input:focus{outline:none;box-shadow:0 0 0 2px rgba(128,90,213,0.25)}
.search-nav-btn{border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);border-radius:var(--border-radius-md);padding:6px 10px;cursor:pointer;font-size:13px;color:var(--color-text-secondary)}
.search-nav-btn:hover{background:var(--color-background-secondary)}
#match-count{font-size:13px;color:var(--color-text-tertiary);min-width:60px}
#transcript{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:20px 24px;max-height:340px;overflow-y:auto;line-height:2;font-size:15px;color:var(--color-text-primary);scroll-behavior:smooth}
.para{margin-bottom:1rem}
.speaker{font-size:12px;font-weight:500;color:var(--color-text-tertiary);display:block;margin-bottom:4px;letter-spacing:0.04em}
.word{cursor:pointer;border-radius:4px;padding:1px 2px;transition:background 0.12s,color 0.12s;display:inline-block}
.word:hover{background:var(--color-background-secondary)}
.word.active{background:linear-gradient(90deg,#f59e0b,#f97316);color:#1a0a00;font-weight:500;animation:none}
.word.pulse{animation:pulse 0.35s ease-out}
.word.match{background:#fef08a;color:#713f12;border-radius:3px}
.word.match-focus{background:#fbbf24;color:#451a03;outline:2px solid #f59e0b;outline-offset:1px}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.22)}100%{transform:scale(1)}}
</style>
<div id="root">
  <h2 class="sr-only">Interactive transcript with word-by-word playback highlighting</h2>

  <div id="player-bar">
    <button id="play-btn" aria-label="Play">
      <i class="ti ti-player-play" style="font-size:16px;color:var(--color-text-primary)" id="play-icon"></i>
    </button>
    <input type="range" id="timeline" min="0" max="100" value="0" step="0.1" aria-label="Playback position">
    <span id="time-label">0:00 / 1:43</span>
  </div>

  <div id="search-bar">
    <input id="search-input" placeholder="Search transcript…" aria-label="Search transcript" />
    <button class="search-nav-btn" id="prev-btn" title="Previous match"><i class="ti ti-arrow-up" aria-hidden="true"></i></button>
    <button class="search-nav-btn" id="next-btn" title="Next match"><i class="ti ti-arrow-down" aria-hidden="true"></i></button>
    <span id="match-count"></span>
  </div>

  <div id="transcript" role="region" aria-live="polite" aria-label="Transcript"></div>
</div>

<script>

    {t:71.5,w:"Stay"},{t:71.9,w:"curious."},{t:72.6,w:"Experiment"},{t:73.2,w:"with"},{t:73.5,w:"AI"},{t:73.8,w:"tools"},{t:74.2,w:"in"},{t:74.4,w:"your"},{t:74.65,w:"own"},{t:74.9,w:"work."},{t:75.6,w:"You"},{t:75.85,w:"don't"},{t:76.2,w:"need"},{t:76.5,w:"to"},{t:76.7,w:"be"},{t:76.9,w:"an"},{t:77.1,w:"engineer"},{t:77.7,w:"to"},{t:77.9,w:"benefit"},{t:78.5,w:"enormously"},{t:79.3,w:"from"},{t:79.6,w:"what's"},{t:80.0,w:"already"},{t:80.6,w:"available."},{t:81.4,w:"The"},{t:81.7,w:"tools"},{t:82.0,w:"are"},{t:82.2,w:"here."},{t:82.9,w:"Use"},{t:83.2,w:"them."},
  ]},
  {speaker:"Host",words:[
    {t:84.2,w:"Perfect"},{t:84.7,w:"note"},{t:85.0,w:"to"},{t:85.2,w:"end"},{t:85.5,w:"on."},{t:86.1,w:"Thank"},{t:86.5,w:"you"},{t:86.7,w:"so"},{t:86.9,w:"much"},{t:87.3,w:"for"},{t:87.5,w:"joining"},{t:88.1,w:"us"},{t:88.4,w:"today."},
  ]},
];

const DURATION = 89;

const transcript = document.getElementById('transcript');
const timelineEl = document.getElementById('timeline');
const timeLabel = document.getElementById('time-label');
const playBtn = document.getElementById('play-btn');
const playIcon = document.getElementById('play-icon');
const searchInput = document.getElementById('search-input');
const matchCount = document.getElementById('match-count');

let allWords = [];
let currentWord = null;
let isPlaying = false;
let currentTime = 0;
let raf = null;
let lastTick = null;
let matches = [];
let matchIdx = -1;

function fmt(s){const m=Math.floor(s/60);return m+':'+(Math.floor(s%60)+'').padStart(2,'0')}

RAW.forEach(para=>{
  const block = document.createElement('p');
  block.className='para';
  const spk = document.createElement('span');
  spk.className='speaker';
  spk.textContent=para.speaker.toUpperCase();
  block.appendChild(spk);
  para.words.forEach(({t,w})=>{
    const span = document.createElement('span');
    span.className='word';
    span.textContent=w+' ';
    span.dataset.t=t;
    span.addEventListener('click',()=>seekTo(t,span));
    block.appendChild(span);
    allWords.push({t,el:span});
  });
  transcript.appendChild(block);
});

function seekTo(t,el){
  currentTime=t;
  timelineEl.value=(t/DURATION)*100;
  timeLabel.textContent=fmt(t)+' / '+fmt(DURATION);
  highlight(t);
  if(el){
    el.classList.add('pulse');
    el.addEventListener('animationend',()=>el.classList.remove('pulse'),{once:true});
  }
}

function highlight(t){
  let active=null;
  for(let i=0;i<allWords.length;i++){
    if(allWords[i].t<=t&&(i===allWords.length-1||allWords[i+1].t>t)){
      active=allWords[i];
    }
  }
  if(active&&active!==currentWord){
    if(currentWord)currentWord.el.classList.remove('active');
    active.el.classList.add('active');
    currentWord=active;
    active.el.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  if(t>=DURATION-0.1&&isPlaying)stop();
}

function tick(ts){
  if(!lastTick)lastTick=ts;
  const dt=(ts-lastTick)/1000;
  lastTick=ts;
  currentTime=Math.min(currentTime+dt,DURATION);
  timelineEl.value=(currentTime/DURATION)*100;
  timeLabel.textContent=fmt(currentTime)+' / '+fmt(DURATION);
  highlight(currentTime);
  if(isPlaying)raf=requestAnimationFrame(tick);
}

function play(){
  isPlaying=true;
  lastTick=null;
  playIcon.className='ti ti-player-pause';
  raf=requestAnimationFrame(tick);
}

function stop(){
  isPlaying=false;
  playIcon.className='ti ti-player-play';
  if(raf)cancelAnimationFrame(raf);
}

playBtn.addEventListener('click',()=>{
  if(isPlaying)stop();
  else{if(currentTime>=DURATION-0.1)currentTime=0;play();}
});

timelineEl.addEventListener('input',()=>{
  currentTime=(timelineEl.value/100)*DURATION;
  timeLabel.textContent=fmt(currentTime)+' / '+fmt(DURATION);
  highlight(currentTime);
});

function applySearch(){
  const q=searchInput.value.trim().toLowerCase();
  allWords.forEach(({el})=>el.classList.remove('match','match-focus'));
  matches=[];matchIdx=-1;
  if(!q){matchCount.textContent='';return;}
  allWords.forEach(({el})=>{
    if(el.textContent.trim().toLowerCase().replace(/[^a-z]/g,'').includes(q.replace(/[^a-z]/g,''))){
      el.classList.add('match');
      matches.push(el);
    }
  });
  matchCount.textContent=matches.length?`1 / ${matches.length}`:'No matches';
  if(matches.length){matchIdx=0;focusMatch();}
}

function focusMatch(){
  matches.forEach(e=>e.classList.remove('match-focus'));
  if(matches.length){
    matches[matchIdx].classList.add('match-focus');
    matches[matchIdx].scrollIntoView({behavior:'smooth',block:'nearest'});
    matchCount.textContent=`${matchIdx+1} / ${matches.length}`;
  }
}

searchInput.addEventListener('input',applySearch);
document.getElementById('next-btn').addEventListener('click',()=>{
  if(!matches.length)return;
  matchIdx=(matchIdx+1)%matches.length;focusMatch();
});
document.getElementById('prev-btn').addEventListener('click',()=>{
  if(!matches.length)return;
  matchIdx=(matchIdx-1+matches.length)%matches.length;focusMatch();
});
</script>
