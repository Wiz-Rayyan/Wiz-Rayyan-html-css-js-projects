<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced CSS Animations</title>
    <style>
      body {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
        margin: 0;
        padding: 20px;
        font-family: "Segoe UI", sans-serif;
      }

      .container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 30px;
        max-width: 1200px;
        margin: 0 auto;
      }

      .animation {
        margin: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .label {
        color: white;
        margin-top: 15px;
        font-weight: 500;
        text-align: center;
        text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        background: rgba(0, 0, 0, 0.3);
        padding: 5px 15px;
        border-radius: 20px;
      }

      h1 {
        color: white;
        text-align: center;
        width: 100%;
        font-size: 2.5rem;
        margin-bottom: 30px;
        text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6);
      }
    </style>
  </head>
  <body>
    <h1>Advanced CSS Animations</h1>

    <div class="container">
      <!-- Animation 1: Quantum Orb -->
      <div class="animation">
        <div
          style="
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 30% 30%, #8a2be2, #4b0082);
            border-radius: 50%;
            box-shadow: 0 0 30px #9370db;
            animation: quantum 2s ease-in-out infinite;
          "
        ></div>
        <div class="label">Quantum Orb</div>
      </div>

      <!-- Animation 2: Neon Flicker -->
      <div class="animation">
        <div
          style="
            width: 120px;
            height: 60px;
            background: #000;
            border: 3px solid #ff00ff;
            color: #ff00ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: monospace;
            font-weight: bold;
            animation: flicker 0.1s infinite;
          "
        >
          OPEN
        </div>
        <div class="label">Neon Flicker</div>
      </div>

      <!-- Animation 3: Lava Lamp -->
      <div class="animation">
        <div
          style="
            width: 60px;
            height: 120px;
            background: linear-gradient(to bottom, #2c3e50, #34495e);
            border-radius: 30px;
            position: relative;
            overflow: hidden;
          "
        >
          <div
            style="
              width: 40px;
              height: 40px;
              background: radial-gradient(circle, #e74c3c, #c0392b);
              border-radius: 50%;
              position: absolute;
              bottom: 20px;
              left: 10px;
              animation: lava 4s ease-in-out infinite;
            "
          ></div>
        </div>
        <div class="label">Lava Lamp</div>
      </div>

      <!-- Animation 4: Cyber Grid -->
      <div class="animation">
        <div
          style="
            width: 100px;
            height: 100px;
            background: linear-gradient(
                45deg,
                #00ff88 25%,
                transparent 25%,
                transparent 75%,
                #00ff88 75%
              ),
              linear-gradient(
                45deg,
                #00ff88 25%,
                transparent 25%,
                transparent 75%,
                #00ff88 75%
              );
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            animation: gridMove 1s linear infinite;
          "
        ></div>
        <div class="label">Cyber Grid</div>
      </div>

      <!-- Animation 5: Hologram -->
      <div class="animation">
        <div
          style="
            width: 80px;
            height: 80px;
            background: conic-gradient(
              from 0deg,
              transparent,
              #00ffff,
              #ff00ff,
              #00ffff,
              transparent
            );
            border-radius: 50%;
            animation: hologram 3s linear infinite;
          "
        ></div>
        <div class="label">Hologram</div>
      </div>

      <!-- Animation 6: Matrix Rain -->
      <div class="animation">
        <div
          style="
            width: 100px;
            height: 150px;
            background: #000;
            color: #00ff00;
            font-family: monospace;
            font-size: 12px;
            overflow: hidden;
            position: relative;
            animation: matrix 0.5s infinite;
          "
        >
          <div
            style="
              position: absolute;
              top: 0;
              left: 10px;
              animation: rain 2s linear infinite;
            "
          >
            01010101
          </div>
        </div>
        <div class="label">Matrix Rain</div>
      </div>

      <!-- Animation 7: Psychedelic -->
      <div class="animation">
        <div
          style="
            width: 70px;
            height: 70px;
            background: conic-gradient(
              red,
              yellow,
              lime,
              aqua,
              blue,
              magenta,
              red
            );
            border-radius: 50%;
            animation: psychedelic 1.5s linear infinite;
          "
        ></div>
        <div class="label">Psychedelic</div>
      </div>

      <!-- Animation 8: Black Hole -->
      <div class="animation">
        <div
          style="
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #000 40%, #2c3e50 70%, #3498db);
            border-radius: 50%;
            animation: blackhole 4s ease-in-out infinite;
          "
        ></div>
        <div class="label">Black Hole</div>
      </div>

      <!-- Animation 9: Digital Raindrop -->
      <div class="animation">
        <div
          style="
            width: 80px;
            height: 120px;
            background: linear-gradient(
              to bottom,
              transparent 70%,
              #00ff88 100%
            );
            border-radius: 0 0 40px 40px;
            animation: raindrop 2s ease-in-out infinite;
          "
        ></div>
        <div class="label">Digital Raindrop</div>
      </div>

      <!-- Animation 10: Neural Network -->
      <div class="animation">
        <div
          style="
            width: 120px;
            height: 120px;
            position: relative;
            background: #1a1a2e;
            border-radius: 10px;
            animation: pulse 3s ease-in-out infinite;
          "
        >
          <div
            style="
              width: 8px;
              height: 8px;
              background: #0abde3;
              border-radius: 50%;
              position: absolute;
              top: 20px;
              left: 20px;
              animation: neuron 2s ease-in-out infinite;
            "
          ></div>
        </div>
        <div class="label">Neural Network</div>
      </div>
    </div>

    <style>
      @keyframes quantum {
        0%,
        100% {
          transform: scale(1) rotate(0deg);
          box-shadow: 0 0 30px #9370db;
        }
        50% {
          transform: scale(1.3) rotate(180deg);
          box-shadow: 0 0 60px #8a2be2, 0 0 80px #4b0082;
        }
      }

      @keyframes flicker {
        0%,
        100% {
          opacity: 1;
          text-shadow: 0 0 10px #ff00ff;
        }
        50% {
          opacity: 0.7;
          text-shadow: 0 0 20px #ff00ff, 0 0 30px #ff00ff;
        }
      }

      @keyframes lava {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-40px) scale(1.2);
        }
      }

      @keyframes gridMove {
        0% {
          background-position: 0 0, 10px 10px;
        }
        100% {
          background-position: 20px 20px, 30px 30px;
        }
      }

      @keyframes hologram {
        from {
          transform: rotate(0deg) scale(1);
          filter: hue-rotate(0deg);
        }
        to {
          transform: rotate(360deg) scale(1.2);
          filter: hue-rotate(360deg);
        }
      }

      @keyframes matrix {
        0% {
          text-shadow: 0 0 5px #00ff00;
        }
        100% {
          text-shadow: 0 0 20px #00ff00, 0 0 30px #00ff00;
        }
      }

      @keyframes rain {
        0% {
          top: -100%;
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          top: 100%;
          opacity: 0;
        }
      }

      @keyframes psychedelic {
        from {
          transform: rotate(0deg) scale(1);
          filter: blur(0px);
        }
        to {
          transform: rotate(360deg) scale(1.5);
          filter: blur(5px);
        }
      }

      @keyframes blackhole {
        0%,
        100% {
          transform: scale(1) rotate(0deg);
          box-shadow: 0 0 0px rgba(52, 152, 219, 0.5);
        }
        50% {
          transform: scale(1.1) rotate(180deg);
          box-shadow: 0 0 50px rgba(52, 152, 219, 0.8),
            0 0 100px rgba(52, 152, 219, 0.6);
        }
      }

      @keyframes raindrop {
        0%,
        100% {
          transform: translateY(0) scaleY(1);
          opacity: 0.7;
        }
        50% {
          transform: translateY(20px) scaleY(1.2);
          opacity: 1;
        }
      }

      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 10px #0abde3;
        }
        50% {
          box-shadow: 0 0 30px #0abde3, 0 0 50px #0abde3;
        }
      }

      @keyframes neuron {
        0%,
        100% {
          transform: scale(1);
          box-shadow: 0 0 5px #0abde3;
        }
        50% {
          transform: scale(1.5);
          box-shadow: 0 0 15px #0abde3;
        }
      }
    </style>
  </body>
</html>
