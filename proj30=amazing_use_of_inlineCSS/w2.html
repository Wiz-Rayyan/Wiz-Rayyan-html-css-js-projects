<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next-Level CSS Animations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 40px;
            padding: 40px;
            background: #000;
            overflow-x: hidden;
            font-family: 'Arial', sans-serif;
        }
        
        .animation-card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            perspective: 1000px;
            z-index: 1;
        }
        
        .animation-label {
            color: white;
            margin-top: 20px;
            font-weight: 600;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 16px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .title {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 3.5rem;
            margin-bottom: 60px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #ff9a3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleGlow 4s ease-in-out infinite;
            z-index: 10;
        }
        
        .background-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>
    <h1 class="title">Next-Level CSS Animations</h1>
    
    <div class="background-effects">
        <div style="position: absolute; top: 20%; left: 10%; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(79, 70, 229, 0.2) 0%, transparent 70%); animation: float 15s ease-in-out infinite; filter: blur(40px);"></div>
        <div style="position: absolute; bottom: 10%; right: 15%; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(236, 72, 153, 0.15) 0%, transparent 70%); animation: float 18s ease-in-out infinite reverse; filter: blur(50px);"></div>
    </div>
    
    <!-- Animation 1: Quantum Singularity -->
    <div class="animation-card">
        <div style="width: 180px; height: 180px; background: radial-gradient(circle at center, #8A2BE2, #4B0082, #000000); border-radius: 50%; box-shadow: 0 0 60px #9370DB, 0 0 100px #8A2BE2; animation: singularity 3s ease-in-out infinite; position: relative;">
            <div style="width: 60px; height: 60px; background: radial-gradient(circle, #00ffff, transparent 70%); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); animation: pulseCore 2s ease-in-out infinite;"></div>
        </div>
        <div class="animation-label">Quantum Singularity</div>
    </div>

    <!-- Animation 2: Neural Network -->
    <div class="animation-card">
        <div style="width: 200px; height: 200px; position: relative;">
            <div style="width: 100%; height: 100%; border-radius: 50%; border: 2px solid rgba(0, 255, 255, 0.3); animation: neuralOrbit 6s linear infinite; position: absolute;"></div>
            <div style="width: 100%; height: 100%; border-radius: 50%; border: 2px solid rgba(255, 0, 255, 0.3); animation: neuralOrbit 8s linear infinite reverse; position: absolute;"></div>
            <div style="width: 80%; height: 80%; background: radial-gradient(circle, rgba(10, 189, 227, 0.1), transparent 70%); border-radius: 50%; position: absolute; top: 10%; left: 10%; animation: neuralPulse 4s ease-in-out infinite;">
                <div style="width: 12px; height: 12px; background: #0abde3; border-radius: 50%; position: absolute; top: 20px; left: 50px; animation: neuronPulse 3s ease-in-out infinite; box-shadow: 0 0 15px #0abde3;"></div>
                <div style="width: 12px; height: 12px; background: #ff00ff; border-radius: 50%; position: absolute; top: 80px; left: 20px; animation: neuronPulse 2.5s ease-in-out infinite 0.5s; box-shadow: 0 0 15px #ff00ff;"></div>
                <div style="width: 12px; height: 12px; background: #00ffff; border-radius: 50%; position: absolute; top: 60px; left: 100px; animation: neuronPulse 3.5s ease-in-out infinite 0.7s; box-shadow: 0 0 15px #00ffff;"></div>
            </div>
        </div>
        <div class="animation-label">Neural Network</div>
    </div>

    <!-- Animation 3: Holographic Interface -->
    <div class="animation-card">
        <div style="width: 200px; height: 200px; position: relative; transform-style: preserve-3d; animation: hologramFloat 8s ease-in-out infinite;">
            <div style="width: 150px; height: 150px; background: linear-gradient(45deg, rgba(0, 255, 255, 0.7), rgba(255, 0, 255, 0.7)); border-radius: 20px; position: absolute; transform: rotateX(60deg) rotateZ(45deg); animation: hologramGrid 3s linear infinite; box-shadow: 0 0 40px rgba(0, 255, 255, 0.5), 0 0 80px rgba(255, 0, 255, 0.5);"></div>
            <div style="width: 120px; height: 120px; background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent); border-radius: 20px; position: absolute; top: 15px; left: 15px; animation: hologramInner 4s ease-in-out infinite;"></div>
            <div style="width: 30px; height: 30px; background: rgba(255, 255, 255, 0.8); border-radius: 50%; position: absolute; top: 60px; left: 60px; animation: hologramCore 3s ease-in-out infinite; box-shadow: 0 0 20px white;"></div>
        </div>
        <div class="animation-label">Holographic Interface</div>
    </div>

    <!-- Animation 4: Cosmic Energy -->
    <div class="animation-card">
        <div style="width: 200px; height: 200px; position: relative;">
            <div style="width: 100%; height: 100%; background: radial-gradient(circle, #4ecdc4, #1a1a1a); border-radius: 50%; box-shadow: 0 0 60px #4ecdc4; animation: cosmicPulse 4s ease-in-out infinite;"></div>
            <div style="width: 30px; height: 30px; background: #4ecdc4; border-radius: 50%; position: absolute; top: 20px; left: 85px; animation: energyOrbit 5s linear infinite; box-shadow: 0 0 20px #4ecdc4;"></div>
            <div style="width: 20px; height: 20px; background: #ff6b6b; border-radius: 50%; position: absolute; top: 80px; left: 20px; animation: energyOrbit 7s linear infinite reverse; box-shadow: 0 0 15px #ff6b6b;"></div>
            <div style="width: 25px; height: 25px; background: #ffe259; border-radius: 50%; position: absolute; top: 150px; left: 90px; animation: energyOrbit 6s linear infinite 1s; box-shadow: 0 0 15px #ffe259;"></div>
        </div>
        <div class="animation-label">Cosmic Energy</div>
    </div>

    <!-- Animation 5: Cyber Core -->
    <div class="animation-card">
        <div style="width: 180px; height: 180px; position: relative;">
            <div style="width: 100%; height: 100%; background: conic-gradient(from 0deg, #00ff88, #00ff88 10%, transparent 10%, transparent 90%, #00ff88 90%, #00ff88); border-radius: 50%; box-shadow: 0 0 50px #00ff88; animation: cyberCore 2s linear infinite;"></div>
            <div style="width: 70%; height: 70%; background: conic-gradient(from 180deg, #00ff88, #00ff88 10%, transparent 10%, transparent 90%, #00ff88 90%, #00ff88); border-radius: 50%; position: absolute; top: 15%; left: 15%; animation: cyberCore 1.5s linear infinite reverse;"></div>
            <div style="width: 40%; height: 40%; background: radial-gradient(circle, #00ff88, transparent 70%); border-radius: 50%; position: absolute; top: 30%; left: 30%; animation: cyberPulse 3s ease-in-out infinite;"></div>
        </div>
        <div class="animation-label">Cyber Core</div>
    </div>

    <style>
        @keyframes singularity {
            0%, 100% { transform: scale(1) rotate(0deg); filter: hue-rotate(0deg) blur(0); }
            50% { transform: scale(1.2) rotate(180deg); filter: hue-rotate(180deg) blur(8px); }
        }
        
        @keyframes pulseCore {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
        }
        
        @keyframes neuralOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes neuralPulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
        }
        
        @keyframes neuronPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 10px currentColor; }
            50% { transform: scale(1.8); box-shadow: 0 0 25px currentColor; }
        }
        
        @keyframes hologramFloat {
            0%, 100% { transform: translateY(0) rotate3d(1, 1, 1, 0deg); }
            33% { transform: translateY(-20px) rotate3d(1, 1, 1, 120deg); }
            66% { transform: translateY(10px) rotate3d(1, 1, 1, 240deg); }
        }
        
        @keyframes hologramGrid {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }
        
        @keyframes hologramInner {
            0%, 100% { opacity: 0.3; transform: translate(0, 0); }
            50% { opacity: 0.7; transform: translate(5px, 5px); }
        }
        
        @keyframes hologramCore {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
        }
        
        @keyframes cosmicPulse {
            0%, 100% { box-shadow: 0 0 60px #4ecdc4; transform: scale(1); }
            50% { box-shadow: 0 0 100px #4ecdc4, 0 0 150px #4ecdc4; transform: scale(1.1); }
        }
        
        @keyframes energyOrbit {
            0% { transform: rotate(0deg) translateX(70px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(70px) rotate(-360deg); }
        }
        
        @keyframes cyberCore {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes cyberPulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.1); }
        }
        
        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 20px #ff6b6b, 0 0 40px #4ecdc4; }
            50% { text-shadow: 0 0 40px #ff6b6b, 0 0 80px #4ecdc4, 0 0 120px #45b7d1; }
        }
    </style>
</body>
</html>
