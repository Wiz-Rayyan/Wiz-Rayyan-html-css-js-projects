<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>God-Tier CSS Animations</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        
        header {
            text-align: center;
            margin-bottom: 3rem;
            max-width: 800px;
            z-index: 10;
        }
        
        h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #00ffcc, #ff00aa, #7700ff, #00ffcc);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: title-glow 8s ease infinite, gradient-flow 5s linear infinite;
            text-shadow: 0 0 30px rgba(119, 0, 255, 0.5);
            position: relative;
        }
        
        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to right, #00ffcc, #ff00aa, #7700ff);
            background-size: 300% auto;
            border-radius: 10px;
            animation: gradient-flow 5s linear infinite;
        }
        
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2.5rem;
            width: 100%;
            max-width: 1400px;
        }
        
        .animation-box {
            height: 300px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .animation-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
        }
        
        .animation-name {
            position: absolute;
            bottom: 15px;
            left: 15px;
            font-weight: 700;
            font-size: 1rem;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border-radius: 8px;
            z-index: 10;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Quantum Flux Animation */
        #quantum-flux {
            background: linear-gradient(125deg, #000, #0f0f2e, #1a1a3a);
            animation: quantum-bg 15s infinite linear;
        }
        
        .quantum-core {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            position: relative;
            animation: quantum-spin 8s infinite linear;
        }
        
        .quantum-core::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle, #00f7ff, transparent 70%);
            box-shadow: 0 0 40px #00f7ff, 0 0 80px #00f7ff;
            animation: quantum-core-pulse 3s infinite alternate;
        }
        
        .quantum-particle {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #00f7ff;
            box-shadow: 0 0 20px #00f7ff, 0 0 40px #00f7ff;
            animation: quantum-orbit 4s infinite linear;
        }
        
        .particle-1 { top: -12px; left: 48px; animation-delay: 0s; }
        .particle-2 { top: 48px; right: -12px; animation-delay: -1s; }
        .particle-3 { bottom: -12px; left: 48px; animation-delay: -2s; }
        .particle-4 { top: 48px; left: -12px; animation-delay: -3s; }
        
        /* Holographic Interface */
        #hologram {
            background: rgba(10, 10, 30, 0.8);
            perspective: 1000px;
        }
        
        .hologram-element {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            animation: hologram-rotate 15s infinite linear;
        }
        
        .hologram-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(0, 255, 255, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            color: #0ff;
            text-shadow: 0 0 15px #0ff;
            backdrop-filter: blur(5px);
            background: rgba(0, 255, 255, 0.1);
            animation: hologram-face-pulse 4s infinite alternate;
        }
        
        .face-front { transform: translateZ(100px); }
        .face-back { transform: rotateY(180deg) translateZ(100px); }
        .face-right { transform: rotateY(90deg) translateZ(100px); }
        .face-left { transform: rotateY(-90deg) translateZ(100px); }
        .face-top { transform: rotateX(90deg) translateZ(100px); }
        .face-bottom { transform: rotateX(-90deg) translateZ(100px); }
        
        /* Neural Network Animation */
        #neural-network {
            background: radial-gradient(circle at center, #0f0f2e 0%, #000 70%);
            overflow: hidden;
        }
        
        .neural-node {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #f0f;
            box-shadow: 0 0 15px #f0f, 0 0 30px #f0f;
            position: absolute;
            animation: neural-pulse 2s infinite alternate;
        }
        
        .node-1 { top: 30%; left: 20%; animation-delay: 0s; }
        .node-2 { top: 60%; left: 30%; animation-delay: 0.2s; }
        .node-3 { top: 40%; left: 50%; animation-delay: 0.4s; }
        .node-4 { top: 70%; left: 60%; animation-delay: 0.6s; }
        .node-5 { top: 30%; left: 70%; animation-delay: 0.8s; }
        .node-6 { top: 50%; left: 80%; animation-delay: 1s; }
        .node-7 { top: 20%; left: 40%; animation-delay: 1.2s; }
        .node-8 { top: 65%; left: 45%; animation-delay: 1.4s; }
        
        .neural-connection {
            position: absolute;
            height: 2px;
            background: linear-gradient(to right, rgba(240, 0, 255, 0), #f0f, rgba(240, 0, 255, 0));
            transform-origin: 0 0;
            animation: neural-connection 3s infinite;
        }
        
        /* Singularity Animation */
        #singularity {
            background: radial-gradient(circle at center, #000 40%, #0f0f2e 100%);
        }
        
        .singularity-core {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff0066, #000);
            box-shadow: 0 0 80px #ff0066, 0 0 140px #ff0066;
            animation: singularity-pulse 4s infinite alternate;
            position: relative;
        }
        
        .singularity-core::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 30px #fff, 0 0 60px #fff;
            animation: singularity-core-spin 8s infinite linear;
        }
        
        .singularity-ring {
            position: absolute;
            border: 2px solid rgba(255, 0, 102, 0.6);
            border-radius: 50%;
            animation: singularity-expand 6s infinite;
        }
        
        .ring-1 { width: 150px; height: 150px; animation-delay: 0s; }
        .ring-2 { width: 220px; height: 220px; animation-delay: 1s; }
        .ring-3 { width: 290px; height: 290px; animation-delay: 2s; }
        .ring-4 { width: 360px; height: 360px; animation-delay: 3s; }
        
        /* Cyber Grid Animation */
        #cyber-grid {
            background: #000;
            overflow: hidden;
            position: relative;
        }
        
        .cyber-line {
            position: absolute;
            background: rgba(0, 255, 170, 0.8);
            box-shadow: 0 0 15px #0fa, 0 0 30px #0fa;
            animation: cyber-scan 3s infinite linear;
        }
        
        .horizontal { width: 100%; height: 2px; }
        .vertical { width: 2px; height: 100%; }
        
        .cyber-node {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #0fa;
            box-shadow: 0 0 15px #0fa, 0 0 30px #0fa;
            animation: cyber-node-pulse 2s infinite alternate;
        }
        
        .cyber-node:nth-child(1) { top: 20%; left: 20%; animation-delay: 0s; }
        .cyber-node:nth-child(2) { top: 40%; left: 40%; animation-delay: 0.5s; }
        .cyber-node:nth-child(3) { top: 60%; left: 60%; animation-delay: 1s; }
        .cyber-node:nth-child(4) { top: 80%; left: 80%; animation-delay: 1.5s; }
        .cyber-node:nth-child(5) { top: 20%; left: 80%; animation-delay: 0.2s; }
        .cyber-node:nth-child(6) { top: 80%; left: 20%; animation-delay: 0.8s; }
        
        /* Cosmic Strings Animation */
        #cosmic-strings {
            background: radial-gradient(circle at center, #110033, #000011);
            overflow: hidden;
        }
        
        .cosmic-string {
            position: absolute;
            width: 3px;
            height: 200%;
            background: linear-gradient(to bottom, 
                transparent, 
                rgba(128, 0, 255, 0.8), 
                rgba(255, 0, 128, 0.8),
                transparent);
            top: -50%;
            animation: cosmic-string-drift 15s infinite linear;
            opacity: 0.7;
        }
        
        .string-1 { left: 20%; transform: rotate(20deg); animation-delay: 0s; }
        .string-2 { left: 40%; transform: rotate(-15deg); animation-delay: 3s; }
        .string-3 { left: 60%; transform: rotate(10deg); animation-delay: 6s; }
        .string-4 { left: 80%; transform: rotate(-5deg); animation-delay: 9s; }
        
        .cosmic-node {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(128, 0, 255, 0.8);
            box-shadow: 0 0 20px rgba(128, 0, 255, 0.8);
            animation: cosmic-node-pulse 4s infinite alternate;
        }
        
        .cosmic-node:nth-child(1) { top: 30%; left: 25%; }
        .cosmic-node:nth-child(2) { top: 60%; left: 40%; }
        .cosmic-node:nth-child(3) { top: 40%; left: 65%; }
        .cosmic-node:nth-child(4) { top: 70%; left: 75%; }
        
        /* Quantum Foam Animation */
        #quantum-foam {
            background: #000;
            overflow: hidden;
        }
        
        .quantum-bubble {
            position: absolute;
            border-radius: 50%;
            background: transparent;
            border: 1px solid rgba(0, 255, 255, 0.3);
            animation: quantum-bubble 8s infinite alternate;
        }
        
        .bubble-1 { width: 40px; height: 40px; top: 20%; left: 20%; animation-delay: 0s; }
        .bubble-2 { width: 60px; height: 60px; top: 60%; left: 30%; animation-delay: 1s; }
        .bubble-3 { width: 30px; height: 30px; top: 40%; left: 60%; animation-delay: 2s; }
        .bubble-4 { width: 50px; height: 50px; top: 70%; left: 70%; animation-delay: 3s; }
        .bubble-5 { width: 70px; height: 70px; top: 30%; left: 50%; animation-delay: 4s; }
        
        .quantum-spark {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #0ff;
            box-shadow: 0 0 10px #0ff;
            animation: quantum-spark 3s infinite;
        }
        
        /* Keyframes */
        @keyframes title-glow {
            0% { text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
            50% { text-shadow: 0 0 30px rgba(119, 0, 255, 0.8), 0 0 50px rgba(255, 0, 170, 0.6); }
            100% { text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
        }
        
        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes quantum-bg {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }
        
        @keyframes quantum-spin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }
        
        @keyframes quantum-core-pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
        }
        
        @keyframes quantum-orbit {
            0% { transform: rotate(0deg) translateX(70px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(70px) rotate(-360deg); }
        }
        
        @keyframes hologram-rotate {
            0% { transform: rotateX(0) rotateY(0) rotateZ(0); }
            100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
        }
        
        @keyframes hologram-face-pulse {
            0% { box-shadow: 0 0 10px rgba(0, 255, 255, 0.6); }
            100% { box-shadow: 0 0 30px rgba(0, 255, 255, 0.8), 0 0 60px rgba(0, 255, 255, 0.6); }
        }
        
        @keyframes neural-pulse {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(1.8); opacity: 1; }
        }
        
        @keyframes neural-connection {
            0% { opacity: 0; width: 0; }
            50% { opacity: 1; width: 120px; }
            100% { opacity: 0; width: 0; }
        }
        
        @keyframes singularity-pulse {
            0% { transform: scale(1); box-shadow: 0 0 80px #ff0066, 0 0 140px #ff0066; }
            100% { transform: scale(1.2); box-shadow: 0 0 120px #ff0066, 0 0 180px #ff0066; }
        }
        
        @keyframes singularity-core-spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        @keyframes singularity-expand {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }
        
        @keyframes cyber-scan {
            0% { transform: translateY(-100%); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(200%); opacity: 0; }
        }
        
        @keyframes cyber-node-pulse {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(1.5); opacity: 1; }
        }
        
        @keyframes cosmic-string-drift {
            0% { transform: rotate(var(--rotation, 0deg)) translateY(-50%); }
            100% { transform: rotate(var(--rotation, 0deg)) translateY(0%); }
        }
        
        @keyframes cosmic-node-pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(128, 0, 255, 0.8); }
            100% { transform: scale(1.5); box-shadow: 0 0 40px rgba(128, 0, 255, 0.8), 0 0 60px rgba(128, 0, 255, 0.6); }
        }
        
        @keyframes quantum-bubble {
            0% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 0.6; }
            100% { transform: scale(0.8); opacity: 0.3; }
        }
        
        @keyframes quantum-spark {
            0% { transform: translate(0, 0); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translate(var(--tx, 100px), var(--ty, 100px)); opacity: 0; }
        }
        
        .controls {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            z-index: 10;
        }
        
        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: float 15s infinite linear;
        }
        
        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <header>
        <h1>God-Tier CSS Animations</h1>
        <p>Next-level animations that push the boundaries of what's possible with pure CSS</p>
    </header>
    
    <div class="container">
        <div class="animation-box" id="quantum-flux">
            <div class="quantum-core">
                <div class="quantum-particle particle-1"></div>
                <div class="quantum-particle particle-2"></div>
                <div class="quantum-particle particle-3"></div>
                <div class="quantum-particle particle-4"></div>
            </div>
            <div class="animation-name">Quantum Flux</div>
        </div>
        
        <div class="animation-box" id="hologram">
            <div class="hologram-element">
                <div class="hologram-face face-front">CSS</div>
                <div class="hologram-face face-back">3D</div>
                <div class="hologram-face face-right">WEB</div>
                <div class="hologram-face face-left">GL</div>
                <div class="hologram-face face-top">HTML</div>
                <div class="hologram-face face-bottom">JS</div>
            </div>
            <div class="animation-name">Holographic Interface</div>
        </div>
        
        <div class="animation-box" id="neural-network">
            <div class="neural-node node-1"></div>
            <div class="neural-node node-2"></div>
            <div class="neural-node node-3"></div>
            <div class="neural-node node-4"></div>
            <div class="neural-node node-5"></div>
            <div class="neural-node node-6"></div>
            <div class="neural-node node-7"></div>
            <div class="neural-node node-8"></div>
            
            <div class="neural-connection" style="top: 30%; left: 20%; transform: rotate(30deg);"></div>
            <div class="neural-connection" style="top: 60%; left: 30%; transform: rotate(120deg);"></div>
            <div class="neural-connection" style="top: 40%; left: 50%; transform: rotate(70deg);"></div>
            <div class="neural-connection" style="top: 70%; left: 60%; transform: rotate(160deg);"></div>
            <div class="neural-connection" style="top: 30%; left: 70%; transform: rotate(20deg);"></div>
            
            <div class="animation-name">Neural Network</div>
        </div>
        
        <div class="animation-box" id="singularity">
            <div class="singularity-core"></div>
            <div class="singularity-ring ring-1"></div>
            <div class="singularity-ring ring-2"></div>
            <div class="singularity-ring ring-3"></div>
            <div class="singularity-ring ring-4"></div>
            <div class="animation-name">Singularity</div>
        </div>
        
        <div class="animation-box" id="cyber-grid">
            <div class="cyber-line horizontal" style="top: 20%;"></div>
            <div class="cyber-line horizontal" style="top: 40%;"></div>
            <div class="cyber-line horizontal" style="top: 60%;"></div>
            <div class="cyber-line horizontal" style="top: 80%;"></div>
            
            <div class="cyber-line vertical" style="left: 20%;"></div>
            <div class="cyber-line vertical" style="left: 40%;"></div>
            <div class="cyber-line vertical" style="left: 60%;"></div>
            <div class="cyber-line vertical" style="left: 80%;"></div>
            
            <div class="cyber-node"></div>
            <div class="cyber-node"></div>
            <div class="cyber-node"></div>
            <div class="cyber-node"></div>
            <div class="cyber-node"></div>
            <div class="cyber-node"></div>
            
            <div class="animation-name">Cyber Grid</div>
        </div>
        
        <div class="animation-box" id="cosmic-strings">
            <div class="cosmic-string string-1"></div>
            <div class="cosmic-string string-2"></div>
            <div class="cosmic-string string-3"></div>
            <div class="cosmic-string string-4"></div>
            
            <div class="cosmic-node"></div>
            <div class="cosmic-node"></div>
            <div class="cosmic-node"></div>
            <div class="cosmic-node"></div>
            
            <div class="animation-name">Cosmic Strings</div>
        </div>
        
        <div class="animation-box" id="quantum-foam">
            <div class="quantum-bubble bubble-1"></div>
            <div class="quantum-bubble bubble-2"></div>
            <div class="quantum-bubble bubble-3"></div>
            <div class="quantum-bubble bubble-4"></div>
            <div class="quantum-bubble bubble-5"></div>
            
            <div class="quantum-spark" style="--tx: 100px; --ty: 150px; top: 20%; left: 25%;"></div>
            <div class="quantum-spark" style="--tx: -120px; --ty: 100px; top: 60%; left: 40%;"></div>
            <div class="quantum-spark" style="--tx: 150px; --ty: -80px; top: 40%; left: 65%;"></div>
            <div class="quantum-spark" style="--tx: -100px; --ty: -120px; top: 70%; left: 30%;"></div>
            
            <div class="animation-name">Quantum Foam</div>
        </div>
    </div>
    
    <div class="controls">
        <button class="control-btn" onclick="toggleAnimations()"><i class="fas fa-pause"></i> Pause All</button>
        <button class="control-btn" onclick="location.reload()"><i class="fas fa-sync"></i> Restart</button>
    </div>

    <script>
        // Create background particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 100;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random properties
                const size = Math.random() * 3 + 1;
                const posX = Math.random() * 100;
                const posY = Math.random() * 100;
                const delay = Math.random() * 15;
                const duration = 15 + Math.random() * 10;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${posX}vw`;
                particle.style.top = `${posY}vh`;
                particle.style.animationDelay = `${delay}s`;
                particle.style.animationDuration = `${duration}s`;
                
                // Random color based on animation type
                const colors = ['#00f7ff', '#ff00aa', '#7700ff', '#00ffcc', '#0fa'];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                particlesContainer.appendChild(particle);
            }
        }
        
        // Toggle all animations
        function toggleAnimations() {
            const btn = document.querySelector('.control-btn');
            const animations = document.querySelectorAll('*');
            let isPaused = false;
            
            animations.forEach(element => {
                if (getComputedStyle(element).animationPlayState === 'paused') {
                    element.style.animationPlayState = 'running';
                    btn.innerHTML = '<i class="fas fa-pause"></i> Pause All';
                } else {
                    element.style.animationPlayState = 'paused';
                    isPaused = true;
                }
            });
            
            if (isPaused) {
                btn.innerHTML = '<i class="fas fa-play"></i> Play All';
            }
        }
        
        // Initialize
        createParticles();
    </script>
