<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazing CSS Animations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        
        h1 {
            margin-bottom: 40px;
            text-align: center;
            font-size: 2.8rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1200px;
            width: 100%;
        }
        
        .box {
            padding: 30px;
            border-radius: 16px;
            color: white;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            font-weight: bold;
            font-size: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            transition: transform 0.3s ease;
        }
        
        .box:hover {
            transform: translateY(-5px);
        }
        
        /* Keyframe animations */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        
        @keyframes colorChange {
            0% { background: linear-gradient(135deg, #ff9a9e, #fad0c4); }
            25% { background: linear-gradient(135deg, #a1c4fd, #c2e9fb); }
            50% { background: linear-gradient(135deg, #ffecd2, #fcb69f); }
            75% { background: linear-gradient(135deg, #84fab0, #8fd3f4); }
            100% { background: linear-gradient(135deg, #ff9a9e, #fad0c4); }
        }
        
        @keyframes neonGlow {
            0% { box-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #ff00ff, 0 0 20px #ff00ff; }
            50% { box-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #ff00ff, 0 0 40px #ff00ff; }
            100% { box-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #ff00ff, 0 0 20px #ff00ff; }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }
        
        @keyframes flip {
            0% { transform: perspective(400px) rotateY(0); }
            50% { transform: perspective(400px) rotateY(180deg); }
            100% { transform: perspective(400px) rotateY(360deg); }
        }
        
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }
        
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }
        
        @keyframes blink {
            0%, 100% { border-color: transparent; }
            50% { border-color: white; }
        }
        
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        
        @keyframes rain {
            0% { background-position: 0 0; }
            100% { background-position: 0 1000px; }
        }
        
        @keyframes sparkle {
            0% { opacity: 0; transform: translateY(0) rotate(0deg); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-100px) rotate(360deg); }
        }
        
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 5px); }
            40% { transform: translate(-5px, -5px); }
            60% { transform: translate(5px, 5px); }
            80% { transform: translate(5px, -5px); }
            100% { transform: translate(0); }
        }
        
        @keyframes liquid {
            0%, 100% { height: 30%; border-radius: 50% 50% 0 0; }
            50% { height: 70%; border-radius: 40% 40% 0 0; }
        }
        
        @keyframes holographic {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes wave {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        
        @keyframes morph {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Animation classes */
        .float {
            animation: float 4s ease-in-out infinite;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
        }
        
        .color-change {
            animation: colorChange 8s infinite;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        }
        
        .neon {
            animation: neonGlow 2s infinite;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 2px solid #fff;
        }
        
        .shake {
            animation: shake 0.8s infinite;
            background: linear-gradient(135deg, #ff5e62, #ff9966);
        }
        
        .flip {
            animation: flip 4s infinite;
            background: linear-gradient(135deg, #614385, #516395);
        }
        
        .heartbeat {
            animation: heartbeat 1.5s infinite;
            background: linear-gradient(135deg, #ff5858, #f09819);
        }
        
        .typing {
            overflow: hidden;
            white-space: nowrap;
            border-right: 3px solid;
            animation: typing 3.5s steps(40, end), blink 0.75s step-end infinite;
            background: linear-gradient(135deg, #4b6cb7, #182848);
            width: 0;
        }
        
        .shimmer {
            background: linear-gradient(135deg, #3a7bd5, #00d2ff);
            background-size: 1000px 100%;
            animation: shimmer 4s infinite linear;
        }
        
        .rain {
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><circle cx="2" cy="2" r="2" fill="white" opacity="0.3"/></svg>');
            animation: rain 10s infinite linear;
        }
        
        .sparkle-container {
            position: relative;
            background: linear-gradient(135deg, #0f2027, #203a43);
            overflow: hidden;
        }
        
        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            opacity: 0;
        }
        
        .sparkle-1 {
            top: 20%;
            left: 20%;
            animation: sparkle 3s infinite;
        }
        
        .sparkle-2 {
            top: 60%;
            left: 70%;
            animation: sparkle 4s infinite 0.5s;
        }
        
        .sparkle-3 {
            top: 30%;
            left: 50%;
            animation: sparkle 5s infinite 1s;
        }
        
        .sparkle-4 {
            top: 70%;
            left: 30%;
            animation: sparkle 3.5s infinite 1.5s;
        }
        
        .sparkle-5 {
            top: 40%;
            left: 80%;
            animation: sparkle 4.5s infinite 2s;
        }
        
        .glitch {
            animation: glitch 5s infinite;
            background: linear-gradient(135deg, #8e2de2, #4a00e0);
            position: relative;
        }
        
        .liquid {
            background: #1a1a2e;
            position: relative;
            overflow: hidden;
        }
        
        .liquid-wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(to top, #00b4db, #0083b0);
            border-radius: 50% 50% 0 0;
            animation: liquid 5s ease-in-out infinite;
            z-index: 0;
        }
        
        .holographic {
            background: linear-gradient(45deg, #ff00ff, #00ffff, #ff00ff, #00ffff);
            background-size: 300% 300%;
            animation: holographic 4s ease infinite;
        }
        
        .particle-wave {
            background: #16213e;
            position: relative;
            overflow: hidden;
        }
        
        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 20px;
            background: radial-gradient(circle, #00b4db 10%, transparent 10%);
            background-size: 20px 20px;
            background-position: 0 0;
            animation: wave 3s linear infinite;
            opacity: 0.6;
        }
        
        .morph {
            background: linear-gradient(45deg, #ff9a9e, #fad0c4, #a1c4fd);
            background-size: 300% 300%;
            animation: morph 8s ease infinite;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box float">
            <h3>Floating Animation</h3>
        </div>
        
        <div class="box color-change">
            <h3>Color Changing</h3>
        </div>
        
        <div class="box neon">
            <h3>Neon Glow Effect</h3>
        </div>
        
        <div class="box shake">
            <h3>Shake Animation</h3>
        </div>
        
        <div class="box flip">
            <h3>3D Flip Animation</h3>
        </div>
        
        <div class="box heartbeat">
            <h3>Heartbeat Effect</h3>
        </div>
        
        <div class="box typing">
            <h3>Typing Animation</h3>
        </div>
        
        <div class="box shimmer">
            <h3>Shimmer Effect</h3>
        </div>
        
        <div class="box rain">
            <h3>Rain Animation</h3>
        </div>
        
        <div class="box sparkle-container">
            <h3>Sparkle Effect</h3>
            <div class="sparkle sparkle-1"></div>
            <div class="sparkle sparkle-2"></div>
            <div class="sparkle sparkle-3"></div>
            <div class="sparkle sparkle-4"></div>
            <div class="sparkle sparkle-5"></div>
        </div>
        
        <div class="box glitch">
            <h3>Glitch Effect</h3>
        </div>
        
        <div class="box liquid">
            <div class="liquid-wave"></div>
            <h3 style="position: relative; z-index: 1;">Liquid Fill Effect</h3>
        </div>
        
        <div class="box holographic">
            <h3 style="background: rgba(0, 0, 0, 0.7); padding: 5px 15px; border-radius: 20px;">Holographic Effect</h3>
        </div>
        
        <div class="box particle-wave">
            <h3>Particle Wave</h3>
            <div class="wave"></div>
        </div>
        
        <div class="box morph">

        </div>

  @keyframes holographic-matrix {

  @keyframes quantum-entanglement {
    0%, 100% {
      transform: translate(0, 0) scale(1);
      opacity: 1;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.7));
    }

    }
    80% {

  @keyframes singularity-collapse {

    25% {

    }

    100% {

      background: radial-gradient(circle, #ff0066, #000000);
      box-shadow: 0 0 100px #ff0066;

  @keyframes nebula-flow {
    0% {
      background: 
        linear-gradient(45deg, rgba(255, 0, 255, 0.8), rgba(0, 0, 255, 0.5), rgba(0, 255, 255, 0.7)),

    }
    100% {
      background-position: 0% 0%, 30% 30%;
      filter: hue-rotate(360deg) blur(0px);
    }
  }
