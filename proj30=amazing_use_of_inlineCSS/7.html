<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stunning CSS Animations</title>
    <style>
        body {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(45deg, #0f0c29, #302b63, #24243e);
            margin: 0;
            padding: 20px;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
        }
        
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .animation {
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            perspective: 1000px;
        }
        
        .label {
            color: white;
            margin-top: 15px;
            font-weight: 500;
            text-align: center;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        h1 {
            color: white;
            text-align: center;
            width: 100%;
            font-size: 2.8rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6);
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleGlow 3s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <h1>Stunning CSS Animations</h1>
    
    <div class="container">
        <!-- Animation 1: Quantum Singularity -->
        <div class="animation">
            <div style="width: 100px; height: 100px; background: radial-gradient(circle at center, #8A2BE2, #4B0082, #000000); border-radius: 50%; box-shadow: 0 0 40px #9370DB, 0 0 60px #8A2BE2; animation: singularity 3s ease-in-out infinite;"></div>
            <div class="label">Quantum Singularity</div>
        </div>

        <!-- Animation 2: Neon Pulse -->
        <div class="animation">
            <div style="width: 120px; height: 120px; background: #000; border: 3px solid #FF00FF; border-radius: 50%; box-shadow: 0 0 20px #FF00FF, inset 0 0 20px #FF00FF; animation: neonPulse 1.5s ease-in-out infinite;"></div>
            <div class="label">Neon Pulse</div>
        </div>

        <!-- Animation 3: Liquid Metal -->
        <div class="animation">
            <div style="width: 100px; height: 100px; background: linear-gradient(145deg, #e0e0e0, #c0c0c0); border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; box-shadow: 0 0 30px rgba(192, 192, 192, 0.8); animation: liquidMetal 4s ease-in-out infinite;"></div>
            <div class="label">Liquid Metal</div>
        </div>

        <!-- Animation 4: Cyber Core -->
        <div class="animation">
            <div style="width: 100px; height: 100px; background: conic-gradient(from 0deg, #00ff88, #00ff88 20%, transparent 20%, transparent 80%, #00ff88 80%, #00ff88); border-radius: 50%; box-shadow: 0 0 40px #00ff88; animation: cyberCore 2s linear infinite;"></div>
            <div class="label">Cyber Core</div>
        </div>

        <!-- Animation 5: Holographic Sphere -->
        <div class="animation">
            <div style="width: 100px; height: 100px; background: conic-gradient(from 0deg, transparent, #00ffff, #ff00ff, #00ffff, transparent); border-radius: 50%; box-shadow: 0 0 50px rgba(0, 255, 255, 0.7); animation: hologramSpin 4s linear infinite;"></div>
            <div class="label">Holographic Sphere</div>
        </div>

        <!-- Animation 6: Plasma Orb -->
        <div class="animation">
            <div style="width: 100px; height: 100px; background: radial-gradient(circle at 30% 30%, #ff6b6b, #ff3838, #000000); border-radius: 50%; box-shadow: 0 0 50px #ff6b6b, 0 0 70px #ff3838; animation: plasmaPulse 2s ease-in-out infinite;"></div>
            <div class="label">Plasma Orb</div>
        </div>

        <!-- Animation 7: Crystal Matrix -->
        <div class="animation">
            <div style="width: 100px; height: 100px; background: linear-gradient(45deg, #00ff88 0%, #00ff88 50%, transparent 50%, transparent 100%), linear-gradient(-45deg, #00ff88 0%, #00ff88 50%, transparent 50%, transparent 100%); background-size: 20px 20px; box-shadow: 0 0 30px #00ff88; animation: matrixMove 1.5s linear infinite;"></div>
            <div class="label">Crystal Matrix</div>
        </div>

        <!-- Animation 8: Cosmic Energy -->
        <div class="animation">
            <div style="width: 120px; height: 120px; background: radial-gradient(circle at center, #4ecdc4, #1a1a1a); border-radius: 50%; box-shadow: 0 0 40px #4ecdc4; position: relative; animation: cosmicEnergy 3s ease-in-out infinite;">
                <div style="width: 20px; height: 20px; background: #4ecdc4; border-radius: 50%; position: absolute; top: 20px; left: 50px; animation: energyOrbit 3s linear infinite;"></div>
            </div>
            <div class="label">Cosmic Energy</div>
        </div>

        <!-- Animation 9: Digital Fire -->
        <div class="animation">
            <div style="width: 100px; height: 150px; background: linear-gradient(to top, #ff6b6b, #ff9a3c, #ffe259); border-radius: 50% 50% 20% 20%; box-shadow: 0 0 40px #ff9a3c; animation: digitalFire 2s ease-in-out infinite;"></div>
            <div class="label">Digital Fire</div>
        </div>

        <!-- Animation 10: Neural Nexus -->
        <div class="animation">
            <div style="width: 120px; height: 120px; background: radial-gradient(circle at center, #0abde3, #1a1a2e); border-radius: 50%; box-shadow: 0 0 30px #0abde3; position: relative; animation: neuralPulse 3s ease-in-out infinite;">
                <div style="width: 10px; height: 10px; background: #0abde3; border-radius: 50%; position: absolute; top: 30px; left: 30px; animation: neuronPulse 2s ease-in-out infinite;"></div>
            </div>
            <div class="label">Neural Nexus</div>
        </div>

        <!-- Animation 11: Prism Light -->
        <div class="animation">
            <div style="width: 100px; height: 100px; background: conic-gradient(from 0deg, red, orange, yellow, green, blue, indigo, violet, red); border-radius: 50%; box-shadow: 0 0 40px rgba(255, 255, 255, 0.5); animation: prismSpin 4s linear infinite;"></div>
            <div class="label">Prism Light</div>
        </div>

        <!-- Animation 12: Quantum Flux -->
        <div class="animation">
            <div style="width: 100px; height: 100px; background: radial-gradient(circle at 30% 30%, #9b59b6, #3498db, #1a1a1a); border-radius: 50%; box-shadow: 0 0 50px #9b59b6; animation: quantumFlux 3s ease-in-out infinite;"></div>
            <div class="label">Quantum Flux</div>
        </div>
    </div>

    <style>
        @keyframes singularity {
            0%, 100% { transform: scale(1) rotate(0deg); filter: hue-rotate(0deg) blur(0); }
            50% { transform: scale(1.2) rotate(180deg); filter: hue-rotate(180deg) blur(5px); }
        }
        
        @keyframes neonPulse {
            0%, 100% { box-shadow: 0 0 20px #FF00FF, inset 0 0 20px #FF00FF; opacity: 0.8; }
            50% { box-shadow: 0 0 40px #FF00FF, inset 0 0 40px #FF00FF; opacity: 1; }
        }
        
        @keyframes liquidMetal {
            0%, 100% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; transform: rotate(0deg); }
            33% { border-radius: 60% 40% 30% 70% / 30% 70% 30% 70%; transform: rotate(120deg); }
            66% { border-radius: 40% 60% 70% 30% / 70% 30% 70% 30%; transform: rotate(240deg); }
        }
        
        @keyframes cyberCore {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes hologramSpin {
            from { transform: rotateY(0deg) rotateX(0deg); filter: hue-rotate(0deg); }
            to { transform: rotateY(360deg) rotateX(360deg); filter: hue-rotate(360deg); }
        }
        
        @keyframes plasmaPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 50px #ff6b6b, 0 0 70px #ff3838; }
            50% { transform: scale(1.2); box-shadow: 0 0 70px #ff6b6b, 0 0 100px #ff3838; }
        }
        
        @keyframes matrixMove {
            0% { background-position: 0 0; }
            100% { background-position: 20px 20px; }
        }
        
        @keyframes cosmicEnergy {
            0%, 100% { box-shadow: 0 0 40px #4ecdc4; transform: scale(1); }
            50% { box-shadow: 0 0 60px #4ecdc4, 0 0 80px #4ecdc4; transform: scale(1.1); }
        }
        
        @keyframes energyOrbit {
            0% { transform: translate(-50%, -50%) rotate(0deg) translateX(40px) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg) translateX(40px) rotate(-360deg); }
        }
        
        @keyframes digitalFire {
            0%, 100% { background: linear-gradient(to top, #ff6b6b, #ff9a3c, #ffe259); box-shadow: 0 0 40px #ff9a3c; }
            50% { background: linear-gradient(to top, #ffe259, #ff9a3c, #ff6b6b); box-shadow: 0 0 60px #ff9a3c, 0 0 80px #ff6b6b; }
        }
        
        @keyframes neuralPulse {
            0%, 100% { box-shadow: 0 0 30px #0abde3; transform: scale(1); }
            50% { box-shadow: 0 0 50px #0abde3, 0 0 70px #0abde3; transform: scale(1.1); }
        }
        
        @keyframes neuronPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 10px #0abde3; }
            50% { transform: scale(1.5); box-shadow: 0 0 20px #0abde3; }
        }
        
        @keyframes prismSpin {
            from { transform: rotate(0deg); filter: hue-rotate(0deg); }
            to { transform: rotate(360deg); filter: hue-rotate(360deg); }
        }
        
        @keyframes quantumFlux {
            0%, 100% { transform: scale(1) rotate(0deg); filter: hue-rotate(0deg); }
            33% { transform: scale(1.1) rotate(120deg); filter: hue-rotate(120deg); }
            66% { transform: scale(1.2) rotate(240deg); filter: hue-rotate(240deg); }
        }
        
        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 10px #ff6b6b, 0 0 20px #4ecdc4; }
            50% { text-shadow: 0 0 20px #ff6b6b, 0 0 40px #4ecdc4, 0 0 60px #45b7d1; }
        }
    </style>
</body>
</html>
