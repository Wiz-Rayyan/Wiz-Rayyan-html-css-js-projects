<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Google UI Clone - Demo</title>
  <!-- Google Fonts: Product Sans style (using Inter as modern substitute) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 Free (icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #ffffff;
      color: #202124;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ========= NAVBAR (top bar) ========= */
    .nav-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 14px 28px;
      gap: 20px;
      font-size: 13px;
    }

    .nav-link {
      text-decoration: none;
      color: #202124;
      font-size: 13.5px;
      cursor: pointer;
    }

    .nav-link:hover {
      text-decoration: underline;
    }

    .apps-icon {
      color: #5f6368;
      font-size: 18px;
      padding: 8px;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.2s;
    }

    .apps-icon:hover {
      background-color: #f1f3f4;
    }

    .signin-btn {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 8px 22px;
      border-radius: 24px;
      font-family: inherit;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .signin-btn:hover {
      background-color: #1b66c9;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    /* ========= MAIN CONTENT (centered) ========= */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin-top: -8vh;
    }

    /* Google logo (modern 2025 style) */
    .logo {
      margin-bottom: 28px;
      text-align: center;
    }

    .google-text {
      font-size: 5.5rem;
      font-weight: 600;
      letter-spacing: -3px;
      background: linear-gradient(135deg, #4285F4, #EA4335, #FBBC05, #34A853);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: none;
      cursor: pointer;
    }

    /* Search container */
    .search-container {
      width: 100%;
      max-width: 584px;
      margin: 0 auto;
    }

    .search-box {
      width: 100%;
      border: 1px solid #dfe1e5;
      border-radius: 40px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: white;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .search-box:hover, .search-box:focus-within {
      box-shadow: 0 1px 6px rgba(32,33,36,0.28);
      border-color: rgba(223,225,229,0);
    }

    .search-icon {
      color: #9aa0a6;
      font-size: 1.1rem;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 1rem;
      font-family: inherit;
      background: transparent;
      color: #202124;
    }

    .search-input::placeholder {
      color: #9aa0a6;
      font-weight: 400;
    }

    .mic-icon, .camera-icon {
      color: #4285F4;
      font-size: 1.25rem;
      cursor: pointer;
      padding: 4px;
      border-radius: 50%;
      transition: background 0.2s;
    }

    .mic-icon:hover, .camera-icon:hover {
      background: #f1f3f4;
    }

    /* Buttons */
    .buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .google-btn {
      background-color: #f8f9fa;
      border: 1px solid #f8f9fa;
      border-radius: 4px;
      color: #3c4043;
      font-family: inherit;
      font-size: 14px;
      padding: 10px 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .google-btn:hover {
      box-shadow: 0 1px 1px rgba(0,0,0,0.1);
      background-color: #f8f9fa;
      border-color: #dadce0;
      color: #202124;
    }

    /* Language offering */
    .language-offer {
      margin-top: 32px;
      font-size: 13px;
      color: #3c4043;
      text-align: center;
    }

    .lang-link {
      color: #1a0dab;
      text-decoration: none;
      margin: 0 5px;
      cursor: pointer;
    }

    .lang-link:hover {
      text-decoration: underline;
    }

    /* ========= FOOTER ========= */
    .footer {
      background-color: #f2f2f2;
      color: #70757a;
      font-size: 14px;
      width: 100%;
    }

    .footer-country {
      padding: 14px 30px;
      border-bottom: 1px solid #dadce0;
      font-size: 15px;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      padding: 14px 30px;
    }

    .footer-left, .footer-right {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
    }

    .footer-link {
      color: #70757a;
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
    }

    .footer-link:hover {
      text-decoration: underline;
    }

    /* Fake toast / alert */
    .toast-message {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #202124e6;
      backdrop-filter: blur(8px);
      color: white;
      padding: 10px 24px;
      border-radius: 36px;
      font-size: 0.85rem;
      font-weight: 500;
      z-index: 1000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      white-space: nowrap;
      font-family: monospace;
      letter-spacing: 0.3px;
    }

    /* Micro-interactions */
    button, .nav-link, .apps-icon, .lang-link, .footer-link, .mic-icon, .camera-icon {
      cursor: pointer;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .google-text { font-size: 3.8rem; letter-spacing: -2px; }
      .search-box { padding: 10px 14px; }
      .buttons { gap: 12px; }
      .footer-links { flex-direction: column; align-items: center; gap: 12px; }
      .footer-left, .footer-right { justify-content: center; gap: 20px; }
      .toast-message { white-space: normal; text-align: center; max-width: 85%; font-size: 12px; }
    }
  </style>
</head>
<body>

<div class="nav-bar">
  <a class="nav-link" id="gmailLink">Gmail</a>
  <a class="nav-link" id="imagesLink">Images</a>
  <div class="apps-icon" id="appsIcon">
    <i class="fas fa-th"></i>
  </div>
  <button class="signin-btn" id="signinBtn">Sign in</button>
</div>

<div class="main-content">
  <div class="logo">
    <div class="google-text">Google</div>
  </div>

  <div class="search-container">
    <div class="search-box">
      <i class="fas fa-search search-icon"></i>
      <input type="text" class="search-input" id="searchInput" placeholder="Search Google or type a URL" autocomplete="off">
      <i class="fas fa-microphone mic-icon" id="micBtn"></i>
      <i class="fas fa-camera camera-icon" id="cameraBtn"></i>
    </div>
    <div class="buttons">
      <button class="google-btn" id="searchBtn">Google Search</button>
      <button class="google-btn" id="luckyBtn">I'm Feeling Lucky</button>
    </div>
    <div class="language-offer">
      Google offered in: 
      <span class="lang-link" data-lang="हिन्दी">हिन्दी</span> 
      <span class="lang-link" data-lang="বাংলা">বাংলা</span> 
      <span class="lang-link" data-lang="తెలుగు">తెలుగు</span> 
      <span class="lang-link" data-lang="தமிழ்">தமிழ்</span> 
      <span class="lang-link" data-lang="മലയാളം">മലയാളം</span>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="footer-country">
    India
  </div>
  <div class="footer-links">
    <div class="footer-left">
      <span class="footer-link" id="aboutLink">About</span>
      <span class="footer-link" id="advertisingLink">Advertising</span>
      <span class="footer-link" id="businessLink">Business</span>
      <span class="footer-link" id="howSearchWorks">How Search works</span>
    </div>
    <div class="footer-right">
      <span class="footer-link" id="privacyLink">Privacy</span>
      <span class="footer-link" id="termsLink">Terms</span>
      <span class="footer-link" id="settingsLink">Settings</span>
    </div>
  </div>
</footer>

<div id="toastMsg" class="toast-message">✨ Demo interaction</div>

<script>
  // Fake toast notification helper
  function showFakeAlert(message, duration = 2000) {
    const toast = document.getElementById('toastMsg');
    if (!toast) return;
    toast.textContent = message || "🔍 Demo: UI clone — no actual search performed.";
    toast.style.opacity = '1';
    setTimeout(() => {
      toast.style.opacity = '0';
    }, duration);
  }

  // Fake search feedback (shows a demo message instead of actual navigation)
  function handleFakeSearch() {
    const query = document.getElementById('searchInput').value.trim();
    if (query === "") {
      showFakeAlert("📋 Enter a search term to see the demo effect (no real search)");
    } else {
      showFakeAlert(`🔎 Demo search for “${query}” — Google clone UI (fake functionality)`);
      // Optional: slight flair — clear input after? no, but add some fun
      document.getElementById('searchInput').blur();
    }
  }

  // "I'm feeling lucky" random funny demo messages
  const luckyMessages = [
    "✨ You're feeling lucky! (but this is a UI clone)",
    "🍀 Lucky click! Try Google for real results →",
    "🎲 Fake luck: maybe try the real Google.com?",
    "🌈 No redirects — pure front-end demo.",
    "⭐ You win a virtual high-five! 🙌"
  ];
  
  function handleLuckyFake() {
    const randomMsg = luckyMessages[Math.floor(Math.random() * luckyMessages.length)];
    showFakeAlert(randomMsg);
    // bonus: set placeholder to something fun?
    const inputField = document.getElementById('searchInput');
    if (inputField.value === "") {
      inputField.placeholder = "Feeling lucky... ✨";
      setTimeout(() => {
        inputField.placeholder = "Search Google or type a URL";
      }, 2000);
    } else {
      showFakeAlert(`🍀 "${inputField.value}" — nice try! Demo only.`);
    }
  }

  // Language changer demo (fake)
  function fakeLanguageChange(language) {
    showFakeAlert(`🌐 Language preference set to ${language} (demo UI — no actual change)`);
    // cosmetic: update footer country for fun?
    const countryDiv = document.querySelector('.footer-country');
    if (countryDiv && language) {
      const original = countryDiv.innerText;
      countryDiv.innerText = `${language} (demo)`;
      setTimeout(() => {
        countryDiv.innerText = original;
      }, 1800);
    }
  }

  // All footer / nav fake actions
  function bindFakeInteractions() {
    // gmail & images
    document.getElementById('gmailLink')?.addEventListener('click', () => showFakeAlert("📧 Gmail dashboard would open — this is a Google UI clone."));
    document.getElementById('imagesLink')?.addEventListener('click', () => showFakeAlert("🖼️ Google Images — demo mode, no actual image results."));
    document.getElementById('appsIcon')?.addEventListener('click', () => showFakeAlert("📱 App launcher grid (demo) — real Google apps not integrated."));
    document.getElementById('signinBtn')?.addEventListener('click', () => showFakeAlert("🔐 Sign in mock-up — no credentials are required or stored in this demo."));
    
    // search and lucky
    document.getElementById('searchBtn')?.addEventListener('click', handleFakeSearch);
    document.getElementById('luckyBtn')?.addEventListener('click', handleLuckyFake);
    
    // Enter key on search input
    const searchInputElem = document.getElementById('searchInput');
    if (searchInputElem) {
      searchInputElem.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleFakeSearch();
        }
      });
    }

    // mic and camera (fun demo alerts)
    document.getElementById('micBtn')?.addEventListener('click', () => showFakeAlert("🎙️ Voice search is a demo — microphone not actually active (UI clone)"));
    document.getElementById('cameraBtn')?.addEventListener('click', () => showFakeAlert("📷 Google Lens demo — camera integration is fake, just for UI experience."));

    // language links
    document.querySelectorAll('.lang-link').forEach(el => {
      el.addEventListener('click', (e) => {
        const lang = e.target.getAttribute('data-lang') || e.target.innerText;
        fakeLanguageChange(lang);
      });
    });

    // footer links 
    const footerActions = [
      { id: 'aboutLink', msg: 'ℹ️ About Google (demo) — this is a frontend clone.' },
      { id: 'advertisingLink', msg: '📢 Advertising page mockup — no real data.' },
      { id: 'businessLink', msg: '💼 Business solutions — demo interface only.' },
      { id: 'howSearchWorks', msg: '🔍 How Search works — informational demo clone.' },
      { id: 'privacyLink', msg: '🔒 Privacy policy (dummy text) — real policy at google.com.' },
      { id: 'termsLink', msg: '📜 Terms of Service demo — UI replica.' },
      { id: 'settingsLink', msg: '⚙️ Settings — this would open preferences, but demo mode.' }
    ];
    footerActions.forEach(action => {
      const element = document.getElementById(action.id);
      if (element) {
        element.addEventListener('click', () => showFakeAlert(action.msg));
      }
    });

    // optional: add small animation for google logo hover
    const logoDiv = document.querySelector('.google-text');
    if (logoDiv) {
      logoDiv.addEventListener('click', () => showFakeAlert("🔁 Google homepage reload (simulated — no actual reload)"));
    }
  }

  // Extra: add dynamic placeholder variations (just for playful demo)
  function addDynamicPlaceholderHint() {
    const inputField = document.getElementById('searchInput');
    if (!inputField) return;
    const messages = ["Search anything... (demo)", "Try 'fake clone'", "Type something", "UI replica"];
    let idx = 0;
    setInterval(() => {
      if (document.activeElement !== inputField && inputField.value === "") {
        idx = (idx + 1) % messages.length;
        inputField.placeholder = messages[idx];
      }
    }, 2800);
  }

  // right click suppression / not needed, but adds polish: disable context menu on clone? not necessary
  // but we can avoid accidental right-click confusion
  document.addEventListener('contextmenu', (e) => {
    // allow normal behavior but show small alert if someone tries to "inspect" via right-click? not needed but fun
    // not intrusive, but for educational clarity we can just do nothing, it's okay.
    // however to not annoy, skip.
  });

  // also ensure that any form-like behavior doesn't reload the page
  document.querySelectorAll('form, .search-box').forEach(el => {
    if (el.tagName === 'FORM') {
      el.addEventListener('submit', (e) => e.preventDefault());
    }
  });
  // prevent any accidental anchor jumps
  document.querySelectorAll('a, .nav-link, .footer-link, .lang-link').forEach(link => {
    link.addEventListener('click', (e) => {
      // but we already have events, just prevent default only if it's a dummy link without real href.
      if (link.getAttribute('href') === '#' || link.getAttribute('href') === 'javascript:void(0)') {
        e.preventDefault();
      }
    });
  });

  // include a fake 'search by image' demo we can trigger from camera icon already
  // additional feature: if the user double clicks the logo, show easter egg
  const logoElement = document.querySelector('.google-text');
  if (logoElement) {
    logoElement.addEventListener('dblclick', () => {
      showFakeAlert("🎉 Easter egg: This is a 100% front-end clone of Google.com UI. All interactions are fake!", 2500);
    });
  }

  // init
  bindFakeInteractions();
  addDynamicPlaceholderHint();

  // also console warning for developers (not harmful)
  console.log("🔵 Google UI Clone | Fake functionality mode — all buttons & search show demo alerts. No data leaves your browser.");
</script>
</body>
</html>
