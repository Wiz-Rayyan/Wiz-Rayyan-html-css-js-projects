<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>YouTube UI Clone - FakeTube</title>
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: #0f0f0f;
      color: #f1f1f1;
      overflow-x: hidden;
    }

    /* ========= HEADER / NAVBAR ========= */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background-color: #0f0f0f;
      position: sticky;
      top: 0;
      z-index: 100;
      height: 56px;
    }

    .left-section {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .menu-icon, .youtube-logo {
      cursor: pointer;
    }

    .youtube-logo {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .yt-icon {
      color: #ff0000;
      font-size: 1.6rem;
    }

    .middle-section {
      flex: 1;
      max-width: 600px;
      display: flex;
      margin: 0 20px;
    }

    .search-bar {
      display: flex;
      flex: 1;
    }

    .search-input {
      width: 100%;
      background: #121212;
      border: 1px solid #303030;
      border-radius: 40px 0 0 40px;
      padding: 8px 16px;
      color: white;
      font-size: 1rem;
      outline: none;
    }

    .search-btn {
      background: #222222;
      border: 1px solid #303030;
      border-left: none;
      border-radius: 0 40px 40px 0;
      padding: 0 20px;
      cursor: pointer;
      color: #aaa;
    }

    .voice-btn {
      background: #181818;
      border: none;
      border-radius: 50%;
      width: 40px;
      margin-left: 10px;
      cursor: pointer;
      color: #fff;
    }

    .right-section {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: #f1f1f1;
      font-size: 1.4rem;
      cursor: pointer;
    }

    .avatar {
      width: 32px;
      height: 32px;
      background: #3ea6ff;
      border-radius: 50%;
      background-image: url('https://ui-avatars.com/api/?background=3ea6ff&color=fff&name=U');
      background-size: cover;
      cursor: pointer;
    }

    /* ========= LAYOUT: SIDEBAR + MAIN ========= */
    .app-container {
      display: flex;
    }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      background-color: #0f0f0f;
      height: calc(100vh - 56px);
      position: sticky;
      top: 56px;
      overflow-y: auto;
      padding: 12px 0;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 8px 24px;
      cursor: pointer;
      transition: background 0.1s;
      border-radius: 10px;
      margin: 2px 8px;
    }

    .sidebar-item:hover {
      background: #272727;
    }

    .sidebar-item i {
      width: 24px;
      font-size: 1.2rem;
    }

    .sidebar-item span {
      font-size: 0.9rem;
      font-weight: 500;
    }

    hr {
      margin: 12px 0;
      border-color: #303030;
    }

    /* MAIN CONTENT (VIDEO GRID) */
    .main-content {
      flex: 1;
      padding: 20px 24px;
    }

    .chip-bar {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 20px;
      white-space: nowrap;
    }

    .chip {
      background: #272727;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.1s;
    }

    .chip.active {
      background: #fff;
      color: #0f0f0f;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 28px 16px;
    }

    .video-card {
      cursor: pointer;
      transition: transform 0.1s;
    }

    .thumbnail {
      width: 100%;
      border-radius: 12px;
      background-color: #272727;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .video-details {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    .channel-avatar {
      width: 36px;
      height: 36px;
      background: #aaa;
      border-radius: 50%;
      background-size: cover;
    }

    .video-info h4 {
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .video-meta {
      font-size: 0.75rem;
      color: #aaa;
    }

    /* toast */
    .toast-msg {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #272727;
      color: white;
      padding: 10px 24px;
      border-radius: 40px;
      font-size: 14px;
      z-index: 200;
      pointer-events: none;
      opacity: 0;
      transition: 0.2s;
      backdrop-filter: blur(8px);
    }

    @media (max-width: 800px) {
      .sidebar {
        display: none;
      }
      .video-grid {
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="left-section">
    <div class="menu-icon" id="menuIcon"><i class="fas fa-bars"></i></div>
    <div class="youtube-logo" id="logoBtn">
      <i class="fab fa-youtube yt-icon"></i>
      <span>FakeTube</span>
    </div>
  </div>
  <div class="middle-section">
    <div class="search-bar">
      <input type="text" class="search-input" id="searchInput" placeholder="Search">
      <button class="search-btn" id="searchBtn"><i class="fas fa-search"></i></button>
    </div>
    <button class="voice-btn" id="voiceBtn"><i class="fas fa-microphone"></i></button>
  </div>
  <div class="right-section">
    <button class="icon-btn" id="uploadBtn"><i class="fas fa-video"></i></button>
    <button class="icon-btn" id="notifBtn"><i class="fas fa-bell"></i></button>
    <div class="avatar" id="avatarBtn"></div>
  </div>
</div>

<div class="app-container">
  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-item" data-nav="home"><i class="fas fa-home"></i><span>Home</span></div>
    <div class="sidebar-item" data-nav="shorts"><i class="fas fa-fire"></i><span>Shorts</span></div>
    <div class="sidebar-item" data-nav="subscriptions"><i class="fas fa-layer-group"></i><span>Subscriptions</span></div>
    <hr>
    <div class="sidebar-item" data-nav="library"><i class="fas fa-folder"></i><span>Library</span></div>
    <div class="sidebar-item" data-nav="history"><i class="fas fa-clock"></i><span>History</span></div>
    <div class="sidebar-item" data-nav="videos"><i class="fas fa-play-circle"></i><span>Your videos</span></div>
    <div class="sidebar-item" data-nav="later"><i class="fas fa-clock"></i><span>Watch later</span></div>
    <hr>
    <div class="sidebar-item" data-nav="trending"><i class="fas fa-chart-line"></i><span>Trending</span></div>
    <div class="sidebar-item" data-nav="music"><i class="fas fa-music"></i><span>Music</span></div>
    <div class="sidebar-item" data-nav="gaming"><i class="fas fa-gamepad"></i><span>Gaming</span></div>
    <div class="sidebar-item" data-nav="news"><i class="fas fa-newspaper"></i><span>News</span></div>
  </div>

  <!-- MAIN VIDEO FEED -->
  <div class="main-content">
    <div class="chip-bar" id="chipBar">
      <div class="chip active">All</div>
      <div class="chip">JavaScript</div>
      <div class="chip">UI Design</div>
      <div class="chip">Music</div>
      <div class="chip">Live</div>
      <div class="chip">Gaming</div>
      <div class="chip">Trending</div>
      <div class="chip">AI</div>
    </div>
    <div class="video-grid" id="videoGrid"></div>
  </div>
</div>

<div id="toastMessage" class="toast-msg">✨ FakeTube demo — UI clone</div>

<script>
  // fake toast
  function showFakeAlert(msg) {
    const toast = document.getElementById('toastMessage');
    toast.textContent = msg || "📺 YouTube UI clone — interactive demo";
    toast.style.opacity = "1";
    setTimeout(() => toast.style.opacity = "0", 1800);
  }

  // sample video data (fake)
  let videos = [
    { id: 1, title: "Building a YouTube Clone with HTML/CSS | UI Challenge", channel: "FakeDev", channelAvatar: "https://ui-avatars.com/api/?background=ff5e5e&name=FD&size=36", views: "245K", time: "2 days ago", thumbnail: "https://picsum.photos/id/26/400/225", duration: "12:34" },
    { id: 2, title: "Top 10 JavaScript Tricks 🔥", channel: "CodeMagic", channelAvatar: "https://ui-avatars.com/api/?background=3b82f6&name=CM&size=36", views: "120K", time: "1 week ago", thumbnail: "https://picsum.photos/id/0/400/225", duration: "8:22" },
    { id: 3, title: "Lofi Hip Hop Radio - Beats to Relax", channel: "Chill Beats", channelAvatar: "https://ui-avatars.com/api/?background=10b981&name=CB&size=36", views: "1.2M", time: "3 months ago", thumbnail: "https://picsum.photos/id/169/400/225", duration: "1:23:45" },
    { id: 4, title: "React vs Vue 2026 - Which one to learn?", channel: "TechTalk", channelAvatar: "https://ui-avatars.com/api/?background=8b5cf6&name=TT&size=36", views: "89K", time: "5 days ago", thumbnail: "https://picsum.photos/id/91/400/225", duration: "15:10" },
    { id: 5, title: "I made a Twitter clone in 2 hours", channel: "BuildFast", channelAvatar: "https://ui-avatars.com/api/?background=ef4444&name=BF&size=36", views: "50K", time: "12 hours ago", thumbnail: "https://picsum.photos/id/155/400/225", duration: "9:47" },
    { id: 6, title: "CSS Grid Crash Course", channel: "WebDesign Hub", channelAvatar: "https://ui-avatars.com/api/?background=06b6d4&name=WH&size=36", views: "310K", time: "1 month ago", thumbnail: "https://picsum.photos/id/20/400/225", duration: "22:03" },
    { id: 7, title: "The Ultimate Fake UI Compilation", channel: "UI Universe", channelAvatar: "https://ui-avatars.com/api/?background=f97316&name=UU&size=36", views: "77K", time: "3 days ago", thumbnail: "https://picsum.photos/id/47/400/225", duration: "5:16" },
    { id: 8, title: "Next.js 15 Features Explained", channel: "NextMaster", channelAvatar: "https://ui-avatars.com/api/?background=14b8a6&name=NM&size=36", views: "202K", time: "1 week ago", thumbnail: "https://picsum.photos/id/76/400/225", duration: "18:30" }
  ];

  function renderVideos(videoArray) {
    const grid = document.getElementById('videoGrid');
    if (!grid) return;
    grid.innerHTML = "";
    videoArray.forEach(v => {
      const card = document.createElement('div');
      card.className = 'video-card';
      card.setAttribute('data-id', v.id);
      card.innerHTML = `
        <div class="thumbnail-wrapper" style="position: relative;">
          <img class="thumbnail" src="${v.thumbnail}" alt="thumbnail" loading="lazy">
          <span style="position: absolute; bottom: 8px; right: 6px; background: rgba(0,0,0,0.8); padding: 2px 4px; border-radius: 4px; font-size: 0.7rem;">${v.duration}</span>
        </div>
        <div class="video-details">
          <div class="channel-avatar" style="background-image: url('${v.channelAvatar}');"></div>
          <div class="video-info">
            <h4>${escapeHtml(v.title)}</h4>
            <div class="video-meta">${escapeHtml(v.channel)}</div>
            <div class="video-meta">${v.views} views • ${v.time}</div>
          </div>
        </div>
      `;
      card.addEventListener('click', () => {
        showFakeAlert(`🎬 Playing demo: "${v.title}" (UI clone — video player simulation)`);
      });
      grid.appendChild(card);
    });
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // filter simulation (fake search)
  function fakeSearch(query) {
    if (!query.trim()) {
      renderVideos(videos);
      showFakeAlert("🔍 Showing all videos (demo mode)");
      return;
    }
    const filtered = videos.filter(v => v.title.toLowerCase().includes(query.toLowerCase()) || v.channel.toLowerCase().includes(query.toLowerCase()));
    renderVideos(filtered);
    showFakeAlert(`🔎 ${filtered.length} results for "${query}" (fake search)`);
  }

  // Sidebar & nav fake interactions
  function bindUIEvents() {
    document.getElementById('searchBtn')?.addEventListener('click', () => {
      const query = document.getElementById('searchInput').value;
      fakeSearch(query);
    });
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
      searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') fakeSearch(searchInput.value);
      });
    }
    document.getElementById('voiceBtn')?.addEventListener('click', () => showFakeAlert("🎙️ Voice search demo (no actual microphone)"));
    document.getElementById('uploadBtn')?.addEventListener('click', () => showFakeAlert("📤 Upload video — demo interface, no real upload"));
    document.getElementById('notifBtn')?.addEventListener('click', () => showFakeAlert("🔔 Notifications (fake) — this is a UI clone"));
    document.getElementById('avatarBtn')?.addEventListener('click', () => showFakeAlert("👤 Account menu — demo only"));
    document.getElementById('menuIcon')?.addEventListener('click', () => showFakeAlert("📁 Sidebar toggle would collapse (demo)"));
    document.getElementById('logoBtn')?.addEventListener('click', () => {
      renderVideos(videos);
      if (searchInput) searchInput.value = "";
      showFakeAlert("🏠 Home feed refreshed (FakeTube)");
    });

    // chip filtering (fake category filter)
    const chips = document.querySelectorAll('.chip');
    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        chips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        const category = chip.innerText.toLowerCase();
        if (category === 'all') {
          renderVideos(videos);
          showFakeAlert(`📺 Showing all videos`);
        } else {
          const filtered = videos.filter(v => v.title.toLowerCase().includes(category) || v.channel.toLowerCase().includes(category));
          renderVideos(filtered);
          showFakeAlert(`🏷️ Showing ${category} videos (demo feed)`);
        }
      });
    });

    // sidebar items
    const sidebarItems = document.querySelectorAll('.sidebar-item');
    sidebarItems.forEach(item => {
      item.addEventListener('click', (e) => {
        const nav = item.getAttribute('data-nav') || item.innerText.trim();
        showFakeAlert(`🧭 Navigate to ${nav} (UI demo — static clone)`);
        if (nav === 'home') renderVideos(videos);
        else if (nav === 'trending') {
          const trendingCopy = [...videos].sort((a,b) => parseInt(b.views) - parseInt(a.views));
          renderVideos(trendingCopy.slice(0,6));
        } else if (nav === 'music') {
          const musicVids = videos.filter(v => v.title.toLowerCase().includes('lofi') || v.channel.toLowerCase().includes('beat'));
          renderVideos(musicVids.length ? musicVids : videos.slice(0,3));
        } else {
          // simple simulation
          renderVideos(videos.slice(0,4));
        }
      });
    });
  }

  // additional mini interaction: like on a video card? Not needed, but we add hover effect and simulate
  function addWatchLaterFake() {
    // just for extra polish — right-click fake
    document.addEventListener('contextmenu', (e) => {
      if (e.target.closest('.video-card')) {
        e.preventDefault();
        showFakeAlert("✨ 'Save to Watch Later' — fake UI feature");
      }
    });
  }

  renderVideos(videos);
  bindUIEvents();
  addWatchLaterFake();

  // optional console style
  console.log("🎬 FakeTube: YouTube UI Clone | All interactions are demo/alerts");
</script>
</body>
</html>
