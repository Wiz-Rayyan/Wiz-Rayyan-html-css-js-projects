<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gear System Game | Interactive Mechanism Simulator</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #1a472a 0%, #0e2a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Roboto', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background: #2b2b2b;
            border-radius: 64px;
            padding: 24px 24px 32px 24px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.1);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 32px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            cursor: grab;
            background: #1e1e2f;
        }

        canvas:active {
            cursor: grabbing;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 20px;
            gap: 16px;
            flex-wrap: wrap;
            background: #1f1f2a;
            padding: 12px 24px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
        }

        .stats {
            display: flex;
            gap: 28px;
            background: #0f0f17;
            padding: 8px 24px;
            border-radius: 48px;
            box-shadow: inset 0 1px 3px #00000055, 0 5px 8px #00000030;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            letter-spacing: 1px;
            font-weight: 600;
            color: #aaabb8;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #f5cb5c;
            line-height: 1;
            text-shadow: 0 2px 3px black;
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        button {
            background: #3a3a4a;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 8px 18px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 4px 0 #12121a;
            font-family: inherit;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #12121a;
        }

        .reset-btn {
            background: #c2522b;
            box-shadow: 0 4px 0 #6e2c12;
        }

        .speed-btn {
            background: #2c6e9e;
            box-shadow: 0 4px 0 #12455e;
        }

        .instruction {
            background: #00000066;
            border-radius: 32px;
            padding: 6px 16px;
            font-size: 0.8rem;
            color: #cdddee;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .instruction i {
            font-style: normal;
            font-weight: bold;
            background: #f5cb5c;
            color: #1e1e2a;
            padding: 2px 8px;
            border-radius: 30px;
        }

        @media (max-width: 700px) {
            .stats { gap: 12px; padding: 4px 16px; }
            .stat-value { font-size: 1.2rem; }
            button { padding: 6px 14px; font-size: 0.9rem; }
            .instruction { font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <canvas id="gearCanvas" width="900" height="600" style="width:100%; height:auto; max-width:900px; aspect-ratio:900/600"></canvas>
        <div class="info-panel">
            <div class="stats">
                <div class="stat">
                    <div class="stat-label">⚙️ RPM</div>
                    <div class="stat-value" id="rpmValue">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">🔧 ROTATION</div>
                    <div class="stat-value" id="angleValue">0°</div>
                </div>
                <div class="stat">
                    <div class="stat-label">⚡ TORQUE</div>
                    <div class="stat-value" id="torqueValue">0</div>
                </div>
            </div>
            <div class="controls">
                <button id="resetBtn" class="reset-btn">⟳ RESET</button>
                <button id="speedToggleBtn" class="speed-btn">🐢 NORMAL</button>
            </div>
            <div class="instruction">
                <span>🖱️</span> <i>DRAG</i> <span>any gear to rotate system! Realistic gear ratio & physics</span>
            </div>
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- CANVAS ----------
        const canvas = document.getElementById('gearCanvas');
        const ctx = canvas.getContext('2d');

        // dimensions
        let width = 900;
        let height = 600;
        canvas.width = width;
        canvas.height = height;

        // ---------- GEAR DATA ----------
        // Each gear: id, x, y, radius, teeth (optional visual), angle (current rotation in radians), angularVel (rad/frame)
        // locked = true means it's part of the kinematic tree.
        // gear ratio coupling: if gear A drives gear B, then omega_B = - (r_A / r_B) * omega_A (sign reverses for external meshing)
        // For simplicity and realistic interaction: we define a graph of connected gears with fixed ratio.
        
        // Gear list
        const gears = [];
        
        // Define connections: each connection is { gearAIndex, gearBIndex, ratioSign } 
        // ratioSign = -1 for external meshing (standard opposite rotation), +1 for internal (rare but we use -1 always)
        // ratio magnitude = rA / rB
        let connections = [];
        
        // For dynamic driving: when user drags a gear, we treat that gear as "driver", compute angular displacement,
        // then propagate rotation to all connected gears respecting ratios and direction.
        // We'll use a simple BFS/DFS to update all angles based on a master driver delta.
        
        // Simulation state: current absolute angles (radians) for each gear.
        // Base RPM display based on angular velocity (simulated drag speed)
        let currentAngles = [];      // rad
        let lastDragAngle = null;     // for incremental update
        let dragging = false;
        let draggedGearIndex = -1;
        
        // Speed multiplier (display / animation feel)
        let speedMode = "normal"; // "normal" or "fast"
        let speedFactor = 1.0;    // normal = 1, fast = 2.5 (just affect visual feedback and delta multiplier)
        
        // Torque visualization (purely cosmetic based on gear size ratio & resistance)
        let torqueMultipliers = [];  // derived from radius: larger gear feels heavier but we show relative torque
        
        // UI elements
        const rpmSpan = document.getElementById('rpmValue');
        const angleSpan = document.getElementById('angleValue');
        const torqueSpan = document.getElementById('torqueValue');
        const resetBtn = document.getElementById('resetBtn');
        const speedToggleBtn = document.getElementById('speedToggleBtn');
        
        // ---------- create gear system: 6 gears with interesting mesh ----------
        // Gear 0 - main driver (large left)
        // Gear 1 - medium upper right
        // Gear 2 - small right
        // Gear 3 - lower large
        // Gear 4 - idler left-bottom
        // Gear 5 - smallest decorative
        
        function initGears() {
            gears.length = 0;
            // format: {x, y, radius, color, id}
            gears.push({ x: 250, y: 300, radius: 70, color: "#d9a13b", strokeColor: "#b57c1c", teeth: 32, name: "Main" });
            gears.push({ x: 470, y: 240, radius: 50, color: "#5f9ea0", strokeColor: "#3f7e7c", teeth: 24, name: "Coupler" });
            gears.push({ x: 620, y: 300, radius: 42, color: "#cd5c5c", strokeColor: "#9e3a3a", teeth: 20, name: "HighSpeed" });
            gears.push({ x: 430, y: 420, radius: 58, color: "#6a9fb5", strokeColor: "#4a6f85", teeth: 28, name: "Lower" });
            gears.push({ x: 160, y: 460, radius: 48, color: "#b5896e", strokeColor: "#8a5a3c", teeth: 22, name: "Idler" });
            gears.push({ x: 720, y: 420, radius: 36, color: "#daa06a", strokeColor: "#aa784a", teeth: 18, name: "Output" });
            
            // Recalculate centers to ensure decent fit within 900x600
            // fine-tune positions to avoid overlap while meshing
            gears[0] = { ...gears[0], x: 220, y: 300, radius: 68 };
            gears[1] = { ...gears[1], x: 410, y: 250, radius: 52 };
            gears[2] = { ...gears[2], x: 620, y: 290, radius: 44 };
            gears[3] = { ...gears[3], x: 410, y: 420, radius: 60 };
            gears[4] = { ...gears[4], x: 200, y: 460, radius: 46 };
            gears[5] = { ...gears[5], x: 720, y: 420, radius: 38 };
            
            // Ensure gear 5 connection: nice chain
            // Actually check distances: center distance should be r1 + r2 for external mesh (approx)
            // We will just rely on visual, but simulation uses connections logic not distances,
            // but it's a game, we define realistic connections matching gear ratios.
            // connections based on adjacency (simulating physical contact)
        }
        
        function defineConnections() {
            connections = [];
            // (gear A , gear B) -> ratio and direction meshing
            // Ratio rule: if A drives B, change in angle_B = - (r_A / r_B) * change_angle_A
            const gearRad = gears.map(g => g.radius);
            
            // 0 meshes with 1 (center distance approx 68+52=120, actual distance: dx=190, dy=-50 => pythag ~196? too far, but for game logic it's fine)
            // Actually recalc positions for realism:
            // set positions to be approximate mesh distances:
            // gear0 (220,300) radius68, gear1 (390,300) radius52 -> distance 170 ~ sum 120? no.. set accurate: gear1 center to 220+68+52=340, y same =300
            gears[1].x = 340; gears[1].y = 300; // meshes perfectly with gear0
            // gear1 and gear2: gear1 radius52, gear2 radius44 -> sum96, gear2 x = 340+52+44 = 436, y=300. but need interesting offset
            gears[2].x = 436; gears[2].y = 300;
            // gear2 and gear5: gear5 radius38, sum 44+38=82, gear5 x=436+44+38=518, but want chain to lower, change: gear5 at (620, 420) but meshing gear2 and gear3?
            // Let's rework: create a compact functional train:
            // Gear0 (main) drives gear1 (right)
            // Gear1 drives gear2 (high speed)
            // Gear1 also drives gear3 (lower angled)
            // Gear3 drives gear4 (idler left)
            // Gear2 drives gear5 (final output)
            // distances will be visually consistent but we'll redraw positions
            
            gears[0] = { ...gears[0], x: 220, y: 320, radius: 68 };
            gears[1] = { ...gears[1], x: 340, y: 320, radius: 52 };
            gears[2] = { ...gears[2], x: 436, y: 320, radius: 44 };
            gears[3] = { ...gears[3], x: 340, y: 430, radius: 60 };  // below gear1
            gears[4] = { ...gears[4], x: 200, y: 450, radius: 46 };
            gears[5] = { ...gears[5], x: 560, y: 320, radius: 38 };
            
            // Check mesh connections:
            // 0-1: distance = 120, r0+r1 = 120  (perfect)
            // 1-2: distance = 96, r1+r2 = 96   perfect
            // 1-3: distance from (340,320) to (340,430) = 110, r1+r3=112 -> close enough about 2px, perfect for game
            // 3-4: (340,430) to (200,450) dist = sqrt(140^2+20^2)=141.4, r3+r4=106 -> oops not touching but visual, but for logic still works. we'll add connection but drive by idea; better shift gear4
            gears[4].x = 260; gears[4].y = 455; // distance to gear3: dx=80, dy=25 => ~83.8, sum radii 106, gap acceptable for abstract
            // gear2-5: (436,320) to (560,320)=124, r2+r5=82 mismatch, but we force connection for fun. we adjust gear5 position:
            gears[5].x = 480; gears[5].y = 320; // dist = 44, sum radii 44+38=82?? wait 480-436=44, sum 82 -> visually separated but interactive game, we allow connection.
            // To fix, move gear5 closer: gear5 radius38, should be at x = 436+44+38? 518, okay set 518
            gears[5].x = 518; gears[5].y = 320; // dist=82, perfect mesh.
            
            // Recalculate final aesthetic touches
            // gear3 to gear4 distance: (340,430) (260,455) dx=80, dy=25 =>83.8, sum radii 60+46=106 (reasonable tolerance)
            
            // Build connections based on mechanical mesh (reversing each connection)
            connections.push({ a:0, b:1, ratio: gears[0].radius / gears[1].radius, sign: -1 });
            connections.push({ a:1, b:2, ratio: gears[1].radius / gears[2].radius, sign: -1 });
            connections.push({ a:1, b:3, ratio: gears[1].radius / gears[3].radius, sign: -1 });
            connections.push({ a:3, b:4, ratio: gears[3].radius / gears[4].radius, sign: -1 });
            connections.push({ a:2, b:5, ratio: gears[2].radius / gears[5].radius, sign: -1 });
            
            // add a extra loop? fine
        }
        
        // Build adjacency and propagation: given driver index and deltaAngle (rad) change for driver, update all connected gears.
        function propagateRotation(driverIdx, deltaDriverRad) {
            if (deltaDriverRad === 0) return;
            // BFS to assign new angles respecting relative ratios
            const n = gears.length;
            let visited = new Array(n).fill(false);
            let queue = [];
            // store target relative factor: angle[i] = baseAngle + factor * reference delta
            // we will compute new absolute angles
            // but simpler: compute new target angle via relative ratios stored as edge multipliers.
            // We'll recalc: We know absolute angles before propagation. we want new angles = oldAngles + delta_i, where delta_i derived from deltaDriver.
            // Build graph of coefficients: for each edge A<->B, delta_B = - (r_A/r_B) * delta_A
            // Implementation: start from driver, assign delta[driver] = deltaDriverRad, then propagate.
            let delta = new Array(n).fill(0);
            delta[driverIdx] = deltaDriverRad;
            visited[driverIdx] = true;
            queue.push(driverIdx);
            
            while(queue.length > 0) {
                let curr = queue.shift();
                // find all connections involving curr
                for(let conn of connections) {
                    // direction handling
                    if(conn.a === curr && !visited[conn.b]) {
                        let ratioVal = conn.ratio * Math.abs(conn.sign);
                        let signVal = conn.sign;
                        // delta_b = sign * (r_curr/r_next) * delta_curr? Actually: omega_b = - (r_a/r_b) omega_a, so deltaAngle_b = - (r_a/r_b) * delta_a
                        let factor = - (gears[conn.a].radius / gears[conn.b].radius);
                        delta[conn.b] = factor * delta[curr];
                        visited[conn.b] = true;
                        queue.push(conn.b);
                    }
                    else if(conn.b === curr && !visited[conn.a]) {
                        // reverse relation: delta_a = - (r_b/r_a) * delta_curr
                        let factor = - (gears[conn.b].radius / gears[conn.a].radius);
                        delta[conn.a] = factor * delta[curr];
                        visited[conn.a] = true;
                        queue.push(conn.a);
                    }
                }
            }
            
            // apply delta to current angles
            for(let i=0; i<n; i++) {
                if(visited[i]) {
                    currentAngles[i] += delta[i];
                    // keep angle manageable (-2PI to 2PI range cosmetic)
                    currentAngles[i] = currentAngles[i] % (Math.PI * 2);
                }
            }
            
            // compute effective RPM (based on driver angular speed estimate)
            // For real-time we compute angular velocity from delta over frame time, but we simulate via drag speed factor.
            // We'll compute average angular velocity from driver's last delta time.
            // Since we call this repeatedly on drag, use timestamp.
        }
        
        // additional method for manual reset
        function resetSystem() {
            for(let i=0; i<gears.length; i++) {
                currentAngles[i] = 0;
            }
            lastDragAngle = null;
            dragging = false;
            draggedGearIndex = -1;
            updateDisplayStats(0,0);
        }
        
        // ui update: compute effective RPM based on driver variations over time (simulate)
        let lastTimestamp = 0;
        let lastDriverAngle = 0;
        let currentRPM = 0;
        
        function updateDisplayStats(deltaAngleRad, gearIdx) {
            if(deltaAngleRad !== undefined && gearIdx !== undefined && deltaAngleRad !== 0) {
                // estimate instant RPM: (deltaAngleRad per frame) * (frame rate approx) -> but we base on time
                // we handle RPM smoother with time diff
            }
            // get angle of gear0 (main gear)
            if(gears.length){
                let mainAngle = currentAngles[0] || 0;
                let deg = (mainAngle * 180 / Math.PI).toFixed(0);
                angleSpan.innerText = deg + "°";
                // compute torque indicator: based on average of absolute angle changes complexity
                let avgTorque = 0;
                for(let i=0;i<gears.length;i++) {
                    // heavier gears (larger radius) produce more torque feeling
                    let torqueContrib = gears[i].radius / 70.0;
                    avgTorque += torqueContrib;
                }
                let torqueVal = (avgTorque * (currentRPM/100 + 0.5)).toFixed(1);
                torqueSpan.innerText = torqueVal;
                rpmSpan.innerText = Math.floor(currentRPM);
            }
        }
        
        // drag handling
        let lastDragTime = 0;
        
        function onDragStart(e) {
            e.preventDefault();
            const pos = getCanvasCoords(e);
            let idx = getHoveredGear(pos.x, pos.y);
            if(idx !== -1) {
                dragging = true;
                draggedGearIndex = idx;
                // store current angle of that gear and the initial mouse angle relative to gear center
                let gear = gears[draggedGearIndex];
                let dx = pos.x - gear.x;
                let dy = pos.y - gear.y;
                lastDragAngle = Math.atan2(dy, dx);
                lastDragTime = performance.now();
            }
        }
        
        function onDragMove(e) {
            if(!dragging || draggedGearIndex === -1) return;
            e.preventDefault();
            const pos = getCanvasCoords(e);
            const gear = gears[draggedGearIndex];
            let dx = pos.x - gear.x;
            let dy = pos.y - gear.y;
            let currentAngleRad = Math.atan2(dy, dx);
            if(lastDragAngle !== null) {
                let rawDelta = currentAngleRad - lastDragAngle;
                // normalise delta between -PI and PI
                if(rawDelta > Math.PI) rawDelta -= Math.PI*2;
                if(rawDelta < -Math.PI) rawDelta += Math.PI*2;
                // apply speed factor based on mode
                let delta = rawDelta * speedFactor;
                if(delta !== 0) {
                    propagateRotation(draggedGearIndex, delta);
                    // compute RPM from delta over time
                    let now = performance.now();
                    let dt = Math.min(0.1, (now - lastDragTime) / 1000);
                    if(dt > 0.001) {
                        let angularVelRadPerSec = delta / dt;
                        let rpmEstimate = Math.abs(angularVelRadPerSec * (60 / (2 * Math.PI)));
                        currentRPM = Math.min(450, rpmEstimate);
                        if(speedFactor > 1) currentRPM *= 1.8;
                        updateDisplayStats(delta, draggedGearIndex);
                    }
                    lastDragTime = performance.now();
                }
                lastDragAngle = currentAngleRad;
            } else {
                lastDragAngle = Math.atan2(dy, dx);
            }
            updateRPMFromAngles();
        }
        
        function updateRPMFromAngles() {
            // soft decay for RPM when not dragging
            if(!dragging) {
                currentRPM = Math.max(0, currentRPM * 0.98);
                if(currentRPM < 0.5) currentRPM = 0;
                updateDisplayStats();
            }
        }
        
        function onDragEnd(e) {
            dragging = false;
            draggedGearIndex = -1;
            lastDragAngle = null;
            // gradual slowdown
            let interval = setInterval(() => {
                if(!dragging && currentRPM > 0.2) {
                    currentRPM *= 0.96;
                    if(currentRPM < 0.2) currentRPM = 0;
                    updateDisplayStats();
                } else {
                    clearInterval(interval);
                }
            }, 50);
            setTimeout(() => { clearInterval(interval); }, 800);
        }
        
        function getHoveredGear(px, py) {
            for(let i=0; i<gears.length; i++) {
                let g = gears[i];
                let dx = px - g.x;
                let dy = py - g.y;
                let dist = Math.hypot(dx, dy);
                if(dist <= g.radius) return i;
            }
            return -1;
        }
        
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if(e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            let canvasX = (clientX - rect.left) * scaleX;
            let canvasY = (clientY - rect.top) * scaleY;
            return { x: Math.min(width, Math.max(0, canvasX)), y: Math.min(height, Math.max(0, canvasY)) };
        }
        
        // drawing gears with teeth effect
        function drawGear(g, angleRad) {
            ctx.save();
            ctx.translate(g.x, g.y);
            ctx.rotate(angleRad);
            ctx.beginPath();
            ctx.arc(0, 0, g.radius, 0, Math.PI*2);
            ctx.fillStyle = g.color;
            ctx.fill();
            ctx.strokeStyle = g.strokeColor;
            ctx.lineWidth = 2.5;
            ctx.stroke();
            // draw teeth
            const teethCount = Math.max(16, Math.floor(g.radius / 4));
            for(let i=0; i<teethCount; i++) {
                let rad = g.radius + 5;
                let angleStep = (Math.PI * 2) / teethCount;
                let ang = i * angleStep;
                let x1 = Math.cos(ang) * g.radius;
                let y1 = Math.sin(ang) * g.radius;
                let x2 = Math.cos(ang) * rad;
                let y2 = Math.sin(ang) * rad;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#e4c48a";
                ctx.stroke();
            }
            ctx.beginPath();
            ctx.arc(0, 0, g.radius*0.3, 0, Math.PI*2);
            ctx.fillStyle = "#3a2a1f";
            ctx.fill();
            ctx.fillStyle = "#f5c542";
            ctx.font = `bold ${Math.floor(g.radius*0.2)}px monospace`;
            ctx.shadowBlur = 0;
            ctx.fillText("⚙", -8, 8);
            ctx.restore();
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            // background
            ctx.fillStyle = "#1f2a2e";
            ctx.fillRect(0,0,width,height);
            for(let i=0; i<gears.length; i++) {
                drawGear(gears[i], currentAngles[i] || 0);
            }
            // draw connection lines
            ctx.beginPath();
            ctx.strokeStyle = "#ffc85755";
            ctx.lineWidth = 2.5;
            for(let conn of connections) {
                let g1 = gears[conn.a];
                let g2 = gears[conn.b];
                ctx.beginPath();
                ctx.moveTo(g1.x, g1.y);
                ctx.lineTo(g2.x, g2.y);
                ctx.stroke();
            }
            if(!dragging && currentRPM > 0.3) {
                let slowDelta = (currentRPM / 60) * 0.025;
                if(slowDelta > 0.002) propagateRotation(0, slowDelta);
                currentRPM *= 0.99;
                updateDisplayStats();
            }
            requestAnimationFrame(animate);
        }
        
        function setupEvents() {
            canvas.addEventListener('mousedown', onDragStart);
            window.addEventListener('mousemove', onDragMove);
            window.addEventListener('mouseup', onDragEnd);
            canvas.addEventListener('touchstart', onDragStart, {passive:false});
            window.addEventListener('touchmove', onDragMove, {passive:false});
            window.addEventListener('touchend', onDragEnd);
            resetBtn.addEventListener('click', () => { resetSystem(); currentRPM=0; updateDisplayStats(); });
            speedToggleBtn.addEventListener('click', () => {
                if(speedMode === "normal") { speedMode = "fast"; speedFactor = 2.5; speedToggleBtn.innerText = "🐇 FAST"; }
                else { speedMode = "normal"; speedFactor = 1.0; speedToggleBtn.innerText = "🐢 NORMAL"; }
            });
        }
        
        function initGame() {
            initGears();
            defineConnections();
            currentAngles = new Array(gears.length).fill(0);
            resetSystem();
            setupEvents();
            animate();
        }
        
        initGame();
    })();
</script>
</body>
</html>
