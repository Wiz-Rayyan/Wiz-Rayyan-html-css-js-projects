<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>FakeStagram • Instagram UI Clone</title>
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #fafafa;
      color: #262626;
      overflow-x: hidden;
    }

    /* ----- NAVBAR (Instagram style) ----- */
    .navbar {
      position: sticky;
      top: 0;
      background: white;
      border-bottom: 1px solid #dbdbdb;
      padding: 8px 20px;
      z-index: 100;
    }

    .navbar-container {
      max-width: 975px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Inter', cursive;
      font-size: 1.8rem;
      font-weight: 600;
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -1px;
      cursor: pointer;
    }

    .search-box {
      background: #efefef;
      border-radius: 8px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      width: 240px;
    }

    .search-box i {
      color: #8e8e8e;
      font-size: 0.9rem;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      font-size: 0.85rem;
      width: 100%;
    }

    .nav-icons {
      display: flex;
      gap: 22px;
      align-items: center;
    }

    .nav-icons i {
      font-size: 1.5rem;
      cursor: pointer;
    }

    .avatar-small {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-image: url('https://ui-avatars.com/api/?background=833ab4&color=fff&name=ME&size=28');
      background-size: cover;
      cursor: pointer;
    }

    /* ----- MAIN LAYOUT ----- */
    .container {
      max-width: 975px;
      margin: 30px auto 0;
      display: flex;
      gap: 28px;
      padding: 0 20px;
    }

    /* Feed */
    .feed {
      flex: 2;
      max-width: 614px;
    }

    /* Stories row */
    .stories {
      background: white;
      border: 1px solid #dbdbdb;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      gap: 20px;
      overflow-x: auto;
    }

    .story {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      min-width: 66px;
    }

    .story-ring {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f09433, #d62976, #962fbf);
      padding: 2px;
    }

    .story-img {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background-size: cover;
      border: 2px solid white;
    }

    .story span {
      font-size: 0.7rem;
      color: #262626;
    }

    /* Post card */
    .post-card {
      background: white;
      border: 1px solid #dbdbdb;
      border-radius: 12px;
      margin-bottom: 24px;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
    }

    .post-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .post-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-size: cover;
    }

    .post-username {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .post-location {
      font-size: 0.7rem;
      color: #8e8e8e;
    }

    .post-more {
      cursor: pointer;
    }

    .post-image {
      width: 100%;
      max-height: 550px;
      object-fit: cover;
      cursor: pointer;
    }

    .post-actions {
      display: flex;
      justify-content: space-between;
      padding: 8px 16px;
    }

    .left-actions {
      display: flex;
      gap: 18px;
    }

    .left-actions i, .save-icon i {
      font-size: 1.6rem;
      cursor: pointer;
    }

    .likes {
      padding: 0 16px;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }

    .caption {
      padding: 0 16px;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .caption span {
      font-weight: 600;
    }

    .comments {
      padding: 0 16px;
      color: #8e8e8e;
      font-size: 0.8rem;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .timestamp {
      padding: 0 16px 12px;
      color: #8e8e8e;
      font-size: 0.7rem;
      border-bottom: 1px solid #efefef;
    }

    .comment-box {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 12px;
    }

    .comment-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 0.85rem;
    }

    .comment-input::placeholder {
      color: #8e8e8e;
    }

    .post-btn {
      color: #0095f6;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Sidebar */
    .sidebar {
      flex: 1;
      max-width: 320px;
      position: sticky;
      top: 90px;
      height: fit-content;
    }

    .profile-card {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .sidebar-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-size: cover;
    }

    .profile-info h4 {
      font-size: 0.9rem;
    }

    .profile-info p {
      font-size: 0.75rem;
      color: #8e8e8e;
    }

    .suggestions-header {
      display: flex;
      justify-content: space-between;
      margin: 12px 0;
      font-size: 0.85rem;
    }

    .suggestions-header span:first-child {
      color: #8e8e8e;
      font-weight: 500;
    }

    .suggestions-header span:last-child {
      font-weight: 600;
      cursor: pointer;
    }

    .suggestion-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .suggestion-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .suggestion-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-size: cover;
    }

    .suggestion-name {
      font-weight: 600;
      font-size: 0.85rem;
    }

    .suggestion-follow {
      color: #0095f6;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Toast message */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 0.85rem;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }

    @media (max-width: 750px) {
      .sidebar {
        display: none;
      }
      .container {
        justify-content: center;
      }
      .search-box {
        display: none;
      }
    }

    @media (max-width: 500px) {
      .navbar-container {
        gap: 10px;
      }
      .logo {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>

<div class="navbar">
  <div class="navbar-container">
    <div class="logo" id="logoBtn">FakeStagram</div>
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search">
    </div>
    <div class="nav-icons">
      <i class="far fa-compass" id="exploreBtn"></i>
      <i class="far fa-heart" id="notifyBtn"></i>
      <div class="avatar-small" id="profileBtn"></div>
    </div>
  </div>
</div>

<div class="container">
  <!-- MAIN FEED -->
  <div class="feed">
    <!-- Stories -->
    <div class="stories" id="storiesContainer">
      <!-- dynamic stories from JS -->
    </div>

    <!-- Posts container -->
    <div id="postsContainer"></div>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="profile-card">
      <div class="sidebar-avatar" style="background-image: url('https://ui-avatars.com/api/?background=833ab4&color=fff&name=You&size=56');"></div>
      <div class="profile-info">
        <h4>fakedemo_user</h4>
        <p>UI Clone Lover</p>
      </div>
    </div>
    <div class="suggestions-header">
      <span>Suggestions For You</span>
      <span id="seeAllSuggestions">See All</span>
    </div>
    <div id="suggestionsList"></div>
    <div style="margin-top: 24px; font-size: 0.7rem; color: #c7c7c7;">
      © 2025 FakeStagram • UI Demo
    </div>
  </div>
</div>

<div id="toastMsg" class="toast">✨ Demo mode</div>

<script>
  // Fake toast notif
  function showAlert(msg) {
    const toast = document.getElementById('toastMsg');
    toast.textContent = msg || "📱 Instagram clone — fake interaction";
    toast.style.opacity = "1";
    setTimeout(() => toast.style.opacity = "0", 1800);
  }

  // Stories data
  const storiesData = [
    { name: "Your story", img: "https://ui-avatars.com/api/?background=833ab4&color=fff&name=You&size=62" },
    { name: "emmawatson", img: "https://ui-avatars.com/api/?background=d62976&color=fff&name=EW&size=62" },
    { name: "chris.evans", img: "https://ui-avatars.com/api/?background=f09433&color=fff&name=CE&size=62" },
    { name: "zendaya", img: "https://ui-avatars.com/api/?background=962fbf&color=fff&name=ZD&size=62" },
    { name: "therock", img: "https://ui-avatars.com/api/?background=4f5bd5&color=fff&name=TR&size=62" }
  ];

  function renderStories() {
    const container = document.getElementById('storiesContainer');
    if (!container) return;
    container.innerHTML = '';
    storiesData.forEach(story => {
      const storyDiv = document.createElement('div');
      storyDiv.className = 'story';
      storyDiv.innerHTML = `
        <div class="story-ring"><div class="story-img" style="background-image: url('${story.img}');"></div></div>
        <span>${story.name.length > 10 ? story.name.slice(0,10)+'..' : story.name}</span>
      `;
      storyDiv.addEventListener('click', () => showAlert(`📖 Watching ${story.name}'s story (demo mode)`));
      container.appendChild(storyDiv);
    });
  }

  // Posts Data (Instagram-like)
  let posts = [
    {
      id: 1,
      username: "emmawatson",
      userAvatar: "https://ui-avatars.com/api/?background=d62976&color=fff&name=EW&size=40",
      location: "London, UK",
      image: "https://picsum.photos/id/20/600/500",
      caption: "Enjoying the golden hour ✨ #sunset",
      likes: 12453,
      liked: false,
      commentsCount: 342,
      timestamp: "2 HOURS AGO"
    },
    {
      id: 2,
      username: "chris.evans",
      userAvatar: "https://ui-avatars.com/api/?background=f09433&color=fff&name=CE&size=40",
      location: "Boston, MA",
      image: "https://picsum.photos/id/26/600/500",
      caption: "Weekend vibes! 🐶",
      likes: 89234,
      liked: false,
      commentsCount: 1204,
      timestamp: "5 HOURS AGO"
    },
    {
      id: 3,
      username: "zendaya",
      userAvatar: "https://ui-avatars.com/api/?background=962fbf&color=fff&name=ZD&size=40",
      location: "Los Angeles",
      image: "https://picsum.photos/id/30/600/500",
      caption: "New project coming soon 👀",
      likes: 45678,
      liked: false,
      commentsCount: 891,
      timestamp: "YESTERDAY"
    }
  ];

  function renderPosts() {
    const container = document.getElementById('postsContainer');
    if (!container) return;
    container.innerHTML = '';
    posts.forEach(post => {
      const postDiv = document.createElement('div');
      postDiv.className = 'post-card';
      const likeIconClass = post.liked ? 'fas fa-heart' : 'far fa-heart';
      const likeColor = post.liked ? 'red' : '#262626';
      postDiv.innerHTML = `
        <div class="post-header">
          <div class="post-user">
            <div class="post-avatar" style="background-image: url('${post.userAvatar}');"></div>
            <div>
              <div class="post-username">${post.username}</div>
              <div class="post-location">${post.location}</div>
            </div>
          </div>
          <div class="post-more"><i class="fas fa-ellipsis-h"></i></div>
        </div>
        <img class="post-image" src="${post.image}" alt="post">
        <div class="post-actions">
          <div class="left-actions">
            <i class="${likeIconClass} like-btn" data-id="${post.id}" style="color:${likeColor};"></i>
            <i class="far fa-comment comment-btn" data-id="${post.id}"></i>
            <i class="far fa-paper-plane share-btn" data-id="${post.id}"></i>
          </div>
          <div class="save-icon">
            <i class="far fa-bookmark save-post" data-id="${post.id}"></i>
          </div>
        </div>
        <div class="likes" id="likesCount-${post.id}">${post.likes.toLocaleString()} likes</div>
        <div class="caption"><span>${post.username}</span> ${post.caption}</div>
        <div class="comments" data-id="${post.id}">View all ${post.commentsCount} comments</div>
        <div class="timestamp">${post.timestamp}</div>
        <div class="comment-box">
          <input type="text" class="comment-input" placeholder="Add a comment..." id="commentInput-${post.id}">
          <div class="post-btn fake-post-comment" data-id="${post.id}">Post</div>
        </div>
      `;
      container.appendChild(postDiv);
    });

    // Attach like events
    document.querySelectorAll('.like-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = parseInt(btn.getAttribute('data-id'));
        const post = posts.find(p => p.id === id);
        if (post) {
          if (!post.liked) {
            post.likes += 1;
            post.liked = true;
            showAlert(`❤️ Liked ${post.username}'s post`);
          } else {
            post.likes -= 1;
            post.liked = false;
            showAlert(`💔 Unliked`);
          }
          renderPosts();
        }
      });
    });

    // Comment button fake
    document.querySelectorAll('.comment-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = btn.getAttribute('data-id');
        showAlert(`💬 Comment section demo — type something and press Post`);
        document.getElementById(`commentInput-${id}`)?.focus();
      });
    });

    // Share fake
    document.querySelectorAll('.share-btn').forEach(btn => {
      btn.addEventListener('click', () => showAlert(`📤 Shared to story (demo mode)`));
    });

    // Save fake
    document.querySelectorAll('.save-post').forEach(btn => {
      btn.addEventListener('click', () => showAlert(`🔖 Saved to collection (demo)`));
    });

    // View comments demo
    document.querySelectorAll('.comments').forEach(commentDiv => {
      commentDiv.addEventListener('click', () => showAlert(`📝 Showing ${commentDiv.innerText} (demo)`));
    });

    // Post comment simulation
    document.querySelectorAll('.fake-post-comment').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = btn.getAttribute('data-id');
        const input = document.getElementById(`commentInput-${id}`);
        const commentText = input.value.trim();
        if (commentText) {
          showAlert(`💬 Comment posted: "${commentText}" (demo mode)`);
          input.value = '';
        } else {
          showAlert(`✏️ Write a comment first!`);
        }
      });
    });
  }

  // Suggestions
  const suggestions = [
    { name: "alexandria_oc", avatar: "https://ui-avatars.com/api/?background=fd1d1d&color=fff&name=AL&size=36", followed: false },
    { name: "maria_dev", avatar: "https://ui-avatars.com/api/?background=833ab4&color=fff&name=MD&size=36", followed: false },
    { name: "designer_nina", avatar: "https://ui-avatars.com/api/?background=fcb045&color=fff&name=DN&size=36", followed: false }
  ];

  function renderSuggestions() {
    const container = document.getElementById('suggestionsList');
    if (!container) return;
    container.innerHTML = '';
    suggestions.forEach((sug, idx) => {
      const sugDiv = document.createElement('div');
      sugDiv.className = 'suggestion-item';
      sugDiv.innerHTML = `
        <div class="suggestion-user">
          <div class="suggestion-avatar" style="background-image: url('${sug.avatar}');"></div>
          <div class="suggestion-name">${sug.name}</div>
        </div>
        <div class="suggestion-follow" data-sug-idx="${idx}">Follow</div>
      `;
      container.appendChild(sugDiv);
    });

    document.querySelectorAll('.suggestion-follow').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const idx = btn.getAttribute('data-sug-idx');
        if (idx !== null) {
          showAlert(`➕ Followed ${suggestions[idx].name} (demo)`);
          btn.innerText = "Following";
          btn.style.color = "#8e8e8e";
          btn.style.cursor = "default";
        }
      });
    });
  }

  // Fake search
  function handleSearch(query) {
    if (!query.trim()) {
      showAlert(`🔍 Search something (demo)`);
      return;
    }
    const filteredPosts = posts.filter(p => p.username.toLowerCase().includes(query.toLowerCase()) || p.caption.toLowerCase().includes(query.toLowerCase()));
    if (filteredPosts.length > 0) {
      showAlert(`🔎 Found ${filteredPosts.length} posts matching "${query}" (demo)`);
      const container = document.getElementById('postsContainer');
      if (container) {
        const oldPosts = posts;
        posts = filteredPosts;
        renderPosts();
        setTimeout(() => { posts = oldPosts; renderPosts(); }, 3000);
      }
    } else {
      showAlert(`No results for "${query}" — showing feed again`);
    }
  }

  // Bind all UI fake interactions
  function bindGlobalActions() {
    document.getElementById('logoBtn')?.addEventListener('click', () => {
      showAlert(`🏠 Home feed refreshed`);
      renderPosts();
    });
    document.getElementById('exploreBtn')?.addEventListener('click', () => showAlert(`🌍 Explore page (demo mode)`));
    document.getElementById('notifyBtn')?.addEventListener('click', () => showAlert(`🔔 Notifications: you have no new notifications (demo)`));
    document.getElementById('profileBtn')?.addEventListener('click', () => showAlert(`👤 Profile page (UI clone demo)`));
    document.getElementById('seeAllSuggestions')?.addEventListener('click', () => showAlert(`📋 See all suggestions — demo list`));
    
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
      searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSearch(searchInput.value);
      });
    }
  }

  // initial render
  renderStories();
  renderPosts();
  renderSuggestions();
  bindGlobalActions();

  // Add extra hover mimic for image double click like?
  document.addEventListener('dblclick', (e) => {
    if (e.target.classList.contains('post-image')) {
      showAlert(`❤️ Double-tap to like! (demo interaction)`);
    }
  });
</script>
</body>
</html>
